[project]
name = "afchip"
version = "0.1.0"
description = "Hard-wired AF detector from RR intervals: like-for-like baseline comparison"
requires-python = ">=3.12"
dependencies = ["numpy", "wfdb", "scikit-learn", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
