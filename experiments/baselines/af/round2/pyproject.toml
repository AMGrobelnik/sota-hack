[project]
name = "afr2"
version = "0.1.0"
description = "AF detector round two: sequential integer features, nested selection, clocked chip"
requires-python = ">=3.12"
dependencies = ["numpy", "wfdb", "scikit-learn", "afchip"]

[tool.uv.sources]
afchip = { path = "..", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
