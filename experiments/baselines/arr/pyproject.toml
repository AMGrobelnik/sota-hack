[project]
name = "arr-baseline"
version = "0.1.0"
description = "Heartbeat classifier chips on MIT-BIH against a published weightless-network FlexIC"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "wfdb", "scikit-learn"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["arrlib", "designs"]
