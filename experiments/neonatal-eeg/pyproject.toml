[project]
name = "neonatal-eeg"
version = "0.1.0"
description = "Feasibility experiment: tiny integer seizure detectors on open neonatal EEG, compiled by the chip lab"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pyedflib", "torch", "loguru"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neonatal_eeg"]
