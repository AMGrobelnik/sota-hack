# Local API server for the ChipIn dashboards (chipmonk-backend serve).
# Keys and tokens never go here: the session token is generated at start.
# Unknown keys are an error.

port: 8787                # 127.0.0.1 only; --port overrides
keepalive_s: 15           # SSE comment line interval on an idle stream
progress_poll_s: 0.5      # how often progress.jsonl is read for new lines
run_timeout_s: 14400      # wall clock per agent run (4 h); past it the run fails
stub_step_s: 0.4          # pause between the scripted stub agent's steps

# Dashboard preset -> agent effort (claude_cli effort levels).
presets:
  lite: low
  pro: high
  max: xhigh
  ultra: max
