# Local API server for the ChipIn dashboards (chipin-backend serve).
# Keys and tokens never go here: the session token is generated at start.
# Unknown keys are an error.

port: 8797                # 127.0.0.1 only; --port overrides
keepalive_s: 15           # SSE comment line interval on an idle stream
progress_poll_s: 0.5      # how often progress.jsonl is read for new lines
run_timeout_s: 14400      # wall clock per agent run (4 h); past it the run fails
stub_step_s: 0.4          # pause between the stub agent's steps; --stub-step overrides
max_files: 200            # GET /api/runs/{id}/files lists at most this many
file_max_bytes: 524288    # GET /api/runs/{id}/file returns at most this (512 KB)

# Browser origins allowed to call the API (CORS); ":*" means any port.
allowed_origins:
  - https://chipin.space
  - http://127.0.0.1:*
  - http://localhost:*
  - http://[::1]:*

# Public datasets a spec may name (data.mode public): name -> local folder.
# Nothing is set up by default: such a run falls back to synthetic data.
datasets: {}

# Dashboard preset -> agent effort (claude_cli effort levels).
presets:
  lite: low
  pro: high
  max: xhigh
  ultra: max

# Fan-out: the run's agent becomes an orchestrator. In each of reference,
# propose, finetune, compile and verify it runs ONE batch of subagents that
# try different strategies in parallel, waits for all of them and merges the
# best (./subagent in its folder); spec and report are its own. Off by
# default; turn it on per run with POST /api/runs {"fanout": true} or
# `run --fanout`. The preset is the run-size control: it sets the effort
# (presets above) and the batch size (widths below).
fanout:
  enabled: false
  width: null               # batch size for every run; null = the preset's below
  widths:                   # subagents per stage batch, per preset
    lite: 3
    pro: 10
    max: 15                 # ASSUMPTION to confirm: the owner did not name Max
    ultra: 20
  default_width: 3          # a run with no preset
  max_parallel: null        # running at once; null = the batch size (no queue below it)
  max_total: null           # per run; null = five batches (5 x width) + spare_starts
  spare_starts: null        # retries beyond five batches; null = width / 5, at least 2
  usd_per_subagent: 0.05    # API-model budget per allowed start
  max_usd: null             # API-model spend of a run's subagents; null = usd_per_subagent x max_total
  wait_timeout_s: 100       # ./subagent wait default, under the agents' 120 s command limit
  subagent:
    agent: null             # claude | openrouter | stub; null = the orchestrator's
    model: claude-sonnet-5-5  # automatic model of claude subagents (the orchestrator: agents.claude_cli.model)
    openrouter_model: null  # automatic model of openrouter subagents; null = agents.openrouter.model
    provider: null          # openrouter harness only; null = openrouter
    effort: null            # null = the orchestrator's effort (the preset's)
    timeout_s: null         # wall clock per subagent; null = the preset's below
    timeouts:               # higher presets think longer
      lite: 600
      pro: 1200
      max: 1500
      ultra: 1800
    default_timeout_s: 1200 # a run with no preset

# POST /api/transcribe: one spoken phrase to text through OpenRouter
# (needs OPENROUTER_API_KEY). Model names are OpenRouter ids.
transcribe:
  enabled: true
  model: openai/gpt-transcribe          # primary speech-to-text model
  fallback_model: elevenlabs/scribe-v2  # tried once when the primary fails
  language: en              # default when the request has no ?lang=
  max_bytes: 2097152        # 2 MB body cap, enforced while reading (413)
  max_audio_s: 30           # longest phrase accepted (checked for WAV)
  hourly_audio_s: 1800      # audio seconds per rolling hour, then 429
  timeout_s: 30             # per provider call
  silence_rms: 200          # a quieter WAV is silence: empty text, no call
