[project]
name = "chipin-backend"
version = "0.1.0"
description = "ChipIn backend: run AI-scientist agents (Claude CLI, OpenRouter) locally, on a Mac, or on RunPod."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12",       # worker-pod HTTP server and SSE event stream
    "httpx>=0.28",         # OpenRouter and RunPod REST clients
    "jsonschema>=4.25",    # structured-output validation
    "loguru>=0.7.3",
    "pexpect>=4.9",        # drives the interactive claude CLI under a PTY
    "psutil>=7.0",         # process tree clean-up of agent children
    "pydantic>=2.11",      # config schema
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "tenacity>=9.0",       # retries for paid calls and RunPod requests
]

[project.optional-dependencies]
# OpenRouter agent lane (OpenHands Agent SDK over LiteLLM). The two OpenHands
# packages are released in lockstep: raise both or neither. Needs tmux on PATH.
openhands = [
    "openhands-sdk==1.49.2",
    "openhands-tools==1.49.2",
    "litellm>=1.83.7",
]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
]

[project.scripts]
chipin-backend = "chipin_backend.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chipin_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: talks to a real paid service (Claude, OpenRouter, RunPod); opt in with -m live",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["chipin_backend"]
