# Example config for one cheap end-to-end run on this machine:
#
#   python -m chipmonk_backend run --config config/example.yaml \
#       --prompt-file examples/seizure_eeg_prompt.md
#
# This file is overlaid on backend.yaml (deep-merged), so it holds only the
# values that differ; see backend.yaml for every key. No key goes in YAML: OPENROUTER_API_KEY is read
# from the environment (or backend/.env, or --env-file) by NAME.

runs_dir: runs
log_dir: logs

llm:
  default_model: openai/gpt-5-nano
  presets:
    cheap: openai/gpt-5-nano
    fast: deepseek/deepseek-v4-flash-0731

agents:
  default_backend: claude_cli     # the claude CLI on this machine's own Claude login
  openrouter_tool: true           # the agent may ask OpenRouter models via `ask`
  claude_cli:
    model: sonnet
    effort: low
    turn_timeout_s: 900
    stall_timeout_s: 300

compute:
  run_mode: local                 # local | flex (a team Mac) | on_demand (RunPod)
  tier: cpu_basic
