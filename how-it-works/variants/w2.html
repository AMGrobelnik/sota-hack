td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; font-size: 15px; color: var(--soft); line-height: 1.4; }

td.n { color: var(--mute); font-variant-numeric: tabular-nums; width: 28px; font-weight: 600; }

/* step 1 */
.flow { display: grid; grid-template-columns: 1.5fr auto 1fr auto 1fr; align-items: stretch; gap: 0; margin: 0 0 26px; }
.fbox { border: 1px solid rgba(214, 228, 242, .24); border-radius: 12px; padding: 12px 16px; background: var(--panel); }
.fbox b { display: block; color: #fff; font-weight: 650; font-size: 15.5px; }
.fbox span { display: block; font-size: 14.5px; color: var(--soft); }
.fbox.end { border-color: var(--signal); }
.farr { width: 44px; align-self: center; }
.farr svg { display: block; width: 44px; height: 14px; }
.farr path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.g2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: clamp(24px, 3.4vw, 56px); align-items: start; }
.g2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.g2.chk { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
.qs td { padding: 7px 14px 7px 0; font-size: 14.5px; }
.card { margin-top: 26px; border: 1px solid rgba(214, 228, 242, .24); border-radius: 12px; padding: 14px 16px; background: var(--panel); }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 14.5px; }
.card dt { color: #fff; font-weight: 600; }
.card dd { margin: 0; color: var(--mute); }
.warn { display: flex; gap: 10px; margin: 12px 0 0; padding: 9px 12px; border-radius: 8px; border: 1px solid rgba(255, 184, 107, .45); font-size: 14px; color: #f3dcc0; line-height: 1.4; }
.warn svg { flex: none; width: 18px; height: 18px; margin-top: 1px; }

/* step 2 */
.panel { border: 1px solid rgba(214, 228, 242, .24); border-radius: 14px; padding: 18px 20px; background: var(--panel); }
.opt { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
.opt:first-of-type { border-top: 0; }
.radio { flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--mute); position: relative; }
.radio.on { border-color: var(--signal); }
.radio.on::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--signal); }
.opt b { display: block; color: #fff; font-weight: 600; }
.opt span { color: var(--soft); font-size: 15px; }
.sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
.sizes figure { margin: 0; border: 1px solid var(--rule); border-radius: 10px; padding: 10px 10px 8px; }
.sizes figcaption { font-size: 14px; color: #fff; font-weight: 600; margin-bottom: 4px; }
.sizes svg { display: block; width: 100%; height: auto; }
.note { font-size: 14px; color: var(--mute); margin: 12px 0 0; }

/* diagrams (svg) */
.dg { display: block; width: 100%; height: auto; overflow: visible; }
.dg text { font-family: var(--f); fill: #dbe5ef; }
.dg .t-b { font-weight: 650; fill: #fff; }
.dg .t-m { fill: var(--mute); }
.dg .t-g { fill: var(--signal); font-weight: 650; }
.dg .bx { fill: var(--panel); stroke: rgba(214, 228, 242, .3); stroke-width: 1.2; }
.dg .bx-o { fill: #1a2c45; stroke: rgba(214, 228, 242, .45); stroke-width: 1.2; }
.dg .bx-g { fill: #133a2b; stroke: var(--signal); stroke-width: 1.5; }
.dg .pill { fill: none; stroke: rgba(214, 228, 242, .3); stroke-width: 1; stroke-dasharray: 3 3; }
.dg .ln { fill: none; stroke: var(--line); stroke-width: 1.4; }
.dg .ln-g { fill: none; stroke: var(--signal); stroke-width: 1.5; }
.dg .sq { fill: rgba(214, 228, 242, .35); }
.dg .ah { fill: var(--line); }
.dg .ah-g { fill: var(--signal); }
.pipe-n { display: none; }

/* stage zoom */
.zoom { position: relative; border: 1px solid var(--line); border-radius: 16px; padding: 18px 22px 20px; margin-top: 6px; }
.zoom::before { content: ""; position: absolute; top: -8px; left: calc((var(--i) + .5) / 7 * 100% - 8px); width: 14px; height: 14px; background: var(--night); border-left: 1px solid var(--line); border-top: 1px solid var(--line); transform: rotate(45deg); }
.zhd { display: flex; align-items: baseline; gap: 14px; margin: 0 0 4px; }
.zhd .of { font-size: 14px; color: var(--signal); font-weight: 650; white-space: nowrap; }
.does { margin: 0 0 14px; min-height: 2.84em; font-size: clamp(16px, 1.25vw, 18.5px); color: var(--soft); max-width: 82ch; line-height: 1.42; }
.zg { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(22px, 3vw, 48px); align-items: start; }
.fan-n { display: none; }
.zr h3 { font-size: 14.5px; color: var(--mute); font-weight: 600; margin: 0 0 6px; }
.zr p { margin: 0 0 16px; font-size: 15.5px; color: var(--soft); line-height: 1.42; }
.zr .outp { color: #fff; font-weight: 600; }
.sk { list-style: none; margin: 0 0 16px; padding: 0; }
.sk li { display: grid; grid-template-columns: 11.5em minmax(0, 1fr); gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 14.5px; color: var(--soft); line-height: 1.35; }
.sk li:first-child { border-top: 1px solid var(--rule); }

/* step 11 */
.agents { display: grid; grid-template-columns: minmax(0, 1fr) 120px minmax(0, 1fr); gap: 0; align-items: stretch; }
.stack h3 { font-size: 17px; margin-bottom: 10px; }
.layer { display: grid; grid-template-columns: 28px 9.5em minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid rgba(214, 228, 242, .24); background: var(--panel); border-radius: 10px; margin-bottom: 8px; font-size: 15px; color: var(--soft); line-height: 1.4; }
.layer .lt { color: var(--signal); font-weight: 700; }
.layer b { color: #fff; font-weight: 600; }
.mid { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; padding-top: 30px; }
.mid svg { width: 96px; height: 34px; display: block; overflow: visible; }
.mid span { display: block; text-align: center; font-size: 13px; color: var(--mute); }
.keyline { margin: 18px 0 0; padding: 14px 18px; border-left: 3px solid var(--signal); background: var(--panel); border-radius: 0 10px 10px 0; font-size: clamp(16px, 1.3vw, 19px); color: #fff; font-weight: 600; max-width: 90ch; line-height: 1.42; }

/* step 12 */
.tt { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; align-items: start; }
.tt table { table-layout: fixed; }
.tt th, .tt td { padding: 3px 10px 3px 0; font-size: 13.5px; line-height: 1.3; }
.tt th { padding-bottom: 6px; }
.tt td.grp { color: #fff; font-weight: 600; font-size: 13px; border-right: 1px solid var(--rule); padding-top: 5px; }
.tt td.tl { padding-left: 10px; }
.tt td.stg { color: var(--mute); font-size: 12.5px; }
.tt tr.gs td { border-top: 1px solid var(--line); }
.tt .c-g { width: 86px; } .tt .c-t { width: 166px; } .tt .c-s { width: 100px; }

/* step 13 */
.mk { list-style: none; margin: 0; padding: 0; }
.mk li { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.mk li:first-child { border-top: 1px solid var(--rule); }
.mk .ex { font-size: 20px; font-weight: 650; color: #fff; letter-spacing: -.02em; }
.mk .tag { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 1px 8px; margin: 0 0 4px; }
.mk .tag.est { color: var(--amber); border: 1px solid rgba(255, 184, 107, .55); }
.mk .tag.sim { color: var(--dusk); border: 1px solid rgba(201, 163, 196, .55); }
.mk b { display: block; color: #fff; font-weight: 600; }
.mk span.d { color: var(--soft); font-size: 15px; }

/* step 14 */
.ms td { font-size: 15.5px; padding: 13px 18px 13px 0; }
.ms td.fig { color: #fff; font-weight: 650; font-size: clamp(20px, 1.8vw, 26px); letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
.ms td.sc { color: var(--mute); width: 30%; }

/* step 15 */
.lim { list-style: none; margin: 0 0 40px; padding: 0; max-width: 70ch; counter-reset: l; }
.lim li { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: clamp(17px, 1.4vw, 21px); color: #fff; }
.lim li:first-child { border-top: 1px solid var(--rule); }
.lim li::before { counter-increment: l; content: counter(l); color: var(--mute); font-weight: 600; min-width: 1.2em; }
.endl { display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; margin: 0 0 40px; }
.endl a { font-weight: 650; text-underline-offset: 5px; }
.endl a.btn { background: var(--signal); color: #062418; border-radius: 10px; padding: 12px 22px; text-decoration: none; }
.foot { margin: 0; font-size: 14px; color: var(--mute); }

@media (max-height: 820px) and (min-width: 900px) {
  :root { --stripH: 104px; }
  .lines { margin-bottom: 16px; }
  .flow { margin-bottom: 16px; }
}
@media (max-width: 1080px) {
  .g2, .g2.even, .g2.chk, .zg { grid-template-columns: minmax(0, 1fr); }
  .agents { grid-template-columns: minmax(0, 1fr); }
  .mid { flex-direction: row; padding: 4px 0 12px; }
  .tt { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  :root { --topH: 52px; --indH: 40px; --stripH: 88px; }
  body { font-size: 16px; }
  .brand span { display: none; }
  .nav .btn { padding: 7px 11px; font-size: 14px; }
  .nav a { font-size: 14px; }
  .ticks { display: none; }
  .s-chip { padding: 0 2px; }
  .s-hl { padding: 0 2px; }
  .s-chip .bx { font-size: 0; height: 30px; }
  .s-hl { height: 30px; }
  .s-chip .bx em { font-size: 13px; }
  .s-chip:not(:last-child)::after { display: none; }
  .s-cur { display: block !important; }
  .s-fan { width: 40px; height: 12px; }
  .flow { grid-template-columns: minmax(0, 1fr); }
  .farr { width: auto; justify-self: center; transform: rotate(90deg); height: 30px; display: grid; place-items: center; }
  .pipe-w, .fan-w { display: none; }
  .pipe-n, .fan-n { display: block; }
  .sizes { grid-template-columns: minmax(0, 1fr); }
  .layer { grid-template-columns: 22px minmax(0, 1fr); }
  .layer .ld { grid-column: 2; }
  .sk li { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .tt .c-g { width: 70px; } .tt .c-t { width: 118px; } .tt .c-s { width: 64px; }
  .tt th, .tt td { font-size: 12px; }
  .tt td.grp { font-size: 11.5px; }
  .mk li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .ms tr { display: grid; grid-template-columns: minmax(0, 1fr); padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .ms thead { display: none; }
  .ms td, .ms td.sc, .ms td.fig { width: auto; border: 0; padding: 2px 0; white-space: normal; }
  .zoom { padding: 14px 12px 16px; }
}
.s-cur { display: none; font-size: 13px; color: #fff; font-weight: 600; text-align: center; margin-top: 2px; }
@media (prefers-reduced-motion: reduce) {
  .s-hl { transition: none; }
  html { scroll-behavior: auto; }
}
@media (min-width: 900px) and (min-height: 700px) {
  html { scroll-snap-type: y proximity; }
  .step { scroll-snap-align: start; }
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" id="brand" href="../../"><b></b><span></span></a>
  <nav class="nav" id="nav"></nav>
</header>
<div class="pin" id="pin">
  <div class="pin-in">
    <nav class="ind" id="ind"><p class="ind-t" id="ind-t" aria-live="polite"></p><ol class="ticks" id="ticks"></ol></nav>
    <nav class="strip" id="strip"></nav>
  </div>
</div>
<main id="steps"></main>
<noscript><p style="padding:120px 24px">This page needs JavaScript to draw its diagrams.</p></noscript>
<script>
(function () {
  'use strict';
  var C = window.COPY;
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function txt(x, y, lines, cls, size, anchor, lh) {
    lines = (Array.isArray(lines) ? lines : [lines]).filter(function (l) { return l !== ''; });
    lh = lh || size * 1.3;
    var y0 = y - (lines.length - 1) * lh / 2;
    return lines.map(function (l, i) {
      return '<text x="' + x + '" y="' + (y0 + i * lh) + '" dominant-baseline="middle" text-anchor="' + (anchor || 'middle') + '" font-size="' + size + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(l) + '</text>';
    }).join('');
  }
  function wrap(s, max) { var out = [], line = ''; s.split(' ').forEach(function (w) { if (line && (line + ' ' + w).length > max) { out.push(line); line = w; } else line = line ? line + ' ' + w : w; }); if (line) out.push(line); return out; }
  function arrowDown(x, y, cls) { return '<path class="' + (cls || 'ah') + '" d="M' + (x - 4.5) + ' ' + (y - 7) + 'L' + (x + 4.5) + ' ' + (y - 7) + 'L' + x + ' ' + y + 'Z"/>'; }
  function arrowRight(x, y) { return '<path class="ah" d="M' + (x - 7) + ' ' + (y - 4.5) + 'L' + (x - 7) + ' ' + (y + 4.5) + 'L' + x + ' ' + y + 'Z"/>'; }

  // tool lookup, from the single table in COPY.skills
  var TOOLS = {}, toolCount = 0;
  C.skills.groups.forEach(function (g) { g.tools.forEach(function (t) { TOOLS[t[0]] = t[1]; toolCount++; }); });

  // the step list: 1-3, seven stage zooms, 11-15
  var steps = [
    { id: 'idea', nav: C.idea.nav, draw: drawIdea },
    { id: 'models', nav: C.models.nav, draw: drawModels },
    { id: 'pipeline', nav: C.pipe.nav, draw: drawPipe }
  ];
  C.stages.forEach(function (s, i) { steps.push({ id: 'stage-' + s.key, nav: C.stageWord + ': ' + s.name, stage: i, draw: function () { return drawZoom(s, i); } }); });
  steps.push({ id: 'agent', nav: C.agent.nav, draw: drawAgent }, { id: 'skills', nav: C.skills.nav, draw: drawSkills }, { id: 'checks', nav: C.checks.nav, draw: drawChecks }, { id: 'measured', nav: C.measured.nav, draw: drawMeasured }, { id: 'limits', nav: C.limits.nav, draw: drawLimits });
  var N = steps.length;

  function head(n, title, tag) {
    return '<div class="hd"><span class="num" aria-hidden="true">' + n + '</span><' + (tag || 'h2') + ' id="h-' + n + '">' + esc(title) + '</' + (tag || 'h2') + '></div>';
  }
  function lines(arr) { return '<div class="lines">' + arr.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div>'; }

  /* ---------- step 1 ---------- */
  function drawIdea(n) {
    var I = C.idea, arr = '<div class="farr" aria-hidden="true"><svg viewBox="0 0 44 14"><path d="M4 7h32"/><path class="ah" style="fill:rgba(214,228,242,.34);stroke:none" d="M34 2.5L41 7L34 11.5Z"/></svg></div>';
    var flow = '<div class="flow">' + I.flow.map(function (f, i) { return (i ? arr : '') + '<div class="fbox' + (i === 2 ? ' end' : '') + '"><b>' + esc(f.h) + '</b><span>' + esc(f.t) + '</span></div>'; }).join('') + '</div>';
    var q = '<table class="qs"><thead><tr>' + I.qHead.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      I.questions.map(function (r, i) { return '<tr><td class="n">' + (i + 1) + '</td><td class="k">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>';
    var t = '<h3>' + esc(I.targetsTitle) + '</h3><table><thead><tr>' + I.targetsHead.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      I.targets.map(function (r) { return '<tr><td class="k">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>';
    var card = '<div class="card"><h3>' + esc(I.cardTitle) + '</h3><dl>' + I.card.map(function (c) { return '<dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1]) + '</dd>'; }).join('') + '</dl>' +
      '<p class="warn"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 17 16H1Z" fill="none" stroke="#ffb86b" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 7v4M9 13v.5" stroke="#ffb86b" stroke-width="1.6" stroke-linecap="round"/></svg><span>' + esc(I.cardWarn) + '</span></p></div>';
    return '<p class="intro">' + esc(I.intro) + '</p>' + head(n, I.title, 'h1') + lines(I.lines) + flow + '<div class="g2"><div>' + q + '</div><div>' + t + card + '</div></div>';
  }

  /* ---------- step 2 ---------- */
  function miniFan(k) {
    // one stage with k subagents and k*3 candidate squares
    var W = 260, H = 110, cx = W / 2, s = '<svg class="dg" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">';
    s += '<rect class="bx-o" x="' + (cx - 40) + '" y="2" width="80" height="24" rx="6"/>';
    var gap = (W - 20) / k;
    for (var i = 0; i < k; i++) {
      var x = 10 + gap * i + gap / 2;
      s += '<path class="ln" d="M' + cx + ' 26L' + x + ' 52"/>';
      s += '<rect class="bx" x="' + (x - Math.min(14, gap / 2 - 3)) + '" y="52" width="' + Math.min(28, gap - 6) + '" height="16" rx="3"/>';
      for (var j = 0; j < 3; j++) s += '<rect class="sq" x="' + (x - 3) + '" y="' + (76 + j * 10) + '" width="6" height="6" rx="1"/>';
    }
    return s + '</svg>';
  }
  function drawModels(n) {
    var M = C.models;
    var a = '<div class="panel"><h3>' + esc(M.llmTitle) + '</h3>' + M.llm.map(function (o) { return '<div class="opt"><span class="radio' + (o.on ? ' on' : '') + '" aria-hidden="true"></span><div><b>' + esc(o.h) + '</b><span>' + esc(o.t) + '</span></div></div>'; }).join('') + '</div>';
    var b = '<div class="panel"><h3>' + esc(M.sizeTitle) + '</h3><table><tbody>' + M.sizeRows.map(function (r) { return '<tr><td class="k">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>' +
      '<div class="sizes"><figure><figcaption>' + esc(M.smaller) + '</figcaption>' + miniFan(2) + '</figure><figure><figcaption>' + esc(M.larger) + '</figcaption>' + miniFan(8) + '</figure></div><p class="note">' + esc(M.sizeNote) + '</p></div>';
    return head(n, M.title) + lines(M.lines) + '<div class="g2 even">' + a + b + '</div>';
  }

  /* ---------- step 3 ---------- */
  function pipeWide() {
    var P = C.pipe, W = 1200, bw = 140, g = (W - 7 * bw) / 6, s = '<svg class="dg pipe-w" viewBox="0 0 ' + W + ' 380" role="img" aria-label="' + esc(P.title) + '">';
    s += '<rect class="bx-o" x="0" y="0" width="' + W + '" height="56" rx="10"/>' + txt(W / 2, 20, P.orch, 't-b', 18) + txt(W / 2, 40, P.orchSub, 't-m', 14);
    C.stages.forEach(function (st, i) {
      var x = i * (bw + g), cx = x + bw / 2;
      s += '<path class="ln" d="M' + cx + ' 56V118"/>' + arrowDown(cx, 126);
      s += '<rect class="bx" x="' + x + '" y="126" width="' + bw + '" height="58" rx="9"/>' + txt(cx, 146, String(i + 1), 't-g', 13) + txt(cx, 166, st.name, 't-b', 17);
      if (i < 6) s += '<path class="ln" d="M' + (x + bw) + ' 155H' + (x + bw + g - 2) + '"/>' + arrowRight(x + bw + g, 155);
      [-48, -16, 16, 48].forEach(function (o) { s += '<path class="ln" d="M' + cx + ' 184L' + (cx + o) + ' 232"/><rect class="sq" x="' + (cx + o - 12) + '" y="232" width="24" height="16" rx="3"/>'; });
      s += txt(cx, 266, P.fanLabel, 't-m', 13) + txt(cx, 316, P.outs[i], '', 15, 'middle', 19);
      s += '<path class="ln" d="M' + (x + 8) + ' 290H' + (x + bw - 8) + '" style="stroke-dasharray:3 4"/>';
    });
    return s + '</svg>';
  }
  function pipeNarrow() {
    var P = C.pipe, W = 360, rh = 74, top = 58, H = top + 7 * rh, s = '<svg class="dg pipe-n" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(P.title) + '">';
    s += '<rect class="bx-o" x="0" y="0" width="' + W + '" height="46" rx="9"/>' + txt(W / 2, 23, P.orch, 't-b', 16);
    s += '<path class="ln" d="M14 46V' + (H - 30) + '"/>';
    C.stages.forEach(function (st, i) {
      var y = top + i * rh;
      s += '<path class="ln" d="M14 ' + (y + 22) + 'H34"/>' + '<rect class="bx" x="36" y="' + y + '" width="130" height="44" rx="8"/>' + txt(52, y + 22, String(i + 1), 't-g', 13, 'middle') + txt(66, y + 22, st.name, 't-b', 15, 'start');
      [-14, -5, 5, 14].forEach(function (o) { s += '<path class="ln" d="M166 ' + (y + 22) + 'L190 ' + (y + 22 + o) + '"/><rect class="sq" x="190" y="' + (y + 19 + o) + '" width="10" height="6" rx="1"/>'; });
      s += txt(212, y + 22, P.outs[i], '', 13, 'start', 16);
      if (i < 6) s += '<path class="ln" d="M101 ' + (y + 44) + 'V' + (y + rh - 2) + '"/>' + arrowDown(101, y + rh);
    });
    return s + '</svg>';
  }
  function drawPipe(n) { return head(n, C.pipe.title) + lines(C.pipe.lines) + pipeWide() + pipeNarrow(); }

  /* ---------- steps 4 to 10: the stage zoom, one layout ---------- */
  function fanSVG(st, cols, cls) {
    var L = C.zoomLabels, bw = cols === 4 ? 140 : 156, gap = cols === 4 ? 20 : 24, W = cols * bw + (cols - 1) * gap, rows = Math.ceil(st.subs.length / cols);
    var oy = 0, oh = 50, busY = 74, rowH = 132, y0 = 92;
    var pickY = y0 + rows * rowH + 22, pickLines = cols === 4 ? st.pick : wrap(st.pick.join(' '), 44), pickH = 34 + pickLines.length * 16, nextY = pickY + pickH + 30, H = nextY + 34, cx = W / 2;
    var s = '<svg class="dg ' + cls + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(st.name + ': ' + st.tries) + '">';
    s += '<rect class="bx-o" x="' + (cx - 120) + '" y="' + oy + '" width="240" height="' + oh + '" rx="9"/>' + txt(cx, 17, L.orch, 't-b', 15) + txt(cx, 35, L.orchSub, 't-m', 13);
    var xs = [];
    st.subs.forEach(function (sub, i) {
      var c = i % cols, r = Math.floor(i / cols), x = c * (bw + gap), y = y0 + r * rowH, bx = x + bw / 2;
      xs.push({ x: bx, y: y, c: c, r: r, x0: x });
      s += '<rect class="bx" x="' + x + '" y="' + y + '" width="' + bw + '" height="58" rx="8"/>' + txt(bx, y + 29, sub, '', 14, 'middle', 18);
      s += '<path class="ln" d="M' + bx + ' ' + (y + 58) + 'V' + (y + 74) + '"/>' + arrowDown(bx, y + 80);
      s += '<rect class="pill" x="' + (x + 6) + '" y="' + (y + 80) + '" width="' + (bw - 12) + '" height="40" rx="6"/>' + txt(bx, y + 100, st.res[i], 't-m', 12.5, 'middle', 15.5);
    });
    if (cols === 4) {
      s += '<path class="ln" d="M' + cx + ' ' + oh + 'V' + busY + 'M' + xs[0].x + ' ' + busY + 'H' + xs[xs.length - 1].x + '"/>';
      xs.forEach(function (p) { s += '<path class="ln" d="M' + p.x + ' ' + busY + 'V' + (p.y - 8) + '"/>' + arrowDown(p.x, p.y); });
      var by = y0 + rowH + 4;
      s += '<path class="ln" d="M' + xs[0].x + ' ' + (by - 4) + 'V' + by + 'H' + xs[xs.length - 1].x + 'V' + (by - 4) + '"/>';
      xs.forEach(function (p) { s += '<path class="ln" d="M' + p.x + ' ' + (p.y + 120) + 'V' + by + '"/>'; });
      s += '<path class="ln-g" d="M' + cx + ' ' + by + 'V' + (pickY - 8) + '"/>' + arrowDown(cx, pickY, 'ah-g');
    } else {
      // two columns: a trunk runs down the middle gap
      s += '<path class="ln" d="M' + cx + ' ' + oh + 'V' + (pickY - 8) + '"/>' + arrowDown(cx, pickY, 'ah-g');
      xs.forEach(function (p) {
        var edge = p.c === 0 ? p.x0 + bw : p.x0;
        s += '<path class="ln" d="M' + cx + ' ' + (p.y + 29) + 'H' + edge + '"/>';
        s += '<path class="ln" d="M' + cx + ' ' + (p.y + 100) + 'H' + (p.c === 0 ? p.x0 + bw - 6 : p.x0 + 6) + '"/>';
      });
    }
    s += '<rect class="bx-g" x="0" y="' + pickY + '" width="' + W + '" height="' + pickH + '" rx="9"/>' + txt(16, pickY + 18, L.picks, 't-g', 13, 'start');
    s += txt(16, pickY + 26 + pickLines.length * 8.5 + 4, pickLines, '', cols === 4 ? 14.5 : 12.5, 'start', 17);
    s += '<path class="ln" d="M' + cx + ' ' + (pickY + pickH) + 'V' + (nextY - 8) + '"/>' + arrowDown(cx, nextY);
    s += '<rect class="bx" x="' + (cx - 90) + '" y="' + nextY + '" width="180" height="32" rx="8"/>' + txt(cx, nextY + 16, st.next, 't-b', 14);
    return s + '</svg>';
  }
  function drawZoom(st, i) {
    var L = C.zoomLabels;
    var sk = '<ul class="sk">' + st.skills.map(function (t) { return '<li><span class="tool">' + esc(t) + '</span><span>' + esc(TOOLS[t] || '') + '</span></li>'; }).join('') + '</ul>';
    return '<div class="zoom" style="--i:' + i + '">' +
      '<div class="zhd"><span class="of">' + esc(C.stageWord + ' ' + (i + 1) + ' ' + C.indicator.of + ' 7') + '</span><h2 id="h-st-' + i + '">' + esc(st.name) + '</h2></div>' +
      '<p class="does">' + esc(st.does) + '</p>' +
      '<div class="zg"><div>' + fanSVG(st, 4, 'fan-w') + fanSVG(st, 2, 'fan-n') + '</div>' +
      '<div class="zr"><h3>' + esc(L.tries) + '</h3><p>' + esc(st.tries) + '</p><h3>' + esc(L.skills) + '</h3>' + sk + '<h3>' + esc(L.back) + '</h3><p class="outp">' + esc(st.out) + '</p></div></div></div>';
  }

  /* ---------- step 11 ---------- */
  function drawAgent(n) {
    var A = C.agent;
    function stack(c) { return '<div class="stack"><h3>' + esc(c.h) + '</h3>' + c.layers.map(function (l, i) { return '<div class="layer"><span class="lt">' + A.layerTags[i] + '</span><b>' + esc(l[0]) + '</b><span class="ld">' + esc(l[1]) + '</span></div>'; }).join('') + '</div>'; }
    var mid = '<div class="mid" aria-hidden="true"><div><svg viewBox="0 0 96 34"><path class="ln" d="M6 17H84" style="fill:none;stroke:rgba(214,228,242,.5);stroke-width:1.4"/><path d="M83 12L92 17L83 22Z" fill="rgba(214,228,242,.5)"/></svg><span>' + esc(A.brief) + '</span></div>' +
      '<div><svg viewBox="0 0 96 34"><path d="M12 17H90" style="fill:none;stroke:#5be49b;stroke-width:1.4"/><path d="M13 12L4 17L13 22Z" fill="#5be49b"/></svg><span>' + esc(A.result) + '</span></div></div>';
    return head(n, A.title) + lines(A.lines) + '<div class="agents">' + stack(A.cols[0]) + mid + stack(A.cols[1]) + '</div><p class="keyline">' + esc(A.key) + '</p>';
  }

  /* ---------- step 12 ---------- */
  function drawSkills(n) {
    var S = C.skills, halves = [S.groups.slice(0, 3), S.groups.slice(3)];
    function tbl(groups) {
      var h = '<table><colgroup><col class="c-g"><col class="c-t"><col><col class="c-s"></colgroup><thead><tr>' + S.head.map(function (x) { return '<th scope="col">' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>';
      groups.forEach(function (g) {
        g.tools.forEach(function (t, i) {
          h += '<tr' + (i === 0 ? ' class="gs"' : '') + '>' + (i === 0 ? '<td class="grp" rowspan="' + g.tools.length + '">' + esc(g.g) + '</td>' : '') +
            '<td class="tl"><span class="tool">' + esc(t[0]) + '</span></td><td>' + esc(t[1]) + '</td><td class="stg">' + esc(t[2]) + '</td></tr>';
        });
      });
      return h + '</tbody></table>';
    }
    return head(n, S.title) + lines([S.linePre + toolCount + S.linePost]) + '<div class="tt">' + tbl(halves[0]) + tbl(halves[1]) + '</div>';
  }

  /* ---------- step 13 ---------- */
  function drawChecks(n) {
    var K = C.checks;
    var lv = '<h3>' + esc(K.levelsTitle) + '</h3><table><thead><tr>' + K.levelsHead.map(function (x) { return '<th scope="col">' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      K.levels.map(function (r) { return '<tr><td class="n">' + r[0] + '</td><td class="k">' + esc(r[1]) + '</td><td>' + (r[2] ? '<span class="tool">' + esc(r[2]) + '</span>' : '') + '</td></tr>'; }).join('') + '</tbody></table><p class="note">' + esc(K.levelsNote) + '</p>';
    var mk = '<h3>' + esc(K.marksTitle) + '</h3><ul class="mk">' + K.marks.map(function (m) {
      return '<li><div>' + (m.tag ? '<span class="tag ' + m.k + '">' + esc(m.tag) + '</span>' : '') + '<div class="ex">' + esc(m.ex) + '</div></div><div><b>' + esc(m.h) + '</b><span class="d">' + esc(m.t) + '</span></div></li>';
    }).join('') + '</ul>';
    return head(n, K.title) + lines(K.lines) + '<div class="g2 chk"><div>' + lv + '</div><div>' + mk + '</div></div>';
  }

  /* ---------- step 14 ---------- */
  function drawMeasured(n) {
    var M = C.measured;
    return head(n, M.title) + lines(M.lines) + '<table class="ms"><thead><tr>' + M.head.map(function (x) { return '<th scope="col">' + esc(x) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      M.rows.map(function (r) { return '<tr><td class="fig">' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td class="sc">' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table>';
  }

  /* ---------- step 15 ---------- */
  function drawLimits(n) {
    var L = C.limits;
    return head(n, L.title) + '<ul class="lim">' + L.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<p class="endl"><a class="btn" href="' + esc(C.nav.dashHref) + '">' + esc(C.nav.dash) + '</a><a href="' + esc(C.nav.homeHref) + '">' + esc(C.nav.home) + '</a></p><p class="foot">' + esc(C.footer) + '</p>';
  }

  /* ---------- build ---------- */
  document.title = C.docTitle;
  var brand = document.getElementById('brand');
  brand.href = C.nav.homeHref; brand.querySelector('b').textContent = C.brand; brand.querySelector('span').textContent = C.pageName;
  document.getElementById('nav').innerHTML = '<a href="' + esc(C.nav.homeHref) + '">' + esc(C.nav.home) + '</a><a class="btn" href="' + esc(C.nav.dashHref) + '">' + esc(C.nav.dash) + '</a>';
  document.getElementById('ind').setAttribute('aria-label', C.indicator.aria);

  var main = document.getElementById('steps');
  main.innerHTML = steps.map(function (s, i) {
    return '<section class="step' + (s.stage !== undefined ? ' st' : '') + '" id="' + s.id + '" aria-label="' + esc(s.nav) + '"><div class="wrap">' + s.draw(i + 1) + '</div></section>';
  }).join('');
  // stage zooms carry the step number in their header line too
  document.getElementById('ticks').innerHTML = steps.map(function (s, i) {
    return '<li><a href="#' + s.id + '"' + (s.stage !== undefined ? ' class="st"' : '') + ' aria-label="' + esc(C.indicator.step + ' ' + (i + 1) + ': ' + s.nav) + '"></a></li>';
  }).join('');
  var strip = document.getElementById('strip');
  strip.setAttribute('aria-label', C.stripAria);
  strip.innerHTML = '<div class="s-orch"><b>' + esc(C.pipe.orch) + '</b><i></i></div><div class="s-row"><span class="s-hl" id="s-hl"></span>' +
    C.stages.map(function (st, i) {
      return '<a class="s-chip" href="#stage-' + st.key + '"><span class="bx"><em>' + (i + 1) + '</em>' + esc(st.name) + '</span><svg class="s-fan" viewBox="0 0 64 18" aria-hidden="true"><path d="M32 0L8 12M32 0L24 12M32 0L40 12M32 0L56 12"/><rect x="4" y="12" width="8" height="5" rx="1"/><rect x="20" y="12" width="8" height="5" rx="1"/><rect x="36" y="12" width="8" height="5" rx="1"/><rect x="52" y="12" width="8" height="5" rx="1"/></svg></a>';
    }).join('') + '</div><p class="s-cur" id="s-cur"></p>';

  /* ---------- where you are ---------- */
  var secs = Array.prototype.slice.call(main.children), pin = document.getElementById('pin'), indT = document.getElementById('ind-t');
  var ticks = Array.prototype.slice.call(document.querySelectorAll('#ticks a')), chips = Array.prototype.slice.call(strip.querySelectorAll('.s-chip'));
  var hl = document.getElementById('s-hl'), sCur = document.getElementById('s-cur'), cur = -1;
  function currentIndex(frac) {
    var y = window.scrollY + window.innerHeight * frac + 2, k = 0;
    for (var i = 0; i < secs.length; i++) if (secs[i].offsetTop <= y) k = i;
    return k;
  }
  function update() {
    var k = currentIndex(0.4);
    if (k === cur) return;
    cur = k;
    var s = steps[k];
    ticks.forEach(function (t, i) { if (i === k) t.setAttribute('aria-current', 'step'); else t.removeAttribute('aria-current'); });
    indT.innerHTML = esc(C.indicator.step + ' ' + (k + 1) + ' ' + C.indicator.of + ' ' + N) + '&ensp;<b>' + esc(s.nav) + '</b>';
    var isStage = s.stage !== undefined;
    pin.classList.toggle('is-strip', isStage);
    if (isStage) {
      chips.forEach(function (c, i) { if (i === s.stage) c.setAttribute('aria-current', 'step'); else c.removeAttribute('aria-current'); });
      hl.style.transform = 'translateX(' + (s.stage * 100) + '%)';
      sCur.textContent = C.stages[s.stage].name;
    }
  }
  var raf = 0;
  window.addEventListener('scroll', function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; update(); }); }, { passive: true });
  window.addEventListener('resize', function () { cur = -1; update(); });
  update();

  /* ---------- keyboard: one step per key press ---------- */
  function go(k) {
    k = Math.max(0, Math.min(N - 1, k));
    window.scrollTo({ top: secs[k].offsetTop, behavior: reduce.matches ? 'auto' : 'smooth' });
  }
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var fwd = e.key === 'PageDown' || e.key === 'ArrowDown' || (e.key === ' ' && !e.shiftKey);
    var back = e.key === 'PageUp' || e.key === 'ArrowUp' || (e.key === ' ' && e.shiftKey);
    if (e.key === ' ' && (tag === 'A' || tag === 'BUTTON' || tag === 'SUMMARY')) return;
    if (e.key === 'Home') { e.preventDefault(); go(0); return; }
    if (e.key === 'End') { e.preventDefault(); go(N - 1); return; }
    if (!fwd && !back) return;
    var k = currentIndex(0) , y = window.scrollY, vh = window.innerHeight, sec = secs[k];
    // a step taller than the screen (small screens) is read in screen-sized moves
    if (fwd && sec.offsetTop + sec.offsetHeight > y + vh + 8 && (k === N - 1 || secs[k + 1].offsetTop > y + vh * 0.9)) { e.preventDefault(); window.scrollBy({ top: vh * 0.85, behavior: reduce.matches ? 'auto' : 'smooth' }); return; }
    if (back && y > sec.offsetTop + 8) { e.preventDefault(); go(k); return; }
    e.preventDefault();
    go(fwd ? k + 1 : k - 1);
  });
})();
</script>
</body>
