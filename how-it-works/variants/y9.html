  // ---------- right rail ----------
  var railOl = document.querySelector('#rail ol'), railLinks = [];
  document.getElementById('rail').setAttribute('aria-label', C.rail.label);
  STEPS.forEach(function (st, i) {

  E('rect', { x: TL0, y: ORY, width: RU.end * SC, height: ORH, 'class': 'mrg' }, mini);
  E('rect', { x: TL0, y: BANDY, width: TLW, height: BANDH, 'class': 'mr', rx: 20 }, mini);
  for (var mi = 0; mi < 7; mi++) { var sr = REG['st' + mi]; E('rect', { x: sr.x, y: sr.y, width: sr.w, height: sr.h, 'class': 'mr', rx: 20 }, mini); }
  var mcam = E('rect', { 'class': 'mc', rx: 24 }, mini);
  var wl = document.getElementById('wl');

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null, TOPPAD = 64;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  var FOCUS = { prompt: 'prompt', spec: 'spec', size: 'size', lanes: 'lanes', agent: 'agent', tools: 'tools', report: 'report', talk: 'talk', checks: 'dash', meas: 'dash' };
  function fit(r) {

    var b = document.createElement('b'); b.textContent = i === 0 ? C.where.overview : C.where.step.replace('{n}', i).replace('{t}', TOTAL);

    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;

    var here = Math.round(scrollY / unit());
    go(Math.max(0, Math.min(N - 1, here + d)));
  });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-go]');
    if (!a || !isCam) return;
    e.preventDefault(); go(+a.getAttribute('data-go'));
  });

  mqRm.addEventListener('change', applyMode);
