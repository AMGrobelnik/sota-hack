    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;

    KEYS.forEach(function (k) { wt[k] = 0; });
    sa.focus.forEach(function (k) { wt[k] += 1 - t; });
    sb.focus.forEach(function (k) { wt[k] += t; });

  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-go]');

    e.preventDefault(); go(+a.getAttribute('data-go'));
  });

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');

  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
})();
