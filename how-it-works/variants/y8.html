<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 420px;
  --bar: 56px;
  --rail: 58px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { display: inline-flex; align-items: center; text-decoration: none; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.pg { font-size: 15px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }

/* narration */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 18px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 48px; }
.step h2 { font-size: 38px; }
.step p { margin: 0 0 12px; color: #c4d1df; font-size: 18.5px; line-height: 1.46; max-width: 34ch; }
.step .kick { font-size: 15px; color: var(--signal); font-weight: 650; margin-bottom: 12px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.step .hint { color: var(--mute); font-size: 15px; margin-top: 22px; }
.step p.src a { color: var(--signal); font-weight: 600; text-underline-offset: 4px; }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 18px 0 22px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 13.5px; color: #8597ad; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; padding: 0; border: 0; }
.pick legend { font-size: 14px; color: var(--mute); margin-bottom: 8px; padding: 0; }
.pick button { font: 600 15px/1 var(--f); color: #dbe5ef; background: #16263c; border: 1px solid rgba(214, 228, 242, .3); border-radius: 999px; padding: 9px 13px; cursor: pointer; }
.pick button:hover { border-color: #fff; color: #fff; }
.pick button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: #062418; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 40px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam { scroll-snap-type: y mandatory; }
.cam .fig, .cam .detail { display: none; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }

/* right rail: one dot per stop */
#rail { position: fixed; right: 0; top: var(--bar); bottom: 0; width: var(--rail); z-index: 25; display: flex; align-items: center; justify-content: center; }
#rail ol { list-style: none; margin: 0; padding: 0; height: min(520px, calc(100vh - var(--bar) - 60px)); display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative; }
#rail ol::before { content: ""; position: absolute; left: 50%; top: 13px; bottom: 13px; width: 1px; background: rgba(214, 228, 242, .2); }
#rail li { position: relative; width: 28px; height: 28px; flex: none; }
#rail a { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid rgba(214, 228, 242, .45); background: var(--night); color: #c4d1df; font: 650 13px/1 var(--f); font-variant-numeric: tabular-nums; text-decoration: none; transition: background .25s ease, color .25s ease; }
#rail a:hover { border-color: #fff; color: #fff; }
#rail a[aria-current="step"] { background: var(--signal); border-color: var(--signal); color: #062418; }
#rail .tip { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: #1a2d47; color: #fff; border: 1px solid rgba(214, 228, 242, .3); border-radius: 8px; padding: 6px 10px; font: 600 15px/1.2 var(--f); opacity: 0; pointer-events: none; transition: opacity .15s ease; }
#rail a:hover + .tip, #rail a:focus-visible + .tip { opacity: 1; }
.flow #viewport, .flow #rail { display: none; }
.flow main { padding-bottom: 72px; } /* room for the variant switcher pill */

/* flow mode: reduced motion, smaller screens */
.flow .step { padding: clamp(32px, 6vh, 56px) clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--rule); max-width: 1180px; margin: 0 auto; }
.flow .step p { max-width: 40rem; }
.flow .fig { margin: 20px 0 0; border: 1px solid var(--rule); border-radius: 12px; background: #0d1726; overflow: hidden; }
.flow .fig svg { display: block; width: 100%; height: auto; }
.detail { font-size: 16px; color: #c4d1df; margin-top: 18px; max-width: 44rem; }
@media (min-width: 900px) { .flow .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; } }
.detail h3 { font-size: 16.5px; color: #fff; margin: 18px 0 6px; font-weight: 650; }
.detail dl { margin: 0; }
.detail dt { color: var(--mute); font-size: 14.5px; margin-top: 10px; }

}
