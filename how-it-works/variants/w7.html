<style>
:root {

* { box-sizing: border-box; }
html { background: var(--night); scroll-behavior: smooth; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }

.nav { display: flex; align-items: center; gap: clamp(12px, 2vw, 26px); }
.count { font-size: 15px; font-weight: 600; color: #dbe5ef; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 8.5em; text-align: right; }

.nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 5px; }
.nav a.btn { background: var(--signal); color: #062418; padding: 8px 14px; border-radius: 9px; }
.nav a.btn:hover { text-decoration: none; background: #7bedb2; }
.rail { position: fixed; top: 56px; left: 0; right: 0; z-index: 20; height: 4px; display: flex; gap: 3px; margin: 0; padding: 0; list-style: none; background: var(--night); }
.rail li { flex: 1; display: flex; }
.rail button { all: unset; flex: 1; cursor: pointer; background: rgba(214, 228, 242, .14); position: relative; }

.rail li.done button { background: rgba(91, 228, 155, .42); }
.rail li.on button { background: var(--signal); }
.rail button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 0; }

.panel { position: relative; padding: calc(var(--top) + 26px) clamp(18px, 4vw, 64px) 30px; border-bottom: 1px solid var(--rule); }
.in { max-width: 1380px; margin: 0 auto; height: 100%; display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 18px clamp(28px, 3.6vw, 60px); }
.head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 18px; }
.head .num { font-size: clamp(28px, 2.6vw, 40px); font-weight: 500; color: var(--mute); font-variant-numeric: tabular-nums; min-width: 1.4em; }
.head h2, .head h1 { margin: 0; font-size: clamp(28px, 2.6vw, 40px); font-weight: 650; letter-spacing: -.03em; line-height: 1.08; color: #fff; text-wrap: balance; }
.head .tag { font-size: 15px; font-weight: 600; color: var(--signal); white-space: nowrap; }
.fig { min-height: 0; display: flex; align-items: center; justify-content: center; }
.fig svg { display: block; width: 100%; height: auto; max-height: calc(100vh - var(--top) - 150px); }
.facts { list-style: none; margin: 0; padding: 0; align-self: center; display: grid; gap: 22px; }

.facts .k { display: block; font-size: 14px; font-weight: 600; color: var(--mute); margin-bottom: 4px; }
.facts .v { margin: 0; font-size: clamp(17px, 1.3vw, 19px); line-height: 1.42; color: #eef4fa; max-width: 40ch; }
.facts .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.mini { border-collapse: collapse; font-size: 15.5px; line-height: 1.35; width: 100%; }
.mini th, .mini td { text-align: left; vertical-align: top; padding: 5px 10px 5px 0; border-top: 1px solid var(--rule); }
.mini th { font-weight: 650; color: #fff; white-space: nowrap; }
.mini td { color: #dbe5ef; }

.s-bx { fill: var(--deep); stroke: var(--line); stroke-width: 1.2; }
.s-on { fill: rgba(91, 228, 155, .1); stroke: var(--signal); stroke-width: 1.5; }

.s-arrow { fill: var(--line); }
.s-arrow-on { fill: var(--signal); }
.hl-move { transition: transform .6s cubic-bezier(.4, 0, .2, 1); }

.legend { margin: 0; font-size: 13.5px; color: var(--mute); }

.meas { border-collapse: collapse; width: 100%; font-size: clamp(15px, 1.15vw, 17px); line-height: 1.38; }
.meas th { text-align: left; font-size: 14px; font-weight: 600; color: var(--mute); padding: 0 16px 8px 0; }

.meas td:last-child { color: #c4d1df; width: 30%; padding-right: 0; }

.intro .in { grid-template-columns: minmax(0, 1.2fr) minmax(300px, 1fr); }
.intro .lede-big { font-size: clamp(19px, 1.55vw, 23px); line-height: 1.45; color: #eef4fa; max-width: 46ch; margin: 0 0 22px; }
.intro .keys { color: var(--mute); font-size: 15px; margin: 0; }
.intro .left { align-self: center; }
.agenda { align-self: center; margin: 0; padding: 0; list-style: none; columns: 1; font-size: 16px; }
.agenda li { display: flex; gap: 12px; padding: 4px 0; border-top: 1px solid var(--rule); }
.agenda li span { color: var(--mute); min-width: 1.6em; text-align: right; font-variant-numeric: tabular-nums; }
.agenda a { text-decoration: none; color: #eef4fa; }
.agenda a:hover { text-decoration: underline; text-underline-offset: 4px; }
.agenda h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--mute); }

/* limits footer */
.endbar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; border-top: 1px solid var(--rule); padding-top: 14px; font-size: 14px; color: var(--mute); }
.endbar nav { display: flex; gap: 20px; }
.endbar a { font-weight: 600; color: #dbe5ef; }
.limits .in { grid-template-rows: auto minmax(0, 1fr) auto; }

/* presenting size: one panel per screen, snapping */
@media (min-width: 1000px) and (min-height: 680px) {
  html { scroll-snap-type: y mandatory; }
  .panel { height: 100vh; height: 100svh; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
}
@media (max-width: 999px), (max-height: 679px) {

  .groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {

  .top { height: 48px; padding: 0 14px; }
  .rail { top: 48px; }
  .brand span, .count { display: none; }

  .head { flex-wrap: wrap; gap: 4px 12px; }

  .groups { grid-template-columns: 1fr; }
  .tools td:nth-child(2) { white-space: normal; }
  .meas thead { display: none; }
  .meas tr { display: block; border-top: 1px solid var(--rule); padding: 12px 0; }
  .meas td { display: block; border: 0; padding: 2px 0; width: auto !important; }
  .facts .v { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {

}

    return d;
  }
  function figBox(svgEl) { var d = h('div', 'fig'); d.appendChild(svgEl); return d; }

  var main = document.getElementById('main');
  var panels = [];

  // overview panel
  (function () {
    var sec = h('section', 'panel intro'); sec.id = 'step-0'; sec.setAttribute('aria-labelledby', 'h-0');
    var inn = h('div', 'in');
    var hd = h('div', 'head'); var h1 = h('h1', null, C.intro.title); h1.id = 'h-0'; hd.appendChild(h1); inn.appendChild(hd);
    var left = h('div', 'left'); left.appendChild(h('p', 'lede-big', C.intro.lede)); left.appendChild(h('p', 'keys', C.intro.keys)); inn.appendChild(left);
    var right = h('div', 'left'); right.appendChild(h('h3', null, C.intro.agendaTitle));
    var ol = h('ol', 'agenda');
    STEPS.forEach(function (st, i) {
      var li = h('li'); li.appendChild(h('span', null, String(i + 1)));
      var a = h('a', null, st.kind === 'stage' ? fmt(C.stageTag, { n: st.stage + 1 }) + ': ' + st.title.toLowerCase() : st.title); a.href = '#step-' + (i + 1);
      li.appendChild(a); ol.appendChild(li);
    });
    right.appendChild(ol); right.className = 'agenda-wrap left'; inn.appendChild(right);
    sec.appendChild(inn); main.appendChild(sec); panels.push(sec);
  })();

  STEPS.forEach(function (st, i) {
    var n = i + 1;
    var sec = h('section', 'panel ' + st.kind); sec.id = 'step-' + n;
    var inn = h('div', 'in');
    if (st.kind === 'stage') {
      inn.appendChild(head(n, st.title, fmt(C.stageTag, { n: st.stage + 1 })));
      inn.appendChild(figBox(figStage(st)));
      var F = C.stageFacts;
      inn.appendChild(factsList([
        { k: F.does, v: st.does },
        { k: F.subs, v: st.tries },
        { k: F.out, v: st.out },
        { k: F.pick, v: st.pick }
      ]));
    } else if (st.kind === 'skills') {
      inn.className = 'in wide';
      inn.appendChild(head(n, st.title));
      var lede = h('p', 'lede'); lede.innerHTML = '';
      var parts = st.lede.split('{n}'); lede.appendChild(document.createTextNode(parts[0])); lede.appendChild(h('b', null, String(TOOL_COUNT))); lede.appendChild(document.createTextNode(parts[1]));
      inn.appendChild(lede);
      var grid = h('div', 'groups');
      st.groups.forEach(function (g) {
        var d = h('div', 'grp'); var h3 = h('h3', null, g[0] + ' '); h3.appendChild(h('span', null, String(g[1].length))); d.appendChild(h3);
        var t = h('table', 'tools'), th = h('thead'), tr = h('tr');
        st.cols.forEach(function (c) { var x = h('th', null, c); x.scope = 'col'; tr.appendChild(x); });
        th.appendChild(tr); t.appendChild(th);
        var tb = h('tbody');
        g[1].forEach(function (r) { var tr2 = h('tr'); r.forEach(function (c) { tr2.appendChild(h('td', null, c)); }); tb.appendChild(tr2); });
        t.appendChild(tb); d.appendChild(t); grid.appendChild(d);
      });
      inn.appendChild(grid);
      inn.appendChild(h('p', 'legend', st.legend));
    } else if (st.kind === 'measured') {
      inn.appendChild(head(n, st.title));
      var fb = h('div', 'fig'); var t = h('table', 'meas'), th = h('thead'), tr = h('tr');
      st.cols.forEach(function (c) { var x = h('th', null, c); x.scope = 'col'; tr.appendChild(x); });
      th.appendChild(tr); t.appendChild(th); var tb = h('tbody');
      st.rows.forEach(function (r) { var tr2 = h('tr'); r.forEach(function (c) { tr2.appendChild(h('td', null, c)); }); tb.appendChild(tr2); });
      t.appendChild(tb); fb.appendChild(t); inn.appendChild(fb);
      inn.appendChild(factsList(st.facts));
    } else {
      inn.appendChild(head(n, st.title));
      var mk = { intake: figIntake, run: figRun, pipeline: figPipeline, agent: figAgent, checks: figChecks, limits: figLimits }[st.kind];
      inn.appendChild(figBox(mk(st.fig)));
      inn.appendChild(factsList(st.facts));
      if (st.kind === 'limits') {
        var eb = h('div', 'endbar'); eb.appendChild(h('span', null, C.footer));
        var nv = h('nav'); nv.setAttribute('aria-label', 'Footer');
        var a1 = h('a', null, C.home); a1.href = '../../'; var a2 = h('a', null, C.dashboard); a2.href = '../../dashboard/';
        nv.appendChild(a1); nv.appendChild(a2); eb.appendChild(nv); inn.appendChild(eb);
      }
    }
    var hh = inn.querySelector('h2'); if (hh) { hh.id = 'h-' + n; sec.setAttribute('aria-labelledby', hh.id); }
    sec.appendChild(inn); main.appendChild(sec); panels.push(sec);
  });

  /* ---------- chrome text ---------- */
  document.title = C.pageTitle;
  var brand = document.getElementById('brand');
  brand.appendChild(document.createTextNode(C.brand + ' ')); brand.appendChild(h('span', null, C.brandSub));
  document.getElementById('lnk-home').textContent = C.home;
  document.getElementById('lnk-dash').textContent = C.dashboard;
  var rail = document.getElementById('rail'); rail.setAttribute('aria-label', C.railLabel);
  var railItems = STEPS.map(function (st, i) {
    var li = h('li'), b = h('button'); b.type = 'button';
    b.setAttribute('aria-label', fmt(C.counter, { n: i + 1, t: TOTAL }) + ': ' + st.title);
    b.addEventListener('click', function () { go(i + 1); });
    li.appendChild(b); rail.appendChild(li); return li;
  });

  /* ---------- stepping ---------- */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  var fit = matchMedia('(min-width: 1000px) and (min-height: 680px)');
  var cur = -1, lastStageX = 0, target = null;
  function go(i) {
    i = Math.max(0, Math.min(panels.length - 1, i));
    target = i;
    clearTimeout(go.t); go.t = setTimeout(function () { target = null; }, 1200);
    window.scrollTo({ top: panels[i].offsetTop, behavior: reduce.matches ? 'auto' : 'smooth' });
  }
  function step(d) { go((target == null ? cur : target) + d); }
  window.addEventListener('scrollend', function () { target = null; track(); });
  // At the presenting size one wheel or trackpad gesture moves exactly one step.
  // A new step needs a short pause in wheel events, so trackpad momentum does not skip steps.
  var lastWheel = 0, acc = 0, needGap = false;
  window.addEventListener('wheel', function (e) {
    if (!fit.matches || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gapped = now - lastWheel > 200;
    lastWheel = now;
    if (needGap && !gapped) return;
    needGap = false;
    if (gapped) acc = 0;
    acc += e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    if (Math.abs(acc) >= 30) { step(acc > 0 ? 1 : -1); acc = 0; needGap = true; }
  }, { passive: false });
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    document.getElementById('count').textContent = i === 0 ? C.counterIntro : fmt(C.counter, { n: i, t: TOTAL });
    railItems.forEach(function (li, j) {
      li.className = j + 1 === i ? 'on' : (j + 1 < i ? 'done' : '');
      if (j + 1 === i) li.firstChild.setAttribute('aria-current', 'step'); else li.firstChild.removeAttribute('aria-current');
    });
    // the highlight moves from the previous stage to this one
    stageHL.forEach(function (o) {
      if (o.panelId !== (STEPS[i - 1] || {}).id) return;
      if (reduce.matches) { o.el.style.transform = 'translate(' + o.x + 'px,0)'; }
      else {
        o.el.classList.remove('hl-move');
        o.el.style.transform = 'translate(' + lastStageX + 'px,0)';
        o.el.getBoundingClientRect();
        o.el.classList.add('hl-move');
        o.el.style.transform = 'translate(' + o.x + 'px,0)';
      }
      lastStageX = o.x;
    });
  }
  function track() {
    var y = window.scrollY + window.innerHeight * 0.4, i = 0;
    for (var j = 0; j < panels.length; j++) if (panels[j].offsetTop <= y) i = j;
    setCurrent(i);
  }
  var ticking = false;
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(function () { ticking = false; track(); }); } }, { passive: true });
  window.addEventListener('resize', track);
  document.addEventListener('keydown', function (e) {
    if (!fit.matches || e.altKey || e.ctrlKey || e.metaKey) return;
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    var k = e.key;
    var next = k === 'ArrowDown' || k === 'PageDown' || k === 'ArrowRight' || (k === ' ' && !e.shiftKey && tag !== 'BUTTON' && tag !== 'A');
    var prev = k === 'ArrowUp' || k === 'PageUp' || k === 'ArrowLeft' || (k === ' ' && e.shiftKey && tag !== 'BUTTON' && tag !== 'A');
    if (next) { e.preventDefault(); step(1); }
    else if (prev) { e.preventDefault(); step(-1); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(panels.length - 1); }
  });
  track();
})();
</script>
</body>
</html>
