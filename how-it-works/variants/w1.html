svg .lv.on { fill: var(--tint); stroke: var(--green); stroke-width: 1.6; }
svg .cells { fill: var(--ink); stroke: none; }
svg .cells.g { fill: var(--green); }
.motion svg .hl { transition: transform .7s cubic-bezier(.3, .7, .2, 1); }

/* narrow figure: the same content as a vertical flow */
.flow .node { border: 1.2px solid var(--ink); background: #fff; padding: 10px 12px; border-radius: 3px; font-size: 15.5px; line-height: 1.4; }
.flow .node.orch { background: var(--night); color: #fff; border-color: var(--night); }
.flow .node.band { background: var(--tint); border-color: rgba(13, 106, 67, .45); }
.flow .node.strong { border-width: 1.8px; }
.flow .node b { display: block; font-weight: 650; margin-bottom: 2px; }
.flow .node ul, .flow .node ol { margin: 4px 0 0; padding-left: 20px; }
.flow .node code { font-family: var(--m); font-size: 13.5px; }
.flow .arr { height: 22px; position: relative; }
.flow .arr::before { content: ""; position: absolute; left: 24px; top: 2px; bottom: 6px; width: 1.2px; background: var(--ink); }
.flow .arr::after { content: ""; position: absolute; left: 20px; bottom: 2px; border: 5px solid transparent; border-top: 6px solid var(--ink); border-bottom: 0; }
.flow .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.flow .chips code { background: #fff; border: 1px solid rgba(13, 106, 67, .55); border-radius: 13px; padding: 2px 9px; }
.flow .where2 { font-size: 13.5px; color: var(--ink2); margin-bottom: 8px; }
.flow .where2 strong { color: var(--ink); }

/* tables */
.tcap { font-size: 14.5px; color: var(--ink2); margin: 16px 0 6px; }
table.t { border-collapse: collapse; width: 100%; font-size: 15.5px; line-height: 1.4; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
table.t th { text-align: left; font-weight: 650; padding: 7px 12px 6px 0; border-bottom: 1px solid var(--ink); }
table.t td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n { color: var(--green); font-variant-numeric: tabular-nums; width: 30px; }
table.t td.q { width: 345px; font-weight: 600; }
table.t td.k { width: 230px; font-weight: 600; }
.tight table.t td, .tight table.t th { padding-top: 5px; padding-bottom: 5px; }
table.big { font-size: 17px; }
table.big td:first-child { width: 250px; font-weight: 600; }
table.big td:last-child { width: 300px; color: var(--ink2); }
.tag { display: inline-block; font-size: 13px; font-weight: 600; padding: 1px 8px; border-radius: 4px; margin-left: 6px; color: var(--ink); vertical-align: 1px; }
.tag.estimate { background: var(--amber); }
.tag.simulated { background: var(--dusk); }

/* tools grid */
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 34px; margin-top: 8px; border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); padding: 8px 0 4px; }
.tools h4 { break-after: avoid; font-size: 14.5px; font-weight: 650; margin: 4px 0 1px; padding-bottom: 3px; border-bottom: 1px solid var(--ink); }
.tools h4:first-child { margin-top: 0; }
.tools .tool { break-inside: avoid; padding: 2px 0 2px; border-bottom: 1px solid var(--hair); }
.tools .tool .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.tools code { font-family: var(--m); font-size: 13px; font-weight: 600; line-height: 1.2; }
.tools .st { font-size: 12.5px; color: var(--green); white-space: nowrap; }
.tools .st.any { color: var(--ink2); }
.tools .d { display: block; font-size: 13.5px; line-height: 1.2; color: var(--ink2); }

/* agent */
.rule { margin: 18px 0 0; max-width: 64ch; font-size: 20px; line-height: 1.45; font-weight: 600; padding-left: 18px; border-left: 3px solid var(--green); }

/* limits */
.limits { margin: 18px 0 0; padding-left: 24px; max-width: 70ch; font-size: 20px; line-height: 1.5; }
.limits li { margin: 0 0 10px; padding-left: 6px; }
.limits li::marker { color: var(--green); font-weight: 650; }
.ends { display: flex; gap: 16px; margin: 34px 0 0; flex-wrap: wrap; }
.ends a { font-weight: 650; font-size: 17px; text-decoration: none; padding: 11px 20px; border-radius: 8px; border: 1.5px solid var(--ink); }
.ends a.dash { background: var(--signal); border-color: var(--signal); color: #062418; }
.ends a:hover { text-decoration: underline; text-underline-offset: 4px; }
footer { margin: 60px 0 0; padding-top: 14px; border-top: 1px solid var(--hair); font-size: 14.5px; color: var(--ink2); }

/* medium and narrow screens */
@media (max-width: 1180px) {
  .toc { display: none; }
  .sheet { margin: var(--bar) auto 0; }
  .bar .where { visibility: visible; }
}
@media (max-width: 760px) {
  body { font-size: 17px; }
  .bar { gap: 12px; padding: 0 14px; }
  .bar .doc { display: none; }
  .bar nav { gap: 12px; }
  .bar nav a { font-size: 14px; }
  .bar nav a.dash { padding: 6px 10px; }
  .bar .where { font-size: 13px; }
  .sheet { padding: 0 18px; border: 0; }
  .step { min-height: 0; padding: 28px 0 34px; }
  h1 { font-size: 32px; margin-top: 28px; }
  h2.sec { font-size: 24px; gap: 12px; }
  h3.sub { font-size: 23px; gap: 12px; }
  .lead, .abs p { font-size: 17px; }
  .fig .wide { display: none; }
  .fig .flow { display: block; }
  table.t, table.big { font-size: 15px; }
  table.t thead { display: none; }
  table.t tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--hair); }
  table.t tr:last-child { border-bottom: 0; }
  table.t td, table.big td:first-child, table.big td:last-child, table.t td.k, table.t td.q { display: block; width: auto; padding: 1px 0; border: 0; }
  table.t td.n { display: inline; }
  .tools { grid-template-columns: 1fr; }
  .tools h4.cont { display: none; }
  .rule { font-size: 18px; }
  .limits { font-size: 18px; }
}
@media (max-width: 420px) {
  .bar nav a.home { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}

<body>
<a class="skip" id="skip" href="#doc"></a>
<header class="bar">
  <a class="brand" id="brand" href="../../"></a>
  <span class="doc" id="bardoc"></span>
  <span class="where" id="where" aria-live="polite"></span>
  <nav aria-label="Site"><a class="home" id="home" href="../../"></a><a class="dash" id="dash" href="../../dashboard/"></a></nav>
</header>
<nav class="toc" id="toc" aria-labelledby="toc-h"><h2 id="toc-h"></h2><ol id="toclist"></ol><span class="mark" id="mark" aria-hidden="true"></span></nav>
<main class="sheet" id="doc" tabindex="-1"></main>

<script>
(function () {
  'use strict';
  var C = window.COPY;
  var L = C.labels;
  var W = 1000;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function wrap(s, max) {
    var words = String(s).split(' '), out = [], line = '';
    words.forEach(function (w) {
      if (line && (line + ' ' + w).length > max) { out.push(line); line = w; } else { line = line ? line + ' ' + w : w; }
    });
    if (line) out.push(line);
    return out;
  }
  function txt(x, y, lines, cls, lh, anchor) {
    lines = Array.isArray(lines) ? lines : [lines];
    lh = lh || 18;
    return '<text x="' + x + '" y="' + y + '"' + (cls ? ' class="' + cls + '"' : '') + (anchor ? ' text-anchor="' + anchor + '"' : '') + '>' +
      lines.map(function (l, i) { return '<tspan x="' + x + '" dy="' + (i ? lh : 0) + '">' + esc(l) + '</tspan>'; }).join('') + '</text>';
  }
  function rect(x, y, w, h, cls, rx) { return '<rect x="' + r1(x) + '" y="' + r1(y) + '" width="' + r1(w) + '" height="' + r1(h) + '" rx="' + (rx == null ? 3 : rx) + '" class="' + (cls || 'bx') + '"/>'; }
  function r1(v) { return Math.round(v * 10) / 10; }
  var mk = 0;
  function svg(w, h, body, label) {
    var id = 'ah' + (++mk);
    body = body.replace(/MARK/g, id);
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(label) + '"><defs><marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs>' + body + '</svg>';
  }
  function arrow(x1, y1, x2, y2, cls) { return '<path d="M' + r1(x1) + ' ' + r1(y1) + 'L' + r1(x2) + ' ' + r1(y2) + '" class="ln' + (cls ? ' ' + cls : '') + '" marker-end="url(#MARK)"/>'; }
  function path(d, cls) { return '<path d="' + d + '" class="ln' + (cls ? ' ' + cls : '') + '"/>'; }
  function fill(t, map) { return String(t).replace(/\{(\w+)\}/g, function (m, k) { return map[k] != null ? map[k] : m; }); }
  var nFig = 0, nTab = 0;
  function figure(wideSvg, flowHtml, caption) {
    nFig += 1;
    return '<figure class="fig"><div class="wide">' + wideSvg + '</div><div class="flow">' + flowHtml + '</div><figcaption><b>' + L.figure + ' ' + nFig + '.</b>' + esc(caption) + '</figcaption></figure>';
  }
  function tcap(caption) { nTab += 1; return '<p class="tcap"><b>' + L.table + ' ' + nTab + '.</b>' + esc(caption) + '</p>'; }
  function node(cls, title, body) { return '<div class="node ' + (cls || '') + '">' + (title ? '<b>' + esc(title) + '</b>' : '') + (body || '') + '</div>'; }
  function flow(nodes) { return nodes.join('<div class="arr" aria-hidden="true"></div>'); }
  function ul(items, ordered) { var t = ordered ? 'ol' : 'ul'; return '<' + t + '>' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</' + t + '>'; }
  function leads(arr) { return (Array.isArray(arr) ? arr : [arr]).map(function (p) { return '<p class="lead">' + esc(p) + '</p>'; }).join(''); }
  function h2(num, title, cls) { return '<h2 class="sec' + (cls ? ' ' + cls : '') + '"><span class="n">' + esc(num) + '</span><span>' + esc(title) + '</span></h2>'; }

  var steps = []; // {id, num, toc, sub}
  var html = '';
  function section(id, num, toc, inner, sub) {
    steps.push({ id: id, num: num, toc: toc, sub: !!sub });
    html += '<section class="step" id="' + id + '" aria-label="' + esc((num ? num + ' ' : '') + toc) + '">' + inner + '</section>';
  }

  /* ---------- title ---------- */
  var T = C.title;
  section('abstract', '', T.toc,
    '<h1>' + esc(T.h1) + '</h1><p class="meta">' + esc(T.meta) + '</p>' +
    '<div class="abs"><h2>' + esc(T.absHead) + '</h2><p>' + esc(T.abs) + '</p><p>' + esc(T.plan) + '</p></div>' +
    '<p class="keys">' + esc(T.keys) + '</p>');

  /* ---------- 1 intake ---------- */
  (function () {
    var S = C.intake, F = S.fig, b = '';
    // rough idea
    b += rect(0, 16, 200, 190, 'bx');
    b += txt(16, 44, F.idea, 'b') + txt(16, 66, F.ideaNote, 's');
    b += txt(16, 98, wrap('“' + F.ideaText + '”', 22), '', 21);
    b += arrow(202, 111, 238, 111);
    // questions
    b += txt(244, 10, F.questions, 's');
    var qw = 244, qh = 40, gx = 12, gy = 8, qx0 = 244, qy0 = 20;
    F.q.forEach(function (q, i) {
      var col = Math.floor(i / 4), row = i % 4;
      var x = qx0 + col * (qw + gx), y = qy0 + row * (qh + gy);
      b += rect(x, y, qw, qh, 'bx');
      b += txt(x + 12, y + 25, String(i + 1), 'b g') + txt(x + 32, y + 25, q);
    });
    var qend = qx0 + 2 * qw + gx;
    b += arrow(qend + 2, 111, qend + 42, 111);
    // spec document
    var sx = qend + 46, sw = W - sx;
    b += '<path d="M' + sx + ' 16H' + (sx + sw - 24) + 'L' + (sx + sw) + ' 40V206H' + sx + 'Z" class="bx"/>';
    b += '<path d="M' + (sx + sw - 24) + ' 16V40H' + (sx + sw) + '" class="ln"/>';
    b += txt(sx + 16, 44, F.spec, 'b');
    F.fields.forEach(function (f, i) {
      var y = 72 + i * 23;
      b += '<rect x="' + (sx + 16) + '" y="' + (y - 9) + '" width="8" height="8" class="dot on"/>';
      b += txt(sx + 32, y, f, 's');
    });
    var wide = svg(W, 210, b, F.caption);
    var fl = flow([
      node('', F.idea, '<p style="margin:4px 0 0">“' + esc(F.ideaText) + '”</p>'),
      node('', F.questions, ul(F.q, true)),
      node('strong', F.spec, ul(F.fields))
    ]);
    var tb = '<table class="t"><thead><tr>' + S.table.head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      S.table.rows.map(function (r) { return '<tr><td class="n">' + esc(r[0]) + '</td><td class="q">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table>';
    section('s1', S.num, S.toc, h2(S.num, S.title) + leads(S.lead) + figure(wide, fl, F.caption) + tcap(S.table.caption) + '<div class="tight">' + tb + '</div>');
  })();

  /* ---------- 2 settings ---------- */
  (function () {
    var S = C.settings, F = S.fig, b = '';
    var pw = 470, px2 = W - pw;
    // panel a
    b += rect(0, 0, pw, 276, 'soft');
    b += txt(18, 32, F.a, 'b');
    b += rect(18, 54, pw - 36, 74, 'bx2');
    b += '<circle cx="40" cy="80" r="8" class="dot"/><circle cx="40" cy="80" r="4" class="dot on"/>';
    b += txt(60, 85, F.opt1, 'b') + txt(60, 108, F.opt1d, 's');
    b += rect(18, 142, pw - 36, 112, 'bx');
    b += '<circle cx="40" cy="168" r="8" class="dot"/>';
    b += txt(60, 173, F.opt2, 'b') + txt(60, 196, wrap(F.opt2d, 52), 's', 18);
    // panel b
    b += rect(px2, 0, pw, 276, 'soft');
    b += txt(px2 + 18, 32, F.b, 'b');
    b += txt(px2 + 18, 70, F.sub, 'b') + txt(px2 + 18, 90, F.subd, 's');
    for (var i = 0; i < 10; i++) {
      var x = px2 + 18 + i * 30;
      b += rect(x, 104, 22, 22, i < 4 ? 'pillg' : 'bx', 3);
    }
    b += txt(px2 + 18, 166, F.cand, 'b') + txt(px2 + 18, 186, F.candd, 's');
    for (var r = 0; r < 4; r++) for (var c = 0; c < 36; c++) {
      var on = r < 2 || (r === 2 && c < 22);
      b += '<circle cx="' + (px2 + 24 + c * 12) + '" cy="' + (206 + r * 14) + '" r="4" class="dot' + (on ? ' on' : '') + '"/>';
    }
    var wide = svg(W, 278, b, F.caption);
    var fl = flow([
      node('', F.a, '<ul><li><strong>' + esc(F.opt1) + '.</strong> ' + esc(F.opt1d) + '</li><li><strong>' + esc(F.opt2) + '.</strong> ' + esc(F.opt2d) + '</li></ul>'),
      node('', F.b, '<ul><li><strong>' + esc(F.sub) + '.</strong> ' + esc(F.subd) + '</li><li><strong>' + esc(F.cand) + '.</strong> ' + esc(F.candd) + '</li></ul>')
    ]).replace('<div class="arr" aria-hidden="true"></div>', '<div style="height:12px"></div>');
    section('s2', S.num, S.toc, h2(S.num, S.title) + leads(S.lead) + figure(wide, fl, F.caption));
  })();

  /* ---------- 3 pipeline ---------- */
  (function () {
    var S = C.pipeline, F = S.fig, b = '', N = C.stageNames;
    var gap = 22, bw = (W - 6 * gap) / 7;
    b += rect(0, 0, W, 50, 'orch');
    b += txt(W / 2, 22, F.orch, 'b w', 0, 'middle') + txt(W / 2, 40, F.orchd, 'ws', 0, 'middle');
    N.forEach(function (n, i) {
      var x = i * (bw + gap), cx = x + bw / 2;
      b += arrow(cx, 50, cx, 94);
      b += rect(x, 96, bw, 58, 'bx2');
      b += txt(x + 12, 118, String(i + 1), 's') + txt(x + 12, 141, n, 'b');
      if (i < 6) b += arrow(x + bw + 2, 125, x + bw + gap - 2, 125);
      // fan of subagents
      for (var k = 0; k < 4; k++) {
        var sx = x + 6 + k * ((bw - 12 - 3 * 6) / 4 + 6), sw = (bw - 12 - 3 * 6) / 4;
        b += path('M' + r1(cx) + ' 154L' + r1(sx + sw / 2) + ' 192');
        b += rect(sx, 194, sw, 22, 'soft', 2);
      }
      b += path('M' + r1(x) + ' 236H' + r1(x + bw), 'x');
      b += txt(x, 258, wrap(F.outs[i], 17), '', 19);
    });
    var wide = svg(W, 318, b, F.caption);
    var fl = flow([node('orch', F.orch, '<span>' + esc(F.orchd) + '</span>')].concat(N.map(function (n, i) {
      return node('', (i + 1) + ' ' + n, '<span>' + esc(F.outs[i]) + '</span>');
    })));
    section('s3', S.num, S.toc, h2(S.num, S.title) + leads(S.lead) + figure(wide, fl, F.caption));
  })();

  /* ---------- 4 stages ---------- */
  (function () {
    var N = C.stageNames, I = C.stagesIntro;
    // shared geometry, identical for all seven
    var LW = 700, RX = 740, RW = W - RX;
    var sbW = (W - 6 * 12) / 7;
    var subW = (LW - 3 * 14) / 4;
    function pillW(t) { return t.length * 7.9 + 22; }
    function layoutPills(list, x0, x1) {
      var rows = [[]], x = x0;
      list.forEach(function (t) {
        var w = pillW(t);
        if (x + w > x1 && rows[rows.length - 1].length) { rows.push([]); x = x0; }
        rows[rows.length - 1].push({ t: t, x: x, w: w }); x += w + 8;
      });
      return rows;
    }
    var maxRows = 1;
    C.stages.forEach(function (s) { maxRows = Math.max(maxRows, layoutPills(s.skills, 132, LW - 12).length); });
    var bandY = 290, bandH = 28 + maxRows * 26 + (maxRows - 1) * 8;
    var retY = bandY + bandH + 40, retH = 80, H = retY + retH + 2;

    C.stages.forEach(function (s, i) {
      var name = N[i], b = '';
      // pipeline strip with the moving highlight
      N.forEach(function (n, k) {
        var x = k * (sbW + 12);
        b += rect(x, 0, sbW, 34, 'soft');
        if (k < 6) b += '<path d="M' + r1(x + sbW + 3) + ' 13L' + r1(x + sbW + 9) + ' 17L' + r1(x + sbW + 3) + ' 21" class="ln"/>';
      });
      var from = i === 0 ? 0 : (i - 1) * (sbW + 12), to = i * (sbW + 12);
      b += '<rect x="0" y="0" width="' + r1(sbW) + '" height="34" rx="3" class="hl" data-from="' + r1(from) + '" data-to="' + r1(to) + '" style="transform:translateX(' + r1(from) + 'px)"/>';
      N.forEach(function (n, k) {
        var x = k * (sbW + 12);
        b += txt(x + sbW / 2, 22, (k + 1) + ' ' + n, k === i ? 'b' : 's', 0, 'middle');
      });
      // orchestrator
      b += rect(0, 54, W, 46, 'orch');
      b += txt(16, 82, L.orchestrator, 'b w') + txt(124, 82, L.orchBrief, 'ws');
      b += txt(W - 16, 82, L.orchPick, 'ws', 0, 'end');
      // fan to subagents
      s.subs.forEach(function (idea, k) {
        var x = k * (subW + 14), cx = x + subW / 2;
        b += arrow(LW / 2, 100, cx, 138);
        b += rect(x, 140, subW, 110, 'bx');
        b += txt(x + 12, 162, L.subagent + ' ' + (k + 1), 's');
        b += txt(x + 12, 186, wrap(idea, 19), '', 19);
        b += arrow(cx, 250, cx, bandY - 2);
      });
      // skills band
      b += rect(0, bandY, LW, bandH, 'band');
      b += txt(14, bandY + bandH / 2 + 5, L.skills, 'b');
      layoutPills(s.skills, 132, LW - 12).forEach(function (row, ri) {
        row.forEach(function (p) {
          var y = bandY + 14 + ri * 34;
          b += rect(p.x, y, p.w, 26, 'pill', 13);
          b += txt(p.x + p.w / 2, y + 18, p.t, 'm', 0, 'middle');
        });
      });
      b += arrow(LW / 2, bandY + bandH, LW / 2, retY - 2);
      // returns
      b += rect(0, retY, LW, retH, 'bx2');
      b += txt(16, retY + 26, L.returns, 'b');
      b += txt(16, retY + 50, wrap(s.returns, 88), '', 18);
      // orchestrator picks
      var pY = 140, pH = retY + retH - pY;
      b += arrow(RX + RW / 2, 100, RX + RW / 2, pY - 2, 'd');
      b += arrow(LW + 2, retY + retH / 2, RX - 2, retY + retH / 2);
      b += rect(RX, pY, RW, pH, 'bx2');
      b += txt(RX + 16, pY + 28, L.picks, 'b');
      b += txt(RX + 16, pY + 54, wrap(s.picks, 30), '', 20);
      var nextName = i < 6 ? (i + 2) + ' ' + N[i + 1] : L.youNext;
      b += txt(RX + 16, pY + pH - 50, L.passes, 's');
      var nw = nextName.length * 8.2 + 28;
      b += rect(RX + 16, pY + pH - 38, nw, 26, 'pillg', 13);
      b += txt(RX + 16 + nw / 2, pY + pH - 20, nextName, 'b', 0, 'middle');

      var cap = fill(C.stageCaption, { i: i + 1, name: name });
      var wide = svg(W, H, b, cap);
      var fl = '<p class="where2">' + N.map(function (n, k) { return k === i ? '<strong>' + esc(n) + '</strong>' : esc(n); }).join(' / ') + '</p>' + flow([
        node('orch', L.orchestrator, '<span>' + esc(L.orchBrief) + '</span>'),
        node('', L.subagent + 's', ul(s.subs)),
        node('band', L.skills, '<div class="chips">' + s.skills.map(function (k) { return '<code>' + esc(k) + '</code>'; }).join('') + '</div>'),
        node('strong', L.returns, '<span>' + esc(s.returns) + '</span>'),
        node('strong', L.picks, '<span>' + esc(s.picks) + '</span><br><span>' + esc(L.passes) + ': <strong>' + esc(nextName) + '</strong></span>')
      ]);
      var head = (i === 0 ? h2(I.num, I.title, 'small') : '') +
        '<h3 class="sub"><span class="n">4.' + (i + 1) + '</span><span>' + esc(name) + '</span></h3>' + leads(s.does);
      section('s4-' + (i + 1), '4.' + (i + 1), name, head + figure(wide, fl, cap), true);
    });
  })();

  /* ---------- 5 agent ---------- */
  (function () {
    var S = C.agent, F = S.fig, b = '';
    var lw = 590;
    S.layers.forEach(function (l, i) {
      var y = i * 104;
      b += rect(0, y, lw, 96, i === 0 ? 'bx2' : 'bx');
      b += txt(16, y + 27, l[0], 'b g') + txt(52, y + 27, l[1], 'b');
      b += txt(52, y + 50, wrap(l[2], 82), "", 19);
    });
    var rx = 640, rw = W - rx;
    b += txt(rx, 12, F.who, 's');
    b += rect(rx, 24, rw, 46, 'orch');
    b += txt(rx + 14, 52, F.orch, 'b w') + txt(rx + 118, 52, F.orchd, 'ws');
    var sw = (rw - 2 * 12) / 3;
    for (var k = 0; k < 3; k++) {
      var x = rx + k * (sw + 12);
      b += arrow(rx + rw / 2, 70, x + sw / 2, 96);
      b += rect(x, 98, sw, 48, 'bx');
      b += txt(x + 10, 118, F.sub, 'b') + txt(x + 10, 137, F.subd, 's');
    }
    b += txt(rx, 186, F.flow, 's');
    b += rect(rx, 200, 130, 40, 'band');
    b += txt(rx + 65, 225, F.tool, 'b', 0, 'middle');
    b += rect(rx, 256, 130, 40, 'soft');
    b += txt(rx + 65, 281, F.text, '', 0, 'middle');
    b += rect(W - 120, 228, 120, 40, 'bx2');
    b += txt(W - 60, 253, F.dash, 'b', 0, 'middle');
    b += arrow(rx + 132, 220, W - 122, 240);
    b += txt(rx + 156, 214, F.yes, 's g');
    b += path('M' + (rx + 132) + ' 276L' + (W - 140) + ' 258', 'd x');
    b += path('M' + (rx + 172) + ' 258l14 14M' + (rx + 186) + ' 258l-14 14', 'x');
    b += txt(rx + 196, 292, F.no, 's');
    var wide = svg(W, 412, b, F.caption);
    var fl = flow(S.layers.map(function (l) { return node('', l[0] + ' ' + l[1], '<span>' + esc(l[2]) + '</span>'); }));
    section('s5', S.num, S.toc, h2(S.num, S.title) + leads(S.lead) + figure(wide, fl, F.caption) + '<p class="rule">' + esc(S.rule) + '</p>');
  })();

  /* ---------- 6 tools ---------- */
  (function () {
    var S = C.tools, n = 0;
    S.groups.forEach(function (g) { n += g.t.length; });
    var flat = [];
    S.groups.forEach(function (g) { g.t.forEach(function (t, k) { flat.push({ g: g.g, t: t, first: k === 0 }); }); });
    var cols = [flat.slice(0, 14), flat.slice(14, 28), flat.slice(28)];
    var grid = '<div class="tools">' + cols.map(function (col) {
      return '<div class="tcol">' + col.map(function (e, k) {
        var head = e.first ? '<h4>' + esc(e.g) + '</h4>' : (k === 0 ? '<h4 class="cont">' + esc(fill(S.cont, { g: e.g })) + '</h4>' : '');
        var any = e.t[2] === '*';
        return head + '<div class="tool"><span class="top"><code>' + esc(e.t[0]) + '</code><span class="st' + (any ? ' any' : '') + '">' + esc(any ? S.any : e.t[2]) + '</span></span><span class="d">' + esc(e.t[1]) + '</span></div>';
      }).join('') + '</div>';
    }).join('') + '</div>';
    section('s6', S.num, S.toc, h2(S.num, S.title) + leads(fill(S.lead, { n: n })) + tcap(fill(S.caption, { n: n })) + grid);
  })();

  /* ---------- 7 checks ---------- */
  (function () {
    var S = C.checks, b = '';
    var lw = (W - 4 * 14) / 5;
    S.levels.forEach(function (l, i) {
      var x = i * (lw + 14), h = 88 + i * 22, y = 200 - h;
      b += rect(x, y, lw, h, i < 2 ? 'lv on' : 'lv', 3);
      b += txt(x + 12, y + 24, l[0], 'b' + (i < 2 ? ' g' : ''));
      b += txt(x + 12, y + 46, wrap(l[1], 22), '', 18);
      b += txt(x + 12, 188, l[2], i < 4 ? 'm' : 's');
    });
    b += rect(0, 222, 14, 14, 'lv on', 2) + txt(22, 234, S.levelKey, 's');
    var wide = svg(W, 240, b, S.figCaption);
    var fl = flow(S.levels.map(function (l, i) { return node(i < 2 ? 'band' : '', l[0] + ': ' + l[1], '<code>' + esc(l[2]) + '</code>'); }));
    var T = S.table;
    var tb = '<table class="t"><thead><tr>' + T.head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      T.rows.map(function (r, i) {
        return '<tr><td class="k">' + esc(r[0]) + (T.tags[i] ? '<span class="tag ' + T.tags[i] + '">' + esc(T.tags[i]) + '</span>' : '') + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>';
      }).join('') + '</tbody></table>';
    section('s7', S.num, S.toc, h2(S.num, S.title) + leads(S.lead) + figure(wide, fl, S.figCaption) + tcap(T.caption) + tb);
  })();

  /* ---------- 8 measured ---------- */
  (function () {
    var S = C.measured, T = S.table;
    var tb = '<table class="t big"><thead><tr>' + T.head.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      T.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('') + '</tbody></table>';
    var F = S.fig;
    function cells(x0, y0, n, cols, pitch, size, cls) {
      var d = '';
      for (var k = 0; k < n; k++) d += 'M' + (x0 + (k % cols) * pitch) + ' ' + (y0 + Math.floor(k / cols) * pitch) + 'h' + size + 'v' + size + 'h-' + size + 'z';
      return '<path d="' + d + '" class="' + cls + '"/>';
    }
    var b = txt(0, 14, F.a, 's') + cells(0, 28, 2330, 96, 5, 4, 'cells');
    b += txt(520, 14, F.b, 's') + cells(520, 28, 3880, 120, 4, 3, 'cells g');
    var wide = svg(W, 162, b, F.caption);
    var fl = flow([node('', F.a, ''), node('band', F.b, '')]).replace('<div class="arr" aria-hidden="true"></div>', '<div style="height:10px"></div>');
    section('s8', S.num, S.toc, h2(S.num, S.title) + leads(S.lead) + tcap(T.caption) + tb + figure(wide, fl, F.caption));
  })();

  /* ---------- 9 limits ---------- */
  (function () {
    var S = C.limits;
    section('s9', S.num, S.toc, h2(S.num, S.title) + '<ul class="limits">' + S.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' +
      '<p class="ends"><a class="dash" href="../../dashboard/">' + esc(S.next) + '</a><a href="../../">' + esc(S.home) + '</a></p>' +
      '<footer>' + esc(C.footer) + '</footer>');
  })();

  /* ---------- mount ---------- */
  var doc = document.getElementById('doc');
  doc.innerHTML = html;
  document.title = C.docTitle;
  document.getElementById('skip').textContent = C.bar.skip;
  document.getElementById('brand').textContent = C.bar.brand;
  document.getElementById('bardoc').textContent = C.bar.doc;
  document.getElementById('home').textContent = C.bar.home;
  document.getElementById('dash').textContent = C.bar.dash;
  document.getElementById('toc-h').textContent = C.bar.contents;
  var tocList = document.getElementById('toclist');
  var stagesHeadDone = false;
  tocList.innerHTML = steps.map(function (s) {
    var pre = '';
    if (s.sub && !stagesHeadDone) {
      stagesHeadDone = true;
      pre = '<li><a href="#s4-1"><span class="n">' + esc(C.stagesIntro.num) + '</span><span>' + esc(C.stagesIntro.toc) + '</span></a></li>';
    }
    return pre + '<li class="' + (s.sub ? 'sub' : '') + '"><a href="#' + s.id + '" data-step="' + s.id + '"><span class="n">' + esc(s.num) + '</span><span>' + esc(s.toc) + '</span></a></li>';
  }).join('');

  /* ---------- where you are ---------- */
  var els = steps.map(function (s) { return document.getElementById(s.id); });
  var links = steps.map(function (s) { return tocList.querySelector('[data-step="' + s.id + '"]'); });
  var mark = document.getElementById('mark'), where = document.getElementById('where');
  var barH = function () { return document.querySelector('.bar').offsetHeight; };
  var cur = -1;
  function currentIndex(th) {
    var i = 0;
    for (var k = 0; k < els.length; k++) if (els[k].getBoundingClientRect().top <= th) i = k;
    return i;
  }
  function update() {
    var i = currentIndex(barH() + window.innerHeight * 0.35);
    if (i === cur) return;
    cur = i;
    links.forEach(function (a, k) { if (k === i) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    var a = links[i];
    mark.style.transform = 'translateY(' + (tocList.offsetTop + a.parentNode.offsetTop) + 'px)';
    mark.style.height = a.parentNode.offsetHeight + 'px';
    where.textContent = steps[i].num ? steps[i].num + ' ' + steps[i].toc : steps[i].toc;
    var hl = els[i].querySelector('.hl');
    if (hl) hl.style.transform = 'translateX(' + hl.getAttribute('data-to') + 'px)';
  }
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; update(); });
  }, { passive: true });
  window.addEventListener('resize', function () { cur = -1; update(); });
  update();
  requestAnimationFrame(function () { requestAnimationFrame(function () { document.getElementById("toc").classList.add("ready"); }); });

  /* ---------- keyboard: one section per key press ---------- */
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  function go(dir) {
    var top = barH(), vh = window.innerHeight - top, y = window.scrollY;
    var tops = els.map(function (e) { return e.getBoundingClientRect().top + y - top; });
    var i = 0;
    for (var k = 0; k < tops.length; k++) if (tops[k] <= y + 6) i = k;
    var beh = reduce.matches ? 'auto' : 'smooth';
    if (dir > 0) {
      var bottom = Math.max.apply(null, [].map.call(els[i].children, function (c) { return c.getBoundingClientRect().bottom; }));
      if (bottom > window.innerHeight + 6) {
        var rest = bottom - window.innerHeight;
        window.scrollTo({ top: y + Math.min(rest, vh * 0.85), behavior: beh });
      } else if (i < els.length - 1) {
        window.scrollTo({ top: tops[i + 1], behavior: beh });
      }
    } else {
      if (y - tops[i] > 6) window.scrollTo({ top: Math.max(tops[i], y - vh * 0.85), behavior: beh });
      else if (i > 0) {
        var pt = tops[i - 1], pe = els[i - 1], ph = Math.max.apply(null, [].map.call(pe.children, function (c) { return c.getBoundingClientRect().bottom; })) - pe.getBoundingClientRect().top;
        window.scrollTo({ top: ph > vh + 6 ? Math.max(pt, tops[i] - vh * 0.85) : pt, behavior: beh });
      }
    }
  }
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var k = e.key;
    var down = k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey && tag !== 'A' && tag !== 'BUTTON');
    var up = k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey && tag !== 'A' && tag !== 'BUTTON');
    if (down) { e.preventDefault(); go(1); }
    else if (up) { e.preventDefault(); go(-1); }
  });
})();
</script>
