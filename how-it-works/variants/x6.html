<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;
  --amber: #ffb86b;
  --mute: #a9b9cc;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 460px;
  --rail: 72px;
  --bar: 56px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 18px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }

/* text column */
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.04; text-wrap: balance; }
.step h1 { font-size: 52px; }
.step h2 { font-size: 44px; }
.step p { margin: 0 0 14px; color: #c9d5e2; font-size: 19px; line-height: 1.47; max-width: 34ch; }
.step .kick { font-size: 17px; color: var(--signal); font-weight: 600; margin-bottom: 12px; }
.step .hint { color: var(--mute); font-size: 16px; margin-top: 24px; }
.step ul.lim { list-style: none; margin: 0 0 24px; padding: 0; }
.step ul.lim li { color: #dfe8f1; font-size: 19px; line-height: 1.42; padding: 11px 0; border-top: 1px solid var(--rule); max-width: 32ch; }
.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 4px 0 24px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 17px; }
footer { font-size: 15px; color: #94a6bb; }

/* camera mode */
html.cam { scroll-snap-type: y mandatory; }
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: var(--bar) 34px 24px clamp(28px, 3vw, 48px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
#ovl { position: absolute; inset: 0; pointer-events: none; }
#ovl[hidden] { display: none; }
.ovt { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; margin: 0; border-radius: 6px; cursor: pointer; font: inherit; color: inherit; }
.ovt:hover, .ovt:focus-visible { outline: 1.5px solid rgba(91, 228, 155, .75); outline-offset: 2px; }
.ovt .tag { position: absolute; left: 50%; top: -10px; transform: translate(-50%, -100%); white-space: nowrap; font: 600 15px/1.2 var(--f); color: #fff; background: #1a2d47; border: 1px solid rgba(214, 228, 242, .35); padding: 6px 10px; border-radius: 6px; opacity: 0; pointer-events: none; }
.ovt.al .tag { left: 0; transform: translate(0, -100%); }
.ovt.ar .tag { left: auto; right: 0; transform: translate(0, -100%); }

  U.toolsAB = { x: U.toolsA.x, y: U.toolsA.y, w: U.toolsB.x + U.toolsB.w - U.toolsA.x, h: H };
  var orchR = { x: U.orch.x, y: 0, w: U.orch.w, h: 150 };

  var vp = document.getElementById('viewport');

  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STOPS.map(function (s) { return fit(s.rect, A, s.lv === 3 ? 20 : 32); });
    var v = viewOf(FIT[0]), sc = w / v.w;
    ovb.forEach(function (o) {
      var r = o.r, l = (r.x - v.x) * sc, t = (r.y - v.y) * sc, ww = r.w * sc, hh = r.h * sc;

      var u = U[k]; if (!u.el) return;

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');

    rm = mqRm.matches;
