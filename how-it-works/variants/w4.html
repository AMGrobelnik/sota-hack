<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChipIn: how it works</title>
<meta name="description" content="How ChipIn designs the small chip at the core of a medical sensing device: the spec, the seven stages, the agents and the chip-lab tools.">
<meta name="theme-color" content="#0f1a2a">
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --side: #0c1624;
  --paper: #eef1f2;
  --text: #e8eef5;
  --soft: #c3cfdd;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --rule2: rgba(214, 228, 242, .08);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sidew: 272px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--text); font: 400 16px/1.55 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 4px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--signal); color: #062418; padding: 8px 14px; border-radius: 8px; font-weight: 650; text-decoration: none; }
.skip:focus { top: 12px; }
code, .mono { font-family: var(--mono); font-size: .9em; }

/* side navigation */
.side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidew); z-index: 20; background: var(--side); border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 22px 0 16px; }
.side .id { padding: 0 22px 16px; border-bottom: 1px solid var(--rule2); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.side .doc { margin: 2px 0 0; font-size: 14px; color: var(--mute); }
.side .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.lnk { font-size: 14px; font-weight: 600; color: var(--soft); text-decoration: none; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; }
.lnk:hover { color: #fff; border-color: rgba(214, 228, 242, .4); }
.lnk.go { background: var(--signal); color: #062418; border-color: var(--signal); }
.lnk.go:hover { background: #86f2b9; color: #062418; }
.toc { position: relative; flex: 1; overflow-y: auto; padding: 12px 0 8px; }
.toc h3 { margin: 12px 22px 4px; font-size: 12.5px; font-weight: 600; color: var(--mute); letter-spacing: .01em; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a { display: flex; gap: 10px; align-items: baseline; padding: 4px 22px 4px 24px; font-size: 14px; line-height: 1.3; color: var(--soft); text-decoration: none; border-left: 2px solid transparent; }
.toc a .n { flex: none; width: 1.6em; font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; }
.toc a:hover { color: #fff; background: rgba(214, 228, 242, .04); }
.toc a[aria-current="step"] { color: #fff; font-weight: 600; }
.toc a[aria-current="step"] .n { color: var(--signal); }
.toc .sub a { padding-left: 40px; }
.marker { position: absolute; left: 0; width: 3px; background: var(--signal); border-radius: 0 2px 2px 0; top: 0; height: 0; transition: transform .35s ease, height .35s ease; }
.side .foot { padding: 10px 22px 0; border-top: 1px solid var(--rule2); font-size: 12.5px; color: var(--mute); }
.side .foot .bar { height: 3px; background: var(--rule2); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.side .foot .bar i { display: block; height: 100%; width: 100%; background: var(--signal); transform-origin: 0 50%; transform: scaleX(0); transition: transform .35s ease; }

/* mobile bar */
.mbar { display: none; }

/* steps */
main { margin-left: var(--sidew); }
.step { min-height: 100vh; min-height: 100svh; padding: 40px clamp(28px, 4.4vw, 64px) 24px; border-bottom: 1px solid var(--rule); scroll-snap-align: start; display: flex; flex-direction: column; }
.step > .inner { width: 100%; max-width: 1080px; }
.kick { margin: 0 0 6px; font-size: 14px; font-weight: 600; color: var(--mute); }
.kick b { color: var(--signal); font-weight: 650; }
.intro { margin: 0 0 12px; font-size: 15px; color: var(--soft); }
h2 { margin: 0; font-size: clamp(28px, 2.6vw, 38px); line-height: 1.1; letter-spacing: -.025em; font-weight: 650; color: #fff; text-wrap: balance; }
.lede { margin: 8px 0 0; font-size: 17px; line-height: 1.5; color: var(--soft); max-width: 72ch; }
.body { margin-top: 22px; }
.cols { display: grid; gap: 32px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.cols.wl { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.cols.wr { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.cols.ag { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 36px; }
.cols.fan { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; }
h4 { margin: 0 0 8px; font-size: 14.5px; font-weight: 650; color: #fff; }
.cap { margin: 8px 0 0; font-size: 13px; color: var(--mute); }
.panel { border: 1px solid var(--rule); border-radius: 10px; background: var(--deep); padding: 14px 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.grid2 dd { font-size: 14px !important; margin-bottom: 0 !important; }
.panel + .panel, .panel + pre, pre + .panel, pre + h4, .panel + h4, table + h4 { margin-top: 14px; }

/* definition lists */
dl.defs { margin: 0; }
dl.defs dt { font-size: 14.5px; font-weight: 650; color: #fff; margin: 0; }
dl.defs dd { margin: 2px 0 14px; font-size: 15px; color: var(--soft); }
dl.defs dd:last-child { margin-bottom: 0; }
dl.defs.num dt { display: flex; gap: 8px; }
dl.defs.num dt span { color: var(--signal); font-variant-numeric: tabular-nums; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.pill { font: 500 13px/1 var(--mono); color: #dfffee; background: rgba(91, 228, 155, .09); border: 1px solid rgba(91, 228, 155, .38); border-radius: 6px; padding: 5px 7px; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-size: 13px; font-weight: 600; color: var(--mute); padding: 6px 10px; border-bottom: 1px solid var(--rule); vertical-align: bottom; }
td { padding: 6px 10px; border-bottom: 1px solid var(--rule2); vertical-align: top; color: var(--soft); }
td:first-child, th:first-child { padding-left: 0; }
td.k { color: #fff; font-weight: 600; }
td.n { font-variant-numeric: tabular-nums; color: var(--mute); width: 2em; }
td .sub { display: block; color: var(--mute); font-size: 13px; }

/* code */
pre.code { margin: 0; background: #0a1321; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; font: 13px/1.5 var(--mono); color: #d8e3ee; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.code .p { color: var(--mute); }
pre.code .s { color: #9fe8c2; }
.codecap { margin: 0 0 6px; font-size: 13.5px; font-weight: 600; color: #fff; }
.codecap span { font-weight: 400; color: var(--mute); }

/* tags for how numbers are marked */
.tag { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 1px 8px; border: 1px solid; vertical-align: 1px; white-space: nowrap; }
.tag.meas { color: var(--signal); border-color: rgba(91, 228, 155, .5); }
.tag.est { color: var(--amber); border-color: rgba(255, 184, 107, .55); }
.tag.sim { color: var(--dusk); border-color: rgba(201, 163, 196, .55); }

/* callouts */
.call { border-left: 3px solid var(--amber); background: rgba(255, 184, 107, .06); border-radius: 0 8px 8px 0; padding: 12px 16px; }
.call.info { border-left-color: var(--signal); background: rgba(91, 228, 155, .05); }
.call p { margin: 0; color: var(--soft); font-size: 15px; }
.call p.h { color: #fff; font-weight: 650; font-size: 16px; margin-bottom: 4px; }
.calls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* stage strip */
.strip { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 16px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.strip span { position: relative; z-index: 1; text-align: center; padding: 6px 2px; font-size: 13.5px; color: var(--mute); }
.strip span + span { border-left: 1px solid var(--rule2); }
.strip span.on { color: #062418; font-weight: 650; }
.strip .hl { position: absolute; z-index: 0; top: 0; bottom: 0; left: 0; width: calc(100% / 7); background: var(--signal); transform: translateX(calc(var(--i, 0) * 100%)); }
.motion .strip .hl { transition: transform .55s cubic-bezier(.3, .7, .2, 1); }
.strip span.was { color: var(--mute); }

/* svg diagrams */
.fig { margin: 0; }
.fig svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { font-family: var(--f); fill: var(--text); }
svg .bx { fill: var(--deep); stroke: rgba(214, 228, 242, .32); stroke-width: 1; }
svg .bx2 { fill: #13243a; stroke: rgba(214, 228, 242, .22); stroke-width: 1; }
svg .orch { fill: #0f2a26; stroke: rgba(91, 228, 155, .7); stroke-width: 1.2; }
svg .pick { fill: #0f2a26; stroke: var(--signal); stroke-width: 1.5; }
svg .ln { fill: none; stroke: rgba(214, 228, 242, .45); stroke-width: 1.2; }
svg .lnd { fill: none; stroke: rgba(91, 228, 155, .55); stroke-width: 1.1; stroke-dasharray: 4 4; }
svg .ar { fill: rgba(214, 228, 242, .7); }
svg .arg { fill: var(--signal); }
svg .pl { fill: rgba(91, 228, 155, .09); stroke: rgba(91, 228, 155, .45); }
svg .t-m { fill: var(--mute); }
svg .t-s { fill: var(--soft); }
svg .t-g { fill: var(--signal); }
svg .t-w { fill: #fff; }
svg .t-mono { font-family: var(--mono); fill: #dfffee; }
svg .dot { fill: rgba(214, 228, 242, .25); }
svg .dot.k { fill: var(--signal); }

/* settings mock (step 2) */
.form { display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: 11.5em 1fr; gap: 12px; align-items: center; font-size: 15px; }
.field .l { color: var(--mute); font-size: 14px; }
.field .v { border: 1px solid var(--rule); background: #0a1321; border-radius: 7px; padding: 6px 10px; color: #fff; }
.field .v small { color: var(--mute); font-size: 13px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { border: 1px solid var(--rule); border-radius: 7px; padding: 5px 10px; font-size: 14px; color: var(--soft); }
.opt.on { border-color: var(--signal); color: #fff; background: rgba(91, 228, 155, .08); }

/* tool reference (step 12) */
.filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.filter label { font-size: 14px; color: var(--mute); margin-right: 2px; }
.filter input { font: 15px var(--f); color: #fff; background: #0a1321; border: 1px solid var(--rule); border-radius: 7px; padding: 5px 10px; width: 12em; margin-right: 6px; }
.filter input::placeholder { color: #7d8fa5; }
.gbtn { font: 600 13px var(--f); color: var(--soft); background: transparent; border: 1px solid var(--rule); border-radius: 7px; padding: 5px 9px; cursor: pointer; }
.gbtn[aria-pressed="true"] { color: #062418; background: var(--signal); border-color: var(--signal); }
.gbtn:hover { border-color: rgba(214, 228, 242, .45); }
.ref { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; align-items: start; }
.ref table { font-size: 12.5px; table-layout: fixed; }
.ref td { padding: 2px 8px 2px 0; line-height: 1.32; }
.ref th { padding: 4px 8px 4px 0; }
.ref td.tool { font: 500 12px var(--mono); color: #dfffee; white-space: nowrap; }
.ref td.st { color: var(--mute); font-size: 12px; padding-right: 0; white-space: nowrap; }
.ref tr.g td { padding-top: 6px; color: #fff; font-weight: 650; font-size: 13px; border-bottom: 1px solid var(--rule); }
.ref col.c1 { width: 142px; }
.ref col.c3 { width: 106px; }
.foot-note { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.ref .none { color: var(--mute); font-size: 14px; padding: 8px 0; }
.count { font-size: 14px; color: var(--mute); }

footer.end { margin-top: auto; padding: 22px 0 6px; border-top: 1px solid var(--rule2); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-size: 14px; color: var(--mute); }
footer.end nav { display: flex; gap: 8px; }

/* medium widths */
@media (max-width: 1180px) {
  :root { --sidew: 232px; }
  .ref { grid-template-columns: 1fr; }
}
/* phone and narrow tablet */
@media (max-width: 999px) {
  .side { display: none; }
  main { margin-left: 0; }
  .mbar { display: block; position: sticky; top: 0; z-index: 30; background: rgba(12, 22, 36, .97); border-bottom: 1px solid var(--rule); padding: 10px 16px 0; }
  .mbar .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mbar .cur { font-size: 13.5px; color: var(--soft); margin: 4px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mbar .acts { display: flex; gap: 6px; }
  .mbar .lnk { font-size: 13px; padding: 4px 8px; }
  .mbar .bar { height: 3px; margin: 0 -16px; background: var(--rule2); }
  .mbar .bar i { display: block; height: 100%; background: var(--signal); transform-origin: 0 50%; transform: scaleX(0); }
  .step { min-height: 0; padding: 36px 18px 32px; scroll-margin-top: 70px; }
  .cols, .cols.wl, .cols.wr, .cols.fan, .cols.ag, .calls { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .field { grid-template-columns: 1fr; gap: 4px; }
  .strip span { font-size: 11px; padding: 6px 0; }
  .filter input { width: 100%; }
  table { font-size: 14px; }
  .meas-t, .meas-t tbody, .meas-t tr, .meas-t td { display: block; }
  .meas-t thead { display: none; }
  .tag { white-space: normal; }
  .meas-t tr { padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .meas-t td { border: 0; padding: 2px 0; max-width: none !important; }
  .meas-t td.k { white-space: normal !important; }
  .ref colgroup, .ref thead { display: none; }
  .ref table, .ref tbody { display: block; }
  .ref tr { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; border-bottom: 1px solid var(--rule2); padding: 5px 0; }
  .ref tr.g { display: block; padding: 0; }
  .ref td { border: 0; padding: 0; }
  .ref tr.g td { display: block; padding: 10px 0 4px; }
  .ref td:nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
  .ref td.st { text-align: right; }
  footer.end { margin-top: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  .marker, .side .foot .bar i { transition: none; }
}
</style>

    }
    var label = C.stepWord + ' ' + (i + 1) + ' ' + C.ofWord + ' ' + N + ': ' + steps[i].nav;
    document.getElementById('where').textContent = C.youAreAt + ' ' + C.stepWord.toLowerCase() + ' ' + (i + 1) + ' ' + C.ofWord + ' ' + N;
    document.getElementById('mcur').textContent = label;
    var frac = 'scaleX(' + ((i + 1) / N) + ')';
    document.getElementById('sbar').style.transform = frac;
    document.getElementById('mb').style.transform = frac;
    /* stage strip: the highlight moves from the stage seen last to this one */
    var st = secs[i].querySelector('[data-strip]');
    if (st) {
      var to = +st.dataset.strip;
      if (!reduce.matches && lastStage !== to) {
        var hl = st.querySelector('.hl');
        hl.style.transition = 'none';
        st.style.setProperty('--i', lastStage);
        st.querySelectorAll('span').forEach(function (sp, k) { sp.classList.toggle('on', k === lastStage); });
        void hl.offsetWidth;
        hl.style.transition = '';
        requestAnimationFrame(function () {
          st.style.setProperty('--i', to);
          setTimeout(function () { st.querySelectorAll('span').forEach(function (sp, k) { sp.classList.toggle('on', k === to); }); }, 260);
        });
      }
      lastStage = to;
    }
  }
  function activeFromScroll() {
    var mid = innerHeight * 0.4, best = 0;
    for (var k = 0; k < secs.length; k++) { if (secs[k].getBoundingClientRect().top <= mid) best = k; }
    setActive(best);
  }
  addEventListener('scroll', function () { requestAnimationFrame(activeFromScroll); }, { passive: true });
  activeFromScroll();

  /* keyboard: Page Down, Page Up, arrows and space step through the sections on large screens */
  addEventListener('keydown', function (e) {
    if (!big.matches || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var dir = 0;
    if (e.key === 'PageDown' || e.key === 'ArrowDown' || (e.key === ' ' && !e.shiftKey && tag !== 'BUTTON' && tag !== 'A')) dir = 1;
    else if (e.key === 'PageUp' || e.key === 'ArrowUp' || (e.key === ' ' && e.shiftKey && tag !== 'BUTTON' && tag !== 'A')) dir = -1;
    if (!dir) return;
    var r = secs[cur].getBoundingClientRect();
    /* a section taller than the screen scrolls normally until its end is in view */
    if (dir > 0 && r.bottom > innerHeight + 4) return;
    var nxt = Math.max(0, Math.min(N - 1, cur + dir));
    if (dir < 0 && r.top < -4) nxt = cur;
    if (dir > 0 && nxt === cur) return;
    e.preventDefault();
    scrollTo({ top: secs[nxt].offsetTop, behavior: reduce.matches ? 'auto' : 'smooth' });
  });
})();
</script>
<script src="../variant-nav.js"></script>
</body>
