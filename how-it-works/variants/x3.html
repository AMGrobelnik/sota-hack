<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;

* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 15px; }
  .top .btn { padding: 7px 12px; }
  .step h1 { font-size: 36px; }
  .step h2 { font-size: 30px; }
}

/* steps (text column) */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.025em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 46px; }
.step h2 { font-size: 40px; }
.step p { margin: 0 0 13px; color: #c9d5e2; font-size: 18px; line-height: 1.48; max-width: 34ch; }
.step .kick { font-size: 16px; color: var(--signal); font-weight: 600; margin-bottom: 10px; }
.step .hint { color: var(--mute); font-size: 16px; margin-top: 22px; }
.step ul.lim { list-style: none; margin: 0 0 22px; padding: 0; }
.step ul.lim li { color: #dfe8f1; font-size: 18px; line-height: 1.42; padding: 10px 0; border-top: 1px solid var(--rule); max-width: 32ch; }
.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 4px 0 24px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 15px; color: #93a5ba; max-width: 34ch; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 28px 150px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam { scroll-snap-type: y mandatory; }
.cam .fig { display: none; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* region titles over the zoomed-out map: real type, in the clear band above each region */
#titles { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
#titles.on { opacity: 1; }
#titles p { position: absolute; margin: 0; font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -.01em; color: #fff; white-space: nowrap; }
.flow #titles { display: none; }

/* minimap */
#where { position: fixed; left: clamp(24px, 3vw, 44px); bottom: 28px; z-index: 20; }
#where svg { display: block; width: 200px; height: auto; }
.flow #where { display: none; }
#where .mr { fill: rgba(214, 228, 242, .07); stroke: rgba(214, 228, 242, .3); vector-effect: non-scaling-stroke; }
#where .mc { fill: rgba(91, 228, 155, .12); stroke: var(--signal); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

/* right rail: one dot per stop, on one line, grouped into chapters */
#rail { position: fixed; right: 0; top: var(--bar); bottom: 0; width: var(--rail); z-index: 25; }
.flow #rail { display: none; }
#rail .ch { position: absolute; right: 64px; margin: 0; font-size: 15px; line-height: 20px; color: var(--mute); text-align: right; white-space: nowrap; transform: translateY(-50%); transition: color .2s; }
#rail .ch.on { color: #fff; font-weight: 600; }

  ['spec', 'run', 'agent', 'tools', 'pipe', 'report', 'talk', 'checks', 'meas'].forEach(function (k) {
    var p = H('p', '', C.titles[k], titleBox);
    TITLES.push({ el: p, r: REG[k] });
  });

  // ---------- right rail ----------
  var rail = document.getElementById('rail');
  rail.setAttribute('aria-label', C.rail.label);
  var dots = [], chEls = [];
  var keyIdx = {}; STEPS.forEach(function (s, i) { keyIdx[s.key] = i; });
  STEPS.forEach(function (s, i) {
    var b = H('button', '', null, rail);
    b.type = 'button';
    b.setAttribute('aria-label', C.rail.stop.replace('{n}', i + 1).replace('{t}', N).replace('{title}', s.title));
    b.title = s.title;
    b.addEventListener('click', function () { go(i); });
    dots.push(b);
  });
  C.rail.chapters.forEach(function (ch) {
    var idx = ch.keys.map(function (k) { return keyIdx[k]; });
    var br = H('span', 'br', null, rail), lb = H('p', 'ch', ch.name, rail);
    br.setAttribute('aria-hidden', 'true'); lb.setAttribute('aria-hidden', 'true');
    chEls.push({ a: Math.min.apply(null, idx), b: Math.max.apply(null, idx), br: br, lb: lb });
  });
  function layoutRail() {
    var h = rail.clientHeight || (innerHeight - 56), sp = Math.min(34, (h - 140) / (N - 1)), top = Math.round((h - sp * (N - 1)) / 2) - 10;
    dots.forEach(function (b, i) { b.style.top = (top + i * sp) + 'px'; });
    chEls.forEach(function (c) {
      var ya = top + c.a * sp, yb = top + c.b * sp;
      c.br.style.top = (ya - 7) + 'px'; c.br.style.height = (yb - ya + 14) + 'px';
      c.br.style.display = c.a === c.b ? 'none' : '';
      c.lb.style.top = ((ya + yb) / 2) + 'px';
    });
  }

  // ---------- minimap ----------
  var mini = document.getElementById('mini');
  mini.setAttribute('viewBox', ALL.x + ' ' + ALL.y + ' ' + ALL.w + ' ' + ALL.h);
  ['spec', 'run', 'agent', 'tools', 'report', 'talk', 'checks', 'meas'].forEach(function (k) { var r = REG[k]; E('rect', { x: r.x, y: r.y, width: r.w, height: r.h, 'class': 'mr', rx: 40 }, mini); });
  E('rect', { x: X0, y: orchY, width: FULLW, height: orchH, 'class': 'mr', rx: 30 }, mini);
  for (var mi = 0; mi < 7; mi++) E('rect', { x: X0 + mi * PSTEP, y: Y0, width: PWID, height: PH, 'class': 'mr', rx: 30 }, mini);
  var mcam = E('rect', { 'class': 'mc', rx: 30 }, mini);

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1, FIT = [], raf = 0, cur = -1, isCam = null, RM = false;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  function fit(r, a) {
    var pad = 24, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }
    return { cx: x + w / 2, cy: y + h / 2, w: w };
  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STEPS.map(function (s) { return fit(s.rect, A); });
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    var st = STEPS[i];
    regions.forEach(function (r) { r.classList.toggle('hide', !st.whole && r.getAttribute('data-r') !== st.region); });
    links.classList.toggle('hide', !st.whole);
    orchG.classList.toggle('hide', st.stage != null);
    panels.forEach(function (p, k) {
      p.classList.toggle('on', st.stage === k);
      p.classList.toggle('hide', st.stage != null && st.stage !== k);
    });
    titleBox.classList.toggle('on', st.whole);
    dots.forEach(function (b, k) {
      if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
      b.classList.toggle('done', k < i);
    });
    chEls.forEach(function (c) { var on = i >= c.a && i <= c.b; c.br.classList.toggle('on', on); c.lb.classList.toggle('on', on); });
  }
  function frame() {
    raf = 0; if (!isCam) return;
    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    if (RM) f = Math.round(f);
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);
    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;
    var vx = cx - w / 2, vy = cy - h / 2;
    cam.setAttribute('viewBox', vx.toFixed(2) + ' ' + vy.toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2));
    var sc = vp.clientWidth / w;
    TITLES.forEach(function (T2) {
      T2.el.style.transform = 'translate(' + ((T2.r.x - vx) * sc).toFixed(1) + 'px,' + ((T2.r.y - vy) * sc - 38).toFixed(1) + 'px)';
    });
    mcam.setAttribute('x', vx); mcam.setAttribute('y', vy); mcam.setAttribute('width', w); mcam.setAttribute('height', h);
    setCurrent(Math.round(f));
  }
  function req() { if (!raf) raf = requestAnimationFrame(frame); }
  function go(n) { window.scrollTo({ top: n * unit(), behavior: RM ? 'auto' : 'smooth' }); }
  addEventListener('scroll', req, { passive: true });
  addEventListener('resize', function () { applyMode(); });
  // Up, Down, Page Up, Page Down, Space, Home and End step through the stops.
  // Left and Right are left alone: the shared variant switcher uses them.
  addEventListener('keydown', function (e) {
    if (!isCam || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;
    if (k === ' ' && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
    e.preventDefault();
    var here = Math.round(scrollY / unit());
    go(Math.max(0, Math.min(N - 1, here + d)));
  });

  // one wheel or trackpad gesture moves one stop; momentum after it is absorbed
  var lock = 0, lastW = 0, acc = 0;
  addEventListener('wheel', function (e) {
    if (!isCam || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gap = now - lastW; lastW = now;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (now < lock) { lock = Math.max(lock, now + 160); return; }
    if (gap > 220) acc = 0;
    acc += dy;
    if (Math.abs(acc) >= 24) {
      var here = Math.round(scrollY / unit());
      go(Math.max(0, Math.min(N - 1, here + (acc > 0 ? 1 : -1))));
      acc = 0; lock = now + 650;
    }
  }, { passive: false });

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function applyMode() {
    RM = mqRm.matches;
    var want = mqCam.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');
      if (!want) { panels.concat(regions, [links, orchG]).forEach(function (p) { p.classList.remove('on', 'hide'); }); cur = -1; }
    }
    if (isCam) { measureVp(); layoutRail(); cur = -1; req(); }
  }
  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
  window.__hiw = { REG: REG, N: N, CH: CH };
})();
</script>
