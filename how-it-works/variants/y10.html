  .top nav { gap: 10px; }
  .top nav a.home { display: none; }
  .top nav a { font-size: 14px; }
  .top .btn { padding: 7px 11px; }
  .mode button { padding: 7px 10px; font-size: 14px; }
}

/* the narration */
main { padding-top: var(--bar); }
.step { position: relative; }
.kick { margin: 0 0 14px; font-size: 15px; color: var(--signal); font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.kick .tag { color: var(--mute); font-weight: 500; }
.kick .plink { color: var(--mute); font-weight: 500; font-size: 14px; text-underline-offset: 3px; }
.kick .plink:hover { color: #fff; }
.step h1, .step h2 { margin: 0 0 18px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.04; text-wrap: balance; }
.th { font-size: clamp(42px, 4.3vw, 66px); }
.sub { margin: 0; color: #c4d1df; font-size: clamp(20px, 1.7vw, 25px); line-height: 1.36; max-width: 22ch; text-wrap: pretty; }
.rh { font-size: 36px; }
.rl p { margin: 0 0 12px; color: #c4d1df; font-size: 17.5px; line-height: 1.5; max-width: 40ch; }
.hint { color: var(--mute); font-size: 15px; margin: 26px 0 0; }
html.talk .r-only, html.read .t-only { display: none !important; }
ul.lim { list-style: none; margin: 0 0 22px; padding: 0; }
ul.lim li { color: #dfe8f1; font-size: 17.5px; line-height: 1.42; padding: 10px 0; border-top: 1px solid var(--rule); max-width: 36ch; }
ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 26px 0 26px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 14px; color: #8597ad; margin-top: 8px; }

/* read-mode detail */
.detail { font-size: 16px; color: #c4d1df; margin-top: 18px; }
.detail h3 { font-size: 16px; color: #fff; margin: 22px 0 8px; font-weight: 650; }
.detail h3:first-child { margin-top: 4px; }
.detail p { margin: 0 0 10px; max-width: 46ch; }
.detail dl { margin: 0; }
.detail dt { color: var(--mute); font-size: 14px; margin-top: 12px; }
.detail dd { margin: 3px 0 0; }
.detail ol, .detail ul { margin: 0; padding-left: 22px; }
.detail li { margin: 6px 0; }
.detail table { width: 100%; border-collapse: collapse; font-size: 15px; }
.detail th { text-align: left; color: var(--mute); font-weight: 600; font-size: 13.5px; padding: 4px 8px 4px 0; }
.detail td { vertical-align: top; padding: 6px 8px 6px 0; border-top: 1px solid var(--rule); }
.detail code { font-family: var(--mono); font-size: 13.5px; color: #bfe9d2; overflow-wrap: anywhere; }
.detail .src { font-family: var(--mono); font-size: 13px; color: #8fa2b8; overflow-wrap: anywhere; }
.toc { list-style: none; padding: 0 !important; margin: 0; columns: 2; column-gap: 20px; }
.toc li { margin: 0 0 6px !important; break-inside: avoid; }
.toc a { text-decoration: none; color: #dbe5ef; }
.toc a:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }
.toc b { display: inline-block; min-width: 1.8em; color: var(--signal); font-weight: 650; }

/* camera mode */
.cam main { width: var(--col); }
.cam.talk .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 170px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam.talk .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam.talk { scroll-snap-type: y mandatory; }
.cam.read .step { min-height: calc(100vh - var(--bar)); padding: 56px 30px 96px clamp(24px, 3vw, 44px); border-bottom: 1px solid var(--rule); }
.cam .fig { display: none; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#where { position: fixed; left: clamp(24px, 3vw, 44px); bottom: 22px; z-index: 20; }
.read #where { display: none; }
#where svg { display: block; width: 190px; height: auto; }
#where .wl { margin: 7px 0 0; font-size: 13.5px; color: var(--mute); max-width: 190px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#where .wl b { color: #dbe5ef; font-weight: 600; }
.flow #where { display: none; }
#where .mr { fill: rgba(214, 228, 242, .07); stroke: rgba(214, 228, 242, .32); vector-effect: non-scaling-stroke; }
#where .mc { fill: rgba(91, 228, 155, .12); stroke: var(--signal); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

/* the rail: one dot per stop, on the right edge */
@media (min-width: 960px) { :root { --rail: 58px; } }
#rail { position: fixed; right: 0; top: var(--bar); bottom: 0; width: var(--rail); z-index: 25; border-left: 1px solid var(--rule); background: var(--night); }
#rail ol { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); margin: 0; padding: 0; list-style: none; }
#rail ol::before { content: ""; position: absolute; top: 14px; bottom: 14px; left: 28.5px; width: 1px; background: rgba(214, 228, 242, .18); }
#rail li { margin: 0; padding: 0; }
#rail button { position: relative; display: block; width: 100%; height: min(30px, calc((100vh - 150px) / 19)); margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
#rail .dot { position: absolute; left: 24px; top: 50%; margin-top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--night); border: 1.5px solid rgba(214, 228, 242, .55); transition: transform .25s ease, background .25s ease; }
#rail .lab { position: absolute; right: 50px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 15px; line-height: 1; color: #fff; background: #1a2d47; border: 1px solid rgba(214, 228, 242, .3); border-radius: 8px; padding: 7px 10px; opacity: 0; pointer-events: none; transition: opacity .15s ease; }
#rail .lab b { color: var(--signal); margin-right: 6px; }
#rail button:hover .lab, #rail button:focus-visible .lab { opacity: 1; }
#rail button:focus-visible { outline: none; }
#rail button:focus-visible .dot { outline: 2px solid var(--signal); outline-offset: 4px; }
#rail button[aria-current="step"] .dot { background: var(--signal); border-color: var(--signal); transform: scale(1.5); }
#rail button.past .dot { background: rgba(91, 228, 155, .35); border-color: rgba(91, 228, 155, .6); }
#rcount { position: absolute; left: 0; right: 0; bottom: 14px; margin: 0; text-align: center; font-size: 12.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
@media (max-width: 959px) { #rail { display: none; } }

/* flow mode: reduced motion, small screens */
.flow main { padding-right: var(--rail); }
.flow .step { padding: clamp(40px, 7vh, 72px) clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--rule); }
.flow .fig { margin: 24px 0 0; border: 1px solid var(--rule); border-radius: 12px; background: #0d1726; overflow: hidden; }
.flow .fig svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 140px); }
@media (min-width: 1000px) {
  .flow .step { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 0 44px; align-items: start; }
  .flow .step > .fig { grid-column: 2; grid-row: 1 / span 6; margin: 0; }
  .flow .step > :not(.fig) { grid-column: 1; }
}
@media (max-width: 560px) {
  .th { font-size: 40px; }
  .rh { font-size: 31px; }
  .toc { columns: 1; }
}

/* the map */
.mapsvg { font-family: var(--f); text-rendering: geometricPrecision; }
.mapsvg * { vector-effect: non-scaling-stroke; }

.bx { fill: #16263c; stroke: rgba(214, 228, 242, .22); stroke-width: 1; }
.bx2 { fill: #122136; stroke: rgba(214, 228, 242, .16); stroke-width: 1; }
.bxg { fill: rgba(91, 228, 155, .07); stroke: rgba(91, 228, 155, .5); stroke-width: 1; }
.bxa { fill: rgba(255, 184, 107, .08); stroke: rgba(255, 184, 107, .55); stroke-width: 1; }
.bxd { fill: rgba(201, 163, 196, .08); stroke: rgba(201, 163, 196, .55); stroke-width: 1; }
.rule { stroke: rgba(214, 228, 242, .14); stroke-width: 1; fill: none; }
.ln { fill: none; stroke: rgba(214, 228, 242, .42); stroke-width: 1.4; }
.lng { fill: none; stroke: rgba(91, 228, 155, .55); stroke-width: 1.4; }
.lna { fill: none; stroke: rgba(255, 184, 107, .6); stroke-width: 1.4; stroke-dasharray: 7 5; }
.lnd { fill: none; stroke: rgba(214, 228, 242, .35); stroke-width: 1.3; stroke-dasharray: 5 5; }
.ah { fill: rgba(214, 228, 242, .62); }
.ahg { fill: var(--signal); }
.aha { fill: var(--amber); }
.dotg { fill: var(--signal); }
.dotm { fill: rgba(91, 228, 155, .28); stroke: var(--signal); stroke-width: 1; }
.chip rect { fill: #0f1a2a; stroke: rgba(91, 228, 155, .42); stroke-width: 1; }
.chip.any rect { stroke: rgba(214, 228, 242, .3); }
.panel, .rg { transition: opacity .4s ease; }
.rg.dim, .panel.dim { opacity: .28; }
.panel .hd { fill: #1a2d47; stroke: rgba(214, 228, 242, .3); stroke-width: 1.2; transition: stroke .4s ease; }
.panel .body { fill: #13233a; stroke: rgba(214, 228, 242, .18); stroke-width: 1; }
.panel.on .hd { stroke: var(--signal); stroke-width: 2.4; }
.panel.on .num { fill: var(--signal); }
.num { fill: rgba(91, 228, 155, .22); transition: fill .4s ease; }

.ov { opacity: var(--ov, 0); pointer-events: none; }
.ov circle { fill: rgba(15, 26, 42, .94); stroke: var(--signal); stroke-width: 2.5; }
.ov text { fill: #fff; font-weight: 700; }
@media (prefers-reduced-motion: reduce) {
  .panel, .rg, #rail .dot, #rail .lab { transition: none; }
}
