<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 400px;
  --rail: 76px;
  --bar: 56px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 15px; }
  .top .btn { padding: 7px 12px; }
}

/* text column */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 46px; }
.step h2 { font-size: 40px; }
.step p { margin: 0 0 14px; color: #c4d1df; font-size: 18px; line-height: 1.48; max-width: 36ch; }
.step .kick { font-size: 16px; color: var(--signal); font-weight: 600; margin-bottom: 10px; }
.step .hint { color: var(--mute); font-size: 16px; margin-top: 22px; }
.step ul.lim { list-style: none; margin: 0 0 24px; padding: 0; }
.step ul.lim li { color: #dfe8f1; font-size: 18px; line-height: 1.42; padding: 10px 0; border-top: 1px solid var(--rule); max-width: 34ch; }
.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 4px 0 24px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; font-size: 16px; }
.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 15px; color: #94a6bb; max-width: 34ch; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: var(--bar) 30px 24px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); }
html.cam { scroll-snap-type: y mandatory; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport, .flow #rail { display: none; }

/* tags under clusters, overview only */
#tags { position: absolute; inset: 0; pointer-events: none; }
#tags span { position: absolute; transform: translateX(-50%); text-align: center; font-size: 15px; font-weight: 600; line-height: 1.25; font-variant-caps: all-small-caps; letter-spacing: .09em; color: #c9d6e3; white-space: normal; width: max-content; }

/* right rail: one dot per stop */
#rail { position: fixed; right: 0; top: var(--bar); bottom: 0; width: var(--rail); z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px solid var(--rule); background: var(--night); }

#rail button::before { content: ""; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 1.5px solid rgba(214, 228, 242, .55); box-sizing: border-box; }

#rail button:hover::before { border-color: #fff; }
#rail button:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
#rail .lab { position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 15px; font-weight: 600; color: #fff; background: var(--deep); border: 1px solid rgba(214, 228, 242, .3); border-radius: 8px; padding: 5px 10px; opacity: 0; pointer-events: none; }
#rail button:hover .lab, #rail button:focus-visible .lab { opacity: 1; }
#rail .cnt { margin-top: 16px; font-size: 15px; font-weight: 600; color: #dbe5ef; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.2; }

/* flow mode: small screens, a plain stacked version */
.flow .step { padding: clamp(36px, 7vh, 64px) clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--rule); }
.flow .detail { margin-top: 18px; max-width: 72ch; }
.detail { font-size: 16px; color: #c4d1df; }
.detail h3 { font-size: 17px; color: #fff; margin: 18px 0 6px; font-weight: 650; }
.detail dl { margin: 0; }
.detail dt { color: var(--mute); font-size: 15px; margin-top: 10px; }
.detail dd { margin: 2px 0 0; }
.detail ol, .detail ul { margin: 0; padding-left: 20px; }
.detail li { margin: 4px 0; }
.detail table { width: 100%; border-collapse: collapse; font-size: 15px; }
.detail th { text-align: left; color: var(--mute); font-weight: 600; font-size: 15px; padding: 4px 6px 4px 0; }
.detail td { vertical-align: top; padding: 5px 6px 5px 0; border-top: 1px solid var(--rule); }
.detail code { font-family: var(--mono); font-size: 15px; color: #bfe9d2; overflow-wrap: anywhere; }

.bx2 { fill: #122136; stroke: rgba(214, 228, 242, .18); stroke-width: 1; }
.bxg { fill: rgba(91, 228, 155, .07); stroke: rgba(91, 228, 155, .55); stroke-width: 1; }

.pt text { transition: opacity .35s ease; }

.ovw .pt.sil .bxg, .ovw .pt.sil .hd { stroke: rgba(91, 228, 155, .5) !important; }
.wire path { transition: stroke .35s ease, fill .35s ease; }
.wire.sil path.ln, .wire.sil path.lng { stroke: rgba(214, 228, 242, .12); }

}
