:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.pg { font-size: 15px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }

/* text column */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 18px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 42px; }
.step h2 { font-size: 38px; }
.step p { margin: 0 0 12px; color: #c4d1df; font-size: 17.5px; line-height: 1.48; max-width: 36ch; }
.step p.src { font-size: 14.5px; }
.step p.src a { color: var(--signal); text-underline-offset: 3px; }
.step .kick { font-size: 16px; color: var(--signal); font-weight: 600; margin-bottom: 10px; }
.step .hint { color: var(--mute); font-size: 15px; margin-top: 18px; }
.leg { list-style: none; margin: 14px 0 6px; padding: 0; }
.leg .lt { font-size: 15px; color: var(--mute); margin: 0 0 8px; }
.leg li { display: flex; align-items: center; gap: 12px; font-size: 16px; color: #dbe5ef; padding: 4px 0; line-height: 1.3; }
.leg svg { flex: none; width: 44px; height: 22px; }
ul.lim { list-style: none; margin: 0 0 22px; padding: 0; }
ul.lim li { color: #dfe8f1; font-size: 17.5px; line-height: 1.42; padding: 10px 0; border-top: 1px solid var(--rule); max-width: 34ch; }
ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 8px 0 26px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 15px; color: #9aabc0; max-width: 36ch; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 26px 0 clamp(22px, 2.6vw, 40px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam { scroll-snap-type: y mandatory; }
.cam .fig { display: none; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; }

/* right rail: one dot per stop */
#rail { position: fixed; right: 0; top: var(--bar); bottom: 0; width: var(--rail); z-index: 25; background: var(--night); display: flex; align-items: center; justify-content: center; }
#rail ol { list-style: none; margin: 0; padding: 0; height: min(760px, calc(100vh - var(--bar) - 48px)); display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative; }
#rail ol::before { content: ""; position: absolute; left: 50%; top: 13px; bottom: 13px; width: 1.5px; margin-left: -.75px; background: rgba(91, 228, 155, .28); }
#rail li { position: relative; width: 26px; height: 26px; flex: none; }
#rail a { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: var(--night); border: 1.5px solid rgba(214, 228, 242, .45); color: #c4d1df; font: 650 13px/1 var(--f); font-variant-numeric: tabular-nums; text-decoration: none; }
#rail a.ov::before { content: ""; width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid currentColor; }
#rail a:hover { border-color: #fff; color: #fff; }
#rail a.past { border-color: rgba(91, 228, 155, .7); color: #bfe9d2; }
#rail a[aria-current="step"] { background: var(--signal); border-color: var(--signal); color: #062418; }
#rail a[aria-current="step"].ov::before { border-color: #062418; }
#rail .tip { position: absolute; right: 38px; top: 50%; transform: translateY(-50%); white-space: nowrap; background: #1a2d47; color: #fff; border: 1px solid rgba(214, 228, 242, .3); border-radius: 8px; padding: 6px 10px; font: 600 15px/1.2 var(--f); opacity: 0; pointer-events: none; transition: opacity .15s ease; }
#rail a:hover + .tip, #rail a:focus-visible + .tip { opacity: 1; }
.flow #rail { display: none; }

/* flow mode: small screens and reduced motion */
.flow .step { padding: clamp(32px, 6vh, 56px) clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--rule); }
.flow .step p, .flow .step h1, .flow .step h2 { max-width: 40rem; }
.flow .fig { margin: 22px 0 0; border: 1px solid var(--rule); border-radius: 12px; background: #0d1726; overflow: hidden; }
.flow .fig svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 140px); }
.flow .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 1000px) {
  .flow .step { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 40px; align-items: center; }
  .flow .step > .fig { grid-column: 2; grid-row: 1 / span 9; margin: 0; }
  .flow .step > :not(.fig) { grid-column: 1; }
}
@media (max-width: 999px) {
  .flow .detail { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal; margin-top: 18px; }
}
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 14px; }
  .top .btn { padding: 7px 12px; }
  .step h1 { font-size: 36px; }
  .step h2 { font-size: 30px; }
}
.detail { font-size: 16px; color: #c4d1df; max-width: 44rem; }
.detail h3 { font-size: 17px; color: #fff; margin: 18px 0 6px; font-weight: 650; }
.detail dl { margin: 0; }
.detail dt { color: var(--mute); font-size: 15px; margin-top: 10px; }
.detail dd { margin: 2px 0 0; }
.detail ol, .detail ul { margin: 0; padding-left: 20px; }
.detail li { margin: 5px 0; }
.detail p { font-size: 16px; }
.detail table { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
.detail th { text-align: left; color: var(--mute); font-weight: 600; font-size: 14px; padding: 4px 6px 4px 0; }
.detail td { vertical-align: top; padding: 5px 6px 5px 0; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
.detail code { font-family: var(--mono); font-size: 14px; color: #bfe9d2; overflow-wrap: anywhere; }

.mapsvg { font-family: var(--f); text-rendering: geometricPrecision; }

  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  function fit(r, a) {
    var z0 = Math.min(vp.clientWidth / r.w, vp.clientHeight / r.h) || 1;
    var pad = 18 / z0, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;

    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;

  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }

    if (i === cur) return; cur = i;
    var st = STEPS[i];
    panels.forEach(function (p, k) {
      p.classList.toggle('on', st.stage === k);
      p.classList.toggle('dim', st.stage != null && st.stage !== k);
    });
    regions.forEach(function (r) { r.classList.toggle('dim', st.focus.length > 0 && st.focus.indexOf(r.getAttribute('data-r')) < 0); });

    var a = FIT[i], b = FIT[i + 1];

    var ae = document.activeElement;

      var here = Math.round(scrollY / unit());

      acc = 0; lock = now + 650;
    }
  }, { passive: false });
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-go]');
    if (!a || !isCam) return;
    e.preventDefault(); go(+a.getAttribute('data-go'));
  });

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 600px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function applyMode() {
    var want = mqCam.matches && !mqRm.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');

    }
    if (isCam) { measureVp(); req(); }
  }
  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
})();
</script>
