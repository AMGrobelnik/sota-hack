.btn.pri { background: var(--signal); }
.btn:hover { background: var(--ink); color: var(--paper); }
.hint { margin-top: 22px; font-size: 14px; color: var(--ink2); }
.dl-title { font-size: 13px; color: var(--ink2); margin: 0 0 6px; }
.dlist td a { text-decoration: none; }
.dlist td a:hover { text-decoration: underline; }

/* sheet 01 */
.idea-grid { display: grid; grid-template-columns: 230px 34px minmax(0, 1fr) 34px 250px; align-items: start; position: relative; z-index: 1; }
.card { border: 1.25px solid var(--ink); background: #fbfcfc; padding: 10px 12px 12px; font-size: 14px; }
.card + .card { margin-top: 14px; }
.card h3 { margin: 0 0 6px; font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.card .quote { font-size: 17px; line-height: 1.35; font-weight: 600; margin: 0; }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13.5px; }
.card dt { font-weight: 600; }
.card dd { margin: 0; color: var(--ink2); }
.card.spec ol { margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
.card.spec li { display: flex; gap: 8px; align-items: flex-end; padding: 4px 0 2px; }
.card.spec li::after { content: ""; flex: 1; border-bottom: 1px solid rgba(19, 32, 51, .45); min-width: 20px; margin-bottom: 4px; }
.card.spec p { margin: 8px 0 0; font-size: 13px; color: var(--ink2); }
.arrow { display: flex; align-items: center; justify-content: center; padding-top: 34px; }
.arrow svg { width: 30px; height: 14px; }

/* sheet 02 */
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; position: relative; z-index: 1; }
.panel h3 { margin: 0 0 10px; font-size: 16px; font-weight: 650; }
.panel .dg { border: 1px solid var(--ink); background: rgba(238, 241, 242, .86); padding: 16px; }
.note { font-size: 14.5px; color: var(--ink2); margin: 10px 0 0; }

/* sheet 11 */
.agent-grid { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 30px; align-items: center; position: relative; z-index: 1; }
.dt.layers td:first-child { width: 2.2em; text-align: center; font-weight: 650; }
.dt.layers td:nth-child(2) { font-weight: 600; white-space: nowrap; }
.rule { border: 1.5px solid var(--ink); background: #fbfcfc; padding: 12px 16px; font-size: 17px; line-height: 1.4; font-weight: 600; margin: 0; position: relative; z-index: 1; }

/* sheet 12 */
.tgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 14px; align-items: start; position: relative; z-index: 1; }
.tcol { display: flex; flex-direction: column; gap: 10px; }
.tgroup { border: 1px solid var(--ink); background: var(--paper); }
.tgroup h3 { margin: 0; padding: 5px 9px; font-size: 13.5px; font-weight: 650; background: #e4e9ec; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; }
.tgroup h3 span { font-weight: 500; color: var(--ink2); }
.tgroup ul { margin: 0; padding: 0; list-style: none; }
.tgroup li { padding: 4px 9px 5px; border-top: 1px solid rgba(19, 32, 51, .2); font-size: 12.5px; line-height: 1.3; }
.tgroup li:first-child { border-top: 0; }
.tgroup .tl { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tgroup .tool { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.tgroup .st { font-size: 11.5px; color: var(--green-ink); white-space: nowrap; }
.tgroup .ds { color: var(--ink2); }

/* sheet 13 */
.marks { display: grid; gap: 10px; }
.mark { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; border: 1px solid var(--ink); background: #fbfcfc; padding: 10px 12px; }
.mark b { font-size: 17px; }
.mark p { margin: 0; font-size: 15.5px; color: var(--ink2); }
.sample { display: inline-block; margin-top: 6px; font-size: 15px; font-weight: 600; color: var(--ink); padding: 2px 8px; }
.sample.estimate { border: 1.25px dashed var(--amber-ink); color: var(--amber-ink); background: #fff3e4; }
.sample.simulated { border: 1.25px solid var(--ink2); color: var(--ink2); background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(19, 32, 51, .07) 6px 7px); }
.sample.measured { border: 1.25px solid var(--ink); }

/* sheet 14 */
.dt.meas td:first-child { font-size: 27px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; width: 1%; }
.dt.meas td { font-size: 17px; padding: 12px 14px; }
.dt.meas td:last-child { color: var(--ink2); width: 32%; }

/* sheet 15 */
.notes { margin: 0; padding-left: 1.4em; font-size: clamp(18px, 1.6vw, 23px); line-height: 1.4; max-width: 60ch; position: relative; z-index: 1; }
.notes li { padding: 6px 0; }
.foot { margin-top: auto; position: relative; z-index: 1; font-size: 14px; color: var(--ink2); }

.body { display: flex; flex-direction: column; gap: 14px; }

/* sheet index, in the right margin */
.idx { display: none; }

/* ---------- presenting size: one sheet per screen ---------- */
@media (min-width: 1000px) and (min-height: 620px) {
  .wrap { height: 100vh; height: 100svh; padding: 14px 48px 14px 14px; }
  .sheet { height: 100%; padding: 30px 40px 90px; gap: clamp(12px, 2.2vh, 22px); overflow: hidden; }
  .tb { position: absolute; right: 5px; bottom: 5px; width: 560px; border-right: 0; border-bottom: 0; }
  .body { flex: 1 1 auto; min-height: 0; justify-content: center; gap: clamp(12px, 2.2vh, 22px); }
  table.dt { font-size: 16px; }
  .dt th { font-size: 13px; }
  .dg.fill { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
  .dg.fill svg { width: auto; height: auto; max-width: 100%; max-height: 100%; }
  .stage .dg.fill svg { width: 100%; }
  .foot { position: absolute; left: 40px; bottom: 30px; margin: 0; max-width: calc(100% - 640px); }
  .idx { display: flex; position: fixed; right: 0; top: 0; bottom: 0; width: 48px; flex-direction: column; align-items: center; justify-content: center; gap: 4px; z-index: 20; margin: 0; padding: 0; list-style: none; }
  .idx a { display: block; width: 26px; padding: 3px 0; }
  .idx a::before { content: ""; display: block; height: 1.5px; width: 10px; margin-left: auto; background: var(--mute); transition: width .2s, background .2s; }
  .idx a[aria-current]::before { width: 22px; background: var(--signal); height: 2.5px; }
  .idx a:hover::before { background: #fff; }
  .idx a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .idx .cur { color: #dbe5ef; font-size: 12px; font-weight: 600; margin-top: 10px; text-align: center; line-height: 1.2; white-space: pre-line; }
}

/* ---------- narrow screens ---------- */
@media (max-width: 760px) {
  .dg svg.v-wide { display: none; }
  .dg svg.v-narrow { display: block; }
  .wrap { padding: 6px; }
  .sheet { padding: 18px 14px 14px; gap: 14px; }
  .head { gap: 12px; }
  .cover-main, .two, .agent-grid { grid-template-columns: 1fr; gap: 22px; }
  .idea-grid { grid-template-columns: 1fr; }
  .arrow { padding: 6px 0; }
  .arrow svg { transform: rotate(90deg); }
  .spec3 { grid-template-columns: 1fr; }
  .sk { grid-template-columns: 1fr; }
  .sk li { flex-wrap: wrap; gap: 2px 10px; }
  .spec3 > div { border-left: 0; border-top: 1px solid var(--ink); }
  .spec3 > div:first-child { border-top: 0; }
  .tgrid { grid-template-columns: 1fr; }
  .tcol + .tcol { margin-top: 10px; }
  .tb { grid-template-columns: 1fr auto; }
  .tb > div:first-child { display: none; }
  .tb > div:nth-child(2) { border-left: 0; }
  .strip { grid-template-columns: repeat(7, auto); }
  .strip li { font-size: 10.5px; padding: 6px 2px; text-overflow: clip; }
  .strip li span { display: none; }
  .dt { font-size: 14px; }
  .dt th, .dt td { padding: 6px 7px; }
  .dt.meas thead { display: none; }
  .dt.meas, .dt.meas tbody, .dt.meas tr, .dt.meas td { display: block; width: auto; }
  .dt.meas tr { border: 1px solid var(--ink); border-top: 0; }
  .dt.meas tr:first-child { border-top: 1px solid var(--ink); }
  .dt.meas td { border: 0; font-size: 15px; padding: 4px 12px; }
  .dt.meas td:first-child { font-size: 21px; white-space: normal; width: auto; padding-top: 10px; }
  .dt.meas td:last-child { padding-bottom: 10px; }
  .dt.meas td:last-child { width: auto; }
  .dt.layers td:nth-child(2) { white-space: normal; }
  .mark { grid-template-columns: 1fr; gap: 4px; }
  .panel .dg { padding: 10px; }
}
@media (min-width: 761px) and (max-width: 999px) {
  .tgrid { grid-template-columns: 1fr 1fr; }
  .idea-grid { grid-template-columns: 1fr; }
  .arrow { padding: 6px 0; }
  .arrow svg { transform: rotate(90deg); }
}

      h('table', { 'class': 'dt' }, h('thead', null, h('tr', null, K.head.map(function (x) { return h('th', { scope: 'col', text: x }); }))), tb),

  (function () {

  /* ---------- sheet index and stepping ---------- */

  nav.setAttribute('aria-label', U.navLabel);

  }

    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
