<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 420px;
  --bar: 56px;
  --rail: 72px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 18px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 15px; }
  .top .btn { padding: 7px 12px; }
}

/* the left column */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 48px; }
.step h2 { font-size: 42px; }
.step p { margin: 0 0 14px; color: #c4d1df; font-size: 19px; line-height: 1.45; max-width: 34ch; }
.step .kick { font-size: 17px; color: var(--signal); font-weight: 600; margin-bottom: 12px; }
.step .hint { color: var(--mute); font-size: 16px; margin-top: 22px; }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 10px 0 26px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 17px; }
footer { font-size: 15px; color: #8fa2b8; max-width: 34ch; }
@media (max-width: 560px) { .step h1 { font-size: 38px; } .step h2 { font-size: 32px; } }

/* camera mode: the map beside the column, the line on the right */
html.cam { scroll-snap-type: y mandatory; }
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 40px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
.cam .fig { display: none; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* the right rail: the route line straightened */
#rail { position: fixed; right: 0; top: var(--bar); bottom: 0; width: var(--rail); z-index: 25; border-left: 1px solid var(--rule); background: var(--night); }
.flow #rail { display: none; }
#rail ol { list-style: none; margin: 0; padding: 0; }

      var part = k === 'tools1' ? 1 : 2, TO = C.tools;
      TO.groups.filter(function (g) { return g.part === part; }).forEach(function (g) {
        H('h3', '', g.name + ' (' + g.tools.length + ')', box);
        var t = H('table', '', null, box), tr = H('tr', '', null, H('thead', '', null, t));
        TO.head.forEach(function (h) { H('th', '', h, tr).scope = 'col'; });
        var tb = H('tbody', '', null, t);
        g.tools.forEach(function (x) { var r = H('tr', '', null, tb); H('code', '', x[0], H('td', '', null, r)); H('td', '', x[1], r); H('td', '', x[2][0] === 'any' ? TO.anyWord : x[2].join(', '), r); });
      });
    } else if (k === 'reporting') {
      var RP = C.reporting;
      H('p', '', RP.nodes.map(function (n) { return n.name + ' (' + n.sub + ')'; }).join(', then '), box);
      H('h3', '', RP.helperTitle, box); H('p', '', RP.helperNote, box); var u = H('ul', '', null, box); RP.helper.forEach(function (h) { H('code', '', h, H('li', '', null, u)); });
      H('h3', '', RP.eventsTitle, box); H('p', '', null, box).appendChild(codes(RP.events));
      H('h3', '', RP.sumTitle, box); H('p', '', RP.sumModel, box); ul(box, RP.sums); H('p', '', RP.sumNote, box);
    } else if (k === 'talk') {
      var TK = C.talk; H('h3', '', TK.streamTitle, box); ul(box, TK.lines.map(function (l) { return l.who + ': ' + l.text; }));
      dl(box, TK.points.map(function (p) { return [p.name, p.text]; }));
    } else if (k === 'checks') {
      var CK = C.checks; H('h3', '', CK.levelsTitle, box);
      ul(box, CK.levels.map(function (l) { return l.name + '. ' + l.text + (l.tool ? ' (' + l.tool + ')' : ''); }), 'ol'); H('p', '', CK.levelNote, box);
      H('h3', '', CK.splitTitle, box); H('p', '', CK.sets.join(', ') + '. ' + CK.splitNote, box);
    } else if (k === 'numbers') {
      var NU = C.numbers; H('h3', '', NU.title, box); H('p', '', NU.intro, box);
      dl(box, NU.classes.map(function (c) { return [c.name, c.text]; })); H('p', '', NU.excluded, box);
      H('h3', '', NU.notTitle, box); H('p', '', NU.not, box);
      H('h3', '', NU.marksTitle, box); dl(box, NU.marks.map(function (m) { return [m.kind, m.text]; }));
    } else if (k === 'measured') {
      var ME = C.measured; dl(box, ME.rows.map(function (r) { return [r.fig, ME.head[1] + ': ' + r.scope]; })); H('p', '', ME.note, box);
    } else if (k === 'limits') {
      ul(box, C.limits.items);
    }
  }
  var sections = STOPS.map(function (st, i) {
    var sec = H('section', 'step', null, main);
    sec.id = 'stop-' + st.key;
    if (st.kicker) H('p', 'kick', st.kicker, sec);
    var h = H(i === 0 ? 'h1' : 'h2', '', st.title, sec); h.id = 'h-' + st.key; sec.setAttribute('aria-labelledby', h.id);
    st.lines.forEach(function (l) { H('p', '', l, sec); });
    if (st.hint) H('p', 'hint', st.hint, sec);
    if (st.key === 'limits') {
      var a = H('div', 'acts', null, sec);
      var b1 = H('a', 'btn', C.nav.dashboard, a); b1.href = '../../dashboard/';
      var b2 = H('a', '', C.nav.home, a); b2.href = '../../';
      H('footer', '', C.footer, sec);
    }
    // the same map, cropped to this stop (shown on small screens)
    var fig = H('figure', 'fig', null, sec);
    var r = st.rect, pad = Math.max(8, 0.02 * r.w);
    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);
    if (st.whole) { // the overview: a copy with no text and the line drawn
      var cl = map.cloneNode(true); cl.removeAttribute('id'); cl.setAttribute('class', 'ovclone'); fs.appendChild(cl);
    } else E('use', { href: '#map' }, fs);
    var dbox = H('div', 'detail', null, sec);
    detail(st, dbox);
    return sec;
  });

  // ---------- the right rail ----------
  var rail = document.getElementById('rail'), list = document.getElementById('railList'), tip = document.getElementById('tip');
  rail.setAttribute('aria-label', C.rail.label);
  var ln0 = H('span', 'ln0', null), ln1 = H('span', 'ln1', null);
  rail.insertBefore(ln1, list); rail.insertBefore(ln0, ln1);
  var BTN = STOPS.map(function (st, i) {
    var li = H('li', '', null, list), b = H('button', '', null, li);
    b.type = 'button';
    b.setAttribute('aria-label', C.rail.item.replace('{n}', i + 1).replace('{t}', TOTAL).replace('{title}', st.short));
    H('i', '', null, b);
    b.addEventListener('click', function () { go(i); });
    function show() { tip.textContent = st.short; tip.style.top = b.getBoundingClientRect().top + 16 + 'px'; tip.style.display = 'block'; }
    function hide() { tip.style.display = 'none'; }
    b.addEventListener('mouseenter', show); b.addEventListener('focus', show);
    b.addEventListener('mouseleave', hide); b.addEventListener('blur', hide);
    return b;
  });
  var RAILY = [];
  function layoutRail() {
    var h = rail.clientHeight || 1, t0 = 34, t1 = h - 74, step = (t1 - t0) / (N - 1);
    RAILY = STOPS.map(function (s, i) { return t0 + i * step; });
    BTN.forEach(function (b, i) { b.style.top = RAILY[i] + 'px'; });
    ln0.style.top = t0 + 'px'; ln0.style.height = (t1 - t0) + 'px';
    ln1.style.top = t0 + 'px';
  }

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null, shown = '';
  function fit(r, a) {
    var pad = 0.024 * Math.max(r.w, r.h), x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }
    return { cx: x + w / 2, cy: y + h / 2, w: w };
  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STOPS.map(function (s) { return fit(s.rect, A); });
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setVisible(keys) {
    var sig = keys.join('|'); if (sig === shown) return; shown = sig;
    var set = {}; keys.forEach(function (k) { set[k] = 1; });
    VIS.forEach(function (el) { el.classList.toggle('off', !set[el.getAttribute('data-v')]); });
  }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    BTN.forEach(function (b, k) {
      b.classList.toggle('cur', k === i); b.classList.toggle('done', k < i);
      if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    ln1.style.height = Math.max(0, RAILY[i] - RAILY[0]) + 'px';
    for (var k in STNEL) STNEL[k].classList.toggle('cur', k === STOPS[i].key);
  }
  function frame() {
    raf = 0; if (!isCam) return;
    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    if (mqRm.matches) f = Math.round(f);
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);
    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;
    cam.setAttribute('viewBox', (cx - w / 2).toFixed(2) + ' ' + (cy - h / 2).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2));
    var ow = (STOPS[i].whole ? 1 - t : 0) + (STOPS[i + 1].whole ? t : 0);
    cam.style.setProperty('--tx', (1 - ow).toFixed(3));
    cam.style.setProperty('--rt', ow.toFixed(3));
    var fr = f - i;
    if (fr < 0.02) setVisible(STOPS[i].show);
    else if (fr > 0.98) setVisible(STOPS[i + 1].show);
    else setVisible(STOPS[i].show.concat(STOPS[i + 1].show));
    setCurrent(Math.round(f));
  }
  function req() { if (!raf) raf = requestAnimationFrame(frame); }
  function go(n) {
    if (!isCam) { sections[n].scrollIntoView({ behavior: mqRm.matches ? 'auto' : 'smooth' }); return; }
    window.scrollTo({ top: n * unit(), behavior: mqRm.matches ? 'auto' : 'smooth' });
  }
  addEventListener('scroll', req, { passive: true });
  addEventListener('resize', function () { applyMode(); });
  // Up, Down, Page Up, Page Down, Space, Home and End step; Left and Right are left to the variant switcher
  addEventListener('keydown', function (e) {
    if (!isCam || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;
    if (k === ' ' && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
    e.preventDefault();
    var here = Math.round(scrollY / unit());
    go(Math.max(0, Math.min(N - 1, here + d)));
  });

  // one wheel or trackpad gesture moves one stop; momentum after it is absorbed
  var lock = 0, lastW = 0, acc = 0;
  addEventListener('wheel', function (e) {
    if (!isCam || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gap = now - lastW; lastW = now;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (now < lock) { lock = Math.max(lock, now + 160); return; }
    if (gap > 220) acc = 0;
    acc += dy;
    if (Math.abs(acc) >= 24) {
      var here = Math.round(scrollY / unit());
      go(Math.max(0, Math.min(N - 1, here + (acc > 0 ? 1 : -1))));
      acc = 0; lock = now + (mqRm.matches ? 300 : 650);
    }
  }, { passive: false });

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function applyMode() {
    var want = mqCam.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');
      if (!want) { VIS.forEach(function (el) { el.classList.remove('off'); }); shown = ''; cam.style.removeProperty('--tx'); cam.style.removeProperty('--rt'); cur = -1; }
    }
    if (isCam) { layoutRail(); measureVp(); cur = -1; req(); }
  }
  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
})();
</script>
