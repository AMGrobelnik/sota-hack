:root {

* { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; scroll-padding-top: 0; }
body { margin: 0; color: var(--ink); font: 400 16px/1.45 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
code, .mono { font-family: var(--m); font-size: .86em; letter-spacing: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* running header: the quiet position indicator */
.top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: var(--top); display: flex; align-items: center; gap: 18px; padding: 0 24px; background: var(--night); color: #e8eef5; border-bottom: 1px solid #000; }
.top :focus-visible { outline-color: var(--signal); }
.top .brand { font-weight: 650; font-size: 16px; text-decoration: none; color: #fff; white-space: nowrap; }
.top .brand span { font-weight: 500; color: var(--mute); margin-left: 8px; }
.ticks { position: relative; display: flex; gap: 2px; margin: 0; padding: 0; list-style: none; }
.ticks a { display: block; width: 26px; height: 22px; line-height: 22px; text-align: center; font: 500 11px/22px var(--m); color: var(--mute); text-decoration: none; border: 1px solid rgba(214, 228, 242, .22); position: relative; z-index: 1; }
.ticks a:hover { color: #fff; border-color: rgba(214, 228, 242, .5); }
.ticks a.on { color: var(--ink); font-weight: 700; border-color: var(--signal); }
.ticks .hl { position: absolute; z-index: 0; top: 0; left: 0; width: 26px; height: 22px; background: var(--signal); transform: translateX(var(--x, 0)); }
.motion .ticks .hl { transition: transform .35s cubic-bezier(.3, .7, .2, 1); }
.where { flex: 1; min-width: 0; font-size: 14px; color: #dbe5ef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.where b { font-family: var(--m); font-weight: 600; color: var(--signal); margin-right: 8px; font-size: 13px; }
.links { display: flex; align-items: center; gap: 16px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.links a { text-decoration: none; color: #dbe5ef; }
.links a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.links a.go { color: var(--night); background: var(--signal); padding: 4px 10px; }

/* one sheet per step */
.sheet { min-height: 100vh; padding: calc(var(--top) + 22px) 40px 22px; display: flex; flex-direction: column; }
.sheet + .sheet { border-top: 1px solid var(--line); }
.inner { width: 100%; max-width: 1340px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
.sh { display: grid; grid-template-columns: auto 1fr auto; gap: 0 18px; align-items: baseline; border-top: 3px solid var(--ink); padding-top: 10px; margin-bottom: 18px; }
.sh .no { font: 600 15px/1 var(--m); border: 1.5px solid var(--ink); padding: 6px 8px; align-self: start; min-width: 38px; text-align: center; }
.sh h2 { margin: 0; font-size: 30px; line-height: 1.12; font-weight: 650; letter-spacing: -.02em; }
.sh .doc { font: 500 12px var(--m); color: var(--soft); white-space: nowrap; }
.sh .lede { grid-column: 2 / 4; margin: 6px 0 0; font-size: 17px; color: var(--soft); max-width: 82ch; }
h3 { margin: 0 0 8px; font-size: 16px; font-weight: 650; letter-spacing: -.005em; }

/* ruled tables */
table { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.35; }
thead th { text-align: left; font-weight: 650; font-size: 13px; color: var(--ink); background: #dde3e8; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 6px 10px; }
td { border-bottom: 1px solid var(--line); padding: 7px 10px; vertical-align: top; }
tbody tr:last-child td { border-bottom: 1px solid var(--ink); }
td code { white-space: nowrap; }
table.chars, table.lim { font-size: 17px; }
td.n, th.n { font-family: var(--m); font-size: 13px; white-space: nowrap; width: 1%; }
.soft { color: var(--soft); }
.val { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mk { display: inline-block; font: 600 11.5px/1 var(--m); padding: 3px 6px; border: 1px solid var(--ink); color: var(--ink); }
.mk.est { background: var(--amber); }
.mk.sim { background: var(--dusk); }
.mk.meas { background: transparent; border-style: dashed; color: var(--soft); }
.fig { display: block; width: 100%; height: auto; }
.fig text { font-family: var(--f); fill: var(--ink); }
.fig .m { font-family: var(--m); }

/* cover */
.cover .inner { gap: 20px; }
.tb { display: grid; grid-template-columns: 1.5fr 1fr; border: 2px solid var(--ink); }
.tb .id { background: var(--night); color: #fff; padding: 26px 30px; }
.tb .id h1 { margin: 0; font-size: 64px; line-height: 1; font-weight: 650; letter-spacing: -.04em; }
.tb .id .sub { margin: 10px 0 0; font-size: 21px; color: #d6deea; max-width: 34ch; line-height: 1.3; }
.tb .id .sum { margin: 16px 0 0; font-size: 16px; color: #c4d1df; max-width: 62ch; }
.tb dl { margin: 0; display: grid; grid-template-columns: auto 1fr; align-content: stretch; }
.tb dt, .tb dd { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
.tb dt { font-weight: 650; border-right: 1px solid var(--line); }
.tb dt:last-of-type, .tb dd:last-of-type { border-bottom: 0; }
.cv2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 36px; }
.feat { margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
.feat li { padding: 7px 0 7px 22px; border-bottom: 1px solid var(--line); position: relative; font-size: 15.5px; }
.feat li::before { content: ""; position: absolute; left: 2px; top: 15px; width: 9px; height: 9px; background: var(--signal); border: 1px solid var(--ink); }
.toc { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 24px; border-top: 2px solid var(--ink); }
.toc li { break-inside: avoid; border-bottom: 1px solid var(--line); }
.toc a { display: flex; gap: 10px; padding: 6px 2px; text-decoration: none; font-size: 15px; }
.toc a:hover { background: #e2e8ec; }
.toc a span { font-family: var(--m); font-size: 12.5px; color: var(--soft); min-width: 20px; padding-top: 2px; }

/* layouts */
.g2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 32px; align-items: start; }
.g2e { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
.stack > * + * { margin-top: 18px; }
.card { border: 1.5px solid var(--ink); background: var(--sheet); }
.card h3 { margin: 0; padding: 7px 10px; font-size: 13px; background: #dde3e8; border-bottom: 1px solid var(--ink); }
.card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; }
.card dt, .card dd { margin: 0; padding: 5px 10px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.card dt { font-weight: 650; }
.card dd { color: var(--soft); }
.card dt:last-of-type, .card dd:last-of-type { border-bottom: 0; }
.note { font-size: 13.5px; color: var(--soft); margin: 8px 0 0; }

/* stage table: one row group open per stage */
.stab td { padding: 6px 10px; }
.stab tr.sum td { font-size: 14.5px; color: var(--soft); }
.stab tr.sum td.nm { font-family: var(--m); font-size: 14px; color: var(--ink); font-weight: 600; }
.stab tbody.cur tr.sum td { background: #dff6e9; color: var(--ink); border-bottom-color: var(--ink); }
.stab tbody.cur tr.sum td:first-child { background: var(--signal); font-weight: 700; }
.stab tbody.cur tr.sum td.nm { font-size: 15px; }
.stab .xp-cell { padding: 0; border-bottom: 2px solid var(--ink); background: var(--sheet); }
.xp { display: grid; grid-template-columns: 1fr 560px; gap: 0; }
.kv { margin: 0; display: grid; grid-template-columns: 172px 1fr; align-content: start; border-right: 1px solid var(--line); }
.kv dt, .kv dd { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--line); font-size: 15.5px; line-height: 1.38; }
.kv dt { font-weight: 650; font-size: 14px; }
.kv dt:last-of-type, .kv dd:last-of-type { border-bottom: 0; }
.kv dd code { display: inline-block; margin: 0 6px 3px 0; padding: 1px 5px; border: 1px solid var(--line); background: #fff; font-size: 13px; }
.xp .fan { padding: 10px 14px; }
.motion .stage .xp { clip-path: inset(0 0 100% 0); }

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
.tools table { font-size: 13.5px; line-height: 1.25; table-layout: fixed; }
.tools col.c1 { width: 164px; } .tools col.c3 { width: 74px; }

.tools td:last-child { font-family: var(--m); font-size: 12px; color: var(--soft); white-space: nowrap; }
.tools tr.grp td { background: #dde3e8; font-family: var(--f); font-size: 13px; font-weight: 650; color: var(--ink); border-bottom: 1px solid var(--ink); padding: 5px 8px; }
.tools tr.grp td span { font-family: var(--m); font-weight: 500; color: var(--soft); margin-left: 6px; }
.tools tr.grp + tr td { border-top: 0; }

/* agent */
.keyline { margin: 18px 0 0; padding: 14px 18px; border: 2px solid var(--ink); background: var(--sheet); font-size: 19px; font-weight: 600; line-height: 1.35; max-width: 92ch; }

.end { margin-top: auto; padding-top: 24px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: space-between; border-top: 3px solid var(--ink); }
.end .links a { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.end .links a.go { color: var(--ink); background: var(--signal); text-decoration: none; padding: 8px 14px; border: 1px solid var(--ink); }
.end p { margin: 0; font-size: 14px; color: var(--soft); }

@media (min-width: 1000px) and (min-height: 760px) {

  .sheet { scroll-snap-align: start; height: 100vh; overflow: hidden; }
}

}

  .toc { columns: 1; }
}

  .links { gap: 10px; font-size: 13px; }
  .links .home { display: none; }
  .sh { grid-template-columns: auto 1fr; }
  .sh .doc { display: none; }

  .sh .lede { grid-column: 1 / 3; font-size: 15.5px; }
  .tb .id { padding: 20px; }

  .tb .id .sub { font-size: 18px; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { border-bottom: 0; padding-bottom: 0; }
  .keyline { font-size: 16.5px; }

  table.stack-sm, table.stack-sm tbody, table.stack-sm tr, table.stack-sm td { display: block; width: auto; }

  table.stack-sm tr { border-bottom: 1px solid var(--line); padding: 6px 0; }

  table.stack-sm { border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); }

  .stab thead, .stab colgroup { display: none; }

  .stab tr.sum td { display: block; border: 0; }
  .stab tr.sum td:nth-child(3) { grid-column: 2; padding-top: 0; }
  .stab tr.sum td:nth-child(4) { display: none; }
  .stab tbody.cur tr.sum td:nth-child(4) { display: block; grid-column: 2; padding-top: 0; }
  .stab tbody.cur tr.sum td:first-child { grid-row: span 3; }
  .stab tr.sum td:first-child { grid-row: span 2; }
  .tools td:last-child { white-space: normal; }
  .tools td:first-child { white-space: normal; word-break: break-word; }
  .tools table { table-layout: fixed; }
  .tools col.c1 { width: 36%; } .tools col.c3 { width: 22%; }
  .val { white-space: normal; }
  table.chars, table.lim { font-size: 15px; }
}
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html { scroll-snap-type: none; }
  .top { position: static; }
  .sheet { height: auto; min-height: 0; overflow: visible; padding: 0; break-after: page; border: 0; }
  .motion .stage .xp { clip-path: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

      var x = x0 + i * (bw + gap), cx = x + bw / 2;
      g += ln(cx, 74, cx, by - 2, true);
      g += rect(x, by, bw, bh, '#fff', 1.6) + tx(x + 10, by + 22, 'S' + (i + 1), { size: 12, mono: true, fill: '#45566b' }) + tx(x + 10, by + 52, st.id, { size: 19, weight: 650 });
      if (i < 6) g += ln(x + bw, by + bh / 2, x + bw + gap - 2, by + bh / 2, true);
      var fy = by + bh + 48, fw = 24, fg = 8, fx0 = cx - (4 * fw + 3 * fg) / 2;
      for (var k = 0; k < 4; k++) { var fx = fx0 + k * (fw + fg); g += ln(cx, by + bh, fx + fw / 2, fy, false) + rect(fx, fy, fw, 20, k === 0 ? '#5be49b' : '#fff', 1); }
      g += tx(cx, fy + 44, st.fanShort, { size: 13.5, anchor: 'middle' });
    });
    var my = by + bh / 2;
    g += tx(8, my - 6, c.input[0], { size: 14, weight: 600 }) + tx(8, my + 12, c.input[1], { size: 14, weight: 600 }) + ln(70, my, x0 - 2, my, true);
    var xe = x0 + 7 * bw + 6 * gap;
    g += ln(xe, my, xe + 40, my, true) + tx(xe + 46, my - 6, c.output[0], { size: 14, weight: 600 }) + tx(xe + 46, my + 12, c.output[1], { size: 14, weight: 600 });
    var fig = sv(W, 360, g, c.title);
    out.push(sheet(3, '', head(3, c.lede) + '<div style="margin-top:14px">' + fig + '</div><p class="note" style="margin-top:18px">' + esc(c.legend) + '</p>'));
  })();

  /* ---------- 4..10 stage zooms ---------- */
  function fanSvg(st, i) {
    var f = C.stageSection.fan, g = '', W = 540, CX = 200;
    g += '<rect x="' + (CX - 100) + '" y="4" width="200" height="34" fill="#0f1a2a"/>' + tx(CX, 26, f.orch, { size: 14, anchor: 'middle', weight: 650, fill: '#fff' });
    g += tx(527, 26, f.fanNote, { size: 11, anchor: 'end', mono: true, fill: '#45566b' });
    var bw = 122, gap = 10, x0 = 9, by = 76, bh = 52;
    st.fan.forEach(function (lab, k) {
      var x = x0 + k * (bw + gap), cx = x + bw / 2;
      g += ln(CX, 38, cx, by - 2, true);
      g += rect(x, by, bw, bh, '#fff');
      if (lab.length === 1) g += tx(cx, by + 31, lab[0], { size: 13, anchor: 'middle' });
      else g += tx(cx, by + 22, lab[0], { size: 13, anchor: 'middle', weight: 600 }) + tx(cx, by + 40, lab[1], { size: 12.5, anchor: 'middle' });
      g += ln(cx, by + bh, cx, by + bh + 18, false);
    });
    var lines = wrap(st.tools, 58), ty = by + bh + 18, th = 18 + lines.length * 17;
    g += '<rect x="9" y="' + ty + '" width="518" height="' + th + '" fill="#dde3e8" stroke="#132033" stroke-width="1"/>';
    g += tx(19, ty + 22, f.calls, { size: 11.5, fill: '#45566b' });
    lines.forEach(function (l, j) { g += tx(64, ty + 22 + j * 17, l, { size: 12.5, mono: true }); });
    var py = ty + th + 26, bx = CX - 160;
    g += ln(CX, ty + th, CX, py - 2, true);
    g += rect(bx, py, 320, 44, '#5be49b', 1.5) + tx(bx + 12, py + 18, f.orch + ' ' + f.keeps, { size: 11.5, mono: true }) + tx(bx + 12, py + 36, st.keepShort, { size: 14, weight: 650 });
    var oy = py + 44 + 26;
    g += ln(CX, py + 44, CX, oy - 2, true);
    g += rect(bx, oy, 320, 44, '#fff', 1.5) + tx(bx + 12, oy + 18, f.out, { size: 11.5, mono: true }) + tx(bx + 12, oy + 36, st.outShort, { size: 14, weight: 650 });
    var nxt = i < 6 ? f.next + ' ' + C.stages[i + 1].id : f.end;
    g += ln(bx + 320, oy + 22, bx + 356, oy + 22, true) + tx(bx + 362, oy + 26, nxt, { size: 12.5, mono: true });
    return sv(W, oy + 52, g, st.id + ': ' + st.fanShort);
  }
  C.stages.forEach(function (cur, i) {
    var sc = C.stageSection, L = sc.rowLabels, idx = 4 + i;
    var rows = C.stages.map(function (st, j) {
      var sum = '<tr class="sum"><td class="n">S' + (j + 1) + '</td><td class="nm">' + esc(st.id) + '</td><td>' + esc(st.fnShort) + '</td><td>' + esc(st.outShort) + '</td></tr>';
      if (j !== i) return '<tbody>' + sum + '</tbody>';
      var kv = '<dl class="kv"><dt>' + esc(L.fn) + '</dt><dd>' + esc(st.fn) + '</dd><dt>' + esc(L.subs) + '</dt><dd>' + esc(st.subs) + '</dd>' +
        '<dt>' + esc(L.tools) + '</dt><dd>' + code(st.tools) + '</dd><dt>' + esc(L.out) + '</dt><dd>' + esc(st.out) + '</dd><dt>' + esc(L.pick) + '</dt><dd>' + esc(st.pick) + '</dd></dl>';
      return '<tbody class="cur">' + sum + '<tr><td colspan="4" class="xp-cell"><div class="xp">' + kv + '<div class="fan">' + fanSvg(st, i) + '</div></div></td></tr></tbody>';
    }).join('');
    var t = '<table class="stab"><colgroup><col style="width:52px"><col style="width:120px"><col><col style="width:34%"></colgroup><thead><tr>' + sc.tableCols.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead>' + rows + '</table>';
    out.push(sheet(idx, 'stage', head(idx, sc.lede) + t));
  });

  /* ---------- 11 agent ---------- */
  (function () {
    var c = C.s11, g = '';
    function stack(x, w, title, model, n) {
      var s = '';
      for (var k = n - 1; k >= 0; k--) s += '<rect x="' + (x + k * 8) + '" y="' + (8 + k * 8) + '" width="' + w + '" height="196" fill="#fff" stroke="#132033" stroke-width="1"/>';
      s += tx(x + 10, 28, title, { size: 14, weight: 650 });
      c.layerShort.forEach(function (l, j) {
        var y = 40 + j * 40;
        s += rect(x + 10, y, w - 20, 32, j === 0 ? '#dde3e8' : (j === 3 ? '#5be49b' : '#fff'), 1) + tx(x + 20, y + 21, '(' + 'abcd'[j] + ') ' + (j === 0 ? model : l), { size: 12.5, mono: j !== 0 });
      });
      return s;
    }
    g += stack(4, 236, c.stackOrch, c.stackOrchModel, 1);
    g += stack(272, 220, c.stackSub, c.stackSubModel, 3);
    var fig1 = sv(520, 232, g, c.mix);
    /* flow: agent -> tool -> lab -> json -> reporter -> dashboard */
    var f = c.flow, h2 = '', bx = [0, 250, 500, 750];
    var labs = [f[0], f[2], f[4], f[5]];
    labs.forEach(function (l, k) {
      h2 += rect(bx[k] + 2, 28, 170, 44, k === 3 ? '#0f1a2a' : '#fff', 1.5) + tx(bx[k] + 87, 55, l, { size: 14, weight: 650, anchor: 'middle', fill: k === 3 ? '#fff' : '#132033' });
      if (k < 3) { h2 += ln(bx[k] + 172, 50, bx[k + 1], 50, true); }
    });
    h2 += tx(211, 16, f[1], { size: 12, anchor: 'middle', mono: true, fill: '#45566b' });
    h2 += tx(461, 16, f[3], { size: 12, anchor: 'middle', mono: true, fill: '#45566b' });
    h2 += ln(87, 72, 87, 104) + ln(87, 104, 832, 104, false, true) + ln(832, 104, 832, 76, true, true);
    h2 += '<path d="M452 97l14 14M466 97l-14 14" stroke="#132033" stroke-width="2.2"/>';
    h2 += tx(480, 126, c.flowNo, { size: 12.5, mono: true });
    var fig2 = sv(924, 134, h2, c.key);
    var rows = c.rows.map(function (r) { return ['(' + r[0] + ')', r[1], r[2]]; });
    var t = table(['', c.cols[0], c.cols[1]], rows, { ncol: 0, cls: ['n', 'val', ''] });
    out.push(sheet(11, '', head(11, c.lede) + '<div class="g2">' + t + '<div>' + fig1 + '<p class="note">' + esc(c.mix) + '</p></div></div>' +
      '<div style="margin-top:20px;max-width:924px">' + fig2 + '</div><p class="keyline">' + esc(c.key) + '</p>'));
  })();

  /* ---------- 12 tools ---------- */
  (function () {
    var c = C.s12;
    function half(groups) {
      var b = '';
      groups.forEach(function (gr) {
        b += '<tbody><tr class="grp"><td colspan="3">' + esc(gr.group) + '<span>' + gr.tools.length + '</span></td></tr>' +
          gr.tools.map(function (t) { return '<tr><td>' + esc(t[0]) + '</td><td>' + esc(t[1]) + '</td><td>' + esc(stageCode(t[2])) + '</td></tr>'; }).join('') + '</tbody>';
      });
      return '<table><colgroup><col class="c1"><col><col class="c3"></colgroup><thead><tr>' + c.cols.map(function (h) { return '<th scope="col">' + esc(h) + '</th>'; }).join('') + '</tr></thead>' + b + '</table>';
    }
    var ids = C.stages.map(function (s) { return s.id; });
    function stageCode(v) {
      return v.split(', ').map(function (x) { var k = ids.indexOf(x); return k >= 0 ? 'S' + (k + 1) : x === 'any' ? c.anyStage : x === 'optional' ? c.optional : x; }).join(', ');
    }
    var key = c.key.replace('{stages}', ids.map(function (s, k) { return 'S' + (k + 1) + ' ' + s; }).join(', '));
    out.push(sheet(12, '', head(12, c.lede.replace('{n}', toolCount)) + '<div class="tools">' + half(T.slice(0, 3)) + half(T.slice(3)) + '</div><p class="note">' + esc(key) + '</p>'));
  })();

  /* ---------- 13 checks and marks ---------- */
  (function () {
    var c = C.s13;
    var t1 = table(c.checksCols, c.checks, { ncol: 0, cls: ['n', 'val', '', ''], html: { 2: function (v) { return v === '–' ? v : '<code>' + esc(v) + '</code>'; } } });
    var t2 = table(c.marksCols, c.marks.map(function (r) { return [r[0], r[1] + '\u0000' + r[2], r[3]]; }), { cls: ['val', '', 'soft'], html: {
      1: function (v) { var p = v.split('\u0000'); return esc(p[0]) + (p[1] ? ' <span class="mk ' + (p[1] === 'est.' ? 'est' : 'sim') + '">' + esc(p[1]) + '</span>' : ''); } } });
    out.push(sheet(13, '', head(13, c.lede) + '<div class="g2e"><div><h3>' + esc(c.checksTitle) + '</h3>' + t1 + '</div><div><h3>' + esc(c.marksTitle) + '</h3>' + t2 + '</div></div>'));
  })();

  /* ---------- 14 measured ---------- */
  (function () {
    var c = C.s14;
    out.push(sheet(14, '', head(14, c.lede) + table(c.cols, c.rows, { cls: ['', 'val', 'soft'], extra: 'chars' })));
  })();

  /* ---------- 15 limits ---------- */
  (function () {
    var c = C.s15;
    out.push(sheet(15, '', head(15, c.lede) + '<div style="max-width:1000px">' + table(c.cols, c.rows, { cls: ['val', ''], extra: 'lim' }) + '</div>' +
      '<div class="end"><div class="links"><a class="go" href="../../dashboard/">' + esc(C.linkDash) + '</a><a href="../../">' + esc(C.linkHome) + '</a></div><p>' + esc(c.footer) + '</p></div>'));
  })();

  document.getElementById('main').innerHTML = out.join('');

  /* ---------- position indicator and keyboard stepping ---------- */
  var secs = Array.prototype.slice.call(document.querySelectorAll('.sheet'));
  var ticks = Array.prototype.slice.call(document.querySelectorAll('#ticks a'));
  var hl = document.getElementById('hl'), where = document.getElementById('where');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)');
  var curI = -1;
  function topOf(el) { return el.getBoundingClientRect().top + window.scrollY; }
  function indexAt(y) { var i = 0; for (var k = 0; k < secs.length; k++) if (topOf(secs[k]) <= y + 2) i = k; return i; }
  function update() {
    var i = indexAt(window.scrollY + window.innerHeight * 0.4);
    if (i === curI) return;
    curI = i;
    ticks.forEach(function (a, k) { a.classList.toggle('on', k === i); if (k === i) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    if (ticks[i]) hl.style.setProperty('--x', ticks[i].offsetLeft + 'px');
    where.innerHTML = '<b>' + i + '/' + LAST + '</b>' + esc(S[i].title);
  }
  function go(i) {
    i = Math.max(0, Math.min(LAST, i));
    window.scrollTo({ top: topOf(secs[i]), behavior: reduce.matches ? 'auto' : 'smooth' });
  }
  window.addEventListener('scroll', update, { passive: true });
  /* a figure frame that scrolls sideways on a phone must be reachable by keyboard */
  var wraps = Array.prototype.slice.call(document.querySelectorAll('.figwrap'));
  function focusables() { wraps.forEach(function (w) { if (w.scrollWidth > w.clientWidth + 1) { w.tabIndex = 0; w.setAttribute('role', 'region'); w.setAttribute('aria-label', w.firstChild.getAttribute('aria-label')); } else { w.removeAttribute('tabindex'); w.removeAttribute('role'); w.removeAttribute('aria-label'); } }); }
  focusables();
  window.addEventListener('resize', function () { curI = -1; update(); focusables(); });
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target; if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    var fwd = ['PageDown', 'ArrowDown', 'ArrowRight'].indexOf(e.key) >= 0 || (e.key === ' ' && !e.shiftKey);
    var back = ['PageUp', 'ArrowUp', 'ArrowLeft'].indexOf(e.key) >= 0 || (e.key === ' ' && e.shiftKey);
    var y = window.scrollY, vh = window.innerHeight, i = indexAt(y + 1), s = secs[i];
    var sTop = topOf(s), sBot = sTop + s.offsetHeight;
    if (fwd) {
      if (sBot > y + vh + 4) return;            /* section taller than the screen: let the browser scroll inside it */
      if (i < LAST) { e.preventDefault(); go(i + 1); }
    } else if (back) {
      if (y > sTop + 4 && s.offsetHeight > vh + 4) return;
      e.preventDefault(); go(y > sTop + 4 ? i : i - 1);
    } else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(LAST); }
  });
  update();

  /* the stage zoom opens when its sheet comes into view (motion only explains the zoom) */
  if (document.documentElement.classList.contains('motion')) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('seen'); io.unobserve(en.target); } }); }, { threshold: 0.35 });
    document.querySelectorAll('.stage').forEach(function (s) { io.observe(s); });
    window.addEventListener('beforeprint', function () { document.querySelectorAll('.stage').forEach(function (s) { s.classList.add('seen'); }); });
  }
})();
</script>
<script src="../variant-nav.js"></script>
