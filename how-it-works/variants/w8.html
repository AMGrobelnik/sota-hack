<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 420px;
  --bar: 56px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.pg { font-size: 15px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }
.top nav a { white-space: nowrap; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 14px; }
  .top .btn { padding: 7px 12px; }
  .step h1 { font-size: 38px; }
  .step h2 { font-size: 30px; }
}

/* steps (text) */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 18px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 46px; }
.step h2 { font-size: 36px; }
.step p { margin: 0 0 12px; color: #c4d1df; font-size: 17.5px; line-height: 1.48; max-width: 36ch; }
.step .kick { font-size: 15px; color: var(--signal); font-weight: 600; margin-bottom: 10px; }
.step .hint { color: var(--mute); font-size: 15px; margin-top: 22px; }
.step ul.lim { list-style: none; margin: 0 0 22px; padding: 0; }
.step ul.lim li { color: #dfe8f1; font-size: 17.5px; line-height: 1.42; padding: 10px 0; border-top: 1px solid var(--rule); max-width: 34ch; }
.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 4px 0 26px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 13.5px; color: #8597ad; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 150px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam { scroll-snap-type: y mandatory; }
.cam .fig { display: none; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: 0; top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#where { position: fixed; left: clamp(24px, 3vw, 44px); bottom: 26px; width: calc(var(--col) - 2 * clamp(24px, 3vw, 44px)); z-index: 20; }
#where svg { display: block; width: 220px; height: auto; }
#where .wl { margin: 9px 0 0; font-size: 13.5px; color: var(--mute); }
#where .wl b { color: #dbe5ef; font-weight: 600; }
.flow #where { display: none; }
#where .mr { fill: rgba(214, 228, 242, .07); stroke: rgba(214, 228, 242, .32); vector-effect: non-scaling-stroke; }
#where .mc { fill: rgba(91, 228, 155, .12); stroke: var(--signal); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

/* flow mode: reduced motion, small screens */
.flow .step { padding: clamp(36px, 7vh, 64px) clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--rule); }
.flow .fig { margin: 22px 0 0; border: 1px solid var(--rule); border-radius: 12px; background: #0d1726; overflow: hidden; }
.flow .fig svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 140px); }
.flow .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 1000px) {
  .flow .step { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 40px; align-items: center; }
  .flow .step > .fig { grid-column: 2; grid-row: 1 / span 8; margin: 0; }
  .flow .step > :not(.fig) { grid-column: 1; }
}
@media (max-width: 999px) {
  .flow .detail { position: static; width: auto; height: auto; overflow: visible; clip: auto; white-space: normal; margin-top: 18px; }
}
.detail { font-size: 15px; color: #c4d1df; }
.detail h3 { font-size: 15px; color: #fff; margin: 16px 0 6px; font-weight: 650; }
.detail dl { margin: 0; }
.detail dt { color: var(--mute); font-size: 13.5px; margin-top: 10px; }
.detail dd { margin: 2px 0 0; }
.detail ol, .detail ul { margin: 0; padding-left: 20px; }
.detail li { margin: 4px 0; }
.detail table { width: 100%; border-collapse: collapse; font-size: 14px; }
.detail th { text-align: left; color: var(--mute); font-weight: 600; font-size: 13px; padding: 4px 6px 4px 0; }
.detail td { vertical-align: top; padding: 5px 6px 5px 0; border-top: 1px solid var(--rule); }
.detail code { font-family: var(--mono); font-size: 12.5px; color: #bfe9d2; overflow-wrap: anywhere; }

/* the map */
.mapsvg { font-family: var(--f); text-rendering: geometricPrecision; }
.mapsvg * { vector-effect: non-scaling-stroke; }

  // ---------- minimap ----------

  applyMode();
})();
