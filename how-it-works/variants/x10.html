<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 452px;
  --rail: 88px;
  --bar: 60px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 18px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 20px; padding: 0 clamp(16px, 2.6vw, 40px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 20px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.pg { font-size: 17px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.top nav a { font-size: 17px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 9px 16px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }

/* text of each stop */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 22px; color: #fff; font-weight: 650; letter-spacing: -.035em; line-height: 1.02; text-wrap: balance; }
.step h1 { font-size: 66px; }
.step h2 { font-size: 56px; }
.step .kick { margin: 0 0 14px; font-size: 19px; font-weight: 600; color: var(--signal); }
.step .line { margin: 0; font-size: 23px; line-height: 1.42; color: #d5e0ea; max-width: 19em; }
.step .cue { margin: 30px 0 0; padding-left: 16px; border-left: 2px solid rgba(91, 228, 155, .5); font-size: 18px; line-height: 1.45; color: #9fb0c4; max-width: 21em; }
.step .hint { margin: 26px 0 0; font-size: 16px; color: var(--mute); }
.step ul.lim { list-style: none; margin: 0; padding: 0; }
.step ul.lim li { font-size: 21px; line-height: 1.38; color: #e2eaf2; padding: 12px 0; border-top: 1px solid var(--rule); max-width: 19em; }
.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin: 26px 0 0; }
.acts a:not(.btn) { font-weight: 600; font-size: 18px; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 12px 20px; font-size: 18px; }
footer { margin-top: 22px; font-size: 16px; color: #8597ad; }

/* camera mode */
html.cam { scroll-snap-type: y mandatory; }
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: var(--bar) 34px 40px clamp(28px, 3.4vw, 52px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); }
.cam .fig, .cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.cam .fig { display: none; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* right rail: dots on one vertical line, evenly spaced */
#rail { position: fixed; top: var(--bar); bottom: 0; right: 0; width: var(--rail); z-index: 25; }
#rail .count { position: absolute; left: 0; right: 0; text-align: center; margin: 0; font-size: 16px; font-weight: 600; color: #dbe5ef; font-variant-numeric: tabular-nums; }
#rail ol { list-style: none; margin: 0; padding: 0; position: absolute; left: 50%; width: 0; }
#rail li { position: absolute; left: 0; width: 0; height: 0; }
#rail button { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; padding: 0; margin: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
#rail button::before { content: ""; position: absolute; left: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: rgba(214, 228, 242, .32); transition: background .2s, transform .2s; }
#rail button:hover::before { background: rgba(214, 228, 242, .7); }
#rail button[aria-current="step"]::before { background: var(--signal); transform: scale(1.6); box-shadow: 0 0 0 3px rgba(91, 228, 155, .22); }
#rail .ch { position: absolute; right: 30px; top: 4px; font-size: 15px; line-height: 22px; color: #8fa2b8; font-variant-numeric: tabular-nums; pointer-events: none; }
#rail button[aria-current="step"] .ch { color: var(--signal); }
#rail .tip { position: absolute; right: 52px; top: 0; white-space: nowrap; font-size: 16px; line-height: 30px; padding: 0 12px; border-radius: 8px; background: #1a2d47; border: 1px solid rgba(214, 228, 242, .25); color: #fff; opacity: 0; pointer-events: none; transition: opacity .15s; }
#rail button:hover .tip, #rail button:focus-visible .tip { opacity: 1; }
.flow #rail, .flow .step .hint { display: none; }

/* flow mode: small screens */
.flow .step { padding: clamp(36px, 7vh, 64px) clamp(18px, 4vw, 48px); border-bottom: 1px solid var(--rule); }
.flow .fig { margin: 24px 0 0; border: 1px solid var(--rule); border-radius: 12px; background: #0d1726; overflow: hidden; }
.flow .fig svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 140px); }
@media (max-width: 899px) { .flow .fig { display: none; } }
.detail { margin-top: 22px; font-size: 18px; color: #c4d1df; }
.detail h3 { font-size: 19px; color: #fff; margin: 20px 0 6px; font-weight: 650; }
.detail p { margin: 0 0 10px; }
.detail ol, .detail ul { margin: 0; padding-left: 22px; }
.detail li { margin: 5px 0; }
.detail code { font-family: var(--mono); font-size: 16px; color: #bfe9d2; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 16px; }
  .top .btn { padding: 8px 12px; }
  .step h1 { font-size: 40px; }
  .step h2 { font-size: 34px; }
  .step .line { font-size: 20px; }
}

/* the map */
.mapsvg { font-family: var(--f); text-rendering: geometricPrecision; }
.mapsvg * { vector-effect: non-scaling-stroke; }
.c1 { fill: #fff; } .c2 { fill: #c4d1df; } .c3 { fill: #9aabc0; } .cg { fill: var(--signal); } .ca { fill: var(--amber); } .cd { fill: var(--dusk); } .ck { fill: #bfe9d2; }
.mono { font-family: var(--mono); }
.bx { fill: #16263c; stroke: rgba(214, 228, 242, .22); stroke-width: 1; }
.bx2 { fill: #122136; stroke: rgba(214, 228, 242, .16); stroke-width: 1; }
.bxg { fill: rgba(91, 228, 155, .07); stroke: rgba(91, 228, 155, .5); stroke-width: 1; }
.bxa { fill: rgba(255, 184, 107, .08); stroke: rgba(255, 184, 107, .55); stroke-width: 1; }
.bxd { fill: rgba(201, 163, 196, .08); stroke: rgba(201, 163, 196, .55); stroke-width: 1; }
.rule { stroke: rgba(214, 228, 242, .14); stroke-width: 1; fill: none; }
.ln { fill: none; stroke: rgba(214, 228, 242, .42); stroke-width: 1.4; }
.lng { fill: none; stroke: rgba(91, 228, 155, .55); stroke-width: 1.4; }
.lnd { fill: none; stroke: rgba(214, 228, 242, .32); stroke-width: 1.3; stroke-dasharray: 6 6; }
.ah { fill: rgba(214, 228, 242, .62); }
.ahg { fill: var(--signal); }
.dotg { fill: var(--signal); }
.dotm { fill: rgba(214, 228, 242, .2); }
.chip rect { fill: #0f1a2a; stroke: rgba(91, 228, 155, .42); stroke-width: 1; }
.chip.off rect { stroke: rgba(214, 228, 242, .2); }
.hd { fill: #1a2d47; stroke: rgba(214, 228, 242, .3); stroke-width: 1.2; }
.body { fill: #13233a; stroke: rgba(214, 228, 242, .18); stroke-width: 1; }
.num { fill: rgba(91, 228, 155, .22); }
.numt { fill: #fff; font-weight: 700; }
.gk { fill: rgba(214, 228, 242, .17); }
.gl .gk { display: none; }

/* what the map shows at each stop */
.rg, .panel, .dt, .gl, .orch, .links, .lk, .mapsvg text, .gk { transition: opacity .45s ease; }
.gk, .gl { opacity: 0; }
.far text { opacity: 0; }

  var cam = document.getElementById('cam');

  var map = E('g', { id: 'map' }, cam);
  var REG = {};

  function region(key) { return E('g', { 'class': 'rg', 'data-r': key }, map); }

  // ---------- layout of the map ----------
  // Row A: intake, run setup, reporting, talking. Row B: orchestrator and the

  var CW = 880, CG = 300, COLX = [0, CW + CG, 2 * (CW + CG), 3 * (CW + CG)];
  var PWID = 580, PGAP = 60, PSTEP = PWID + PGAP, MAPW = 7 * PWID + 6 * PGAP;
  var ORCHY = 1060, ORCHH = 180, Y0 = 1310;

  // ---------- A0: intake ----------

    var stepsBottom = sy - 34;
    // the spec card

    var ch = 30 + 34 + 26;

    ch += 6;

  var panels = [];

      panels.push(pg);

      R(pg, x, Y0, PWID, HD, 'hd', 14);
      // detail, legible when zoomed in
      var dt = E('g', { 'class': 'dt' }, pg), ix = x + IX;
      E('circle', { cx: x + 48, cy: Y0 + HD / 2, r: 24, 'class': 'num' }, dt);
      T(dt, x + 48, Y0 + HD / 2 - 12, String(i + 1), { size: 24, weight: 700, cls: 'numt', anchor: 'middle' });
      T(dt, x + 88, Y0 + HD / 2 - 21, s.name, { size: 40, weight: 650, cls: 'c1' });
      T(dt, ix, L.does, s.does, { size: 21, w: IW, lh: 29, cls: 'c1' });
      T(dt, ix, L.bl, s.batch ? PI.batchWord : PI.aloneWord, { size: 18, weight: 600, cls: s.batch ? 'cg' : 'c3' });
      if (s.batch) {

          P(dt, 'M' + cxp + ' ' + L.hub + 'C' + cxp + ' ' + (L.hub + 18) + ' ' + bcx + ' ' + (L.fan - 18) + ' ' + bcx + ' ' + L.fan, 'lng');
