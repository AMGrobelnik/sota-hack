/* right rail: one dot per stop, every dot on one vertical line */

  // ---------- anchors of the contents drawn around the map ----------
  // band: which label band the stop's label sits in; x, y: where its leader line meets the map;
  // via: an x the line first runs to (sideways), before it turns to the band
  function colX(i) { return PX + i * (PW + PG) + PW / 2; }
  var ANCH = { 1: { band: 'top', x: REG.intake.x + REG.intake.w / 2, y: REG.intake.y },

  C.steps.forEach(function (s, i) {
    var o = { key: s.key, n: i + 1 };
    var m = /^st(\d)$/.exec(s.key);
    if (m) {

      o.stage = si; o.kicker = PI.stageWord.replace('{i}', si + 1); o.title = sd.name; o.toc = sd.name; o.lines = [sd.lead]; o.sub = true;
      o.focus = ['p' + si]; o.rect = REG['p' + si];
    } else {

  var tocLinks = [];

    if (st.key === 'limits') {

      var b1 = H('a', 'btn', C.nav.dashboard, a); b1.href = C.dashHref;

  // ---------- the contents: one label per stop in a band above or below the map ----------
  var pinBox = document.getElementById('toc'), pinEls = {};
  var leads = E('svg', { 'class': 'leads', 'aria-hidden': 'true' }, pinBox);
  function tocLabel(n, text, cls) {
    var a = H('a', 'tl ' + cls, null, pinBox);
    a.href = '#step-' + STEPS[n].key; a.setAttribute('data-go', n); a.setAttribute('tabindex', '-1');
    H('span', 'pn', String(n), a); H('span', 'tx', text, a);

  }

  Object.keys(ANCH).forEach(function (k) {
    var n = +k, an = ANCH[k];

  });
  var GRP = tocLabel(3, C.intro.pipeGroup, 'grp');
  pinEls[3] = GRP;

  // ---------- right rail ----------
  var railOl = document.querySelector('#rail ol'), railLinks = [];
  document.getElementById('rail').setAttribute('aria-label', C.rail.label);
  STEPS.forEach(function (st, i) {
    var li = H('li', '', null, railOl), a = H('a', i === 0 ? 'ov' : '', i === 0 ? '' : String(i), li);
    var label = i === 0 ? C.rail.overview : C.rail.stop.replace('{n}', i).replace('{title}', st.title);
    a.href = '#step-' + st.key; a.setAttribute('data-go', i); a.setAttribute('aria-label', label);

    railLinks.push(a);
  });

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null, reduce = false;
  function fit(r, a) {
    // a margin of about 16 screen pixels, whatever the zoom
    var z0 = Math.min(vp.clientWidth / r.w, vp.clientHeight / r.h) || 1;
    var pad = 16 / z0, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }

  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STEPS.map(function (s) { return fit(s.rect, A); });
    FIT[0] = layoutToc(w, h);
  }

  // Lays out the contents for a viewport of vw x vh pixels and returns the camera for the
  // opening view. One type size for every label: the largest that fits both bands in one row.
  function layoutToc(vw, vh) {
    var M = REG.map, SIDE = 18, best = null;
    for (var f = 17; f >= 12; f--) { best = tryToc(f); if (best.ok) break; }
    var L2 = best;
    // place the labels and draw the leader lines
    while (leads.firstChild) leads.removeChild(leads.firstChild);
    LABS.forEach(function (l) {
      l.el.style.left = (l.c - l.w / 2).toFixed(1) + 'px';
      l.el.style.top = (l.an.band === 'top' ? L2.yTop - l.h : L2.yBot).toFixed(1) + 'px';
    });
    ['top', 'bot'].forEach(function (band) {
      var row = L2.rows[band], edge = band === 'top' ? L2.mapTop : L2.mapBot, sg = band === 'top' ? -1 : 1;
      var lab = band === 'top' ? L2.yTop : L2.yBot;
      // leaders that jog sideways get their own level, so no two lines cross
      var right = row.filter(function (l) { return l.c - l.ex > 1.5; });
      var left = row.filter(function (l) { return l.ex - l.c > 1.5; });
      var step = Math.min(6, (L2.jog - 12) / Math.max(1, right.length, left.length));
      right.forEach(function (l, q) { l.lv = right.length - 1 - q; });
      left.forEach(function (l, q) { l.lv = q; });
      row.forEach(function (l) {
        var ax = l.sx, ay = l.sy, d = 'M' + ax.toFixed(1) + ' ' + ay.toFixed(1);
        if (l.an.via != null) d += 'H' + l.ex.toFixed(1);
        if (Math.abs(l.c - l.ex) <= 1.5) d += 'V' + lab.toFixed(1);
        else {

          d += 'V' + yj.toFixed(1) + 'H' + l.c.toFixed(1) + 'V' + lab.toFixed(1);
        }

    var x0 = st[0].c - st[0].w / 2, x1 = st[st.length - 1].c + st[st.length - 1].w / 2, yb = L2.yBr;
    E('path', { d: 'M' + x0.toFixed(1) + ' ' + (yb + 7) + 'V' + yb + 'H' + x1.toFixed(1) + 'V' + (yb + 7), 'class': 'ld br' }, leads);
    var gc = Math.max(L2.gw / 2 + 8, Math.min(vw - L2.gw / 2 - 8, (x0 + x1) / 2));
    GRP.style.left = (gc - L2.gw / 2).toFixed(1) + 'px';
    GRP.style.top = (yb - 8 - L2.gh).toFixed(1) + 'px';

    function tryToc(f) {

      o.gw = GRP.offsetWidth; o.gh = GRP.offsetHeight;

})();
