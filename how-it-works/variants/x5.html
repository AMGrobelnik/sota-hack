<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 420px;
  --bar: 56px;
  --rail: 64px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 15px; }
  .top .btn { padding: 7px 12px; }
}

/* text column */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 46px; }
.step h2 { font-size: 38px; }
.step p { margin: 0 0 13px; color: #c9d5e2; font-size: 18px; line-height: 1.46; max-width: 34ch; }
.step .kick { font-size: 16px; color: var(--signal); font-weight: 600; margin-bottom: 10px; }
.step .hint { color: var(--mute); font-size: 16px; margin-top: 20px; }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 18px 0 22px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; font-size: 17px; }
.acts .btn { padding: 11px 18px; font-size: 17px; }
footer { font-size: 15px; color: #94a6bb; max-width: 34ch; line-height: 1.45; }
@media (max-width: 560px) { .step h1 { font-size: 36px; } .step h2 { font-size: 30px; } }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 150px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam { scroll-snap-type: y mandatory; }
.cam .fig, .cam .detail { display: none; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); background: var(--night); overflow: hidden; }
#cam { display: block; width: 100%; height: 100%; }
.flow #viewport { left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    } else if (k === 'talk') {
      H('h3', '', TK.streamLabel, box); ul(box, TK.rows.map(function (r) { return r.kind + ': ' + (r.who ? r.who + ': ' : '') + r.text; }));
      dl(box, TK.points.map(function (p) { return [p[0], p[1]]; }));

  }
  var sections = STEPS.map(function (st, i) {

      var b2 = H('a', '', C.nav.home, a); b2.href = '../../';

    var r = st.rect, pad = 16;
    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);

  });

  // ---------- minimap ----------
  var mini = document.getElementById('mini');
  mini.setAttribute('viewBox', ALL.x + ' ' + ALL.y + ' ' + ALL.w + ' ' + ALL.h);
  var MINI = {};
  ['orch', 'spec', 'run', 'st0', 'st1', 'st2', 'st3', 'st4', 'st5', 'st6', 'agent', 'toolsA', 'toolsB', 'rep', 'talk', 'checksA', 'checksB', 'meas', 'limits'].forEach(function (k) {
    var r = REG[k]; MINI[k] = E('rect', { x: r.x, y: r.y, width: r.w, height: r.h, 'class': 'mr', rx: 40 }, mini);
  });
  var mcam = E('rect', { 'class': 'mc', rx: 30 }, mini);
  var where = document.getElementById('where'), wl = document.getElementById('wl');

  // ---------- right rail ----------
  var rail = document.getElementById('rail');
  document.getElementById('railnav').setAttribute('aria-label', C.rail.label);
  var dots = STEPS.map(function (st, i) {
    var li = H('li', '', null, rail), b = H('button', '', null, li);
    b.type = 'button';
    var lab = C.rail.go.replace('{n}', i + 1).replace('{title}', st.title);
    b.setAttribute('aria-label', lab);
    H('span', 'tip', lab, b).setAttribute('aria-hidden', 'true');
    b.addEventListener('click', function () { go(i); });
    return b;
  });

  var vp = document.getElementById('viewport');

  var hideables = [].slice.call(map.querySelectorAll('.hide-k'));
  var pipewires = [].slice.call(map.querySelectorAll('.pipewire'));
  function fit(r, a) {
    var pad = 24, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;

    cam.classList.toggle('s-glance', st.lod === 'glance');
    // minimap and rail are set from the same index, so they always agree
    for (var k in MINI) MINI[k].classList.toggle('cur', f === k || (f === 'pipe' && (k === 'orch' || /^st\d$/.test(k))));
    where.classList.toggle('on', i > 0);
    wl.textContent = '';
    var b = document.createElement('b'); b.textContent = C.where.replace('{n}', i + 1).replace('{t}', N);
    wl.appendChild(b);

    var a = FIT[i], b = FIT[i + 1];

    var lw = la + (lb - la) * te + (lp > hi ? (lp - hi) * 4 * te * (1 - te) : 0);

    var fx1 = Math.min(ALL.x + ALL.w, cx + w / 2), fy1 = Math.min(ALL.y + ALL.h, cy + h / 2);
    mcam.setAttribute('x', fx0); mcam.setAttribute('y', fy0); mcam.setAttribute('width', Math.max(0, fx1 - fx0)); mcam.setAttribute('height', Math.max(0, fy1 - fy0));

  }
