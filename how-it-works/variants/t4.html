      Guided flow of five steps; one open 130 nm process; Chippy never starts, messages or stops a run.

      5 recorded runs, all synthetic data, all 7 stages done.

      Eight steps passed; 100,000 random vectors, 0 mismatches; golden-model proof 7.0 s;

      majority 2 of 3 smoothing.

      16 designs, 1k to 30k weights, bit-exact on 100,000 random inputs; ternary 30k

      256 trained, 119 under the size cap; search_rate batched_per_min 1625.5, single_per_min

      5 designs bit-exact and formally proved; gates cover the classifier only.
  - origin/gh-pages: dashboard/data/runs/index.json (durations)
      Five recorded runs, duration_s 235.516 to 1896.954: 4 to 32 minutes, brief to verified gates.
  - OpenROAD: Toward a Self-Driving, Open-Source Digital Layout Implementation Tool Chain
      (GOMACTech 2019), https://vlsicad.ucsd.edu/Publications/Conferences/370/c370.pdf:
      typical hardware design cycles of 12-36 months for teams without large design staffs.
  - origin/gh-pages: dashboard/data/af-candidates.json, search_rate
      batch 256, batched_per_min 1625.5, single_per_min 27.6: about 59 times (1,625.5 / 27.6 = 58.9).
  - origin/main: backend/README.md (the harness)
      A run starts from the dashboard (brief and preset; optional agent, model, fan-out) or the
      command line; runs/<run_id>/ with run.json, events.jsonl, workspace/, workspace/chips/,
      workspace/agents/<id>/; same standing instructions for both harnesses; chiplab skill

      events to events.jsonl and a live stream; no outside settings files by default.
  - origin/main: backend/config/backend.yaml, backend/src/chipin_backend/api/manager.py
      4 agent runs at once by default; a further start is refused as too many runs in progress.
  - origin/main: backend/src/chipin_backend/api/api.yaml
      Run wall clock 4 h, past it the run fails; progress.jsonl read every 0.5 s.
  - origin/main: backend/src/chipin_backend/api/instructions.md, api/progress.py
      Seven stages in order; choose on validation only; never invent a measurement; say what
      could not be done; a user message beats the plan; ./progress appends one line per call.
