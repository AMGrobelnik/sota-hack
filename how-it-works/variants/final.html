<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 420px;
  --bar: 56px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.pg { font-size: 15px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }
.top nav a { white-space: nowrap; }
@media (max-width: 560px) {
  .pg { display: none; }
  .top nav a { font-size: 14px; }
  .top .btn { padding: 7px 12px; }
  .step h1 { font-size: 38px; }
  .step h2 { font-size: 30px; }
}

/* steps (text) */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 18px; color: #fff; font-weight: 650; letter-spacing: -.03em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 46px; }
.step h2 { font-size: 36px; }
.step p { margin: 0 0 12px; color: #c4d1df; font-size: 17.5px; line-height: 1.48; max-width: 36ch; }
.step .kick { font-size: 15px; color: var(--signal); font-weight: 600; margin-bottom: 10px; }
.step p.src { font-size: 14.5px; }
.step p.src a { color: var(--signal); text-underline-offset: 3px; }
.step .hint { color: var(--mute); font-size: 15px; margin-top: 22px; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 150px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }

    if (st.kicker) H('p', 'kick', st.kicker, sec);
    var h = H(i === 0 ? 'h1' : 'h2', '', st.title, sec); h.id = 'h-' + st.key; sec.setAttribute('aria-labelledby', h.id);
    st.lines.forEach(function (l) { H('p', '', l, sec); });
    [].concat(st.link || []).forEach(function (L) { var lk = H('a', '', L.text, H('p', 'src', null, sec)); lk.href = L.href; lk.target = '_blank'; lk.rel = 'noopener'; });
    if (st.hint) H('p', 'hint', st.hint, sec);
    // figure: the same map, cropped to this step (shown in the plain sequence)
    var fig = H('figure', 'fig', null, sec);
    var r = st.rect, pad = 16;
    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);
    var use = E('use', { href: '#map' }, fs);
    // the plain sequence has no camera, so a stage figure gets the lab box lit for that stage
    if (st.stage != null || st.whole) {
      var sk = st.stage != null ? ST[st.stage] : null;
      drawGrid(E('g', { transform: 'translate(' + (st.labX - GW / 2) + ' ' + LABY + ')' }, fs), sk ? sk.skills : null, callsText(sk));
    }
    if (st.whole) use.setAttribute('style', '--ov:1');
    var dbox = H('div', 'detail', null, sec);
    detail(st, dbox);
    return sec;
  });

  // ---------- minimap ----------
  var mini = document.getElementById('mini');
  mini.setAttribute('viewBox', ALL.x + ' ' + ALL.y + ' ' + ALL.w + ' ' + ALL.h);
  ['spec', 'run', 'agent', 'talk', 'tools', 'meas'].forEach(function (k) { var r = REG[k]; E('rect', { x: r.x, y: r.y, width: r.w, height: r.h, 'class': 'mr', rx: 30, 'data-go': k }, mini); });
  E('rect', { x: PX, y: orchY, width: PSTEP * 6 + PWID, height: orchH, 'class': 'mr', rx: 20, 'data-go': 'pipe' }, mini);
  for (var mi = 0; mi < 7; mi++) E('rect', { x: PX + mi * PSTEP, y: Y0, width: PWID, height: PH, 'class': 'mr', rx: 20, 'data-go': 'st' + mi }, mini);
  var mcam = E('rect', { 'class': 'mc', rx: 24 }, mini);
  var wl = document.getElementById('wl');

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  var FOCUS = { spec: 'spec', run: 'run', agent: 'agent', talk: 'talk', pipe: 'pipe', tools: 'tools', meas: 'meas' };
  function fit(r, a) {
    var pad = 24, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }
    return { cx: x + w / 2, cy: y + h / 2, w: w };
  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STEPS.map(function (s) { return fit(s.rect, A); });
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    var st = STEPS[i];
    panels.forEach(function (p, k) {
      p.classList.toggle('on', st.stage === k);
      p.classList.toggle('dim', st.stage != null && st.stage !== k);
    });
    var fr = st.stage != null ? 'pipe' : FOCUS[st.key];
    regions.forEach(function (r) { r.classList.toggle('dim', !!fr && r.getAttribute('data-r') !== fr); });
    // the lab box lights the tools of the current stage
    var sk = st.stage != null ? ST[st.stage] : null;
    labG.classList.toggle('dim', !!fr && fr !== 'pipe');
    for (var tn in LABD.tiles) LABD.tiles[tn].classList.toggle('lit', !!sk && sk.skills.indexOf(tn) >= 0);
    LABD.sub.textContent = callsText(sk);
    wl.innerHTML = '';
    var b = document.createElement('b'); b.textContent = i === 0 ? C.where.overview : C.where.step.replace('{n}', i).replace('{t}', TOTAL);
    wl.appendChild(b); wl.appendChild(document.createTextNode('  ' + (i === 0 ? '' : st.title)));
  }
  function frame() {
    raf = 0; if (!isCam) return;
    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);
    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;
    cam.setAttribute('viewBox', (cx - w / 2).toFixed(2) + ' ' + (cy - h / 2).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2));
    var scale = vp.clientWidth / w;
    var ov = Math.max(0, Math.min(1, (0.26 - scale) / 0.08));
    cam.style.setProperty('--ov', ov.toFixed(3));
    setOv(ov > 0.5);
    placeLab(STEPS[i].labX + (STEPS[i + 1].labX - STEPS[i].labX) * t);
    setPon(Math.abs(f - PIPE) < 0.25);
    mcam.setAttribute('x', cx - w / 2); mcam.setAttribute('y', cy - h / 2); mcam.setAttribute('width', w); mcam.setAttribute('height', h);
    setCurrent(Math.round(f));
  }
  function req() { if (!raf) raf = requestAnimationFrame(frame); }
  function go(n) { window.scrollTo({ top: n * unit(), behavior: 'smooth' }); }

  // whole-map view: each section label (and its region) jumps to that section's first stop
  var jumps = [].slice.call(map.querySelectorAll('.ov .jump')), ovOn = null;
  // the chip lab has no stop of its own: its box sits under the stages, so it opens the first stage
  var JUMPTO = { tools: 'st0' };
  function firstStop(k) { k = JUMPTO[k] || k; for (var i = 0; i < N; i++) if (STEPS[i].key === k) return i; return 0; }
  var PIPE = firstStop('pipe');
  function setOv(on) {
    if (on === ovOn) return; ovOn = on;
    cam.classList.toggle('ovon', on);
    jumps.forEach(function (j) { j.setAttribute('tabindex', on ? '0' : '-1'); if (!on) j.classList.remove('hov'); });
    if (!on && jumps.indexOf(document.activeElement) >= 0) document.activeElement.blur();
  }
  function label(k) { return map.querySelector('.ov .jump[data-k="' + k + '"]'); }
  jumps.forEach(function (j) {
    var k = j.getAttribute('data-k');
    j.addEventListener('click', function () { if (ovOn) go(firstStop(k)); });
    j.addEventListener('keydown', function (e) { if (ovOn && e.key === 'Enter') { e.preventDefault(); go(firstStop(k)); } });
  });
  regions.forEach(function (r) {
    var k = r.getAttribute('data-r');
    r.addEventListener('click', function () { if (ovOn) go(firstStop(k)); });
    r.addEventListener('mouseenter', function () { if (ovOn) label(k).classList.add('hov'); });
    r.addEventListener('mouseleave', function () { label(k).classList.remove('hov'); });
  });
  labG.addEventListener('click', function () { if (ovOn) go(firstStop('tools')); });
  labG.addEventListener('mouseenter', function () { if (ovOn) label('tools').classList.add('hov'); });
  labG.addEventListener('mouseleave', function () { label('tools').classList.remove('hov'); });

  // pipeline stop: each stage panel jumps to that stage's own stop
  var ponOn = null;
  function setPon(on) {
    if (on === ponOn) return; ponOn = on;
    cam.classList.toggle('pon', on);
    panels.forEach(function (p) { p.setAttribute('tabindex', on ? '0' : '-1'); });
    if (!on && panels.indexOf(document.activeElement) >= 0) document.activeElement.blur();
  }
  panels.forEach(function (p, i) {
    p.setAttribute('role', 'link'); p.setAttribute('tabindex', '-1'); p.setAttribute('aria-label', ST[i].name);
    p.addEventListener('click', function (e) { if (ponOn) { e.stopPropagation(); go(firstStop('st' + i)); } });
    p.addEventListener('keydown', function (e) { if (ponOn && e.key === 'Enter') { e.preventDefault(); go(firstStop('st' + i)); } });
  });

  // mini map: every rectangle jumps to the stop it stands for, on every stop
  [].slice.call(mini.querySelectorAll('.mr[data-go]')).forEach(function (r) {
    var n = firstStop(r.getAttribute('data-go'));
    r.setAttribute('role', 'link'); r.setAttribute('tabindex', '0'); r.setAttribute('aria-label', STEPS[n].title);
    r.addEventListener('click', function () { go(n); });
    r.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); go(n); } });
  });
  addEventListener('scroll', req, { passive: true });
  addEventListener('resize', function () { applyMode(); });
  addEventListener('keydown', function (e) {
    if (!isCam || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;
    if (k === ' ' && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
    e.preventDefault();
    var here = Math.round(scrollY / unit());
    go(Math.max(0, Math.min(N - 1, here + d)));
  });

  // one wheel or trackpad gesture moves one step; momentum after it is absorbed
  var lock = 0, lastW = 0, acc = 0;
  addEventListener('wheel', function (e) {
    if (!isCam || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gap = now - lastW; lastW = now;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (now < lock) { lock = Math.max(lock, now + 160); return; }
    if (gap > 220) acc = 0;
    acc += dy;
    if (Math.abs(acc) >= 24) {
      var here = Math.round(scrollY / unit());
      go(Math.max(0, Math.min(N - 1, here + (acc > 0 ? 1 : -1))));
      acc = 0; lock = now + 650;
    }
  }, { passive: false });

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function applyMode() {
    var want = mqCam.matches && !mqRm.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');
      if (!want) { panels.concat(regions).forEach(function (p) { p.classList.remove('on', 'dim'); }); cam.style.setProperty('--ov', '0'); setOv(false); setPon(false); cur = -1; }
      // the plain sequence draws its own lit box in each figure, so the live one hides
      labG.setAttribute('visibility', want ? 'visible' : 'hidden');
    }
    if (isCam) { measureVp(); req(); }
  }
  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
})();
</script>
