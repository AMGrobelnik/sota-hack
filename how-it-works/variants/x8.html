<style>
:root {
  --night: #0f1a2a;
  --sheet: #0c1727;
  --signal: #5be49b;
  --amber: #ffb86b;
  --mute: #9fb1c6;
  --line: rgba(168, 206, 240, .5);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --col: 440px;
  --rail: 68px;
  --bar: 56px;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 18px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }

/* text column */
main { padding-top: var(--bar); }
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.025em; line-height: 1.06; text-wrap: balance; }
.step h1 { font-size: 48px; }
.step h2 { font-size: 42px; }
.step p { margin: 0 0 14px; color: #c9d5e2; font-size: 18.5px; line-height: 1.5; max-width: 34ch; }
.step .kick { font-size: 17px; color: var(--signal); font-weight: 600; margin-bottom: 12px; }
.step .hint { color: var(--mute); font-size: 16px; margin-top: 24px; }
.step ul.lim { list-style: none; margin: 0 0 24px; padding: 0; }
.step ul.lim li { color: #dfe8f1; font-size: 18.5px; line-height: 1.42; padding: 10px 0; border-top: 1px solid var(--rule); max-width: 34ch; }
.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }
.acts { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 4px 0 24px; }
.acts a:not(.btn) { font-weight: 600; color: #dbe5ef; text-underline-offset: 4px; }
.acts .btn { padding: 11px 18px; font-size: 17px; }
footer { font-size: 15px; color: var(--mute); max-width: 34ch; }

/* camera mode */
.cam main { width: var(--col); }
.cam .step { height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 34px 40px clamp(24px, 3vw, 44px); scroll-snap-align: start; scroll-snap-stop: always; }
.cam .step:first-child { margin-top: calc(-1 * var(--bar)); padding-top: var(--bar); }
html.cam { scroll-snap-type: y mandatory; }
.cam .detail { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#viewport { position: fixed; left: var(--col); right: var(--rail); top: var(--bar); bottom: 0; border-left: 1px solid var(--rule); overflow: hidden;
  background-color: var(--sheet);

  function ul(parent, items) { var u = H('ul', '', null, parent); items.forEach(function (t) { H('li', '', t, u); }); return u; }
  function detail(st, box) {
    var k = st.key;
    if (k === 'intake') {
      H('h3', '', IN.ideaLabel, box); H('p', '', IN.idea, box);
      H('h3', '', IN.stepsLabel, box);
      var ol = H('ol', '', null, box); IN.steps.forEach(function (q) { H('li', '', q.name + ': ' + q.q + ' ' + IN.defaultWord + ': ' + q.d + '.', ol); });
      H('h3', '', IN.byTypeLabel, box); dl(box, IN.byType);
      H('h3', '', IN.specLabel + ' (' + IN.specEdit.toLowerCase() + ')', box); dl(box, IN.spec);
      H('p', '', IN.specNote, box); H('p', '', IN.fixed, box);
    } else if (k === 'run') {
      H('h3', '', RU.presetLabel, box);
      ul(box, RU.presets.map(function (p) { return p.name + ': ' + (p.n ? p.n + ' ' + RU.perBatch : p.between) + '. ' + p.effort + '.'; }));
      H('p', '', RU.presetNote, box);
      H('h3', '', RU.modelLabel, box);
      ul(box, RU.models.map(function (m) { return m.name + (m.tag ? ' (' + m.tag.toLowerCase() + ')' : '') + ': ' + m.text + ' ' + RU.harnessWord + ': ' + m.harness + '.'; }));
    } else if (k === 'glance') {
      H('p', '', PI.orchTitle + ': ' + PI.orchSub, box);
      ul(box, ST.map(function (s, i) { return (i + 1) + '. ' + s.name + ': ' + (s.alone ? PI.alone : PI.batch) + '.'; }));
      H('h3', '', PI.mechLabel, box); ul(box, PI.mech);
    } else if (st.stage != null) {
      var s = ST[st.stage];
      H('p', '', s.does, box);
      if (s.alone) { H('h3', '', PI.aloneLabel, box); ul(box, s.steps); }
      else { H('h3', '', PI.batchLabel, box); ul(box, s.strategies); if (s.note) H('p', '', s.note, box); }
      dl(box, [[PI.toolsWord, codes(s.tools)], [PI.backWord, s.back], [s.alone ? PI.carryWord : PI.mergeWord, s.merge]]);
    } else if (k === 'agent') {
      H('h3', '', AG.title, box); dl(box, AG.layers.map(function (l) { return ['(' + l.k + ') ' + l.name, l.text]; }));
      dl(box, AG.roles.map(function (r) { return [r.name, r.text]; })); H('p', '', AG.rule, box);
    } else if (k === 'tools') {
      H('h3', '', fill(TO.title), box);
      TO.groups.forEach(function (g) {
        H('h3', '', g.name + ' (' + g.tools.length + ')', box);
        var t = H('table', '', null, box), tb = H('tbody', '', null, t);
        g.tools.forEach(function (x) { var r = H('tr', '', null, tb); H('code', '', x[0], H('td', '', null, r)); H('td', '', x[1], r); });
      });
    } else if (k === 'report') {
      ul(box, RP.flow.map(function (f) { return f.name + ': ' + f.text + '.'; }));
      H('h3', '', RP.announceLabel, box); ul(box, RP.announce);
      H('h3', '', RP.eventsLabel, box); H('p', '', null, box).appendChild(codes(RP.events));
      H('h3', '', RP.sumTitle, box); H('p', '', RP.sumModel, box); dl(box, RP.sums); H('p', '', RP.toolLine, box);
    } else if (k === 'talk') {
      H('h3', '', TK.example, box); ul(box, TK.msgs.map(function (m) { return (m.from === 'you' ? TK.you : TK.orch) + ': ' + m.text; }));
      H('p', '', TK.stream + '. ' + TK.stop + ' ' + TK.noFork, box);
      H('p', '', null, box).appendChild(codes([TK.route, TK.event]));
    } else if (k === 'checks') {
      H('h3', '', CK.chipLabel, box); ul(box, CK.levels.map(function (l) { return l.n + '. ' + l.name + (l.tool ? ' (' + l.tool + ')' : ''); }));
      H('p', '', CK.levelNote, box);
      H('h3', '', CK.patLabel, box); H('p', '', CK.pat, box);
      H('h3', '', CK.srcLabel, box); ul(box, CK.classes); H('p', '', CK.srcText, box); H('p', '', CK.srcNot, box); H('p', '', CK.marks, box);
    } else if (k === 'meas') {
      dl(box, ME.rows.map(function (r) { return [r.fig, ME.head[1] + ': ' + r.scope]; }));
      H('p', '', ME.note, box);
    } else if (k === 'limits') {
      dl(box, [[LM.gives, LM.givesList.join('; ') + '.'], [LM.keeps, LM.keepsList.join('; ') + '.']]);
    }
  }
  var sections = STEPS.map(function (st, i) {
    var sec = H('section', 'step', null, main);
    sec.id = 'step-' + st.key;
    if (st.kicker) H('p', 'kick', st.kicker, sec);
    var h = H(i === 0 ? 'h1' : 'h2', '', st.title, sec); h.id = 'h-' + st.key; sec.setAttribute('aria-labelledby', h.id);
    if (st.key === 'limits') {
      var u = H('ul', 'lim', null, sec); st.lines.forEach(function (l) { H('li', '', l, u); });
      var a = H('div', 'acts', null, sec);
      var b1 = H('a', 'btn', C.nav.dashboard, a); b1.href = '../../dashboard/';
      var b2 = H('a', '', C.nav.home, a); b2.href = '../../';
      H('footer', '', C.footer, sec);
    } else {
      st.lines.forEach(function (l) { H('p', '', l, sec); });
      if (st.hint) H('p', 'hint', st.hint, sec);
    }
    var dbox = H('div', 'detail', null, sec);
    detail(st, dbox);
    return sec;
  });

  // ---------- progress rail ----------
  var rail = document.getElementById('rail'), railFill = rail.querySelector('.fill'), railTrack = rail.querySelector('.track');
  var countEl = document.getElementById('count');
  rail.setAttribute('aria-label', C.railLabel);
  var dots = STEPS.map(function (st, i) {
    var b = H('button', '', null, rail); b.type = 'button';
    b.setAttribute('aria-label', fill(C.railCount).replace('{i}', i + 1) + ': ' + st.short);
    H('i', '', null, b); H('span', '', st.short, b);
    b.addEventListener('click', function () { go(i); });
    return b;
  });
  var DY0 = 34, DSTEP = 0;
  function layoutRail() {
    var h = rail.clientHeight, top = DY0, bot = h - 74;
    DSTEP = (bot - top) / (N - 1);
    dots.forEach(function (b, i) { b.style.top = (top + i * DSTEP).toFixed(2) + 'px'; });
    railTrack.style.top = railFill.style.top = top + 'px';
    railTrack.style.height = (bot - top) + 'px';
  }

  // ---------- margin captions with leader lines (opening view only) ----------
  var ovl = document.getElementById('ovl');
  function drawCaptions(f, vw, vh) {
    while (ovl.firstChild) ovl.removeChild(ovl.firstChild);
    ovl.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
    var s = vw / f.w, vx = f.cx - f.w / 2, vy = f.cy - (vh / s) / 2;
    function sx(x) { return (x - vx) * s; } function sy(y) { return (y - vy) * s; }
    var mapTop = sy(0), mapBot = sy(ALL.h);
    var cap = C.captions;
    var top = [['intake', 0], ['run', 1], ['glance', 0], ['agent', 1], ['tools', 0], ['report', 1]];
    var bot = [['talk', 0], ['checks', 1], ['meas', 0], ['limits', 1]];
    function one(key, tier, up, ax, ay) {
      var text = fill(cap[key]);
      var ty = up ? Math.max(30, mapTop - 34 - tier * 46) : Math.min(vh - 22, mapBot + 46 + tier * 46);
      E('circle', { cx: ax, cy: ay, r: 2.6, 'class': 'ovd' }, ovl);
      var shelfY = up ? ty + 8 : ty - 21;
      var tw = mw(text, 15, 600), left = ax + tw + 18 > vw - 8;
      E('path', { d: 'M' + ax + ' ' + ay + 'V' + shelfY + 'H' + (left ? ax - tw - 12 : ax + tw + 12), 'class': 'ovl' }, ovl);
      var t = E('text', { x: left ? ax - 6 : ax + 6, y: up ? ty : ty - 2, 'class': 'ovt' }, ovl); t.textContent = text;
      if (left) t.setAttribute('text-anchor', 'end');
    }
    top.forEach(function (p, i) { var r = REG[p[0]]; one(p[0], p[1], true, sx(i === top.length - 1 ? r.x + r.w - 28 : r.x + 28), sy(r.y)); });
    bot.forEach(function (p) { var r = REG[p[0]]; one(p[0], p[1], false, sx(r.x + 28), sy(r.y + r.h)); });
    one('details', 0, false, sx(REG.bracket.x), sy(REG.bracket.y));
  }

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null;
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function fit(r, a, pad) {
    var x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }
    return { cx: x + w / 2, cy: y + h / 2, w: w };
  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STEPS.map(function (s) { return s.whole ? fit(ALL, A, ALL.w * 0.035) : fit(s.rect, A, 22); });
    drawCaptions(FIT[0], w, h);
    layoutRail();
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    var st = STEPS[i];
    Object.keys(GROUPS).forEach(function (k) { GROUPS[k].classList.toggle('hid', !!st.vis && st.vis.indexOf(k) < 0); });
    cam.classList.toggle('far', !!st.whole);
    ovl.classList.toggle('on', !!st.whole);
    dots.forEach(function (b, k) {
      b.classList.toggle('done', k < i); b.classList.toggle('cur', k === i);
      if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    railFill.style.height = (i * DSTEP).toFixed(2) + 'px';
    countEl.textContent = fill(C.railCount).replace('{i}', i + 1);
  }
  function frame() {
    raf = 0; if (!isCam) return;
    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);
    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;
    cam.setAttribute('viewBox', (cx - w / 2).toFixed(2) + ' ' + (cy - h / 2).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2));
    setCurrent(Math.round(f));
  }
  function req() { if (!raf) raf = requestAnimationFrame(frame); }
  function go(n) { window.scrollTo({ top: n * unit(), behavior: mqRm.matches ? 'instant' : 'smooth' }); }
  addEventListener('scroll', req, { passive: true });
  addEventListener('resize', function () { applyMode(); });
  // Up, Down, Page Up, Page Down, Space, Home and End move one stop; Left and Right are left alone
  addEventListener('keydown', function (e) {
    if (!isCam || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;
    if (k === ' ' && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
    e.preventDefault();
    var here = Math.round(scrollY / unit());
    go(Math.max(0, Math.min(N - 1, here + d)));
  });
  // one wheel or trackpad gesture moves one stop; momentum after it is absorbed
  var lock = 0, lastW = 0, acc = 0;
  addEventListener('wheel', function (e) {
    if (!isCam || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gap = now - lastW; lastW = now;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (now < lock) { lock = Math.max(lock, now + 160); return; }
    if (gap > 220) acc = 0;
    acc += dy;
    if (Math.abs(acc) >= 24) {
      var here = Math.round(scrollY / unit());
      go(Math.max(0, Math.min(N - 1, here + (acc > 0 ? 1 : -1))));
      acc = 0; lock = now + (mqRm.matches ? 300 : 650);
    }
  }, { passive: false });

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  function applyMode() {
    var want = mqCam.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');
      if (!want) { Object.keys(GROUPS).forEach(function (k) { GROUPS[k].classList.remove('hid'); }); cur = -1; }
    }
    if (isCam) { measureVp(); cur = -1; req(); }
  }
  mqCam.addEventListener('change', applyMode);
  applyMode();
  window.__x8 = { overflow: OVERFLOW, stops: N, tools: TOOLN };
})();
</script>
