main { padding-top: var(--bar); position: relative; }

.step ul.lim { list-style: none; margin: 0 0 22px; padding: 0; }

.step ul.lim li:last-child { border-bottom: 1px solid var(--rule); }

.acts .btn { padding: 11px 18px; font-size: 16px; }
footer { font-size: 15px; color: #94a6bb; max-width: 36ch; }

.cam main { width: var(--col); }

  function toolTable(box, gi) {

    } else if (k === 'run') {

    } else if (st.stage != null) {

    } else if (k === 'agent') {

      H('p', '', A.rule, box); dl(box, A.roles.map(function (r) { return [r.name, r.text]; }));
    } else if (k === 'toolsA') { toolTable(box, [0, 1, 2]);
    } else if (k === 'toolsB') { toolTable(box, [3, 4, 5]);
    } else if (k === 'reporting') {
      H('h3', '', RP.agentsTitle, box); H('p', '', RP.agentsSub, box);
      var u3 = H('ul', '', null, box); RP.progress.forEach(function (l) { H('code', '', l, H('li', '', null, u3)); });
      H('h3', '', RP.backendTitle, box); H('p', '', RP.backendSub + '. ' + RP.eventsLabel + ':', box); H('p', '', null, box).appendChild(codes(RP.events));
      H('h3', '', RP.dashTitle, box); H('p', '', RP.dashSub + '.', box);
      H('h3', '', RP.sumTitle, box); H('p', '', RP.sumText, box);
    } else if (k === 'talking') {
      H('h3', '', TK.streamLabel, box);
      var o4 = H('ol', '', null, box); TK.items.forEach(function (it) { H('li', '', it.ev + (it.who ? ', ' + it.who : '') + ': ' + it.text, o4); });
      dl(box, TK.notes.map(function (n) { return [n.t, n.d]; }));
    } else if (k === 'checks') {
      H('h3', '', CK.levelTitle, box); var o3 = H('ol', '', null, box); CK.levels.forEach(function (l) { H('li', '', l.name + (l.tool ? ' (' + l.tool + ')' : ''), o3); });
      H('p', '', CK.levelNote, box);
      H('h3', '', CK.splitTitle, box); H('p', '', CK.splitText, box);
      H('h3', '', CK.srcTitle, box); H('p', '', CK.srcTags.join('; ') + '. ' + CK.srcText + ' ' + CK.srcNot, box);
      H('h3', '', CK.markTitle, box); dl(box, CK.marks.map(function (m) { return [m.kind, m.text]; }));
    } else if (k === 'meas') {
      dl(box, ME.rows.map(function (r) { return [r.fig, ME.head[1] + ': ' + r.scope]; }));
      H('p', '', ME.note, box);
    } else if (k === 'limits') {
      dl(box, [[LI.givesTitle, LI.gives.join('; ') + '.'], [LI.keepsTitle, LI.keeps.join('; ') + '.']]);
    }
  }
  var sections = STEPS.map(function (st, i) {
    var sec = H('section', 'step', null, main);
    sec.id = 'step-' + st.key;
    if (st.kicker) H('p', 'kick', st.kicker, sec);
    var h = H(i === 0 ? 'h1' : 'h2', '', st.title, sec); h.id = 'h-' + st.key; sec.setAttribute('aria-labelledby', h.id);
    if (st.key === 'limits') {
      var u = H('ul', 'lim', null, sec); st.lines.forEach(function (l) { H('li', '', l, u); });

      var b1 = H('a', 'btn', C.nav.dashboard, a); b1.href = '../../dashboard/';
      var b2 = H('a', '', C.nav.home, a); b2.href = '../../';
      H('footer', '', C.footer, sec);
    } else if (st.key === 'intro') {
      var le = H('div', 'lede', null, sec);

    } else {
      st.lines.forEach(function (l) { H('p', '', l, sec); });
    }
    // figure: the same map, cropped to this stop (shown in the stacked version)
    var fig = H('figure', 'fig', null, sec);
    var r = st.rect, pad = 24;
    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);
    var use = E('use', { href: '#map' }, fs);

    if (st.mode === 'glance') use.setAttribute('style', '--gl:1;--dt:0');

  });

  // ---------- margin labels of the overview ----------
  var marginEl = document.getElementById('margin'), leaders = document.getElementById('leaders');
  var LBL = C.overview.rows.map(function (r) {
    var d = H('div', 'lb', null, marginEl);
    H('b', '', r.head, d);
    r.parts.forEach(function (p) { H('span', '', fill(p), d); });
    return d;
  });

  // ---------- locator ----------
  var mini = document.getElementById('mini'), whereEl = document.getElementById('where');
  mini.setAttribute('viewBox', (ALL.x - 40) + ' ' + (ALL.y - 40) + ' ' + (ALL.w + 80) + ' ' + (ALL.h + 80));
  Object.keys(REG).forEach(function (k) { if (k === 'pipe') return; var r = REG[k]; E('rect', { x: r.x, y: r.y, width: r.w, height: r.h, 'class': 'mr', rx: 40 }, mini); });
  var mcam = E('rect', { 'class': 'mc', rx: 40 }, mini);

  // ---------- progress rail ----------

  railEl.setAttribute('aria-label', C.rail.label);
  var rol = H('ol', '', null, railEl), rline = H('span', 'line', null, railEl);
  var railBtns = STEPS.map(function (st, i) {
    var li = H('li', st.stage != null ? 'stg' : '', null, rol);
    var b = H('button', '', null, li); b.type = 'button';
    var lab = C.rail.item.replace('{n}', i + 1).replace('{t}', N).replace('{title}', st.title);
    b.setAttribute('aria-label', lab); b.title = lab;
    H('span', 'tk', null, b);

    return { li: li, b: b };
  });
  function layoutRail() {
    var h = railEl.clientHeight, top = 40, bottom = 76, gap = Math.min(46, (h - top - bottom) / (N - 1));
    var y0 = top + Math.max(0, (h - top - bottom - gap * (N - 1)) / 2);
    railBtns.forEach(function (r, i) { r.li.style.top = (y0 + i * gap).toFixed(1) + 'px'; });
    rline.style.top = y0 + 'px'; rline.style.height = (gap * (N - 1)) + 'px';
  }

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var VW = 1, VH = 1, A = 1, FIT = [], raf = 0, cur = -1, isCam = null, rm = false;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  // place map rect r inside the screen rect s (viewport pixels); left: align to the left of s
  function fitTo(r, s, left) {
    var pad = 14, rw = r.w + 2 * pad, rh = r.h + 2 * pad;

    var vx = r.x + r.w / 2 - scx / k, vy = r.y + r.h / 2 - scy / k, w = VW / k;
    return { cx: vx + w / 2, cy: vy + VH / k / 2, w: w, k: k, vx: vx, vy: vy };
  }
  function bandBottom() {
    var s0 = sections[0], le = s0.querySelector('.lede'), h1 = s0.querySelector('h1');
    var b = Math.max(le.offsetTop + le.offsetHeight, h1.offsetTop + h1.offsetHeight);
    return b - parseFloat(getComputedStyle(root).getPropertyValue('--bar')) + 28;
  }
  function measureVp() {
    VW = vp.clientWidth || 1; VH = vp.clientHeight || 1; A = VW / VH;
    var band = bandBottom();
    FIT = STEPS.map(function (s, i) {
      if (i === 0) return fitTo(s.rect, { x: 70, y: band, w: VW - 100, h: VH - band - 22 }, true);
      return fitTo(s.rect, { x: 0, y: 0, w: VW, h: VH }, false);
    });
    placeLabels();
    layoutRail();
  }
  function placeLabels() {
    var f = FIT[0], bar = vp.getBoundingClientRect().top, colW = vp.getBoundingClientRect().left;
    var mapLeft = colW + (ALL.x - f.vx) * f.k;
    var prevBottom = bar + bandBottom() - 10, d = '', dots = [];
    var xb = mapLeft - 22, xl = colW - 56;
    ROWS.forEach(function (row, i) {
      var top = bar + (row.y - f.vy) * f.k, bot = bar + (row.y + row.h - f.vy) * f.k, mid = (top + bot) / 2;
      var el = LBL[i], h = el.offsetHeight, y = Math.max(prevBottom + 10, mid - h / 2);
      el.style.top = y.toFixed(1) + 'px';
      prevBottom = y + h;
      var yh = Math.min(Math.max(y + 11, top + 6), bot - 6);
      d += 'M' + xl + ' ' + yh.toFixed(1) + 'H' + xb + 'M' + (xb + 9) + ' ' + top.toFixed(1) + 'H' + xb + 'V' + bot.toFixed(1) + 'H' + (xb + 9);
      dots.push([xl, yh]);
    });
    leaders.innerHTML = '';
    E('path', { d: d }, leaders);
    dots.forEach(function (p) { E('circle', { cx: p[0], cy: p[1].toFixed(1), r: 2.5 }, leaders); });
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setCurrent(i) {

    var st = STEPS[i];
    cam.setAttribute('data-mode', st.mode);
    regions.forEach(function (r) {
      var k = r.getAttribute('data-r');
      var on = st.show === null ? true : st.show.indexOf(k) >= 0;

  function frame() {

    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    if (rm) f = Math.round(f);
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);

    mcam.setAttribute('x', cx - w / 2); mcam.setAttribute('y', cy - h / 2); mcam.setAttribute('width', w); mcam.setAttribute('height', h);
    var o = Math.max(0, Math.min(1, 1 - f * 3));

  addEventListener('scroll', req, { passive: true });
