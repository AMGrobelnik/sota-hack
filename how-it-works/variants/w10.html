<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChipIn</title>
<meta name="theme-color" content="#0f1a2a">
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --ink: #e8eef5;
  --ink2: #c4d1df;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --rule2: rgba(214, 228, 242, .32);
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --m: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pad: clamp(18px, 4.2vw, 60px);
  --hh: 52px;
  --cols: 150px minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
html.present { scroll-snap-type: y mandatory; }
body { margin: 0; color: var(--ink); font: 400 16px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }

/* header and position indicator */
.top { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: var(--hh); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 0 var(--pad); background: rgba(15, 26, 42, .97); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
.brand span { font-weight: 500; color: var(--mute); margin-left: 8px; }
.where { justify-self: center; font-size: 14px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.where b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.where i { font-style: normal; color: var(--ink2); margin-left: 10px; }
.nav { display: flex; gap: 18px; align-items: center; }
.nav a { font-size: 14.5px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.nav a:hover { text-decoration: underline; text-underline-offset: 4px; }
.nav a.go { background: var(--signal); color: #062418; padding: 7px 13px; border-radius: 8px; }
.nav a.go:hover { background: #86f2b9; text-decoration: none; }
.prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; display: flex; gap: 2px; }
.prog i { flex: 1; background: transparent; }
.prog i.done { background: rgba(91, 228, 155, .28); }
.prog i.cur { background: var(--signal); }

/* steps */
.step { position: relative; min-height: 100vh; min-height: 100svh; padding: calc(var(--hh) + 26px) var(--pad) 26px; display: flex; flex-direction: column; border-bottom: 1px solid var(--rule); scroll-snap-align: start; }
.in { width: 100%; max-width: 1320px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; }
.num { font-size: 14px; font-weight: 600; color: var(--signal); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.step h2, .mx h2 { font-size: clamp(26px, 2.5vw, 36px); line-height: 1.1; letter-spacing: -.03em; font-weight: 650; color: #fff; max-width: 40ch; text-wrap: balance; }
.lede { font-size: clamp(16px, 1.3vw, 18.5px); line-height: 1.45; color: var(--ink2); max-width: 74ch; margin-top: 10px; }
.body { margin-top: 26px; }
.note { font-size: 14.5px; color: var(--mute); margin-top: 16px; max-width: 80ch; }

/* overview */
.ov h1 { font-size: clamp(40px, 5vw, 72px); line-height: 1; letter-spacing: -.04em; font-weight: 650; color: #fff; max-width: 18ch; }
.ov .lede { font-size: clamp(17px, 1.5vw, 21px); max-width: 60ch; margin-top: 18px; }
.outline { list-style: none; margin: 34px 0 0; padding: 18px 0 0; border-top: 1px solid var(--rule); columns: 3; column-gap: 40px; counter-reset: o; }
.outline li { break-inside: avoid; display: grid; grid-template-columns: 30px 1fr; padding: 5px 0; font-size: 15.5px; color: var(--ink2); }
.outline li span { color: var(--mute); font-variant-numeric: tabular-nums; }
.keys { margin-top: 24px; font-size: 14px; color: var(--mute); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.4; }
.tbl th { text-align: left; font-size: 13px; font-weight: 600; color: var(--mute); padding: 0 16px 8px 0; border-bottom: 1px solid var(--rule2); vertical-align: bottom; }
.tbl td { padding: 10px 16px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; color: var(--ink2); }
.tbl td:first-child { color: var(--ink); }
.tbl td.n { color: var(--mute); width: 30px; font-variant-numeric: tabular-nums; }
.tbl td b { color: #fff; font-weight: 600; }
code.t { font: 500 13px/1.3 var(--m); color: #dff7ea; background: rgba(91, 228, 155, .08); border: 1px solid rgba(91, 228, 155, .24); border-radius: 5px; padding: 1px 5px; white-space: nowrap; }
.tl { display: flex; flex-wrap: wrap; gap: 5px; }

/* step 1 */
.s1 { display: grid; grid-template-columns: 250px 24px minmax(0, 1fr) 24px 270px; align-items: start; }
.arw { align-self: center; color: var(--mute); text-align: center; }
.arw svg { width: 18px; height: 18px; display: block; margin: 0 auto; }
.card { border: 1px solid var(--rule2); border-radius: 10px; padding: 14px 16px; background: var(--deep); }
.card h3 { font-size: 13px; font-weight: 600; color: var(--mute); margin-bottom: 8px; }
.card p.q { font-size: 16px; color: #fff; line-height: 1.4; }
.card + .card { margin-top: 14px; }
.card dl { margin: 0; font-size: 13.5px; line-height: 1.35; }
.card dt { color: #fff; font-weight: 600; margin-top: 7px; }
.card dt:first-child { margin-top: 0; }
.card dd { margin: 1px 0 0; color: var(--ink2); }
.card .warn { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--amber); font-size: 13.5px; }
.spec dd { border-bottom: 1px dashed var(--rule2); padding-bottom: 3px; }
.s1 .tbl { font-size: 14.5px; }
.s1 .tbl td { padding: 8px 14px 8px 0; }

/* step 2 */
.s2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.s2 h3, .s11 h3, .s13 h3 { font-size: 15px; font-weight: 600; color: #fff; margin: 0 0 10px; }
.s2 h3 + .tbl, .s13 h3 + .tbl { margin-bottom: 26px; }

/* diagrams */
svg.dg { display: block; width: 100%; height: auto; overflow: visible; }
.dg .b { fill: var(--deep); stroke: rgba(214, 228, 242, .38); stroke-width: 1.2; }
.dg .b.o { stroke: var(--ink2); }
.dg .b.on { stroke: var(--signal); stroke-width: 1.6; }
.dg .b.drop { stroke-dasharray: 4 4; fill: transparent; }
.dg .b.p, .dg .b.out { stroke: var(--signal); stroke-width: 1.6; }
.dg .b.ghost { fill: #13223a; stroke: rgba(214, 228, 242, .2); }
.dg .ln { fill: none; stroke: rgba(214, 228, 242, .42); stroke-width: 1.3; }
.dg .ln.on { stroke: var(--signal); stroke-width: 1.8; }
.dg .ln.dash { stroke-dasharray: 3 4; }
.dg text { font-family: var(--f); }
.dg .t { fill: var(--ink); font-size: 14px; }
.dg .t.on { fill: #fff; font-weight: 600; }
.dg .h { fill: #fff; font-size: 15px; font-weight: 650; }
.dg .k { fill: var(--mute); font-size: 13px; }
.dg .k.on { fill: var(--signal); }
.dg .k.drop { fill: var(--mute); font-style: italic; }
.dg .dot { fill: var(--deep); stroke: var(--ink2); stroke-width: 1.4; }
.dg .dot.on { fill: var(--signal); stroke: var(--signal); }
.dg .ah { fill: rgba(214, 228, 242, .6); }
.dg.big .t { font-size: 17px; }
.dg.big .h { font-size: 18px; }
.dg.big .k { font-size: 15.5px; }
svg.dg.narrow { display: none; }

/* step 3 */
.s3 { margin-top: 30px; }

/* matrix */
.mx { position: relative; border-bottom: 1px solid var(--rule); }
.mx-pin { padding: calc(var(--hh) + 22px) var(--pad) 18px; }
.mx-pin > .in { flex: none; }
.mx-snap { display: none; }
html.present .mx { height: 700vh; height: 700svh; }
html.present .mx-pin { position: sticky; top: 0; height: 100vh; height: 100svh; display: flex; flex-direction: column; }
html.present .mx-snap { display: block; position: absolute; left: 0; right: 0; height: 100vh; height: 100svh; pointer-events: none; scroll-snap-align: start; }
.mt { margin-top: 18px; }
.mx .lede { max-width: none; }
.mxh { display: grid; grid-template-columns: var(--cols); gap: 0 20px; padding: 0 14px 8px; border-bottom: 1px solid var(--rule2); font-size: 13px; font-weight: 600; color: var(--mute); }
.row { border-bottom: 1px solid var(--rule); position: relative; transition: background-color .3s; }
.row.on { background: var(--deep); box-shadow: inset 3px 0 0 var(--signal); }
.fold { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .34s ease; }
.fold > div { min-height: 0; overflow: hidden; }
.row .f-line { grid-template-rows: 1fr; }
.row.on .f-line { grid-template-rows: 0fr; }
.row.on .f-zoom { grid-template-rows: 1fr; }
.line { display: grid; grid-template-columns: var(--cols); gap: 0 20px; padding: 0 14px; height: 38px; align-items: center; font-size: 14px; color: var(--mute); white-space: nowrap; }
.line > * { overflow: hidden; text-overflow: ellipsis; }
.line button { all: unset; cursor: pointer; font-weight: 650; color: var(--ink); font-size: 15px; border-radius: 4px; }
.line button span { color: var(--mute); font-weight: 500; font-size: 13px; margin-left: 8px; }
.line button:hover { color: var(--signal); }
.line button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.zoom { display: grid; grid-template-columns: var(--cols); gap: 0 20px; padding: 16px 14px 14px; font-size: 14.5px; line-height: 1.42; color: var(--ink2); }
.zoom .c0 .sn { font-size: 13px; font-weight: 600; color: var(--signal); }
.zoom .c0 h3 { font-size: 28px; font-weight: 650; letter-spacing: -.03em; color: #fff; line-height: 1.05; margin-top: 2px; }
.zoom .c0 p { font-size: 13px; color: var(--mute); margin-top: 6px; }
.zoom ul { margin: 0; padding: 0; list-style: none; }
.zoom li + li { margin-top: 6px; }
.zoom .tl { gap: 5px; }
.zoom .cl { display: none; font-size: 12.5px; font-weight: 600; color: var(--mute); margin-bottom: 2px; }
.zoom .dgw { grid-column: 1 / -1; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule); }
html:not(.present) .row .f-line { display: none; }
html:not(.present) .row .f-zoom { grid-template-rows: 1fr; }
html:not(.present) .row { box-shadow: none; background: transparent; }

/* step 11 */
.s11 { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 52px; align-items: start; }
.claim { margin-top: 22px; padding: 14px 18px; border-left: 3px solid var(--signal); background: var(--deep); font-size: 17px; line-height: 1.45; color: #fff; max-width: 70ch; }

/* step 12 */
.tg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 28px; }
.tg section + section { margin-top: 16px; }
.tg h3 { font-size: 14px; font-weight: 650; color: #fff; padding-bottom: 5px; border-bottom: 1px solid var(--rule2); margin-bottom: 3px; }
.tg h3 span { color: var(--mute); font-weight: 500; margin-left: 6px; }
.tg ul { list-style: none; margin: 0; padding: 0; }
.tg li { padding: 3px 0; border-bottom: 1px solid var(--rule); }
.tg .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.tg .st { font-size: 12px; color: var(--signal); white-space: nowrap; }
.tg .st.x { color: var(--mute); }
.tg p { font-size: 13px; line-height: 1.3; color: var(--ink2); margin-top: 1px; }
.tgk { font-size: 13px; color: var(--mute); margin-top: 12px; }

/* step 13 */
.s13 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.lv { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--signal); color: var(--signal); align-items: center; justify-content: center; font-weight: 650; font-size: 13px; }
.mk { display: grid; gap: 12px; }
.mk > div { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.mk .ex { font-size: 20px; font-weight: 650; color: #fff; letter-spacing: -.02em; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.mk p { font-size: 14px; color: var(--ink2); margin-top: 6px; }
.tag { display: inline-flex; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 1px 9px; border: 1px solid; letter-spacing: 0; }
.tag.e { color: var(--amber); border-color: rgba(255, 184, 107, .55); }
.tag.s { color: var(--dusk); border-color: rgba(201, 163, 196, .6); }
.tag.m { color: var(--signal); border-color: rgba(91, 228, 155, .55); }

/* step 14 */
.s14 .big { font-size: 26px; font-weight: 650; letter-spacing: -.02em; color: #fff; line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.s14 td:first-child { width: 220px; }
.s14 td:nth-child(2) { color: var(--ink); max-width: 60ch; }
.s14 td:last-child { width: 30%; }
.bars { margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; align-items: center; font-size: 13px; color: var(--ink2); max-width: 520px; }
.bars i { display: block; height: 10px; background: var(--ink2); border-radius: 2px; }
.bars i.c { background: var(--mute); }

/* step 15 and footer */
.lim { list-style: none; margin: 0; padding: 0; max-width: 80ch; }
.lim li { padding: 14px 0; border-bottom: 1px solid var(--rule); font-size: 18px; color: var(--ink); }
.lim li:first-child { border-top: 1px solid var(--rule); }
.end { margin-top: auto; padding-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; align-items: center; font-size: 14px; color: var(--mute); }
.end .links { display: flex; gap: 16px; }
.end a { font-weight: 600; color: var(--ink); }

/* presenting size: diagram heights kept within one screen */
@media (max-height: 860px) and (min-width: 960px) {
  .step { padding-top: calc(var(--hh) + 18px); }
  .body { margin-top: 18px; }
}

/* small screens */
@media (max-width: 1100px) {
  .s1 { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .s1 .arw { transform: rotate(90deg); }
  .s2, .s11, .s13 { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .tg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tg > div + div { margin-top: 0; }
  .outline { columns: 2; }
}
@media (max-width: 959px), (max-height: 699px) {
  .zoom { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .zoom .cl { display: block; }
  .mxh { display: none; }
  .row { padding: 6px 0 14px; }
  .zoom .tl { flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 700px) {
  svg.dg.wide { display: none; }
  svg.dg.narrow { display: block; }
  .brand span, .where i { display: none; }
  .nav { gap: 12px; }
  .nav a { font-size: 13.5px; }
  .nav a.go { padding: 6px 10px; }
  .top { gap: 10px; }
  .outline { columns: 1; }
  .tg { grid-template-columns: minmax(0, 1fr); }
  .tbl.stack thead { display: none; }
  .tbl.stack tr { display: block; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .tbl.stack td { display: block; border: 0; padding: 2px 0; width: auto !important; }
  .tbl.stack td.n { display: none; }
  .tbl.stack td[data-l]::before { content: attr(data-l); display: block; font-size: 12px; font-weight: 600; color: var(--mute); margin-top: 6px; }
  .s14 .big { white-space: normal; }
  .zoom { padding: 12px 0; }
  .zoom .dgw { padding-top: 10px; }
}
@media (max-width: 420px) {
  .where { display: none; }
  .top { grid-template-columns: auto 1fr; }
  .nav { justify-self: end; }
}
@media (prefers-reduced-motion: reduce) {
  .fold, .row { transition: none; }
}
</style>
</head>

<header class="top" id="top"></header>
<main id="main"></main>

    if (narrow) { o += stack(0, 0, D.orch, D.orchV) + stack(0, SH + 20, D.sub, D.subV, 1); y2 = 2 * SH + 30; }
    else { o += stack(0, 0, D.orch, D.orchV) + stack(270, 0, D.sub, D.subV, 1); y2 = SH + 22; }
    if (narrow) o += arrow(W / 2, 2 * SH + 18, W / 2, y2 + 10, 1);
    else {
      o += '<path class="ln on" d="M120 ' + (SH - 4) + ' L120 ' + (SH + 8) + ' L250 ' + (SH + 8) + ' L250 ' + (y2 + 10) + '" marker-end="url(#ahg)"/>';
      o += '<path class="ln on" d="M390 ' + (SH + 3) + ' L390 ' + (SH + 8) + ' L270 ' + (SH + 8) + ' L270 ' + (y2 + 10) + '" marker-end="url(#ahg)"/>';
    }
    const bw = narrow ? 338 : 380, bx = narrow ? 1 : 70;
    o += rect(bx, y2 + 12, bw, 46, 'on') + tx(bx + bw / 2, y2 + 27, D.lab, 'h', 0, 17, 'middle') + tx(bx + bw / 2, y2 + 45, D.labSub, 'k', 0, 17, 'middle');
    o += arrow(bx + bw / 2, y2 + 58, bx + bw / 2, y2 + 82, 1);
    o += rect(bx, y2 + 84, bw, 46, 'out') + tx(bx + bw / 2, y2 + 99, D.dash, 'h', 0, 17, 'middle') + tx(bx + bw / 2, y2 + 117, D.dashSub, 'k', 0, 17, 'middle');
    return svg(narrow ? 'narrow' : 'wide', W, y2 + 132, D.alt, o);
  }

  const toolList = arr => '<div class="tl">' + arr.map(t => '<code class="t">' + esc(t) + '</code>').join('') + '</div>';
  const head = (i, h, lede) => '<p class="num">' + (i ? U.step + ' ' + i : '') + '</p><h2 id="h' + i + '">' + esc(h) + '</h2>' + (lede ? '<p class="lede">' + esc(lede) + '</p>' : '');
  const sec = (i, inner, cls) => '<section class="step ' + (cls || '') + '" data-t="' + i + '" aria-labelledby="h' + i + '"><div class="in">' + inner + '</div></section>';
  const table = (hd, rows, cls) => '<table class="tbl stack ' + (cls || '') + '"><thead><tr>' + hd.map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((c, j) => '<td' + (hd[j] ? ' data-l="' + esc(hd[j]) + '"' : ' class="n"') + '>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
  const arw = '<div class="arw" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M2 9 H15 M10 4 L15 9 L10 14" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></div>';

  let html = '';
  /* overview */
  html += '<section class="step ov" data-t="0" aria-labelledby="h0"><div class="in"><h1 id="h0">' + esc(C.overview.h) + '</h1><p class="lede">' + esc(C.overview.lede) + '</p>' +
    '<ol class="outline">' + C.stepNames.slice(1).map((n, i) => '<li><span>' + (i + 1) + '</span>' + esc(n) + '</li>').join('') + '</ol>' +
    '<p class="keys">' + esc(C.overview.keys) + '</p></div></section>';

  /* 1 */
  const s1 = C.s1;
  html += sec(1, head(1, s1.h, s1.lede) + '<div class="body s1">' +
    '<div><div class="card"><h3>' + esc(s1.ideaH) + '</h3><p class="q">' + esc(s1.idea) + '</p></div>' +
    '<div class="card"><h3>' + esc(s1.dataH) + '</h3><dl>' + s1.dataRows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl><p class="warn">' + esc(s1.dataWarn) + '</p></div></div>' +
    arw + '<div>' + table(s1.qHead, s1.q.map((r, i) => [String(i + 1), '<b>' + esc(r[0]) + '</b>', esc(r[1])])) + '</div>' + arw +
    '<div class="card spec"><h3>' + esc(s1.specH) + '</h3><dl>' + s1.spec.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl></div>' +
    '</div>');

  /* 2 */
  const s2 = C.s2;
  html += sec(2, head(2, s2.h, s2.lede) + '<div class="body s2"><div>' +
    '<h3>' + esc(s2.mH) + '</h3>' + table(s2.mHead, s2.m.map(r => ['<b>' + esc(r[0]) + '</b>', esc(r[1]), esc(r[2])])) +
    '<h3>' + esc(s2.rH) + '</h3>' + table(s2.rHead, s2.r.map(r => ['<b>' + esc(r[0]) + '</b>', esc(r[1])])) +
    '</div><div>' + runSize() + '</div></div>');

  /* 3 */
  html += sec(3, head(3, C.s3.h, C.s3.lede) + '<div class="s3">' + pipeWide() + pipeNarrow() + '<p class="note">' + esc(C.s3.cap) + '</p></div>');

  /* 4 to 10: the matrix */
  const M = C.mx;
  let rows = '';
  C.stages.forEach((s, i) => {
    const st = i + 4;
    rows += '<div class="row" data-t="' + st + '" data-r="' + i + '" role="row">' +
      '<div class="fold f-line" aria-hidden="true"><div><div class="line"><button type="button" tabindex="-1" data-go="' + i + '">' + esc(s.name) + '<span>' + U.step + ' ' + st + '</span></button>' +
      s.line.slice(0, 2).map(t => '<span>' + esc(t) + '</span>').join('') +
      '<span>' + esc(s.skills[0]) + (s.skills.length > 1 ? ' +' + (s.skills.length - 1) : '') + '</span>' +
      s.line.slice(2).map(t => '<span>' + esc(t) + '</span>').join('') + '</div></div></div>' +
      '<div class="fold f-zoom"><div><div class="zoom">' +
      '<div class="c0" role="rowheader"><p class="sn">' + U.step + ' ' + st + '</p><h3 id="h' + st + '">' + esc(s.name) + '</h3><p>' + esc(fmt(M.stageOf, { i: i + 1 })) + '</p></div>' +
      '<div role="cell"><p class="cl">' + esc(M.head[1]) + '</p>' + esc(s.does) + '</div>' +
      '<div role="cell"><p class="cl">' + esc(M.head[2]) + '</p><ul>' + s.tries.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' +
      '<div role="cell"><p class="cl">' + esc(M.head[3]) + '</p>' + toolList(s.skills) + '</div>' +
      '<div role="cell"><p class="cl">' + esc(M.head[4]) + '</p>' + esc(s.out) + '</div>' +
      '<div role="cell"><p class="cl">' + esc(M.head[5]) + '</p>' + esc(s.pick) + '</div>' +
      '<div class="dgw">' + stageWide(s) + stageNarrow(s) + '</div>' +
      '</div></div></div></div>';
  });
  let snaps = '';
  for (let i = 0; i < 7; i++) snaps += '<div class="mx-snap" data-t="' + (i + 4) + '" data-s="' + i + '" style="top:' + (i * 100) + 'svh"></div>';
  html += '<section class="mx" id="mx" aria-labelledby="hmx">' + snaps + '<div class="mx-pin"><div class="in">' +
    '<p class="num">' + U.step + 's 4–10</p><h2 id="hmx">' + esc(M.h) + '</h2><p class="lede">' + esc(M.lede) + '</p>' +
    '<div class="mt" role="table" aria-labelledby="hmx"><div class="mxh" role="row">' + M.head.map(h => '<div role="columnheader">' + esc(h) + '</div>').join('') + '</div>' + rows + '</div>' +
    '</div></div></section>';

  /* 11 */
  const s11 = C.s11;
  html += sec(11, head(11, s11.h, s11.lede) + '<div class="body s11"><div>' + stacks(false) + stacks(true) + '</div><div>' +
    table(s11.head, s11.rows.map(r => ['<b>' + esc(r[0]) + '</b>', esc(r[1]), esc(r[2])])) +
    '<p class="claim">' + esc(s11.claim) + '</p><p class="note">' + esc(s11.note) + '</p></div></div>');

  /* 12 */
  const s12 = C.s12;
  const grp = g => '<section><h3>' + esc(g.g) + '<span>' + g.tools.length + '</span></h3><ul>' + g.tools.map(t => {
    const st = t[2] === '*' ? s12.any : (t[2] || s12.asNeeded), x = (t[2] === '*' || !t[2]) ? ' x' : '';
    return '<li><div class="r1"><code class="t">' + esc(t[0]) + '</code><span class="st' + x + '">' + esc(st) + '</span></div><p>' + esc(t[1]) + '</p></li>';
  }).join('') + '</ul></section>';
  const G = s12.groups;
  html += sec(12, head(12, s12.h + ' (' + fmt(s12.count, { n: toolCount }) + ')', s12.lede) + '<div class="body"><div class="tg">' +
    '<div>' + grp(G[0]) + '</div><div>' + grp(G[1]) + grp(G[2]) + '</div><div>' + grp(G[3]) + grp(G[5]) + '</div><div>' + grp(G[4]) + '</div>' +
    '</div><p class="tgk">' + esc(s12.key) + '</p></div>');

  /* 13 */
  const s13 = C.s13;
  html += sec(13, head(13, s13.h, s13.lede) + '<div class="body s13"><div><h3>' + esc(s13.cH) + '</h3>' +
    table(s13.cHead, s13.c.map(r => ['<span class="lv">' + esc(r[0]) + '</span>', '<b>' + esc(r[1]) + '</b>', esc(r[2])])) +
    '</div><div><h3>' + esc(s13.mH) + '</h3><div class="mk">' + s13.m.map(m => '<div><p class="ex">' + esc(m.ex) + (m.tag ? '<span class="tag ' + m.cls + '">' + esc(m.tag) + '</span>' : '') + '</p><p>' + esc(m.p) + '</p></div>').join('') + '</div></div></div>');

  /* 14 */
  const s14 = C.s14, mx = Math.max.apply(null, s14.bars.map(b => b[1]));
  const bars = '<div class="bars" role="img" aria-label="' + esc(s14.bars.map(b => b[0] + ': ' + b[2]).join('; ')) + '">' + s14.bars.map((b, i) => '<span>' + esc(b[0]) + '</span><span style="display:flex;align-items:center;gap:8px"><i class="' + (i ? 'c' : '') + '" style="width:' + (b[1] / mx * 70).toFixed(1) + '%"></i>' + esc(b[2]) + '</span>').join('') + '</div>';
  html += sec(14, head(14, s14.h, s14.lede) + '<div class="body s14">' +
    table(s14.head, s14.rows.map((r, i) => ['<span class="tag m">measured</span><p class="big" style="margin-top:6px">' + esc(r[0]) + '</p>', esc(r[1]) + (i === 3 ? bars : ''), esc(r[2])])) + '</div>');

  /* 15 */
  const s15 = C.s15;
  html += sec(15, head(15, s15.h) + '<div class="body"><ul class="lim">' + s15.items.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' +
    '<footer class="end"><p>' + esc(C.footer) + '</p><p class="links"><a href="../../">' + esc(C.home) + '</a><a href="../../dashboard/">' + esc(C.dashboard) + '</a></p></footer>');

  document.getElementById('main').innerHTML = html;
  document.getElementById('top').innerHTML = '<a class="brand" href="../../"><img class="lk" src="../../assets/brand/chipin-lockup-light.svg" alt="ChipIn" height="28"><span>' + esc(C.brandSub) + '</span></a>' +
    '<p class="where" aria-live="polite"></p><nav class="nav" aria-label="Site"><a href="../../">' + esc(C.home) + '</a><a class="go" href="../../dashboard/">' + esc(C.dashboard) + '</a></nav>' +
    '<div class="prog" aria-hidden="true">' + C.stepNames.map(() => '<i></i>').join('') + '</div>';

  /* ---------- scrolling: indicator, matrix row, keyboard ---------- */
  const root = document.documentElement;
  const mqP = matchMedia('(min-width: 960px) and (min-height: 700px)');
  const mqR = matchMedia('(prefers-reduced-motion: reduce)');
  const where = document.querySelector('.where'), segs = [...document.querySelectorAll('.prog i')];
  const mxEl = document.getElementById('mx'), rowEls = [...document.querySelectorAll('.row')];
  let targets = [], lastStep = -1, lastRow = -1;
  const topOf = el => el.getBoundingClientRect().top + scrollY;

  function build() {
    root.classList.toggle('present', mqP.matches);
    const sel = mqP.matches ? '.step, .mx-snap' : '.step, .row';
    targets = [...document.querySelectorAll(sel)].sort((a, b) => topOf(a) - topOf(b));
    lastStep = -1; lastRow = -1;
    update();
  }
  function curIndex(slack) {
    const y = scrollY + slack; let k = 0;
    for (let i = 0; i < targets.length; i++) if (topOf(targets[i]) <= y) k = i;
    return k;
  }
  function update() {
    const k = curIndex(innerHeight * 0.35), step = +targets[k].dataset.t;
    if (step !== lastStep) {
      lastStep = step;
      where.innerHTML = '<b>' + step + '</b> ' + C.of + ' ' + N + '<i>' + esc(C.stepNames[step]) + '</i>';
      segs.forEach((s, i) => { s.className = i < step ? 'done' : (i === step ? 'cur' : ''); });
    }
    if (mqP.matches) {
      const r = Math.max(0, Math.min(6, Math.floor((scrollY - topOf(mxEl) + innerHeight * 0.35) / innerHeight)));
      if (r !== lastRow) {
        lastRow = r;
        rowEls.forEach((el, i) => { el.classList.toggle('on', i === r); el.querySelector('.f-zoom').setAttribute('aria-hidden', i === r ? 'false' : 'true'); });
      }
    } else if (lastRow !== -2) {
      lastRow = -2;
      rowEls.forEach(el => { el.classList.remove('on'); el.querySelector('.f-zoom').removeAttribute('aria-hidden'); });
    }
  }
  let raf = 0;
  addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; update(); }); }, { passive: true });
  addEventListener('resize', build);
  mqP.addEventListener('change', build);

  function go(j) {
    j = Math.max(0, Math.min(targets.length - 1, j));
    scrollTo({ top: Math.round(topOf(targets[j])), behavior: mqR.matches ? 'auto' : 'smooth' });
  }
  addEventListener('keydown', e => {
    if (!mqP.matches || e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target, k = e.key;
    if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
    if (k === ' ' && t.closest && t.closest('button, a, summary')) return;
    let d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') { e.preventDefault(); return go(0); }
    else if (k === 'End') { e.preventDefault(); return go(targets.length - 1); }
    else return;
    e.preventDefault();
    go(curIndex(4) + d);
  });
  /* wheel and trackpad: one gesture moves one step; momentum is absorbed until the gesture ends */
  let acc = 0, lastWheel = 0, lockedAt = 0;
  addEventListener('wheel', e => {
    if (!mqP.matches || e.ctrlKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault();
    const now = performance.now(), gap = now - lastWheel;
    lastWheel = now;
    if (lockedAt && (gap < 180 || now - lockedAt < 450)) return;
    lockedAt = 0;
    if (gap > 180) acc = 0;
    acc += e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
    if (Math.abs(acc) >= 30) { const d = acc > 0 ? 1 : -1; acc = 0; lockedAt = now; go(curIndex(4) + d); }
  }, { passive: false });
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-go]');
    if (!b) return;
    const sn = document.querySelector('.mx-snap[data-s="' + b.dataset.go + '"]');
    scrollTo({ top: Math.round(topOf(sn)), behavior: mqR.matches ? 'auto' : 'smooth' });
  });
  build();
})();
</script>
<script src="../variant-nav.js"></script>
</body>
</html>
