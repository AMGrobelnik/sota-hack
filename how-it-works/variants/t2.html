.flow .fig svg.labsvg { display: none; border-top: 1px solid var(--rule); }

#dock { display: none; position: fixed; top: calc(var(--bar) + 14px); right: 14px; width: 200px; z-index: 15; background: rgba(13, 23, 38, .94); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 0 12px; transition: opacity .4s ease; }

.dnd.on text { fill: #fff; }
.dag .da { fill: none; stroke: rgba(214, 228, 242, .3); stroke-width: 1.6; transition: stroke .3s ease; }
.dag .dah { fill: rgba(214, 228, 242, .45); transition: fill .3s ease; }
.dag.on .da { stroke: var(--signal); stroke-dasharray: 8 4; animation: run 1.8s linear infinite; }
.dag.on .dah { fill: var(--signal); }

.dnx.on { fill: var(--signal); }
.dcn { fill: #8fa2b8; font-size: 10.5px; }
@keyframes blink { 0%, 22% { fill: rgba(91, 228, 155, .22); stroke: var(--signal); } 30%, 100% { fill: #16263c; stroke: rgba(214, 228, 242, .3); } }

#dock.cycle .dnd text { animation: blinkt 3.6s linear infinite; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  }
  var sections = STEPS.map(function (st, i) {

    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);

      var ls = E('svg', { viewBox: '-12 -12 ' + (GW + 24) + ' ' + (GH + 24), 'class': 'mapsvg labsvg', role: 'img', 'aria-label': fill(LB.title) }, fig);
      var lg2 = E('g', null, ls);

  });

  // ---------- minimap ----------
  var mini = document.getElementById('mini');
  mini.setAttribute('viewBox', ALL.x + ' ' + ALL.y + ' ' + ALL.w + ' ' + ALL.h);
  ['spec', 'run', 'agent', 'hstart', 'hloop', 'htools', 'hsub', 'hlimits', 'tools', 'reports', 'talk', 'playback', 'checks', 'meas', 'meas2', 'meas3'].forEach(function (k) { var r = REG[k]; E('rect', { x: r.x, y: r.y, width: r.w, height: r.h, 'class': 'mr', rx: 30 }, mini); });
  E('rect', { x: PX, y: orchY, width: PSTEP * 6 + PWID, height: orchH, 'class': 'mr', rx: 20 }, mini);
  for (var mi = 0; mi < 7; mi++) E('rect', { x: PX + mi * PSTEP, y: Y0, width: PWID, height: PH, 'class': 'mr', rx: 20 }, mini);
  var mlab = E('rect', { y: LABY, width: GW, height: GH, 'class': 'mr', rx: 20 }, mini);
  var mcam = E('rect', { 'class': 'mc', rx: 24 }, mini);
  var wl = document.getElementById('wl');

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  var FOCUS = { spec: 'spec', run: 'run', pipe: 'pipe', agent: 'agent', hstart: 'hstart', hloop: 'hloop', htools: 'htools', hsub: 'hsub', hlimits: 'hlimits', tools: 'tools', reports: 'live', talk: 'live', playback: 'live', checks: 'dash', meas: 'dash', meas2: 'dash', meas3: 'dash' };
  function fit(r, a) {

    });
  }

  // ---------- the docked agent loop ----------
  var DK = C.dock, dsvg = document.getElementById('docksvg'), dnodes = {}, darcs = {}, dnx;
  document.getElementById('dockt').textContent = DK.title;
  var dockc = document.getElementById('dockc');
  (function () {
    var cx = 100, cy = 88, r = 60, keys = ['p', 'm', 't', 'r'], pos = [[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]];
    var pw = [70, 60, 74, 60], dv = Math.asin(39 / r) * 180 / Math.PI, ds = Math.asin(16 / r) * 180 / Math.PI, half = [dv, ds, dv, ds];
    var ang = [-90, 0, 90, 180], arcKey = ['m', 't', 'r', 'n'];

      var ag = E('g', { 'class': 'dag', 'data-k': arcKey[k] }, dsvg);
      var a0 = ang[k] + half[k], a1 = ang[k] + 90 - half[(k + 1) % 4];

      E('path', { d: 'M0 0l-7 -4.2v8.4z', transform: 'translate(' + e[0].toFixed(1) + ' ' + e[1].toFixed(1) + ') rotate(' + (a1 + 94).toFixed(1) + ')', 'class': 'dah' }, ag);
      darcs[arcKey[k]] = ag;
    }
    dnx = E('text', { x: 8, y: 34, 'class': 'dnx' }, dsvg); dnx.textContent = DK.next;
    DK.center.forEach(function (s, i) { E('text', { x: cx, y: cy - 2 + i * 14, 'text-anchor': 'middle', 'class': 'dcn' }, dsvg).textContent = s; });
    keys.forEach(function (key, i) {
      var g = E('g', { 'class': 'dnd', 'data-k': key }, dsvg);
      E('rect', { x: pos[i][0] - pw[i] / 2, y: pos[i][1] - 12, width: pw[i], height: 24, rx: 12 }, g);
      E('text', { x: pos[i][0], y: pos[i][1] + 4.5, 'text-anchor': 'middle' }, g).textContent = DK.nodes[i];
      dnodes[key] = g;
    });
  })();
  function setDock(st) {
    var a = st.stage != null ? ['tr', DK.stage.replace('{s}', st.title).replace('{k}', st.lit.length)] : (DK.at[st.key] || ['', '']);
    var on = a[0] === '*' ? 'pmtrn' : a[0], cyc = a[0] === '*';

    setDock(st);

    var b = document.createElement('b'); b.textContent = i === 0 ? C.where.overview : C.where.step.replace('{n}', i).replace('{t}', TOTAL);

  }
