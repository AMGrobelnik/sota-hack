  - origin/gh-pages: dashboard/data/af-candidates.json, search_rate

  - origin/main: backend/README.md
      A run starts from the dashboard (prompt and preset, optional agent, model, fan-out) or the
      command line; fresh folder runs/<run_id>/ with workspace/, events.jsonl and run.json
      (prompt, resolved config, result, timings, costs, summary); chip files under

  var ALL = { x: 0, y: 40, w: PX + PIPEW + 60, h: REG.harness.y + REG.harness.h + 20 - 40 };
  REG.all = ALL;
  (function () {
    var g = E('g', { 'class': 'ov' }, map);
    [['spec', 'spec'], ['run', 'run'], ['agent', 'agent'], ['talk', 'talk'], ['harness', 'harness'], ['pipe', 'pipe'], ['tools', 'tools'], ['meas', 'meas']].forEach(function (p) {
      var r = REG[p[0]], s = C.overview[p[1]], size = 96, w = mw(s, size, 650) + 90, h = size + 70;
      var x = r.x + r.w / 2 - w / 2, y = r.y + r.h / 2 - h / 2;
      R(g, x, y, w, h, '', 20);
      T(g, x + w / 2, y + 35, s, { size: size, weight: 650, anchor: 'middle', cls: '' });
    });
  })();

  // ---------- steps and cameras ----------
  var STEPS = C.steps.map(function (s, i) {
    var o = { key: s.key };
    var m = /^st(\d)$/.exec(s.key);
    if (m) {
      var si = +m[1], sd = ST[si];
      o.stage = si; o.kicker = PI.stageWord.replace('{i}', si + 1); o.title = sd.name; o.lines = [sd.lead, sd.fan.length ? PI.batchLine : PI.soloLine];
    } else { o.title = s.title; o.kicker = s.kicker; o.lines = s.lines.map(fill); o.hint = s.hint; o.link = s.link; }
    var camKey = s.key === 'intro' ? 'all' : s.key;
    o.rect = REG[camKey];
    o.whole = camKey === 'all';
    o.labx = o.stage != null ? labSlot(o.stage) : LABC;
    return o;
  });
  var N = STEPS.length, TOTAL = N - 1;

  // ---------- text sections (and the text equivalents of the map) ----------
  var main = document.getElementById('steps');
  function H(tag, cls, text, parent) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; if (parent) parent.appendChild(n); return n; }
  function dl(parent, pairs) { var d = H('dl', '', null, parent); pairs.forEach(function (p) { H('dt', '', p[0], d); var dd = H('dd', '', null, d); if (p[1] instanceof Node) dd.appendChild(p[1]); else dd.textContent = p[1]; }); return d; }
  function detail(st, box) {
    var k = st.key;
    if (k === 'spec') {
      H('h3', '', S.ideaLabel, box); H('p', '', S.idea, box);
      H('h3', '', S.qLabel, box);
      var ol = H('ol', '', null, box); S.questions.forEach(function (q) { H('li', '', q.q + ' ' + S.qHead[1] + ': ' + q.d + '.', ol); });
      H('h3', '', S.metricLabel, box); dl(box, S.metrics.map(function (m) { return [m.type, m.metric]; }));
      H('h3', '', S.cardLabel, box); H('p', '', S.cardFields.join(', ') + '. ' + S.cardWarn + '. ' + S.simNote, box);
      H('h3', '', S.specLabel, box); H('p', '', S.specFields.join(', ') + '. ' + S.specNote, box);
    } else if (k === 'run') {
      H('h3', '', RU.modelsLabel, box); var u = H('ul', '', null, box); RU.options.forEach(function (o) { H('li', '', o.title + ': ' + o.sub, u); });
      H('h3', '', RU.sizeLabel, box); var u2 = H('ul', '', null, box); RU.presets.forEach(function (p) { H('li', '', p[0] + ': ' + RU.presetHead[1].toLowerCase() + ' ' + p[1] + ', ' + p[2] + ' ' + RU.presetHead[2].toLowerCase() + '.', u2); }); H('p', '', RU.sizeNote, box);
    } else if (k === 'pipe') {
      H('p', '', PI.orchTitle + ': ' + PI.orchSub, box);
      var o2 = H('ol', '', null, box); ST.forEach(function (s) { H('li', '', s.name + ': ' + s.does, o2); });
    } else if (st.stage != null) {
      var s = ST[st.stage], lt = LIT[st.stage][0];
      var turn = PI.loopNodes.join(', ') + ', ' + PI.loopNext + '. For example: chiplab ' + lt.name + ': ' + lt.what + (lt.opt ? ' (' + PI.optWord + ')' : '') + '.';
      dl(box, [['', s.does], [PI.fanWord, s.fanLabel + (s.fan.length ? ' (' + s.fan.join('; ') + ')' : '')], [s.fan.length ? PI.loopBatch : PI.loopSolo, turn], [PI.outWord, s.out], [PI.keepsWord, s.keeps]]);
      box.querySelector('dt').remove();
    } else if (k === 'h1') {
      var h1 = HA.run;
      dl(box, h1.fields.map(function (f) { return [f[0], f[1]]; }));
      H('p', '', h1.from, box);
      H('h3', '', h1.tree, box); var u1 = H('ul', '', null, box); h1.files.forEach(function (f) { H('li', '', f[1] + ': ' + f[2], u1); });
      H('p', '', h1.treeNote, box);
      dl(box, h1.boxes);
    } else if (k === 'h2') {

      var o4 = H('ol', '', null, box); h2.nodes.forEach(function (n) { H('li', '', n[0] + ': ' + n[1], o4); });

      dl(box, h2.cards); H('p', '', h2.stream, box);
    } else if (k === 'h3') {
      var h3 = HA.tools;
      dl(box, h3.plugs.map(function (p) { return [p[0], p[1]]; }));
      H('p', '', h3.cmd + '. ' + fill(h3.grid) + '.', box);
    } else if (k === 'h4') {
      var h4 = HA.sub;
      dl(box, h4.cmds); H('p', '', h4.merge + '. ' + h4.after, box); H('p', '', h4.note, box);
    } else if (k === 'h5') {
      dl(box, HA.limits.rows.map(function (r) { return [r[0], r[1] + (r[2] ? ' (' + r[2] + ')' : '') + '. ' + r[3]]; }));
    } else if (k === 'agent') {
      H('p', '', AG.label, box); dl(box, AG.layers.map(function (l) { return ['(' + l.k + ') ' + l.name, l.text]; }));
      H('p', '', AG.rule, box); dl(box, AG.roles.map(function (r) { return [r.name, r.text]; }));
    } else if (k === 'tools') {
      H('h3', '', fill(TO.title), box);
      TO.groups.forEach(function (g) {
        H('h3', '', g.name + ' (' + g.tools.length + ')', box);
        var t = H('table', '', null, box), tr = H('tr', '', null, H('thead', '', null, t));
        TO.head.forEach(function (h) { H('th', '', h, tr).scope = 'col'; });
        var tb = H('tbody', '', null, t);
        g.tools.forEach(function (x) { var r = H('tr', '', null, tb); H('code', '', x[0], H('td', '', null, r)); H('td', '', x[1], r); H('td', '', x[2].join(', '), r); });
      });
    } else if (k === 'talk') {
      dl(box, TK.verbs.map(function (v) { return [v[0], v[1]]; }));
      H('p', '', TK.one, box);
      H('h3', '', TK.helperTitle, box); H('p', '', TK.helperText + ' ' + TK.helperRule, box);
    } else {
      var ME = MES.filter(function (t) { return t.key === k; })[0];
      if (!ME) return;
      dl(box, ME.rows.map(function (r) { return [r.fig, ME.head[1] + ': ' + r.scope]; }));
      H('p', '', ME.note, box);
    }
  }
  var sections = STEPS.map(function (st, i) {
    var sec = H('section', 'step', null, main);
    sec.id = 'step-' + st.key;
    if (st.kicker) H('p', 'kick', st.kicker, sec);
    var h = H(i === 0 ? 'h1' : 'h2', '', st.title, sec); h.id = 'h-' + st.key; sec.setAttribute('aria-labelledby', h.id);
    st.lines.forEach(function (l) { H('p', '', l, sec); });
    if (st.stage != null) {
      var lit = LIT[st.stage];
      H('p', 'litl', PI.litWord.replace('{k}', lit.length), sec);
      var lc = H('div', 'litc', null, sec);
      lit.forEach(function (t) { H('code', t.opt ? 'opt' : '', t.name, lc); });
      if (lit.some(function (t) { return t.opt; })) H('p', 'litn', PI.optNote, sec);
    }
    [].concat(st.link || []).forEach(function (L) { var lk = H('a', '', L.text, H('p', 'src', null, sec)); lk.href = L.href; lk.target = '_blank'; lk.rel = 'noopener'; });
    if (st.hint) H('p', 'hint', st.hint, sec);
    // figure: the same map, cropped to this step (shown in the plain sequence)
    var fig = H('figure', 'fig', null, sec);
    var r = st.rect, pad = 16;
    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);
    var use = E('use', { href: '#map' }, fs);
    if (st.whole) use.setAttribute('style', '--ov:1');
    if (st.stage != null) use.setAttribute('style', '--labx:' + st.labx + ';--L' + st.stage + ':1');
    var dbox = H('div', 'detail', null, sec);
    detail(st, dbox);
    return sec;
  });

  // ---------- minimap ----------
  var mini = document.getElementById('mini');
  mini.setAttribute('viewBox', ALL.x + ' ' + ALL.y + ' ' + ALL.w + ' ' + ALL.h);
  ['spec', 'run', 'agent', 'talk', 'h1', 'h2', 'h3', 'h4', 'h5', 'tools', 'meas'].forEach(function (k) { var r = REG[k]; E('rect', { x: r.x, y: r.y, width: r.w, height: r.h, 'class': 'mr', rx: 30 }, mini); });
  E('rect', { x: PX, y: orchY, width: PSTEP * 6 + PWID, height: orchH, 'class': 'mr', rx: 20 }, mini);
  for (var mi = 0; mi < 7; mi++) E('rect', { x: PX + mi * PSTEP, y: Y0, width: PWID, height: PH, 'class': 'mr', rx: 20 }, mini);
  var mcam = E('rect', { 'class': 'mc', rx: 24 }, mini);
  var wl = document.getElementById('wl');

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1.2, FIT = [], raf = 0, cur = -1, isCam = null;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  var FOCUS = { spec: 'spec', run: 'run', agent: 'agent', talk: 'talk', h1: 'h1', h2: 'h2', h3: 'h3', h4: 'h4', h5: 'h5', pipe: 'pipe', tools: 'tools', meas: 'meas' };
  function fit(r, a) {
    var pad = 24, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }
    return { cx: x + w / 2, cy: y + h / 2, w: w };
  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STEPS.map(function (s) { return fit(s.rect, A); });
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    var st = STEPS[i];
    panels.forEach(function (p, k) {
      p.classList.toggle('on', st.stage === k);
      p.classList.toggle('dim', st.stage != null && st.stage !== k);
    });
    var fr = st.stage != null ? 'pipe' : FOCUS[st.key];
    regions.forEach(function (r) {
      r.classList.toggle('dim', !!fr && r.getAttribute('data-r') !== fr);
      r.classList.toggle('on', !!fr && r.getAttribute('data-r') === fr && st.stage == null);
    });
    // chip lab box: light the tools of the current stage, dim it away from the pipeline
    SKEYS.forEach(function (k, j) { if (st.stage === j) lab.style.setProperty('--L' + j, '1'); else lab.style.removeProperty('--L' + j); });
    lab.classList.toggle('dim', st.stage == null && st.key !== 'pipe');
    // one turn of the loop: restart on the card of this stop
    if (activeCard) resetCard(activeCard);
    activeCard = st.stage != null ? CARDS[st.stage] : st.key === 'h2' ? RING : null;
    phase = -1; turn = 0;
    wl.innerHTML = '';
    var b = document.createElement('b'); b.textContent = i === 0 ? C.where.overview : C.where.step.replace('{n}', i).replace('{t}', TOTAL);
    wl.appendChild(b); wl.appendChild(document.createTextNode('  ' + (i === 0 ? '' : st.title)));
  }
  function frame() {
    raf = 0; if (!isCam) return;
    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);
    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;
    cam.setAttribute('viewBox', (cx - w / 2).toFixed(2) + ' ' + (cy - h / 2).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2));
    var scale = vp.clientWidth / w;
    var ov = Math.max(0, Math.min(1, (0.26 - scale) / 0.08));
    cam.style.setProperty('--ov', ov.toFixed(3));
    lab.style.setProperty('--labx', (STEPS[i].labx + (STEPS[i + 1].labx - STEPS[i].labx) * t).toFixed(1));
    mcam.setAttribute('x', cx - w / 2); mcam.setAttribute('y', cy - h / 2); mcam.setAttribute('width', w); mcam.setAttribute('height', h);
    setCurrent(Math.round(f));
  }
  function req() { if (!raf) raf = requestAnimationFrame(frame); }

  // one turn of the loop, step by step: prompt, model, tool call (the next of this stage's tools), result
  var activeCard = null, phase = -1, turn = 0, loopTimer = 0;
  function resetCard(c) {
    c.nodes.forEach(function (n) { n.classList.remove('act', 'idle'); });
    if (c.list) { if (TILES[c.list[c.k].name]) TILES[c.list[c.k].name].classList.remove('now'); setTool(c, 0); c.box.classList.remove('hot'); }
  }
  function tick() {
    var c = activeCard; if (!c) return;
    phase = (phase + 1) % 4; if (phase === 0) turn++;
    c.nodes.forEach(function (n, k) { n.classList.toggle('act', k === phase); n.classList.toggle('idle', k > phase); });
    if (!c.list) return;
    if (phase === 2) {
      var prev = TILES[c.list[c.k].name]; if (prev) prev.classList.remove('now');
      setTool(c, (turn - 1) % c.list.length);
      var nw = TILES[c.list[c.k].name]; if (nw) nw.classList.add('now');
    }
    c.box.classList.toggle('hot', phase >= 2);
  }
  function go(n) { window.scrollTo({ top: n * unit(), behavior: 'smooth' }); }
  addEventListener('scroll', req, { passive: true });
  addEventListener('resize', function () { applyMode(); });
  addEventListener('keydown', function (e) {
    if (!isCam || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;
    if (k === ' ' && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
    e.preventDefault();
    var here = Math.round(scrollY / unit());
    go(Math.max(0, Math.min(N - 1, here + d)));
  });

  // one wheel or trackpad gesture moves one step; momentum after it is absorbed
  var lock = 0, lastW = 0, acc = 0;
  addEventListener('wheel', function (e) {
    if (!isCam || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gap = now - lastW; lastW = now;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (now < lock) { lock = Math.max(lock, now + 160); return; }
    if (gap > 220) acc = 0;
    acc += dy;
    if (Math.abs(acc) >= 24) {
      var here = Math.round(scrollY / unit());
      go(Math.max(0, Math.min(N - 1, here + (acc > 0 ? 1 : -1))));
      acc = 0; lock = now + 650;
    }

  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function applyMode() {
    var want = mqCam.matches && !mqRm.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');
      if (!want) {
        panels.concat(regions).forEach(function (p) { p.classList.remove('on', 'dim'); }); cam.style.setProperty('--ov', '0'); cur = -1;
        // flow mode: every figure in its end state; each stage figure sets its own --labx and --Lk on its use
        lab.classList.remove('dim'); lab.style.removeProperty('--labx'); SKEYS.forEach(function (k, j) { lab.style.removeProperty('--L' + j); });
        if (activeCard) resetCard(activeCard); activeCard = null;
        clearInterval(loopTimer); loopTimer = 0;
      } else if (!loopTimer) loopTimer = setInterval(tick, 850);
    }
    if (isCam) { measureVp(); req(); }
  }
  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
})();
