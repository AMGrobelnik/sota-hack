:root {

* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 clamp(16px, 2.4vw, 32px); background: var(--night); border-bottom: 1px solid var(--rule); }
.brand { font-weight: 650; font-size: 19px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.brand { display: inline-flex; align-items: center; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
@media (max-width: 520px) { .brand .lk { height: 24px; } .pg { display: none; } .top nav a { font-size: 14px; } }
.pg { font-size: 16px; color: var(--mute); }
.top nav { margin-left: auto; display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); }
.top nav a { font-size: 16px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.top nav a:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.btn { display: inline-flex; align-items: center; background: var(--signal); color: #062418 !important; font-weight: 650; border-radius: 10px; padding: 8px 15px; text-decoration: none !important; }
.btn:hover { background: #86f2b9; }

/* narration */
.step { position: relative; }
.step h1, .step h2 { margin: 0 0 20px; color: #fff; font-weight: 650; letter-spacing: -.025em; line-height: 1.08; text-wrap: balance; }
.step h1 { font-size: 46px; }
.step h2 { font-size: 40px; }
.step p { margin: 0 0 14px; color: #c9d5e2; font-size: 19px; line-height: 1.45; max-width: 32ch; }

      else { o.rect = REG[s.key]; o.show = [s.key]; o.keep = [s.key]; }
    }
    return o;
  });
  var N = STOPS.length;

  // ---------- narration and the stacked text version ----------
  var main = document.getElementById('steps');
  function H(tag, cls, text, parent) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; if (parent) parent.appendChild(n); return n; }
  function dl(parent, pairs) { var d = H('dl', '', null, parent); pairs.forEach(function (p) { if (p[0]) H('dt', '', p[0], d); var dd = H('dd', '', null, d); if (p[1] instanceof Node) dd.appendChild(p[1]); else dd.textContent = p[1]; }); return d; }
  function codes(list) { var s = document.createElement('span'); list.forEach(function (n, i) { if (i) s.appendChild(document.createTextNode(', ')); H('code', '', n, s); }); return s; }
  function ul(parent, items, tag) { var u = H(tag || 'ul', '', null, parent); items.forEach(function (t) { H('li', '', t, u); }); return u; }
  function detail(st, box) {
    var k = st.key;
    if (k === 'intake') {
      var I = C.intake;
      H('h3', '', I.ideaLabel, box); H('p', '', I.idea, box);
      H('h3', '', I.stepsLabel, box);
      ul(box, I.steps.map(function (s) { return s.name + ': ' + s.q + ' ' + I.defaultWord + ': ' + s.d + '.'; }), 'ol');
      H('h3', '', I.cardTitle + ' (' + I.cardTag + ')', box);
      dl(box, I.cardFields);
      H('p', '', I.cardNote, box);
    } else if (k === 'run') {
      var U = C.run;
      H('h3', '', U.sizeLabel, box);
      var t = H('table', '', null, box), tr = H('tr', '', null, H('thead', '', null, t));
      U.head.forEach(function (h) { H('th', '', h, tr).scope = 'col'; });
      var tb = H('tbody', '', null, t);
      U.presets.forEach(function (p) { var r = H('tr', '', null, tb); p.forEach(function (c) { H('td', '', c, r); }); });
      H('p', '', U.sizeNote, box);
      H('h3', '', U.modelsLabel, box);
      ul(box, U.models.map(function (m) { return m.title + ': ' + m.sub; }));
    } else if (k === 'pipe') {
      ul(box, ST.map(function (s) { return s.name + ': ' + (s.alone ? C.pipe.aloneWord : C.pipe.batchWord + s.strategy + ' ' + s.fan.join('; ') + '.'); }), 'ol');
    } else if (st.stage != null) {
      var s = ST[st.stage];
      dl(box, [['', s.does],
        [s.alone ? C.pipe.aloneWord : C.pipe.batchWord + s.strategy, s.alone ? '' : s.fan.join('; ') + '.'],
        [C.pipe.toolsWord, codes(s.tools)], [C.pipe.outWord, s.out], [s.alone ? C.pipe.nextWord : C.pipe.mergeWord, s.merge]]);
    } else if (k === 'agent') {
      var A = C.agent;
      dl(box, A.layers.map(function (l) { return ['(' + l.k + ') ' + l.name, l.text]; }));
      H('p', '', A.rule, box);
    } else if (k === 'tools') {
      C.tools.groups.forEach(function (g) {
        H('h3', '', g.name + ' (' + g.tools.length + ')', box);
        var t2 = H('table', '', null, box), tr2 = H('tr', '', null, H('thead', '', null, t2));
        C.tools.head.forEach(function (h) { H('th', '', h, tr2).scope = 'col'; });
        var tb2 = H('tbody', '', null, t2);
        g.tools.forEach(function (x) {
          var r = H('tr', '', null, tb2);
          H('code', '', x[0], H('td', '', null, r)); H('td', '', x[1], r);
          H('td', '', ON[x[0]] ? ON[x[0]].map(function (i) { return ST[i].name; }).join(', ') : C.tools.anyWord, r);
        });
      });
    } else if (k === 'report') {
      var Q = C.report;
      ul(box, [Q.agents.join(': '), Q.helper + ': ' + Q.kinds.join(', ') + '. ' + Q.helperNote, Q.backend.join(': '), Q.stream.join(': '), Q.dash.join(': ')], 'ol');
      H('h3', '', Q.sumTitle, box); H('p', '', Q.sumModel, box);
      ul(box, Q.levels.map(function (l) { return l[0] + ', ' + l[1] + ': ' + l[2]; }), 'ol');
      H('p', '', Q.levelsNote, box); ul(box, Q.sums); H('p', '', Q.sumNote, box);
    } else if (k === 'talk') {
      var K = C.talk;
      H('h3', '', K.streamLabel, box);
      ul(box, K.events.map(function (e) { return (e.k === 'stage' ? e.who + ' ' : (e.k === 'status' ? '' : e.who + ': ')) + e.t; }));
      ul(box, K.notes);
      H('h3', '', K.helperTitle, box); ul(box, K.helperLines);
      H('p', '', K.helperAskLabel + ': ' + K.helperAsk, box);
    } else if (k === 'checks') {
      var CK = C.checks;
      H('h3', '', CK.levelsLabel, box);
      ul(box, CK.levels.map(function (l) { return l.name + '. ' + l.text + (l.tool ? ' (' + l.tool + ')' : ''); }), 'ol');
      H('p', '', CK.levelNote, box);
      H('h3', '', CK.patTitle, box);
      ul(box, CK.pats.map(function (p) { return p.t + ' (' + p.tool + ')'; }));
    } else if (k === 'source') {
      var SC = C.source;
      H('h3', '', SC.label, box);
      dl(box, SC.classes.map(function (c) { return [c.name, c.text]; }));
      H('h3', '', SC.notTitle, box); H('p', '', SC.not, box);
      H('h3', '', SC.markTitle, box);
      dl(box, SC.marks.map(function (m) { return [m.kind, m.text]; }));
    } else if (k === 'meas') {
      var M = C.measured;
      dl(box, M.rows.map(function (r) { return [r.fig, M.head[1] + ': ' + r.scope]; }));
      H('p', '', M.note, box);
      H('h3', '', M.timeTitle, box); H('p', '', M.time, box); H('p', 'cav', M.timeCaveat, box);
      H('h3', '', M.batchTitle, box); H('p', '', M.batch, box); H('p', '', M.scale, box);
      H('h3', '', M.papersLabel, box);
      var pu = H('ul', '', null, box);
      M.papers.forEach(function (pp) { var a = H('a', '', pp.title, H('li', '', null, pu)); a.href = pp.href; a.rel = 'noopener'; });
    }
  }
  var sections = STOPS.map(function (st, i) {
    var sec = H('section', 'step', null, main);
    sec.id = 'stop-' + st.key;
    var tx = H('div', 'txt', null, sec);
    if (st.kicker) H('p', 'kick', st.kicker, tx);
    var h = H(i === 0 ? 'h1' : 'h2', '', st.title, tx); h.id = 'h-' + st.key; sec.setAttribute('aria-labelledby', h.id);
    if (st.key === 'limits') {
      ul(tx, st.lines).className = 'lim';
      var a = H('div', 'acts', null, tx);
      var b1 = H('a', 'btn', C.nav.dashboard, a); b1.href = C.nav.dashHref;
      var b2 = H('a', '', C.nav.home, a); b2.href = '../../';
      H('footer', '', C.footer, tx);
    } else {
      st.lines.forEach(function (l) { H('p', '', l, tx); });
      if (st.papers) {
        var pp = H('p', 'papers', C.measured.papersLabel + ': ', tx);
        C.measured.papers.forEach(function (q, qi) {
          if (qi) pp.appendChild(document.createTextNode('; '));
          var a = H('a', '', q.short, pp); a.href = q.href; a.title = q.title; a.rel = 'noopener';
        });
      }
      if (st.hint) H('p', 'hint', st.hint, tx);
    }
    // stacked flow only: this stop's crop of the same map; the whole map stays silent
    var fig = H('figure', 'fig', null, st.key === 'limits' ? null : sec), r = st.rect, pad = 24;
    var fs = E('svg', { viewBox: (r.x - pad) + ' ' + (r.y - pad) + ' ' + (r.w + 2 * pad) + ' ' + (r.h + 2 * pad), 'class': 'mapsvg', role: 'img', 'aria-label': st.title }, fig);
    var use = E('use', { href: '#map' }, fs);
    if (r !== ALL) use.setAttribute('style', '--tx:1');
    var dbox = H('div', 'detail', null, sec);
    detail(st, dbox);
    return sec;
  });

  // ---------- the rail ----------
  var rail = document.getElementById('rail'), railList = document.getElementById('railList'), rcount = document.getElementById('rcount');
  rail.setAttribute('aria-label', C.railLabel);
  rail.style.setProperty('--n', String(STOPS.length));
  var dots = STOPS.map(function (st, i) {
    var li = H('li', '', null, railList), b = H('button', '', null, li);
    b.type = 'button'; b.setAttribute('aria-label', st.rail); b.title = st.rail;
    H('span', 'dot', null, b); H('span', 'lab', st.rail, b).setAttribute('aria-hidden', 'true');
    b.addEventListener('click', function () { go(i); });
    return b;
  });

  // ---------- camera ----------
  var vp = document.getElementById('viewport');
  var A = 1, FIT = [], raf = 0, cur = -1, isCam = null;
  var regions = [].slice.call(map.querySelectorAll('.rg'));
  var glance = map.querySelector('[data-r="glance"]');
  var mqCam = matchMedia('(min-width: 960px) and (min-height: 620px)');
  var mqRm = matchMedia('(prefers-reduced-motion: reduce)');
  function fit(r, a) {
    var pad = 22, x = r.x - pad, y = r.y - pad, w = r.w + 2 * pad, h = r.h + 2 * pad;
    if (w / h < a) { var nw = h * a; x -= (nw - w) / 2; w = nw; } else { var nh = w / a; y -= (nh - h) / 2; h = nh; }
    return { cx: x + w / 2, cy: y + h / 2, w: w };
  }
  function measureVp() {
    var w = vp.clientWidth || 1, h = vp.clientHeight || 1; A = w / h;
    FIT = STOPS.map(function (s) { return fit(s.rect, A); });
  }
  function unit() { return sections.length > 1 ? (sections[1].offsetTop - sections[0].offsetTop) : innerHeight; }
  function setCurrent(i) {
    if (i === cur) return; cur = i;
    var st = STOPS[i];
    regions.forEach(function (r) {
      var k = r.getAttribute('data-r');
      r.classList.toggle('show', st.show.indexOf(k) >= 0);
      r.classList.toggle('dim', !!st.keep && st.keep.indexOf(k) < 0 && k !== 'glance');
    });
    var away = !!st.keep && st.key !== 'pipe';
    links.classList.toggle('dim', st.key === 'pipe');
    links.classList.toggle('off', away);
    glance.classList.toggle('off', away);
    dots.forEach(function (b, k) {
      if (k === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
      b.classList.toggle('past', k < i);
    });
    rcount.textContent = C.railCount.replace('{i}', i + 1).replace('{t}', N);
  }
  function frame() {
    raf = 0; if (!isCam) return;
    var u = unit(), f = Math.max(0, Math.min(N - 1, scrollY / u));
    var i = Math.min(Math.floor(f), N - 2), t = f - i; t = t * t * (3 - 2 * t);
    var a = FIT[i], b = FIT[i + 1];
    var w = Math.exp(Math.log(a.w) + (Math.log(b.w) - Math.log(a.w)) * t);
    var cx = a.cx + (b.cx - a.cx) * t, cy = a.cy + (b.cy - a.cy) * t, h = w / A;
    cam.setAttribute('viewBox', (cx - w / 2).toFixed(2) + ' ' + (cy - h / 2).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2));
    // words stay hidden while the view travels and fade in once it has arrived
    map.classList.toggle('moving', Math.abs(f - Math.round(f)) > 0.04);
    setCurrent(Math.round(f));
  }

  // ---------- pointing at the silent map names a part; a click goes there ----------
  var tag = document.getElementById('tag'), hovR = null, lastType = 'mouse';
  function stopOf(g) {
    var k = g.getAttribute('data-r'); if (k === 'glance') k = 'pipe';
    for (var i = 0; i < N; i++) if (STOPS[i].key === k) return i;
    return -1;
  }
  function nameOf(i) { var st = STOPS[i]; return st.kicker ? st.kicker + ': ' + st.title : st.title; }
  function hideTag() { tag.classList.remove('on'); if (hovR) hovR.classList.remove('hov'); hovR = null; }
  function showTag(g, x, y) {
    var i = stopOf(g); if (i < 0) { hideTag(); return; }
    if (hovR !== g) {
      if (hovR) hovR.classList.remove('hov');
      hovR = g; g.classList.add('hov');
      tag.textContent = nameOf(i);
      if (i !== cur) H('small', '', C.hoverGo, tag);
    }
    tag.classList.add('on');
    var tw = tag.offsetWidth, th = tag.offsetHeight, right = rail.getBoundingClientRect().left || innerWidth;
    var tx = x + 18, ty = y + 20;
    if (tx + tw > right - 12) tx = x - tw - 18;
    if (ty + th > innerHeight - 12) ty = y - th - 16;
    tag.style.left = tx + 'px'; tag.style.top = ty + 'px';
  }
  cam.addEventListener('pointermove', function (e) {
    lastType = e.pointerType || 'mouse';
    if (!isCam || lastType === 'touch') return;
    var g = e.target.closest && e.target.closest('.rg');
    if (g) showTag(g, e.clientX, e.clientY); else hideTag();
  });
  cam.addEventListener('pointerdown', function (e) { lastType = e.pointerType || 'mouse'; });
  cam.addEventListener('pointerleave', hideTag);
  cam.addEventListener('click', function (e) {
    if (!isCam) return;
    var g = e.target.closest && e.target.closest('.rg'); if (!g) { hideTag(); return; }
    var i = stopOf(g); if (i < 0) return;
    // on a touch screen the first tap names the part, the second goes there
    if (lastType === 'touch' && hovR !== g) { showTag(g, e.clientX, e.clientY); return; }
    hideTag();
    if (i !== cur) go(i);
  });
  function req() { if (!raf) raf = requestAnimationFrame(frame); }
  function go(n) {
    n = Math.max(0, Math.min(N - 1, n));
    if (!isCam) { sections[n].scrollIntoView({ block: 'start' }); return; }
    window.scrollTo({ top: n * unit(), behavior: mqRm.matches ? 'auto' : 'smooth' });
  }
  addEventListener('scroll', req, { passive: true });
  addEventListener('resize', function () { applyMode(); });
  // Up, Down, Page Up, Page Down, Space, Home and End move one stop. Left and
  // Right are left alone: the shared variant switcher uses them.
  addEventListener('keydown', function (e) {
    if (!isCam || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key, d = 0;
    if (k === 'PageDown' || k === 'ArrowDown' || (k === ' ' && !e.shiftKey)) d = 1;
    else if (k === 'PageUp' || k === 'ArrowUp' || (k === ' ' && e.shiftKey)) d = -1;
    else if (k === 'Home') d = -N; else if (k === 'End') d = N; else return;
    var ae = document.activeElement;
    if (k === ' ' && ae && (ae.tagName === 'A' || ae.tagName === 'BUTTON')) return;
    e.preventDefault();
    go(Math.round(scrollY / unit()) + d);
  });
  // one wheel or trackpad gesture moves one stop; the momentum after it is absorbed
  var lock = 0, lastW = 0, acc = 0;
  addEventListener('wheel', function (e) {
    if (!isCam || e.ctrlKey) return;
    e.preventDefault();
    var now = performance.now(), gap = now - lastW; lastW = now;
    var dy = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (now < lock) { lock = Math.max(lock, now + 160); return; }
    if (gap > 220) acc = 0;
    acc += dy;
    if (Math.abs(acc) >= 24) {
      go(Math.round(scrollY / unit()) + (acc > 0 ? 1 : -1));
      acc = 0; lock = now + 650;
    }
  }, { passive: false });

  function applyMode() {
    var want = mqCam.matches && !mqRm.matches;
    if (want !== isCam) {
      isCam = want;
      root.classList.toggle('cam', want); root.classList.toggle('flow', !want);
      cam.setAttribute('aria-hidden', want ? 'false' : 'true');
      cur = -1;
      if (!want) {
        // the stacked figures reuse the map: leave it undimmed, words on
        hideTag(); map.classList.remove('moving');
        regions.concat([links]).forEach(function (r) { r.classList.remove('show', 'dim', 'off'); });
      }
    }
    if (isCam) { measureVp(); req(); }
  }
  mqCam.addEventListener('change', applyMode);
  mqRm.addEventListener('change', applyMode);
  applyMode();
})();
</script>
