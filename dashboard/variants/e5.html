<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo</title>
<style>
:root{
  --wash:#fafaf9;--ink9:#1a1a2e;--ink8:#3a3a4a;--ink7:#4a4a5a;--ink6:#5a5a6a;--ink55:#666676;--ink5:#6c6c85;--ink4:#8a8a99;--ink3:#b0b0be;--ink2:#d4d4dc;--ink15:#e8e8ec;--ink1:#f3f3f6;
  --blue:#3b82f6;--blue6:#2563eb;--blue7:#1d4ed8;--glass:rgb(255 253 250/.7);--hair:rgb(0 0 0/.06);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro","New York",ui-serif,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ok:#10b981;--okt:#047857;--bad:#ef4444;--badt:#b91c1c;--amb:#92400e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--sans);color:var(--ink9);background:var(--wash);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.i{flex:none;display:block}
.spin{animation:rot 1s linear infinite;flex:none;display:block}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.2}}
@keyframes pulse{50%{opacity:.45}}
.app{display:flex;height:100vh;height:100dvh}

/* sidebar */
.sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid rgb(0 0 0/.04);transition:width .15s cubic-bezier(.4,0,.2,1);overflow:hidden;z-index:30}
.sb-h{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgb(0 0 0/.05)}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(140deg,#60a5fa,#6366f1);display:grid;place-items:center;color:#fff;flex:none}
.wm{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
.tog{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink55);flex:none}
.tog:hover,.ib:hover{background:rgb(0 0 0/.05)}
.nav{padding:8px;flex:none}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink5);text-decoration:none;white-space:nowrap;transition:background .1s}
.nav a:hover{background:rgb(0 0 0/.03)}
.nav a.on{background:rgb(59 130 246/.06);color:var(--ink9)}
.cnt{margin-left:auto;font-size:10px;font-weight:600;color:var(--blue6);background:rgb(37 99 235/.07);border-radius:99px;padding:1px 7px}
.hr{height:1px;background:rgb(0 0 0/.05);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px}
.cap{font-size:10px;text-transform:uppercase;font-weight:600;letter-spacing:.1em;color:var(--ink55);padding:6px 10px 4px}
.rr{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink7);text-decoration:none;white-space:nowrap;transition:background .1s}
.rr:hover{background:rgb(0 0 0/.025)}
.rr.on{background:rgb(59 130 246/.06);color:var(--ink9)}
.rr .t{overflow:hidden;text-overflow:ellipsis}
.rr .gl{width:12px;flex:none;display:grid;place-items:center}
.tbar{height:8px;width:120px;border-radius:4px;background:var(--ink15);animation:pulse 1.4s infinite}
.acct{border-top:1px solid rgb(0 0 0/.05);padding:8px;flex:none}
.acct button{display:flex;gap:8px;align-items:center;width:100%;padding:5px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0/.03)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .n{font-size:12.5px;font-weight:500;color:var(--ink8);line-height:1.2}
.acct .e{font-size:10px;color:var(--ink55)}
.sb.col{width:52px}
.sb.col .wm,.sb.col .lbl,.sb.col .runs,.sb.col .cnt,.sb.col .acct-t,.sb.col .hr{display:none}
.sb.col .sb-h{padding:0 12px}
.sb.col .logo{display:none}
.sb.col .tog{margin:0}
.sb.col .nav a{justify-content:center;padding:0}
.demo{position:fixed;right:12px;bottom:7px;font-size:10px;color:var(--ink4);background:rgb(250 250 249/.9);padding:1px 6px;border-radius:4px;pointer-events:none;z-index:20}

/* mobile header */
.mh{display:none;height:48px;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid rgb(0 0 0/.06);background:var(--glass);flex:none}
.scrim{display:none}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* start */
.start{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.c672{width:100%;max-width:672px;margin-top:-5vh}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;text-align:center;font-weight:400;margin:0;letter-spacing:-.01em}
.lead{font-size:16px;color:var(--ink55);text-align:center;margin:12px 0 32px}
.box{border-radius:24px;border:1px solid rgb(0 0 0/.06);background:rgb(255 253 250/.9);box-shadow:0 1px 3px rgb(0 0 0/.04);padding:20px 20px 12px}
.box textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;font:14px/1.5 var(--sans);color:var(--ink9);height:24px;max-height:280px;overflow:auto}
.box textarea::placeholder{color:var(--ink5)}
.ctl{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.pill{height:24px;border-radius:99px;border:1px solid rgb(0 0 0/.08);background:#fff;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 9px;color:var(--ink8);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--ink1)}
.pill .chev{opacity:.5}
.ghost{height:24px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;padding:0 8px;font-size:11.5px;font-weight:500;color:var(--ink55)}
.ghost:hover{background:rgb(0 0 0/.04)}
.send{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e8e8ec;color:#b0b0be;transition:all .12s;flex:none}
.send.ready{background:#fff;color:var(--ink9);box-shadow:0 2px 8px rgb(0 0 0/.14)}

/* popovers, modals */
.pop{position:fixed;z-index:60;background:#fff;border:1px solid rgb(0 0 0/.08);border-radius:10px;box-shadow:0 4px 20px rgb(0 0 0/.1);padding:6px;min-width:176px;max-width:calc(100vw - 16px)}
.pop .pc{font-size:10px;text-transform:uppercase;font-weight:600;letter-spacing:.1em;color:var(--ink55);padding:6px 9px 4px}
.pop .row{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;width:100%;text-align:left;font-size:12.5px;color:var(--ink8)}
.pop .row:hover{background:var(--ink1)}
.pop .row.sel{background:rgb(59 130 246/.1)}
.pop .row .h{display:block;font-size:11px;color:var(--ink55);margin-top:1px}
.pop .row .ck{margin-left:auto;color:var(--blue6);align-self:center}
.pop .row[disabled]{opacity:.45;cursor:default}
.pop hr{border:0;border-top:1px solid rgb(0 0 0/.06);margin:4px 0}
.fld{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 9px;font-size:12.5px;color:var(--ink8)}
.fld .h{display:block;font-size:11px;color:var(--ink55)}
.num{display:inline-flex;align-items:center;border:1px solid var(--ink15);border-radius:6px;height:28px;background:#fff}
.num button{width:24px;height:26px;color:var(--ink55)}
.num button:hover{background:var(--ink1)}
.num span{min-width:58px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.lnk{font-size:12px;color:var(--blue6);padding:6px 9px;display:inline-block;text-decoration:none}
.lnk:hover{text-decoration:underline}
.scrimm{position:fixed;inset:0;background:rgb(20 20 40/.18);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.modal{width:min(520px,92vw);background:#fff;border-radius:12px;box-shadow:0 12px 40px rgb(0 0 0/.18);overflow:hidden}
.modal input{width:100%;border:0;border-bottom:1px solid var(--ink15);padding:14px 16px;font:14px var(--sans);outline:0}
.modal .list{max-height:320px;overflow:auto;padding:6px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);background:#fff;box-shadow:-8px 0 30px rgb(0 0 0/.12);z-index:71;padding:18px 20px;overflow:auto}
.drawer h3{margin:0 0 4px;font-size:16px}
.drawer .kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid rgb(0 0 0/.05);font-size:13px}
.drawer .kv span:first-child{color:var(--ink55)}
.drawer .kv span:last-child{text-align:right;color:var(--ink8);font-weight:500}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink9);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:8px;z-index:80;box-shadow:0 4px 20px rgb(0 0 0/.2)}

/* run topbar */
.tb{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;border-bottom:1px solid rgb(0 0 0/.06);background:rgb(255 255 255/.7)}
.tabs{display:flex;gap:16px;align-self:stretch}
.tab{font-size:11.5px;font-weight:500;color:var(--ink55);display:flex;align-items:center;border-bottom:2px solid transparent;text-decoration:none;padding-top:2px}
.tab:hover{color:var(--ink8)}
.tab.on{color:var(--blue6);font-weight:600;border-color:var(--blue6)}
.stp{font-size:11.5px;border-radius:99px;padding:1px 8px;white-space:nowrap}
.stp.done{color:var(--okt);background:#ecfdf5;box-shadow:inset 0 0 0 1px #a7f3d0}
.stp.paused{color:var(--ink7);background:var(--ink1);box-shadow:inset 0 0 0 1px var(--ink15)}
.ttl{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;max-width:280px;color:var(--ink8)}
.play{display:flex;align-items:center;gap:8px;flex:1;max-width:560px;min-width:0}
.pbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink7);flex:none}
.pbtn:hover{background:rgb(0 0 0/.05)}
.clock{font:500 11px var(--mono);padding:2px 7px;border-radius:6px;background:rgb(239 68 68/.08);color:var(--badt);flex:none}
.clock.idle{background:var(--ink1);color:var(--ink7)}
.track{flex:1;height:14px;position:relative;cursor:pointer;min-width:40px}
.track::before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;border-radius:2px;background:var(--ink15)}
.track i{position:absolute;left:0;top:5px;height:4px;background:var(--bad);border-radius:2px}
.track b{position:absolute;top:7px;width:10px;height:10px;border-radius:50%;background:var(--bad);transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.rep i,.track.rep b{background:#7c6cf0}
.live{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--badt);background:rgb(239 68 68/.1);border-radius:99px;padding:3px 7px;display:inline-flex;align-items:center;gap:4px;flex:none}
.live::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
.live.off{color:var(--ink55);background:var(--ink1)}
.live.off::before{background:var(--ink3);animation:none}
.tbr{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
.ib{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink55)}
.dockbtn{display:none;height:26px;border-radius:99px;border:1px solid rgb(0 0 0/.08);background:#fff;align-items:center;gap:6px;padding:0 9px 0 6px;font-size:11.5px;font-weight:600;color:var(--ink8);white-space:nowrap}

/* run body */
.rb{flex:1;position:relative;min-height:0;display:flex}
.view{flex:1;min-width:0;overflow:auto;padding:24px}
.dock{position:absolute;top:16px;right:16px;width:240px;background:#fff;border:1px solid rgb(0 0 0/.07);border-radius:12px;box-shadow:0 2px 8px rgb(0 0 0/.06);padding:10px 12px 12px;cursor:pointer;display:none;text-align:left;transition:border-color .12s}
.dock:hover{border-color:rgb(59 130 246/.35)}
.dock .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:600;color:var(--ink8)}
.dock .dh span:last-child{font-weight:500;color:var(--ink4);font-size:10.5px}
.dock .dsv{margin:6px -4px 4px}
.dock .dg{font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dock .ds{font-size:11px;color:var(--ink55);margin-top:1px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgb(59 130 246/.55)}100%{box-shadow:0 0 0 16px rgb(59 130 246/0)}}
@media (min-width:1280px){
  .rb.dock-on .view{padding-right:272px}
  .rb.dock-on .dock{display:block}
}
@media (max-width:1279px){
  .tb.dock-on .dockbtn{display:inline-flex}
}

/* chip svg */
.chipsvg{display:block;width:100%;height:auto}
.chipsvg text{font-family:var(--sans)}
.wire{stroke-dasharray:3 7}
.is-live .wire{animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.is-live .cb{animation:cb 2.6s ease-in-out infinite}
@keyframes cb{50%{opacity:.35}}
.redraw .die{animation:die 1.4s cubic-bezier(.2,.7,.2,1)}
@keyframes die{0%{opacity:.2;transform:scale(1.25)}100%{opacity:1;transform:none}}
.die{transform-box:fill-box;transform-origin:center}

/* overview */
.ov{max-width:880px;margin:0 auto}
.cards{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr;align-items:start}
.arrow{margin-top:32px;color:var(--ink3);display:grid;place-items:center}
.card{background:#fff;border-radius:10px;border:1px solid rgb(0 0 0/.06);box-shadow:0 1px 3px rgb(0 0 0/.04);padding:14px 16px 12px;position:relative;overflow:hidden;transition:opacity .2s}
.card.dim{opacity:.55}
.card.act::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.75) 50%,transparent 70%);transform:translateX(-100%);animation:shim 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shim{60%,100%{transform:translateX(100%)}}
.chd{display:flex;align-items:center;gap:10px}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ct{font-size:14px;font-weight:700;line-height:1.2}
.cs{font-size:10.5px;color:var(--ink55)}
.ring{margin-left:auto;flex:none;position:relative;width:44px;height:44px}
.ring svg{display:block}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--ink8)}
.ring .arc{transform-origin:22px 22px;animation:rot 4s cubic-bezier(.5,.1,.5,.9) infinite}
.spark{display:block;width:100%;height:24px;margin-top:10px}
.bar{height:4px;background:var(--ink1);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.cm{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink55);margin-top:6px}
.cm b{color:var(--ink8);font-weight:600}
.tree{margin:8px 0 0 17px;border-left:1px solid var(--ink15);padding:2px 0 2px 10px}
.tr{display:flex;gap:7px;align-items:center;height:24px;font-size:12px;color:var(--ink55);white-space:nowrap;overflow:hidden}
.tr.sub{padding-left:16px}
.tr.on{color:var(--ink9);font-weight:500}
.tr .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink3);flex:none}
.tr.on .dot{border-color:var(--blue);background:var(--blue)}
.tr .ok{color:var(--ok)}
.tr .tag{font-size:10px;color:#0d9488;font-weight:600}
.more{font-size:10px;color:var(--ink4);padding-left:16px}
.verdict{margin-top:22px;padding:14px 16px;border-radius:12px;background:#fff;border:1px solid rgb(0 0 0/.06);display:flex;gap:12px;align-items:center;font-size:14px;color:var(--ink8)}
.verdict .vd{width:10px;height:10px;border-radius:50%;flex:none}
.now{margin-top:14px;border-radius:12px;border:1px solid rgb(0 0 0/.06);background:var(--glass);padding:12px 16px 10px}
.nowh{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:var(--ink8)}
.cur{display:flex;gap:9px;align-items:center;font-size:13.5px;margin:10px 0 6px;color:var(--ink9)}
.nr{display:flex;gap:10px;align-items:center;height:26px;font-size:12.5px;color:var(--ink6)}
.nr time{font:10px var(--mono);color:var(--ink4);width:36px;flex:none}
.nr span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.nr .wd{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none}

/* chat */
.chatv{padding:0!important;display:flex;flex-direction:column;overflow:hidden}
.feed{flex:1;overflow:auto;padding:24px 24px 12px}
.fin{max-width:672px;margin:0 auto}
.msg{display:flex;gap:10px;margin:16px 0}
.msg .avr{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.who{font-size:11.5px;font-weight:600;color:var(--ink8)}
.who time{font:400 10px var(--mono);color:var(--ink4);margin-left:6px}
.txt{font-size:13.5px;color:var(--ink8);line-height:1.55;margin-top:1px}
.tool{margin:6px 0 6px 34px;border:1px solid rgb(0 0 0/.06);border-radius:8px;background:#fff}
.tool summary{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12.5px;color:var(--ink6);cursor:pointer;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary .cv{margin-left:auto;color:var(--ink3);transition:transform .12s}
.tool[open] summary .cv{transform:rotate(90deg)}
.tool .det{padding:0 12px 9px 30px;font-size:12px;color:var(--ink55)}
.umsg{display:flex;justify-content:flex-end;margin:16px 0}
.umsg div{background:#0d9488;color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;max-width:80%;font-size:13.5px}
.divd{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:11px;color:#0d9488;font-weight:600}
.divd::before,.divd::after{content:"";flex:1;height:1px;background:rgb(13 148 136/.25)}
.typing{display:flex;gap:4px;padding:8px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.cwrap{padding:0 24px 20px;flex:none}
.cbox{max-width:672px;margin:0 auto;border-radius:24px;border:1px solid rgb(0 0 0/.06);background:rgb(255 253 250/.95);box-shadow:0 2px 8px rgb(0 0 0/.05);padding:14px 14px 10px 20px;display:flex;align-items:flex-end;gap:10px}
.cbox textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font:14px/1.5 var(--sans);height:24px;max-height:160px;margin-bottom:6px}
.cbox textarea:disabled{color:var(--ink4)}

/* visual */
.vis{max-width:1080px;margin:0 auto}
.picker{display:flex;gap:2px;flex-wrap:wrap}
.vt{padding:5px 11px;font-size:12px;font-weight:500;border-radius:7px;color:var(--ink55);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.vt:hover{background:rgb(0 0 0/.04);color:var(--ink8)}
.vt.on{background:rgb(59 130 246/.08);color:var(--blue6);font-weight:600}
.vh{margin:16px 0 12px}
.vh h2{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em}
.vh p{margin:3px 0 0;color:var(--ink55);font-size:13.5px}
.stage{background:#fff;border:1px solid rgb(0 0 0/.06);border-radius:12px;padding:18px}
.stage svg.big,.stage svg.fit{display:block;width:100%;height:auto;max-height:calc(100dvh - 250px);margin:0 auto}
.vnote{margin-top:10px;font-size:12.5px;color:var(--ink55)}
.ptiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pt{border:1px solid rgb(0 0 0/.07);border-radius:10px;padding:10px 12px;background:#fff}
.pt .pn{font-size:11.5px;color:var(--ink55);display:flex;justify-content:space-between;align-items:center}
.pt .pv{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.pt .pb{height:4px;border-radius:2px;background:var(--ink1);position:relative}
.pt .pb i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pt .pb b{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--ink9)}
.pt.fail{background:#fffbeb;border-color:#fde68a}
.pt.worst{box-shadow:0 0 0 2px var(--ink9)}
.pt.wait .pv{color:var(--ink3)}
.dev{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:center}
.est{border-bottom:1px solid rgb(0 0 0/.06);padding:10px 0}
.est:last-child{border:0}
.est .k{font-size:11.5px;color:var(--ink55)}
.est .v{font-size:18px;font-weight:700;margin:1px 0}
.est .s{font-size:11.5px;color:var(--ink55)}

/* configure */
.cfg{flex:1;display:flex;min-height:0;overflow:auto}
.crail{width:220px;flex:none;padding:24px 12px;border-right:1px solid rgb(0 0 0/.05)}
.crail a,.crail button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--ink6);text-decoration:none}
.crail a:hover,.crail button:hover{background:rgb(0 0 0/.03)}
.crail .on{background:rgb(59 130 246/.07);color:var(--blue6);font-weight:600}
.cmain{flex:1;padding:32px 40px;max-width:720px}
.cmain h1{font-size:26px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.cmain>p{color:var(--ink55);margin:0 0 20px}
.cpanel{background:#fff;border:1px solid rgb(0 0 0/.06);border-radius:12px;padding:6px 16px}
.cpanel .fld{padding:14px 0;border-bottom:1px solid rgb(0 0 0/.05);font-size:13px}
.cpanel .fld:last-child{border:0}
.sel{height:28px;border:1px solid var(--ink15);border-radius:6px;background:#fff;font:12.5px var(--sans);padding:0 6px;color:var(--ink8)}
.sw{width:32px;height:18px;border-radius:99px;background:var(--ink2);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .12s;box-shadow:0 1px 2px rgb(0 0 0/.2)}
.sw.on{background:var(--blue6)}
.sw.on::after{transform:translateX(14px)}

@media (max-width:1279px){
  .ttl{max-width:180px}
}
@media (max-width:1180px){
  .ttl{display:none}
}
@media (max-width:900px){
  .cards{grid-template-columns:1fr}
  .arrow{display:none}
  .col+.col{margin-top:10px}
  .ptiles{grid-template-columns:repeat(3,1fr)}
  .dev{grid-template-columns:1fr}
}
@media (max-width:767px){
  .app{flex-direction:column}
  .mh{display:flex}
  .sb{position:fixed;left:0;top:0;bottom:0;width:252px!important;transform:translateX(-105%);transition:transform .18s ease;background:rgb(255 253 250/.98);box-shadow:0 10px 40px rgb(0 0 0/.15)}
  .sb.open{transform:none}
  .sb .tog{display:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgb(0 0 0/.15);z-index:25}
  .tb{height:auto;flex-wrap:wrap;padding:6px 10px;row-gap:4px;gap:10px}
  .tabs{height:30px}
  .ttl{display:none}
  .play{order:5;flex-basis:100%;max-width:none}
  .view{padding:16px}
  .greet{font-size:30px}
  .lead{font-size:14.5px;margin-bottom:22px}
  .cfg{flex-direction:column}
  .crail{width:auto;border-right:0;border-bottom:1px solid rgb(0 0 0/.05);padding:10px;display:flex;flex-wrap:wrap;gap:2px}
  .crail a,.crail button{width:auto}
  .crail .cap{width:100%}
  .cmain{padding:20px 16px}
  .ptiles{grid-template-columns:repeat(2,1fr)}
  .demo{top:16px;bottom:auto;right:12px;background:none}
  .cwrap{padding:0 12px 26px}
  .feed{padding:16px 14px 8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}
}

    else if (c.pass && (!pick.pass || rd.g < pick.rd.g)) pick = c;
    else if (!c.pass && !pick.pass && rd.worst > pick.rd.worst) pick = c;
  });
  return pick;
}
function phaseAt(r, t) {
  const P = plan(r);
  if (t >= P.total) return { ph: 'done', P };
  if (t < TS) return { ph: 'spec', P, f: t / TS };
  if (t < TR) return { ph: 'ref', P, f: (t - TS) / (TR - TS) };
  if (t < P.rs) {
    const k = Math.floor((t - TR) / RL), rr = P.rounds[k];
    const sub = rr.subs.findIndex(s => t < s.e);
    const s = rr.subs[sub];
    return { ph: 'round', P, k, sub, f: (t - s.s) / (s.e - s.s) };
  }
  return { ph: 'report', P, f: (t - P.rs) / REP };
}
const isDone = r => r.t >= plan(r).total;
const isRunning = r => !isDone(r) && !r.paused;

/* events: everything said and done in a run, on one time line */
function events(r) {
  const u = UC[r.uc], P = plan(r), B = batch(r), out = [];
  out.push({ id: 'spec', t: .6, who: 'lead', text: u.tx.spec(u.lineText(baseLine(r))) });

  out.push({ id: 'refm', t: 8.6, who: 'design', text: u.tx.ref });
  out.push({ id: 'reft', t: 9.2, tEnd: 20, who: 'tool', text: u.tx.refTool, pend: u.tx.refP, det: u.tx.refD });
  out.push({ id: 'refr', t: 20.6, who: 'check', text: u.tx.refRes });
  P.rounds.forEach(rr => {
    const k = rr.k, rd = roundData(r, k), n = rd.ch.length, red = r.redirects.find(x => x.k === k && x.mod);
    out.push({ id: 'p' + k, t: rr.start + .6, who: 'design', text: red ? `Round ${k + 1}, following your note: ${red.plan(rd)}` : u.tx.prop(k, rd, B), red: !!red });
    out.push({ id: 'f' + k, t: rr.subs[1].s + .2, tEnd: rr.subs[1].e, who: 'tool', ft: k, pend: `Fine-tuning ${fmtN(B)} candidate models at once on ${n} ${chw(u, n)}`, text: `Fine-tuned ${fmtN(B)} candidate models on ${n} ${chw(u, n)}`, det: `Each candidate trained for 6 passes over the training ${u.pats}. Kept the 64 whose worst ${u.pat} scored best.` });
    out.push({ id: 'c' + k, t: rr.subs[2].s + .2, tEnd: rr.subs[2].e, who: 'tool', pend: 'Compiling the best 16 into logic gates', text: 'Compiled the best 16 into logic gates, weights wired in', det: `Smallest ${fmtN(rd.g)} gates, largest ${fmtN(rd.g * 3.2)} gates.` });
    out.push({ id: 'v' + k, t: rr.subs[3].s + .2, tEnd: rr.end - .6, who: 'tool', pend: 'Checking each circuit bit for bit against its model', text: 'Checked each circuit bit for bit against its model', det: u.tx.verD });
    const j = judge(r, rd, rr.end), w = u.worstIdx + 1;
    const head = `The circuits match their models bit for bit.`;
    out.push({ id: 'vr' + k, t: rr.end - .4, who: 'check', text: j.pass
      ? `${head} New best chip: ${fmtN(rd.g)} gates on ${n} ${chw(u, n)}. It meets the clinical line on all 12 unseen ${u.pats}; the hardest, ${u.Pat.toLowerCase()} ${w}, is at ${pct(rd.worst)}.`
      : `${head} Best this round: ${fmtN(rd.g)} gates on ${n} ${chw(u, n)}. It meets the clinical line on ${j.met} of 12 unseen ${u.pats}; ${u.pat} ${w} is at ${pct(rd.worst)}, under the ${pct(j.L)} line.` });
  });
  out.push({ id: 'rep1', t: P.rs + .6, who: 'lead', text: 'All rounds are in. Running one last check on the best chip and writing the report.' });
  out.push({ id: 'rep2', t: P.rs + 1.4, tEnd: P.rs + 7, who: 'tool', pend: `Final check on all 12 unseen ${u.pats}`, text: `Final check on all 12 unseen ${u.pats}`, det: 'Same circuit, same recordings, every output matched its model.' });
  out.push({ id: 'rep3', t: P.total - .5, who: 'lead', text: (() => {
    const b = best(r, P.total); if (!b) return 'Done.';

      ? `Done. The smallest chip that does the job has ${fmtN(b.rd.g)} gates and ${u.tx.final(b.rd.g, n)}. It meets the clinical line on all 12 unseen ${u.pats}. These are results on recorded data, not a clinical study.`
      : `Done. No chip met the line for every ${u.pat}. The closest has ${fmtN(b.rd.g)} gates and meets it on ${b.met} of 12 unseen ${u.pats}. A longer run or a bigger gate budget may close the gap.`;
  })() });
  r.redirects.forEach((x, i) => {
    out.push({ id: 'u' + i, t: x.t, who: 'user', text: x.text });
    out.push({ id: 'a' + i, t: x.tr, who: 'lead', text: x.reply });
    if (x.mod && x.k != null) out.push({ id: 'x' + i, t: x.tr + .001, who: 'div', text: `Plan changed from round ${x.k + 1}` });
  });
  return out.sort((a, b) => a.t - b.t);
}

/* redirect: parse a typed note into a change of plan */
function redirect(r, text) {
  const u = UC[r.uc], P = plan(r), t = r.t, low = text.toLowerCase();
  const x = { t, tr: t + (r.paused ? 0 : 2.2), text };
  if (t >= P.rs) {
    x.reply = `The report is being written now, so this run won't change. I've added your note to the report as a next step.`;
    r.redirects.push(x); return;
  }
  let next = P.rounds.find(rr => rr.start > t);
  if (!next) { r.extra++; next = plan(r).rounds[plan(r).n - 1]; }
  x.k = next.k;
  const smaller = /(fewer|less|smaller|tiny|tinier|shrink|cheaper|area|power|battery)/.test(low) && !/(more channel|more electrode|more detector)/.test(low);
  const safer = /(more sensitiv|higher sensitiv|safer|miss fewer|never miss|accura|more channel|more electrode|more detector|robust)/.test(low);
  const fewerCh = /(fewer|less) (channel|electrode|detector)/.test(low);
  if (fewerCh) x.mod = { g: .86, s: -.008, line: 0, ch: -1 };
  else if (smaller) x.mod = { g: .62, s: -.02, line: /(sensitiv|accura|lower)/.test(low) ? -.02 : 0, ch: -1 };
  else if (safer) x.mod = { g: 1.3, s: .025, line: 0, ch: 1 };
  else x.mod = { g: .95, s: 0, line: 0, ch: 0 };
  r.redirects.push(x);
  const rd = roundData(r, x.k), n = rd.ch.length, L = lineAt(r, x.tr + 1);
  if (fewerCh) {
    x.reply = `Understood. From round ${x.k + 1} I'll try ${n} ${chw(u, n)} and report what it costs on the worst ${u.pat}.`;
    x.plan = d => `${d.ch.length} ${chw(u, d.ch.length)} only (${list(d.ch)}), same windows, to see what the worst ${u.pat} loses.`;
  } else if (smaller) {
    x.reply = x.mod.line
      ? `Understood: a smaller chip, and a little less sensitivity is acceptable. From round ${x.k + 1} I'll aim for about ${fmtN(rd.g)} gates on ${n} ${chw(u, n)}, and the worst ${u.pat} may sit at ${pct(L)} instead of ${pct(L + .02)}. I've moved the clinical line to match.`
      : `Understood: a smaller chip. From round ${x.k + 1} I'll aim for about ${fmtN(rd.g)} gates on ${n} ${chw(u, n)} and keep the clinical line where it is.`;
    x.plan = d => `aiming small, about ${fmtN(d.g)} gates on ${d.ch.length} ${chw(u, d.ch.length)}, 4-bit weights, against a line of ${pct(lineAt(r, x.tr + 1))}.`;
  } else if (safer) {
    x.reply = `Understood: catching every ${u.event} comes first. From round ${x.k + 1} I'll allow a bigger chip, about ${fmtN(rd.g)} gates, and add a ${u.chan} back (${list(rd.ch)}).`;
    x.plan = d => `a bigger chip on ${list(d.ch)}, aiming to lift the worst ${u.pat} above ${pct(d.worst - .005)}.`;
  } else {
    x.reply = `Noted. I'll take that into round ${x.k + 1} and say what it changed once the round is checked.`;
    x.plan = d => `${d.ch.length} ${chw(u, d.ch.length)}, with your note in mind: ${text.slice(0, 80)}`;
  }
}

/* ---------- popovers, modals, toasts ---------- */
let popEl = null;

function openPop(anchor, html, o = {}) {
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.innerHTML = html; if (o.w) p.style.width = o.w + 'px';
  document.body.appendChild(p); popEl = p;

  let left = o.right ? a.right - pr.width : a.left;

  p.style.top = top + 'px'; p.style.left = left + 'px';
  p.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled && o.onPick) { const keep = o.onPick(b.dataset.a, b); if (!keep) closePop(); } });
  if (o.after) o.after(p);
  setTimeout(() => document.addEventListener('mousedown', outside), 0);
  function outside(e) { if (popEl === p && !p.contains(e.target) && !anchor.contains(e.target)) { closePop(); } if (popEl !== p) document.removeEventListener('mousedown', outside); }

/* ---------- chip drawing (the one bold thing) ---------- */
function chipSVG(r, rd, o = {}) {

  const P = mini ? 176 : 206, px = cx - P / 2, py = cy - P / 2;
  const g = rd ? rd.g : 0;
  const D = rd ? Math.round((mini ? .86 : 1) * (64 + 92 * Math.sqrt(Math.min(g, 4000) / 4000))) : 0;
  const dcy = cy + (mini ? 10 : 12), dx = cx - D / 2, dy = dcy - D / 2;
  const fl = mini ? 32 : 13, fb = mini ? 32 : 15;

  let s = `<svg viewBox="0 0 ${W} ${H}" class="chipsvg ${mini ? 'mini' : 'big'}" role="img" aria-label="${rd ? `Chip with ${fmtN(g)} gates: two sensors in, an AI model inside, a prediction out` : 'No chip yet'}">

    s += `<rect x="${sx}" y="${y - sh / 2}" width="${sw}" height="${sh}" rx="12" fill="#fff" stroke="#d4d4dc" stroke-width="${mini ? 2.5 : 1.2}"/>`;
    s += `<circle cx="${sx + (mini ? 26 : 26)}" cy="${y}" r="${mini ? 9 : 8}" fill="${i ? '#a78bfa' : '#60a5fa'}"/>`;

    const ty = cy + (i ? 28 : -28);

  });

  }

  if (rd) {
    s += `<rect x="${px}" y="${py}" width="${P}" height="${P}" rx="${mini ? 16 : 14}" fill="#23243a"/>`;

    : `<text x="${bx + 16}" y="${cy - 6}" font-size="12" fill="#8a8a99">Prediction</text><text x="${bx + 16}" y="${cy + 13}" font-size="14.5" font-weight="600" fill="#1a1a2e">${esc(u.out)}</text>`;
  if (!mini && rd) {
    s += `<text x="${cx}" y="${py + P + 44}" font-size="22" font-weight="700" text-anchor="middle" fill="#1a1a2e">${fmtN(g)} gates</text>`;

/* overview */
const CARDS = [
  { n: 'Set the target', icon: 'target', hue: '#a78bfa', tile: '#f5f3ff', hue2: '#7c3aed' },
  { n: 'Design rounds', icon: 'cpu', hue: '#60a5fa', tile: '#eff6ff', hue2: '#2563eb' },
  { n: 'Report', icon: 'doc', hue: '#fb923c', tile: '#fff7ed', hue2: '#ea580c' },
];
function cardRange(r, i) { const P = plan(r); return [[0, TR], [TR, P.rs], [P.rs, P.total]][i]; }
function cardProg(r, t, i) { const [a, b] = cardRange(r, i); return clamp((t - a) / (b - a), 0, 1); }
function cardTime(r, t, i) { const [a, b] = cardRange(r, i); const s = clamp(t, a, b) - a; const m = Math.round(s * SIM / 60); return t < a ? '0m' : m + 'm'; }

  const m = Math.max(2, Math.round(p * (n - 1)) + 1);
  const xy = pts.slice(0, m).map((v, j) => [j / (n - 1) * w, h - v * (h - 3)]);
  const d = xy.map((q, j) => (j ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${xy[xy.length - 1][0].toFixed(1)} ${h}L0 ${h}Z" fill="${hue}" opacity=".12"/><path d="${d}" fill="none" stroke="${hue}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;

function drawOverview(r, t, ph, b, ev) {

    const extra = i === 1 && (isAct || p >= 1) ? `, round ${isAct ? ph.k + 1 : P.n} of ${P.n}` : '';
    const ring = p >= 1 ? `<span style="color:${c.hue2}">${ic('check', 16, 2.4)}</span>` : `<span class="rp">${Math.floor(p * 100)}%</span>`;
    return `<div class="card ${isAct && running ? 'act' : ''} ${!isAct || done ? 'dim' : ''}" data-card="${i}" style="${isAct && !done ? `border-color:${c.hue}59;box-shadow:0 0 0 3px ${c.hue}14` : ''}">
      <div class="chd"><span class="tile" style="background:${c.tile};color:${c.hue2}">${ic(c.icon, 18, 1.6)}</span>
        <div style="min-width:0"><div class="ct">${c.n}</div><div class="cs">${word}${extra}</div></div>
        <div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="#f3f3f6" stroke-width="3.5"/>
          <circle class="rv" cx="22" cy="22" r="18" fill="none" stroke="${c.hue}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(p * 113).toFixed(1)} 113" transform="rotate(-90 22 22)"/>
          ${isAct && running ? `<circle class="arc" cx="22" cy="22" r="18" fill="none" stroke="${c.hue}" stroke-opacity=".35" stroke-width="3.5" stroke-dasharray="10 103"/>` : ''}</svg>${ring}</div></div>

  const row = (on, txt, okd, cls = '') => `<div class="tr ${cls} ${on ? 'on' : ''}">${okd ? `<span class="ok">${ic('check', 12, 2.4)}</span>` : on ? (running ? spin(11) : '<span class="dot"></span>') : '<span class="dot"></span>'}<span>${txt}</span></div>`;

  s += `<circle cx="${mx}" cy="${my}" r="56" fill="#fff" stroke="#b0b0be" stroke-width="1.5"/><rect x="${mx - 30}" y="${my - 30}" width="60" height="60" rx="3" fill="#23243a"/><rect x="${mx - 16}" y="${my - 16}" width="32" height="32" fill="#2f3352" stroke="#5560c9"/>`;
  s += `<text x="${mx}" y="${my + 76}" font-size="11" fill="#666676" text-anchor="middle">the chip, enlarged 100 times</text>`;
  s += `<text x="${cx - 8}" y="${cy + 6}" font-size="11.5" fill="#1a1a2e" text-anchor="end" font-weight="600">chip, to scale</text>`;
  s += `<line x1="${x0}" x2="${x0 + 10 * mm}" y1="${H - 30}" y2="${H - 30}" stroke="#4a4a5a" stroke-width="2"/><text x="${x0}" y="${H - 12}" font-size="11" fill="#666676">10 mm</text></svg>`;
  const body = `<div class="dev"><div>${s}</div><div>
    <div class="est"><div class="k">Chip area, estimate</div><div class="v">${area.toFixed(3)} mm²</div><div class="s">Logic only. With its pads the die is about 0.6 by 0.6 mm.</div></div>
    <div class="est"><div class="k">Chip power, estimate</div><div class="v">${uw.toFixed(1)} µW</div><div class="s">Working on every window, with no memory to read the weights from.</div></div>
    <div class="est"><div class="k">Battery life, estimate</div><div class="v">${days.toFixed(1)} days</div><div class="s">On a ${d.cell}. Most of the energy goes to ${d.heavy}, not the chip.</div></div></div></div>`;
  return ['On the device', 'The chip drawn to scale on the sensor patch, with rough estimates of its area, power and battery life.', body, 'Estimates assume a 130 nm process and the sensor parts named; they are not measurements.'];
}

function openSettings(r) {
  closeLayer();
  const u = UC[r.uc], d = document.createElement('div');
  const sc = document.createElement('div'); sc.className = 'scrimm'; sc.style.background = 'rgb(20 20 40/.12)';
  d.className = 'drawer'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Run settings');
  d.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between"><h3>Run settings</h3><button class="ib" aria-label="Close">${ic('x', 16)}</button></div>
    <p style="margin:0 0 10px;color:var(--ink55);font-size:12.5px">What this run was started with. To change them for the next run, use Configure.</p>
    <div class="kv"><span>Use case</span><span>${u.name}</span></div>
    <div class="kv"><span>Preset</span><span>${PRESETS[r.preset].name}, ${plan(r).n} rounds${r.extra ? ' (one added by your note)' : ''}</span></div>
    <div class="kv"><span>Compute</span><span>${COMPUTE[r.compute].name}, ${fmtN(batch(r))} candidates a round</span></div>
    <div class="kv"><span>Clinical line</span><span>Worst ${u.pat} at least ${pct(lineAt(r, r.t))}</span></div>
    <div class="kv"><span>Largest chip allowed</span><span>${fmtN(r.maxGates)} gates</span></div>
    <div class="kv"><span>Scientists</span><span>Lead, design and check</span></div>
    <a class="lnk" style="padding-left:0;margin-top:10px" href="#/configure/line">Open Configure</a>`;
  document.body.append(sc, d);
  const close = () => { sc.remove(); d.remove(); };
  sc.onclick = close; $('button', d).onclick = close; $('a', d).onclick = close;
}

/* ---------- start page ---------- */
const draft = { text: '' };
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function renderStart() {
  const u = UC[CFG.uc];
  $('#main').innerHTML = `<div class="start"><div class="c672">
    <h1 class="greet">${greeting()}</h1>
    <p class="lead">Describe a sensing device and the job its chip must do.</p>
    <form class="box" id="sf">
      <textarea id="si" rows="1" aria-label="Describe the device" placeholder="${esc(u.placeholder)}">${esc(draft.text)}</textarea>
      <div class="ctl">
        <button type="button" class="pill" id="p-uc">${ic(u.icon, 13)}<span>${u.name}</span><span class="chev">${ic('chevd', 12)}</span></button>
        <button type="button" class="pill" id="p-pre">${ic(PRESETS[CFG.preset].icon, 13)}<span>${PRESETS[CFG.preset].name}</span><span class="chev">${ic('chevd', 12)}</span></button>
        <button type="button" class="pill" id="p-cmp">${ic('cpu', 13)}<span>${COMPUTE[CFG.compute].name}</span><span class="chev">${ic('chevd', 12)}</span></button>
        <button type="button" class="ghost" id="p-adv">${ic('sliders', 13)}<span>Advanced</span></button>
        <button type="submit" class="send" id="sgo" aria-label="Start the run">${ic('up', 16, 2)}</button>
      </div>
    </form></div></div>`;
  const si = $('#si'), go2 = $('#sgo');
  const sync = () => { draft.text = si.value; si.style.height = '24px'; si.style.height = Math.min(280, si.scrollHeight) + 'px'; go2.classList.toggle('ready', !!si.value.trim()); };
  si.oninput = sync; sync();
  si.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#sf').requestSubmit(); } };
  $('#sf').onsubmit = e => { e.preventDefault(); if (!si.value.trim()) { si.focus(); return; } startRun(si.value.trim()); };
  $('#p-uc').onclick = e => openPop(e.currentTarget, `<div class="pc">Use case</div>` + Object.values(UC).map(x => `<button class="row ${CFG.uc === x.key ? 'sel' : ''}" data-a="${x.key}">${ic(x.icon, 15)}<span>${x.name}<span class="h">${x.hint}</span></span>${CFG.uc === x.key ? `<span class="ck">${ic('check', 14, 2.2)}</span>` : ''}</button>`).join(''), { w: 280, onPick: k => {
    const prevPrompt = UC[CFG.uc].prompt; CFG.uc = k;
    if (!draft.text.trim() || draft.text === prevPrompt) draft.text = UC[k].prompt;
    renderStart(); $('#si').focus();
  } });
  $('#p-pre').onclick = e => openPop(e.currentTarget, `<div class="pc">Preset</div>` + Object.entries(PRESETS).map(([k, p]) => `<button class="row ${CFG.preset === k ? 'sel' : ''}" data-a="${k}">${ic(p.icon, 15)}<span>${p.name}<span class="h">${p.hint}</span></span>${CFG.preset === k ? `<span class="ck">${ic('check', 14, 2.2)}</span>` : ''}</button>`).join(''), { w: 200, onPick: k => { CFG.preset = k; renderStart(); } });
  $('#p-cmp').onclick = e => openPop(e.currentTarget, `<div class="pc">Machine</div>` + Object.entries(COMPUTE).map(([k, c]) => `<button class="row ${CFG.compute === k ? 'sel' : ''}" data-a="${k}">${ic(k.startsWith('gpu') ? 'zap' : 'cpu', 15)}<span>${c.name}<span class="h">${c.hint}</span></span>${CFG.compute === k ? `<span class="ck">${ic('check', 14, 2.2)}</span>` : ''}</button>`).join(''), { w: 280, onPick: k => { CFG.compute = k; renderStart(); } });
  $('#p-adv').onclick = e => openAdvanced(e.currentTarget);
}
function stepper(id, val) { return `<span class="num"><button type="button" data-a="${id}-" aria-label="Less">-</button><span id="${id}">${val}</span><button type="button" data-a="${id}+" aria-label="More">+</button></span>`; }
function openAdvanced(anchor) {
  const u = UC[CFG.uc];
  const html = () => `<div class="pc">Advanced</div>
    <div class="fld"><span>Clinical line<span class="h">Worst unseen ${u.pat} must reach</span></span>${stepper('al', pct(CFG.line))}</div>
    <div class="fld"><span>Largest chip allowed<span class="h">Designs above this are dropped</span></span>${stepper('ag', fmtN(CFG.maxGates))}</div>
    <div class="fld"><span>Candidates a round<span class="h">Set by the machine</span></span><span style="font-size:12.5px;color:var(--ink7)">${fmtN(COMPUTE[CFG.compute].batch)}</span></div>
    <hr><a class="lnk" href="#/configure/agents" data-a="cfg">Scientists, models and budget in Configure</a>`;
  openPop(anchor, html(), { w: 320, onPick: a => {
    if (a === 'cfg') return false;
    if (a === 'al-') CFG.line = clamp(+(CFG.line - .01).toFixed(2), .7, .99);
    if (a === 'al+') CFG.line = clamp(+(CFG.line + .01).toFixed(2), .7, .99);
    if (a === 'ag-') CFG.maxGates = clamp(CFG.maxGates - 500, 500, 50000);
    if (a === 'ag+') CFG.maxGates = clamp(CFG.maxGates + 500, 500, 50000);
    $('#al').textContent = pct(CFG.line); $('#ag').textContent = fmtN(CFG.maxGates);
    return true;
  } });
}
function startRun(text) {
  const u = UC[CFG.uc];
  let title = text === u.prompt ? u.newTitle : text.replace(/^(design|build|make)( me)?( the| a)?( chip for)?( a| an| the)?\s*/i, '').split(/[.!?\n]/)[0].trim();
  if (title.length > 54) title = title.slice(0, 52).replace(/\s+\S*$/, '') + '...';
  title = title.charAt(0).toUpperCase() + title.slice(1);
  const r = mkRun({ id: 'n' + Date.now().toString(36), title, uc: CFG.uc, preset: CFG.preset, compute: CFG.compute, line: CFG.line !== u.line ? CFG.line : null, maxGates: CFG.maxGates, created: 1 });
  runs.unshift(r); draft.text = '';
  go(runHash(r.id));
}

/* ---------- configure ---------- */
const CTABS = [{ k: 'line', n: 'Clinical line' }, { k: 'rounds', n: 'Rounds' }, { k: 'compute', n: 'Compute' }, { k: 'agents', n: 'Scientists' }, { k: 'budget', n: 'Budget' }];
function renderConfigure() {
  const u = UC[CFG.uc];
  const sw = (k, on) => `<button class="sw ${on ? 'on' : ''}" data-sw="${k}" role="switch" aria-checked="${on}" aria-label="Toggle"></button>`;
  const sel = (k, opts, v) => `<select class="sel" data-sel="${k}">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  const P = {
    line: ['Clinical line', `What every chip is held to. A chip passes only if the worst unseen ${u.pat} meets it.`,
      `<div class="fld"><span>Use case</span>${sel('uc', Object.values(UC).map(x => x.name), u.name)}</div>
       <div class="fld"><span>Worst unseen ${u.pat} must reach<span class="h">Share of ${u.event}s caught in time</span></span>${stepper('cl', pct(CFG.line))}</div>
       <div class="fld"><span>False alarms allowed<span class="h">Per hour of recording</span></span>${stepper('cf', CFG.fa)}</div>
       <div class="fld"><span>Alarm must come within<span class="h">Seconds after onset</span></span>${stepper('cw', CFG.within + ' s')}</div>`],
    rounds: ['Rounds', 'How long the scientists keep designing.',
      `<div class="fld"><span>Design rounds<span class="h">Propose, fine-tune, compile and check</span></span>${stepper('cr', PRESETS[CFG.preset].rounds)}</div>
       <div class="fld"><span>Largest chip allowed<span class="h">Designs above this are dropped</span></span>${stepper('cg', fmtN(CFG.maxGates))}</div>
       <div class="fld"><span>Stop early<span class="h">When a round finds no smaller chip</span></span>${sw('early', CFG.early)}</div>`],
    compute: ['Compute', 'The machine that fine-tunes the candidate models.',
      Object.entries(COMPUTE).map(([k, c]) => `<div class="fld"><span>${c.name}<span class="h">${c.hint}</span></span><button class="pill" data-cmp="${k}" style="${CFG.compute === k ? 'background:#2563eb;color:#fff;border-color:#2563eb' : ''}">${CFG.compute === k ? 'Selected' : 'Use this'}</button></div>`).join('')],
    agents: ['Scientists', 'The three AI scientists and the model each one runs on.',
      Object.entries(WHO).map(([k, w]) => `<div class="fld"><span style="display:flex;gap:10px;align-items:center"><span class="avr" style="width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:${w.bg};color:${w.fg}">${ic(w.icon, 13)}</span>${w.name}</span>${sel('m-' + k, ['Claude Opus', 'Claude Sonnet', 'Claude Haiku'], CFG.models[k])}</div>`).join('') +
      `<div class="fld"><span>Effort<span class="h">How long each scientist thinks before acting</span></span>${sel('effort', ['Low', 'Medium', 'High'], CFG.effort)}</div>`],
    budget: ['Budget', 'How much a run may spend before it wraps up.',
      `<div class="fld"><span>Spend cap<span class="h">Per run, compute and models together</span></span>${stepper('cb', '$' + CFG.cap)}</div>
       <div class="fld"><span>Wrap up at the cap<span class="h">Write the report with the best chip so far</span></span>${sw('wrap', CFG.wrap)}</div>`],
  }[R.cfg];
  $('#main').innerHTML = `<div class="cfg"><div class="crail">
      <div class="cap">Preset</div>${Object.entries(PRESETS).map(([k, p]) => `<button data-pre="${k}" class="${CFG.preset === k ? 'on' : ''}">${ic(p.icon, 15)}${p.name}</button>`).join('')}
      <div class="cap" style="margin-top:14px">Settings</div>${CTABS.map(c => `<a href="#/configure/${c.k}" class="${R.cfg === c.k ? 'on' : ''}">${c.n}</a>`).join('')}
    </div><div class="cmain"><h1>${P[0]}</h1><p>${P[1]}</p><div class="cpanel">${P[2]}</div></div></div>`;
  const m = $('#main');
  $$('[data-pre]', m).forEach(b => b.onclick = () => { CFG.preset = b.dataset.pre; renderConfigure(); });
  $$('[data-sw]', m).forEach(b => b.onclick = () => { CFG[b.dataset.sw] = !CFG[b.dataset.sw]; renderConfigure(); });
  $$('[data-cmp]', m).forEach(b => b.onclick = () => { CFG.compute = b.dataset.cmp; renderConfigure(); });
  $$('[data-sel]', m).forEach(s => s.onchange = () => {
    const k = s.dataset.sel;
    if (k === 'uc') CFG.uc = Object.values(UC).find(x => x.name === s.value).key;
    else if (k === 'effort') CFG.effort = s.value;
    else CFG.models[k.slice(2)] = s.value;
    renderConfigure();
  });
  $$('[data-a]', m).forEach(b => b.onclick = () => {
    const a = b.dataset.a, d = a.endsWith('+') ? 1 : -1, k = a.slice(0, -1);
    if (k === 'cl') CFG.line = clamp(+(CFG.line + d * .01).toFixed(2), .7, .99);
    if (k === 'cf') CFG.fa = clamp(CFG.fa + d, 0, 6);
    if (k === 'cw') CFG.within = clamp(CFG.within + d * 5, 5, 60);
    if (k === 'cg') CFG.maxGates = clamp(CFG.maxGates + d * 500, 500, 50000);
    if (k === 'cb') CFG.cap = clamp(CFG.cap + d * 5, 5, 500);
    if (k === 'cr') { const order = ['quick', 'standard', 'thorough']; CFG.preset = order[clamp(order.indexOf(CFG.preset) + d, 0, 2)]; }
    renderConfigure();
  });
}

/* ---------- router and clock ---------- */
function route() {
  closePop(); closeLayer();
  parseHash();
  if (R.page === 'run') renderRun();
  else if (R.page === 'configure') renderConfigure();
  else renderStart();
  runsSig = ''; renderSidebar();
}
addEventListener('hashchange', route);
let lastW = innerWidth;
addEventListener('resize', () => { const cross = (lastW < 1024) !== (innerWidth < 1024) || (lastW < 768) !== (innerWidth < 768); lastW = innerWidth; if (cross) renderSidebar(); });
let last = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(1, (now - last) / 1000); last = now;
  runs.forEach(r => { if (!r.paused) { const T = plan(r).total; if (r.t < T) r.t = Math.min(T, r.t + dt); } });
  renderRuns();
  update(false);
}, 250);

seedRuns();
renderMobileHeader();
route();
})();
</script>
</body>
</html>
