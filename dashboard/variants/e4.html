<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{
  --page:#fafaf9;--card:#fff;--glass:rgb(255 253 250/.72);--glass-s:rgb(255 253 250/.96);
  --i900:#1a1a2e;--i800:#3a3a4a;--i700:#4a4a5a;--i600:#5a5a6a;--i550:#666676;--i500:#6c6c85;--i400:#8a8a99;--i300:#b0b0be;--i200:#d4d4dc;--i150:#e8e8ec;--i100:#f3f3f6;
  --blue:#3b82f6;--blue6:#2563eb;--blue7:#1d4ed8;--violet:#8b5cf6;--indigo:#6366f1;--teal:#0d9488;
  --ok:#10b981;--okt:#047857;--okbg:#ecfdf5;--bad:#ef4444;--badt:#b91c1c;--badbg:#fef2f2;
  --hair:rgb(0 0 0/.06);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Charter","Georgia",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sh-card:0 2px 8px rgb(0 0 0/.08);--sh-menu:0 4px 20px rgb(0 0 0/.1);--sh-hair:0 1px 3px rgb(0 0 0/.04);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--i900);background:var(--page);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s12{width:12px;height:12px}svg.i.s13{width:13px;height:13px}svg.i.s14{width:14px;height:14px}svg.i.s16{width:16px;height:16px}

/* ---------- sidebar ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:252px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid rgb(0 0 0/.04);display:flex;flex-direction:column;z-index:40;transition:width .15s var(--ease),box-shadow .15s var(--ease),transform .2s var(--ease)}
.sb-head{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--hair)}
.logo{width:28px;height:28px;border-radius:7px;flex:none;background:linear-gradient(140deg,#3b82f6 0%,#6366f1 55%,#8b5cf6 100%);display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgb(255 255 255/.18)}
.logo svg{width:16px;height:16px;stroke-width:1.9}
.word{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
.tog{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .12s}
.tog:hover{background:rgb(0 0 0/.05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--i500);text-decoration:none;white-space:nowrap;transition:background .12s}
.nav a:hover{background:rgb(0 0 0/.03)}
.nav a.on{background:rgb(59 130 246/.06);color:var(--i900)}
.count{margin-left:auto;font-size:10px;font-weight:600;color:var(--blue6);background:rgb(37 99 235/.07);border-radius:99px;padding:1px 7px}
.sb-div{height:1px;background:var(--hair);margin:2px 12px}
.runs{flex:1;overflow:auto;padding:6px 8px 10px}
.cap{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550)}
.cap a{text-transform:none;letter-spacing:0;font-weight:500;text-decoration:none;color:var(--i550);cursor:pointer}
.cap a:hover{color:var(--i900)}
.rrow{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);text-decoration:none;white-space:nowrap;transition:background .1s}
.rrow:hover{background:rgb(0 0 0/.025)}
.rrow.on{background:rgb(59 130 246/.06);color:var(--i900)}
.rrow .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid rgb(59 130 246/.2);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g .ok{color:var(--ok)}
.acct{flex:none;border-top:1px solid var(--hair);padding:8px}
.acct button{display:flex;align-items:center;gap:9px;width:100%;padding:5px;border-radius:8px}
.acct button:hover{background:rgb(0 0 0/.03)}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:10px;color:var(--i550)}
body.col .sb{width:52px}
body.col .sb:hover{width:252px;box-shadow:var(--sh-menu)}
body.col .sb:not(:hover) .hc{display:none}
body.col .sb:not(:hover) .sb-head{justify-content:center;padding:0}
body.col .sb:not(:hover) .sb-head .logo{display:none}
body.col .sb:not(:hover) .tog{margin:0}
body.col .sb:not(:hover) .nav a{justify-content:center;padding:0}
body.col .sb:not(:hover) .runs{visibility:hidden}
body.col .sb:not(:hover) .acct button{justify-content:center}

/* ---------- main ---------- */
.main{position:fixed;top:0;right:0;bottom:0;left:252px;display:flex;flex-direction:column;transition:left .15s var(--ease)}
body.col .main{left:52px}
.mhead{display:none}
.demo{position:fixed;right:12px;bottom:10px;z-index:20;font-size:10.5px;color:var(--i400);background:rgb(250 250 249/.85);padding:2px 8px;border-radius:99px;border:1px solid var(--hair);pointer-events:none}

/* ---------- start ---------- */
.start{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
.scol{width:100%;max-width:672px;margin-top:-6vh}
.greet{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1;text-align:center;margin:0;letter-spacing:-.015em}
.subt{font-size:16px;color:var(--i550);text-align:center;margin:12px 0 32px}
.box{background:var(--glass-s);border:1px solid rgb(0 0 0/.07);border-radius:24px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 28px -14px rgb(30 40 90/.16);padding:18px 20px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.55;min-height:24px;max-height:280px;color:var(--i900);padding:0;display:block}
.box textarea::placeholder{color:var(--i500)}
.crow{display:flex;align-items:center;gap:6px;margin-top:12px;min-height:36px}
.grow{flex:1}
.pill{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 9px 0 9px;border-radius:99px;border:1px solid rgb(0 0 0/.08);background:#fff;font-size:11.5px;font-weight:500;color:var(--i800);white-space:nowrap;transition:background .1s,border-color .1s}
.pill:hover{background:var(--i100)}
.pill .cv{opacity:.5}
.pill[aria-expanded=true]{border-color:rgb(37 99 235/.4)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i300);flex:none;transition:all .12s}
.send.ready{background:#fff;color:var(--i900);box-shadow:0 1px 2px rgb(0 0 0/.08),0 3px 10px rgb(0 0 0/.08)}
.send.ready:hover{box-shadow:0 1px 2px rgb(0 0 0/.1),0 4px 14px rgb(0 0 0/.14)}
.send svg{width:17px;height:17px;stroke-width:2.1}

/* ---------- popovers / modal ---------- */
.pop{position:fixed;z-index:80;background:#fff;border:1px solid rgb(0 0 0/.07);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pcap{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550);padding:6px 8px 4px}
.pi{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 8px;border-radius:7px;font-size:12.5px;color:var(--i800)}
.pi:hover{background:var(--i100)}
.pi.on{background:rgb(37 99 235/.08)}
.pi .ck{margin-left:auto;color:var(--blue6);align-self:center}
.pi .h{display:block;font-size:11px;color:var(--i550);margin-top:1px}
.pi[disabled]{opacity:.45;cursor:default}
.psep{height:1px;background:var(--hair);margin:5px 4px}
.field{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 8px;font-size:12.5px;color:var(--i800)}
.field select,.field input{height:28px;border:1px solid var(--i150);border-radius:7px;background:#fff;padding:0 6px;font-size:12px}
.field input{width:90px}
.plink{display:block;padding:7px 8px;font-size:12px;color:var(--blue6);text-decoration:none;border-radius:7px;cursor:pointer}
.plink:hover{background:var(--i100)}
.mbg{position:fixed;inset:0;background:rgb(20 20 40/.18);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0/.18);width:min(440px,100%);max-height:86vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .mx{float:right;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550)}
.modal .mx:hover{background:var(--i100)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13px}
.kv span:first-child{color:var(--i550)}
.kv:last-child{border:0}
.srch{width:100%;height:38px;border:1px solid var(--i150);border-radius:9px;padding:0 12px;margin:10px 0 8px;outline:0}
.srch:focus{border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:9px;z-index:99;animation:fade .15s}

/* ---------- run page ---------- */
.top{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);background:rgb(255 255 255/.7)}
.tabs{display:flex;gap:18px;height:100%;flex:none}
.tab{font-size:11.5px;font-weight:500;color:var(--i550);height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none}
.tab:hover{color:var(--i900)}
.tab.on{color:var(--blue6);font-weight:600;border-bottom-color:var(--blue6)}
.spill{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap;flex:none}
.spill.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px #a7f3d0}
.spill.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.ttl{font-size:11.5px;font-weight:600;color:var(--i900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:40px;max-width:280px;flex:0 1 auto}
.ttl-in{font-size:11.5px;font-weight:600;border:0;outline:0;box-shadow:0 0 0 2px rgb(59 130 246/.4);border-radius:5px;padding:2px 5px;width:260px}
.pbar{flex:1;max-width:560px;min-width:0;display:flex;align-items:center;gap:9px}
.pbtn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--i700);flex:none}
.pbtn:hover{background:var(--i100)}
.pbtn svg{width:13px;height:13px;fill:currentColor;stroke:none}
.clk{font-family:var(--mono);font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--i100);color:var(--i700);flex:none;font-variant-numeric:tabular-nums}
.clk.live{background:rgb(239 68 68/.08);color:var(--badt)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#818cf8,#6366f1)}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#6366f1;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.live i{background:#ef4444}.track.live b{background:#ef4444}
.livep{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--badt);background:rgb(239 68 68/.1);padding:3px 7px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:#ef4444;animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.tright{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
.tchip{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:7px;font-size:11.5px;color:var(--i600)}
.tchip:hover,.ib:hover{background:var(--i100)}
.ib{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--i550)}
.body{flex:1;overflow:auto;position:relative;min-height:0}

/* ---------- overview: timeline ---------- */
.ov{max-width:660px;margin:0 auto;padding:40px 28px 90px}
.vlab{font-size:12.5px;color:var(--i550);margin:0 0 8px}
.vline{font-family:var(--serif);font-size:25px;line-height:1.28;margin:0;letter-spacing:-.012em;color:var(--i900);text-wrap:balance}
.vline .miss{color:#9a3412}
.vsub{font-size:13px;color:var(--i500);margin:8px 0 0}
.tl{list-style:none;margin:34px 0 0;padding:0}
.tr{display:grid;grid-template-columns:42px 26px minmax(0,1fr);column-gap:10px;position:relative;border-radius:10px}
.tt{font-family:var(--mono);font-size:10.5px;color:var(--i400);text-align:right;padding-top:13px;font-variant-numeric:tabular-nums}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50%;width:1.5px;margin-left:-.75px;top:0;bottom:0;background:var(--i150)}
.tr:first-child .rail::before{top:18px}
.tr:last-child .rail::before{bottom:calc(100% - 18px)}
.tr.s-done .rail::before{background:#bfd3f8}
.node{position:absolute;left:50%;top:12px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--page);border:1.5px solid var(--i200);z-index:1}
.s-done .node{background:var(--blue);border-color:var(--blue);box-shadow:inset 0 0 0 2.5px #fff}
.s-cur .node{border-color:var(--blue);background:#fff;box-shadow:0 0 0 0 rgb(59 130 246/.4);animation:breathe 2.2s var(--ease) infinite}
.s-cur .node::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blue)}
@keyframes breathe{0%{box-shadow:0 0 0 0 rgb(59 130 246/.35)}70%{box-shadow:0 0 0 9px rgb(59 130 246/0)}100%{box-shadow:0 0 0 0 rgb(59 130 246/0)}}
.d1 .node{width:8px;height:8px;margin-left:-4px;top:14px}
.d1 .tc{padding-left:2px}
.tc{padding:9px 12px 11px 6px;min-width:0;border-radius:10px}
.th{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--i900);min-height:22px;flex-wrap:wrap}
.d1 .th{font-weight:500;font-size:13px}
.s-pend .th{color:var(--i400);font-weight:500}
.tg{display:inline-flex;align-items:center;gap:4px;border-radius:5px}
.tg svg{color:var(--i400);transition:transform .15s}
.tg[aria-expanded=true] svg{transform:rotate(90deg)}
.to{font-size:12.5px;color:var(--i500);margin-top:2px;line-height:1.45}
.s-cur .tc{background:linear-gradient(100deg,rgb(59 130 246/.05) 0%,rgb(59 130 246/.05) 40%,rgb(255 255 255/.9) 50%,rgb(59 130 246/.05) 60%,rgb(59 130 246/.05) 100%);background-size:260% 100%;animation:sweep 3.5s linear infinite}
@keyframes sweep{from{background-position:130% 0}to{background-position:-130% 0}}
.s-cur .to{color:var(--blue7)}
.tbar{height:2px;border-radius:2px;background:rgb(59 130 246/.14);margin-top:8px;overflow:hidden;max-width:320px}
.tbar i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .3s linear}
.note{font-size:11px;font-weight:500;color:#0f766e;background:rgb(13 148 136/.08);padding:1px 8px;border-radius:99px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%}
.feed{flex:1;overflow:auto;min-height:0}
.fin{max-width:700px;margin:0 auto;padding:30px 24px 16px}
.msg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;margin:0 0 18px;animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.mav{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.mav svg{width:14px;height:14px}
.who{font-size:12px;font-weight:600}
.when{font-size:10.5px;color:var(--i400);margin-left:6px;font-weight:400;font-family:var(--mono)}
.mt{font-size:13.5px;line-height:1.58;color:var(--i800);margin-top:2px}
.tool{margin:-8px 0 18px 36px;border:1px solid var(--hair);border-radius:10px;background:#fff;animation:rise .35s var(--ease)}
.tool summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;color:var(--i600);cursor:pointer;border-radius:10px}
.tool summary::-webkit-details-marker{display:none}
.tool summary:hover{background:var(--i100)}
.tool summary .cv{margin-left:auto;transition:transform .15s;color:var(--i400)}
.tool[open] summary .cv{transform:rotate(90deg)}
.tool .tsp{width:12px;height:12px;border-radius:50%;border:1.6px solid rgb(59 130 246/.2);border-top-color:var(--blue);animation:spin 1s linear infinite;flex:none}
.tool .tok{color:var(--ok)}
.tool ul{margin:0;padding:4px 12px 10px 30px;font-size:12px;color:var(--i600);line-height:1.6}
.you{display:flex;justify-content:flex-end;margin:0 0 18px;animation:rise .3s var(--ease)}
.you p{margin:0;background:var(--teal);color:#fff;font-size:13.5px;line-height:1.5;padding:8px 13px;border-radius:16px 16px 4px 16px;max-width:75%}
.typing{display:flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--i300);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.comp{flex:none;padding:6px 24px 22px}
.comp .box{max-width:672px;margin:0 auto;padding:12px 12px 12px 18px;display:flex;align-items:flex-end;gap:10px}
.comp textarea{padding:8px 0}

/* ---------- visual ---------- */
.vis{max-width:1060px;margin:0 auto;padding:18px 28px 60px}
.picker{display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--hair);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.pk{text-decoration:none;font-size:12.5px;font-weight:500;color:var(--i550);padding:8px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pk:hover{color:var(--i900)}
.pk.on{color:var(--i900);font-weight:600;border-bottom-color:var(--i900)}
.vh{display:block}
.vh h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;letter-spacing:-.01em}
.vh .vs{font-size:13.5px;color:var(--i550);margin:6px 0 0}
.stage{margin-top:16px;background:#fff;border:1px solid rgb(0 0 0/.06);border-radius:14px;box-shadow:var(--sh-hair);padding:14px 16px;position:relative}
.stage svg.v{display:block;width:100%;height:auto;max-height:calc(100vh - 250px)}
.stage.fresh{animation:fresh .9s var(--ease)}
@keyframes fresh{0%{box-shadow:0 0 0 3px rgb(59 130 246/.35)}100%{box-shadow:var(--sh-hair)}}
.vf{font-size:12px;color:var(--i400);margin:10px 2px 0}
.ptiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pt{border:1px solid var(--hair);border-radius:10px;padding:12px 12px 11px;background:#fff}
.pt .pn{font-size:11.5px;color:var(--i550)}
.pt .pv{font-family:var(--serif);font-size:26px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.pt .ps{font-size:11.5px;display:flex;align-items:center;gap:5px}
.pt .ps i{width:7px;height:7px;border-radius:50%}
.pt.ok .ps{color:var(--okt)}.pt.ok .ps i{background:var(--ok)}
.pt.no{background:#fffaf5;border-color:#fed7aa}.pt.no .ps{color:#9a3412}.pt.no .ps i{background:#f97316}
.pt.worst{box-shadow:0 0 0 2px var(--i900)}
.pt .wl{font-size:10.5px;font-weight:600;color:var(--i900);margin-top:6px}

/* ---------- configure ---------- */
.cfg{max-width:860px;margin:0 auto;padding:44px 28px 60px}
.cfg h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em}
.cfg .lead{color:var(--i550);margin:8px 0 28px;font-size:14px}
.cgrid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px}
.ctabs{display:flex;flex-direction:column;gap:2px}
.ctab{padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--i500)}
.ctab:hover{background:rgb(0 0 0/.03)}
.ctab.on{background:rgb(59 130 246/.06);color:var(--i900)}
.cpanel{background:#fff;border:1px solid rgb(0 0 0/.06);border-radius:12px;padding:6px 18px}
.crow2{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.crow2:last-child{border:0}
.crow2 .l{flex:1;min-width:0}
.crow2 .l b{display:block;font-size:13.5px;font-weight:600}
.crow2 .l span{display:block;font-size:12px;color:var(--i550);margin-top:2px}
.crow2 select,.crow2 input[type=text]{height:30px;border:1px solid var(--i150);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px}
.sw{width:32px;height:18px;border-radius:99px;background:var(--i200);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.2);transition:left .15s}
.sw[aria-checked=true]{background:var(--blue6)}
.sw[aria-checked=true]::after{left:16px}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--i200);flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--blue6)}
.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue6)}
.cnote{font-size:12px;color:var(--i400);margin:12px 2px 0}

/* ---------- responsive ---------- */
@media (max-width:1100px){.ttl{max-width:160px}}
@media (max-width:900px){.tchip .lb{display:none}.ptiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:767px){
  .sb{width:252px!important;transform:translateX(-100%);box-shadow:none}
  body.drawer .sb{transform:none;box-shadow:var(--sh-menu)}
  body.col .sb .hc{display:revert}
  .main,body.col .main{left:0;top:48px}
  .mhead{display:flex;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--hair);background:var(--glass-s);z-index:30}
  .scrim{position:fixed;inset:0;z-index:35;background:rgb(20 20 40/.18)}
  .ttl,.tchip,.track{display:none}
  .pbar{flex:0 0 auto}
  .top{gap:10px;padding:0 8px 0 12px}
  .tabs{gap:14px}
  .ov{padding:26px 18px 70px}
  .vline{font-size:21px}
  .tr{grid-template-columns:34px 22px minmax(0,1fr);column-gap:6px}
  .vis{padding:12px 14px 50px}
  .ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage{overflow-x:auto}.stage svg.v{min-width:640px;max-height:none}
  .cgrid{grid-template-columns:1fr;gap:14px}
  .ctabs{flex-direction:row;overflow-x:auto}
  .greet{font-size:30px}
  .crow{flex-wrap:wrap}
  .demo{bottom:auto;top:13px;right:12px;z-index:31}
  .comp{padding:6px 12px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

  let reply, round = null;
  if (st.done || (st.c && st.c.key === "report")) {
    reply = "This run has finished its rounds, so the chip it found is final. Start a new run with that note and we will aim for it from round 1.";
  } else {
    for (const s of st.S) if (s.key === "propose" && s.start > st.t) { round = s.round; break; }
    let added = false;
    if (round == null && type !== "note") { run.rounds++; round = run.rounds; added = true; }
    if (round == null) { reply = "Noted. We will keep that in mind for the report."; }
    else {
      reply = ({
        smaller: `Got it. From round ${round} we will push for fewer gates and accept a worst ${u.who} just above the clinical line.`,
        accurate: `Understood. From round ${round} we will favour the worst ${u.who}, even if the chip grows a little.`,
        channels: `Okay. From round ${round} we will try one fewer ${u.unit1} and check that the worst ${u.who} still holds.`,
        note: `Noted. We will carry that into round ${round}.`
      })[type] + (added ? ` Adding round ${round} to try it.` : "");
    }
  }
  run.notes.push({ at: st.t, wall: Date.now(), text, type, round, reply });
}

let popEl = null;

  closePop();
  const d = document.createElement("div"); d.className = "pop"; d.innerHTML = html; if (width) d.style.width = width + "px";
  document.body.appendChild(d);

      <p class="vline">${fmt(b.gates)} gates. ${ok ? `Meets the clinical line on all 12 unseen ${u.whoP}.` : `Meets the clinical line on ${b.meets} of 12 unseen ${u.whoP}.`}</p>

  for (let m = 0; m <= 30; m += 5) ticks += T(X(m), 348, m + " min", { fs: 11, a: "middle", c: "#8a8a99" });
  let yt = ""; for (const v of [50, 60, 70, 80]) yt += T(x0 - 10, Y(v) + 4, v + "%", { fs: 11, a: "end", c: "#8a8a99" }) + `<line x1="${x0}" x2="${x1}" y1="${Y(v)}" y2="${Y(v)}" stroke="#f3f3f6"/>`;
  return `<svg class="v" viewBox="0 0 960 360" role="img" aria-label="Brain oxygen trace with alarm line">
    ${yt}
    <rect x="${X(c0)}" y="${Y(85)}" width="${X(c1) - X(c0)}" height="${Y(45) - Y(85)}" fill="#fde68a" opacity=".3"/>

    <line x1="${x0}" x2="${x1}" y1="${Y(55)}" y2="${Y(55)}" stroke="#ef4444" stroke-dasharray="6 5" stroke-width="1.4"/>${T(x1, Y(55) - 6, "Alarm line, 55%", { fs: 11, w: 600, a: "end", c: "#b91c1c" })}
    <path d="${d}" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linejoin="round"/>
    ${T(x0 + 4, Y(85) + 2, "Brain oxygen", { fs: 11, c: "#8a8a99" })}
    <rect x="${x0}" y="296" width="${x1 - x0}" height="16" rx="4" fill="#f3f3f6"/>
    <rect x="${X(c0 - lead)}" y="296" width="${X(c1) - X(c0 - lead)}" height="16" rx="4" fill="#3b82f6"/>${T(X(c0 - lead) + 8, 308, `${lbl}: warned ${Math.round(lead * 60)} s early`, { fs: 11, w: 600, c: "#fff" })}
    ${fa ? `<rect x="${X(25.2)}" y="296" width="${X(26.1) - X(25.2)}" height="16" rx="3" fill="#f97316"/>` + T(X(25.65), 290, "False alarm", { fs: 10.5, a: "middle", c: "#9a3412" }) : ""}
    ${ticks}</svg>`;
}

function visSensors(run, st) {
  const u = st.u, used = usedList(st), cap = st.best ? `round ${st.best.r} chip` : "reference model";
  if (u.key === "brain") {
    const POS = { Fp1: [-.3, -.88], Fp2: [.3, -.88], F7: [-.72, -.52], F3: [-.36, -.45], Fz: [0, -.43], F4: [.36, -.45], F8: [.72, -.52], T7: [-.88, 0], C3: [-.44, 0], Cz: [0, 0], C4: [.44, 0], T8: [.88, 0], P7: [-.72, .52], P3: [-.36, .45], Pz: [0, .43], P4: [.36, .45], P8: [.72, .52], O1: [-.3, .88], O2: [.3, .88] };
    const cx = 330, cy = 210, r = 165;
    let el = "";
    for (const [k, [x, y]] of Object.entries(POS)) {
      const on = used.includes(k), X = cx + x * 140, Y = cy + y * 140;
      el += (on ? `<circle cx="${X}" cy="${Y}" r="24" fill="#3b82f6" opacity=".14"/>` : "") + `<circle cx="${X}" cy="${Y}" r="16" fill="${on ? "#3b82f6" : "#fff"}" stroke="${on ? "#2563eb" : "#d4d4dc"}" stroke-width="1.4"/>` + T(X, Y + 4, k, { fs: 10.5, w: 600, a: "middle", c: on ? "#fff" : "#8a8a99" });
    }
    return `<svg class="v" viewBox="0 0 960 420" role="img" aria-label="Electrode map">
      <path d="M${cx - 20} ${cy - r + 4} L${cx} ${cy - r - 22} L${cx + 20} ${cy - r + 4}" fill="#fff" stroke="#b0b0be" stroke-width="1.4" stroke-linejoin="round"/>
      <ellipse cx="${cx - r - 6}" cy="${cy}" rx="12" ry="32" fill="#fff" stroke="#b0b0be" stroke-width="1.4"/><ellipse cx="${cx + r + 6}" cy="${cy}" rx="12" ry="32" fill="#fff" stroke="#b0b0be" stroke-width="1.4"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fafaf9" stroke="#b0b0be" stroke-width="1.4"/>
      ${T(cx, cy - r - 30, "Nose", { fs: 11, a: "middle", c: "#8a8a99" })}
      ${el}
      ${T(600, 170, `${used.length} of ${u.total}`, { fs: 46, f: SERIF, c: "#1a1a2e" })}
      ${T(602, 200, `electrodes read by the ${cap}`, { fs: 14, c: "#5a5a6a" })}
      ${T(602, 236, used.length < u.total ? `${used.join(", ")}` : "All of them", { fs: 13, w: 600, c: "#1d4ed8" })}
      ${T(602, 270, used.length < u.total ? "Fewer electrodes means a lighter headband" : "The scientists try to drop the ones", { fs: 12.5, c: "#8a8a99" })}
      ${T(602, 288, used.length < u.total ? "and fewer wires to the chip." : "that add little.", { fs: 12.5, c: "#8a8a99" })}
    </svg>`;
  }
  const X = { S1: 500, D1: 580, D2: 640, D3: 720, D4: 780, S2: 860 }, py = 134;
  let paths = "", dots = "";
  for (const [s, d] of NB_PATHS) {
    const on = used.some(p => p[0] === s && p[1] === d), a = X[s], b = X[d], dep = Math.abs(b - a) * 0.62;
    paths += `<path d="M${a} ${py + 16} Q ${(a + b) / 2} ${py + 16 + dep} ${b} ${py + 16}" fill="none" stroke="${on ? "#3b82f6" : "#d4d4dc"}" stroke-width="${on ? 3 : 1.4}" ${on ? "" : 'stroke-dasharray="4 4"'} opacity="${on ? .9 : 1}"/>`;
  }
  for (const [k, x] of Object.entries(X)) { const src = k[0] === "S"; dots += `<circle cx="${x}" cy="${py}" r="13" fill="${src ? "#fb923c" : "#1a1a2e"}"/>` + T(x, py + 4, k, { fs: 10, w: 700, a: "middle", c: "#fff" }); }
  return `<svg class="v" viewBox="0 0 960 420" role="img" aria-label="Light sources and detectors on a newborn's forehead">
    <circle cx="210" cy="210" r="120" fill="#fafaf9" stroke="#b0b0be" stroke-width="1.4"/>
    <path d="M195 92 L210 74 L225 92" fill="#fff" stroke="#b0b0be" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse cx="87" cy="210" rx="10" ry="24" fill="#fff" stroke="#b0b0be" stroke-width="1.4"/><ellipse cx="333" cy="210" rx="10" ry="24" fill="#fff" stroke="#b0b0be" stroke-width="1.4"/>
    <path d="M150 122 Q210 100 270 122 L264 142 Q210 122 156 142 Z" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
    ${T(210, 360, "Seen from above; the patch sits", { fs: 12, a: "middle", c: "#8a8a99" })}${T(210, 377, "on the forehead", { fs: 12, a: "middle", c: "#8a8a99" })}
    <path d="M270 124 L470 134" stroke="#d4d4dc" stroke-dasharray="3 4"/>
    <rect x="460" y="150" width="440" height="184" rx="12" fill="url(#tissue)"/>
    <defs><linearGradient id="tissue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1e6"/><stop offset=".14" stop-color="#fff1e6"/><stop offset=".14" stop-color="#f3f3f6"/><stop offset=".36" stop-color="#f3f3f6"/><stop offset=".36" stop-color="#eef2ff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient></defs>
    ${T(892, 168, "Skin", { fs: 10.5, a: "end", c: "#9a7a6a" })}${T(892, 200, "Skull", { fs: 10.5, a: "end", c: "#8a8a99" })}${T(892, 326, "Brain", { fs: 10.5, a: "end", c: "#6366f1" })}
    <rect x="470" y="118" width="420" height="32" rx="16" fill="#fff" stroke="#d4d4dc"/>
    ${paths}${dots}
    ${T(470, 372, `${used.length} of ${u.total} light paths read by the ${cap}`, { fs: 14, w: 600, c: "#1a1a2e" })}
    ${T(470, 394, "Longer paths reach deeper, into the brain; short ones mostly see skin.", { fs: 12.5, c: "#8a8a99" })}
    <circle cx="474" cy="80" r="6" fill="#fb923c"/>${T(486, 84, "Light source", { fs: 11.5 })}<circle cx="584" cy="80" r="6" fill="#1a1a2e"/>${T(596, 84, "Detector", { fs: 11.5 })}
  </svg>`;
}

function visTrade(run, st, ft) {
  const u = st.u, x0 = 80, x1 = 930, y0 = 30, y1 = 340;
  const lx = g => Math.log10(g), X = g => x0 + (x1 - x0) * (lx(g) - lx(400)) / (lx(16000) - lx(400)), Y = s => y0 + (y1 - y0) * (98 - s) / (98 - 78);
  let grid = "";
  for (const g of [500, 1000, 2000, 5000, 10000]) grid += `<line x1="${X(g)}" x2="${X(g)}" y1="${y0}" y2="${y1}" stroke="#f3f3f6"/>` + T(X(g), y1 + 20, fmt(g), { fs: 11, a: "middle", c: "#8a8a99" });
  for (const s of [80, 85, 90, 95]) grid += `<line x1="${x0}" x2="${x1}" y1="${Y(s)}" y2="${Y(s)}" stroke="#f3f3f6"/>` + T(x0 - 10, Y(s) + 4, s + "%", { fs: 11, a: "end", c: "#8a8a99" });
  let dots = "";
  const last = ft.length ? ft.at(-1)[0] : 0;
  for (const [r, f] of ft) {
    const res = roundResult(run, r), R = rng(run.seed * 7 + r * 31), n = Math.floor(70 * f);
    for (let i = 0; i < n; i++) {
      const lg = R() * 1.7 - 0.35, g = res.gates * Math.pow(2, lg);
      let s = res.worst + 2.4 * lg - R() * 3.4 - (lg < 0 ? 1.5 : 0) + (r < last ? -0.6 : 0);
      s = Math.max(78.6, Math.min(97.4, s));
      const col = r === last ? "#3b82f6" : r === last - 1 ? "#93c5fd" : "#cbd5e1";
      dots += `<circle cx="${X(g).toFixed(1)}" cy="${Y(s).toFixed(1)}" r="4" fill="${col}" fill-opacity=".8"/>`;
    }
  }
  const b = st.best;
  const bestM = b ? `<circle cx="${X(b.gates)}" cy="${Y(b.worst)}" r="7" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><circle cx="${X(b.gates)}" cy="${Y(b.worst)}" r="12" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="${X(b.gates) - 70}" y="${Y(b.worst) - 46}" width="140" height="26" rx="6" fill="#1a1a2e"/>${T(X(b.gates), Y(b.worst) - 29, `Best: ${fmt(b.gates)} gates`, { fs: 11.5, w: 600, a: "middle", c: "#fff" })}` : "";
  let legend = "";
  ft.forEach(([r], i) => { const col = r === last ? "#3b82f6" : r === last - 1 ? "#93c5fd" : "#cbd5e1"; legend += `<circle cx="${x1 - (ft.length - i) * 84 + 6}" cy="${y0 - 14}" r="4.5" fill="${col}"/>` + T(x1 - (ft.length - i) * 84 + 16, y0 - 10, "Round " + r, { fs: 11 }); });
  return `<svg class="v" viewBox="0 0 960 390" role="img" aria-label="Accuracy against chip size">
    ${grid}
    <rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${Y(90) - y0}" fill="#ecfdf5" opacity=".5"/>
    <line x1="${x0}" x2="${x1}" y1="${Y(90)}" y2="${Y(90)}" stroke="#047857" stroke-width="1.5" stroke-dasharray="6 5"/>
    ${T(x0 + 8, Y(90) - 8, "Clinical line, 90%", { fs: 11.5, w: 600, c: "#047857" })}
    ${dots}${bestM}${legend}
    ${T((x0 + x1) / 2, 384, "Chip size, logic gates (log scale)", { fs: 12, a: "middle", c: "#5a5a6a" })}
    <text transform="translate(22 ${(y0 + y1) / 2}) rotate(-90)" font-size="12" fill="#5a5a6a" text-anchor="middle">Worst ${u.who}, % ${u.caught}</text>
  </svg>`;
}

function patientVals(run, res) {
  const R = rng(run.seed * 13 + res.r * 7), ord = [...Array(12).keys()];
  for (let i = 11; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }
  const v = Array(12).fill(0), fails = 12 - res.meets;
  v[ord[0]] = res.worst;
  for (let k = 1; k < fails; k++) v[ord[k]] = Math.max(res.worst + 0.1, 89.9 - R() * (89.9 - res.worst));
  for (let k = Math.max(1, fails); k < 12; k++) v[ord[k]] = Math.max(90.2, res.worst + 0.3) + R() * 6.5;
  return { v: v.map(x => Math.round(x * 10) / 10), worst: ord[0] };
}
function visPatients(run, st) {
  const u = st.u, res = st.best || { r: 0, worst: 92.6, meets: 12 };
  const { v, worst } = patientVals(run, res);
  const ok = v.filter(x => x >= 90).length;
  return `<div style="display:flex;align-items:baseline;gap:12px;margin:2px 2px 14px;flex-wrap:wrap"><span style="font-family:${SERIF};font-size:30px">${ok} of 12</span><span style="font-size:13.5px;color:#5a5a6a">unseen ${u.whoP} meet the clinical line (${u.lineShort.split(" on")[0]}).</span></div>
    <div class="ptiles">${v.map((x, i) => `<div class="pt ${x >= 90 ? "ok" : "no"}${i === worst ? " worst" : ""}"><div class="pn">${u.Who} ${i + 1}</div><div class="pv">${pct(x)}</div><div class="ps"><i></i>${x >= 90 ? "Meets the line" : "Below the line"}</div>${i === worst ? `<div class="wl">Worst ${u.who}</div>` : ""}</div>`).join("")}</div>`;
}

function visDevice(run, st) {
  const u = st.u, b = st.best, pm = 7, pw = u.patch.w * pm, ph = u.patch.h * pm, px = 50, py = 70;
  const gates = b ? b.gates : 0, logic = gates * 5.1e-6, die = 0.5, pw_uW = 0.8 + gates * 0.0023;
  const days = u.cell / (u.pOther + pw_uW * 1e-6) / 24, mcuDays = u.cell / (u.pOther + 3.4e-3) / 24;
  const chipX = px + pw * (u.key === "brain" ? 0.68 : 0.66), chipY = py + ph * (u.key === "brain" ? 0.5 : 0.68), dpx = die * pm;
  const mag = 170, mx = 470, my = 64, side = Math.sqrt(logic) / die * mag * 0.92;
  let pads = "";
  for (let i = 0; i < 8; i++) { const o = 14 + i * ((mag - 36) / 7); pads += `<rect x="${mx + o}" y="${my + 4}" width="8" height="8" fill="#d4d4dc"/><rect x="${mx + o}" y="${my + mag - 12}" width="8" height="8" fill="#d4d4dc"/><rect x="${mx + 4}" y="${my + o}" width="8" height="8" fill="#d4d4dc"/><rect x="${mx + mag - 12}" y="${my + o}" width="8" height="8" fill="#d4d4dc"/>`; }
  const fact = (y, val, label, sub) => `${T(720, y, val, { fs: 28, f: SERIF, c: "#1a1a2e" })}<rect x="${720}" y="${y + 9}" width="58" height="17" rx="8.5" fill="#fffbeb" stroke="#fde68a"/>${T(749, y + 21, "Estimate", { fs: 10, w: 600, a: "middle", c: "#92400e" })}${T(786, y + 21, label, { fs: 12, c: "#5a5a6a" })}${sub ? T(720, y + 42, sub, { fs: 11.5, c: "#8a8a99" }) : ""}`;
  const comps = u.key === "brain"
    ? `<circle cx="${px + pw * 0.3}" cy="${py + ph * 0.5}" r="${10 * pm}" fill="#fff" stroke="#b0b0be"/>${T(px + pw * 0.3, py + ph * 0.5 + 4, "Battery", { fs: 11, a: "middle", c: "#8a8a99" })}
       <rect x="${px + pw * 0.56}" y="${py + ph * 0.18}" width="${9 * pm}" height="${3 * pm}" rx="3" fill="#fff" stroke="#b0b0be"/>${T(px + pw * 0.56 + 4.5 * pm, py + ph * 0.18 - 6, "Electrode leads", { fs: 10.5, a: "middle", c: "#8a8a99" })}`
    : `<circle cx="${px + pw * 0.22}" cy="${py + ph * 0.5}" r="${6 * pm}" fill="#fff" stroke="#b0b0be"/>${T(px + pw * 0.22, py + ph * 0.5 + 4, "Coin cell", { fs: 10.5, a: "middle", c: "#8a8a99" })}
       ${[0.42, 0.9].map(f => `<circle cx="${px + pw * f}" cy="${py + ph * 0.3}" r="${0.9 * pm}" fill="#fb923c"/>`).join("")}${[0.52, 0.6, 0.7, 0.78].map(f => `<circle cx="${px + pw * f}" cy="${py + ph * 0.3}" r="${0.75 * pm}" fill="#1a1a2e"/>`).join("")}`;
  return `<svg class="v" viewBox="0 0 960 400" role="img" aria-label="Chip to scale on the device">
    ${T(px, py - 18, u.patch.name + `, ${u.patch.w} × ${u.patch.h} mm, to scale`, { fs: 12, w: 600, c: "#3a3a4a" })}
    <rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="${u.key === "brain" ? 40 : 60}" fill="#f3f3f6" stroke="#b0b0be" stroke-width="1.4"/>
    ${comps}
    ${b ? `<rect x="${chipX - dpx / 2}" y="${chipY - dpx / 2}" width="${dpx}" height="${dpx}" fill="#1a1a2e"/><circle cx="${chipX}" cy="${chipY}" r="11" fill="none" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M${chipX + 8} ${chipY - 8} L${mx} ${my + 20}" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 3"/>
      <rect x="${mx}" y="${my}" width="${mag}" height="${mag}" rx="6" fill="#fff" stroke="#1a1a2e" stroke-width="1.4"/>${pads}
      <rect x="${mx + mag / 2 - side / 2}" y="${my + mag / 2 - side / 2}" width="${side}" height="${side}" fill="#3b82f6" opacity=".75"/>
      ${T(mx + mag / 2, my + mag + 22, `The chip, magnified: ${die} × ${die} mm`, { fs: 11.5, a: "middle", c: "#5a5a6a" })}
      ${T(mx + mag / 2, my + mag + 39, "blue is the logic, grey the pads", { fs: 11, a: "middle", c: "#8a8a99" })}`
      : `${T(chipX, chipY + 4, "chip goes here", { fs: 11, a: "middle", c: "#8a8a99" })}`}
    <line x1="${px}" x2="${px + 10 * pm}" y1="${py + ph + 30}" y2="${py + ph + 30}" stroke="#3a3a4a" stroke-width="2"/>${T(px + 5 * pm, py + ph + 48, "10 mm", { fs: 11, a: "middle" })}
    ${b ? fact(96, `${logic.toFixed(4)} mm²`, "logic area", `on a ${die} × ${die} mm die; the pads set its size`) + fact(196, `${pw_uW.toFixed(1)} µW`, "chip power", "deciding every " + u.win.replace("-second", " s").replace(" window", "")) + fact(296, `${Math.round(days)} days`, "battery life", `about ${Math.round(mcuDays)} days if the reference model`) + T(720, 356, "ran on a microcontroller instead", { fs: 11.5, c: "#8a8a99" }) : T(720, 180, "Area, power and battery life", { fs: 14, c: "#8a8a99" }) + T(720, 200, "appear once round 1 is checked.", { fs: 14, c: "#8a8a99" })}
  </svg>`;
}

/* ---------------- render + tick ---------------- */
function render() {
  route = parse();
  document.title = APP.short + (route.page === "run" ? " · " + findRun(route.id).title : "");
  renderSidebar(true);
  if (route.page === "run") renderRun();
  else if (route.page === "configure") renderConfigure();
  else renderStart();
}
function tick() {
  for (const r of runs) if (r.playing && elapsed(r) >= total(r)) { r.base = total(r); r.playing = false; }
  renderSidebar(false);
  if (route.page !== "run") return;
  const run = findRun(route.id); if (!run || !$("#clk")) return;
  updTop(run, false);
  if (route.view === "chat" && $("#feed")) {
    const st = snap(run);
    const fin = st.done, ta = $("#ctext");
    if (ta && fin && ta.placeholder !== "This run has finished") ta.placeholder = "This run has finished";
    renderChat(run, false);
  } else renderView(run, false);
}
function layout() { const w = innerWidth; document.body.classList.toggle("col", w < 1024 && w >= 768); }
let lastW = innerWidth;
window.addEventListener("resize", () => { if ((lastW >= 1024) !== (innerWidth >= 1024) || (lastW >= 768) !== (innerWidth >= 768)) { layout(); renderSidebar(true); } lastW = innerWidth; });
layout(); renderMobileHead(); render();
setInterval(tick, 250);
})();
</script>
