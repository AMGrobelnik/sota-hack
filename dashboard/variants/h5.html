<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='%233D6DF0' stroke-width='7' d='M53 12.5H23A10.5 10.5 0 0 0 12.5 23V41A10.5 10.5 0 0 0 23 51.5H53'/%3E%3Crect fill='%233D6DF0' x='26' y='25' width='14' height='14' rx='1.5'/%3E%3C/svg%3E">
<style>
:root{
  --wash:#f5f6f9;--card:#fff;--glass:rgb(255 255 255 / .82);--glass-s:rgb(255 255 255 / .97);
  --ink:#131a33;--ink2:#343b55;--ink3:#4d5470;--ph:#596079;
  --line:#d5d9e3;--line2:#e6e9f0;--fill:#eff1f6;--fill2:#e2e6ee;
  --blue:#3D6DF0;--blue7:#2B56D6;--bluebg:#eaf0fe;--night:#0e1530;--night2:#17204a;
  --st-setup:#0b6b63;--st-prop:#6a3dbd;--st-tune:#2B56D6;--st-comp:#a14f06;--st-ver:#0d7550;--st-rep:#4d5470;
  --ok:#0f8a5f;--okt:#065f46;--okbg:#e6f5ee;--okr:#9fd9bf;
  --bad:#dc2626;--badt:#991b1b;--badbg:#fdeeee;--badr:#f3c0c0;
  --pub:#0b6b63;--pubbg:#e1f2ef;--pubr:#9fd3c8;
  --own:#5b2bb5;--ownbg:#efe9fb;--ownr:#cbbbef;
  --asm:#8a4300;--asmbg:#fcefdb;--asmr:#eecb94;
  --run:#2B56D6;--runbg:#e8eefd;--runr:#b9cbf8;
  --cand:#c2410c;
  --hair:rgb(0 0 0 / .07);--hair4:rgb(0 0 0 / .05);--hair8:rgb(0 0 0 / .09);
  --sh-menu:0 6px 24px rgb(16 20 40 / .12);--sh-hair:0 1px 3px rgb(0 0 0 / .05);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro","New York",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wash);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--hair);z-index:30;position:relative}
.sb-head{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hair4);flex:none}
.logo{width:28px;height:28px;display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px;display:block}
.wordmark{font-size:14px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden}
.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);flex:none}
.sq:hover{background:rgb(0 0 0 / .05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--ink2);font-size:12.5px;font-weight:500;text-align:left;white-space:nowrap}
.nav button svg.ic{width:18px;height:18px}
.nav button:hover{background:rgb(0 0 0 / .04)}
.nav button.on{background:var(--bluebg);color:var(--ink)}
.nav .count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--blue7);background:var(--bluebg);border-radius:99px;padding:1px 7px;font-style:normal}
.divider{height:1px;background:var(--hair4);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px;min-height:0}
.cap{font-size:11px;font-weight:600;color:var(--ink3);padding:10px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer}
.row:hover{background:rgb(0 0 0 / .03)}
.row.on{background:var(--bluebg);color:var(--ink)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--ink3);flex:none}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:0;box-shadow:0 0 0 2px var(--blue);border-radius:4px;padding:2px 4px;background:#fff}
.pending-bar{flex:1;height:8px;border-radius:4px;background:var(--fill2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair4);padding:8px;flex:none}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0 / .04)}
.av{width:28px;height:28px;border-radius:50%;background:#3f4a6b;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--ink);line-height:1.2}
.acct .em{font-size:11px;color:var(--ink3)}
#sb.col{width:52px}
#sb.col .wordmark,#sb.col .logo,#sb.col .nav span,#sb.col .nav .count,#sb.col .runs,#sb.col .acct .who,#sb.col .divider{display:none}
#sb.col .sb-head{justify-content:center;padding:0}
#sb.col .nav button{justify-content:center;padding:0}
#sb.col .acct button{justify-content:center;padding:6px 0}
.runs-spacer{display:none}
#sb.col .runs-spacer{display:block;flex:1}
#mh{display:none;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:8px;padding:0 10px;background:var(--glass-s);border-bottom:1px solid var(--hair);z-index:25}
#scrim{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .25);z-index:29}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#demo{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--ink3);pointer-events:none;z-index:6;background:rgb(247 247 245 / .9);padding:2px 7px;border-radius:6px}

/* Start page */
.start{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:28px 24px 72px}
.start-col{width:100%;max-width:780px}
.hero{position:relative;overflow:hidden;border-radius:22px;background:radial-gradient(90% 120% at 85% 30%,#1d2a63 0%,var(--night) 62%);color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:center;padding:26px 30px 70px 32px;box-shadow:0 18px 50px rgb(14 21 48 / .18)}
.hero .lock{display:block;height:30px;width:auto}
.hero h1{font-size:36px;line-height:1.08;font-weight:650;letter-spacing:-.028em;margin:26px 0 10px;color:#fff}
.hero p{margin:0;color:#c5cdea;font-size:15px;line-height:1.5;max-width:40ch}
.hero .die{width:300px;height:210px;display:block}
.die .tr{fill:none;stroke:#5a73c4;stroke-width:1.1}
.die .fl{fill:none;stroke:#8fb0ff;stroke-width:1.6;stroke-dasharray:3 14;animation:flow 1.6s linear infinite}
.die .fl2{animation-duration:1.2s;animation-delay:-.4s}
.die .cell{stroke:#3d5bb5;stroke-width:.8}
.die .wire{fill:none;stroke:#b9c7ef;stroke-width:.7;opacity:.85}
.start .box{position:relative;margin:-44px 20px 0;background:#fff;box-shadow:0 10px 30px rgb(14 21 48 / .12)}
.box{background:var(--glass-s);border:1px solid var(--hair8);border-radius:20px;box-shadow:var(--sh-hair);padding:18px 18px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15px;line-height:1.5;min-height:22px;max-height:280px;padding:0;display:block}
.box textarea::placeholder{color:var(--ph);opacity:1}
.box textarea:focus-visible{outline:0}
.ctl{display:flex;align-items:center;gap:8px;margin-top:14px;min-height:36px;flex-wrap:wrap}
.ctl .grow{flex:1}
.pill{height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border-radius:99px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.pill:hover{background:var(--fill)}
.pill svg.ic{width:13px;height:13px}
.pill .chev{width:12px;height:12px;opacity:.7}
.pill .pk{color:var(--ink3);font-weight:500}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);color:#4d5470;flex:none;transition:all .12s}
.send.ready{background:var(--blue7);color:#fff;box-shadow:0 1px 4px rgb(0 0 0 / .2)}
.send svg.ic{width:18px;height:18px;stroke-width:2}
.chipin{height:36px;padding:0 16px;border-radius:99px;display:inline-flex;align-items:center;gap:7px;background:var(--fill2);color:#4d5470;font-size:13.5px;font-weight:600;flex:none;transition:background .12s}
.chipin.ready{background:var(--blue7);color:#fff}
.chipin.ready:hover{background:#2347b8}
.chipin svg{width:16px;height:16px}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.file{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:8px;background:var(--ownbg);color:var(--own);font-size:12px;font-weight:500}
.file button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center}
.file button:hover{background:rgb(0 0 0 / .06)}
.file svg.ic{width:13px;height:13px}
.under{display:flex;justify-content:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--ink3)}

/* Intake */
.intake{flex:1;overflow:auto;padding:32px 20px 72px}
.ik{max-width:700px;margin:0 auto}
.ik-top{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--hair8);border-radius:14px;background:#fff;margin-bottom:26px}
.ik-top .q{flex:1;font-size:13px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ik-top .meta{font-size:12px;color:var(--ink3);margin-top:3px}
.lnk{color:var(--blue7);font-size:12.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgb(43 86 214 / .35)}
.lnk:hover{text-decoration-color:currentColor}
.ik-step{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ik-step .sname{font-size:13px;color:var(--ink2)}
.ik-step .sname b{color:var(--ink);font-weight:600}
.ik-step .dots{display:flex;gap:6px}
.ik-step .dots i{width:34px;height:4px;border-radius:2px;background:var(--fill2)}
.ik-step .dots i.on{background:var(--blue7)}
.ik-step .dots i.past{background:#9db3ee}
.ik-step .skipall{margin-left:auto}
.ik h2{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.ik .lead{font-size:15px;line-height:1.55;color:var(--ink2);margin:0 0 22px;max-width:62ch}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.answers.two{grid-template-columns:1fr 1fr}
.ans{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:#fff;min-height:86px;transition:border-color .12s,box-shadow .12s}
.ans:hover{border-color:#8f97ad;box-shadow:0 2px 10px rgb(16 20 40 / .07)}
.ans b{font-size:15px;font-weight:600}
.ans span{font-size:13px;color:var(--ink3);line-height:1.45}
.ans.primary{background:var(--blue7);border-color:var(--blue7);color:#fff}
.ans.primary span{color:#e3e9fb}
.ans.primary:hover{background:#2347b8}
.found{border:1px solid var(--pubr);background:#fff;border-radius:16px;overflow:hidden;margin-bottom:16px}
.found .fh{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--pubbg);color:var(--pub);font-size:13px;font-weight:600}
.found.none{border-color:var(--asmr)}
.found.none .fh{background:var(--asmbg);color:var(--asm)}
.ds{padding:14px 18px;border-top:1px solid var(--line2)}
.ds:first-of-type{border-top:0}
.ds .dn{font-size:16px;font-weight:600}
.ds .dw{font-size:13px;color:var(--ink2);margin-top:2px}
.ds .facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.ds .facts span b{font-weight:600;color:var(--ink)}
.ds .why{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.asm-list{display:flex;flex-direction:column;border:1px solid var(--asmr);border-radius:16px;background:#fff;overflow:hidden;margin-bottom:14px}
.asm{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line2);align-items:start}
.asm:first-child{border-top:0}
.asm .n{width:24px;height:24px;border-radius:7px;background:var(--asmbg);color:var(--asm);font-size:12px;font-weight:700;display:grid;place-items:center}
.asm .n.you{background:var(--ownbg);color:var(--own)}
.asm .at{font-size:14px;font-weight:600;line-height:1.4}
.asm .aw{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:2px}
.asm .edit{grid-column:2 / 4;display:flex;gap:8px;margin-top:6px}
.asm .edit input{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff}
.addasm{display:flex;gap:8px;margin:0 0 20px}
.addasm input{flex:1;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13px;background:#fff}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.yes{background:#0b6e4f;color:#fff}
.seg button.on.chg{background:var(--asm);color:#fff}
.ik-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.btn{height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--fill)}
.btn.dark{background:var(--blue7);border-color:var(--blue7);color:#fff}
.btn.dark:hover{background:#2347b8}
.btn.dark:disabled{background:#c9ccd5;border-color:#c9ccd5;color:#3d4255}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.blue{background:var(--blue7);border-color:var(--blue7);color:#fff}
.drop{border:1.5px dashed #8f97ad;border-radius:16px;padding:26px;text-align:center;background:#fff;margin-bottom:16px;transition:background .12s,border-color .12s}
.drop.over{background:var(--bluebg);border-color:var(--blue7)}
.drop p{margin:6px 0 14px;font-size:13px;color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.5}
.quiet{font-size:12px;color:var(--ink3);margin-top:14px}
/* attached files */
.fcard{border:1px solid var(--ownr);border-radius:16px;background:#fff;overflow:hidden;margin-bottom:14px}
.fcard .fh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ownbg);color:var(--own);font-size:13.5px;font-weight:600}
.fcard .fh .sz{font-weight:500;color:#4a2a8c;margin-left:auto;font-size:12.5px}
.fcard .fb{padding:12px 16px 14px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.readout{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5}
.readout b{font-weight:650}
.readout .ok{color:var(--okt);flex:none;margin-top:3px}
.rfacts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--ink2);margin:6px 0 0 26px}
.chans{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chans button{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}
.chans button.on{background:var(--blue7);border-color:var(--blue7);color:#fff}
.chans button.dup{border-style:dashed}
.chans button:disabled{color:#545a70;background:var(--fill);cursor:default}
.chhead{display:flex;align-items:baseline;gap:12px;margin-top:12px;flex-wrap:wrap}
.chhead b{font-size:13.5px}
/* question card */
.qcard{border:1px solid var(--line);background:#fff;border-radius:18px;padding:22px 22px 18px;box-shadow:0 2px 12px rgb(16 20 40 / .05)}
.qcard .qn{font-size:12.5px;color:var(--ink3);margin-bottom:6px;display:flex;gap:10px;align-items:center}
.qcard .qn .why{color:var(--ink3)}
.qcard h3{font-size:20px;line-height:1.3;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.qcard .qw{font-size:13px;color:var(--ink3);margin:0 0 14px;line-height:1.45}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.qchips button{min-height:34px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left}
.qchips button:hover{border-color:#8f97ad}
.qchips button.on{background:var(--blue7);border-color:var(--blue7);color:#fff}
.qfree{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:13.5px;background:#fff}
.qfoot{display:flex;align-items:center;gap:12px;margin-top:16px}
.qfoot .grow{flex:1}
.qdone{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.qdone span{font-size:12px;color:var(--ink2);background:var(--fill);border-radius:99px;padding:3px 10px}
.qdone span b{font-weight:600;color:var(--ink)}
/* the dataset search */
.slog{border:1px solid var(--line);border-radius:16px;background:#fff;padding:6px 0;margin-bottom:16px}
.srow{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;padding:9px 16px;font-size:13.5px;line-height:1.45;animation:popin .2s var(--ease)}
.srow .g{width:14px;height:14px;display:grid;place-items:center;margin-top:3px}
.srow .g svg{width:14px;height:14px}
.srow .sm{color:var(--ink3);font-size:12.5px}
.srow .ct{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.srow.drop2{padding-left:44px;grid-template-columns:1fr;color:var(--ink2);font-size:13px}
.srow.drop2 s{color:var(--ink3);text-decoration-color:#9aa1b2}
.srow.keep b{color:var(--pub)}
/* Layer */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair8);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{font-size:11px;font-weight:600;color:var(--ink3);padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--fill)}
.opt.sel{background:var(--bluebg)}
.opt:disabled{color:#6a6f80}
.opt:disabled:hover{background:none}
.opt .oh{font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.35}
.opt .ck{margin-left:auto;color:var(--blue7)}
.opt svg.ic{margin-top:1px;color:var(--ink3)}
.opt.danger{color:var(--badt)}.opt.danger svg.ic{color:var(--badt)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.field{display:flex;flex-direction:column;gap:4px;padding:6px 8px}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.field .fh{font-size:11.5px;color:var(--ink3);line-height:1.35}
select.sel{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;color:var(--ink)}
.link{color:var(--blue7);font-size:12px;font-weight:500;padding:6px 8px;text-align:left}
.modal-bg{position:fixed;inset:0;background:rgb(15 18 30 / .32);display:grid;place-items:start center;padding-top:12vh;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{width:min(540px,92vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgb(0 0 0 / .22);overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.modal .mh input{flex:1;border:0;outline:0;font-size:14px}
.modal .mb{padding:8px;max-height:50vh;overflow:auto}
.modal .mp{padding:20px 22px 8px;font-size:14px;line-height:1.55;color:var(--ink2)}
.modal .mp h3{margin:0 0 8px;font-size:18px;color:var(--ink)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#15192b;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;box-shadow:var(--sh-menu);animation:popin .15s}

/* Run page */
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:rgb(255 255 255 / .8);border-bottom:1px solid var(--hair)}
.tabs{display:flex;gap:18px;height:100%;flex:none}
.tabs button{height:100%;font-size:12.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;padding-top:2px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tabs button:hover:not(.on){color:var(--ink)}
.state{height:22px;display:inline-flex;align-items:center;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;flex:none}
.state.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}
.state.paused{background:var(--fill);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.rtitle{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 280px;color:var(--ink)}
.play{flex:1 1 auto;max-width:460px;display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.pbtn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);flex:none}
.pbtn:hover{background:var(--fill)}
.pbtn svg.ic{width:14px;height:14px}
.clock{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--ink2);flex:none}
.clock.live{background:var(--badbg);color:var(--badt)}
.track{flex:1;height:4px;border-radius:2px;background:var(--fill2);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#ef4444}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#dc2626;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.end i{background:#4f5569}.track.end b{background:#363b50}
.livep{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:var(--badbg);color:var(--badt);font-size:10px;font-weight:700;letter-spacing:.04em;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.srcbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--pubr);background:var(--pubbg);color:var(--pub);font-size:12.5px;font-weight:600;flex:none}
.srcbtn:hover{border-color:var(--pub)}
.body{flex:1;min-height:0;overflow:auto;position:relative}

/* Overview */
.ovg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;max-width:1140px;margin:0 auto;padding:26px 28px 80px;align-items:start}
.ovm{min-width:0;display:flex;flex-direction:column;gap:16px}
.ovs{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.trust{font-family:var(--serif);font-size:24px;line-height:1.38;letter-spacing:-.005em;margin:2px 0 2px;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-hair)}
.card>h3{display:flex;align-items:baseline;gap:10px;margin:0;padding:14px 18px 0;font-size:13.5px;font-weight:650;color:var(--ink)}
.card>h3 span{font-weight:500;color:var(--ink3);font-size:12.5px}
.card>h3 .r{margin-left:auto}
.cardb{padding:10px 18px 16px}
.ledger{overflow:hidden}
.lrow{width:100%;display:grid;grid-template-columns:4px 104px 1fr auto 16px;gap:0 14px;align-items:center;padding:13px 16px 13px 0;text-align:left;border-top:1px solid var(--line2)}
.ledger>h3+.lrow{margin-top:10px}
.lrow:hover{background:#fafbfd}
.lrow .mk{align-self:stretch;border-radius:0 3px 3px 0;margin:-13px 0}
.lrow .lk{font-size:13px;font-weight:600;color:var(--ink);padding-left:12px}
.lrow .lv{font-size:13.5px;line-height:1.45;color:var(--ink)}
.lrow .lv small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.lrow .ls{font-size:12px;font-weight:500;white-space:nowrap;padding:3px 9px;border-radius:99px}
.lrow .chev{color:var(--ink3)}
.lrow .when{display:block;font-size:11.5px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.ls.idle{background:var(--fill);color:var(--ink2)}
.ls.busy{background:var(--runbg);color:var(--run)}
.ls.okk{background:var(--okbg);color:var(--okt)}
.ls.asmk{background:var(--asmbg);color:var(--asm)}
.howsim{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--asm);text-decoration:underline;text-underline-offset:3px}
.alist{border-top:1px solid var(--line2);padding:12px 18px 14px 16px}
.alist .ah{display:flex;align-items:baseline;gap:10px;font-size:13px;font-weight:600;margin-bottom:8px}
.alist .ah span{font-weight:500;color:var(--ink3);font-size:12.5px}
.alist .ah button{margin-left:auto}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:6px 0;align-items:baseline;font-size:13px;line-height:1.45}
.arow .aid{font-size:11.5px;font-weight:700;color:var(--asm);background:var(--asmbg);border-radius:6px;padding:1px 6px}
.arow .aid.you{color:var(--own);background:var(--ownbg)}
.arow .atx{color:var(--ink)}
.arow .atx small{display:block;color:var(--ink3);font-size:12px}
.arow .ast{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;white-space:nowrap}
.ast.ok{background:var(--okbg);color:var(--okt)}.ast.chg{background:var(--asmbg);color:var(--asm)}.ast.un{background:var(--fill);color:var(--ink2)}
.minibar{display:block;height:3px;border-radius:2px;background:var(--fill2);margin-top:6px;overflow:hidden;max-width:320px}
.minibar i{display:block;height:100%;background:var(--run);border-radius:2px}
.nowc{padding:16px 18px 14px}
.nowline{font-size:15px;line-height:1.5;color:var(--ink);margin:0 0 10px;min-height:1.5em}
.nowline .then{color:var(--ink3)}
.prog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.prog-top b{font-weight:600;color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden;position:relative;display:flex}
.bar>u{display:block;height:100%;text-decoration:none;opacity:.22}
.bar>u.past{opacity:1}
.bar>u.cur{opacity:1;position:relative}
.bar.done>u{opacity:1}
.steps{display:grid;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.steps span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.steps span.past{color:var(--ink2)}
.steps span.cur{color:var(--ink);font-weight:600}
.legendst{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--ink2)}
.legendst i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* result: drawn to scale */
.res .cardb{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.scale svg{width:100%;height:auto;display:block}
.resr{min-width:0}
.bigx{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.bigx small{font-size:15px;font-weight:600;letter-spacing:0;color:var(--ink2);margin-left:6px}
.resr p{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.resr p b{color:var(--ink)}
.rounds{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px}
.rounds .rh{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:10px}
.rounds .rh span{font-weight:500;color:var(--ink2)}
.rrow{display:flex;align-items:flex-end;gap:6px}
.rstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.rstep .rb{width:100%;max-width:58px;height:54px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.rstep .rb i{display:block;width:100%;background:#b8c6ee;border-radius:3px 3px 0 0;transition:height .5s var(--ease)}
.rstep .rl{font-size:11.5px;color:var(--ink3)}
.rstep .rv{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rstep.fin .rb i{background:var(--blue7)}
.rstep.fin .rv{color:var(--blue7);font-weight:700}
.rstep.wait .rv{color:var(--ink3);font-weight:500;font-size:12px}
.rstep.wait .rb{border-bottom-style:dashed}
.rarr{color:var(--ink3);font-size:13px;padding-bottom:24px;flex:none}
.bestl{display:flex;align-items:baseline;gap:10px;font-size:14px;line-height:1.5;color:var(--ink);padding:0 18px 14px}
.bestl .dot{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}
.det{font-size:12.5px;color:var(--ink2);text-decoration:underline;text-decoration-color:#9aa1b2;text-underline-offset:3px;flex:none}
.det:hover{color:var(--ink)}
.details{margin:0 18px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 16px;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;animation:popin .15s}
.details div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.details div:nth-last-child(-n+2){border-bottom:0}
.details dt{color:var(--ink3)}
.details dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* funnel */
.fun .cardb{display:flex;align-items:stretch;gap:6px}
.fstep{flex:1;min-width:0;border-radius:12px;padding:10px 10px 10px 12px;background:var(--fill);position:relative}
.fstep .fv{font-size:19px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.fstep .fl{font-size:12px;line-height:1.35;color:var(--ink2);margin-top:2px}
.fstep .fb{position:absolute;left:12px;right:12px;top:0;height:3px;border-radius:0 0 3px 3px}
.fstep.wait .fv{color:var(--ink3);font-size:15px;font-weight:600}
.farr{align-self:center;color:var(--ink3);flex:none;font-size:13px}
/* side: chip tile and workflow */
.ctile{display:block;width:100%;text-align:left;padding:14px 14px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-hair)}
.ctile:hover{border-color:#8f97ad}
.ctile .cth{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.ctile .cth .r{margin-left:auto;font-weight:500;color:var(--blue7);font-size:12px}
.ctile svg.flow{width:100%;height:auto;display:block;margin:8px 0 6px}
.ctile .cv{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.ctile .cu{font-size:12.5px;color:var(--ink2);line-height:1.4}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
svg.flow .fl{stroke-dasharray:4 8;animation:flow .9s linear infinite}
svg.flow .d2{animation-delay:-.35s}svg.flow .d3{animation-duration:.7s}
svg.mchip{width:72px;height:44px;flex:none;overflow:visible}
svg.mchip path{stroke-width:2.2}
svg.mchip .fl{stroke-dasharray:4 8;animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes dieglow{50%{fill:#4a62b8}}
.wf{padding:12px 0 8px}
.card.wf>h3{margin:0 0 8px;padding:2px 14px 0;font-size:13px;font-weight:650;display:flex;gap:8px;align-items:baseline}
.wf h3 span{font-weight:500;color:var(--ink3);font-size:12px}
.wrow{display:grid;grid-template-columns:10px 1fr auto;gap:2px 10px;align-items:baseline;padding:6px 14px;font-size:12.5px;line-height:1.4}
.wrow .wd{width:9px;height:9px;border-radius:3px;transform:translateY(1px)}
.wrow .wn{color:var(--ink);font-weight:500}
.wrow .wn small{display:block;color:var(--ink3);font-weight:400;font-size:12px}
.wrow .wt{color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wrow.wait .wn{color:var(--ink3);font-weight:400}
.wrow.wait .wd{opacity:.35}
.wrow.cur{background:var(--bluebg)}
.wrow.cur .wn{font-weight:650}
.wrow.sub{padding-left:28px}
.cstat{max-width:740px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);min-height:18px;padding-left:4px}
.cstat .g{width:12px;height:12px;display:grid;place-items:center}
/* how it was simulated */
.simx{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.simx h4{margin:14px 0 4px;font-size:13px;color:var(--ink)}
.simx ul{margin:4px 0 0;padding-left:18px}
.simx li{margin:3px 0}
/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid transparent;vertical-align:1px;white-space:nowrap;cursor:pointer}
.tag:hover{border-color:currentColor}
.tag i{width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.9}
.tag.pub{background:var(--pubbg);color:var(--pub)}
.tag.own{background:var(--ownbg);color:var(--own)}
.tag.asm{background:var(--asmbg);color:var(--asm)}
.tag.run{background:var(--runbg);color:var(--run)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;overflow:auto;padding:24px 20px 12px}
.feed-in{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;animation:popin .25s var(--ease)}
.msg .who{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px}
.msg .who svg.ic{width:14px;height:14px}
.msg .mm{flex:1;min-width:0}
.msg .mn{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.msg .mn time{font-family:var(--mono);font-size:10.5px;color:var(--ink3);font-weight:400}
.msg .mt{font-size:14px;line-height:1.55;color:var(--ink);margin-top:2px}
.tool{margin-left:36px;border:1px solid var(--line);border-radius:10px;background:#fff;animation:popin .25s var(--ease);margin-top:-8px}
.tool>.th{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;flex-wrap:wrap}
.tool>.th>button.tt{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);text-align:left;min-width:200px}
.tool>.th>button.tt svg.ic{width:13px;height:13px;color:var(--ink3)}
.tool>.th .chev{transition:transform .12s}
.tool.open>.th .chev{transform:rotate(90deg)}
.tool pre{margin:0;padding:8px 12px 10px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;display:none}
.tool.open pre{display:block}
.you{align-self:flex-end;max-width:78%;background:#15192b;color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.5;animation:popin .2s}
.typing{display:flex;gap:4px;padding:6px 0 0}
.typing i{width:6px;height:6px;border-radius:50%;background:#7a8094;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:8px 20px 28px}
.composer .box{max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.composer textarea{flex:1;padding:8px 0}
.composer .box.off{background:var(--fill)}

/* Sources drawer */
#drawer{position:absolute;top:44px;right:0;bottom:0;width:440px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgb(16 20 40 / .1);z-index:20;display:flex;flex-direction:column;animation:slidein .18s var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 20px;border-bottom:1px solid var(--line2)}
.dr-h h3{margin:0;font-size:16px;flex:1}
.dr-b{flex:1;overflow:auto;padding:6px 20px 30px}
.dr-sec{padding-top:18px}
.dr-sec h4{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--ink)}
.dr-sec>p{margin:0 0 10px;font-size:12.5px;color:var(--ink3);line-height:1.45}
.src{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:box-shadow .3s,border-color .3s}
.src.hl{border-color:var(--ink);box-shadow:0 0 0 3px rgb(21 25 43 / .1)}
.src .s1{display:flex;align-items:flex-start;gap:8px}
.src .s1 b{flex:1;font-size:14px;line-height:1.35}
.src .s2{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.src dl{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;margin:8px 0 0;font-size:12.5px}
.src dt{color:var(--ink3)}
.src dd{margin:0;color:var(--ink)}
.src .use{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.src a{color:var(--blue7);word-break:break-all}
.src .live{font-size:12px;font-weight:600;color:var(--run);margin-top:6px}

/* Visual */
.vis{max-width:1180px;margin:0 auto;padding:16px 24px 40px}
.picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picker button{height:30px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:500;color:var(--ink2);border:1px solid transparent;display:inline-flex;align-items:center;gap:4px}
.picker button:hover{background:var(--fill)}
.picker button.on{background:#15192b;color:#fff}
.picker .chev{width:12px;height:12px;opacity:.8}
.vh{display:flex;align-items:flex-end;gap:16px;margin:16px 0 12px}
.vh .vht{flex:1;min-width:0}
.vh h2{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.vh p{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.5;max-width:76ch}
.stage{position:relative;height:clamp(380px,calc(100dvh - 230px),640px);border-radius:18px;overflow:hidden;background:radial-gradient(120% 95% at 50% 15%,#fbfcfd 0%,#e6e9ef 50%,#cdd3dd 100%);border:1px solid var(--line);touch-action:none}
.stage canvas{display:block;width:100%!important;height:100%!important;outline:0}
.stage.grab{cursor:grab}.stage.grab:active{cursor:grabbing}
.ov3{position:absolute;inset:0;pointer-events:none}
.ov3 svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lab{position:absolute;pointer-events:none;font-size:12.5px;color:var(--ink);background:rgb(255 255 255 / .92);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px rgb(16 20 40 / .08);white-space:nowrap;transform:translate(-50%,-100%)}
.lab b{font-weight:700}
.lab small{display:block;font-size:11.5px;color:var(--ink3)}
.lab.pinl{transform:translate(0,-50%)}
.lab.dim{opacity:.0}
.card3{position:absolute;pointer-events:auto;width:238px;background:rgb(255 255 255 / .95);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgb(16 20 40 / .08);font-size:12.5px;line-height:1.45;color:var(--ink2)}
.card3 .ct{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.card3 .cw{font-weight:600;color:var(--ink);margin-top:4px}
.card3 svg.loc{width:38px;height:38px;flex:none}
.hud{position:absolute;pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .seg{background:rgb(255 255 255 / .9);box-shadow:0 1px 4px rgb(0 0 0 / .08)}
.hint{position:absolute;font-size:12px;color:var(--ink2);background:rgb(255 255 255 / .85);padding:3px 9px;border-radius:99px;pointer-events:none}
.est{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;pointer-events:auto}
.est>div{background:rgb(255 255 255 / .95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:112px}
.est .k{font-size:11.5px;color:var(--ink3)}
.est .v{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-top:1px;color:var(--ink)}
.est .e{font-size:10.5px;font-weight:600;color:var(--asm)}
.big{position:absolute;right:20px;top:16px;text-align:right;pointer-events:none}
.big .n{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.big .u{font-size:12.5px;color:var(--ink2)}
.qbtn{height:30px;padding:0 12px;border-radius:9px;background:rgb(255 255 255 / .94);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.qbtn:hover{border-color:#8f96a8}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#15192b;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:99px;display:flex;gap:10px;align-items:center;pointer-events:auto;white-space:nowrap}
.banner button{color:#c9d7ff;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.55}
.loading3{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px}
.vpanel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:300px}
.vpanel svg.v{width:100%;height:auto;display:block;font-family:var(--sans)}
.pts{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.pt{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative}
.pt .pn{font-size:12px;color:var(--ink3)}
.pt .pv{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.pt .pm{height:4px;border-radius:2px;background:var(--fill2);position:relative}
.pt .pm i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pt .pm u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.pt .ps{font-size:12px;margin-top:8px;font-weight:500}
.pt.pass .ps{color:var(--okt)}.pt.pass .pm i{background:var(--ok)}
.pt.fail{background:var(--badbg);border-color:var(--badr)}.pt.fail .ps{color:var(--badt)}.pt.fail .pm i{background:var(--bad)}
.pt.worst{box-shadow:0 0 0 2px #b45309}
.pt .wtag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;color:var(--asm);background:var(--asmbg);border-radius:99px;padding:1px 7px}
.pt.wait{background:var(--wash);border-style:dashed}.pt.wait .pv{color:var(--ink3)}
.pnote{margin-top:12px;font-size:13px;color:var(--asm);background:var(--asmbg);border-radius:10px;padding:8px 12px}

/* Labels in a column on the right, joined by thin leader lines */
.callcol{position:absolute;right:16px;top:60px;bottom:86px;width:244px;display:flex;flex-direction:column;justify-content:center;gap:10px;pointer-events:none}
.callout{background:rgb(255 255 255 / .96);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.42;color:var(--ink2);box-shadow:0 2px 8px rgb(16 20 40 / .06);pointer-events:auto}
.callout b{display:block;color:var(--ink);font-size:13px;font-weight:650}
.callout .qbtn{margin-top:8px;height:28px;font-size:12px}
.callout .now{font-weight:600;color:var(--ink);margin-top:3px}
.callout .tagline{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px}
.callout .nbig{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.ov3 path.lead{fill:none;stroke:#4d5470;stroke-width:1.1}
.ov3 circle.leaddot{fill:#fff;stroke:#2B56D6;stroke-width:2}
/* fine-tuning captions */
.caps{position:absolute;left:16px;bottom:16px;pointer-events:auto;background:rgb(255 255 255 / .95);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px;width:min(392px,calc(100% - 220px));box-shadow:0 2px 10px rgb(16 20 40 / .06)}
.caps .ch{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3);margin-bottom:6px}
.caps .ch .qbtn{margin-left:auto;height:26px;font-size:12px}
.caps ol{margin:0;padding:0;list-style:none}
.caps li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:12.5px;line-height:1.4;color:var(--ink3);padding:3px 0;transition:color .2s}
.caps li i{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--fill);color:var(--ink2)}
.caps li.on{color:var(--ink);font-weight:600}
.caps li.on i{color:#fff}
.caps li.past{color:var(--ink2)}
/* patient timeline */
.ptl{border:1px solid var(--line);border-radius:14px;padding:12px 14px 10px;margin-bottom:14px;background:#fff}
.ptl .ph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ptl .ph b{font-size:14px}
.ptl .ph span{font-size:12.5px;color:var(--ink2)}
.ptl>svg{width:100%;height:auto;display:block;margin-top:6px}
.ptl .tally{font-size:13.5px;color:var(--ink);margin-top:2px}
.pt{cursor:pointer}
.pt.sel{outline:2px solid var(--blue7);outline-offset:1px}
/* trade-off */
.tsum{display:flex;gap:10px;align-items:flex-start;background:var(--okbg);border:1px solid var(--okr);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:12px}
.tsum b{color:var(--okt)}
/* improve this run */
.impbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--asmr);background:var(--asmbg);color:var(--asm);font-size:12.5px;font-weight:600;flex:none}
.impbtn:hover{border-color:var(--asm)}
.impbtn em{font-style:normal;background:var(--asm);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;line-height:16px}
.impbtn.has{background:#b45309;border-color:#b45309;color:#fff}
.impbtn.has:hover{background:#963f05}
.impbtn.has em{background:#fff;color:#8a4300}
.eta{font-size:12px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.eta small{font-size:11px;color:var(--asm);font-weight:600}
.imp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:box-shadow .3s}
.imp .it{font-size:14px;font-weight:600;line-height:1.4}
.imp .iw{font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.45}
.imp .qchips{margin:10px 0 6px;gap:6px}
.imp .qchips button{min-height:30px;padding:4px 11px;font-size:12.5px}
.imp .redo{font-size:12.5px;color:var(--asm);font-weight:600;margin-top:6px}
.imp.done{background:var(--wash)}
.imp .src2{font-size:11.5px;color:var(--ink3);margin-top:6px}
.imp.hl{box-shadow:0 0 0 3px rgb(43 86 214 / .25)}

/* Settings */
.cfg{display:flex;flex:1;min-height:0}
.cfg-rail{width:220px;flex:none;border-right:1px solid var(--hair);padding:20px 10px}
.cfg-rail h1{font-size:20px;font-weight:600;margin:0 10px 14px}
.cfg-rail button{width:100%;height:34px;border-radius:7px;padding:0 10px;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink2)}
.cfg-rail button:hover{background:rgb(0 0 0 / .04)}
.cfg-rail button.on{background:var(--bluebg);color:var(--ink)}
.cfg-main{flex:1;overflow:auto;padding:28px 36px 60px}
.cfg-main h2{font-size:20px;font-weight:600;margin:0 0 4px}
.cfg-main>p{color:var(--ink3);margin:0 0 22px;font-size:13.5px}
.cfg-card{max-width:620px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 20px}
.crow{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:0}
.crow .cl{flex:1}
.crow .cl b{display:block;font-size:13.5px;font-weight:600}
.crow .cl span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.sw{width:34px;height:20px;border-radius:99px;background:#9aa1b2;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .12s}
.sw[aria-checked=true]{background:var(--blue7)}
.sw[aria-checked=true]::after{transform:translateX(14px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (max-width:1279px){.rtitle{flex-basis:160px}.pts{grid-template-columns:repeat(5,1fr)}.ovg{grid-template-columns:minmax(0,1fr) 260px;gap:20px}.res .cardb{grid-template-columns:250px minmax(0,1fr)}}

  .lrow .lk{grid-column:2;padding-left:0}

  .res .cardb{grid-template-columns:1fr}.scale svg{max-width:210px;margin:0 auto}.banner{white-space:normal;max-width:calc(100% - 24px);text-align:center;font-size:12px}.ov3 .hint{display:none}
  .scale{max-width:300px}

}
/* ===== round 5: start page ===== */
.start{align-items:flex-start;padding-top:44px}
.band{position:relative;border-radius:22px;background:radial-gradient(120% 140% at 78% 40%,#1d2c63 0%,var(--night2) 38%,var(--night) 78%);color:#fff;padding:30px 34px 78px;box-shadow:0 18px 50px rgb(14 21 48 / .16)}
.band .lock{display:block;height:30px;width:auto}
.band h1{font-size:38px;line-height:1.08;font-weight:650;letter-spacing:-.028em;margin:30px 0 10px;color:#fff}
.band p{margin:0;color:#c9d1ec;font-size:15px;line-height:1.5;max-width:52ch}
.start .box.sbox{margin:-46px 22px 0;position:relative;background:#fff;box-shadow:0 10px 30px rgb(14 21 48 / .12)}
.effort{margin-top:30px}
.eh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 4px 10px}

.eopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.eopt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:13px 14px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;transition:border-color .15s,box-shadow .15s}
.eopt:hover{border-color:#8f97ad}

.eopt .en{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:650;color:var(--ink)}
.eopt .en svg.ic{color:var(--blue7)}
.eopt .el{font-size:12.5px;color:var(--ink2);line-height:1.4}
.eopt .eg{font-size:12.5px;color:var(--ink);line-height:1.4;flex:1}
.eopt .et{font-size:13px;font-weight:600;color:var(--ink);margin-top:6px;padding-top:8px;border-top:1px solid var(--line2);width:100%;font-variant-numeric:tabular-nums}
.eopt .et small{display:block;font-size:11px;font-weight:600;color:var(--asm);margin-top:1px}
.eopts.compact .eg{display:none}
.eopts.compact .eopt{padding:10px 12px}
/* ===== intake ===== */
.ik{max-width:760px;margin:0 auto}
.iks{margin-top:26px}
.iksh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.iksh h2{font-family:var(--sans);font-size:18px;font-weight:650;letter-spacing:-.01em;margin:0}
.ikn{width:26px;height:26px;border-radius:50%;background:var(--night);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.iks-n{font-size:12.5px;color:var(--ink3);margin-left:auto}
.iksh .lnk+.chipin,.iks-n+.chipin{margin-left:6px}
.iks .lead{font-size:14px;margin:0 0 14px}
.enter{animation:slidein2 .34s var(--ease) both}
@keyframes slidein2{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.done-row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.done-row .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--ink3)}
.done-row.own .dot{background:var(--own)}.done-row.pub .dot{background:var(--pub)}.done-row.asm .dot{background:var(--asm)}
.done-row .dt{flex:1;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.done-row .dt b{display:block;color:var(--ink);font-weight:600}
.qpast{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px;overflow:hidden}
.qp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:10px 16px;border-top:1px solid var(--line2);font-size:13.5px}
.qp:first-child{border-top:0}
.qpq{color:var(--ink2)}
.qpa{color:var(--ink);font-weight:600}
.qpa.sk{color:var(--ink3);font-weight:500;font-style:italic}
.qn .multi{font-size:11.5px;font-weight:600;color:var(--blue7);background:var(--bluebg);border-radius:99px;padding:1px 8px}

.slog2{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--wash);margin-bottom:12px}

.cands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.cand .cn{font-size:13px;line-height:1.4;color:var(--ink2)}
.cand .cn b{display:block;color:var(--ink);font-weight:600}
.cand .cv{font-size:12px;font-weight:600;color:var(--ink3);padding-top:2px}
.cand.fit .cv{color:var(--okt)}
.sres{margin:10px 0 4px}
.sres .srl{font-size:13.5px;color:var(--ink2);margin:0 0 10px}
.sres .srl b{color:var(--ink)}
.simg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:6px}
.simg>div{background:var(--wash);border-radius:12px;padding:12px 14px}
.simg b{font-size:13px}
.simg p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.rmf{margin-left:8px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--own)}

.eegfig{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:start;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.eegtx b{font-size:13.5px}
.eegtx p{margin:4px 0 8px;font-size:13px;line-height:1.5;color:var(--ink2)}
.mtr{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font-size:11.5px;font-weight:600;color:var(--ink2)}

  M.marks.forEach(m => { if (!chip && m.main) return; const x = xs(m.at); svg += `<text x="${m.main ? x + 6 : x + (m.at === M.on ? -6 : 6)}" y="${m.row ? 34 : 18}" text-anchor="${m.main ? "start" : m.at === M.on ? "end" : "start"}" font-size="12.5" font-weight="${m.main ? 700 : 500}" fill="${m.c}">${esc(m.l)}${m.sub ? ` <tspan font-weight="400">${esc(m.sub)}</tspan>` : ""}</text>`; });
  M.rows.forEach(R => {
    if (R.chip && !chip) { rowsY.push(null); return; }
    const y0 = y, h = R.h, yv = v => y0 + h - (clamp(v, R.lo, R.hi) - R.lo) / (R.hi - R.lo) * h;
    let d = ""; const N = M.eeg ? 1400 : 700;
    for (let i = 0; i <= N; i++) { const s = i / N * M.W; d += (i ? "L" : "M") + xs(s).toFixed(1) + " " + yv(R.f(s)).toFixed(1); }
    svg += `<rect x="${X0}" y="${y0}" width="${X1 - X0}" height="${h}" fill="${R.faint ? "#fafbfc" : "#f6f7fa"}"/>`;
    if (R.chip || R.line != null) { const lv = R.chip ? M.thr : R.line; svg += `<path d="M${X0} ${yv(lv)}H${X1}" stroke="${R.chip ? "#0d7550" : "#b91c1c"}" stroke-dasharray="5 4" stroke-width="1.2"/><text x="${X1 - 4}" y="${yv(lv) - 5}" text-anchor="end" font-size="11" font-weight="600" fill="${R.chip ? "#065f46" : "#991b1b"}">${R.chip ? "Line: 0.5" : "Alarm line, 55%"}</text>`; }
    svg += `<path d="${d}" fill="none" stroke="${R.col}" stroke-width="${R.faint ? 1 : 1.35}" stroke-linejoin="round" opacity="${R.faint ? 0.75 : 1}"/>`;
    svg += `<text x="${X0 - 14}" y="${y0 + h / 2 - 2}" text-anchor="end" font-size="13" font-weight="600" fill="${R.faint ? "#596079" : "#131a33"}">${esc(R.name)}</text><text x="${X0 - 14}" y="${y0 + h / 2 + 14}" text-anchor="end" font-size="11.5" fill="#4d5470">${esc(R.sub)}</text>`;
    rowsY.push([y0, h]); y += h + gap;
  });
  /* the chip's answers, one block per window */
  const ay = y, ah = 30;
  if (chip) {
    const off = M.flag % M.step;
    for (let s = off - M.step; s < M.W; s += M.step) { const a = Math.max(0, s), e = Math.min(M.W, s + M.step); if (e - a < 0.3) continue; const yes = M.answer(Math.max(0, s)); svg += `<rect x="${(xs(a) + 0.6).toFixed(1)}" y="${ay}" width="${(xs(e) - xs(a) - 1.2).toFixed(1)}" height="${ah}" rx="2" fill="${yes ? "#c2410c" : "#e1e5ee"}"/>`; }
    svg += `<text x="${X0 - 14}" y="${ay + 13}" text-anchor="end" font-size="13" font-weight="600" fill="#131a33">Chip's answer</text><text x="${X0 - 14}" y="${ay + 28}" text-anchor="end" font-size="11.5" fill="#4d5470">a new one every ${M.step} s</text>`;
  } else svg += `<text x="${X0}" y="${ay + 20}" font-size="13" fill="#4d5470">The chip's score and answers appear here once the first chip is built, after round 1.</text>`;
  y = ay + ah + gap;
  const ty = y, th = 22;
  svg += `<rect x="${xs(M.truth[0])}" y="${ty}" width="${xs(M.truth[1]) - xs(M.truth[0])}" height="${th}" rx="3" fill="#fde2d2" stroke="#e8a785"/><text x="${xs(M.truth[0]) + 8}" y="${ty + 15}" font-size="11.5" font-weight="600" fill="#8a2c0d">${M.eeg ? "Seizure" : "Below 55%"}</text>`;
  svg += `<text x="${X0 - 14}" y="${ty + 15}" text-anchor="end" font-size="13" font-weight="600" fill="#131a33">${esc(M.truthName)}</text>`;
  y = ty + th + 8;
  M.ticks.forEach(s => { svg += `<path d="M${xs(s)} ${y}v5" stroke="#9aa1b2"/><text x="${xs(s)}" y="${y + 19}" text-anchor="middle" font-size="11" fill="#4d5470">${M.tlab(s)}</text>`; });
  const VH = y + 26;
  /* a slow playhead, fading at each end so it never jumps */
  svg += `<g class="ph" pointer-events="none"><path d="M${X0} ${top - 4}V${ty + th}" stroke="#131a33" stroke-width="1" opacity=".35"><animateTransform attributeName="transform" type="translate" from="0 0" to="${X1 - X0} 0" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.35;.35;0" keyTimes="0;.06;.94;1" dur="16s" repeatCount="indefinite"/></path></g>`;
  svg += `<path id="sguide" d="M0 ${top - 4}V${ty + th}" stroke="#131a33" stroke-width="1" opacity="0" pointer-events="none"/><rect id="shit" x="${X0}" y="${top - 4}" width="${X1 - X0}" height="${ty + th - top + 4}" fill="transparent"/>`;
  const S = b ? stats(r, b) : null;
  const ann = M.eeg ? {
    what: `A rhythm of sharp waves grows on both temple pairs at once, at about three a second. Muscle and eye noise is uneven and rarely on both sides together.`,
    when: chip ? `${M.warn} seconds after the seizure starts electrically, ${15 - M.warn} seconds before it is plain to see on the trace. Across the unseen ${U.people}, ${S.warn} seconds on average.` : `After round 1, when the first chip exists.`,
    why: `In the first seconds the rhythm is smaller than the noise around it on any one trace. The chip weighs both sides together every 2 seconds; a person reading by eye needs it to stand clear, and nobody watches a home recording live.` }
    : {
    what: `The far detector's light fell while the near one stayed flat: the change is in the brain, not the skin. Brain oxygen was still about ${Math.round(sigModel(r, b).rows[2].f(M.flag))}%.`,
    when: chip ? `${M.warn} seconds before brain oxygen crosses the 55% alarm line. Across the unseen ${U.people}, ${S.warn} seconds early on average.` : `After round 1, when the first chip exists.`,
    why: `At ${Math.round(sigModel(r, b).rows[2].f(M.flag))}% the reading is still well above the line, so a bedside monitor stays quiet. The chip reads the slope on both detectors, not the level.` };
  vp.className = "vpanel sigp";
  vp.innerHTML = `<div class="sigwrap"><svg class="sigsvg" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="${M.eeg ? "One seizure" : "One oxygen drop"}: sensor traces, the chip's score and its answers">${svg}</svg><div class="stip" id="stip" role="status"></div></div>
    <div class="sann"><div><h4><span class="sdot"></span>What changed</h4><p>${esc(ann.what)}</p></div><div class="main"><h4><span class="sdot b"></span>${M.eeg ? "When the chip flagged it" : "When the chip warned"}</h4><p>${esc(ann.when)}</p></div><div><h4><span class="sdot"></span>Why a person would not have seen it yet</h4><p>${esc(ann.why)}</p></div></div>
    <p class="note" style="margin-top:10px">${r.data.mode === "sim" ? `A simulated ${U.person}` : `A held-out ${U.person}`}, drawn from the run's ${r.data.mode === "sim" ? "simulated recordings" : "check set"}; the timings are this run's own. ${b ? `Chip from round ${b.k + 1}.` : ""}</p>`;
  const sv = $(".sigsvg", vp), tip = $("#stip", vp), guide = $("#sguide", vp), hit = $("#shit", vp);
  const fmtT = s => M.eeg ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  hit.addEventListener("pointermove", e => {
    const pt = sv.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(sv.getScreenCTM().inverse());
    const s = clamp((p.x - X0) / (X1 - X0) * M.W, 0, M.W);
    let html = "";
    M.rows.forEach((R, i) => { const ry = rowsY[i]; if (!ry || p.y < ry[0] - gap / 2 || p.y > ry[0] + ry[1] + gap / 2) return; html = `<b>${esc(R.name)}: ${esc(R.sub)}</b><span>${esc(R.what)}</span><em>At ${fmtT(s)}: ${esc(R.val(R.f(s)))}</em>`; });
    if (!html && chip && p.y >= ay - gap / 2 && p.y <= ay + ah + gap / 2) { const off = M.flag % M.step, yes = M.answer(Math.max(0, Math.floor((s - off) / M.step) * M.step + off)); html = `<b>Chip's answer</b><span>What the chip puts out, one answer every ${M.step} seconds.</span><em>At ${fmtT(s)}: ${yes ? M.yes : M.no}</em>`; }
    if (!html && p.y >= ty - gap / 2) html = `<b>${esc(M.truthName)}</b><span>${esc(M.truthWhat)}</span><em>At ${fmtT(s)}: ${s >= M.truth[0] ? (M.eeg ? "seizure" : "below the line") : (M.eeg ? "no seizure" : "above the line")}</em>`;
    if (!html) { tip.classList.remove("on"); guide.setAttribute("opacity", "0"); return; }
    tip.innerHTML = html; tip.classList.add("on");
    guide.setAttribute("d", `M${p.x} ${top - 4}V${ty + th}`); guide.setAttribute("opacity", ".55");
    const wr = vp.querySelector(".sigwrap").getBoundingClientRect(), lx = e.clientX - wr.left, ly = e.clientY - wr.top, tw = tip.offsetWidth;
    tip.style.left = (lx + 16 + tw > wr.width ? lx - 16 - tw : lx + 16) + "px"; tip.style.top = Math.max(4, ly - 20) + "px";
  });
  hit.addEventListener("pointerleave", () => { tip.classList.remove("on"); guide.setAttribute("opacity", "0"); });
}

/* ================= Settings ================= */
function sel(name, opts, val) { return `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`; }
const CFG_TABS = [["line", "Clinical line"], ["chip", "Chip limits"], ["compute", "Machine"], ["scientists", "Scientists"], ["models", "Models"]];
function renderSettings(V) {
  const tab = CFG_TABS.find(t => t[0] === route.tab) ? route.tab : "line";
  const body = {
    line: ["Clinical line", "What a chip must reach before it counts. Applies to new runs.", [
      ["Events caught", "Share of seizures or oxygen drops each held-out person's chip must catch.", sel("line", [["85", "85%"], ["90", "90%"], ["95", "95%"]], defaults.line)],
      ["False alarms allowed", "Per day, for both kinds of device.", sel("fa", [["1", "Fewer than 1"], ["2", "Fewer than 2"], ["4", "Fewer than 4"]], defaults.fa)]]],
    chip: ["Chip limits", "The box the scientists must design inside.", [
      ["Largest chip allowed", "Candidates above this are dropped before building.", sel("maxGates", [["1000", "1,000 gates"], ["5000", "5,000 gates"], ["20000", "20,000 gates"], ["0", "No limit"]], defaults.maxGates)],
      ["Bits per weight", "Fewer bits make smaller chips but can cost accuracy.", sel("bits", [["2", "2 bits"], ["4", "4 bits"], ["8", "8 bits"]], defaults.bits)]]],
    compute: ["Machine", "How many candidate models are fine-tuned at once.", [
      ["Default machine", "Used for new runs unless you pick another on the start page.", sel("machine", Object.entries(MACHINES).filter(([, m]) => !m.off).map(([k, m]) => [k, m.label]), defaults.machine)],
      ["Spend limit per run", "The run wraps up and reports when it reaches this.", sel("spendCap", [["10", "$10"], ["25", "$25"], ["100", "$100"]], defaults.spendCap)]]],
    scientists: ["Scientists", "The AI scientists that work on each run.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, s.role, `<button class="sw" role="switch" aria-checked="${defaults.scientists[k]}" data-sci="${k}" aria-label="${s.name}"></button>`])],
    models: ["Models", "Which model each scientist thinks with.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, k === "lead" || k === "check" ? "Needs careful reasoning." : "Runs often; a fast model is enough.", `<select class="sel" data-model="${k}">${["Large reasoning model", "Balanced model", "Fast model"].map(m => `<option ${defaults.models[k] === m ? "selected" : ""}>${m}</option>`).join("")}</select>`])],
  }[tab];
  V.innerHTML = `<div class="cfg"><nav class="cfg-rail"><h1>Settings</h1>${CFG_TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</nav>
    <div class="cfg-main"><h2>${body[0]}</h2><p>${body[1]}</p><div class="cfg-card">${body[2].map(([a, b, c]) => `<div class="crow"><div class="cl"><b>${a}</b><span>${b}</span></div>${c}</div>`).join("")}</div></div></div>`;
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/settings/" + b.dataset.t));
  V.onchange = e => { const s = e.target; if (s.name) { defaults[s.name] = s.value; toast("Saved. New runs will use this."); } if (s.dataset.model) { defaults.models[s.dataset.model] = s.value; toast("Saved. New runs will use this."); } };
  V.onclick = e => { const sw = e.target.closest("[data-sci]"); if (sw) { const k = sw.dataset.sci; if (k === "lead") { toast("The lead scientist is always on."); return; } defaults.scientists[k] = !defaults.scientists[k]; sw.setAttribute("aria-checked", defaults.scientists[k]); } };
}

/* ================= Render loop ================= */
let lastRunId = null;
function render() {
  closePop(); closeModal();
  route = parse();
  const viewKey = route.page === "run" ? route.id + "/" + route.view : null;
  if (viewKey !== lastRunId) closeDrawerSrc();
  lastRunId = viewKey;
  const V = $("#view"); V.onchange = null; V.onclick = null; V.oninput = null;
  if (route.page === "new") { curRun = null; renderStart(V); }
  else if (route.page === "settings") { curRun = null; renderSettings(V); }
  else renderRun(V);
  refreshSidebar();
}
let titled = {};
function tick() {
  refreshSidebar();
  const r = curRun; if (!r || route.page !== "run") return;
  if (r.titleAt && now() >= r.titleAt && !titled[r.id]) { titled[r.id] = 1; renderTopbarOnly(); }
  updTopbar(); updTile();
  if (route.view === "overview") updOverview(false);
  if (route.view === "chat") updChat(false);
  if (route.view === "visual") updVisual(false);
  if (drawerOn) { const t = elapsed(r), sg = drawerKind === "imp" ? "imp" + impItems(r).map(x => x.key + (x.done ? 1 : 0)).join() + redoText(r) : "src" + [0, 1].map(i => dsStatus(r, t, i).join()).join() + papersRead(r, t) + (t >= 12 && t < 20); if (sg !== drawerSig && !(drawerKind === "imp" && $("#drawer [data-impval]"))) { const sc = $(".dr-b"); const top = sc ? sc.scrollTop : 0; renderDrawer(); const sc2 = $(".dr-b"); if (sc2) sc2.scrollTop = top; } }
}
render();
setInterval(tick, 500);
</script>
</body>
