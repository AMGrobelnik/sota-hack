<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI scientist</title>
<style>
:root{
  --wash:#fafaf9;--card:#fff;--glass:rgb(255 253 250/.72);--glass-strong:rgb(255 253 250/.96);
  --i900:#1a1a2e;--i800:#3a3a4a;--i700:#4a4a5a;--i600:#5a5a6a;--i550:#666676;--i500:#6c6c85;--i400:#8a8a99;--i300:#b0b0be;--i200:#d4d4dc;--i150:#e8e8ec;--i100:#f3f3f6;
  --blue:#3b82f6;--blue6:#2563eb;--blue7:#1d4ed8;--violet:#7c3aed;--teal:#0d9488;
  --ok:#10b981;--ok-t:#047857;--ok-bg:#ecfdf5;--bad:#ef4444;--bad-t:#b91c1c;--bad-bg:#fef2f2;--amb-t:#92400e;--amb-bg:#fffbeb;
  --hair:rgb(0 0 0/.06);--hair2:rgb(0 0 0/.08);
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Source Serif 4","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--wash);color:var(--i900);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid rgb(59 130 246/.22);border-top-color:var(--blue);animation:rot .9s linear infinite;flex:none;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

#app{display:flex;height:100vh;height:100dvh}
/* ---------- sidebar ---------- */
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid rgb(0 0 0/.05);transition:width .15s var(--ease);z-index:20;overflow:hidden}
.sb-head{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgb(0 0 0/.04)}
.logo{width:28px;height:28px;border-radius:7px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#60a5fa,#6366f1 60%,#8b5cf6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.25)}
.logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.word{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
.iconbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .1s}
.iconbtn:hover{background:rgb(0 0 0/.05)}
.sb-head .iconbtn{margin-left:auto}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav a{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--i500);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .1s}
.nav a svg{width:18px;height:18px}
.nav a:hover{background:rgb(0 0 0/.03)}
.nav a.on{background:rgb(37 99 235/.06);color:var(--i900)}
.cnt{margin-left:auto;font-size:10px;font-weight:600;color:var(--blue6);background:rgb(37 99 235/.07);border-radius:99px;padding:1px 7px}
.sb-div{height:1px;background:rgb(0 0 0/.05);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:10px 8px}
.cap{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550);padding:4px 10px 6px;display:flex;align-items:center;white-space:nowrap}
.row{position:relative;height:28px;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--i700);text-decoration:none;white-space:nowrap;transition:background .1s}
.row:hover{background:rgb(0 0 0/.025)}
.row.on{background:rgb(37 99 235/.06);color:var(--i900)}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550);background:var(--glass-strong)}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row .more:hover{background:var(--i100)}
.tbar{height:9px;border-radius:4px;background:var(--i150);flex:1;animation:pulse 1.2s infinite}
.row input{flex:1;min-width:0;border:0;border-radius:4px;padding:2px 4px;box-shadow:0 0 0 2px rgb(59 130 246/.5);font-size:12.5px;background:#fff}
.acct{flex:none;border-top:1px solid rgb(0 0 0/.05);padding:8px}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0/.03)}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.av svg{width:15px;height:15px}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2;white-space:nowrap}
.acct .em{font-size:10px;color:var(--i550);white-space:nowrap}
body.col #sb{width:52px}
body.col #sb .word,body.col #sb .nav a span,body.col #sb .cnt,body.col #sb .runs,body.col #sb .acct .who,body.col #sb .sb-div{display:none}
body.col #sb .sb-head{padding:0 12px;justify-content:center}
body.col #sb .sb-head .logo{display:none}
body.col #sb .sb-head .iconbtn{margin:0}
body.col #sb .nav a{justify-content:center;padding:0}
body.col #sb .acct{margin-top:auto}
body.col #sb .acct button{justify-content:center}
#mhead{display:none}
#scrim{display:none}

/* ---------- main ---------- */
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.demo{position:fixed;right:14px;bottom:10px;font-size:10.5px;color:var(--i400);pointer-events:none;z-index:5}

/* start page */
.start{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 64px}
.start-col{width:100%;max-width:672px}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:500;text-align:center;margin:0;letter-spacing:-.01em}
.sub{text-align:center;color:var(--i550);font-size:16px;margin:12px 0 32px}
.box{background:var(--glass-strong);border:1px solid var(--hair);border-radius:24px;box-shadow:0 1px 3px rgb(0 0 0/.04);padding:20px 20px 12px;transition:box-shadow .12s}
.box:focus-within{box-shadow:0 2px 14px rgb(0 0 0/.07)}
.box textarea{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;font-size:14px;line-height:1.5;min-height:24px;max-height:280px;padding:0}
.box textarea::placeholder{color:var(--i500)}
.box textarea:focus-visible{outline:none}
.ctl{display:flex;align-items:center;gap:6px;margin-top:12px;min-height:36px;flex-wrap:wrap}
.pill{height:24px;border-radius:99px;border:1px solid var(--hair2);background:#fff;display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-size:11.5px;font-weight:500;color:var(--i800);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--i100)}
.pill svg{width:13px;height:13px}
.pill .chev{width:12px;height:12px;opacity:.5}
.pill.ic{width:24px;padding:0;justify-content:center}
.send{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i300);transition:all .12s;flex:none}
.send.ready{background:#fff;color:var(--i900);box-shadow:0 1px 6px rgb(0 0 0/.14)}
.send.ready:hover{box-shadow:0 2px 10px rgb(0 0 0/.18)}
.send svg{width:17px;height:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{height:36px;border-radius:99px;border:1px solid var(--hair2);background:#fff;padding:0 14px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--i800);transition:background .1s}
.chip:hover{background:var(--i100)}
.chip svg{width:14px;height:14px;color:var(--i550)}

/* topbar */
.top{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);background:rgb(255 255 255/.7)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tabs a{height:100%;display:flex;align-items:center;font-size:11.5px;font-weight:500;color:var(--i550);text-decoration:none;border-bottom:2px solid transparent;padding-top:2px}
.tabs a:hover{color:var(--i900)}
.tabs a.on{color:var(--blue6);font-weight:600;border-bottom-color:var(--blue6)}
.state{height:20px;border-radius:99px;padding:0 9px;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;flex:none}
.state.done{background:var(--ok-bg);color:var(--ok-t);box-shadow:inset 0 0 0 1px #a7f3d0}
.state.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;max-width:300px;flex:0 1 auto}
.play{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;min-width:0}
.pp{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.pp:hover{background:rgb(0 0 0/.05)}
.pp svg{width:13px;height:13px;fill:currentColor;stroke:none}
.clock{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--i100);color:var(--i700);flex:none}
.clock.live{background:rgb(239 68 68/.08);color:var(--bad-t)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#fca5a5,#ef4444)}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#ef4444;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.rest i{background:linear-gradient(90deg,#a5b4fc,#7c6cf0)}
.track.rest b{background:#7c6cf0}
.live{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--bad-t);background:rgb(239 68 68/.1);border-radius:99px;padding:2px 7px;flex:none}
.live i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
.tright{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--i600);height:24px;padding:0 8px;border-radius:6px}
.mchip:hover{background:rgb(0 0 0/.04)}
.mchip svg{width:14px;height:14px}

.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* overview: one number */
.ov{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 72px;text-align:center}
.kick{font-size:13px;color:var(--i550);height:20px;display:flex;align-items:center;gap:8px}
.newbest{color:var(--ok-t);font-weight:500;animation:fadein .4s}
.hero{display:flex;align-items:baseline;justify-content:center;gap:14px;margin:6px 0 4px}
.num{font-family:var(--serif);font-size:clamp(76px,11vw,152px);line-height:1;font-weight:500;letter-spacing:-.035em;font-variant-numeric:lining-nums tabular-nums;color:var(--i900)}
.num.none{font-size:clamp(44px,6vw,72px);color:var(--i400);letter-spacing:-.02em}
.unit{font-family:var(--serif);font-size:22px;color:var(--i550)}
.verdict{font-size:17px;line-height:1.45;color:var(--i800);max-width:560px;margin:10px 0 0}
.verdict .mk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.mk.ok{background:var(--ok)}.mk.no{background:#f59e0b}
.stages{position:relative;display:grid;grid-template-columns:repeat(7,1fr);width:min(620px,100%);margin:52px 0 0;row-gap:6px}
.stages:before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:5px;height:1px;background:var(--i200)}
.stages .fill{position:absolute;left:calc(100%/14);top:5px;height:1px;background:var(--blue);transition:width .6s var(--ease)}
.st{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;font-size:11px;color:var(--i400)}
.st i{width:11px;height:11px;border-radius:50%;background:var(--wash);border:1.5px solid var(--i200);position:relative;z-index:1}
.st.done i{background:var(--blue);border-color:var(--blue)}
.st.done{color:var(--i600)}
.st.now{color:var(--i900);font-weight:600}
.st.now i{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgb(59 130 246/.15)}
.st.now i:after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--blue);animation:blink 1.3s infinite}
.loop{grid-column:3/7;grid-row:2;border:1px solid var(--i200);border-top:0;height:9px;border-radius:0 0 6px 6px;margin:0 12%;position:relative}
.loop span{position:absolute;left:50%;top:4px;transform:translateX(-50%);background:var(--wash);padding:0 8px;font-size:11px;color:var(--i550);white-space:nowrap}
.nowline{margin-top:44px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:13.5px;color:var(--i700);max-width:780px;text-align:left}
.nowline .spin{width:13px;height:13px}
.nowline svg{width:15px;height:15px;color:var(--ok)}
.link{font-size:12.5px;color:var(--blue6);font-weight:500;border-radius:4px}
.link:hover{text-decoration:underline}
.more-row{margin-top:14px;display:flex;gap:18px;justify-content:center}

/* chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;overflow:auto;padding:24px 20px 8px}
.feedin{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:10px;padding:8px 0}
.anim{animation:fadein .35s}
.msg .tile{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:#f5f3ff;color:var(--violet);margin-top:1px}
.msg .tile svg{width:13px;height:13px}
.msg .who{font-size:11px;font-weight:600;color:var(--violet);margin-bottom:2px}
.msg .txt{font-size:13.5px;line-height:1.55;color:var(--i800);max-width:640px}
.tool{margin-left:34px;border-radius:8px}
.tool>button{width:100%;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--i600);text-align:left}
.tool>button:hover{background:rgb(0 0 0/.03)}
.tool .tg{width:14px;height:14px;display:grid;place-items:center;flex:none}
.tool .tg svg{width:13px;height:13px;color:var(--i400)}
.tool .chv{margin-left:auto;width:13px;height:13px;color:var(--i400);transition:transform .12s}
.tool.open .chv{transform:rotate(90deg)}
.tool pre{margin:2px 8px 8px 30px;padding:10px 12px;background:#fff;border:1px solid var(--hair);border-radius:8px;font:11.5px/1.6 var(--mono);color:var(--i700);white-space:pre-wrap}
.me{align-self:flex-end;max-width:520px;background:rgb(13 148 136/.08);color:#0f4f4a;border:1px solid rgb(13 148 136/.18);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.typing{font-size:12px;color:var(--i500);padding:6px 0 6px 34px;display:flex;gap:6px;align-items:center}
.typing i{width:4px;height:4px;border-radius:50%;background:var(--i400);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.cwrap{flex:none;padding:8px 20px 28px}
.cbox{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.cbox textarea{flex:1;align-self:center}
.cbox .send{margin-left:0}
.cbox.off{opacity:.7}

/* visual */
.vis{flex:1;overflow:auto;padding:18px 24px 48px}
.visin{max-width:1040px;margin:0 auto}
.picker{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px}
.picker button{height:28px;border-radius:99px;padding:0 12px;font-size:12.5px;color:var(--i600);display:inline-flex;align-items:center;gap:4px}
.picker button:hover{background:rgb(0 0 0/.04)}
.picker button.on{background:var(--i900);color:#fff}
.picker button svg{width:12px;height:12px}
.vh{font-family:var(--serif);font-size:26px;font-weight:500;margin:0;letter-spacing:-.01em}
.vs{color:var(--i550);font-size:14px;margin:4px 0 16px;max-width:680px}
.panel{background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:0 1px 3px rgb(0 0 0/.04);padding:18px;position:relative}
.panel svg.fig{display:block;width:100%;height:auto}
.foot{font-size:12.5px;color:var(--i600);margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:8px;border-radius:2px;display:inline-block}
canvas.sig{display:block;width:100%;height:360px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pt{border:1px solid var(--hair);border-radius:10px;padding:12px 14px;background:#fff}
.pt.worst{box-shadow:0 0 0 2px #fca5a5;border-color:transparent}
.pt.worst.okw{box-shadow:0 0 0 2px #fcd34d}
.pt .pn{font-size:11.5px;color:var(--i550);display:flex;justify-content:space-between}
.pt .pv{font-family:var(--serif);font-size:30px;line-height:1.15;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.pt .bar{height:4px;border-radius:2px;background:var(--i100);position:relative}
.pt .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pt .bar b{position:absolute;top:-3px;width:1.5px;height:10px;background:var(--i900)}
.pt .ps{font-size:11.5px;margin-top:7px}
.ps.ok{color:var(--ok-t)}.ps.no{color:var(--bad-t)}
.stats{display:flex;flex-direction:column;gap:22px}
.stat .l{font-size:12.5px;color:var(--i550)}
.stat .v{font-family:var(--serif);font-size:30px;line-height:1.2}
.stat .e{font-size:11.5px;color:var(--i400)}
.dev{display:grid;grid-template-columns:1fr 220px;gap:28px;align-items:center}
.empty{padding:48px 20px;text-align:center;color:var(--i550);font-size:14px}

/* configure */
.cfg{flex:1;overflow:auto;padding:40px 24px}
.cfgin{max-width:820px;margin:0 auto;display:grid;grid-template-columns:180px 1fr;gap:32px;align-items:start}
.cfg h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:0 0 24px;grid-column:1/-1}
.subrail{display:flex;flex-direction:column;gap:2px}
.subrail .cap{padding-left:10px}
.subrail button{height:32px;border-radius:7px;text-align:left;padding:0 10px;font-size:12.5px;color:var(--i600)}
.subrail button:hover{background:rgb(0 0 0/.03)}
.subrail button.on{background:rgb(37 99 235/.06);color:var(--i900);font-weight:500}
.seg{display:inline-flex;background:var(--i100);border-radius:8px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:6px;font-size:12px;color:var(--i600)}
.seg button.on{background:var(--blue6);color:#fff}
.field{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--hair)}
.field:last-child{border-bottom:0}
.field .fl{font-size:13px;font-weight:500}
.field .fh{font-size:12px;color:var(--i550);margin-top:2px}
.field select,.field input{height:30px;border:1px solid var(--i150);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;min-width:150px}
.sw{width:34px;height:20px;border-radius:99px;background:var(--blue6);position:relative;flex:none}
.sw:after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.sw.offsw{background:var(--i200)}
.sw.offsw:after{right:auto;left:2px}

/* popovers, menus, drawers */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair2);border-radius:12px;box-shadow:0 4px 20px rgb(0 0 0/.1);padding:6px;min-width:176px;animation:fadein .12s}
.pop .cap{padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:7px;text-align:left;font-size:12.5px;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.on{background:rgb(37 99 235/.1)}
.opt svg{width:15px;height:15px;margin-top:1px;color:var(--i550)}
.opt .oh{display:block;font-size:11px;color:var(--i550);margin-top:1px}
.opt .ck{margin-left:auto;color:var(--blue6)}
.opt.dis{opacity:.45;cursor:not-allowed}
.sep{height:1px;background:var(--hair);margin:4px 6px}
.adv{width:300px;padding:14px}
.adv h4{margin:0 0 4px;font-size:13px}
.adv .field{padding:10px 0}
.adv .field select,.adv .field input{min-width:112px;height:28px}
.scrim{position:fixed;inset:0;background:rgb(26 26 46/.18);animation:fadein .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:#fff;border-left:1px solid var(--hair);box-shadow:-8px 0 30px rgb(0 0 0/.08);padding:20px 22px;overflow:auto;animation:slide .18s var(--ease)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px}
.drawer .dsub{color:var(--i550);font-size:12.5px;margin:0 0 16px}
.drawer .x{position:absolute;right:14px;top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.kv span:first-child{color:var(--i550)}
.kv span:last-child{text-align:right;font-weight:500}
.dh{font-size:13px;font-weight:600;margin:22px 0 6px}
.rr{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12.5px;align-items:center}
.rr .g2{font-variant-numeric:tabular-nums;font-weight:500}
.modal{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(520px,92vw);background:#fff;border-radius:14px;box-shadow:0 12px 48px rgb(0 0 0/.18);overflow:hidden;animation:fadein .15s}
.modal input{width:100%;border:0;border-bottom:1px solid var(--hair);padding:16px 18px;font-size:15px;outline:none}
.modal .list{max-height:320px;overflow:auto;padding:6px}
.modal .pad{padding:20px 22px}
.modal h3{margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:99px;animation:fadein .15s}

/* responsive */
@media (max-width:1279px){.mchip span{display:none}.rtitle{max-width:200px}.play{min-width:190px}}
@media (max-width:1023px){.rtitle{max-width:160px}}
@media (max-width:767px){
  #app{flex-direction:column}
  #sb{position:fixed;left:0;top:0;bottom:0;width:252px!important;transform:translateX(-102%);transition:transform .18s var(--ease);background:var(--glass-strong)}
  body.drawer-open #sb{transform:none;box-shadow:4px 0 30px rgb(0 0 0/.12)}
  body.col #sb .word,body.col #sb .nav a span,body.col #sb .cnt,body.col #sb .runs,body.col #sb .acct .who,body.col #sb .sb-div,body.col #sb .sb-head .logo{display:revert}
  body.col #sb .runs{display:block}
  body.col #sb .nav a{justify-content:flex-start;padding:0 10px}
  body.col #sb .sb-head{justify-content:flex-start}
  body.col #sb .sb-head .iconbtn{margin-left:auto}
  body.drawer-open #scrim{display:block;position:fixed;inset:0;z-index:15;background:rgb(26 26 46/.2)}
  #mhead{display:flex;height:48px;flex:none;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--hair);background:var(--glass-strong)}
  .top{gap:10px;padding:0 10px}
  .rtitle,.track,.tright .mchip{display:none}
  .play{flex:1;justify-content:flex-end;min-width:0}
  .greet{font-size:32px}
  .ov{padding:28px 18px 60px;justify-content:flex-start}
  .stages{margin-top:36px}
  .st span{font-size:9.5px}

  .dev{grid-template-columns:1fr}
  .cfgin{grid-template-columns:1fr}
  .demo{bottom:6px;right:10px}
  .vis{padding:14px 14px 40px}
  .feed{padding:16px 14px 8px}
  .cwrap{padding:6px 12px 22px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

const STAGES = ['Spec', 'Reference', 'Propose', 'Fine-tune', 'Compile', 'Verify', 'Report'];

const UC = {
  eeg: {
    name: 'Brainwave sensing', icon: 'wave', device: 'EEG headband', who: 'patients', one: 'patient', One: 'Patient', N: 6,

  { name: 'CPU Plus', icon: 'cpu', hint: 'A bigger machine.' },

let nextId = 1;
const runs = [];
function makeRun(o) {
  const r = Object.assign({ id: 'r' + nextId++, uc: 'eeg', factor: 1, base: 0, anchor: now(), paused: false, redirects: [], starred: false,

runs.push(makeRun({ title: 'Seizure alarm chip for a 4-channel EEG headband', uc: 'eeg', base: 62, factor: 1 }));
runs.push(makeRun({ title: 'Brain-oxygen alarm for an incubator forehead patch', uc: 'nirs', base: TOTAL, factor: 1 }));
runs.push(makeRun({ title: 'Low-power seizure chip for a behind-the-ear pod', uc: 'eeg', base: TOTAL, factor: 0.93 }));
runs.push(makeRun({ title: 'Early warning of oxygen drops in preterm newborns', uc: 'nirs', base: TOTAL, factor: 1.08 }));

const elapsed = r => Math.min(TOTAL, r.paused || r.base >= TOTAL ? r.base : r.base + (now() - r.anchor) / 1000);

function classify(text) {
  const s = text.toLowerCase();

  if (/fewer gate|smaller|less area|tiny|lower power|cheaper|size|gates|power|battery/.test(s)) return 'smaller';

function roundsOf(run) {

      ? `Round 1: proposing ${c} small designs that should fit on a chip. Most listen to ${chanWords(u, rd.chans, run)}${eeg ? ' in 2-second windows' : ''}.`
      : `Round ${rd.r}: the last chip held up on ${prev.chans} ${eeg ? 'channels' : 'light paths'}, so this batch of ${c} leans on ${chanWords(u, rd.chans, run)}.`;
    if (rd.applied.length) txt += ` Following your note, ${rd.applied.map(noteWords).join('; ')}.`;
    add(s + 0.4, 'Designer', txt);
    add(s + 1, null, null, `Propose ${c} chip designs`, `${eeg ? 'Channels' : 'Light paths'}: ${rd.chans}\nWindow: ${eeg ? '2 s' : '30 s'}\nSizes: ${fmt(rd.gates * 0.3)} to ${fmt(rd.gates * 8)} gates\nClinical line: ${rd.line}%`, 6.5);
    add(s + 8.3, 'Trainer', `Fine-tuning all ${c} at once from the reference model, on the same ${u.train} training ${u.who}.`);
    add(s + 9, null, null, `Fine-tune ${c} models in one batch`, `Machine: ${run.machine}, one batch\nBest validation score: ${Math.min(99, rd.line + 5)}%\nKept for compiling: top 12`, 14.5);
    add(s + 24.4, 'Designer', `Compiled the 12 strongest into logic gates, with their weights wired in. The smallest one that still holds up is ${fmt(rd.gates)} gates.`);
    add(s + 25, null, null, 'Compile the top 12 into logic gates', `Smallest: ${fmt(rd.gates)} gates\nNext: ${fmt(rd.gates * 1.21)} gates\nLargest: ${fmt(rd.gates * 3.4)} gates`, 4.5);
    add(s + 30.4, null, null, 'Check the circuit against its model, bit for bit', `${eeg ? '1.2 million' : '410,000'} windows compared\nMismatches: 0`, 5.5);
    const miss = rd.meet < u.N;
    add(s + 36.2, 'Verifier', `The ${fmt(rd.gates)}-gate circuit matches its model bit for bit. On the ${u.N} unseen ${u.who} it meets the clinical line for ${rd.meet} of ${u.N}` +
      (miss ? `; ${u.one} ${rd.worstIdx + 1} is at ${rd.worst}%, under the ${rd.line}% line.` : `; the worst is ${u.one} ${rd.worstIdx + 1} at ${rd.worst}%.`) +
      (i ? ` That's the new best, down from ${fmt(prev.gates)}.` : ''));

  const fin = R[ROUNDS - 1];
  add(roundEnd(ROUNDS) + 0.5, null, null, 'Write the report', 'Sections: the chip, how it was found,\nper-patient results, power estimate', 10);
  add(TOTAL - 0.2, 'Lead scientist', `Done. The final chip is ${fmt(fin.gates)} gates on ${chanWords(u, fin.chans, run)}. It meets the clinical line on ${fin.meet} of ${u.N} unseen ${u.who}; the worst is ${fin.worst}%. The report and the gate-level design are ready.`);
  for (const x of run.redirects) {
    ev.push({ t: x.t, me: true, text: x.text, key: 'me' + x.at });

}
function replyFor(run, kind, t) {

  const when = `From round ${r}`;
  const m = {
    smaller: `Understood. ${when} we'll aim for chips about a third smaller and accept 88% of ${u.metric} instead of 90%. The clinical line moves with it, so you'll see it drawn lower in Trade-off.`,
    channels: `Understood. ${when} the designs drop one more ${run.uc === 'eeg' ? 'channel' : 'light path'}. Fewer ${run.uc === 'eeg' ? 'electrodes' : 'optodes'} also saves power on the device.`,
    accurate: `Understood. ${when} we'll favour the worst ${u.one} over size, so expect a bigger chip that meets the line for more ${u.who}.`,

function nowLine(run, t, ph, best) {
  const u = UC[run.uc], R = roundsOf(run), rd = R[Math.max(0, ph.round - 1)];
  if (status(run) === 'paused') return `<span>${ic('pause')}</span> Paused. Press play in the top bar to carry on.`;
  const words = {
    spec: 'Reading your spec and setting the clinical line.',
    reference: 'Training a full-size reference model to see what is possible.',
    propose: `Round ${ph.round}: proposing ${fmt(run.cands)} chip designs on ${chanWords(u, rd.chans, run)}.`,
    finetune: `Round ${ph.round}: fine-tuning ${fmt(run.cands)} candidate models at once, ${Math.floor(ph.f * 100)}% done.`,
    compile: `Round ${ph.round}: compiling the strongest models into logic gates.`,
    verify: `Round ${ph.round}: checking the circuit bit for bit, then testing it on unseen ${u.who}.`,
    report: 'Writing the report.'
  };
  if (ph.key === 'done') return `${ic('ccheck')} Finished after ${mins(TOTAL)} minutes and ${ROUNDS} rounds.`;
  const applyRound = x => [1, 2, 3, 4].find(k => roundStart(k) > x.t);
  const pend = run.redirects.filter(x => applyRound(x) && roundStart(applyRound(x)) > t).pop();
  const tail = pend ? ` <span style="color:var(--teal)">Your note applies from round ${applyRound(pend)}.</span>` : '';
  const follow = rd && ph.round && rd.applied.length && !pend ? ' <span style="color:var(--teal)">Following your note.</span>' : '';
  return `<span class="spin"></span><span>${words[ph.key]}${tail}${follow}</span>`;
}
function renderOverview(run, t, ph, best) {
  const u = UC[run.uc], done = ph.key === 'done';
  const prevShown = S.lastNum[run.id];
  let hero, verdict, kick;
  if (!best) {
    hero = `<div class="hero"><span class="num none">No chip yet</span></div>`;
    const wait = roundEnd(1) - t;
    verdict = `<p class="verdict">The first chip is checked at the end of round 1, in about ${mins(wait)} minutes.</p>`;
    kick = 'Best chip so far';
  } else {
    const ok = best.meet === u.N;
    hero = `<div class="hero"><span class="num" id="num">${fmt(best.gates)}</span><span class="unit">gates</span></div>`;
    verdict = `<p class="verdict"><span class="mk ${ok ? 'ok' : 'no'}"></span>${ok ? `Meets the clinical line on all ${u.N} unseen ${u.who}.` : `Not there yet: meets the clinical line on ${best.meet} of ${u.N} unseen ${u.who}.`}</p>`;
    kick = done ? 'Final chip' : 'Best chip so far';
  }
  const isNew = best && prevShown && prevShown.r !== best.r && prevShown.id === run.id && best.gates < prevShown.g;
  if (isNew) S.newBest = { id: run.id, until: now() + 9000, from: prevShown.g };
  const nb = S.newBest && S.newBest.id === run.id && S.newBest.until > now() && !done ? `<span class="newbest">New best, down from ${fmt(S.newBest.from)}.</span>` : '';
  const idx = done ? 7 : ph.idx;
  const fillW = done ? 'calc(100% - 100%/7)' : `calc((100% - 100%/7) * ${Math.min(6, idx) / 6})`;
  const loopTxt = done ? `${ROUNDS} rounds` : ph.round ? `Round ${ph.round} of ${ROUNDS}` : `${ROUNDS} rounds ahead`;
  $('#body').innerHTML = `<div class="ov">
    <div class="kick">${nb || kick}</div>

    <div class="stages" aria-label="Stages">

      ${STAGES.map((s, i) => `<div class="st ${i < idx ? 'done' : i === idx ? 'now' : ''}"><i></i><span>${s}</span></div>`).join('')}
      <div class="loop"><span>${loopTxt}</span></div>
    </div>
    <div class="nowline">${nowLine(run, t, ph, best)}</div>
    <div class="more-row"><button class="link" id="details">Show details</button></div>
  </div>`;
  $('#details').onclick = e => { e.stopPropagation(); openDetails(run); };
  if (best) {
    if (isNew && !matchMedia('(prefers-reduced-motion: reduce)').matches) countDown($('#num'), prevShown.g, best.gates);
    S.lastNum[run.id] = { r: best.r, g: best.gates, id: run.id };
  } else S.lastNum[run.id] = null;

        <text x="${X}" y="${Y + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="${on && best ? '#fff' : '#666676'}">${n}</text></g>`;

      <text x="40" y="200" font-size="40" font-family="Iowan Old Style, Georgia, serif" fill="#1a1a2e">${used.length}<tspan font-size="18" fill="#8a8a99"> of 19</tspan></text>
      <text x="40" y="226" font-size="12.5" fill="#666676">${best ? 'electrodes this chip uses' : 'used by the reference model'}</text>
    </svg></div><div class="foot">${best ? `The scientists found ${used.length} electrodes enough: ${used.join(', ')}. Fewer electrodes means a smaller, lighter headband.` : 'The first chip, after round 1, will use far fewer.'}</div>`;
  }
  const k = best ? best.chans : 4, pairs = NIRS_PAIRS.slice(0, k);

  // patch enlarged: 30 x 15 mm at 18 px/mm

  const opt = Object.entries(pos).map(([n, [x, y]]) => {

      : `<g><rect x="${X - 12}" y="${Y - 12}" width="24" height="24" rx="4" fill="${on ? '#1a1a2e' : '#fff'}" stroke="${on ? '#1a1a2e' : '#d4d4dc'}" stroke-width="1.4"/><text x="${X}" y="${Y + 30}" text-anchor="middle" font-size="11" fill="#666676">${n}</text></g>`;
  }).join('');

function figTrade(run, t, ph, best) {
  const u = UC[run.uc], R = roundsOf(run);
  const W = 980, H = 440, L = 70, Rr = 30, T = 20, B = 60;
  const gx = g => L + (Math.log10(g) - 2.8) / (4.4 - 2.8) * (W - L - Rr);
  const vy = v => T + (100 - v) / (100 - 70) * (H - T - B);
  let dots = '';
  const doneR = R.filter(rd => roundEnd(rd.r) <= t);
  const cur = ph.key !== 'done' && ph.round ? R[ph.round - 1] : null;
  const show = [...doneR];
  let partial = 0;
  if (cur && !doneR.includes(cur) && ['finetune', 'compile', 'verify'].includes(ph.key)) { show.push(cur); partial = ph.key === 'finetune' ? ph.f : 1; }
  show.forEach(rd => {
    const rnd = rng(hash(rd.r, run.seed)); const n = 46;
    const isCur = cur && rd === cur && !doneR.includes(cur), latest = best && rd.r === best.r;
    const lim = isCur ? Math.floor(n * partial) : n;
    for (let i = 0; i < lim; i++) {
      const g = rd.gates * Math.exp(rnd() * 2.3 - 0.75);
      const d = Math.log2(g / rd.gates);
      let v = (d >= 0 ? 100 - (100 - rd.worst) * Math.pow(0.6, d) : rd.worst + 7 * d - 1.5) + (rnd() - 0.5) * 4;
      v = Math.max(71, Math.min(99.4, v));
      if (g > 23000 || g < 700) continue;
      if (Math.abs(g - rd.gates) / rd.gates < 0.05) continue;
      dots += `<circle cx="${gx(g).toFixed(1)}" cy="${vy(v).toFixed(1)}" r="4" fill="${isCur ? '#3b82f6' : latest ? '#93c5fd' : '#d4d4dc'}" opacity="${isCur ? .9 : .85}"/>`;
    }
  });
  const line = cur ? cur.line : best ? best.line : run.line;
  const ticks = [1000, 2000, 5000, 10000, 20000].map(g => `<line x1="${gx(g)}" x2="${gx(g)}" y1="${H - B}" y2="${H - B + 5}" stroke="#b0b0be"/><text x="${gx(g)}" y="${H - B + 20}" text-anchor="middle" font-size="11.5" fill="#666676">${fmt(g)}</text>`).join('');
  const yt = [70, 80, 90, 100].map(v => `<line x1="${L}" x2="${W - Rr}" y1="${vy(v)}" y2="${vy(v)}" stroke="#f3f3f6"/><text x="${L - 10}" y="${vy(v) + 4}" text-anchor="end" font-size="11.5" fill="#666676">${v}%</text>`).join('');
  const bm = best ? `<circle cx="${gx(best.gates)}" cy="${vy(best.worst)}" r="7" fill="#1d4ed8"/><circle cx="${gx(best.gates)}" cy="${vy(best.worst)}" r="13" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="${gx(best.gates) > W - 340 ? gx(best.gates) - 18 : gx(best.gates) + 18}" text-anchor="${gx(best.gates) > W - 340 ? 'end' : 'start'}" y="${vy(best.worst) + 30}" font-size="12.5" font-weight="600" fill="#1d4ed8" stroke="#fff" stroke-width="5" paint-order="stroke">Best: ${fmt(best.gates)} gates, worst ${u.one} ${best.worst}%</text>` : '';
  const empty = !show.length ? `<text x="${(L + W - Rr) / 2}" y="${(T + H - B) / 2}" text-anchor="middle" font-size="13" fill="#8a8a99">Candidates appear here once round 1 starts fine-tuning.</text>` : '';
  return `<div class="panel"><svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="Accuracy against chip size">
    ${yt}${ticks}
    <line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" stroke="#b0b0be"/>
    <line x1="${L}" x2="${W - Rr}" y1="${vy(line)}" y2="${vy(line)}" stroke="#ef4444" stroke-dasharray="6 5" stroke-width="1.4"/>
    <text x="${L + 8}" y="${vy(line) - 8}" font-size="12" fill="#b91c1c">Clinical line ${line}%</text>
    ${dots}${bm}${empty}
    <text x="${(L + W - Rr) / 2}" y="${H - 14}" text-anchor="middle" font-size="12" fill="#4a4a5a">Chip size in logic gates (smaller is better)</text>
    <text transform="translate(18 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#4a4a5a">Worst ${u.one}, ${u.metric}</text>
  </svg></div><div class="foot"><span class="lg"><i style="background:#3b82f6;border-radius:50%;width:8px"></i>This round</span><span class="lg"><i style="background:#d4d4dc;border-radius:50%;width:8px"></i>Earlier rounds</span><span>A sample of ${fmt(run.cands)} candidates per round.</span></div>`;
}

function figPatients(run, t, ph, best) {
  const u = UC[run.uc];
  if (!best) return `<div class="panel"><div class="empty">Patient results arrive when round 1's chip has been checked, in about ${mins(roundEnd(1) - t)} minutes.</div></div>`;
  const tiles = best.vals.map((v, i) => {
    const ok = v >= best.line, worst = i === best.worstIdx;
    return `<div class="pt${worst ? ' worst' + (ok ? ' okw' : '') : ''}"><div class="pn"><span>${u.One} ${i + 1}</span>${worst ? '<span style="font-weight:600;color:var(--i800)">Worst</span>' : ''}</div>
      <div class="pv">${v}%</div><div class="bar"><i style="width:${(v - 60) / 40 * 100}%;background:${ok ? '#34d399' : '#f87171'}"></i><b style="left:${(best.line - 60) / 40 * 100}%"></b></div>
      <div class="ps ${ok ? 'ok' : 'no'}">${ok ? 'Meets the line' : 'Below the line'}</div></div>`;
  }).join('');
  return `<div class="panel">${`<div class="ptiles">${tiles}</div>`}</div>
    <div class="foot"><span>${u.metric.charAt(0).toUpperCase() + u.metric.slice(1)} for each unseen ${u.one}, round ${best.r} chip. The black tick is the ${best.line}% line.</span></div>`;
}

function figDevice(run, t, ph, best) {
  const u = UC[run.uc];
  if (!best) return `<div class="panel"><div class="empty">The size and power estimates arrive with the first chip, after round 1.</div></div>`;
  const [pw, ph2] = u.patch, k = 11, ox = 40, oy = 60;
  const core = coreMM2(best.gates), coreSide = Math.sqrt(core);
  const die = 1.0; // pad-limited die, mm
  const dieX = ox + pw * k * 0.62, dieY = oy + ph2 * k * 0.5 - die * k / 2;
  const mag = 190, cx = 760, cy = 210, rr = 150;
  const eeg = run.uc === 'eeg';
  const extras = eeg
    ? `<circle cx="${ox + 9 * k}" cy="${oy + ph2 * k / 2}" r="${4 * k}" fill="#f3f3f6" stroke="#d4d4dc"/><circle cx="${ox + 9 * k}" cy="${oy + ph2 * k / 2}" r="${1.6 * k}" fill="#d4d4dc"/><text x="${ox + 9 * k}" y="${oy + ph2 * k / 2 + 4 * k + 18}" text-anchor="middle" font-size="13" fill="#8a8a99">electrode</text>`
    : `<circle cx="${ox + 6 * k}" cy="${oy + ph2 * k / 2}" r="${1.5 * k}" fill="#fecaca" stroke="#f87171"/><rect x="${ox + 22 * k}" y="${oy + ph2 * k / 2 - 1.5 * k}" width="${3 * k}" height="${3 * k}" rx="3" fill="#4a4a5a"/>`;
  return `<div class="dev"><div class="panel"><svg class="fig" viewBox="0 0 980 420" role="img" aria-label="Chip drawn to scale on the sensor patch">
    <rect x="${ox}" y="${oy}" width="${pw * k}" height="${ph2 * k}" rx="${eeg ? 40 : 60}" fill="#fbfbfd" stroke="#b0b0be" stroke-width="1.4"/>
    ${extras}
    <rect x="${dieX}" y="${dieY}" width="${die * k}" height="${die * k}" fill="#1d4ed8"/>
    <text x="${ox}" y="${oy - 16}" font-size="14" fill="#4a4a5a">${u.patchName.charAt(0).toUpperCase() + u.patchName.slice(1)}, ${pw} × ${ph2} mm</text>
    <g transform="translate(${ox} ${oy + ph2 * k + 56})"><line x1="0" x2="${10 * k}" y1="0" y2="0" stroke="#1a1a2e" stroke-width="1.6"/><line x1="0" x2="0" y1="-5" y2="5" stroke="#1a1a2e"/><line x1="${10 * k}" x2="${10 * k}" y1="-5" y2="5" stroke="#1a1a2e"/><text x="${5 * k}" y="22" text-anchor="middle" font-size="13" fill="#4a4a5a">10 mm</text></g>
    <line x1="${dieX + die * k}" y1="${dieY}" x2="${cx - rr * .7}" y2="${cy - rr * .7}" stroke="#93c5fd"/><line x1="${dieX + die * k}" y1="${dieY + die * k}" x2="${cx - rr * .7}" y2="${cy + rr * .7}" stroke="#93c5fd"/>
    <circle cx="${cx}" cy="${cy}" r="${rr}" fill="#fff" stroke="#93c5fd" stroke-width="1.4"/>
    <rect x="${cx - mag / 2}" y="${cy - mag / 2}" width="${mag}" height="${mag}" rx="4" fill="#eef2ff" stroke="#1d4ed8" stroke-width="1.4"/>
    ${[...Array(8)].map((_, i) => `<rect x="${cx - mag / 2 + 10 + i * 22}" y="${cy - mag / 2 + 6}" width="12" height="12" fill="#c7d2fe"/><rect x="${cx - mag / 2 + 10 + i * 22}" y="${cy + mag / 2 - 18}" width="12" height="12" fill="#c7d2fe"/>`).join('')}
    <rect x="${cx - coreSide * mag / 2}" y="${cy - coreSide * mag / 2}" width="${Math.max(4, coreSide * mag)}" height="${Math.max(4, coreSide * mag)}" fill="#1d4ed8"/>
    <text x="${cx}" y="${cy + coreSide * mag / 2 + 22}" text-anchor="middle" font-size="13" fill="#1d4ed8">AI model, ${coreSide.toFixed(2)} mm across</text>
    <text x="${cx}" y="${cy + rr + 26}" text-anchor="middle" font-size="13" fill="#666676">The 1 × 1 mm chip, enlarged ${Math.round(mag / k)} times</text>
  </svg></div>
  <div class="stats">
    <div class="stat"><div class="l">Chip area</div><div class="v">1.0 × 1.0 mm</div><div class="e">Estimate. The AI model fills ${core.toFixed(3)} mm² of it; the rest is pads.</div></div>
    <div class="stat"><div class="l">Power</div><div class="v">${chipPower(best.gates).toFixed(0)} µW</div><div class="e">Estimate, for the chip alone.</div></div>
    <div class="stat"><div class="l">Battery life</div><div class="v">${battDays(u, best.gates).toFixed(0)} days</div><div class="e">Estimate, whole device on a ${u.batt}.</div></div>
  </div></div>`;
}

/* ---------------- layer: popovers, menus, drawers, modals ---------------- */
function closeLayer() { $('#layer').innerHTML = ''; $$('[aria-expanded=true]').forEach(b => { if (b.classList.contains('more') || b.id === 'runmenu') b.setAttribute('aria-expanded', 'false'); }); }
function place(el, anchor, align) {
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let x = align === 'right' ? r.right - w : r.left, y = r.bottom + 6;
  if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 6);
  x = Math.max(8, Math.min(innerWidth - w - 8, x));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function menu(anchor, items, opts = {}) {
  closeLayer();
  const el = document.createElement('div'); el.className = 'pop'; el.setAttribute('role', 'menu');
  if (opts.width) el.style.width = opts.width + 'px';
  el.innerHTML = (opts.cap ? `<div class="cap">${opts.cap}</div>` : '') + items.map((it, i) => it.sep ? '<div class="sep"></div>'
    : `<button class="opt${it.on ? ' on' : ''}${it.dis ? ' dis' : ''}" role="menuitem" data-i="${i}">${it.icon ? ic(it.icon) : ''}<span>${it.label}${it.hint ? `<span class="oh">${it.hint}</span>` : ''}</span>${it.on ? `<span class="ck">${ic('check')}</span>` : ''}</button>`).join('');
  $('#layer').appendChild(el); place(el, anchor, opts.align);
  el.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-i]'); if (!b) return; const it = items[+b.dataset.i]; if (it.dis) return; closeLayer(); it.act && it.act(); });
  const f = el.querySelector('button'); f && f.focus({ preventScroll: true });
}
function drawer(html) {
  closeLayer();
  $('#layer').innerHTML = `<div class="scrim" id="scrimL"></div><div class="drawer" role="dialog" aria-modal="true"><button class="iconbtn x" id="dx" aria-label="Close">${ic('x')}</button>${html}</div>`;
  $('#scrimL').onclick = closeLayer; $('#dx').onclick = closeLayer; $('#dx').focus();
}
function modal(html, after) {
  closeLayer();
  $('#layer').innerHTML = `<div class="scrim" id="scrimL"></div><div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  $('#scrimL').onclick = closeLayer; after && after();
}
function toast(msg) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function advPopover(anchor) {
  closeLayer();
  const A = S.adv, el = document.createElement('div'); el.className = 'pop adv';

    <div class="field"><div class="fl">Clinical line</div><select id="aLine">${[85, 88, 90, 95].map(v => `<option value="${v}"${A.line === v ? ' selected' : ''}>${v}% caught</option>`).join('')}</select></div>
    <div class="field"><div class="fl">Gate budget</div><input id="aBud" type="number" step="1000" min="1000" value="${A.budget}"></div>
    <div class="field"><div class="fl">Scientists</div><select id="aSci">${['Claude Agent', 'OpenHands'].map(v => `<option${A.scientists === v ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="field"><div class="fl">Lead model</div><select id="aMod">${['Claude Opus', 'Claude Sonnet'].map(v => `<option${A.model === v ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
    <a class="link" href="#/configure">All settings</a>`;
  $('#layer').appendChild(el); place(el, anchor);

  $('#aSci').onchange = e => A.scientists = e.target.value; $('#aMod').onchange = e => A.model = e.target.value;

function openSearch() {

    const q = $('#sq'), l = $('#sl');

/* ---------------- global events ---------------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#layer')) return;
  if (t.closest('#tgl')) { if (innerWidth < 768) document.body.classList.remove('drawer-open'); else document.body.classList.toggle('col'); S.userCol = document.body.classList.contains('col'); return; }
  if (t.closest('#ham')) { document.body.classList.add('drawer-open'); return; }
  if (t.closest('#scrim')) { document.body.classList.remove('drawer-open'); return; }
  if (t.closest('#srch')) { e.preventDefault(); openSearch(); return; }
  const rm = t.closest('[data-rowmenu]');
  if (rm) {
    e.preventDefault(); e.stopPropagation();
    const r = byId(rm.dataset.rowmenu);
    menu(rm, [
      { label: r.starred ? 'Unstar' : 'Star', icon: 'star', act: () => { r.starred = !r.starred; S.sbSig = ''; render(); } },
      { label: 'Rename', icon: 'pencil', act: () => { S.renaming = r.id; S.sbSig = ''; renderSidebar(); } },
      { label: 'Delete', icon: 'trash', act: () => confirmDelete(r) }
    ]);
    rm.setAttribute('aria-expanded', 'true');
    return;
  }
  if (t.closest('#acct')) {
    menu(t.closest('#acct'), [
      { label: 'Configure', icon: 'settings', act: () => go('#/configure') },
      { label: 'Usage', icon: 'chart', act: () => modal(`<div class="pad"><h3>Usage</h3><div class="kv"><span>Runs</span><span>${runs.length}</span></div><div class="kv"><span>Spend this month</span><span>$${(runs.reduce((s, r) => s + spend(elapsed(r)), 0)).toFixed(2)}</span></div><div class="kv"><span>Run time this month</span><span>${clock(runs.reduce((s, r) => s + elapsed(r), 0))}</span></div></div>`) },
      { label: 'Help', icon: 'help', act: () => modal(`<div class="pad"><h3>How a run works</h3><p style="font-size:13.5px;line-height:1.6;color:var(--i700);margin:0">You describe the device and its job. The AI scientists set a clinical line, train a reference model, then repeat four rounds: propose chip designs, fine-tune them all at once, compile the best into logic gates, and check the circuit bit for bit before testing it on unseen patients. Write to them in Chat at any time to change course.</p></div>`) }
    ]);
    return;
  }
  const pop = t.closest('[data-pop]');
  if (pop) {
    const k = pop.dataset.pop;
    if (k === 'uc') menu(pop, Object.entries(UC).map(([key, v]) => ({ label: v.name, icon: v.icon, hint: key === 'eeg' ? 'EEG devices: seizures, sleep, alertness' : 'Brain oxygen in newborns, by near-infrared light', on: S.uc === key, act: () => { S.uc = key; S._draft = $('#prompt').value; renderStart(); } })), { cap: 'Use case', width: 280 });
    if (k === 'preset') menu(pop, PRESETS.map(p => ({ label: p.name, icon: p.icon, hint: p.hint, on: S.preset === p.name, act: () => { S.preset = p.name; S._draft = $('#prompt').value; renderStart(); } })), { cap: 'Preset', width: 220 });
    if (k === 'machine') menu(pop, MACHINES.map(m => ({ label: m.name, icon: m.icon, hint: m.hint, on: S.machine === m.name, act: () => { S.machine = m.name; S._draft = $('#prompt').value; renderStart(); } })), { cap: 'Machine', width: 260 });
    if (k === 'adv') advPopover(pop);
    return;
  }
  if (t.closest('#runmenu')) {
    const run = byId(S.route.id), b = t.closest('#runmenu');
    menu(b, [
      { label: 'Run settings', icon: 'sliders', act: () => runSettings(run) },
      { label: 'Copy link', icon: 'link', act: () => { const u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast('Link copied'), () => toast('Link is in the address bar')); } },
      { sep: true },
      { label: 'Restart run', icon: 'restart', hint: 'Start this demo run again from the beginning', act: () => { run.base = 0; run.anchor = now(); run.paused = false; run.redirects = []; S.lastNum[run.id] = null; S.open.clear(); S.sbSig = ''; render(); toast('Run restarted'); } }
    ], { align: 'right', width: 240 });
    b.setAttribute('aria-expanded', 'true');
    return;
  }
  if (t.closest('#pp')) {
    const run = byId(S.route.id); if (status(run) === 'done') return;
    run.base = elapsed(run); run.anchor = now(); run.paused = !run.paused; S.sig = ''; updateTop(); updateBody(true); return;
  }
  if (!t.closest('.pop')) closeLayer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLayer(); document.body.classList.remove('drawer-open'); } });
function confirmDelete(r) {
  modal(`<div class="pad"><h3>Delete this run?</h3><p style="color:var(--i700);margin:0 0 18px">"${esc(r.title)}" and its chip will be gone for good.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="chip" id="dn">Keep it</button><button class="chip" id="dy" style="background:#b91c1c;color:#fff;border-color:#b91c1c">Delete</button></div></div>`, () => {
    $('#dn').onclick = closeLayer; $('#dn').focus();
    $('#dy').onclick = () => { runs.splice(runs.indexOf(r), 1); closeLayer(); S.sbSig = ''; if (S.route.id === r.id) go('#/'); else render(); };
  });
}
function runSettings(run) {
  const u = UC[run.uc];
  drawer(`<h3>Run settings</h3><p class="dsub">Fixed once a run starts. Change the defaults for new runs in Configure.</p>
    <div class="kv"><span>Use case</span><span>${u.name}</span></div>
    <div class="kv"><span>Clinical line</span><span>${run.line}% caught, worst ${u.one}</span></div>
    <div class="kv"><span>Gate budget</span><span>${fmt(run.budget)}</span></div>
    <div class="kv"><span>Rounds</span><span>${ROUNDS}</span></div>
    <div class="kv"><span>Preset</span><span>${run.preset}, ${fmt(run.cands)} candidates a round</span></div>
    <div class="kv"><span>Machine</span><span>${run.machine}</span></div>
    <div class="kv"><span>Scientists</span><span>${run.scientists}</span></div>
    <div class="kv"><span>Bit-for-bit check</span><span>On</span></div>
    <p style="margin-top:18px"><a class="link" href="#/configure">Open Configure</a></p>`);
}

/* ---------------- render and tick ---------------- */
function render() {
  if (S.userCol === undefined) { document.body.classList.toggle('col', innerWidth < 1024 && innerWidth >= 768); }
  S.sbSig = sbSig(); renderSidebar();
  const p = S.route.page;
  if (p === 'run') renderRun(); else if (p === 'configure') renderConfigure(); else renderStart();
  $('#main').scrollTop = 0;
}
window.addEventListener('resize', () => { if (S.userCol === undefined) document.body.classList.toggle('col', innerWidth < 1024 && innerWidth >= 768); if (innerWidth >= 768) document.body.classList.remove('drawer-open'); });
setInterval(() => {
  const sig = sbSig();
  if (sig !== S.sbSig && !S.renaming && !$('#layer .pop')) { S.sbSig = sig; renderSidebar(); }
  if (S.route.page === 'run' && byId(S.route.id)) { updateTop(); updateBody(false);
    if (S.route.view === 'visual' && S.route.vis === 'chip') updatePred();
  } else if (S.route.page === 'run') go('#/');
}, 250);
(function loop() { if (S.route.page === 'run' && S.route.view === 'visual' && S.route.vis === 'signal') drawSignal(); requestAnimationFrame(loop); })();

S.route = parse();
if (!location.hash) history.replaceState(null, '', '#/');
render();
})();
</script>
</body>
</html>
