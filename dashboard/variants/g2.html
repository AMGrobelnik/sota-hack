<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipIn</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='%233D6DF0' stroke-width='7' d='M53 12.5H23A10.5 10.5 0 0 0 12.5 23V41A10.5 10.5 0 0 0 23 51.5H53'/%3E%3Crect fill='%233D6DF0' x='26' y='25' width='14' height='14' rx='1.5'/%3E%3C/svg%3E">
<style>
:root{
  --wash:#f4f6fb;--card:#fff;--glass:rgb(250 251 254 / .78);--glass-s:rgb(250 251 254 / .96);
  --i900:#131a33;--i800:#2b3250;--i700:#3c4360;--i600:#4a5170;--i550:#535a78;--i500:#5c6382;--i400:#666d8a;--i300:#a4a9bd;--i200:#d5d8e3;--i150:#e6e9f1;--i100:#eff2f8;
  --co:#3d6df0;--cot:#2950c8;--cod:#1f3fa6;--cobg:#eaf0ff;--cor:#bccdfb;
  --blue:#3d6df0;--blue6:#3d6df0;--blue7:#2950c8;--teal:#0f766e;
  --ok:#10b981;--okt:#047857;--okbg:#e9f9f1;--okr:#a7f3d0;
  --bad:#ef4444;--badt:#b91c1c;--badbg:#fef2f2;--badr:#fecaca;
  --warnt:#92400e;--warnbg:#fff7e6;--warnr:#fde68a;
  --cand:#c2410c;
  /* stage colours: one meaning each */
  --st-data:#0f766e;--st-data-bg:#e3f5f2;--st-plan:#6d28d9;--st-plan-bg:#f1ebff;--st-tune:#2950c8;--st-tune-bg:#e8eeff;
  --st-build:#b45309;--st-build-bg:#fff3e2;--st-check:#047857;--st-check-bg:#e6f7ef;
  --navy:#0f1733;--navy2:#17224a;
  --hair:rgb(19 26 51 / .07);--hair4:rgb(19 26 51 / .06);--hair8:rgb(19 26 51 / .1);
  --sh-hair:0 1px 3px rgb(19 26 51 / .05);--sh-menu:0 6px 24px rgb(19 26 51 / .12);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wash);color:var(--i900);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--cot)}
:focus-visible{outline:2px solid var(--co);outline-offset:2px;border-radius:6px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--hair4);transition:width .15s var(--ease);z-index:30;position:relative}
.sb-head{height:54px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--hair4);flex:none}
.mark{width:26px;height:26px;flex:none;display:block}
.wordmark{font-size:15px;font-weight:700;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;color:var(--i900)}
.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .1s}
.sq:hover{background:rgb(19 26 51 / .05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--i600);font-size:12.5px;font-weight:500;text-align:left;transition:background .1s;white-space:nowrap}
.nav button svg.ic{width:18px;height:18px}
.nav button:hover{background:rgb(19 26 51 / .035)}
.nav button.on{background:rgb(61 109 240 / .09);color:var(--i900)}
.nav .count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--cot);background:rgb(61 109 240 / .1);border-radius:99px;padding:1px 7px;font-style:normal}
.divider{height:1px;background:var(--hair4);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px;min-height:0}
.cap{font-size:11px;font-weight:600;color:var(--i550);padding:10px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);cursor:pointer;transition:background .1s}
.row:hover{background:rgb(19 26 51 / .035)}
.row.on{background:rgb(61 109 240 / .09);color:var(--i900)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550);flex:none}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row .more:hover{background:rgb(19 26 51 / .06)}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:0;box-shadow:0 0 0 2px var(--co);border-radius:4px;padding:2px 4px;background:#fff}
.pending-bar{flex:1;height:8px;border-radius:4px;background:var(--i150);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair4);padding:8px;flex:none}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(19 26 51 / .035)}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy2);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:11px;color:var(--i550)}
#sb.col{width:52px}
#sb.col .wordmark,#sb.col .mark,#sb.col .nav span,#sb.col .nav .count,#sb.col .runs,#sb.col .acct .who,#sb.col .divider{display:none}
#sb.col .sb-head{justify-content:center;padding:0}
#sb.col .nav button{justify-content:center;padding:0}
#sb.col .acct button{justify-content:center;padding:6px 0}
.runs-spacer{display:none}
#sb.col .runs-spacer{display:block;flex:1}
#mh{display:none;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:8px;padding:0 10px;background:var(--glass-s);border-bottom:1px solid var(--hair4);z-index:25;backdrop-filter:blur(12px)}
#scrim{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .2);z-index:29}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#demo{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--i600);pointer-events:none;z-index:5;background:rgb(244 246 251 / .94);padding:2px 8px;border-radius:6px}

/* ---------- Start page ---------- */
.start{flex:1;overflow:auto;display:flex;padding:28px 24px 64px}
.start-col{width:100%;max-width:760px;margin:auto;transition:max-width .25s var(--ease)}
.start.asking .start-col{max-width:1040px;margin:0 auto}
.hero{position:relative;height:300px;border-radius:22px;overflow:hidden;background:radial-gradient(120% 140% at 82% 40%,#22336e 0%,#152052 38%,#0f1733 75%);color:#fff;transition:height .3s var(--ease)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgb(255 255 255 / .035) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .035) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,#000 0%,transparent 60%)}
.hero-txt{position:absolute;left:34px;top:30px;bottom:30px;width:min(390px,52%);display:flex;flex-direction:column;z-index:2}
.hero-txt .lock{height:30px;width:97px;display:block;align-self:flex-start}
.hero h1{margin:auto 0 0;font-size:34px;line-height:1.12;font-weight:650;letter-spacing:-.025em}
.hero p{margin:12px 0 0;font-size:14.5px;line-height:1.55;color:#c9d3f2;max-width:36ch}
.hero-3d{position:absolute;top:0;right:0;bottom:0;width:54%;z-index:1}
.hero-3d canvas{position:absolute;inset:0;display:block}
.hero-3d svg.die-line{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:220px;height:220px}
.start.asking .hero{height:118px}
.start.asking .hero h1{font-size:24px}
.start.asking .hero p,.start.asking .hero-txt .lock{display:none}
.start.asking .hero-txt{top:26px;bottom:auto;width:60%}
.start.asking .hero h1{margin:0}
.start.asking .box textarea{min-height:0}
.box{background:#fff;border:1px solid var(--hair8);border-radius:20px;box-shadow:0 8px 28px rgb(19 26 51 / .07);padding:18px 18px 12px 20px}
.start .box{margin-top:-30px;position:relative;z-index:3;margin-left:22px;margin-right:22px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15px;line-height:1.5;min-height:22px;max-height:280px;padding:0;display:block}
.box textarea::placeholder{color:var(--i500)}
.box textarea:focus-visible{outline:0}
.box.locked textarea{color:var(--i700)}
.ctl{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:38px;flex-wrap:wrap}
.ctl .grow{flex:1}
.ctl .cv-mic{margin:0}
.chipin{height:38px;padding:0 18px;border-radius:11px;background:var(--co);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .12s,opacity .12s}
.chipin:hover{background:var(--cot)}
.chipin.off{background:#c4d1f5;color:#24365f}
.chipin .mk{width:16px;height:16px}
.pickers{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 22px 0}
.pickers .lbl0{font-size:12px;color:var(--i550);font-weight:500}
.seg4{display:inline-flex;background:#fff;border:1px solid var(--hair8);border-radius:10px;padding:2px;gap:2px}
.seg4 button{height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:550;color:var(--i700)}
.seg4 button:hover{background:var(--i100)}
.seg4 button.on{background:var(--navy);color:#fff}
.pickers .hintp{font-size:12px;color:var(--i550)}
.pickers .grow{flex:1}
.pill{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:10px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:550;color:var(--i800);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--i100)}
.pill svg.ic{width:14px;height:14px}
.pill .chev{width:12px;height:12px;opacity:.6}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i500);flex:none;transition:all .12s}
.send.ready{background:var(--co);color:#fff}
.send svg.ic{width:18px;height:18px;stroke-width:2}
.textbtn{font-size:12.5px;font-weight:550;color:var(--cot);padding:6px 8px;border-radius:7px}
.textbtn:hover{background:rgb(61 109 240 / .08)}
.textbtn.quiet{color:var(--i600)}

/* ---------- Guided brief: question card + brief card ---------- */
.guide{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px;align-items:start}
.intake{background:#fff;border:1px solid var(--hair8);border-radius:20px;box-shadow:0 10px 30px rgb(19 26 51 / .07);padding:18px 22px 16px}
.intake.anim{animation:unfold .3s var(--ease)}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.stepper .st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--i550);white-space:nowrap}
.stepper .st i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;background:#fff;color:var(--i600);box-shadow:inset 0 0 0 1.5px var(--i200)}
.stepper .st i svg.ic{width:12px;height:12px;stroke-width:2.6}
.stepper .st.cur{color:var(--i900);font-weight:600}
.stepper .st.cur i{background:var(--co);color:#fff;box-shadow:none}
.stepper .st.done{color:var(--i700)}
.stepper .st.done i{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1.5px var(--okr)}
.stepper .st small{font-size:11.5px;font-weight:500;color:var(--i550)}
.stepper .ln{flex:1;height:1.5px;background:var(--i150);min-width:12px;border-radius:1px}
.stepper .ln.done{background:var(--okr)}
.qn{font-size:12px;font-weight:600;color:var(--i550);margin:0 0 4px}
.iq{font-size:21px;line-height:1.3;margin:0 0 6px;font-weight:650;letter-spacing:-.015em}
.ih{font-size:13.5px;color:var(--i600);margin:0 0 14px;line-height:1.55}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans{min-height:74px;border:1.5px solid var(--i200);border-radius:14px;padding:13px 14px;text-align:left;display:flex;gap:11px;align-items:flex-start;background:#fff;transition:border-color .12s,background .12s}
.ans:hover{border-color:#9db4f5;background:#f8faff}
.ans.sel{border-color:var(--co);background:var(--cobg)}
.ans b{display:block;font-size:14.5px;font-weight:600;color:var(--i900);line-height:1.3}
.ans span{display:block;font-size:12.5px;color:var(--i600);margin-top:3px;line-height:1.4}
.ans svg.ic{width:20px;height:20px;color:var(--cot);margin-top:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt2{min-height:36px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--i200);background:#fff;font-size:13.5px;font-weight:550;color:var(--i800);text-align:left;transition:border-color .12s,background .12s}
.opt2:hover{border-color:#9db4f5}
.opt2.sel{border-color:var(--co);background:var(--cobg);color:var(--cod)}
.free{display:flex;gap:8px;margin-top:12px;align-items:center}
.free input{flex:1;min-width:0;height:38px;border:1px solid var(--i200);border-radius:10px;padding:0 12px;font-size:13.5px;outline:0;background:#fff}
.free input:focus{border-color:#9db4f5;box-shadow:0 0 0 3px rgb(61 109 240 / .12)}
.free .cv-mic{margin:0}
.ifoot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--hair4)}
.ifoot .grow{flex:1}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--hair8);background:#fff;font-size:13px;font-weight:550;color:var(--i900);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--i100)}
.btn.blue{background:var(--co);border-color:var(--co);color:#fff}
.btn.blue:hover{background:var(--cot)}
.btn.blue:disabled{background:#c4d1f5;border-color:#c4d1f5;color:#24365f}
.btn.red{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.big{height:40px;padding:0 20px;font-size:14px;font-weight:600;border-radius:11px}
.btn svg.ic{width:15px;height:15px}
.drop{border:1.5px dashed #a9b4cc;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:12px;background:#fbfcff;flex-wrap:wrap;transition:background .12s,border-color .12s}
.drop.over{background:var(--cobg);border-color:var(--co)}
.drop .dt{flex:1;min-width:180px;font-size:13px;color:var(--i700);line-height:1.45}
.fread{margin-top:12px;border:1px solid var(--hair8);border-radius:14px;padding:12px 14px;background:#fff}
.fread .fn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--i900);flex-wrap:wrap}
.fread .fn small{font-weight:500;color:var(--i600);font-size:12.5px}
.fread .rd{margin-top:6px;font-size:13.5px;color:var(--okt);font-weight:550;display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.fread .rd svg.ic{margin-top:2px}
.fread .rd.plain{color:var(--i700);font-weight:500}
.fread .meta{font-size:12px;color:var(--i600);margin-top:4px}
.chs{margin-top:12px}
.chs .chh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:600}
.chs .chh span{font-size:12.5px;font-weight:500;color:var(--i600)}
.chgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch{height:28px;padding:0 10px;border-radius:8px;border:1.5px solid var(--i200);font-size:12px;font-weight:600;color:var(--i700);background:#fff;font-variant-numeric:tabular-nums}
.ch:hover{border-color:#9db4f5}
.ch.on{border-color:var(--co);background:var(--co);color:#fff}
.ch.dup{border-style:dashed}
.ch small{font-weight:500;opacity:.85}
.search{margin-top:6px;list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.search li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13.5px;line-height:1.45;color:var(--i800);animation:popin .2s var(--ease)}
.search li .si{width:18px;height:18px;flex:none;display:grid;place-items:center;margin-top:1px}
.search li .si svg{width:16px;height:16px}
.search li .sv{flex:1}
.search li .sn{font-size:12px;color:var(--i600);white-space:nowrap;font-variant-numeric:tabular-nums}
.search li.drop2 .sv{color:var(--i600)}
.search li.drop2 .sv b{text-decoration:line-through;text-decoration-color:var(--i300);font-weight:600;color:var(--i700)}
.search li.res{font-weight:600}
.sprog{height:3px;border-radius:2px;background:var(--i150);overflow:hidden;margin:4px 0 6px}
.sprog i{display:block;height:100%;background:var(--st-data);transition:width .4s var(--ease)}
.quiet{font-size:12px;color:var(--i600);margin:10px 0 0;line-height:1.5}
.dsrc{border:1px solid var(--hair8);border-radius:14px;padding:12px 16px;margin-top:10px;background:#fff}
.dsrc.top{border-color:#9db4f5;background:#f7f9ff;box-shadow:inset 3px 0 0 var(--co)}
.dsrc .dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600}
.dsrc .dn a{font-size:12px;font-weight:500}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--i100);color:var(--i700);white-space:nowrap}
.tag.blue{background:var(--cobg);color:var(--cod)}.tag.green{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}.tag.amber{background:var(--warnbg);color:var(--warnt);box-shadow:inset 0 0 0 1px var(--warnr)}
.tag.teal{background:var(--st-data-bg);color:var(--st-data)}.tag.violet{background:var(--st-plan-bg);color:var(--st-plan)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 12px;margin:8px 0 0;font-size:12.5px;line-height:1.45}
.kv dt{color:var(--i550)}.kv dd{margin:0;color:var(--i800)}
.why{margin:8px 0 0;font-size:12.5px;color:var(--i700);line-height:1.5}
.asm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.asm li{border:1px solid var(--hair8);border-radius:12px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 14px;align-items:start}
.asm li.changed{border-color:#9db4f5;background:#f7f9ff}
.asm .ak{font-size:11.5px;font-weight:600;color:var(--i550)}
.asm .aval{font-size:14px;font-weight:600;color:var(--i900);line-height:1.4}
.asm .aw{font-size:12.5px;color:var(--i600);line-height:1.45;grid-column:1}
.asm .ac{grid-row:1 / span 3;grid-column:2;align-self:center}
.asm input{width:100%;height:32px;border:1px solid #9db4f5;border-radius:8px;padding:0 10px;font-size:13.5px;outline:0;box-shadow:0 0 0 3px rgb(61 109 240 / .12)}
.addasm{display:flex;gap:8px;margin-top:10px}
.addasm input{flex:1;min-width:0;height:34px;border:1px dashed #a9b4cc;border-radius:10px;padding:0 12px;font-size:13px;outline:0;background:#fbfcff}
.addasm input:focus{border-style:solid;border-color:#9db4f5}
.seg{display:inline-flex;background:var(--i100);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:550;color:var(--i700);white-space:nowrap}
.seg button:hover{background:rgb(255 255 255 / .7)}
.seg button.on{background:#fff;color:var(--i900);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.okk{color:var(--okt)}
.seg button.on.chg{color:var(--cod)}
.note{font-size:12px;color:var(--i600);line-height:1.5;margin:12px 0 0}

.brief{position:sticky;top:0;background:#fff;border:1px solid var(--hair8);border-radius:18px;padding:16px 16px 12px;box-shadow:0 10px 30px rgb(19 26 51 / .05)}
.brief h3{margin:0;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px}
.brief h3 svg{width:18px;height:18px}
.brief .bsub{font-size:12px;color:var(--i600);margin:3px 0 10px}
.brief ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.brief li{display:grid;grid-template-columns:10px 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--hair4);font-size:12.5px;line-height:1.42}
.brief li i{width:8px;height:8px;border-radius:3px;margin-top:5px}
.brief li b{display:block;font-size:11.5px;font-weight:600;color:var(--i550)}
.brief li span{color:var(--i900);font-weight:500}
.brief li.skip span{color:var(--i600);font-weight:400}
.brief li.wait span{color:var(--i500);font-weight:400}
.brief li.wait i{background:var(--i200)!important}
.brief li.new{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{background:var(--cobg)}100%{background:transparent}}
.brief .bfoot{font-size:12px;color:var(--i600);margin-top:8px;padding-top:8px;border-top:1px solid var(--hair4)}

/* ---------- Popovers, menus, modals ---------- */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair8);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{font-size:11px;font-weight:600;color:var(--i550);padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.sel{background:rgb(61 109 240 / .1)}
.opt:disabled{opacity:.6}
.opt .oh{font-size:11.5px;color:var(--i550);margin-top:1px;line-height:1.35}
.opt .ck{margin-left:auto;color:var(--cot)}
.opt svg.ic{margin-top:1px;color:var(--i550)}
.opt.danger{color:var(--badt)}.opt.danger svg.ic{color:var(--badt)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.modal-bg{position:fixed;inset:0;background:rgb(15 23 51 / .3);display:grid;place-items:start center;padding-top:12vh;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,92vw);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0 / .2);overflow:hidden;max-height:80vh;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.modal .mh input{flex:1;border:0;outline:0;font-size:14px}
.modal .mb{padding:8px;max-height:50vh;overflow:auto}
.modal .mp{padding:18px 20px 8px;font-size:14px;line-height:1.55;color:var(--i800);overflow:auto}
.modal .mp h3{margin:0 0 6px;font-size:16px;color:var(--i900)}
.modal .mp h4{margin:14px 0 4px;font-size:13px;color:var(--i900)}
.modal .mp p{margin:0 0 6px}
.modal .mp ul{margin:4px 0 6px;padding-left:18px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;box-shadow:var(--sh-menu);animation:popin .15s}
.dr-bg{position:fixed;inset:0;background:rgb(15 23 51 / .2);animation:fade .15s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(470px,100vw);background:#fff;box-shadow:-12px 0 40px rgb(0 0 0 / .14);display:flex;flex-direction:column;animation:slidein .22s var(--ease)}
@keyframes slidein{from{transform:translateX(28px);opacity:0}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.drawer .dh h2{flex:1;margin:0;font-size:17px;font-weight:650}
.drawer .db{flex:1;overflow:auto;padding:6px 18px 28px}
.drawer h3{font-size:13px;font-weight:650;color:var(--i800);margin:20px 0 4px}
.drawer .lead{font-size:13px;color:var(--i600);margin:0 0 4px;line-height:1.5}
.papers{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.papers li{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:#f6f7fb}
.papers b{display:block;color:var(--i900);font-weight:600}
.papers .src{font-size:12px;color:var(--i600)}
.papers .use{color:var(--i700);margin-top:3px}
.asm-mini{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;line-height:1.5}
.asm-mini li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--hair4)}
.asm-mini li span{flex:1;color:var(--i800)}
.imp{border:1px solid var(--hair8);border-radius:14px;padding:12px 14px;margin-top:10px;background:#fff}
.imp.done{background:#f7f9ff;border-color:#c9d6fa}
.imp .ik{display:flex;gap:8px;align-items:center;font-size:11.5px;font-weight:600;color:var(--i550)}
.imp .iq3{font-size:14px;font-weight:600;color:var(--i900);margin:4px 0 2px;line-height:1.4}
.imp .iw{font-size:12.5px;color:var(--i600);line-height:1.45;margin-bottom:8px}
.imp .redo{margin-top:10px;font-size:12.5px;color:var(--warnt);background:var(--warnbg);border-radius:9px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imp .redo b{font-weight:650}
.imp .redo .grow{flex:1}
.imp .applied{margin-top:8px;font-size:12.5px;color:var(--okt);font-weight:550}

/* ---------- Run page ---------- */
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:rgb(255 255 255 / .8);border-bottom:1px solid var(--hair4)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tabs button{height:100%;font-size:12.5px;font-weight:550;color:var(--i550);border-bottom:2px solid transparent;padding-top:2px}
.tabs button.on{color:var(--cot);font-weight:650;border-bottom-color:var(--co)}
.tabs button:hover:not(.on){color:var(--i900)}
.state{height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:550;flex:none}
.state.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}
.state.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 240px;color:var(--i800)}
.play{flex:1 1 auto;max-width:440px;display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.pbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.pbtn:hover{background:var(--i100)}
.pbtn svg.ic{width:14px;height:14px}
.clock{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--i100);color:var(--i700);flex:none;font-variant-numeric:tabular-nums}
.clock.live{background:var(--cobg);color:var(--cod)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#9db4f5,var(--co))}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--co);transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.end i{background:linear-gradient(90deg,#a7f3d0,#059669)}.track.end b{background:#059669}
.livep{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:rgb(61 109 240 / .1);color:var(--cod);font-size:10.5px;font-weight:700;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--co);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.impbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:600;color:var(--i800);flex:none}
.impbtn:hover{border-color:#9db4f5}
.impbtn svg.ic{width:14px;height:14px;color:var(--st-build)}
.impbtn em{font-style:normal;min-width:18px;height:18px;border-radius:99px;background:var(--st-build);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.impbtn em.zero{background:var(--i150);color:var(--i600)}
.body{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- Overview ---------- */
.ovg{max-width:1160px;margin:0 auto;padding:26px 28px 80px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.ovm{min-width:0;display:flex;flex-direction:column;gap:16px}
.ovr{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.now{font-size:22px;line-height:1.4;letter-spacing:-.012em;font-weight:600;color:var(--i900);margin:0;min-height:2.8em;transition:opacity .35s}
.now .then{color:var(--i600);font-weight:450}
.now.fadeout{opacity:0}
.card{background:#fff;border:1px solid var(--hair8);border-radius:16px;padding:16px 18px}
.card h3{margin:0;font-size:13.5px;font-weight:650;color:var(--i900);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-size:12px;font-weight:500;color:var(--i600)}
.card .cs{font-size:12.5px;color:var(--i600);margin:3px 0 0;line-height:1.45}
.fun{width:100%;height:auto;display:block;margin-top:10px;font-family:var(--sans)}
.scale{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-top:10px}
.scale svg{display:block}
.scale .big{font-size:21px;font-weight:700;letter-spacing:-.015em;color:var(--cot);line-height:1.25}
.scale .big span{color:var(--i900);font-weight:600;font-size:15px;display:block;letter-spacing:0;margin-top:2px}
.scale .sm{font-size:12.5px;color:var(--i600);margin-top:6px;line-height:1.45}
.rounds{margin-top:14px;border-top:1px solid var(--hair4);padding-top:12px}
.rh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:12.5px;color:var(--i600)}
.rh b{color:var(--i900);font-weight:650}
.rrow{list-style:none;margin:10px 0 0;padding:0;display:flex;align-items:flex-end;gap:6px}
.rs{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.rcol{height:58px;display:flex;align-items:flex-end;justify-content:center;width:100%}
.rcol i{width:34px;border-radius:5px 5px 2px 2px;background:#c5d2f3}
.rs b{font-size:14px;font-weight:650;color:var(--i800);font-variant-numeric:tabular-nums}
.rs .rl{font-size:11.5px;color:var(--i600);white-space:nowrap}
.rs.fin .rcol i{background:var(--co)}
.rs.fin b{color:var(--cot);font-size:16px}
.rs.fin .rl{color:var(--cot);font-weight:600}
.rs.wait .rcol i{height:18px;background:none;border:1.5px dashed var(--i200)}
.rs.wait b{font-size:12.5px;font-weight:500;color:var(--i600)}
.ra{align-self:center;color:var(--i300);margin-bottom:18px}
.ra svg.ic{width:14px;height:14px}
.dline{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.55;color:var(--i800)}
.dline>svg.ic{width:18px;height:18px;color:var(--st-data);margin-top:2px}
.dline .sx{flex:1}
.dline .sx b{font-weight:650;color:var(--i900)}
.lnk{font-size:12.5px;font-weight:600;color:var(--cot);padding:2px 0;text-decoration:underline;text-decoration-color:rgb(41 80 200 / .35);text-underline-offset:3px;white-space:nowrap}
.lnk:hover{text-decoration-color:var(--cot)}
.used{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.used li{display:grid;grid-template-columns:118px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--hair4);font-size:12.5px;line-height:1.45;align-items:baseline}
.used li b{font-weight:600;color:var(--i600)}
.used li span{color:var(--i900)}
.ctile{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--hair8);border-radius:16px;padding:12px 14px;transition:border-color .12s}
.ctile:hover{border-color:#9db4f5}
.ctile .cth{font-size:12px;font-weight:600;color:var(--i600);display:flex;justify-content:space-between}
.ctile .cth span{color:var(--cot)}
.cdraw{width:100%;height:auto;display:block;margin-top:6px}
.cdraw .wire{stroke:#c5d2f3;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cdraw .cur{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 9;animation:cur .9s linear infinite}
.cdraw .cur.in{stroke:var(--co)}.cdraw .cur.d2{animation-duration:1.05s}
.cdraw .cur.out{stroke:#059669;animation-duration:.7s}
.cdraw .pkg{fill:#1b1f2b}
.cdraw .die{fill:#3d6df0;animation:dieglow 1.2s ease-in-out infinite}
.cdraw .led{fill:#10b981}
.cdraw text{font-family:var(--sans);font-size:11px;fill:#3c4360;font-weight:500}
.cdraw text.k{font-weight:650;fill:#131a33;font-size:11.5px}
@keyframes cur{to{stroke-dashoffset:-12}}
@keyframes dieglow{50%{fill:#7d9cf5}}
.ctile.alarm .cdraw .cur.out{stroke:#dc2626;animation-duration:.45s}
.ctile.alarm .cdraw .led{fill:#ef4444}
.ctile.nochip .cdraw .cur.out,.ctile.nochip .cdraw .led{display:none}
.ctile.nochip .cdraw .die{animation:none;fill:#4a5170}
.ctile .ctf{font-size:12px;color:var(--i700);margin-top:6px;line-height:1.45}
.ctile .ctf b{color:var(--i900)}
.wf{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.wf li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;color:var(--i700);line-height:1.35}
.wf li .d{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 2px currentColor;color:var(--i300)}
.wf li.past .d{background:currentColor}
.wf li.cur{font-weight:650;color:var(--i900)}
.wf li.cur .d{background:currentColor;animation:blink 1.3s infinite}
.wf li.todo{color:var(--i550)}
.wf li time{font-size:11.5px;color:var(--i600);font-variant-numeric:tabular-nums;font-weight:500}
.wf li.grp{padding-top:9px;margin-top:3px;border-top:1px solid var(--hair4);font-weight:650;color:var(--i800)}
.wf li.sub{padding-left:14px}
.wf .d.k1{color:var(--st-data)}.wf .d.k2{color:var(--st-plan)}.wf .d.k3{color:var(--st-tune)}.wf .d.k4{color:var(--st-build)}.wf .d.k5{color:var(--st-check)}
.wf li.todo .d{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--i600);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------- Chat ---------- */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;overflow:auto;padding:24px 20px 12px}
.feed-in{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;animation:popin .25s var(--ease)}
.msg .who{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px}
.msg .who svg.ic{width:14px;height:14px}
.msg .mm{flex:1;min-width:0}
.msg .mn{font-size:12px;font-weight:650;color:var(--i800);display:flex;gap:8px;align-items:baseline}
.msg .mn .role{font-weight:550}
.msg .mn time{font-size:11px;color:var(--i550);font-weight:450;font-variant-numeric:tabular-nums}
.msg .mt{font-size:13.5px;line-height:1.55;color:var(--i800);margin-top:2px}
.tool{margin-left:36px;border:1px solid var(--hair8);border-radius:9px;background:#fff;animation:popin .25s var(--ease);margin-top:-6px}
.tool>button{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--i700);text-align:left}
.tool>button svg.ic{width:13px;height:13px;color:var(--i550)}
.tool>button code{font-family:var(--mono);font-size:11.5px;color:var(--i600);background:var(--i100);border-radius:5px;padding:1px 6px}
.tool.data>button svg.ic{color:var(--st-data)}
.tool.paper>button svg.ic{color:var(--st-plan)}
.tool.build>button svg.ic{color:var(--st-build)}
.tool.check>button svg.ic{color:var(--st-check)}
.tool.tune>button svg.ic{color:var(--st-tune)}
.tool>button .chev{margin-left:auto;transition:transform .12s}
.tool.open>button .chev{transform:rotate(90deg)}
.tool pre{margin:0;padding:8px 12px 10px;border-top:1px solid var(--hair4);font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--i700);white-space:pre-wrap;display:none}
.tool.open pre{display:block}
.you{align-self:flex-end;max-width:78%;background:var(--navy2);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:13.5px;line-height:1.5;animation:popin .2s}
.typing{display:flex;gap:4px;padding:6px 0 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--i300);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:8px 20px 28px}
.composer .box{max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.composer textarea{flex:1;padding:8px 0}
.composer .box.off{opacity:.75}
.vnow{max-width:740px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i700);min-height:18px;padding-left:4px}
.vnow .typing{padding:0}
.vnow .typing i{width:5px;height:5px;background:var(--co)}

/* ---------- Visual ---------- */
.vis{max-width:1240px;margin:0 auto;padding:14px 24px 40px}
.vtop{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.vh{flex:1;min-width:260px}
.vh h2{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em}
.vh p{margin:3px 0 0;font-size:13.5px;color:var(--i600);line-height:1.5;max-width:76ch}
.picker{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--hair8);padding:3px;border-radius:11px}
.picker button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:550;color:var(--i700);display:inline-flex;align-items:center;gap:4px}
.picker button:hover{color:var(--i900);background:var(--i100)}
.picker button.on{background:var(--navy);color:#fff}
.picker .chev{width:12px;height:12px;opacity:.7}
.stage{position:relative;height:clamp(460px,calc(100dvh - 210px),780px);border-radius:18px;overflow:hidden;background:radial-gradient(120% 95% at 38% 28%,#ffffff 0%,#edf0f6 52%,#dbe0ea 100%);border:1px solid var(--hair8);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.grab{cursor:grab}.stage.grabbing{cursor:grabbing}
.stage>canvas{position:absolute;inset:0;display:block}
.stage.flat{height:auto;background:#fff;padding:16px;cursor:default}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--i600)}
.ov3{position:absolute;inset:0;pointer-events:none}
svg.leads{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.leads path{stroke:#131a33;stroke-opacity:.5;stroke-width:1.1;fill:none}
svg.leads circle{fill:#131a33;stroke:#fff;stroke-width:1.5}
.lbl{position:absolute;left:0;top:0;background:rgb(255 255 255 / .97);border:1px solid var(--hair8);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.35;color:var(--i900);box-shadow:0 2px 10px rgb(20 20 40 / .07);visibility:hidden;white-space:normal;}
.lbl b{display:block;font-size:13px;font-weight:650}

        evs.forEach(([a, e]) => { const xa = Math.max(x0, sx(a)), xe = Math.min(x1, sx(e)); if (xe > xa) { ctx.fillStyle = "#fef2f2"; ctx.fillRect(xa, top - 10, xe - xa, rh1 * 2 + rh2 + 10); } });
        const lanes = [{ n: "Sensor 1", d: "Near detector, light", f: s => 1 + .05 * Math.sin(2 * Math.PI * 1.6 * s) + .02 * noise(s * 8) }, { n: "Sensor 2", d: "Far detector, light", f: s => .6 + .03 * Math.sin(2 * Math.PI * 1.6 * s + .4) + .02 * noise(s * 8 + 9) - (68 - oxyV(s)) * .006 }];
        lanes.forEach((ln, i) => { const y0 = top + rh1 * i + rh1 / 2; text(ln.n, 16, y0 - 8, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 }); text(ln.d, 16, y0 + 9, { c: "#4d4d5d", s: narrow ? 10.5 : 11.5 }); ctx.beginPath(); ctx.strokeStyle = "#6d28d9"; ctx.lineWidth = 1.2; for (let x = x0; x <= x1; x += 1.5) { const v = ln.f(sAt(x)), y = y0 - (v - (i ? .6 : 1)) * rh1 * 3.5; x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); });
        const oy0 = top + rh1 * 2 + 6, oy = v => oy0 + rh2 - (v - 44) / 30 * rh2;
        text("Brain oxygen", 16, oy0 + rh2 / 2 - 8, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 }); text("from both detectors", 16, oy0 + rh2 / 2 + 9, { c: "#4d4d5d", s: narrow ? 10.5 : 11.5 });
        [50, 60, 70].forEach(v => { ctx.strokeStyle = "#eceef2"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, oy(v)); ctx.lineTo(x1, oy(v)); ctx.stroke(); text(v + "%", x0 - 8, oy(v), { a: "right", c: "#4d4d5d", s: 11.5 }); });
        ctx.setLineDash([6, 5]); ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x0, oy(55)); ctx.lineTo(x1, oy(55)); ctx.stroke(); ctx.setLineDash([]);
        text("Alarm line, 55%", x0 + 8, oy(55) + 12, { c: "#b91c1c", s: 12, w: 600 });
        ctx.beginPath(); ctx.strokeStyle = "#6d28d9"; ctx.lineWidth = 2; for (let x = x0; x <= x1; x += 1.5) { const y = oy(oxyV(sAt(x))); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
        if (!narrow) { const v = oxyV(now_); text(`${Math.round(v)}%`, x1 + 12, oy(v), { w: 700, s: 15, c: v < 55 ? "#b91c1c" : "#1a1a2e" }); }
        rows = oy0 + rh2 + 18;
      }
      // marks: doctor and chip
      const dy = rows, cy = rows + laneH + 8;
      text("Doctor's mark", 16, dy + laneH / 2, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 });
      text("Chip's answer", 16, cy + laneH / 2, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 });
      rr(x0, dy, x1 - x0, laneH, 6, "#f6f7f9"); rr(x0, cy, x1 - x0, laneH, 6, "#f6f7f9");
      evs.forEach(([a, e]) => { const xa = Math.max(x0, sx(a)), xe = Math.min(x1, sx(e)); if (xe > xa) rr(xa, dy + 3, xe - xa, laneH - 6, 4, "#dc2626"); });
      if (b) {
        const w0 = Math.floor((now_ - win) / 2) * 2;
        for (let w = w0; w <= now_; w += 2) { const xa = Math.max(x0, sx(w)), xe = Math.min(x1, sx(Math.min(w + 2, now_))); if (xe - xa < 1) continue; const f = chipFlag(r.uc, b, w), tr = truthAt(r.uc, w + 1);
          if (f && tr) rr(xa + 1, cy + 3, xe - xa - 2, laneH - 6, 4, "#1d4ed8"); else if (f) rr(xa + 1, cy + 3, xe - xa - 2, laneH - 6, 4, "#d97706"); else if (tr) rr(xa + 1.5, cy + 4.5, xe - xa - 3, laneH - 9, 4, null, "#1d4ed8", [3, 2]); }
      } else text("No chip yet: answers appear once round 1's chip is checked.", (x0 + x1) / 2, cy + laneH / 2, { a: "center", c: "#40404f" });
      ctx.strokeStyle = "#1a1a2e"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x1, top - 12); ctx.lineTo(x1, cy + laneH + 4); ctx.stroke();
      if (!narrow) {
        const f = b && chipFlag(r.uc, b, now_), yb = cy - 4;
        rr(x1 + 14, yb, 170, 40, 10, b ? (f ? "#fef2f2" : "#ecfdf5") : "#f3f3f6", b ? (f ? "#fca5a5" : "#a7f3d0") : "#d4d4dc");
        text(b ? (f ? (r.uc === "eeg" ? "Seizure flagged" : "Alarm raised") : (r.uc === "eeg" ? "No seizure" : "No alarm")) : "Waiting for a chip", x1 + 28, yb + 20, { w: 700, s: 13.5, c: b ? (f ? "#991b1b" : "#047857") : "#40404f" });
        text("Now", x1 + 14, top - 26, { c: "#4d4d5d", s: 12 });
      }
      const ly = cy + laneH + 30;
      if (b) {
        let lx = x0; const item = (draw, label) => { draw(lx, ly - 6); text(label, lx + 22, ly, { c: "#40404f", s: 12 }); ctx.font = "400 12px Inter, Arial, sans-serif"; lx += 22 + ctx.measureText(label).width + 22; };
        item((x, y) => rr(x, y, 14, 12, 3, "#dc2626"), "Doctor's mark");
        item((x, y) => rr(x, y, 14, 12, 3, "#1d4ed8"), "Caught");
        item((x, y) => rr(x, y, 14, 12, 3, null, "#1d4ed8", [3, 2]), "Missed");
        item((x, y) => rr(x, y, 14, 12, 3, "#d97706"), "False alarm");
        if (!narrow) text(`Each block is one ${r.uc === "eeg" ? "two-second" : "ten-second"} decision.`, lx, ly, { c: "#4d4d5d", s: 12 });
      }
    },
    dispose() { ro.disconnect(); },
  };
  startLoop(host, st, null);
}

/* ================= Settings ================= */
function sel(name, opts, val) { return `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`; }
const CFG_TABS = [["line", "Clinical line"], ["chip", "Chip limits"], ["compute", "Machine"], ["scientists", "Scientists"], ["models", "Models"]];
function renderSettings(V) {
  const tab = CFG_TABS.find(t => t[0] === route.tab) ? route.tab : "line";
  const body = {
    line: ["Clinical line", "What a chip must reach before it counts. Applies to new runs.", [
      ["Events caught", "Share of seizures or oxygen drops each unseen person's chip must catch.", sel("line", [["85", "85%"], ["90", "90%"], ["95", "95%"]], defaults.line)],
      ["False alarms allowed", "Per day for brainwave devices, per hour for newborn devices.", sel("fa", [["1", "Fewer than 1"], ["2", "Fewer than 2"], ["4", "Fewer than 4"]], defaults.fa)]]],
    chip: ["Chip limits", "The box the scientists must design inside.", [
      ["Largest chip allowed", "Candidates above this are dropped before building.", sel("maxGates", [["1000", "1,000 gates"], ["5000", "5,000 gates"], ["20000", "20,000 gates"], ["0", "No limit"]], defaults.maxGates)],
      ["Bits per weight", "Fewer bits make smaller chips but can cost accuracy.", sel("bits", [["2", "2 bits"], ["4", "4 bits"], ["8", "8 bits"]], defaults.bits)]]],
    compute: ["Machine", "How many candidate models are fine-tuned at once.", [
      ["Default machine", "Used for new runs unless you pick another on the start page.", sel("mach", Object.entries(MACH).filter(([, m]) => !m.off).map(([k, m]) => [k, m.name]), defaults.mach)],
      ["Spend limit per run", "The run wraps up and reports when it reaches this.", sel("spendCap", [["10", "$10"], ["25", "$25"], ["100", "$100"]], defaults.spendCap)]]],
    scientists: ["Scientists", "The AI scientists that work on each run.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, s.role, `<button class="sw" role="switch" aria-checked="${defaults.scientists[k]}" data-sci="${k}" aria-label="${s.name}"></button>`])],
    models: ["Models", "Which model each scientist thinks with.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, k === "lead" || k === "check" ? "Needs careful reasoning." : "Runs often; a fast model is enough.", `<select class="sel" data-model="${k}" aria-label="${s.name} model">${["Large reasoning model", "Balanced model", "Fast model"].map(m => `<option ${defaults.models[k] === m ? "selected" : ""}>${m}</option>`).join("")}</select>`])],
  }[tab];
  V.innerHTML = `<div class="cfg"><nav class="cfg-rail"><h1>Settings</h1>${CFG_TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</nav>
    <div class="cfg-main"><h2>${body[0]}</h2><p>${body[1]}</p><div class="cfg-card">${body[2].map(([a, b, c]) => `<div class="crow"><div class="cl"><b>${a}</b><span>${b}</span></div>${c}</div>`).join("")}</div></div></div>`;
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/settings/" + b.dataset.t));
  V.onchange = e => { const s = e.target; if (s.name) { defaults[s.name] = s.value; toast("Saved. New runs will use this."); } if (s.dataset.model) { defaults.models[s.dataset.model] = s.value; toast("Saved. New runs will use this."); } };
  V.onclick = e => { const sw = e.target.closest("[data-sci]"); if (sw) { const k = sw.dataset.sci; if (k === "lead") { toast("The lead scientist is always on."); return; } defaults.scientists[k] = !defaults.scientists[k]; sw.setAttribute("aria-checked", defaults.scientists[k]); } };
}

/* ================= Render loop ================= */
function render() {
  closePop(); closeModal();
  const prev = route; route = parse();
  if (!(route.page === "run" && route.view === "visual" && prev.page === "run" && prev.view === "visual" && prev.id === route.id && prev.vis === route.vis)) stop3D();
  const V = $("#view"); V.onchange = null; V.onclick = null;
  if (route.page === "new") { curRun = null; renderStart(V); }
  else if (route.page === "settings") { curRun = null; renderSettings(V); }
  else renderRun(V);
  refreshSidebar();
}
let tickTitle = {};
function tick() {
  refreshSidebar();
  const r = curRun; if (!r || route.page !== "run") return;
  if (r.titleAt && now() >= r.titleAt && !tickTitle[r.id]) { tickTitle[r.id] = 1; renderTopbarOnly(); }
  updTopbar();
  if (route.view === "overview") updOverview(false);
  if (route.view === "chat") updChat(false);
  if (route.view !== "visual") updTile();
  if (route.view === "visual") updVisual();
}
render();
setInterval(tick, 500);
})();
</script>
