<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI scientist</title>
<style>
:root{
  --wash:#fafaf9;--card:#fff;--glass:rgb(255 253 250 / .7);--glass-s:rgb(255 253 250 / .95);
  --i900:#1a1a2e;--i800:#3a3a4a;--i700:#4a4a5a;--i600:#5a5a6a;--i550:#666676;--i500:#6c6c85;--i400:#8a8a99;--i300:#b0b0be;--i200:#d4d4dc;--i150:#e8e8ec;--i100:#f3f3f6;
  --blue:#3b82f6;--blue6:#2563eb;--blue7:#1d4ed8;--indigo:#6366f1;--violet:#8b5cf6;--teal:#0d9488;
  --ok:#10b981;--okt:#047857;--okbg:#ecfdf5;--okr:#a7f3d0;
  --bad:#ef4444;--badt:#b91c1c;--badbg:#fef2f2;--badr:#fecaca;
  --warnt:#92400e;--warnbg:#fffbeb;--warnr:#fde68a;
  --hair:rgb(0 0 0 / .06);--hair4:rgb(0 0 0 / .04);--hair8:rgb(0 0 0 / .08);
  --sh-card:0 2px 8px rgb(0 0 0 / .08);--sh-menu:0 4px 20px rgb(0 0 0 / .1);--sh-hair:0 1px 3px rgb(0 0 0 / .04);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro","New York",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wash);color:var(--i900);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
/* Sidebar */
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--hair4);transition:width .15s var(--ease);z-index:30;position:relative}
.sb-head{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hair4);flex:none}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:grid;place-items:center;color:#fff;flex:none}
.logo svg.ic{width:16px;height:16px;stroke-width:2}
.wordmark{font-size:14px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden}
.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .1s}
.sq:hover{background:rgb(0 0 0 / .05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--i500);font-size:12.5px;font-weight:500;text-align:left;transition:background .1s;white-space:nowrap}
.nav button svg.ic{width:18px;height:18px}
.nav button:hover{background:rgb(0 0 0 / .03)}
.nav button.on{background:rgb(59 130 246 / .06);color:var(--i900)}
.nav .count{margin-left:auto;font-size:10px;font-weight:600;color:var(--blue6);background:rgb(37 99 235 / .07);border-radius:99px;padding:1px 7px}
.divider{height:1px;background:var(--hair4);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px;min-height:0}
.cap{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550);padding:10px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);cursor:pointer;transition:background .1s}
.row:hover{background:rgb(0 0 0 / .025)}
.row.on{background:rgb(59 130 246 / .06);color:var(--i900)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550);flex:none}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row .more:hover{background:rgb(0 0 0 / .06)}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:0;box-shadow:0 0 0 2px var(--blue);border-radius:4px;padding:2px 4px;background:#fff}
.pending-bar{flex:1;height:8px;border-radius:4px;background:var(--i150);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair4);padding:8px;flex:none}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0 / .03)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:10px;color:var(--i550)}
#sb.col{width:52px}
#sb.col .wordmark,#sb.col .logo,#sb.col .nav span,#sb.col .nav .count,#sb.col .runs,#sb.col .acct .who,#sb.col .divider{display:none}
#sb.col .sb-head{justify-content:center;padding:0}
#sb.col .nav button{justify-content:center;padding:0}
#sb.col .acct button{justify-content:center;padding:6px 0}
#sb.col{flex:none}
#sb.col .runs-spacer{flex:1}
.runs-spacer{display:none}
#sb.col .runs-spacer{display:block}

/* Mobile header */
#mh{display:none;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:8px;padding:0 10px;background:var(--glass-s);border-bottom:1px solid var(--hair4);z-index:25;backdrop-filter:blur(12px)}
#mh .wordmark{font-size:14px}
#scrim{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .2);z-index:29}

/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#demo{position:absolute;right:14px;bottom:8px;font-size:10px;color:var(--i400);pointer-events:none;z-index:5;letter-spacing:.01em}

/* Start page */
.start{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 20px 64px}
.start-col{width:100%;max-width:672px}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:400;text-align:center;margin:0;letter-spacing:-.01em}
.sub{font-size:16px;color:var(--i550);text-align:center;margin:12px 0 32px}
.box{background:var(--glass-s);border:1px solid var(--hair);border-radius:24px;box-shadow:var(--sh-hair);padding:20px 20px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.5;min-height:21px;max-height:280px;padding:0;display:block}
.box textarea::placeholder{color:var(--i500)}
.box textarea:focus-visible{outline:0}
.ctl{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:36px;flex-wrap:wrap}
.ctl .grow{flex:1}
.pill{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:99px;border:1px solid var(--hair8);background:#fff;font-size:11.5px;font-weight:500;color:var(--i800);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--i100)}
.pill svg.ic{width:13px;height:13px}
.pill .chev{width:12px;height:12px;opacity:.5}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i300);flex:none;transition:all .12s}
.send.ready{background:#fff;color:var(--i900);box-shadow:0 1px 4px rgb(0 0 0 / .16),0 0 0 1px var(--hair)}
.send.ready:hover{box-shadow:0 2px 8px rgb(0 0 0 / .18),0 0 0 1px var(--hair8)}
.send svg.ic{width:18px;height:18px;stroke-width:2}

/* Popovers, menus, modals */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair8);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550);padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.sel{background:rgb(37 99 235 / .1)}
.opt .oh{font-size:11px;color:var(--i550);margin-top:1px;line-height:1.35}
.opt .ck{margin-left:auto;color:var(--blue6)}
.opt svg.ic{margin-top:1px;color:var(--i550)}
.opt.danger{color:var(--badt)}.opt.danger svg.ic{color:var(--badt)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.field{display:flex;flex-direction:column;gap:4px;padding:6px 8px}
.field label{font-size:11.5px;font-weight:600;color:var(--i800)}
.field .fh{font-size:11px;color:var(--i550);line-height:1.35}
select.sel{height:30px;border:1px solid var(--i150);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;color:var(--i900)}
.link{color:var(--blue6);font-size:12px;font-weight:500;padding:6px 8px;text-align:left}
.link:hover{text-decoration:underline}
.modal-bg{position:fixed;inset:0;background:rgb(15 15 30 / .25);display:grid;place-items:start center;padding-top:14vh;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,92vw);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0 / .2);overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.modal .mh input{flex:1;border:0;outline:0;font-size:14px}
.modal .mb{padding:8px;max-height:50vh;overflow:auto}
.modal .mp{padding:18px 18px 8px;font-size:14px;line-height:1.5}
.modal .mp h3{margin:0 0 6px;font-size:16px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--i100)}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.blue{background:var(--blue6);border-color:var(--blue6);color:#fff}
.btn.blue:hover{background:var(--blue7)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;box-shadow:var(--sh-menu);animation:popin .15s}

/* Run page */
.topbar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:rgb(255 255 255 / .7);border-bottom:1px solid var(--hair4)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tabs button{height:100%;font-size:11.5px;font-weight:500;color:var(--i550);border-bottom:2px solid transparent;padding-top:2px}
.tabs button.on{color:var(--blue6);font-weight:600;border-bottom-color:var(--blue6)}
.tabs button:hover:not(.on){color:var(--i800)}
.state{height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:500;flex:none}
.state.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}
.state.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 260px;color:var(--i800)}
.play{flex:1 1 auto;max-width:520px;display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.pbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.pbtn:hover{background:var(--i100)}
.pbtn svg.ic{width:14px;height:14px}
.clock{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--i100);color:var(--i700);flex:none}
.clock.live{background:var(--badbg);color:var(--badt)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#fca5a5,#ef4444)}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#ef4444;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.end i{background:linear-gradient(90deg,#a5b4fc,#7c3aed)}.track.end b{background:#7c3aed}
.livep{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:rgb(239 68 68 / .1);color:var(--badt);font-size:9px;font-weight:800;letter-spacing:.08em;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.body{flex:1;min-height:0;overflow:auto;position:relative}

/* Overview (plain words) */
.ov{max-width:720px;margin:0 auto;padding:12vh 28px 80px}
.now{font-family:var(--serif);font-size:27px;line-height:1.38;letter-spacing:-.005em;color:var(--i900);margin:0;min-height:3em;transition:opacity .35s}
.now .then{color:var(--i550)}
.now.fadeout{opacity:0}
.prog{margin-top:36px}
.prog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--i600);margin-bottom:8px}
.prog-top b{font-weight:600;color:var(--i900)}
.bar{height:6px;border-radius:3px;background:var(--i150);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#60a5fa,#3b82f6);transition:width .5s var(--ease)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .55),transparent);animation:sweep 2.4s ease-in-out infinite;transform:translateX(-100%)}
.bar.still i::after{display:none}
.bar.done i{background:linear-gradient(90deg,#34d399,#10b981)}
@keyframes sweep{to{transform:translateX(100%)}}
.bar s{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;z-index:1}
.steps{display:grid;margin-top:8px;font-size:11px;color:var(--i400)}
.steps span{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.steps span.past{color:var(--i550)}
.steps span.cur{color:var(--blue6);font-weight:600}
.best{margin-top:36px;display:flex;align-items:baseline;gap:10px;font-size:15px;line-height:1.5;color:var(--i800)}
.best .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.best .txt{flex:1}
.det{font-size:12.5px;color:var(--i550);text-decoration:underline;text-decoration-color:var(--i200);text-underline-offset:3px;flex:none}
.det:hover{color:var(--i900)}
.details{margin-top:14px;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:6px 16px;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;animation:popin .15s}
.details div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--hair4);font-size:12.5px}
.details div:nth-last-child(-n+2){border-bottom:0}
.details dt{color:var(--i550)}
.details dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;overflow:auto;padding:24px 20px 12px}
.feed-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;animation:popin .25s var(--ease)}
.msg .who{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.msg .who svg.ic{width:13px;height:13px}
.msg .mm{flex:1;min-width:0}
.msg .mn{font-size:12px;font-weight:600;color:var(--i800);display:flex;gap:8px;align-items:baseline}
.msg .mn time{font-family:var(--mono);font-size:9.5px;color:var(--i400);font-weight:400}
.msg .mt{font-size:13.5px;line-height:1.55;color:var(--i800);margin-top:2px}
.tool{margin-left:34px;border:1px solid var(--hair);border-radius:9px;background:#fff;animation:popin .25s var(--ease);margin-top:-8px}
.tool>button{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;color:var(--i600);text-align:left}
.tool>button svg.ic{width:13px;height:13px;color:var(--i400)}
.tool>button .chev{margin-left:auto;transition:transform .12s}
.tool.open>button .chev{transform:rotate(90deg)}
.tool pre{margin:0;padding:8px 12px 10px;border-top:1px solid var(--hair4);font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--i600);white-space:pre-wrap;display:none}
.tool.open pre{display:block}
.you{align-self:flex-end;max-width:78%;background:var(--teal);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:13.5px;line-height:1.5;animation:popin .2s}
.typing{display:flex;gap:4px;padding:6px 0 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--i300);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:8px 20px 28px}
.composer .box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.composer textarea{flex:1;padding:8px 0}
.composer .box.off{opacity:.7}

/* Visual */
.vis{max-width:1120px;margin:0 auto;padding:18px 28px 56px}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{height:28px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:500;color:var(--i600);border:1px solid transparent;display:inline-flex;align-items:center;gap:4px}
.picker button:hover{background:var(--i100)}
.picker button.on{background:#fff;border-color:var(--hair8);color:var(--i900);box-shadow:var(--sh-hair)}
.picker .chev{width:12px;height:12px;opacity:.5}
.vh{margin:22px 0 14px}
.vh h2{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.vh p{margin:4px 0 0;font-size:13.5px;color:var(--i550);line-height:1.5}
.vpanel{background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:var(--sh-hair);padding:16px;min-height:300px}
.vpanel svg.v{width:100%;height:auto;display:block;font-family:var(--sans)}
.pop-in{animation:chipin .6s var(--ease)}
@keyframes chipin{0%{opacity:.2;transform:scale(.97)}100%{opacity:1;transform:none}}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pt{border:1px solid var(--hair);border-radius:10px;padding:12px;background:#fff;position:relative}
.pt .pn{font-size:11.5px;color:var(--i550)}
.pt .pv{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.pt .pm{height:4px;border-radius:2px;background:var(--i150);position:relative}
.pt .pm i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pt .pm u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--i800);border-radius:1px}
.pt .ps{font-size:11px;margin-top:8px;font-weight:500}
.pt.pass .ps{color:var(--okt)}.pt.pass .pm i{background:var(--ok)}
.pt.fail{background:var(--badbg);border-color:var(--badr)}.pt.fail .ps{color:var(--badt)}.pt.fail .pm i{background:var(--bad)}
.pt.worst{box-shadow:0 0 0 2px #f59e0b}
.pt .wtag{position:absolute;top:10px;right:10px;font-size:10px;font-weight:600;color:var(--warnt);background:var(--warnbg);border-radius:99px;padding:1px 7px}
.pt.wait{background:var(--wash);border-style:dashed}.pt.wait .pv{color:var(--i300)}
.devwrap{display:flex;gap:28px;align-items:center}
.devwrap svg.v{flex:1;min-width:0}
.dstats{width:250px;flex:none;display:flex;flex-direction:column;gap:18px}
.dstats .dk{font-size:12px;color:var(--i550)}
.dstats .dv{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.dstats .de{font-size:11px;color:var(--warnt);background:var(--warnbg);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:3px;font-weight:500;letter-spacing:0}

/* Settings */
.cfg{display:flex;flex:1;min-height:0}
.cfg-rail{width:220px;flex:none;border-right:1px solid var(--hair4);padding:20px 10px}
.cfg-rail h1{font-size:20px;font-weight:600;margin:0 10px 14px;letter-spacing:-.01em}
.cfg-rail button{width:100%;height:34px;border-radius:7px;padding:0 10px;text-align:left;font-size:12.5px;font-weight:500;color:var(--i600)}
.cfg-rail button:hover{background:rgb(0 0 0 / .03)}
.cfg-rail button.on{background:rgb(59 130 246 / .06);color:var(--i900)}
.cfg-main{flex:1;overflow:auto;padding:28px 36px 60px}
.cfg-main h2{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.cfg-main>p{color:var(--i550);margin:0 0 22px;font-size:13.5px}
.cfg-card{max-width:620px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:4px 20px}
.crow{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--hair4)}
.crow:last-child{border-bottom:0}
.crow .cl{flex:1}
.crow .cl b{display:block;font-size:13.5px;font-weight:600}
.crow .cl span{display:block;font-size:12px;color:var(--i550);margin-top:2px;line-height:1.4}
.sw{width:34px;height:20px;border-radius:99px;background:var(--i200);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .12s}
.sw[aria-checked=true]{background:var(--blue6)}
.sw[aria-checked=true]::after{transform:translateX(14px)}
.seg{display:inline-flex;background:var(--i100);border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--i600)}
.seg button.on{background:var(--blue6);color:#fff}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (max-width:1279px){.rtitle{flex-basis:180px}}
@media (max-width:1023px){.pts{grid-template-columns:repeat(4,1fr)}.devwrap{flex-direction:column;align-items:stretch}.dstats{width:auto;flex-direction:row;flex-wrap:wrap}}
@media (max-width:767px){
  #mh{display:flex}
  #main{padding-top:48px}
  #sb{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .15s var(--ease);background:var(--glass-s);box-shadow:var(--sh-menu)}
  #sb.open{transform:none}
  #sb.open~#scrim{display:block}
  #sb .sb-head .sq{display:grid}
  .topbar{padding:0 10px;gap:10px}
  .rtitle,.track,.pbtn.sp{display:none}
  .play{flex:0 0 auto;margin-left:auto}
  .ov{padding:36px 20px 60px}
  .now{font-size:22px}
  .steps{font-size:9.5px}
  .details{grid-template-columns:1fr}
  .details div:nth-last-child(2){border-bottom:1px solid var(--hair4)}
  .best{flex-wrap:wrap}
  .vis{padding:14px 14px 48px}
  .pts{grid-template-columns:repeat(2,1fr)}
  .greet{font-size:30px}
  .cfg{flex-direction:column}
  .cfg-rail{width:auto;border-right:0;border-bottom:1px solid var(--hair4);padding:14px 10px;display:flex;gap:4px;overflow:auto}
  .cfg-rail h1{display:none}
  .cfg-rail button{width:auto;white-space:nowrap}
  .cfg-main{padding:20px 16px 60px}
  #demo{bottom:4px;background:rgb(250 250 249 / .92);padding:2px 6px;border-radius:6px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sb" aria-label="Sidebar"></aside>
  <div id="scrim"></div>
  <header id="mh"></header>
  <main id="main"><div id="view"></div><div id="demo">Simulated run, demo data</div></main>
</div>
<div id="layer"></div>
<script>
(() => {
"use strict";
/* ================= Product name: the one place it is set ================= */
const APP = { name: "Chipmonk AI Scientist", short: "Chipmonk" };
document.title = APP.name;

/* ================= Data ================= */
const LINE = 0.90;        // clinical line: share of events caught, per unseen person
const SCALE = 20;         // shown seconds per simulated second (a 3 min demo reads as an hour)
const UC = {
  eeg: {
    label: "Brainwave sensing", icon: "wave", events: "seizures", event: "seizure", people: "patients", person: "patient", Person: "Patient", People: "Patients",
    placeholder: "Describe the device and its job, e.g. a forehead EEG patch that flags seizures at home",
    prompt: "A forehead EEG patch for adults with epilepsy at home. The chip should flag a seizure as it starts, use as few electrodes as possible, and run at least a week on a coin cell.",
    data: "214 hours of brainwave recordings from 31 patients", dataShort: "214 h of EEG, 31 patients",
    window: "2-second windows", predict: "Seizure or no seizure", faUnit: "a day",
    sensors: [["Sensor 1", "Left temple, F7 to T3"], ["Sensor 2", "Right temple, F8 to T4"]],
    pairs: [["F7","T3"],["F8","T4"],["Fp1","F3"],["Fp2","F4"]],
    gates: [4180, 1720, 960], fa: [3.1, 1.4, 1.2], used: [4, 3, 2],
    scores: [
      [.92,.90,.86,.94,.83,.89,.91,.88,.78,.90,.87,.93],
      [.96,.94,.92,.97,.90,.93,.95,.91,.84,.94,.92,.95],
      [.97,.95,.93,.98,.91,.94,.96,.92,.86,.95,.93,.97]],
    weakWhy: "most of their seizures last under ten seconds",
    patch: { w: 52, h: 28, name: "Forehead patch" }, frontMw: 0.9, battMwh: 660, battName: "coin cell",
  },
  nirs: {
    label: "Newborn sensing", icon: "drop", events: "oxygen drops", event: "oxygen drop", people: "newborns", person: "newborn", Person: "Newborn", People: "Newborns",
    placeholder: "Describe the device and its job, e.g. a newborn forehead sensor that alarms when brain oxygen drops",
    prompt: "A soft forehead sensor for newborns in intensive care that reads brain oxygen with near-infrared light. The chip should raise an alarm when brain oxygen drops, with few false alarms, and draw as little power as possible.",
    data: "96 hours of brain-oxygen recordings from 26 newborns", dataShort: "96 h of recordings, 26 newborns",
    window: "10-second windows", predict: "Alarm or no alarm", faUnit: "an hour",
    sensors: [["Sensor 1", "Near detector, 10 mm"], ["Sensor 2", "Far detector, 30 mm"]],
    gates: [2950, 1140, 720], fa: [2.6, 1.3, 1.0], used: [4, 3, 2],
    scores: [
      [.90,.86,.93,.87,.79,.90,.88,.94,.84,.89,.92,.86],
      [.95,.92,.96,.91,.85,.93,.92,.97,.89,.93,.95,.91],
      [.96,.94,.97,.92,.87,.95,.93,.98,.91,.94,.96,.92]],
    weakWhy: "their oxygen drops are shallow and slow",
    patch: { w: 40, h: 18, name: "Forehead sensor" }, frontMw: 2.4, battMwh: 555, battName: "small battery",
  },
};
const COMPUTE = {
  small: { label: "Small", hint: "CPU only. 500 candidates a round.", n: 500, rate: 0.6 },
  std: { label: "Standard", hint: "One GPU. 2,000 candidates a round.", n: 2000, rate: 1.9 },
  large: { label: "Large", hint: "Four GPUs. 8,000 candidates a round.", n: 8000, rate: 7.6 },
};
const SCIENTISTS = {
  lead: { name: "Lead scientist", color: "#8b5cf6", bg: "#f5f3ff", icon: "spark", role: "Plans each round and talks to you." },
  train: { name: "Training scientist", color: "#3b82f6", bg: "#eff6ff", icon: "wave", role: "Fine-tunes the candidate models." },
  build: { name: "Chip builder", color: "#f97316", bg: "#fff7ed", icon: "cpu", role: "Turns models into logic gates." },
  check: { name: "Checker", color: "#10b981", bg: "#ecfdf5", icon: "check", role: "Checks the chip bit for bit and on unseen people." },
};
const defaults = { uc: "eeg", compute: "std", rounds: 3, line: "90", maxGates: "5000", fa: "2", heldOut: "12",
  scientists: { lead: true, train: true, build: true, check: true }, models: { lead: "Large reasoning model", train: "Fast model", build: "Fast model", check: "Large reasoning model" }, bits: "4", spendCap: "25" };

const t0 = performance.now();
const now = () => performance.now();
function mkRun(o) {
  return Object.assign({ rounds: 3, compute: "std", acc: 0, since: now(), paused: false, starred: false, redirect: null, extra: [], typing: false, titleAt: 0 }, o);
}
const runs = [
  mkRun({ id: "seizure-patch", title: "Seizure flag chip for a forehead EEG patch", uc: "eeg", acc: 62, started: "Today" }),
  mkRun({ id: "nicu-oxygen", title: "Brain-oxygen alarm chip for a NICU sensor", uc: "nirs", acc: 999, started: "Yesterday" }),
  mkRun({ id: "home-eeg", title: "Two-sensor seizure detector for home use", uc: "eeg", acc: 999, started: "Mon", compute: "large",
    redirect: { at: 74, mode: "smaller", from: 2, text: "It has to fit behind the ear. Smaller chip please, the line still has to hold." } }),
  mkRun({ id: "incubator-nirs", title: "Low-power oxygen-drop alarm for an incubator probe", uc: "nirs", acc: 999, started: "Last week", compute: "small" }),
];
runs.forEach(r => { if (r.acc > total(r)) r.acc = total(r); if (r.redirect && r.id === "home-eeg") { r.extra.push({ t: 74, who: "you", text: r.redirect.text }); r.extra.push({ t: 75, who: "lead", text: replyFor(r, "smaller", 2) }); } });

/* ================= Simulation ================= */
function total(r) { return 36 + 48 * r.rounds; }
function segs(r) {
  const s = [{ k: "spec", i: 0, s: 0, e: 8 }, { k: "ref", i: 1, s: 8, e: 20 }];
  for (let k = 0; k < r.rounds; k++) {
    const b = 20 + 48 * k;
    s.push({ k: "propose", i: 2, r: k, s: b, e: b + 6 }, { k: "tune", i: 3, r: k, s: b + 6, e: b + 28 }, { k: "compile", i: 4, r: k, s: b + 28, e: b + 38 }, { k: "verify", i: 5, r: k, s: b + 38, e: b + 48 });
  }
  s.push({ k: "report", i: 6, s: 20 + 48 * r.rounds, e: total(r) });
  return s;
}
function elapsed(r) { const e = r.acc + (r.paused ? 0 : (now() - r.since) / 1000); return Math.min(total(r), Math.max(0, e)); }
function isDone(r) { return elapsed(r) >= total(r) - 1e-6; }
function stageAt(r, t) { const S = segs(r); for (const g of S) if (t >= g.s && t < g.e) return Object.assign({ f: (t - g.s) / (g.e - g.s) }, g); return { k: "done", i: 7, f: 1, s: total(r), e: total(r) }; }
function round2(x) { return Math.round(x * 100) / 100; }
function modeFor(r, k) { return r.redirect && k >= r.redirect.from ? r.redirect.mode : null; }
function result(r, k) {
  const U = UC[r.uc], b = Math.min(k, 2), m = modeFor(r, k);
  let gates = U.gates[b], scores = U.scores[b].slice(), fa = U.fa[b], used = U.used[b], q = String(b);
  if (k > 2) { gates = Math.round(gates * 0.9); }
  if (r.compute === "large") gates = Math.round(gates * 0.94);
  if (r.compute === "small") { gates = Math.round(gates * 1.12); }
  if (m === "smaller") { gates = Math.round(gates * 0.62); scores = scores.map(v => round2(v - 0.01)); fa = round2(fa * 1.2); used = Math.min(used, 2); q = "s"; }
  if (m === "accuracy") { gates = Math.round(gates * 1.3); scores = scores.map(v => Math.min(.99, round2(v + 0.02))); fa = round2(fa * 0.85); q = "a"; }
  const pass = scores.filter(v => v >= LINE).length;
  let worst = 0; scores.forEach((v, i) => { if (v < scores[worst]) worst = i; });
  const mean = scores.reduce((a, v) => a + v, 0) / scores.length;
  return { k, gates, scores, fa, used, pass, worst, mean, q };
}
function bestAt(r, t) { let best = null; for (let k = 0; k < r.rounds; k++) { if (t >= 20 + 48 * k + 48) best = result(r, k); } return best; }
function prevBest(r, t) { let p = null, b = null; for (let k = 0; k < r.rounds; k++) { if (t >= 20 + 48 * k + 48) { p = b; b = result(r, k); } } return p; }
function trainedAt(r, t) { const N = COMPUTE[r.compute].n; let n = 0; for (let k = 0; k < r.rounds; k++) { const s = 20 + 48 * k + 6; n += Math.round(N * Math.max(0, Math.min(1, (t - s) / 22))); } return n; }
function cost(r, t) { return (t * SCALE / 3600) * COMPUTE[r.compute].rate + t * 0.004; }
function fmtClock(sec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60; return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }
const nf = n => n.toLocaleString("en-GB");
const pct = v => Math.round(v * 100) + "%";

function replyFor(r, mode, from) {
  const U = UC[r.uc], rn = from + 1;
  if (mode === "smaller") return `Understood. From round ${rn} we rank candidates by size first and accept ${U.events} caught down to the clinical line of 90%. Expect a chip about a third smaller, likely on two sensors, with every ${U.person} checked the same way.`;
  if (mode === "accuracy") return `Understood. From round ${rn} we favour catching more ${U.events}, even if the chip grows by about a third. We'll look hardest at the weakest ${U.person}.`;
  return `Noted. We'll keep that in mind from round ${rn}; nothing about the target changes yet.`;
}
function parseMode(text) {
  const s = text.toLowerCase();
  if (/(fewer|less|smaller|tiny|shrink|reduce|cut).*(gate|size|chip|area|power)|(gate|size|area).*(fewer|smaller|less|down)|lower sensitivity|smaller/.test(s)) return "smaller";
  if (/(more|higher|better|raise|improve).*(sensitiv|accura|catch|recall)|miss fewer|fewer miss|worst patient|worst newborn/.test(s)) return "accuracy";
  return "note";
}

/* Chat events, generated from the schedule */
function events(r) {
  const U = UC[r.uc], N = COMPUTE[r.compute].n, E = [];
  const red = r.redirect;
  const add = (t, who, text, tool) => E.push({ id: `${who}-${t}`, t, who, text, tool });
  add(1, "lead", `We read your brief as: a chip inside the ${r.uc === "eeg" ? "patch" : "sensor"} that decides "${U.predict.toLowerCase()}" for each of the ${U.window}, judged only on ${U.people} it has never seen. Clinical line: catch at least 90% of ${U.events} with fewer than ${r.uc === "eeg" ? "2 false alarms a day" : "2 false alarms an hour"}.`);
  add(4, "tool", "Wrote the goal and the clinical line", ["goal: smallest chip that meets the line", "line: 90% of " + U.events + " caught, per " + U.person, "false alarms: < 2 " + U.faUnit, "unseen " + U.people + " held back: 12"]);
  add(9, "lead", `Pulling marked recordings: ${U.data}. Twelve ${U.people} go in a locked set that no model trains on.`);
  add(14, "tool", "Loaded and split the recordings", [U.dataShort, "training: " + (r.uc === "eeg" ? "19" : "14") + " " + U.people, "unseen test: 12 " + U.people, "cut into " + U.window]);
  add(18, "train", r.uc === "eeg" ? "Most onsets in this set show first on the temple channels. We'll start from four channel pairs rather than all 19 electrodes." : "The far detector sees the brain, the near one mostly sees scalp. We'll try all four detectors first and see how few we need.");
  for (let k = 0; k < r.rounds; k++) {
    const b = 20 + 48 * k, res = result(r, k), prev = k > 0 ? result(r, k - 1) : null, m = modeFor(r, k);
    const after = red && b + 1 > red.at && m;
    let p;
    if (after && m === "smaller") p = `Round ${k + 1}: following your note, we rank by size first. Narrower models, ${res.used <= 2 ? "two" : res.used} sensors, fewer bits per weight.`;
    else if (after && m === "accuracy") p = `Round ${k + 1}: following your note, we let the chip grow and train harder on short, faint ${U.events}.`;
    else if (k === 0) p = `Round 1: six chip families, from four sensors down to two, each reading ${U.window}.`;
    else if (k === 1) p = `Round 2: round 1's best needs ${nf(prev.gates)} gates. We'll try narrower models and drop ${r.uc === "eeg" ? "the frontal pair" : "the farthest detector"}.`;
    else p = `Round ${k + 1}: pushing smaller. Two sensors, fewer bits per weight, and more training on the hardest ${U.people}.`;
    add(b + 1, "lead", p);
    add(b + 7, "train", `Fine-tuning ${nf(N)} candidates at once on the training ${U.people}.`);
    add(b + 27, "tool", `Fine-tune batch finished: ${nf(N)} candidates`, [`candidates: ${nf(N)}`, `best held-out catch rate: ${pct(Math.min(.99, res.mean + .01))}`, `kept for building: 40`, `${U.window}, ${res.used} sensors`]);
    add(b + 29, "build", "Turning the 40 best into logic gates with the weights wired in. No memory and no processor on the chip.");
    add(b + 37, "tool", "Built 40 circuits", [`smallest that meets the line in training: ${nf(res.gates)} gates`, `largest: ${nf(Math.round(res.gates * 3.4))} gates`]);
    add(b + 39, "check", `Checking each circuit bit for bit against its model on 1.2 million windows.`);
    add(b + 44, "tool", "Bit-for-bit check passed", ["circuits checked: 40", "mismatches: 0"]);
    add(b + 47, "check", `Round ${k + 1} best: ${nf(res.gates)} gates, ${res.used} sensors, catches ${pct(res.mean)} of ${U.events}. Meets the clinical line on ${res.pass} of 12 unseen ${U.people}. Weakest is ${U.person} ${res.worst + 1} at ${pct(res.scores[res.worst])}; ${U.weakWhy}.`);
  }
  const R0 = 20 + 48 * r.rounds;
  add(R0 + 2, "lead", `Writing the report: the chip, the sensors it needs, and every ${U.person}'s result.`);
  const fin = result(r, r.rounds - 1);
  add(total(r) - 0.5, "lead", `Done. The smallest chip that does the job has ${nf(fin.gates)} gates and uses ${fin.used} sensors. It meets the clinical line on ${fin.pass} of 12 unseen ${U.people}. ${U.Person} ${fin.worst + 1} stays below it; the report says why.`);
  return E.concat(r.extra.map((x, i) => ({ id: `x${i}`, t: x.t, who: x.who, text: x.text }))).sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
}

/* ================= Icons ================= */
const P = {
  plus: '<path d="M5 12h14M12 5v14"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  search: '<circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.3-4.3"/>',
  panel: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  chevr: '<path d="m9 18 6-6-6-6"/>',
  up: '<path d="m5 12 7-7 7 7M12 19V5"/>',
  right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  play: '<path d="M7 4v16l13-8z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  star: '<path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/>',
  pencil: '<path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
  trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  cpu: '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  tool: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/>',
  spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M17 5h4"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  wave: '<path d="M2 12h4l3-8 4 16 3-8h6"/>',
  drop: '<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5S12.5 5.5 12 3c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7z"/>',
  restart: '<path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  clip: '<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
};

/* ---------- Overview: plain words ---------- */
function nowSentence(r, t) {
  const U = UC[r.uc], g = stageAt(r, t), N = COMPUTE[r.compute].n, R = r.rounds;
  const red = r.redirect && g.r != null && g.r >= r.redirect.from && t > r.redirect.at ? (r.redirect.mode === "smaller" ? " As you asked, they now favour smaller chips." : r.redirect.mode === "accuracy" ? " As you asked, they now favour catching more " + U.events + "." : "") : "";
  if (g.k === "done") { const b = bestAt(r, t); return [`Finished. The scientists found the smallest chip that does the job, and it needs only ${b.used === 2 ? "two" : b.used} sensors.`, `It meets the clinical line on ${b.pass} of 12 ${U.people} it never saw.`]; }
  const pre = r.paused ? "Paused. " : "";
  switch (g.k) {

  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/settings/" + b.dataset.t));
  V.onchange = e => { const s = e.target; if (s.name) { defaults[s.name] = s.name === "rounds" ? +s.value : s.value; toast("Saved. New runs will use this."); } if (s.dataset.model) { defaults.models[s.dataset.model] = s.value; toast("Saved. New runs will use this."); } };
  V.onclick = e => { const sw = e.target.closest("[data-sci]"); if (sw) { const k = sw.dataset.sci; if (k === "lead") { toast("The lead scientist is always on."); return; } defaults.scientists[k] = !defaults.scientists[k]; sw.setAttribute("aria-checked", defaults.scientists[k]); }
    const sg = e.target.closest(".seg button"); if (sg) { defaults.compute = sg.dataset.v; sg.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === sg)); toast("Saved. New runs will use this."); } };
}

/* ================= Render loop ================= */
function render() {
  closePop(); closeModal();
  route = parse();
  const V = $("#view"); V.onchange = null; V.onclick = null;
  if (route.page === "new") { curRun = null; renderStart(V); }
  else if (route.page === "settings") { curRun = null; renderSettings(V); }
  else renderRun(V);
  refreshSidebar();
}
let tickTitle = {};
function tick(force) {
  refreshSidebar();
  const r = curRun; if (!r || route.page !== "run") return;
  if (r.titleAt && now() >= r.titleAt && !tickTitle[r.id]) { tickTitle[r.id] = 1; renderTopbarOnly(); }
  updTopbar();
  if (route.view === "overview") updOverview(false);
  if (route.view === "chat") updChat(false);
  if (route.view === "visual") updVisual();
  void force;
}
render();
setInterval(tick, 500);
})();
</script>
</body>
</html>
