<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chipmonk</title>
<style>
:root{
  --wash:#fafaf9;--card:#fff;--glass:rgb(255 253 250 / .7);--glass-s:rgb(255 253 250 / .95);
  --i900:#1a1a2e;--i800:#33334a;--i700:#40404f;--i600:#4d4d5d;--i550:#575767;--i500:#5c5c70;--i400:#626274;--i300:#a3a3b3;--i200:#d4d4dc;--i150:#e8e8ec;--i100:#f3f3f6;
  --blue:#3b82f6;--blue6:#2563eb;--blue7:#1d4ed8;--teal:#0f766e;
  --ok:#10b981;--okt:#047857;--okbg:#ecfdf5;--okr:#a7f3d0;
  --bad:#ef4444;--badt:#b91c1c;--badbg:#fef2f2;--badr:#fecaca;
  --warnt:#92400e;--warnbg:#fffbeb;--warnr:#fde68a;
  --cand:#c2410c;
  --hair:rgb(0 0 0 / .06);--hair4:rgb(0 0 0 / .05);--hair8:rgb(0 0 0 / .09);
  --sh-hair:0 1px 3px rgb(0 0 0 / .04);--sh-menu:0 4px 20px rgb(0 0 0 / .1);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro","New York",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wash);color:var(--i900);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue6);outline-offset:2px;border-radius:6px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--hair4);transition:width .15s var(--ease);z-index:30;position:relative}
.sb-head{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hair4);flex:none}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;flex:none}
.logo svg.ic{width:16px;height:16px;stroke-width:2}
.wordmark{font-size:14px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden}
.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .1s}
.sq:hover{background:rgb(0 0 0 / .05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--i600);font-size:12.5px;font-weight:500;text-align:left;transition:background .1s;white-space:nowrap}
.nav button svg.ic{width:18px;height:18px}
.nav button:hover{background:rgb(0 0 0 / .03)}
.nav button.on{background:rgb(59 130 246 / .07);color:var(--i900)}
.nav .count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--blue7);background:rgb(37 99 235 / .08);border-radius:99px;padding:1px 7px;font-style:normal}
.divider{height:1px;background:var(--hair4);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px;min-height:0}
.cap{font-size:11px;font-weight:600;color:var(--i550);padding:10px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);cursor:pointer;transition:background .1s}
.row:hover{background:rgb(0 0 0 / .03)}
.row.on{background:rgb(59 130 246 / .07);color:var(--i900)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550);flex:none}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row .more:hover{background:rgb(0 0 0 / .06)}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:0;box-shadow:0 0 0 2px var(--blue);border-radius:4px;padding:2px 4px;background:#fff}
.pending-bar{flex:1;height:8px;border-radius:4px;background:var(--i150);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair4);padding:8px;flex:none}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0 / .03)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:11px;color:var(--i550)}
#sb.col{width:52px}
#sb.col .wordmark,#sb.col .logo,#sb.col .nav span,#sb.col .nav .count,#sb.col .runs,#sb.col .acct .who,#sb.col .divider{display:none}
#sb.col .sb-head{justify-content:center;padding:0}
#sb.col .nav button{justify-content:center;padding:0}
#sb.col .acct button{justify-content:center;padding:6px 0}
.runs-spacer{display:none}
#sb.col .runs-spacer{display:block;flex:1}
#mh{display:none;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:8px;padding:0 10px;background:var(--glass-s);border-bottom:1px solid var(--hair4);z-index:25;backdrop-filter:blur(12px)}
#scrim{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .2);z-index:29}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#demo{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--i600);pointer-events:none;z-index:5;background:rgb(250 250 249 / .92);padding:2px 8px;border-radius:6px}

/* Start page */
.start{flex:1;overflow:auto;display:flex;padding:24px 20px 64px}
.start-col{width:100%;max-width:672px;margin:auto}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:400;text-align:center;margin:0;letter-spacing:-.01em}
.sub{font-size:16px;color:var(--i550);text-align:center;margin:12px 0 32px}
.box{background:var(--glass-s);border:1px solid var(--hair);border-radius:24px;box-shadow:var(--sh-hair);padding:20px 20px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.5;min-height:21px;max-height:280px;padding:0;display:block}
.box textarea::placeholder{color:var(--i500)}
.box textarea:focus-visible{outline:0}
.box.locked textarea{color:var(--i700)}
.ctl{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:36px;flex-wrap:wrap}
.ctl .grow{flex:1}
.pill{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:99px;border:1px solid var(--hair8);background:#fff;font-size:11.5px;font-weight:500;color:var(--i800);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--i100)}
.pill svg.ic{width:13px;height:13px}
.pill .chev{width:12px;height:12px;opacity:.6}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i500);flex:none;transition:all .12s}
.send.ready{background:#fff;color:var(--i900);box-shadow:0 1px 4px rgb(0 0 0 / .16),0 0 0 1px var(--hair)}
.send svg.ic{width:18px;height:18px;stroke-width:2}
.textbtn{font-size:12.5px;font-weight:500;color:var(--blue7);padding:6px 8px;border-radius:7px}
.textbtn:hover{background:rgb(37 99 235 / .07)}

/* Intake: three steps unfolding under the box */
.intake.still{animation:none}
.intake{margin-top:14px;background:#fff;border:1px solid var(--hair8);border-radius:20px;box-shadow:0 10px 30px rgb(26 26 46 / .07);padding:18px 22px 16px;animation:unfold .32s var(--ease);transform-origin:top center}
@keyframes unfold{from{opacity:0;transform:translateY(-8px) scaleY(.97)}}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.stepper .st{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--i550);white-space:nowrap}
.stepper .st i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;background:#fff;color:var(--i600);box-shadow:inset 0 0 0 1.5px var(--i200)}
.stepper .st i svg.ic{width:12px;height:12px;stroke-width:2.6}
.stepper .st.cur{color:var(--i900);font-weight:600}
.stepper .st.cur i{background:var(--blue6);color:#fff;box-shadow:none}
.stepper .st.done{color:var(--i700)}
.stepper .st.done i{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1.5px var(--okr)}
.stepper .ln{flex:1;height:1.5px;background:var(--i150);min-width:12px;border-radius:1px}
.stepper .ln.done{background:var(--okr)}
.iq{font-family:var(--serif);font-size:23px;line-height:1.28;margin:0 0 6px;font-weight:400;letter-spacing:-.005em}
.ih{font-size:13.5px;color:var(--i600);margin:0 0 14px;line-height:1.55}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{min-height:68px;border:1.5px solid var(--i200);border-radius:14px;padding:13px 14px;text-align:left;display:flex;gap:12px;align-items:flex-start;background:#fff;transition:border-color .12s,background .12s}
.ans:hover{border-color:#93b4f5;background:#f8fbff}
.ans.sel{border-color:var(--blue6);background:#eff6ff}
.ans b{display:block;font-size:15px;font-weight:600;color:var(--i900)}
.ans span{display:block;font-size:12.5px;color:var(--i600);margin-top:3px;line-height:1.4}
.ans svg.ic{width:20px;height:20px;color:var(--blue7);margin-top:1px}
.ifoot{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.ifoot .grow{flex:1}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--hair8);background:#fff;font-size:13px;font-weight:500;color:var(--i900)}
.btn:hover{background:var(--i100)}
.btn.blue{background:var(--blue6);border-color:var(--blue6);color:#fff}
.btn.blue:hover{background:var(--blue7)}
.btn.blue:disabled{background:#c9d6f2;border-color:#c9d6f2;color:#3b4a6b}
.btn.red{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.big{height:40px;padding:0 20px;font-size:14px;font-weight:600;border-radius:11px}
.drop{border:1.5px dashed #a9b3c6;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:12px;background:#fbfcfe;flex-wrap:wrap}
.drop .dt{flex:1;min-width:180px;font-size:13px;color:var(--i700);line-height:1.45}
.fname{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--okt);font-weight:500}
.dsrc{border:1px solid var(--hair8);border-radius:14px;padding:13px 16px;margin-top:10px;background:#fff}
.dsrc.top{border-color:#9db8f2;background:#f7faff;box-shadow:inset 3px 0 0 var(--blue6)}
.dsrc .dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;font-weight:600}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--i100);color:var(--i700);white-space:nowrap}
.tag.blue{background:#dbeafe;color:#1e40af}.tag.green{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}.tag.amber{background:var(--warnbg);color:var(--warnt);box-shadow:inset 0 0 0 1px var(--warnr)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 12px;margin:8px 0 0;font-size:12.5px;line-height:1.45}
.kv dt{color:var(--i550)}.kv dd{margin:0;color:var(--i800)}
.why{margin:8px 0 0;font-size:12.5px;color:var(--i700);line-height:1.5}
.also{margin-top:10px;font-size:12.5px;color:var(--i700)}
.also summary{cursor:pointer;color:var(--i600);font-weight:500;padding:4px 0}
.also ul{margin:6px 0 0;padding-left:18px;line-height:1.6}
.iq2{font-size:15px;font-weight:600;margin:16px 0 10px}
.asm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.asm li{border:1px solid var(--hair8);border-radius:12px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:start}
.asm li.changed{border-color:#9db8f2;background:#f7faff}
.asm .ak{font-size:11.5px;font-weight:600;color:var(--i550)}
.asm .aval{font-size:14px;font-weight:600;color:var(--i900);line-height:1.4}
.asm .aw{font-size:12.5px;color:var(--i600);line-height:1.45;grid-column:1}
.asm .ac{grid-row:1 / span 3;grid-column:2;align-self:center}
.asm input{width:100%;height:32px;border:1px solid #9db8f2;border-radius:8px;padding:0 10px;font-size:13.5px;outline:0;box-shadow:0 0 0 3px rgb(37 99 235 / .12)}
.seg{display:inline-flex;background:var(--i100);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--i700);white-space:nowrap}
.seg button:hover{background:rgb(255 255 255 / .7)}
.seg button.on{background:#fff;color:var(--i900);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.okk{color:var(--okt)}
.seg button.on.chg{color:#1e40af}
.note{font-size:12px;color:var(--i600);line-height:1.5;margin:12px 0 0}

/* Popovers, menus, modals */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair8);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{font-size:11px;font-weight:600;color:var(--i550);padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.sel{background:rgb(37 99 235 / .1)}
.opt:disabled{opacity:.55}
.opt .oh{font-size:11.5px;color:var(--i550);margin-top:1px;line-height:1.35}
.opt .ck{margin-left:auto;color:var(--blue6)}
.opt svg.ic{margin-top:1px;color:var(--i550)}
.opt.danger{color:var(--badt)}.opt.danger svg.ic{color:var(--badt)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.modal-bg{position:fixed;inset:0;background:rgb(15 15 30 / .28);display:grid;place-items:start center;padding-top:14vh;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,92vw);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0 / .2);overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.modal .mh input{flex:1;border:0;outline:0;font-size:14px}
.modal .mb{padding:8px;max-height:50vh;overflow:auto}
.modal .mp{padding:18px 18px 8px;font-size:14px;line-height:1.55;color:var(--i800)}
.modal .mp h3{margin:0 0 6px;font-size:16px;color:var(--i900)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;box-shadow:var(--sh-menu);animation:popin .15s}
.dr-bg{position:fixed;inset:0;background:rgb(15 15 30 / .18);animation:fade .15s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(460px,100vw);background:#fff;box-shadow:-12px 0 40px rgb(0 0 0 / .14);display:flex;flex-direction:column;animation:slidein .22s var(--ease)}
@keyframes slidein{from{transform:translateX(28px);opacity:0}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.drawer .dh h2{flex:1;margin:0;font-size:17px;font-weight:600}
.drawer .db{flex:1;overflow:auto;padding:6px 18px 28px}
.drawer h3{font-size:13px;font-weight:600;color:var(--i800);margin:20px 0 4px}
.drawer .lead{font-size:13px;color:var(--i600);margin:0 0 4px;line-height:1.5}
.papers{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.papers li{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:#f8f8fa}
.papers b{display:block;color:var(--i900);font-weight:600}
.papers .src{font-family:var(--mono);font-size:11.5px;color:var(--i600)}
.papers .use{color:var(--i700);margin-top:3px}
.asm-mini{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;line-height:1.5}
.asm-mini li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--hair4)}
.asm-mini li span{flex:1;color:var(--i800)}

/* Run page */
.topbar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:rgb(255 255 255 / .75);border-bottom:1px solid var(--hair4)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tabs button{height:100%;font-size:12px;font-weight:500;color:var(--i550);border-bottom:2px solid transparent;padding-top:2px}
.tabs button.on{color:var(--blue7);font-weight:600;border-bottom-color:var(--blue6)}
.tabs button:hover:not(.on){color:var(--i900)}
.state{height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:500;flex:none}
.state.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}
.state.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 260px;color:var(--i800)}
.play{flex:1 1 auto;max-width:520px;display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.pbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.pbtn:hover{background:var(--i100)}
.pbtn svg.ic{width:14px;height:14px}
.clock{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:6px;background:var(--i100);color:var(--i700);flex:none}
.clock.live{background:var(--badbg);color:var(--badt)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#fca5a5,#ef4444)}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#ef4444;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.end i{background:linear-gradient(90deg,#a5b4fc,#7c3aed)}.track.end b{background:#7c3aed}
.livep{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:rgb(239 68 68 / .1);color:var(--badt);font-size:10px;font-weight:700;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.body{flex:1;min-height:0;overflow:auto;position:relative}

/* Overview */
.ov{max-width:720px;margin:0 auto;padding:10vh 28px 80px}
.now{font-family:var(--serif);font-size:27px;line-height:1.38;letter-spacing:-.005em;color:var(--i900);margin:0;min-height:3em;transition:opacity .35s}
.now .then{color:var(--i600)}
.now.fadeout{opacity:0}
.srcline{margin-top:26px;display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.55;color:var(--i800);text-align:left;width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--hair8);background:#fff;transition:border-color .12s}
.srcline:hover{border-color:#9db8f2}

.bar{height:6px;border-radius:3px;background:var(--i150);overflow:hidden;position:relative}

.steps{display:grid;margin-top:8px;font-size:11.5px;color:var(--i550)}
.steps span{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.steps span.past{color:var(--i700)}
.steps span.cur{color:var(--blue7);font-weight:600}
.best{margin-top:30px;display:flex;align-items:baseline;gap:10px;font-size:15px;line-height:1.5;color:var(--i800)}

.best .txt{flex:1}
.det{font-size:12.5px;color:var(--i600);text-decoration:underline;text-decoration-color:var(--i300);text-underline-offset:3px;flex:none}

.details{margin-top:14px;background:#fff;border:1px solid var(--hair);border-radius:10px;padding:6px 16px;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;animation:popin .15s}

.details dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}

.tool{margin-left:34px;border:1px solid var(--hair8);border-radius:9px;background:#fff;animation:popin .25s var(--ease);margin-top:-8px}

.typing{display:flex;gap:4px;padding:6px 0 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--i300);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:8px 20px 28px}
.composer .box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.composer textarea{flex:1;padding:8px 0}
.composer .box.off{opacity:.75}

/* Visual */
.vis{max-width:1200px;margin:0 auto;padding:14px 24px 40px}
.vtop{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.vh{flex:1;min-width:260px}

.stops{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:2px;background:rgb(255 255 255 / .96);border:1px solid var(--hair8);border-radius:99px;padding:3px;box-shadow:0 4px 16px rgb(20 20 40 / .08)}
.stops button{height:32px;padding:0 15px;border-radius:99px;font-size:13px;font-weight:500;color:var(--i700);white-space:nowrap}

.stops button.on{background:#1a1a2e;color:#fff}

.ghostbtn svg.ic{width:14px;height:14px}

.strip .w i{background:#22252b;border-radius:2px;display:inline-block}
.strip .w.fin{border-color:#fdba74;color:#9a3412}

@keyframes ring{0%{r:12;opacity:.9}100%{r:30;opacity:0}}
.candring{animation:ring 1.6s ease-out infinite}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}

.crow .cl{flex:1}
.crow .cl b{display:block;font-size:13.5px;font-weight:600}

select.sel{height:30px;border:1px solid var(--i200);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;color:var(--i900)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--i300);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .12s}

@media (max-width:1279px){.rtitle{flex-basis:180px}.pts{grid-template-columns:repeat(5,1fr)}}

  .cfg{flex-direction:column}
  .cfg-rail{width:auto;border-right:0;border-bottom:1px solid var(--hair4);padding:14px 10px;display:flex;gap:4px;overflow:auto}
  .cfg-rail h1{display:none}
  .cfg-rail button{width:auto;white-space:nowrap}
  .cfg-main{padding:20px 16px 60px}
  #demo{bottom:4px}
}

}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  if (k > 2) { gates = Math.round(gates * Math.pow(0.9, k - 2)); scores = scores.map(v => Math.min(.99, round2(v + .005 * (k - 2)))); q = "2"; }

  if (m === "accuracy") { gates = Math.round(gates * 1.3); scores = scores.map(v => Math.min(.99, round2(v + 0.02))); fa = round2(fa * 0.85); q = "a"; }

function prevBest(r, t) { let p = null, b = null; for (let k = 0; k < r.rounds; k++) if (t >= 68 + 48 * k) { p = b; b = result(r, k); } return p; }

function fmtClock(sec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60; return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`; }
const nf = n => Math.round(n).toLocaleString("en-GB");
const pct = v => Math.round(v * 100) + "%";
const word = n => ["no", "one", "two", "three", "four", "five", "six"][n] || String(n);

        const lanes = [{ n: "Sensor 1", d: "Near detector, light", f: s => 1 + .05 * Math.sin(2 * Math.PI * 1.6 * s) + .02 * noise(s * 8) }, { n: "Sensor 2", d: "Far detector, light", f: s => .6 + .03 * Math.sin(2 * Math.PI * 1.6 * s + .4) + .02 * noise(s * 8 + 9) - (68 - oxyV(s)) * .006 }];
        lanes.forEach((ln, i) => { const y0 = top + rh1 * i + rh1 / 2; text(ln.n, 16, y0 - 8, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 }); text(ln.d, 16, y0 + 9, { c: "#4d4d5d", s: narrow ? 10.5 : 11.5 }); ctx.beginPath(); ctx.strokeStyle = "#6d28d9"; ctx.lineWidth = 1.2; for (let x = x0; x <= x1; x += 1.5) { const v = ln.f(sAt(x)), y = y0 - (v - (i ? .6 : 1)) * rh1 * 3.5; x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); });
        const oy0 = top + rh1 * 2 + 6, oy = v => oy0 + rh2 - (v - 44) / 30 * rh2;
        text("Brain oxygen", 16, oy0 + rh2 / 2 - 8, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 }); text("from both detectors", 16, oy0 + rh2 / 2 + 9, { c: "#4d4d5d", s: narrow ? 10.5 : 11.5 });
        [50, 60, 70].forEach(v => { ctx.strokeStyle = "#eceef2"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, oy(v)); ctx.lineTo(x1, oy(v)); ctx.stroke(); text(v + "%", x0 - 8, oy(v), { a: "right", c: "#4d4d5d", s: 11.5 }); });
        ctx.setLineDash([6, 5]); ctx.strokeStyle = "#dc2626"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x0, oy(55)); ctx.lineTo(x1, oy(55)); ctx.stroke(); ctx.setLineDash([]);
        text("Alarm line, 55%", x0 + 8, oy(55) + 12, { c: "#b91c1c", s: 12, w: 600 });
        ctx.beginPath(); ctx.strokeStyle = "#6d28d9"; ctx.lineWidth = 2; for (let x = x0; x <= x1; x += 1.5) { const y = oy(oxyV(sAt(x))); x === x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
        if (!narrow) { const v = oxyV(now_); text(`${Math.round(v)}%`, x1 + 12, oy(v), { w: 700, s: 15, c: v < 55 ? "#b91c1c" : "#1a1a2e" }); }
        rows = oy0 + rh2 + 18;
      }
      // marks: doctor and chip
      const dy = rows, cy = rows + laneH + 8;
      text("Doctor's mark", 16, dy + laneH / 2, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 });
      text("Chip's answer", 16, cy + laneH / 2, { w: 600, c: "#1a1a2e", s: narrow ? 11.5 : 12.5 });
      rr(x0, dy, x1 - x0, laneH, 6, "#f6f7f9"); rr(x0, cy, x1 - x0, laneH, 6, "#f6f7f9");
      evs.forEach(([a, e]) => { const xa = Math.max(x0, sx(a)), xe = Math.min(x1, sx(e)); if (xe > xa) rr(xa, dy + 3, xe - xa, laneH - 6, 4, "#dc2626"); });
      if (b) {
        const w0 = Math.floor((now_ - win) / 2) * 2;
        for (let w = w0; w <= now_; w += 2) { const xa = Math.max(x0, sx(w)), xe = Math.min(x1, sx(Math.min(w + 2, now_))); if (xe - xa < 1) continue; const f = chipFlag(r.uc, b, w), tr = truthAt(r.uc, w + 1);
          if (f && tr) rr(xa + 1, cy + 3, xe - xa - 2, laneH - 6, 4, "#1d4ed8"); else if (f) rr(xa + 1, cy + 3, xe - xa - 2, laneH - 6, 4, "#d97706"); else if (tr) rr(xa + 1.5, cy + 4.5, xe - xa - 3, laneH - 9, 4, null, "#1d4ed8", [3, 2]); }
      } else text("No chip yet: answers appear once round 1's chip is checked.", (x0 + x1) / 2, cy + laneH / 2, { a: "center", c: "#40404f" });
      ctx.strokeStyle = "#1a1a2e"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x1, top - 12); ctx.lineTo(x1, cy + laneH + 4); ctx.stroke();
      if (!narrow) {
        const f = b && chipFlag(r.uc, b, now_), yb = cy - 4;
        rr(x1 + 14, yb, 170, 40, 10, b ? (f ? "#fef2f2" : "#ecfdf5") : "#f3f3f6", b ? (f ? "#fca5a5" : "#a7f3d0") : "#d4d4dc");
        text(b ? (f ? (r.uc === "eeg" ? "Seizure flagged" : "Alarm raised") : (r.uc === "eeg" ? "No seizure" : "No alarm")) : "Waiting for a chip", x1 + 28, yb + 20, { w: 700, s: 13.5, c: b ? (f ? "#991b1b" : "#047857") : "#40404f" });
        text("Now", x1 + 14, top - 26, { c: "#4d4d5d", s: 12 });
      }
      const ly = cy + laneH + 30;
      if (b) {
        let lx = x0; const item = (draw, label) => { draw(lx, ly - 6); text(label, lx + 22, ly, { c: "#40404f", s: 12 }); ctx.font = "400 12px Inter, Arial, sans-serif"; lx += 22 + ctx.measureText(label).width + 22; };
        item((x, y) => rr(x, y, 14, 12, 3, "#dc2626"), "Doctor's mark");
        item((x, y) => rr(x, y, 14, 12, 3, "#1d4ed8"), "Caught");
        item((x, y) => rr(x, y, 14, 12, 3, null, "#1d4ed8", [3, 2]), "Missed");
        item((x, y) => rr(x, y, 14, 12, 3, "#d97706"), "False alarm");
        if (!narrow) text(`Each block is one ${r.uc === "eeg" ? "two-second" : "ten-second"} decision.`, lx, ly, { c: "#4d4d5d", s: 12 });
      }
    },
    dispose() { ro.disconnect(); },
  };
  startLoop(host, st, null);
}

/* ================= Settings ================= */
function sel(name, opts, val) { return `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`; }
const CFG_TABS = [["line", "Clinical line"], ["chip", "Chip limits"], ["compute", "Machine"], ["scientists", "Scientists"], ["models", "Models"]];
function renderSettings(V) {
  const tab = CFG_TABS.find(t => t[0] === route.tab) ? route.tab : "line";
  const body = {
    line: ["Clinical line", "What a chip must reach before it counts. Applies to new runs.", [
      ["Events caught", "Share of seizures or oxygen drops each unseen person's chip must catch.", sel("line", [["85", "85%"], ["90", "90%"], ["95", "95%"]], defaults.line)],
      ["False alarms allowed", "Per day for brainwave devices, per hour for newborn devices.", sel("fa", [["1", "Fewer than 1"], ["2", "Fewer than 2"], ["4", "Fewer than 4"]], defaults.fa)]]],
    chip: ["Chip limits", "The box the scientists must design inside.", [
      ["Largest chip allowed", "Candidates above this are dropped before building.", sel("maxGates", [["1000", "1,000 gates"], ["5000", "5,000 gates"], ["20000", "20,000 gates"], ["0", "No limit"]], defaults.maxGates)],
      ["Bits per weight", "Fewer bits make smaller chips but can cost accuracy.", sel("bits", [["2", "2 bits"], ["4", "4 bits"], ["8", "8 bits"]], defaults.bits)]]],
    compute: ["Machine", "How many candidate models are fine-tuned at once.", [
      ["Default machine", "Used for new runs unless you pick another on the start page.", sel("mach", Object.entries(MACH).filter(([, m]) => !m.off).map(([k, m]) => [k, m.name]), defaults.mach)],
      ["Spend limit per run", "The run wraps up and reports when it reaches this.", sel("spendCap", [["10", "$10"], ["25", "$25"], ["100", "$100"]], defaults.spendCap)]]],
    scientists: ["Scientists", "The AI scientists that work on each run.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, s.role, `<button class="sw" role="switch" aria-checked="${defaults.scientists[k]}" data-sci="${k}" aria-label="${s.name}"></button>`])],
    models: ["Models", "Which model each scientist thinks with.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, k === "lead" || k === "check" ? "Needs careful reasoning." : "Runs often; a fast model is enough.", `<select class="sel" data-model="${k}" aria-label="${s.name} model">${["Large reasoning model", "Balanced model", "Fast model"].map(m => `<option ${defaults.models[k] === m ? "selected" : ""}>${m}</option>`).join("")}</select>`])],
  }[tab];
  V.innerHTML = `<div class="cfg"><nav class="cfg-rail"><h1>Settings</h1>${CFG_TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</nav>
    <div class="cfg-main"><h2>${body[0]}</h2><p>${body[1]}</p><div class="cfg-card">${body[2].map(([a, b, c]) => `<div class="crow"><div class="cl"><b>${a}</b><span>${b}</span></div>${c}</div>`).join("")}</div></div></div>`;
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/settings/" + b.dataset.t));
  V.onchange = e => { const s = e.target; if (s.name) { defaults[s.name] = s.value; toast("Saved. New runs will use this."); } if (s.dataset.model) { defaults.models[s.dataset.model] = s.value; toast("Saved. New runs will use this."); } };
  V.onclick = e => { const sw = e.target.closest("[data-sci]"); if (sw) { const k = sw.dataset.sci; if (k === "lead") { toast("The lead scientist is always on."); return; } defaults.scientists[k] = !defaults.scientists[k]; sw.setAttribute("aria-checked", defaults.scientists[k]); } };
}

/* ================= Render loop ================= */
function render() {
  closePop(); closeModal();
  const prev = route; route = parse();
  if (!(route.page === "run" && route.view === "visual" && prev.page === "run" && prev.view === "visual" && prev.id === route.id && prev.vis === route.vis)) stop3D();
  const V = $("#view"); V.onchange = null; V.onclick = null;
  if (route.page === "new") { curRun = null; renderStart(V); }
  else if (route.page === "settings") { curRun = null; renderSettings(V); }
  else renderRun(V);
  refreshSidebar();
}
let tickTitle = {};
function tick() {
  refreshSidebar();
  const r = curRun; if (!r || route.page !== "run") return;
  if (r.titleAt && now() >= r.titleAt && !tickTitle[r.id]) { tickTitle[r.id] = 1; renderTopbarOnly(); }
  updTopbar();
  if (route.view === "overview") updOverview(false);
  if (route.view === "chat") updChat(false);
  if (route.view === "visual") updVisual();
}
render();
setInterval(tick, 500);
})();
</script>
