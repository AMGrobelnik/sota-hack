<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chipwright run view (variant 1, Template)</title>
<style>
:root{
  --i50:#fafaf9;--i100:#f3f3f6;--i150:#e8e8ec;--i200:#d4d4dc;--i300:#b0b0be;--i350:#9a9aa8;--i400:#8a8a99;--i500:#6c6c85;--i550:#666676;--i600:#5a5a6a;--i700:#4a4a5a;--i800:#3a3a4a;--i900:#1a1a2e;
  --pri:#3b82f6;--az6:#2563eb;--az7:#1d4ed8;--sky:#e8f3fb;
  --t50:#f0f7f6;--t600:#0d9488;--t900:#134e4a;
  --vi:#a78bfa;--bl:#60a5fa;--or:#fb923c;
  --e50:#ecfdf5;--e100:#d1fae5;--e500:#10b981;--e600:#059669;--e700:#047857;
  --r50:#fef2f2;--r100:#fee2e2;--r500:#ef4444;--r600:#dc2626;--r700:#b91c1c;
  --a50:#fffbeb;--a100:#fef3c7;--a500:#f59e0b;--a700:#b45309;
  --moss:#5b8a5b;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style",Charter,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh-xs:0 1px 3px rgb(0 0 0/.04);--sh-sm:0 2px 8px rgb(0 0 0/.08);--sh-md:0 4px 12px rgb(0 0 0/.08);
  --sh-lg:0 4px 20px rgb(0 0 0/.1),0 2px 4px rgb(0 0 0/.04);--sh-2xl:0 8px 40px rgb(0 0 0/.12),0 2px 8px rgb(0 0 0/.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 var(--sans);color:var(--i900);background:#fff;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--az6);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--i500)}
.hide{display:none!important}
svg.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.s{width:13px;height:13px}

/* shell */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sb{width:232px;flex:none;background:oklch(.98 0 0);border-right:1px solid var(--i150);display:flex;flex-direction:column;min-height:0}
.sb-top{display:flex;align-items:center;gap:9px;padding:16px 16px 12px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--i900);display:grid;place-items:center;flex:none}
.brand{font:600 17px/1 var(--serif);letter-spacing:-.01em}
.sb-new{margin:4px 12px 10px;height:34px;border:1px solid var(--i150);border-radius:10px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 11px;font-size:12.5px;font-weight:500;box-shadow:var(--sh-xs)}
.sb-new:hover{background:var(--i50)}
.sb-nav{padding:0 8px;display:flex;flex-direction:column;gap:1px}
.sb-nav button{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:7px;font-size:12.5px;color:var(--i700);text-align:left}
.sb-nav button:hover{background:var(--i100)}
.sb-sec{font-size:11px;color:var(--i400);padding:16px 18px 6px;font-weight:500}
.runs{flex:1;overflow:auto;padding:0 8px;min-height:0}
.run-i{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--i700)}
.run-i:hover{background:var(--i100)}
.run-i.on{background:#fff;box-shadow:var(--sh-xs),0 0 0 1px var(--i150);color:var(--i900);font-weight:500}
.run-i .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-i .acts{display:none;gap:2px;color:var(--i400)}
.run-i:hover .acts{display:flex}
.st-dot{width:14px;height:14px;flex:none;display:grid;place-items:center}
.acct{border-top:1px solid var(--i150);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.acct .row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--t50);color:var(--t600);display:grid;place-items:center;font-weight:600;font-size:11px;border:1px solid #cfe7e3}
.meter{height:4px;border-radius:4px;background:var(--i100);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri);border-radius:4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;container-type:inline-size;container-name:main}
.mhead{display:none}
section.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* helper panel */
.helper{width:360px;flex:none;border-left:1px solid var(--i150);display:none;flex-direction:column;background:#fff;min-height:0;position:relative}
.helper.open{display:flex}
.h-head{display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border-bottom:1px solid var(--i150)}
.h-head b{font:600 15px var(--serif)}
.h-state{margin:12px 14px 0;padding:9px 11px;border-radius:10px;background:var(--i50);border:1px solid var(--i150);font-size:12.5px;color:var(--i600);display:flex;gap:8px;align-items:flex-start}
.h-state.paused{background:var(--a50);border-color:#fde68a;color:var(--a700)}
.h-msgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bub{max-width:92%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--t50);border:1px solid #d5ebe7;color:var(--t900);border-bottom-right-radius:5px}
.bub.ai{align-self:flex-start;background:#fff;border:1px solid var(--i150);border-bottom-left-radius:5px}
.bub .who{display:block;font-size:11px;color:var(--i500);margin-bottom:2px;font-weight:500}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--i400);margin-right:3px;animation:aii-blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.h-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chipbtn{border:1px solid var(--i150);background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--i700)}
.chipbtn:hover{background:var(--i50);border-color:var(--i200)}
.composer{margin:0 12px 12px;border:1px solid var(--i150);border-radius:16px;background:#fff;box-shadow:var(--sh-sm);padding:8px 8px 8px 12px}
.composer textarea{width:100%;border:0;resize:none;outline:none;font-size:13.5px;min-height:44px;max-height:120px;line-height:1.45;background:none}
.comp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--i150);background:#fff;font-size:11.5px;color:var(--i700);white-space:nowrap}
.pill:hover{background:var(--i50)}
.pill.teal{background:var(--t50);border-color:#cfe7e3;color:var(--t900)}
.send{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--i900);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--i200);cursor:default}

/* run chrome */
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--i150);background:#fff}
.title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;outline:none;border-radius:5px;padding:2px 4px;margin-left:-4px}
.title:hover{background:var(--i100)}
.seg{display:inline-flex;background:var(--i100);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{height:26px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--i600);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:#fff;color:var(--i900);box-shadow:var(--sh-xs),0 0 0 1px rgb(0 0 0/.04)}
.seg.sm button{height:24px;padding:0 9px;font-size:11.5px}
.tb-sp{flex:1}
.demo{font-size:11px;color:var(--a700);background:var(--a50);border:1px solid #fde68a;border-radius:999px;padding:2px 9px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--i150);background:#fff;font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--i50)}
.btn.pri{background:var(--i900);color:#fff;border-color:var(--i900)}
.btn.pri:hover{background:var(--i800)}
.btn.amber{background:var(--a50);border-color:#fcd34d;color:var(--a700)}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--i700)}
.ib:hover{background:var(--i100)}

.strip{flex:none;display:flex;align-items:center;gap:12px;padding:7px 16px;border-bottom:1px solid var(--i150);background:var(--i50);min-height:46px;flex-wrap:nowrap}
.tracker{display:flex;align-items:center;gap:4px;flex:none}
.tk{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:999px;font-size:11.5px;color:var(--i500);border:1px solid transparent;white-space:nowrap}
.tk:hover{background:#fff;border-color:var(--i150)}
.tk .d{width:7px;height:7px;border-radius:50%;background:var(--i200);flex:none}
.tk.done{color:var(--i700)} .tk.done .d{background:var(--i500)}
.tk.run{color:var(--i900);background:#fff;border-color:var(--i150);box-shadow:var(--sh-xs);font-weight:600}
.tk.run .d{background:var(--pri);box-shadow:0 0 0 3px rgb(59 130 246/.18)}
.tk.paused .d{background:var(--a500);box-shadow:0 0 0 3px rgb(245 158 11/.2)}
.loop{display:inline-flex;align-items:center;gap:2px;border:1px dashed var(--i200);border-radius:999px;padding:1px 3px 1px 2px;position:relative}
.loop .rb{font-size:10px;font-weight:600;color:var(--az7);background:var(--sky);border-radius:999px;padding:1px 7px;margin-left:3px;white-space:nowrap}
.sbest{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.sbest .lbl{color:var(--i500)}
.sbest b{font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--e50);color:var(--e700)} .tag.warn{background:var(--a50);color:var(--a700)} .tag.bad{background:var(--r50);color:var(--r700)} .tag.n{background:var(--i100);color:var(--i600)} .tag.b{background:var(--sky);color:var(--az7)}
.pb{display:flex;align-items:center;gap:4px;flex:none}
.live{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;color:#fff;background:var(--r500);cursor:pointer;border:0}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:aii-blink 1.2s infinite}
.live.dim{background:var(--r100);color:var(--r700)} .live.dim i{background:var(--r500);animation:none}
.live.pz{background:var(--a100);color:var(--a700)} .live.pz i{background:var(--a500);animation:none}
.live.end{background:var(--i150);color:var(--i600)} .live.end i{background:var(--i400);animation:none}
.clock{font:500 11.5px var(--mono);color:var(--i600);min-width:84px;text-align:right}
select.sel{height:28px;border:1px solid var(--i150);border-radius:8px;background:#fff;font-size:12px;padding:0 6px}
.scrub{height:4px;flex:none;position:relative;background:var(--i100)}
.scrub .fill{position:absolute;left:0;top:0;bottom:0;background:var(--pri);opacity:.75}
.scrub .lv{position:absolute;left:0;top:0;bottom:0;background:var(--i200)}
.scrub .mk{position:absolute;top:0;bottom:0;width:1px;background:#fff}
.scrub input{position:absolute;inset:-6px 0;width:100%;opacity:0;cursor:pointer;margin:0}
.scrub:hover{height:6px}

.vp{flex:1;min-height:0;overflow:auto;position:relative;background:#fff}
.pad{padding:18px 20px 40px;max-width:1500px}
.rail{display:flex;align-items:center;gap:10px;padding:12px 20px 0;flex-wrap:wrap}
.rail .seg button{height:28px}

/* cards */
.card{background:#fff;border:1px solid rgb(0 0 0/.07);border-radius:10px;box-shadow:var(--sh-xs);min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:12px 14px 0;min-height:36px}
.ch h3{margin:0;font-size:13px;font-weight:600}
.ch .sub{font-size:11.5px;color:var(--i500)}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.cb{padding:10px 14px 14px}
.lnk{color:var(--az6);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.lnk:hover{text-decoration:underline}
.facts{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 14px}
.fact{display:flex;flex-direction:column}
.fact .k{font-size:11px;color:var(--i500)}
.fact .v{font:600 18px/1.2 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fact .v small{font-size:12px;color:var(--i500);font-weight:500}

/* module cards */
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.mc{position:relative;overflow:hidden;border-radius:10px;border:1px solid rgb(0 0 0/.06);background:#fff;box-shadow:var(--sh-sm);padding:14px 16px 8px;text-align:left;width:100%;display:block;transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s}
.mc:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.mc.dimmed>.mi{opacity:.55}
.mc.running::after{content:"";position:absolute;top:0;bottom:0;left:-120%;width:60%;background:linear-gradient(100deg,transparent,rgb(255 255 255/.75),transparent);animation:shimmer-sweep 3.5s ease-in-out infinite;pointer-events:none}
.mc-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.mc-t{flex:1}
.mc-t b{display:block;font-size:15.5px;line-height:1.25}
.mc-t span{font-size:10.5px;color:var(--i500);font-weight:500}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring .rs{width:44px;height:44px}
.ring.spin .rs{animation:ring-spin 4s ease-in-out infinite}
.ring .lb{position:absolute;inset:0;display:grid;place-items:center;font:600 10.5px var(--sans);color:var(--i700)}
.spark{display:block;width:100%;height:30px;margin-bottom:8px}
.bar{height:5px;border-radius:5px;background:var(--i100);overflow:hidden;margin-bottom:9px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.mc-s{display:flex;align-items:center;font-size:11.5px;color:var(--i500);gap:10px}
.mc-s .c{margin-left:auto;font-weight:600}
.mc-m{font-size:11.5px;color:var(--i700);margin:6px 0 2px;display:flex;gap:6px;align-items:center;min-height:19px;flex-wrap:wrap}
.chev{display:flex;justify-content:center;opacity:.3;padding-top:2px}
.chev svg{transition:transform .2s}
.mc.open .chev svg{transform:rotate(180deg)}
.tree{margin-top:8px;border:1px solid var(--i150);border-radius:10px;background:#fff;padding:6px;font-size:12px}
.tn{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;width:100%;text-align:left;color:var(--i700)}
.tn:hover{background:var(--i100)}
.tn .m{margin-left:auto;font-size:11px;color:var(--i500)}
.tn.grp{font-weight:600;color:var(--i900)}
.tn.leaf{padding-left:22px}
.gl{width:13px;height:13px;flex:none;display:grid;place-items:center}
.spn{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--i150);border-top-color:var(--pri);animation:spin .9s linear infinite}

.ovg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.ovg2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.bestbox{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;padding:6px 14px 14px}
.bestbox canvas{width:100%;height:230px;display:block}
.kv{display:flex;flex-direction:column;gap:9px}
.kv .r{display:flex;flex-direction:column;border-bottom:1px solid var(--i100);padding-bottom:7px}
.kv .r:last-child{border:0}
.kv .k{font-size:11px;color:var(--i500)}
.kv .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kv .v small{font-size:11px;font-weight:500;color:var(--i500)}
canvas.curve{width:100%;display:block;cursor:crosshair}
.summary{font:15px/1.7 var(--serif);color:var(--i800)}
.summary p{margin:0 0 8px}
.ver{font:500 10.5px var(--mono);color:var(--i500);background:var(--i100);border-radius:5px;padding:1px 6px}
.now{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i700);background:var(--sky);border-radius:8px;padding:7px 10px;margin-bottom:10px}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{font-weight:500;color:var(--i500);text-align:left;padding:6px 8px;border-bottom:1px solid var(--i150);white-space:nowrap;font-size:11px}
table.t td{padding:7px 8px;border-bottom:1px solid var(--i100);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.cl{cursor:pointer}
table.t tr.cl:hover td{background:var(--i50)}
table.t tr.hl td{background:#f5f9ff}
table.t tr.fut td{color:var(--i350)}
.af{display:flex;flex-direction:column}
.af-r{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--i100);font-size:12.5px;line-height:1.45}
.af-r:last-child{border:0}
.af-r .tm{font:11px var(--mono);color:var(--i400);width:46px;flex:none;padding-top:1px}
.av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.fresh{animation:glow 1.6s ease-out}

/* agents view */
.agv{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:100%;min-height:0}
.feedcol{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--i150)}
.feedbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--i150);flex-wrap:wrap}
.fpill{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--i150);font-size:11.5px;color:var(--i700);display:inline-flex;align-items:center;gap:6px;background:#fff}
.fpill.on{background:var(--i900);color:#fff;border-color:var(--i900)}
.fpill .cnt{font-size:10px;opacity:.7}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;height:28px;border:1px solid var(--i150);border-radius:8px;padding:0 8px;color:var(--i500);background:#fff}
.search input{border:0;outline:none;font-size:12px;width:140px;background:none}
.feed{flex:1;overflow:auto;padding:8px 18px 18px;min-height:0}
.fe{max-width:860px}
.dv{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-size:11px;font-weight:600}
.dv::before,.dv::after{content:"";height:1px;background:var(--i150);flex:1}
.dv span{padding:2px 9px;border-radius:999px;border:1px solid}
.dv.flash span{animation:flash 1.6s}
.msg{display:flex;gap:10px;padding:7px 0}
.msg .body{font-size:13.5px;line-height:1.6;color:var(--i800);min-width:0}
.msg .who{font-size:11.5px;font-weight:600;color:var(--i900);margin-bottom:1px;display:flex;gap:8px;align-items:center}
.msg .who .tm{font:400 10.5px var(--mono);color:var(--i400)}
.hum{display:flex;justify-content:flex-end;padding:8px 0}
.hum .bub{max-width:70%}
.tool{border:1px solid var(--i150);border-radius:10px;margin:6px 0 6px 30px;background:#fff;overflow:hidden}
.tool .th{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;text-align:left;font-size:12px}
.tool .th:hover{background:var(--i50)}
.tool .tn2{font:600 12px var(--mono);color:var(--i900)}
.tool .ta{font:11px var(--mono);color:var(--i500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.tool .tr{font-size:11.5px;color:var(--i600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.tool .tb{display:none;border-top:1px solid var(--i150);background:var(--i50)}
.tool.open .tb{display:block}
.tool.open .th .cv{transform:rotate(180deg)}
.tool.err{border-color:#fecaca}
pre.log{margin:0;padding:9px 12px;font:11.5px/1.6 var(--mono);color:var(--i700);white-space:pre-wrap;max-height:220px;overflow:auto}
pre.log .w{color:var(--a700);background:var(--a50)} pre.log .e{color:var(--r700);background:var(--r50)} pre.log .o{color:var(--e700)}
.tres{padding:10px 12px;border-top:1px dashed var(--i150);background:#fff;font-size:12px}
.thumbs{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.thumb{border:1px solid var(--i150);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.thumb canvas{display:block;width:230px;height:120px}
.thumb .cap{font-size:10.5px;color:var(--i500);padding:3px 8px;border-top:1px solid var(--i100)}
.subag{border:1px solid #e3dcfd;border-radius:10px;margin:6px 0 6px 30px;background:#fcfbff}
.subag .sh{display:flex;align-items:center;gap:8px;padding:7px 10px;width:100%;text-align:left;font-size:12px;font-weight:600;color:#5b21b6}
.subag .sbd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 10px 10px}
.subag.closed .sbd{display:none}
.sa{background:#fff;border:1px solid var(--i150);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5}
.sa b{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:3px}
.agside{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--i50);min-height:0}
.agside .card .cb{padding-top:6px}
.ros{display:flex;flex-direction:column;gap:2px}
.ro{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--i100);font-size:12px}
.ro:last-child{border:0}
.ro .meta{font-size:10.5px;color:var(--i500)}
.ro .last{color:var(--i700);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.plan{list-style:none;margin:0;padding:0;font-size:12px;display:flex;flex-direction:column;gap:7px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan .gl{margin-top:2px}
.dlog{font-size:12px;display:flex;flex-direction:column;gap:8px}
.dlog .e{border-left:2px solid var(--i200);padding-left:8px}
.dlog .e.u{border-color:var(--t600)}
.dlog .tm{font:10.5px var(--mono);color:var(--i400)}
.fc-bot{border-top:1px solid var(--i150);padding:10px 16px 12px;background:#fff}
.fc-bot .composer{margin:0;max-width:860px}

/* design space */
.dsg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--i600);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.ln{width:14px;height:0;border-top:2px dashed var(--e500);border-radius:0}
.legend i.fr{width:14px;height:0;border-top:2px solid var(--i700);border-radius:0}
canvas.grid{width:100%;display:block;image-rendering:pixelated}
.bstat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tip{position:fixed;z-index:60;pointer-events:none;background:#fff;border:1px solid var(--i150);border-radius:10px;box-shadow:var(--sh-lg);padding:8px 10px;font-size:12px;min-width:170px;display:none}
.tip b{font-family:var(--mono);font-size:12px}
.tip .g{display:grid;grid-template-columns:auto auto;gap:1px 12px;margin-top:4px;color:var(--i600)}
.tip .g span:nth-child(even){text-align:right;color:var(--i900);font-variant-numeric:tabular-nums}

/* chip */
.chipg{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}
.cmpg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 260px;gap:14px;align-items:stretch}
.cmpc canvas{width:100%;height:210px;display:block}
.mix{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:6px 0}
.mixl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:11.5px;color:var(--i600)}
.mixl i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-top:4px}
.dl{color:var(--e700);font-weight:600} .dl.up{color:var(--r700)}
.ovl{position:absolute;left:14px;top:46px;display:flex;gap:18px;pointer-events:none}
.ovl .fact .v{font-size:20px}

/* signal */
.sg2{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:14px;margin-top:14px;align-items:start}
.bit{display:flex;flex-direction:column;gap:10px}
.big{font:600 34px/1.1 var(--serif);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big small{font:500 14px var(--sans);color:var(--i500)}
.prog{height:8px;border-radius:6px;background:var(--i100);overflow:hidden}
.prog i{display:block;height:100%;background:var(--e500);border-radius:6px}
.circs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.circ{border:1px solid var(--i150);border-radius:7px;padding:5px 6px;font:10px var(--mono);text-align:center;color:var(--i500);background:#fff}
.circ.ok{border-color:#a7f3d0;background:var(--e50);color:var(--e700)}
.circ.bad{border-color:#fecaca;background:var(--r50);color:var(--r700)}
.circ.run{border-color:#bfdbfe;background:var(--sky);color:var(--az7)}
.ck{color:var(--moss)}
.xk{color:var(--r600)}

/* cost */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--i500);display:flex;align-items:center;gap:6px}
.kpi .v{font:600 24px/1.2 var(--sans);letter-spacing:-.015em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--i500)}
.cg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.hb{display:grid;grid-template-columns:86px 1fr 62px;gap:6px 10px;align-items:center;font-size:12px}
.hb .tr{height:12px;background:var(--i100);border-radius:3px;overflow:hidden;display:flex}
.hb .tr i{display:block;height:100%}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:flex;align-items:center;gap:10px;border:1px solid var(--i150);border-radius:9px;padding:8px 10px;font-size:12px;text-align:left;width:100%;background:#fff}
.rung.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri);background:#f7fbff}
.rung .p{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.rung small{display:block;color:var(--i500);font-size:11px}

/* report */
.paper{max-width:780px;margin:0 auto;padding:30px 28px 60px;font:16px/1.75 var(--serif);color:var(--i800)}
.paper h1{font:600 32px/1.12 var(--serif);letter-spacing:-.015em;color:var(--i900);margin:8px 0 10px}
.paper h2{font:600 20px/1.3 var(--serif);color:var(--i900);margin:30px 0 8px}
.paper p{margin:0 0 12px}
.paper .lede{font-size:17.5px;color:var(--i700)}
.paper table.t{font-family:var(--sans);font-size:12.5px;margin:6px 0 10px}
.draft{font:12.5px/1.5 var(--sans);background:var(--sky);color:var(--az7);border-radius:10px;padding:9px 12px;display:flex;gap:8px;align-items:center}
.review{font-family:var(--sans);border:1px solid var(--i150);border-radius:12px;padding:14px 16px;background:var(--i50);font-size:13px;line-height:1.55}
.review li{margin:3px 0}
.files{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-family:var(--sans)}
.file{border:1px solid var(--i150);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;font-size:12.5px}
.file:hover:not(:disabled){border-color:var(--i200);box-shadow:var(--sh-sm)}
.file:disabled{opacity:.55;cursor:default}
.file small{color:var(--i500);font-size:11px}
.lg-bar{height:8px;border-radius:4px;background:var(--pri);display:block;min-width:2px}

/* start */
.start{flex:1;overflow:auto}
.st-in{max-width:820px;margin:0 auto;padding:64px 24px 60px}
.greet{font:500 38px/1.08 var(--serif);letter-spacing:-.02em;margin:0 0 10px;color:var(--i900)}
.st-sub{font-size:15px;color:var(--i500);margin:0 0 26px;max-width:640px}
.bigcomp{border:1px solid var(--i150);border-radius:16px;background:#fff;box-shadow:var(--sh-lg);padding:14px 14px 10px 16px}
.bigcomp textarea{width:100%;border:0;outline:none;resize:none;font-size:15px;line-height:1.55;min-height:96px;background:none}
.bc-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.bc-row .pill{height:30px;font-size:12px;padding:0 11px}
.startbtn{margin-left:auto;height:34px;padding:0 14px;border-radius:999px;background:var(--i900);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.startbtn:hover{background:var(--i800)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.preset{text-align:left;border:1px solid var(--i150);border-radius:12px;padding:12px 14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.preset:hover{border-color:var(--i200);box-shadow:var(--sh-sm)}
.preset.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.preset b{font-size:13.5px}
.preset p{margin:2px 0 0;font-size:12px;color:var(--i500);line-height:1.45}
.st-h{font:600 18px var(--serif);margin:40px 0 10px;display:flex;align-items:center;gap:10px}
.prov{border:1px solid var(--i150);border-radius:16px;background:#fff;box-shadow:var(--sh-lg);padding:22px 22px}
.prov h4{margin:0 0 12px;font:600 18px var(--serif)}
.prov .ps{display:flex;gap:10px;align-items:center;font-size:13px;padding:5px 0;color:var(--i600)}
.prov .ps.done{color:var(--i900)}

/* popover, toasts */
.pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--i150);border-radius:12px;box-shadow:var(--sh-2xl);padding:10px;min-width:240px;max-width:min(420px,calc(100vw - 16px));font-size:12.5px;display:none}
.pop h5{margin:2px 4px 8px;font-size:12px;font-weight:600}
.pop .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px;border-radius:8px}
.pop .opt:hover{background:var(--i100)}
.pop .opt.on{background:#f5f9ff}
.pop .opt small{display:block;color:var(--i500);font-size:11px}
.pop .opt .r{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--i700);font-weight:500;white-space:nowrap}
.pop .note{font-size:11px;color:var(--i500);padding:6px 8px 2px;border-top:1px solid var(--i100);margin-top:6px}
.pop .fr{display:grid;grid-template-columns:90px 1fr 92px;gap:6px;align-items:center;padding:4px}
.pop input[type=number]{width:80px;height:28px;border:1px solid var(--i150);border-radius:7px;padding:0 7px}
.toasts{position:fixed;right:16px;transition:right .2s;bottom:16px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#fff;border:1px solid var(--i150);border-radius:10px;box-shadow:var(--sh-lg);padding:10px 14px;font-size:12.5px;display:flex;gap:9px;align-items:center;max-width:360px;animation:tin .25s ease-out}

@keyframes aii-blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes ring-spin{0%{transform:rotate(0)}16%{transform:rotate(360deg)}33%{transform:rotate(720deg)}50%,100%{transform:rotate(1080deg)}}
@keyframes shimmer-sweep{0%{left:-120%}50%,100%{left:170%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%{background:#eef5ff}100%{background:transparent}}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px rgb(59 130 246/.3)}100%{box-shadow:none}}
@keyframes tin{from{transform:translateY(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

@container main (max-width:1320px){
  .clock{display:none}
  .sbest .xtra,.sbest .tag{display:none}
}
@container main (max-width:1180px){
  .sbest .lbl{display:none}
  .dsg{grid-template-columns:minmax(0,1fr) 290px}
}
@container main (max-width:1000px){
  .strip{flex-wrap:wrap;row-gap:6px}
  .tracker{order:1;width:100%;overflow-x:auto}
  .sbest{order:2}
  .pb{order:3}
  #bRedirect{order:4}
  .ovg,.ovg2,.dsg,.chipg,.cg,.sg2{grid-template-columns:minmax(0,1fr)}
  .cmpg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cmpg>:last-child{grid-column:1/-1}
  .agv{grid-template-columns:minmax(0,1fr)}
  .agside{display:none}
  .demo .lg{display:none}
  .title{max-width:130px}
  #devSeg .lbx,#bShare .lbx{display:none}
  .topbar{gap:8px}
}
@container main (max-width:760px){
  .cards3,.kpis{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bestbox{grid-template-columns:minmax(0,1fr)}
  .cmpg{grid-template-columns:minmax(0,1fr)}
  .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;row-gap:6px}
  .sbest{flex-basis:100%}
  .tb-sp{display:none}
  .pad{padding:14px 12px 40px}
  .subag .sbd{grid-template-columns:minmax(0,1fr)}
  .files{grid-template-columns:minmax(0,1fr)}
  .presets{grid-template-columns:minmax(0,1fr)}
  .greet{font-size:30px}
  .st-in{padding:28px 16px 40px}
  .tool,.subag{margin-left:0}
  table.t .opt{display:none}
  .paper{padding:20px 16px 40px}
  .paper h1{font-size:26px}
}
body.hopen .toasts{right:376px}
@media (max-width:1200px){
  body.hopen .toasts{right:16px}
  .helper.open{position:absolute;right:0;top:0;bottom:0;z-index:50;box-shadow:var(--sh-2xl)}
  #app{position:relative}
}
@media (max-width:1100px){
  .sb{width:64px}
  .sb .brand,.sb-new span,.sb-nav span,.sb-sec,.run-i .nm,.run-i .acts,.acct .tx,.acct .meter,.acct .ux{display:none!important}
  .sb-new{justify-content:center;padding:0}
  .sb-nav button,.run-i{justify-content:center}
}
@media (max-width:760px){
  .sb{display:none;position:fixed;z-index:60;left:0;top:0;bottom:0;width:240px;box-shadow:var(--sh-2xl)}
  .sb.mopen{display:flex}
  .sb.mopen .brand,.sb.mopen .sb-new span,.sb.mopen .sb-nav span,.sb.mopen .sb-sec,.sb.mopen .run-i .nm,.sb.mopen .acct .tx{display:revert!important}
  .mhead{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px;border-bottom:1px solid var(--i150);flex:none}
  .helper.open{width:100%}
  .search input{width:90px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sb" id="sb">
    <div class="sb-top">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/><path d="M10 12h4" stroke="#60a5fa"/></svg></div>
      <span class="brand">Chipwright</span>
    </div>
    <button class="sb-new" id="sbNew" title="New design"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg><span>New design</span></button>
    <nav class="sb-nav">
      <button data-nav="designs" title="Designs"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></svg><span>Designs</span></button>
      <button data-nav="gallery" title="Gallery"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Gallery</span></button>
      <button data-nav="usage" title="Usage"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg><span>Usage</span></button>
      <button data-nav="settings" title="Settings"><svg class="ic" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>Settings</span></button>
    </nav>
    <div class="sb-sec">Runs</div>
    <div class="runs" id="runs"></div>
    <div class="acct">
      <div class="row"><span class="avatar">YO</span><span class="tx">Your workspace</span></div>
      <div class="ux" style="font-size:11px;color:var(--i500);display:flex;justify-content:space-between"><span>This month</span><span class="num" id="acctUse">$41.20 of $150</span></div>
      <div class="meter"><i id="acctBar" style="width:27%"></i></div>
    </div>
  </aside>

  <div class="main" id="main">
    <div class="mhead"><button class="ib" id="mMenu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="brand" style="font:600 16px var(--serif)">Chipwright</span></div>

    <section class="screen" id="startScr">
      <div class="start" id="startBody"></div>
    </section>

    <section class="screen hide" id="runScr">
      <header class="topbar">
        <span class="title" id="runTitle" contenteditable="true" spellcheck="false" title="Rename"></span>
        <div class="seg sm" id="devSeg" role="group" aria-label="Device">
          <button data-dev="eeg"><svg class="ic s" viewBox="0 0 24 24"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5"/></svg><span class="lbx">EEG seizure</span></button>
          <button data-dev="nirs"><svg class="ic s" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="lbx">Brain oxygen</span></button>
        </div>
        <div class="tb-sp"></div>
        <div class="seg" id="tabs" role="tablist">
          <button data-tab="overview">Overview</button>
          <button data-tab="agents">Agents</button>
          <button data-tab="views">Views</button>
          <button data-tab="report">Report</button>
        </div>
        <div class="tb-sp"></div>
        <span class="demo" title="All numbers on this screen are invented for the mock-up"><span class="lg">Simulated run, </span>demo data</span>
        <button class="btn" id="bShare"><svg class="ic s" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span class="lbx">Share</span></button>
        <button class="btn" id="bOut">Outputs<svg class="ic s" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
        <button class="ib" id="bHelper" title="Steer panel"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg></button>
      </header>
      <div class="strip" id="strip">
        <div class="tracker" id="tracker"></div>
        <div class="sbest" id="sBest"></div>
        <div class="pb">
          <button class="ib" id="bPlay" title="Pause"></button>
          <button class="ib" id="bRestart" title="Restart run"><svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
          <select class="sel" id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
          <button class="live" id="live" title="Jump to live"><i></i><span>LIVE</span></button>
          <span class="clock" id="clock"></span>
        </div>

function costAt(t){
 const m=MODES[S.mode], cp=COMPUTE.find(c=>c.k===S.compute).p, cpu=COMPUTE[1].p;
 const o={llm:0,cmp:0,st:{},ag:{},gpuH:0,cpuH:0};
 for(const v of IV){const dt=clamp(t-v.a,0,v.b-v.a);if(!dt)continue;
  const l=LLM_RATE[v.s]*dt*m.llm; o.llm+=l; o.st[v.s]=(o.st[v.s]||{llm:0,cmp:0}); o.st[v.s].llm+=l;
  for(const[a,f] of Object.entries(AG_SPLIT[v.s])) o.ag[a]=(o.ag[a]||0)+l*f;
  let gh=0,ch=0; const hrs=dt*SC/3600;
  if(v.s==='reference') gh=hrs; if(v.s==='train') gh=hrs*m.batch/2048*(v.r===0?.5:1); if(v.s==='compile'||v.s==='verify') ch=hrs*8;

/* module cards */
const MODS=[{n:'Set up',sub:'Spec, Reference',icon:'target',ivs:v=>v.s==='spec'||v.s==='reference'},{n:'Design loop',sub:'Propose to Verify, 4 rounds',icon:'cpu',ivs:v=>v.r>=0&&v.r<4},{n:'Report',sub:'Datasheet, review, files',icon:'file',ivs:v=>v.s==='report'}];
function modState(i,d){const iv=IV.filter(MODS[i].ivs);const a=iv[0].a,b=iv[iv.length-1].b;const p=clamp((d.t-a)/(b-a),0,1);const st=d.t>=b?'done':d.t<a?'pending':d.paused?'paused':'running';
 let cost=0;for(const v of iv){const s=d.cost.st[v.s];} // per-stage costs are aggregated below
 const c=costAt(Math.min(d.t,b)).total-costAt(Math.min(d.t,a)).total;
 return{p,st,a,b,cost:c,mins:Math.max(0,Math.min(d.t,b)-a)*SC/60}}
function cardsHTML(){return MODS.map((m,i)=>`<div><button class="mc" data-mc="${i}"><div class="mi mc-h"><span class="tile" style="background:${GBG[i]};color:${GC[i]}">${ic(m.icon,'ic','width:18px;height:18px;stroke-width:1.8')}</span><span class="mc-t"><b>${m.n}</b><span class="tg">${m.sub}</span></span><span class="ring"><svg class="rs" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="#f3f3f6" stroke-width="3"/><circle class="arc" cx="22" cy="22" r="19" fill="none" stroke="${GC[i]}" stroke-width="3" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 22 22)"/></svg><span class="lb"></span></span></div><canvas class="mi spark"></canvas><div class="mi bar"><i style="background:linear-gradient(90deg,${GC[i]},${GC[i]}80)"></i></div><div class="mi mc-m"></div><div class="mi mc-s"><span class="du"></span><span class="tk2"></span><span class="c"></span></div><div class="chev"><svg width="12" height="6" viewBox="0 0 12 6"><path d="M1 .5 6 5.5 11 .5" fill="none" stroke="#1a1a2e" stroke-width="1.4" stroke-linecap="round"/></svg></div></button><div class="tree hide" data-tree="${i}"></div></div>`).join('')}
function mountCards(root){$$('.mc',root).forEach(b=>b.onclick=()=>{const i=+b.dataset.mc;S.openCards.has(i)?S.openCards.delete(i):S.openCards.add(i);V._sig={};tickUI(true)})}
function updateCards(root,d){
 MODS.forEach((m,i)=>{const el=$(`.mc[data-mc="${i}"]`,root);if(!el)return;const s=modState(i,d);
  const k=`${s.st}|${Math.round(s.p*100)}|${s.cost.toFixed(2)}|${d.best?.id}|${d.st.s}|${S.openCards.has(i)}|${i===1?d.n:''}`;
  if(!sig('mc'+i,k))return;
  el.classList.toggle('running',s.st==='running');el.classList.toggle('dimmed',s.st==='pending'||s.st==='done');el.classList.toggle('open',S.openCards.has(i));
  el.style.borderColor=s.st==='running'?GC[i]+'59':'';el.style.boxShadow=s.st==='running'?`0 0 0 1px ${GC[i]}1a, var(--sh-sm)`:'';
  const ring=$('.ring',el);ring.classList.toggle('spin',s.st==='running');$('.rs',ring).style.animationDelay=`-${performance.now()%4000}ms`;
  const arcP=s.st==='running'?Math.max(.06,s.p):s.p; $('.arc',el).setAttribute('stroke-dashoffset',(119.4*(1-arcP)).toFixed(1));
  $('.lb',ring).innerHTML=s.st==='done'?`<span style="color:${GC[i]}">${ic('check','ic')}</span>`:s.st==='paused'?`<span class="muted">${ic('pause','ic s')}</span>`:`${Math.round(s.p*100)}%`;
  $('.tg',el).textContent=s.st==='paused'?'paused':m.sub;
  $('.bar i',el).style.width=(s.p*100)+'%';
  $('.du',el).textContent=s.mins>0?durTxt(s.mins*60/SC):' ';
  $('.tk2',el).textContent=s.cost>0?`${fi(s.cost/MODES[S.mode].llm/7.2*1e6*.9/1000)}k tokens`:'';
  $('.c',el).textContent=s.st==='pending'?' ':usd(s.cost);
  const L=S.sim.L; let met='';
  if(i===0) met=`<span class="tag n">sens ≥${L.sens}%</span><span class="tag n">spec ≥${L.spec}%</span><span class="tag n">≤${fi(L.budget)} gates</span>`;
  if(i===1) met=d.best?`<span class="tag b">best ${fi(d.best.g)} gates</span><span class="tag n">path ${d.best.dp}</span><span class="tag ${d.best.g>L.budget?'warn':'ok'}">sens ${d.best.sens}%</span>`:(s.st==='pending'?'<span class="muted">Waits for the reference</span>':`<span class="tag n">${fi(d.n)} trained</span>`);
  if(i===2) met=s.st==='pending'?'<span class="muted">Starts after round 4</span>':s.st==='done'?'<span class="tag ok">datasheet and 3 files</span>':'<span class="tag n">writing datasheet</span>';
  $('.mc-m',el).innerHTML=met;

  const tr=$(`[data-tree="${i}"]`,root); tr.classList.toggle('hide',!S.openCards.has(i)); if(S.openCards.has(i)) tr.innerHTML=treeHTML(i,d), $$('[data-leaf]',tr).forEach(x=>x.onclick=()=>{const[s,r]=x.dataset.leaf.split(':');focusFeed(s,+r)});
 });
}
function treeHTML(i,d){
 const gl=(a,b)=>d.t>=b?`<span class="gl" style="color:var(--e600)">${ic('check')}</span>`:d.t>=a?`<span class="gl">${d.paused?`<span style="color:var(--a700)">${ic('pause')}</span>`:spn()}</span>`:`<span class="gl" style="color:var(--i300)">○</span>`;
 const leaf=v=>`<button class="tn leaf" data-leaf="${v.s}:${v.r}">${gl(v.a,v.b)}${stageName(v.s)}<span class="m">${d.t>=v.a?durTxt(Math.min(d.t,v.b)-v.a):''}</span></button>`;
 if(i===1) return S.sim.rounds.map((R,r)=>{const iv=IV.filter(v=>v.r===r);const a=iv[0].a,b=iv[3].b;const done=d.t>=b;return`<div class="tn grp">${gl(a,b)}Round ${r+1}<span class="m">${done?`${R.best.id}, ${fi(R.best.g)} gates`:d.t>=a?'running':''}</span></div>${d.t>=a&&d.t<b?iv.map(leaf).join(''):''}`}).join('');
 if(i===0) return IV.filter(v=>v.s==='spec'||v.s==='reference').map(leaf).join('');
 const v=IV.find(v=>v.s==='report');return[['Datasheet',75,80.5],['Export files',80.8,82.6],['Final review',83,86.5]].map(([n,a,b])=>`<button class="tn leaf" data-leaf="report:4">${gl(a,b)}${n}</button>`).join('');
}
function drawSpark(cv,i,d){const{ctx,w,h}=fit(cv);ctx.clearRect(0,0,w,h);const iv=IV.filter(MODS[i].ivs);const a=iv[0].a,b=iv[iv.length-1].b;const N=40;const pts=[];
 for(let k=0;k<N;k++){const tt=a+(b-a)*k/(N-1);if(tt>d.t)break;const st=stageAt(tt);pts.push((LLM_RATE[st.s]||0)*(.7+.6*h01(k*7+i*101))) }
 if(pts.length<2){ctx.strokeStyle='#e8e8ec';ctx.beginPath();ctx.moveTo(0,h-2);ctx.lineTo(w,h-2);ctx.stroke();return}
 const mx=.32;ctx.beginPath();pts.forEach((v,k)=>{const x=k/(N-1)*w,y=h-2-(v/mx)*(h-4);k?ctx.lineTo(x,y):ctx.moveTo(x,y)});

/* ---------- drawing: design-space curve ---------- */
function curveGeom(w,h,mini){const d=S.sim.d;const pad=mini?{l:30,r:8,t:8,b:18}:{l:50,r:16,t:14,b:36};const x0=Math.log10(d.gR[0]),x1=Math.log10(d.gR[1]),y0=d.yR[0],y1=d.yR[1];
 return{pad,X:g=>pad.l+(Math.log10(g)-x0)/(x1-x0)*(w-pad.l-pad.r),Y:s=>pad.t+(1-(clamp(s,y0,y1)-y0)/(y1-y0))*(h-pad.t-pad.b),x0,x1,y0,y1}}
function drawCurve(cv,opt={}){
 const{ctx,w,h}=fit(cv);const mini=!!opt.mini;const tMax=opt.tMax??S.t;const L=S.sim.L;const G=curveGeom(w,h,mini);const{X,Y,pad}=G;
 ctx.clearRect(0,0,w,h);ctx.font=`${mini?9:10.5}px ${getComputedStyle(document.body).fontFamily}`;
 // grid
 ctx.strokeStyle='#f0f0f3';ctx.lineWidth=1;ctx.fillStyle='#8a8a99';
 const ticks=[50,100,200,500,1000,2000,5000,10000,20000,50000].filter(g=>Math.log10(g)>=G.x0&&Math.log10(g)<=G.x1);
 ticks.forEach(g=>{const x=Math.round(X(g))+.5;ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,h-pad.b);ctx.stroke();if(!mini||[100,1000,10000].includes(g)){ctx.textAlign='center';ctx.fillText(g>=1000?(g/1000)+'k':g,x,h-pad.b+(mini?11:15))}});
 for(let s=70;s<=100;s+=mini?10:5){const y=Math.round(Y(s))+.5;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(s+'%',pad.l-5,y+3)}
 if(!mini){ctx.fillStyle='#6c6c85';ctx.textAlign='center';ctx.fillText('Chip size, logic gates (log scale)',pad.l+(w-pad.l-pad.r)/2,h-4);ctx.save();ctx.translate(12,pad.t+(h-pad.t-pad.b)/2);ctx.rotate(-Math.PI/2);ctx.fillText('Worst-patient sensitivity',0,0);ctx.restore()}
 // budget region
 const bx=X(L.budget);ctx.fillStyle='rgba(245,158,11,.05)';ctx.fillRect(bx,pad.t,w-pad.r-bx,h-pad.t-pad.b);
 ctx.setLineDash([4,4]);ctx.strokeStyle='#f59e0b';ctx.beginPath();ctx.moveTo(bx,pad.t);ctx.lineTo(bx,h-pad.b);ctx.stroke();
 ctx.strokeStyle='#10b981';ctx.lineWidth=1.5;const ly=Y(L.sens);ctx.beginPath();ctx.moveTo(pad.l,ly);ctx.lineTo(w-pad.r,ly);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
 if(!mini){ctx.fillStyle='#047857';ctx.textAlign='left';ctx.fillText(`Clinical line, sensitivity ${L.sens}% on every patient`,pad.l+6,ly-5);ctx.fillStyle='#b45309';ctx.textAlign='left';ctx.fillText(`Gate budget ${fi(L.budget)}`,bx+5,pad.t+11)}
 // dots
 const all=S.sim.all;const n=opt.tMax!=null?nVis(tMax):nVis(S.t);const sz=mini?1.6:2.4;
 for(let i=0;i<n;i++){const c=all[i];const passS=c.spec>=L.spec;ctx.fillStyle=passS?ROUND_C[c.r]:'#cfd0da';ctx.globalAlpha=passS?(mini?.55:.6):.6;const x=X(c.g),y=Y(c.sens);ctx.fillRect(x-sz/2,y-sz/2,sz,sz)}
 ctx.globalAlpha=1;
 if(!mini){for(let i=Math.max(0,n-60);i<n;i++){const c=all[i];const age=tMax-c.tf;if(age<.5){ctx.strokeStyle=ROUND_C[c.r];ctx.globalAlpha=1-age/.5;ctx.beginPath();ctx.arc(X(c.g),Y(c.sens),2+age*14,0,7);ctx.stroke()}}ctx.globalAlpha=1}

   const tasks=S.sim.events.filter(e=>e.type==='tool'&&e.t<=d.t);let sum=0;

  const pad={l:44,r:12,t:10,b:24};const cap=25;const ymax=cap*1.12;const X=t=>pad.l+t/END*(w-pad.l-pad.r);const Y=v=>pad.t+(1-v/ymax)*(h-pad.t-pad.b);

  const N=120,pts=[];for(let k=0;k<=N;k++){const t=Math.min(d.t,k/N*END);pts.push([t,costAt(t)]);if(k/N*END>d.t)break}
  ctx.beginPath();ctx.moveTo(X(0),Y(0));pts.forEach(([t,c])=>ctx.lineTo(X(t),Y(c.cmp)));ctx.lineTo(X(pts[pts.length-1][0]),Y(0));ctx.fillStyle='#1e3a8a';ctx.fill();
  ctx.beginPath();pts.forEach(([t,c],k)=>k?ctx.lineTo(X(t),Y(c.total)):ctx.moveTo(X(t),Y(c.total)));for(let k=pts.length-1;k>=0;k--)ctx.lineTo(X(pts[k][0]),Y(pts[k][1].cmp));ctx.fillStyle='rgba(59,130,246,.55)';ctx.fill();
  ctx.strokeStyle='#2563eb';ctx.lineWidth=1.5;ctx.beginPath();pts.forEach(([t,c],k)=>k?ctx.lineTo(X(t),Y(c.total)):ctx.moveTo(X(t),Y(c.total)));ctx.stroke();ctx.lineWidth=1;
  if(d.t<END){ctx.setLineDash([3,4]);ctx.strokeStyle='#9a9aa8';ctx.beginPath();ctx.moveTo(X(d.t),Y(d.cost.total));for(let t=d.t;t<=END;t+=2)ctx.lineTo(X(t),Y(costAt(t).total));ctx.lineTo(X(END),Y(costAt(END).total));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#6c6c85';ctx.textAlign='right';ctx.fillText(`forecast ${usd(costAt(END).total)}`,X(END),Y(costAt(END).total)-6)}
  ctx.setLineDash([5,4]);ctx.strokeStyle='#ef4444';ctx.beginPath();ctx.moveTo(pad.l,Y(cap));ctx.lineTo(w-pad.r,Y(cap));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#b91c1c';ctx.textAlign='left';ctx.fillText('Spend cap $25: the run wraps up if it gets here',pad.l+6,Y(cap)-5);
 }
};

VIEW_DEFS.report={
 html:()=>`<div class="paper" id="rp"></div>`,
 mount(){},
 update(d){
  const fin=d.t>=END;const k=`${fin}|${d.bestRound}|${d.st.s}|${S.redirects.length}`;if(!sig('rp',k))return;
  const{d:dv,L,rounds}=S.sim;const c=d.best;const rp=$('#rp');
  if(!c){rp.innerHTML=`<div class="draft">${ic('file')}The datasheet starts once round 1 has a verified chip, at ${fmtRun(RB(0)+16)}. Until then this page shows the spec it will be checked against.</div><h1>Datasheet: ${esc(dv.name.replace('Newborn','newborn'))} chip</h1><p class="lede">${esc(S.prompt&&S.screen?dv.prompt:dv.prompt)}</p><h2>Spec</h2><table class="t"><tbody><tr><td>Inputs</td><td>${dv.inBits}</td></tr><tr><td>Output</td><td>${dv.outD}</td></tr><tr><td>Clinical line</td><td>Sensitivity ≥${L.sens}% and specificity ≥${L.spec}% on every one of ${dv.patients} unseen patients</td></tr><tr><td>Gate budget</td><td>${fi(L.budget)} gates</td></tr></tbody></table><h2>Gates per diagnosis</h2>${ledgerHTML(true)}`;return}
  const pr=pm(c),A=arch(c);
  rp.innerHTML=`${fin?'':`<div class="draft">${spn()}Draft. The Reviewer rewrites this page until the run finishes; numbers below are for the current chip.</div>`}
  <div style="font:12px var(--sans);color:var(--i500);margin-top:14px">Design report, ${esc(dv.name)}</div>
  <h1>${c.id}: a ${fi(c.g)}-gate ${dv.decision} for the ${esc(dv.name.replace('Newborn','newborn'))}</h1>
  <p class="lede">The chip reads ${dv.inBits.toLowerCase()} and ${dv.key==='eeg'?'decides, for every 4-second window, whether it shows seizure activity':'turns them into a brain-oxygen value and an alarm below 55%'}. On ${dv.patients} patients it never trained on, its worst patient reaches ${c.sens}% sensitivity and ${c.spec}% specificity, against a line of ${L.sens}% and ${L.spec}%. The circuit gives the same output bits as its model on all ${fi(dv.windows)} test windows.</p>
  <h2>Numbers</h2><table class="t"><tbody><tr><td>Gates</td><td class="n">${fi(c.g)}</td><td class="muted">budget ${fi(L.budget)}${c.g>L.budget?', over':''}</td></tr><tr><td>Longest path</td><td class="n">${c.dp} gates</td><td class="muted">input pin to answer pin</td></tr><tr><td>Structure</td><td class="n">${A.ws.map(fi).join(' / ')}</td><td class="muted">LUT-${A.k} neurons per layer, then a ${fi(A.decG)}-gate decision block</td></tr><tr><td>Input bits</td><td class="n">${fi(A.inBits)}</td><td class="muted">${A.bits}-bit features</td></tr><tr><td>Bit-for-bit check</td><td class="n">${fi(dv.windows)} / ${fi(dv.windows)}</td><td class="muted">circuit against model, identical outputs</td></tr><tr><td>Patients meeting the line</td><td class="n">${pr.filter(x=>x.ok).length} / ${pr.length}</td><td class="muted">every patient checked on its own</td></tr></tbody></table>
  <h2>Per patient</h2><table class="t"><thead><tr><th>Patient</th><th class="n">Windows</th><th class="n">Sensitivity</th><th class="n">Specificity</th></tr></thead><tbody>${pr.map(x=>`<tr><td>${x.p}</td><td class="n">${fi(x.w)}</td><td class="n">${x.sens.toFixed(1)}%</td><td class="n">${x.spec.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
  <h2>How it was found</h2><p>Four rounds of propose, train, compile and verify, ${fi(rounds.reduce((a,R)=>a+R.n,0))} candidates in all. Each round the agents kept the family that held accuracy at the smallest size and changed one thing.</p>
  <table class="t"><thead><tr><th>Round</th><th>Choice</th><th class="n">Gates</th><th class="n">Sens</th><th>What changed next</th></tr></thead><tbody>${rounds.map((R,r)=>d.t>=RB(r)+16?`<tr><td>${r+1}</td><td class="mono">${R.best.id}</td><td class="n">${fi(R.best.g)}</td><td class="n">${R.best.sens}%</td><td>${r<3?esc(dv.notes[r]):'chosen'}${R.redirects.length?` (your redirect: ${esc(R.redirects.map(x=>x.short).join('; '))})`:''}</td></tr>`:'').join('')}</tbody></table>
  <h2>Limits</h2><p>Tested against recorded data from a demo set of ${dv.train+dv.patients} patients, ${dv.patients} of them held out. This is a design and a data check, not a clinical validation: it has not been tested on a device, in a ward, or on patients from other sites. ${dv.key==='eeg'?'The chip expects band-power features from an analogue front end that is not part of this design. ':'The chip assumes calibrated light readings; skin tone, probe placement and ambient light were not varied. '}One decision per window is assumed because the brief set no latency target.</p>
  <h2>Final review</h2><div class="review">${fin?`<b style="color:var(--moss)">${ic('check')} 6 of 6 checks pass</b>, one note carried forward.`:`<b>${spn()} In progress</b>, the Reviewer signs off at the end of the run.`}<ul><li>Bit-for-bit check present for the chosen circuit</li><li>Every number above traced to the log that produced it</li><li>Held-out patients never used in training or selection</li><li>Each patient clears the line, not only the average</li><li>Limits stated</li><li>Note: the one-decision-per-window assumption should be confirmed</li></ul></div>
  <h2>Files</h2><div class="files"><button class="file" data-f="v" ${fin?'':'disabled'}>${ic('cpu','ic')}<b>${c.id}.v</b><small>${fin?'Gate-level Verilog':'Ready when the run finishes'}</small></button><button class="file" data-f="report" ${fin?'':'disabled'}>${ic('file','ic')}<b>datasheet.md</b><small>${fin?'This report as text':'Ready when the run finishes'}</small></button><button class="file" data-f="log" ${fin?'':'disabled'}>${ic('check','ic')}<b>verification.csv</b><small>${fin?'Per-patient results':'Ready when the run finishes'}</small></button></div>
  <h2>Gates per diagnosis</h2>${ledgerHTML(true)}`;
  $$('[data-f]',rp).forEach(b=>b.onclick=()=>download(b.dataset.f));
 }
};

function download(kind){
 const d=D();const c=d.best;if(!c)return;const dv=S.sim.d;let name,txt;
 if(kind==='v'){name=c.id+'.v';const A=arch(c);txt=`// ${c.id}: ${dv.name}, ${c.g} gates, longest path ${c.dp}\n// Mock-up output with invented values. Not a real netlist.\nmodule chip_${c.id.replace('-','_')} (\n  input  wire [${A.inBits-1}:0] x,\n  output wire ${dv.key==='eeg'?'seizure':'[6:0] rso2,\n  output wire alarm'}\n);\n  // layer widths: ${A.ws.join(', ')} LUT-${A.k} neurons; decision ${A.decG} gates\n  // ... ${c.g} gate instances omitted in the demo ...\nendmodule\n`}
 else if(kind==='log'){name='verification.csv';txt='patient,windows,identical,sensitivity,specificity\n'+pm(c).map(x=>`${x.p},${x.w},${x.w},${x.sens},${x.spec}`).join('\n')+'\n'}
 else{name='datasheet.md';txt=`# ${c.id}\n\n${dv.name}. ${c.g} gates, longest path ${c.dp}. Worst-patient sensitivity ${c.sens}%, specificity ${c.spec}%.\nDemo data, not clinically validated.\n`}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast(`Downloaded ${name}`,'dl');
}

/* ---------- helper (steer) panel ---------- */
function openHelper(){S.helper=true;$('#helper').classList.add('open');document.body.classList.add('hopen');renderHelper();setTimeout(()=>{V&&(V._sig={})},0)}
function closeHelper(){S.helper=false;$('#helper').classList.remove('open');document.body.classList.remove('hopen');V&&(V._sig={})}
$('#hClose').onclick=closeHelper;
function modePop(anchor,cb){openPop(anchor,`<h5>Send as</h5><button class="opt ${S.sendMode==='Chat'?'on':''}" data-m="Chat">${ic('spark','ic')}<span>Chat<small>Steer this run from the next batch</small></span></button><button class="opt ${S.sendMode==='Fork'?'on':''}" data-m="Fork">${ic('fork','ic')}<span>Fork<small>Copy the run up to here and apply the note there</small></span></button>`,p=>$$('[data-m]',p).forEach(b=>b.onclick=()=>{S.sendMode=b.dataset.m;closePop();cb&&cb();renderHelper()}))}
$('#hMode').onclick=e=>modePop(e.currentTarget);
$('#hMod').onclick=e=>openPop(e.currentTarget,`<h5>Send to</h5>${MODS.map((m,i)=>`<button class="opt ${i===1?'on':''}">${ic(m.icon,'ic')}<span>${m.n}</span></button>`).join('')}`);
$('#hSend').onclick=()=>{const v=$('#hIn').value.trim();if(!v)return;$('#hIn').value='';if(S.helperMode==='guide')guideReply(v);else sendRedirect(v)};
$('#hIn').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#hSend').click()}};
let guideMsgs=[];
function renderHelper(){
 if(!S.helper)return;const g=S.helperMode==='guide';
 $('#hTitle').textContent=g?'Guide me':'Steer this run';
 $('#hMode').style.display=g?'none':'';$('#hMod').style.display=g?'none':'';$('#hMode').innerHTML=S.sendMode+ic('chev');
 const hs=$('#hState');
 if(g){hs.className='h-state';hs.innerHTML=`${ic('spark')}<span>Tell me about the device. I will write the prompt and set the line, budget, compute and agents for you.</span>`;
  $('#hMsgs').innerHTML=[{ai:1,t:'What does the device measure, and what should it decide? For example: "a newborn EEG monitor that flags seizures".'},...guideMsgs].map(m=>`<div class="bub ${m.ai?'ai':'me'}">${m.ai?'<span class="who">Guide</span>':''}${esc(m.t)}</div>`).join('');
  $('#hSugg').innerHTML=['A newborn EEG monitor that flags seizures','A brain-oxygen sensor for newborns'].map(s=>`<button class="chipbtn">${s}</button>`).join('');$$('#hSugg button').forEach(b=>b.onclick=()=>guideReply(b.textContent));return}
 const d=S.sim?D():null;const paused=d&&d.paused;
 hs.className='h-state'+(paused?' paused':'');
 hs.innerHTML=!d?'':d.ended?`${ic('check')}<span>The run has finished. A note now would start a fork from Verify.</span>`:paused?`${ic('pause')}<span>Paused at ${stageName(d.st.s)}${d.st.r>=0&&d.st.r<4?`, round ${d.st.r+1}`:''}. Type a redirect; the agents answer and change the next round. Then resume.</span>`:`${spn()}<span>The run is live. A redirect pauses it while the agents answer, and applies from the next batch.</span>`;
 const msgs=S.redirects.flatMap(x=>[`<div class="bub me">${esc(x.text)}</div>`,S.pending.includes(x.id)?`<div class="bub ai"><span class="who">Architect</span><span class="typing"><i></i><i></i><i></i></span></div>`:`<div class="bub ai"><span class="who">Architect</span>${esc(x.reply)}</div>`]);
 $('#hMsgs').innerHTML=msgs.length?msgs.join(''):`<div class="bub ai"><span class="who">Architect</span>I'm working on ${d?stageName(d.st.s).toLowerCase():'the run'}${d&&d.st.r>=0&&d.st.r<4?` in round ${d.st.r+1}`:''}. You can change the gate target, the accuracy margin or the longest path; I'll say what it changes before the next batch.</div>`;
 $('#hMsgs').scrollTop=1e6;
 const sug=['Fewer gates, accept 2 points lower sensitivity','Keep more sensitivity margin','Keep the longest path under 12 gates'];
 $('#hSugg').innerHTML=d&&!d.ended?sug.map(s=>`<button class="chipbtn">${s}</button>`).join(''):'';
 $$('#hSugg button').forEach(b=>b.onclick=()=>{$('#hIn').value=b.textContent;$('#hIn').focus()});
}
function guideReply(v){guideMsgs.push({t:v});const eeg=/eeg|seiz|brain.?wave/i.test(v),nirs=/oxygen|nirs|infra|light/i.test(v);
 if(eeg||nirs){S.device=eeg?'eeg':'nirs';S.prompt=DEV[S.device].prompt;guideMsgs.push({ai:1,t:`Set up the ${DEV[S.device].name.replace('Newborn','newborn')}: I wrote the prompt, set the line to sensitivity ${S.line[S.device].s}% and specificity ${S.line[S.device].p}% per patient, a ${fi(S.line[S.device].b)}-gate budget, GPU Basic for the training batches and Pro mode. Press Start design when it looks right.`});S.compute='gpu1';S.mode='Pro';renderStart()}
 else guideMsgs.push({ai:1,t:'I can set up any sensing device, but this demo only has data for the newborn EEG seizure monitor and the brain-oxygen sensor. Which one is closer?'});
 renderHelper()}
function classify(text){const s=text.toLowerCase();
 if(/fewer|smaller|less gate|cheaper|tiny|shrink|reduce|lower gate|under \d/.test(s))return{k:'smaller',fx:{g:.78,s:-1.1,dp:-1},short:'fewer gates, lower sensitivity margin accepted'};
 if(/sensitiv|accura|margin|safer|miss/.test(s))return{k:'margin',fx:{g:1.24,s:1,dp:1},short:'more sensitivity margin, larger chip accepted'};
 if(/depth|latency|path|shallow|faster|delay/.test(s))return{k:'shallow',fx:{g:1.06,s:-.2,dp:-3},short:'shorter longest path'};
 return{k:'note',fx:{g:.96,s:-.1,dp:0},short:'soft preference: '+text.slice(0,50)};
}
let rid=0;
function sendRedirect(text){
 if(!S.sim)return;const t=S.live;const c=classify(text);let from=-1;for(let r=0;r<4;r++){if(RB(r)+3>t){from=r;break}}
 const oldNext=from>=0?{...S.sim.rounds[from].best}:null;
 const x={id:rid++,t,text,k:c.k,short:c.short,fx:from>=0?c.fx:null,from};S.redirects.push(x);
 const wasPlaying=S.playing;S.playing=false;
 build();
 if(from>=0){const nb=S.sim.rounds[from].best,L=S.sim.L;
  const pct=Math.round((1-nb.g/oldNext.g)*100);
  x.reply={smaller:`Understood. From round ${from+1} I'll push the batch toward smaller designs: the projected choice drops from about ${fi(oldNext.g)} to ${fi(nb.g)} gates (${pct}% fewer), with worst-patient sensitivity near ${nb.sens}%. The clinical line of ${L.sens}% still holds on every patient; I won't trade below it.`,
   margin:`Understood. From round ${from+1} I'll rank by sensitivity margin before size. Expect the choice to grow to about ${fi(nb.g)} gates (from ${fi(oldNext.g)}) with worst-patient sensitivity near ${nb.sens}%.`,
   shallow:`Understood. From round ${from+1} I'll cap the longest path: about ${nb.dp} gates instead of ${oldNext.dp}, at roughly ${fi(nb.g)} gates in total. Shallower circuits need slightly more gates.`,
   note:`Noted. I'll apply it as a soft preference from round ${from+1}; projected choice about ${fi(nb.g)} gates. If you meant a hard limit, say the number.`}[c.k];
 } else x.reply=`Round 4's batch is already training, so this can't change this run. Fork from Verify to run a fifth round with this instruction; I've noted it in the report.`;
 if(S.sendMode==='Fork')x.reply='Forked from here. '+x.reply;
 S.sim.events=buildEvents();S.sim.decisions=buildDecisions();
 S.pending.push(x.id);renderHelper();V&&(V._sig={});
 setTimeout(()=>{S.pending=S.pending.filter(i=>i!==x.id);renderHelper();V&&(V._sig={});toast(from>=0?`Plan revised from round ${from+1}. Resume when ready.`:'Noted for a fork.','spark','var(--t600)')},1100);
 if(!S.helper){S.helperMode='steer';openHelper()}
}

/* ---------- loop ---------- */
let last=performance.now(),lastUI=0;
function tickUI(force){if(S.screen!=='run'||!S.sim||!V)return;const d=D();renderStrip(d);V.update&&V.update(d);
 if(S.helper&&S.helperMode==='steer'){const k=`${d.paused}|${d.st.s}|${d.st.r}|${d.ended}`;if(tickUI._h!==k){tickUI._h=k;renderHelper()}}
 if(force||performance.now()-tickUI._r>2000){tickUI._r=performance.now();renderRuns()}}
tickUI._r=0;
function loop(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;
 if(S.screen==='run'&&S.sim){
  if(S.playing&&S.t<END){S.t=Math.min(END,S.t+dt*S.speed);if(S.t>S.live)S.live=S.t;if(S.t>=END){S.playing=false;toast('Run finished. The datasheet and files are ready.','check','var(--e600)')}}
  const{b}=bestAt(S.t);
  if(b&&b.id!==S.lastBest){if(S.lastBest!==null&&S.t>=S.live-.05){toast(`New chip: <b class="mono">${b.id}</b>, ${fi(b.g)} gates${b.g<=S.sim.L.budget?', in budget':''}`,'cpu')}S.chipAnim=now;S.lastBest=b.id}
  if(!b&&S.lastBest)S.lastBest=null;
  if(now-lastUI>110){lastUI=now;tickUI()}
  if(V&&V.frame)V.frame(D(),now);
 }
 requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
window.addEventListener('hashchange',()=>{const h=readHash();if(!h)return;if(h==='start'){if(S.screen!=='start'){S.screen='start';S.playing=false;showScreen()}return}if(S.screen!=='run'){S.view=h;launch();return}if(h!==S.view)setView(h)});
window.addEventListener('resize',()=>{if(V)V._sig={}});
(function boot(){const h=readHash();if(h&&h!=='start'){S.view=h;launch()}else{showScreen()}requestAnimationFrame(loop)})();
</script>
