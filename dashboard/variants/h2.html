<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipIn</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='%233D6DF0' stroke-width='7' d='M53 12.5H23A10.5 10.5 0 0 0 12.5 23V41A10.5 10.5 0 0 0 23 51.5H53'/%3E%3Crect fill='%233D6DF0' x='26' y='25' width='14' height='14' rx='1.5'/%3E%3C/svg%3E">
<style>
:root{
  --wash:#f4f6fa;--card:#fff;--glass:rgb(250 251 254 / .8);--glass-s:rgb(250 251 254 / .96);
  --i900:#131a33;--i800:#2b3250;--i700:#3c4360;--i600:#4a5170;--i550:#535a78;--i500:#5c6382;--i400:#666d8a;--i300:#a4a9bd;--i200:#d5d8e3;--i150:#e6e9f1;--i100:#eff2f8;
  --co:#3d6df0;--cot:#2950c8;--cod:#1f3fa6;--cobg:#eaf0ff;--cor:#bccdfb;
  --blue:#3d6df0;--blue6:#3d6df0;--blue7:#2950c8;--teal:#0f766e;
  --ok:#12a26f;--okt:#0f7a55;--okbg:#e8f5ee;--okr:#a9dcc4;
  --bad:#d23b2f;--badt:#b42318;--badbg:#fdeeec;--badr:#f6c4bd;
  --warn:#c2680c;--warnt:#7a3d06;--warnbg:#fff4e2;--warnr:#f1cd8f;
  --fa:#a16207;
  /* the four kinds of assumption: one colour each */
  --k-people:#6d28d9;--k-people-bg:#f4efff;--k-rec:#0f766e;--k-rec-bg:#e6f5f2;--k-dev:#2950c8;--k-dev-bg:#ecf1ff;--k-bar:#be123c;--k-bar-bg:#fdeef1;
  /* scientists */
  --s-lead:#6d28d9;--s-lead-bg:#f2ecff;--s-train:#2950c8;--s-train-bg:#e9efff;--s-build:#9a4a0b;--s-build-bg:#fdf0e4;--s-check:#0f7a55;--s-check-bg:#e6f5ee;
  --st-data:#0f766e;--st-data-bg:#e3f5f2;--st-plan:#6d28d9;--st-plan-bg:#f1ebff;--st-tune:#2950c8;--st-tune-bg:#e8eeff;
  --st-build:#9a4a0b;--st-build-bg:#fff3e2;--st-check:#0f7a55;--st-check-bg:#e6f7ef;
  --navy:#0f1733;--navy2:#17224a;
  --hair:rgb(19 26 51 / .07);--hair4:rgb(19 26 51 / .06);--hair8:rgb(19 26 51 / .1);
  --sh-hair:0 1px 3px rgb(19 26 51 / .05);--sh-menu:0 6px 24px rgb(19 26 51 / .12);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wash);color:var(--i900);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--cot)}
:focus-visible{outline:2px solid var(--co);outline-offset:2px;border-radius:6px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--hair4);transition:width .15s var(--ease);z-index:30;position:relative}
.sb-head{height:54px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--hair4);flex:none}
.mark{width:26px;height:26px;flex:none;display:block}
.wordmark{font-size:15px;font-weight:700;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;color:var(--i900)}
.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .1s}
.sq:hover{background:rgb(19 26 51 / .05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--i600);font-size:12.5px;font-weight:500;text-align:left;transition:background .1s;white-space:nowrap}
.nav button svg.ic{width:18px;height:18px}
.nav button:hover{background:rgb(19 26 51 / .035)}
.nav button.on{background:rgb(61 109 240 / .09);color:var(--i900)}
.nav .count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--cot);background:rgb(61 109 240 / .1);border-radius:99px;padding:1px 7px;font-style:normal}
.divider{height:1px;background:var(--hair4);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px;min-height:0}
.cap{font-size:11px;font-weight:600;color:var(--i550);padding:10px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);cursor:pointer;transition:background .1s}
.row:hover{background:rgb(19 26 51 / .035)}
.row.on{background:rgb(61 109 240 / .09);color:var(--i900)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550);flex:none}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row .more:hover{background:rgb(19 26 51 / .06)}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:0;box-shadow:0 0 0 2px var(--co);border-radius:4px;padding:2px 4px;background:#fff}
.pending-bar{flex:1;height:8px;border-radius:4px;background:var(--i150);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair4);padding:8px;flex:none}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(19 26 51 / .035)}
.av{width:28px;height:28px;border-radius:50%;background:var(--navy2);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:11px;color:var(--i550)}
#sb.col{width:52px}
#sb.col .wordmark,#sb.col .mark,#sb.col .nav span,#sb.col .nav .count,#sb.col .runs,#sb.col .acct .who,#sb.col .divider{display:none}
#sb.col .sb-head{justify-content:center;padding:0}
#sb.col .nav button{justify-content:center;padding:0}
#sb.col .acct button{justify-content:center;padding:6px 0}
.runs-spacer{display:none}
#sb.col .runs-spacer{display:block;flex:1}
#mh{display:none;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:8px;padding:0 10px;background:var(--glass-s);border-bottom:1px solid var(--hair4);z-index:25;backdrop-filter:blur(12px)}
#scrim{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .2);z-index:29}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#demo{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--i600);pointer-events:none;z-index:5;background:rgb(244 246 251 / .94);padding:2px 8px;border-radius:6px}


/* ---------- Start page: calm band, the prompt, the effort levels explained in place ---------- */
.start{flex:1;overflow:auto;padding:28px 28px 80px}
.start-col{width:100%;max-width:860px;margin:0 auto}
.band{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:30px 36px 66px;background:radial-gradient(120% 150% at 84% 20%,#24377a 0%,#16225a 42%,#0f1733 80%);transition:padding .3s var(--ease)}
.band::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgb(255 255 255 / .04) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .04) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(100deg,transparent 30%,#000 100%);-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 100%)}
.band .lock{height:30px;width:auto;display:block;position:relative;z-index:1}
.band h1{position:relative;z-index:1;margin:46px 0 0;font-size:38px;line-height:1.08;font-weight:650;letter-spacing:-.028em}
.band p{position:relative;z-index:1;margin:12px 0 0;color:#c9d3f2;font-size:15px;max-width:46ch;line-height:1.5}
.start.asking .band{padding:18px 28px 50px}
.start.asking .band h1{margin-top:18px;font-size:24px}
.start.asking .band p{display:none}
.box{background:#fff;border:1px solid var(--hair8);border-radius:20px;box-shadow:0 10px 30px -12px rgb(19 26 51 / .22);padding:16px 16px 12px 20px}
.start .box{margin:-38px 22px 0;position:relative;z-index:3}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:15px;line-height:1.5;min-height:22px;max-height:280px;padding:0;display:block;color:var(--i900)}
.box textarea::placeholder{color:var(--i500)}
.box textarea:focus-visible{outline:0}
.box.locked textarea{color:var(--i700)}
.ctl{display:flex;align-items:center;gap:8px;margin-top:10px;min-height:38px;flex-wrap:wrap}
.ctl .grow{flex:1}
.ctl .cv-mic{margin:0}
.chipin{height:38px;padding:0 18px;border-radius:11px;background:var(--co);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:background .12s,opacity .12s;white-space:nowrap}
.chipin:hover{background:var(--cot)}
.chipin.off{background:#c4d1f5;color:#24365f}
.chipin .mk{width:16px;height:16px}
.textbtn{font-size:12.5px;font-weight:550;color:var(--cot);padding:6px 8px;border-radius:7px}
.textbtn:hover{background:rgb(61 109 240 / .08)}
.textbtn.quiet{color:var(--i600)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i500);flex:none;transition:all .12s}
.send.ready{background:var(--co);color:#fff}
.send svg.ic{width:18px;height:18px;stroke-width:2}
.pill{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:10px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:550;color:var(--i800);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--i100)}
.pill svg.ic{width:14px;height:14px}
.pill .chev{width:12px;height:12px;opacity:.6}
.effort{margin:20px 22px 0}
.effort-h{display:flex;align-items:center;gap:10px;margin:0 0 9px;flex-wrap:wrap}
.effort-h h2{font-size:13.5px;font-weight:650;margin:0;color:var(--i800)}
.effort-h .hint{font-size:12.5px;color:var(--i600)}
.effort-h .grow{flex:1}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.lv button{text-align:left;border:1.5px solid var(--i200);border-radius:14px;background:#fff;padding:12px 13px 11px;display:flex;flex-direction:column;gap:3px;transition:border-color .12s,background .12s,box-shadow .12s;min-width:0}
.lv button:hover{border-color:#9db4f5}
.lv button.on{border-color:var(--co);background:var(--cobg);box-shadow:0 0 0 3px rgb(61 109 240 / .12)}
.lv b{font-size:14.5px;font-weight:650;color:var(--i900)}
.lv .l1{font-size:12.5px;color:var(--i700);line-height:1.4}
.lv .l3{font-size:12px;color:var(--i600);line-height:1.4}
.lv .l2{font-size:12px;color:var(--i600);margin-top:auto;padding-top:7px;border-top:1px solid var(--hair4)}
.lv .l2 strong{color:var(--i900);font-weight:650;font-size:13px}
.lv-sum{display:none;font-size:12.5px;color:var(--i600)}
.lv-sum b{color:var(--i900);font-weight:600}
.start.asking .lv{display:none}
.start.asking .lv-sum{display:inline}
.start.asking .effort-h .hint{display:none}

/* ---------- Intake: one question below the other ---------- */
.stack{margin:18px 22px 0;display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:20px;align-items:start}
.steps{display:flex;flex-direction:column;gap:10px;min-width:0}
.blk{background:#fff;border:1px solid var(--hair8);border-radius:18px;padding:18px 20px 16px;box-shadow:0 10px 26px -20px rgb(19 26 51 / .4)}
.blk.enter{animation:blkin .38s var(--ease)}
@keyframes blkin{from{opacity:0;transform:translateY(12px)}}
.blk .qn{font-size:12px;font-weight:600;color:var(--i550);margin:0 0 4px}
.blk h2{font-size:18.5px;font-weight:650;letter-spacing:-.012em;margin:0 0 4px;line-height:1.3}
.blk .ih{font-size:13px;color:var(--i600);margin:0 0 12px;line-height:1.5}
.blk .bfoot{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.blk .bfoot .grow{flex:1}
.drow{display:grid;grid-template-columns:136px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 10px 9px 16px;background:#fff;border:1px solid var(--hair8);border-radius:13px}
.drow .k{font-size:12px;color:var(--i600);font-weight:550}
.drow .v{font-size:13.5px;color:var(--i900);font-weight:550;line-height:1.4;min-width:0}
.drow.skipped .v{color:var(--i600);font-weight:450}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ans{min-height:76px;border:1.5px solid var(--i200);border-radius:14px;padding:13px 14px;text-align:left;display:flex;gap:11px;align-items:flex-start;background:#fff;transition:border-color .12s,background .12s}
.ans:hover{border-color:#9db4f5;background:#f8faff}
.ans.sel{border-color:var(--co);background:var(--cobg)}
.ans b{display:block;font-size:14.5px;font-weight:600;color:var(--i900);line-height:1.3}
.ans span{display:block;font-size:12.5px;color:var(--i600);margin-top:3px;line-height:1.4}
.ans svg.ic{width:20px;height:20px;color:var(--cot);margin-top:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt2{min-height:36px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--i200);background:#fff;font-size:13.5px;font-weight:550;color:var(--i800);text-align:left;transition:border-color .12s,background .12s;display:inline-flex;align-items:center;gap:7px}
.opt2:hover{border-color:#9db4f5}
.opt2.sel{border-color:var(--co);background:var(--cobg);color:var(--cod)}
.opt2 .box2{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--i300);display:grid;place-items:center;flex:none;background:#fff}
.opt2 .box2.rd{border-radius:50%}
.opt2.sel .box2{background:var(--co);box-shadow:none;color:#fff}
.opt2 .box2 svg{width:11px;height:11px}
.multi-note{font-size:12px;color:var(--cot);font-weight:600;margin:0 0 8px}
.searchbox{margin-top:14px;border:1px solid var(--hair8);border-radius:14px;padding:12px 14px;background:#fbfcfe}
.searchbox .sh{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--i900)}
.searchbox .sh .n{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--i600);font-variant-numeric:tabular-nums}
.searchbox .sh .g{width:16px;height:16px;display:grid;place-items:center}
.arch{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.arch span{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--i100);color:var(--i600);transition:background .4s,color .4s}
.arch span.on{background:var(--st-data-bg);color:var(--st-data)}
.cands{list-style:none;margin:8px 0 0;padding:0}
.cands li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--hair4);font-size:13.5px;line-height:1.45;animation:candin .4s var(--ease) both}
@keyframes candin{from{opacity:0;transform:translateY(4px)}}
.cands .mk2{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.cands .mk2 svg{width:12px;height:12px;stroke-width:2.6}
.cands li.fit .mk2{background:var(--okbg);color:var(--okt)}
.cands li.out .mk2{background:var(--badbg);color:var(--badt)}
.cands b{font-weight:600;color:var(--i900)}
.cands .rs{color:var(--i600)}
.cands em{font-style:normal;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.cands li.fit em{background:var(--okbg);color:var(--okt)}
.cands li.out em{background:var(--i100);color:var(--i600)}
.simhow{font-size:13px;color:var(--i700);line-height:1.55;background:#fbfcfe;border:1px solid var(--hair8);border-radius:14px;padding:12px 14px;margin-top:12px}
.simhow ul{margin:6px 0 0;padding-left:18px}
/* assumptions, grouped by kind */
.ahead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ahead .grow{flex:1;min-width:220px}
.agrp{margin-top:16px;--kc:var(--i600);--kb:var(--i100)}
.agrp.people{--kc:var(--k-people);--kb:var(--k-people-bg)}
.agrp.rec{--kc:var(--k-rec);--kb:var(--k-rec-bg)}
.agrp.dev{--kc:var(--k-dev);--kb:var(--k-dev-bg)}
.agrp.bar{--kc:var(--k-bar);--kb:var(--k-bar-bg)}
.agrp h3{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;margin:0 0 6px;color:var(--kc)}
.agrp h3 i{width:9px;height:9px;border-radius:3px;background:var(--kc)}
.arows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:10px 12px 10px 14px;border-radius:12px;background:var(--kb);border-left:3px solid var(--kc);align-items:center}
.arow .av2{font-size:14px;font-weight:600;color:var(--i900);line-height:1.4}
.arow .aw{grid-column:1;font-size:12.5px;color:var(--i700);line-height:1.45}
.arow .ac{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;align-items:center}
.arow .mine{font-size:11px;font-weight:600;color:var(--kc);background:#fff;border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:1px}
.arow input{width:100%;height:34px;border:1px solid #9db4f5;border-radius:8px;padding:0 10px;font-size:13.5px;outline:0;box-shadow:0 0 0 3px rgb(61 109 240 / .12);background:#fff}
.abtn{height:30px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--hair8);background:#fff;color:var(--i800);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.abtn:hover{border-color:#9db4f5}
.abtn svg.ic{width:13px;height:13px}
.abtn.yes.on{background:var(--okt);border-color:var(--okt);color:#fff}
.abtn.chg.on{background:var(--cot);border-color:var(--cot);color:#fff}
.addasm{display:flex;gap:8px;margin-top:14px}
.addasm input{flex:1;min-width:0;height:36px;border:1px dashed #a9b4cc;border-radius:10px;padding:0 12px;font-size:13px;outline:0;background:#fbfcff}
.addasm input:focus{border-style:solid;border-color:#9db4f5}
.addasm select{height:36px;border:1px solid var(--i200);border-radius:10px;background:#fff;font-size:12.5px;padding:0 8px;color:var(--i800)}
/* the estimate and the go */
.estb{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.estb .grow{flex:1;min-width:220px}
.estb .big{font-size:24px;font-weight:650;letter-spacing:-.015em;color:var(--i900)}
.estb .big small{font-size:12px;font-weight:600;color:var(--warnt);background:var(--warnbg);border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:4px;letter-spacing:0}
.estb p{margin:4px 0 0;font-size:13px;color:var(--i600);line-height:1.5}
.chipin.big{height:44px;padding:0 22px;font-size:15px;border-radius:12px}
/* side: what the chip will read */
.side-read{position:sticky;top:0;background:#fff;border:1px solid var(--hair8);border-radius:18px;padding:14px 14px 12px}
.side-read h3{margin:0;font-size:13.5px;font-weight:650}
.side-read p{margin:3px 0 8px;font-size:12.5px;color:var(--i600);line-height:1.45}
.side-read svg{width:100%;height:auto;display:block;font-family:var(--sans)}
.side-read .cap2{font-size:12px;color:var(--i600);line-height:1.45;margin:6px 0 0}
.skipall{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:2px;font-size:12.5px;color:var(--i600)}
.free{display:flex;gap:8px;margin-top:12px;align-items:center}
.free input{flex:1;min-width:0;height:38px;border:1px solid var(--i200);border-radius:10px;padding:0 12px;font-size:13.5px;outline:0;background:#fff}
.free input:focus{border-color:#9db4f5;box-shadow:0 0 0 3px rgb(61 109 240 / .12)}
.free .cv-mic{margin:0}
.ifoot{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--hair4)}
.ifoot .grow{flex:1}
.btn{height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--hair8);background:#fff;font-size:13px;font-weight:550;color:var(--i900);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--i100)}
.btn.blue{background:var(--co);border-color:var(--co);color:#fff}
.btn.blue:hover{background:var(--cot)}
.btn.blue:disabled{background:#c4d1f5;border-color:#c4d1f5;color:#24365f}
.btn.red{background:#dc2626;border-color:#dc2626;color:#fff}
.btn.big{height:40px;padding:0 20px;font-size:14px;font-weight:600;border-radius:11px}
.btn svg.ic{width:15px;height:15px}
.drop{border:1.5px dashed #a9b4cc;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-top:12px;background:#fbfcff;flex-wrap:wrap;transition:background .12s,border-color .12s}
.drop.over{background:var(--cobg);border-color:var(--co)}
.drop .dt{flex:1;min-width:180px;font-size:13px;color:var(--i700);line-height:1.45}
.fread{margin-top:12px;border:1px solid var(--hair8);border-radius:14px;padding:12px 14px;background:#fff}
.fread .fn{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--i900);flex-wrap:wrap}
.fread .fn small{font-weight:500;color:var(--i600);font-size:12.5px}
.fread .rd{margin-top:6px;font-size:13.5px;color:var(--okt);font-weight:550;display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.fread .rd svg.ic{margin-top:2px}
.fread .rd.plain{color:var(--i700);font-weight:500}
.fread .meta{font-size:12px;color:var(--i600);margin-top:4px}
.chs{margin-top:12px}
.chs .chh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:600}
.chs .chh span{font-size:12.5px;font-weight:500;color:var(--i600)}
.chgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ch{height:28px;padding:0 10px;border-radius:8px;border:1.5px solid var(--i200);font-size:12px;font-weight:600;color:var(--i700);background:#fff;font-variant-numeric:tabular-nums}
.ch:hover{border-color:#9db4f5}
.ch.on{border-color:var(--co);background:var(--co);color:#fff}
.ch.dup{border-style:dashed}
.ch small{font-weight:500;opacity:.85}
.search{margin-top:6px;list-style:none;padding:0;display:flex;flex-direction:column;gap:2px}
.search li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13.5px;line-height:1.45;color:var(--i800);animation:popin .2s var(--ease)}
.search li .si{width:18px;height:18px;flex:none;display:grid;place-items:center;margin-top:1px}
.search li .si svg{width:16px;height:16px}
.search li .sv{flex:1}
.search li .sn{font-size:12px;color:var(--i600);white-space:nowrap;font-variant-numeric:tabular-nums}
.search li.drop2 .sv{color:var(--i600)}
.search li.drop2 .sv b{text-decoration:line-through;text-decoration-color:var(--i300);font-weight:600;color:var(--i700)}
.search li.res{font-weight:600}
.sprog{height:3px;border-radius:2px;background:var(--i150);overflow:hidden;margin:4px 0 6px}
.sprog i{display:block;height:100%;background:var(--st-data);transition:width .4s var(--ease)}
.quiet{font-size:12px;color:var(--i600);margin:10px 0 0;line-height:1.5}
.dsrc{border:1px solid var(--hair8);border-radius:14px;padding:12px 16px;margin-top:10px;background:#fff}
.dsrc.top{border-color:#9db4f5;background:#f7f9ff;box-shadow:inset 3px 0 0 var(--co)}
.dsrc .dn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600}
.dsrc .dn a{font-size:12px;font-weight:500}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--i100);color:var(--i700);white-space:nowrap}
.tag.blue{background:var(--cobg);color:var(--cod)}.tag.green{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}.tag.amber{background:var(--warnbg);color:var(--warnt);box-shadow:inset 0 0 0 1px var(--warnr)}
.tag.teal{background:var(--st-data-bg);color:var(--st-data)}.tag.violet{background:var(--st-plan-bg);color:var(--st-plan)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 12px;margin:8px 0 0;font-size:12.5px;line-height:1.45}
.kv dt{color:var(--i550)}.kv dd{margin:0;color:var(--i800)}
.why{margin:8px 0 0;font-size:12.5px;color:var(--i700);line-height:1.5}
.seg{display:inline-flex;background:var(--i100);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:550;color:var(--i700);white-space:nowrap}
.seg button:hover{background:rgb(255 255 255 / .7)}
.seg button.on{background:#fff;color:var(--i900);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.okk{color:var(--okt)}
.seg button.on.chg{color:var(--cod)}
.note{font-size:12px;color:var(--i600);line-height:1.5;margin:12px 0 0}
/* ---------- Popovers, menus, modals ---------- */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair8);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{font-size:11px;font-weight:600;color:var(--i550);padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.sel{background:rgb(61 109 240 / .1)}
.opt:disabled{opacity:.6}
.opt .oh{font-size:11.5px;color:var(--i550);margin-top:1px;line-height:1.35}
.opt .ck{margin-left:auto;color:var(--cot)}
.opt svg.ic{margin-top:1px;color:var(--i550)}
.opt.danger{color:var(--badt)}.opt.danger svg.ic{color:var(--badt)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.modal-bg{position:fixed;inset:0;background:rgb(15 23 51 / .3);display:grid;place-items:start center;padding-top:12vh;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{width:min(560px,92vw);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0 / .2);overflow:hidden;max-height:80vh;display:flex;flex-direction:column}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.modal .mh input{flex:1;border:0;outline:0;font-size:14px}
.modal .mb{padding:8px;max-height:50vh;overflow:auto}
.modal .mp{padding:18px 20px 8px;font-size:14px;line-height:1.55;color:var(--i800);overflow:auto}
.modal .mp h3{margin:0 0 6px;font-size:16px;color:var(--i900)}
.modal .mp h4{margin:14px 0 4px;font-size:13px;color:var(--i900)}
.modal .mp p{margin:0 0 6px}
.modal .mp ul{margin:4px 0 6px;padding-left:18px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;box-shadow:var(--sh-menu);animation:popin .15s}
.dr-bg{position:fixed;inset:0;background:rgb(15 23 51 / .2);animation:fade .15s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(470px,100vw);background:#fff;box-shadow:-12px 0 40px rgb(0 0 0 / .14);display:flex;flex-direction:column;animation:slidein .22s var(--ease)}
@keyframes slidein{from{transform:translateX(28px);opacity:0}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--hair)}
.drawer .dh h2{flex:1;margin:0;font-size:17px;font-weight:650}
.drawer .db{flex:1;overflow:auto;padding:6px 18px 28px}
.drawer h3{font-size:13px;font-weight:650;color:var(--i800);margin:20px 0 4px}
.drawer .lead{font-size:13px;color:var(--i600);margin:0 0 4px;line-height:1.5}
.papers{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.papers li{font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;background:#f6f7fb}
.papers b{display:block;color:var(--i900);font-weight:600}
.papers .src{font-size:12px;color:var(--i600)}
.papers .use{color:var(--i700);margin-top:3px}
.asm-mini{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;line-height:1.5}
.asm-mini li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--hair4)}
.asm-mini li span{flex:1;color:var(--i800)}
/* ---------- Improve this run: a notification, with the two actions on every row ---------- */
.imp-n{background:var(--warnbg);border:1px solid var(--warnr);border-radius:16px;padding:14px 16px 6px;box-shadow:inset 4px 0 0 var(--warn)}
.imp-n .nh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.imp-n .nh .bell{width:28px;height:28px;border-radius:50%;background:var(--warn);color:#fff;display:grid;place-items:center;flex:none}
.imp-n .nh .bell svg.ic{width:15px;height:15px}
.imp-n .nh b{font-size:15px;font-weight:650;color:var(--warnt)}
.imp-n .nh span{font-size:13px;color:#6b4a1f}
.imp-n .nh .grow{flex:1}
.imp-list{list-style:none;margin:10px 0 0;padding:0}
.imp-list>li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 16px;padding:11px 0;border-top:1px solid rgb(122 61 6 / .14);align-items:center}
.imp-list .iq{font-size:14px;font-weight:600;color:var(--i900);line-height:1.4}
.imp-list .ia{grid-column:1;font-size:12.5px;color:#5b4630;line-height:1.45}
.imp-list .ia b{color:var(--i900);font-weight:600}
.imp-list .ib{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px}
.imp-list .ix{grid-column:1 / -1;margin-top:8px;background:#fff;border-radius:12px;padding:12px;border:1px solid var(--warnr)}
.imp-list .ix .opts{margin-bottom:10px}
.imp-list .redo{font-size:12.5px;color:var(--warnt);margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imp-list .redo .grow{flex:1}
.free{display:flex;gap:8px;margin-top:10px;align-items:center}
.free input{flex:1;min-width:0;height:36px;border:1px solid var(--i200);border-radius:10px;padding:0 12px;font-size:13.5px;outline:0;background:#fff}
.free input:focus{border-color:#9db4f5;box-shadow:0 0 0 3px rgb(61 109 240 / .12)}
.imp-done{font-size:12.5px;color:var(--okt);font-weight:600;display:flex;align-items:center;gap:6px}
.imp-done svg.ic{width:14px;height:14px}
.dr-sec h3{font-size:13px;font-weight:650;margin:18px 0 6px}
/* ---------- Run page ---------- */
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:rgb(255 255 255 / .8);border-bottom:1px solid var(--hair4)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tabs button{height:100%;font-size:12.5px;font-weight:550;color:var(--i550);border-bottom:2px solid transparent;padding-top:2px}
.tabs button.on{color:var(--cot);font-weight:650;border-bottom-color:var(--co)}
.tabs button:hover:not(.on){color:var(--i900)}
.state{height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:550;flex:none}
.state.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}
.state.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 240px;color:var(--i800)}
.play{flex:1 1 auto;max-width:440px;display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.pbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.pbtn:hover{background:var(--i100)}
.pbtn svg.ic{width:14px;height:14px}
.clock{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--i100);color:var(--i700);flex:none;font-variant-numeric:tabular-nums}
.clock.live{background:var(--cobg);color:var(--cod)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#9db4f5,var(--co))}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--co);transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.end i{background:linear-gradient(90deg,#a7f3d0,#059669)}.track.end b{background:#059669}
.livep{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:rgb(61 109 240 / .1);color:var(--cod);font-size:10.5px;font-weight:700;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--co);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.impbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:600;color:var(--i800);flex:none}
.impbtn:hover{border-color:#9db4f5}
.impbtn svg.ic{width:14px;height:14px;color:var(--st-build)}
.impbtn em{font-style:normal;min-width:18px;height:18px;border-radius:99px;background:var(--st-build);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.impbtn em.zero{background:var(--i150);color:var(--i600)}
.body{flex:1;min-height:0;overflow:auto;position:relative}
.impbtn{border-color:var(--warnr);background:var(--warnbg);color:var(--warnt)}
.impbtn:hover{border-color:var(--warn)}
.impbtn svg.ic{color:var(--warn)}
.impbtn em{background:var(--warn)}
.impbtn.none{background:#fff;border-color:var(--hair8);color:var(--i800)}
.impbtn.none svg.ic{color:var(--i550)}

/* ---------- Overview: the clinical answer on top, the work in the middle, small facts at the side ---------- */
.ov{max-width:1200px;margin:0 auto;padding:22px 28px 84px;display:flex;flex-direction:column;gap:16px}
.head{background:#fff;border:1px solid var(--hair8);border-radius:20px;padding:18px 22px 16px}
.head .does{font-size:13px;font-weight:600;color:var(--cot);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.head .does .state2{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--i100);color:var(--i700)}
.head .does .state2.fin{background:var(--okbg);color:var(--okt)}
.head h1{font-size:23px;line-height:1.3;font-weight:650;letter-spacing:-.018em;margin:0;color:var(--i900);max-width:60ch}
.head .how{font-size:14.5px;line-height:1.55;color:var(--i700);margin:6px 0 0;max-width:96ch}
.head .how b{color:var(--i900);font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:16px;border-top:1px solid var(--hair4)}
.kpi{padding:12px 14px 2px 0}
.kpi+.kpi{padding-left:16px;border-left:1px solid var(--hair4)}
.kpi .n{font-size:26px;font-weight:650;letter-spacing:-.02em;color:var(--i900);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .n small{font-size:14px;font-weight:600;color:var(--i600);letter-spacing:0}
.kpi .l{font-size:12.5px;color:var(--i600);margin-top:3px;line-height:1.4}
.kpi.good .n{color:var(--okt)}
.kpi.miss .n{color:var(--badt)}
.kpi.wait .n{color:var(--i300)}
.evs{margin-top:14px}
.evs .eh{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--i600);margin-bottom:6px;flex-wrap:wrap}
.evs .eh b{color:var(--i900);font-weight:600}
.evrow{display:flex;flex-wrap:wrap;gap:3px 9px;align-items:flex-end}
.evp{display:flex;gap:2px;padding-bottom:2px}
.evp i{width:7px;height:20px;border-radius:2px;background:var(--ok);display:block}
.evp i.m{background:#fff;box-shadow:inset 0 0 0 1.5px var(--bad)}
.evp i.w{background:var(--i150)}
.evs .lg{display:flex;gap:14px;font-size:12px;color:var(--i600);margin-top:6px;flex-wrap:wrap}
.evs .lg span{display:inline-flex;align-items:center;gap:6px}
.evs .lg i{width:7px;height:14px;border-radius:2px;background:var(--ok)}
.evs .lg i.m{background:#fff;box-shadow:inset 0 0 0 1.5px var(--bad)}
.ctile{display:block;width:100%;text-align:left;background:#f8f9fc;border:1px solid var(--hair8);border-radius:16px;padding:12px 14px;transition:border-color .12s,background .12s}
.ctile:hover{border-color:#9db4f5;background:#fff}
.ctile .cth{font-size:12.5px;font-weight:650;color:var(--i800);display:flex;justify-content:space-between;align-items:center}
.ctile .cth span{color:var(--cot);font-weight:600;display:inline-flex;align-items:center;gap:3px}
.ctile .cth span svg.ic{width:13px;height:13px}
.cdraw{width:100%;height:auto;display:block;margin-top:8px}
.cdraw .wire{stroke:#c5d2f3;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cdraw .cur{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3 9;animation:cur 1.1s linear infinite}
.cdraw .cur.in{stroke:var(--co)}.cdraw .cur.d2{animation-duration:1.25s}
.cdraw .cur.out{stroke:var(--ok);animation-duration:.9s}
.cdraw .pkg{fill:#1b1f2b}
.cdraw .die{fill:#3d6df0}
.cdraw .led{fill:var(--ok);transition:fill .4s}
.cdraw text{font-family:var(--sans);font-size:11px;fill:#3c4360;font-weight:500}
.cdraw text.k{font-weight:650;fill:#131a33;font-size:11.5px}
@keyframes cur{to{stroke-dashoffset:-12}}
.ctile.alarm .cdraw .cur.out{stroke:var(--bad)}
.ctile.alarm .cdraw .led{fill:var(--bad)}
.ctile.nochip .cdraw .cur.out,.ctile.nochip .cdraw .led{display:none}
.ctile.nochip .cdraw .die{fill:#4a5170}
.ctile .ctf{font-size:12.5px;color:var(--i700);margin-top:8px;line-height:1.45}
.ctile .ctf b{color:var(--i900)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:16px;align-items:start}
.card{background:#fff;border:1px solid var(--hair8);border-radius:18px;padding:16px 18px}
.card h2{margin:0;font-size:15px;font-weight:650;color:var(--i900);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-size:12.5px;font-weight:500;color:var(--i600)}
.card h3{margin:0;font-size:13.5px;font-weight:650;color:var(--i900)}
.card .cs{font-size:12.5px;color:var(--i600);margin:3px 0 0;line-height:1.45}
.side,.side-in{display:flex;flex-direction:column;gap:14px;min-width:0}
.side .imp-n{padding:12px 14px 10px}
.side .imp-n .nsub{font-size:12.5px;color:#6b4a1f;margin:6px 0 0;line-height:1.45}
.side .imp-list>li{grid-template-columns:minmax(0,1fr)}
.side .imp-list .ib{grid-column:1;grid-row:auto;margin-top:6px;flex-wrap:wrap}
.side .imp-list .iq{font-size:13.5px}
.side .imp-n>.textbtn{margin-top:2px;padding-left:0}
/* the work list */
.work .nowl{display:flex;align-items:center;gap:10px;margin:8px 0 6px;padding:9px 12px;border-radius:11px;background:var(--cobg);font-size:13.5px;color:var(--cod);font-weight:550}
.work .nowl.fin{background:var(--okbg);color:var(--okt)}
.work .nowl .g{width:14px;height:14px;display:grid;place-items:center;flex:none}
.work .nowl .g svg{width:14px;height:14px}
.wl{list-style:none;margin:6px 0 0;padding:0}
.wl>li{border-top:1px solid var(--hair4)}
.wl>li:first-child{border-top:0}
.wh{display:grid;grid-template-columns:24px minmax(0,1fr) auto 14px;gap:12px;align-items:center;width:100%;padding:11px 4px;text-align:left;border-radius:10px}
.wh:hover{background:#f8f9fc}
.wh:disabled:hover{background:none}
.wi{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--i200);color:var(--i300);background:#fff}
.wi svg.ic{width:12px;height:12px;stroke-width:2.6}
li.past .wi{background:var(--okt);box-shadow:none;color:#fff}
li.cur .wi{box-shadow:inset 0 0 0 2px var(--co);background:var(--cobg)}
li.cur .wi i{width:8px;height:8px;border-radius:50%;background:var(--co);animation:soft 1.8s ease-in-out infinite}
@keyframes soft{50%{opacity:.35}}
.wh .wt{display:block;font-size:14px;font-weight:600;color:var(--i900);line-height:1.35}
.wh .ws{display:block;font-size:12.5px;color:var(--i600);line-height:1.4;margin-top:1px}
.wh .ws b{color:var(--i800);font-weight:600}
li.todo .wh .wt{color:var(--i550);font-weight:500}
.wh time{font-size:12px;color:var(--i600);font-variant-numeric:tabular-nums;white-space:nowrap}
.wh .chev{width:14px;height:14px;color:var(--i400);transition:transform .15s var(--ease)}
li.open .wh .chev{transform:rotate(90deg)}
.wb{padding:0 6px 14px 40px;font-size:13px;color:var(--i700);line-height:1.55}
.wb p{margin:0 0 8px}
.wb .mini{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 12px;font-size:12.5px;margin:6px 0 0}
.wb .mini dt{color:var(--i600)}
.wb .mini dd{margin:0;color:var(--i900)}
.pbar{height:5px;border-radius:3px;background:var(--i150);overflow:hidden;margin:8px 0 2px}
.pbar i{display:block;height:100%;background:var(--co);border-radius:3px;transition:width .5s linear}
.substeps{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.substeps li{font-size:12px;line-height:1.35;color:var(--i600);padding:7px 8px;border-radius:9px;background:#f6f7fb}
.substeps li b{display:block;font-size:13px;color:var(--i900);font-weight:650;font-variant-numeric:tabular-nums}
.substeps li.cur{background:var(--cobg);color:var(--cod)}
.substeps li.cur b{color:var(--cod)}
.substeps li.todo{color:var(--i400)}
.substeps li.todo b{color:var(--i400);font-weight:500}
.rres{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.rres span b{font-weight:650;color:var(--i900)}
.srcl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.srcl li a,.srcl li button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;text-align:left;text-decoration:none;color:inherit;padding:8px 10px;border-radius:10px;background:#f3faf6;border:1px solid #cdeadb}
.srcl li a:hover,.srcl li button:hover{border-color:var(--ok);background:#ecf8f1}
.srcl i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgb(18 162 111 / .18);align-self:center}
.srcl b{font-size:13px;font-weight:600;color:var(--i900);display:block}
.srcl small{font-size:12px;color:var(--i600);display:block;margin-top:1px}
.srcl em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--okt)}
.gapn{background:#f7f8fb;border:1px solid var(--hair8);border-radius:16px;padding:14px 16px}
.gapn h3{display:flex;gap:8px;align-items:center}
.gapn h3 svg.ic{color:var(--st-data)}
.gapn p{font-size:13px;line-height:1.55;color:var(--i700);margin:6px 0 0}
.gapn ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--i700)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.facts div{font-size:12px;color:var(--i600);line-height:1.35}
.facts b{display:block;font-size:15px;font-weight:650;color:var(--i900);font-variant-numeric:tabular-nums}
.facts .estt{font-size:11px;font-weight:600;color:var(--warnt)}
.rchart{width:100%;height:auto;display:block;margin-top:8px;font-family:var(--sans)}
.deeper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 4px 4px 40px}
.deeper p{margin:0;font-size:13px;color:var(--i700);line-height:1.5}
.deeper b{color:var(--i900)}

/* ---------- Chat: one colour per scientist; the team strip unfolds what each is doing ---------- */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.team{flex:none;border-bottom:1px solid var(--hair4);background:rgb(255 255 255 / .7);padding:10px 20px}
.team-in{max-width:760px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.team-in .tl{font-size:12.5px;color:var(--i600);margin-right:4px}
.sci{height:30px;display:inline-flex;align-items:center;gap:7px;padding:0 11px 0 5px;border-radius:99px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:600;color:var(--sc)}
.sci:hover{border-color:var(--sc)}
.sci .sav{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sb);color:var(--sc)}
.sci .sav svg.ic{width:12px;height:12px}
.sci .busy{width:6px;height:6px;border-radius:50%;background:var(--sc);animation:soft 1.8s ease-in-out infinite}
.sci[aria-expanded=true]{background:var(--sb);border-color:var(--sc)}
.act{max-width:760px;margin:10px auto 0;background:#fff;border:1px solid var(--hair8);border-left:3px solid var(--sc);border-radius:12px;padding:12px 14px;animation:blkin .25s var(--ease)}
.act h4{margin:0;font-size:13.5px;color:var(--sc);display:flex;gap:8px;align-items:center}
.act h4 small{color:var(--i600);font-weight:500;font-size:12px}
.act ol{list-style:none;margin:8px 0 0;padding:0}
.act li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:5px 0;font-size:13px;line-height:1.45;color:var(--i800);border-top:1px solid var(--hair4)}
.act li time{font-size:11.5px;color:var(--i600);font-variant-numeric:tabular-nums;padding-top:1px}
.act li.now{color:var(--i900);font-weight:600}
.act li.now time{color:var(--sc)}
.feed{flex:1;overflow:auto;padding:22px 20px 12px}
.feed-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;animation:popin .25s var(--ease)}
.msg .who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sb);color:var(--sc);margin-top:1px}
.msg .who svg.ic{width:15px;height:15px}
.msg .mm{min-width:0;background:#fff;border:1px solid var(--hair8);border-radius:4px 14px 14px 14px;padding:9px 13px 10px;box-shadow:inset 3px 0 0 var(--sc)}
.msg .mn{font-size:12.5px;font-weight:650;color:var(--sc);display:flex;gap:8px;align-items:baseline}
.msg .mn button{font-weight:650;color:var(--sc)}
.msg .mn button:hover{text-decoration:underline;text-underline-offset:3px}
.msg .mn time{font-size:11px;color:var(--i550);font-weight:450;font-variant-numeric:tabular-nums;margin-left:auto}
.msg .mt{font-size:14px;line-height:1.55;color:var(--i900);margin-top:2px}
.tool{margin-left:40px;border:1px solid var(--hair8);border-radius:10px;background:#fbfcfe;animation:popin .25s var(--ease);margin-top:-6px;border-left:3px solid var(--sc)}
.tool>button{width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--i700);text-align:left}
.tool>button svg.ic{width:13px;height:13px;color:var(--sc)}
.tool>button code{font-family:var(--mono);font-size:11px;color:var(--i600);background:var(--i100);border-radius:5px;padding:1px 6px}
.tool>button .chev{margin-left:auto;transition:transform .12s;color:var(--i400)}
.tool.open>button .chev{transform:rotate(90deg)}
.tool pre{margin:0;padding:8px 12px 10px;border-top:1px solid var(--hair4);font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--i700);white-space:pre-wrap;display:none}
.tool.open pre{display:block}
.you{align-self:flex-end;max-width:78%;background:var(--navy2);color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.5;animation:popin .2s}
.typing{display:flex;gap:4px;padding:6px 0 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--i300);animation:soft 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:8px 20px 28px}
.composer .box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.composer textarea{flex:1;padding:8px 0}
.composer .box.off{opacity:.75}
.vnow{max-width:760px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i700);min-height:18px;padding-left:4px}
.vnow .g{width:12px;height:12px;display:grid}
/* ---------- Visual ---------- */
.vis{max-width:1240px;margin:0 auto;padding:14px 24px 40px}
.vtop{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.vh{flex:1;min-width:260px}
.vh h2{font-size:19px;font-weight:650;margin:0;letter-spacing:-.01em}
.vh p{margin:3px 0 0;font-size:13.5px;color:var(--i600);line-height:1.5;max-width:76ch}
.picker{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--hair8);padding:3px;border-radius:11px}
.picker button{height:30px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:550;color:var(--i700);display:inline-flex;align-items:center;gap:4px}
.picker button:hover{color:var(--i900);background:var(--i100)}
.picker button.on{background:var(--navy);color:#fff}
.picker .chev{width:12px;height:12px;opacity:.7}
.stage{position:relative;height:clamp(460px,calc(100dvh - 210px),780px);border-radius:18px;overflow:hidden;background:radial-gradient(120% 95% at 38% 28%,#ffffff 0%,#edf0f6 52%,#dbe0ea 100%);border:1px solid var(--hair8);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.grab{cursor:grab}.stage.grabbing{cursor:grabbing}
.stage>canvas{position:absolute;inset:0;display:block}
.stage.flat{height:auto;background:#fff;padding:16px;cursor:default}
.stage .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--i600)}
.ov3{position:absolute;inset:0;pointer-events:none}
svg.leads{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
svg.leads path{stroke:#131a33;stroke-opacity:.5;stroke-width:1.1;fill:none}
svg.leads circle{fill:#131a33;stroke:#fff;stroke-width:1.5}
.lbl{position:absolute;left:0;top:0;background:rgb(255 255 255 / .97);border:1px solid var(--hair8);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.35;color:var(--i900);box-shadow:0 2px 10px rgb(20 20 40 / .07);visibility:hidden;white-space:normal;}
.lbl b{display:block;font-size:13px;font-weight:650}
.lbl span{display:block;color:var(--i600);font-size:12px}
.lbl.hot{border-color:#f3c48a;box-shadow:inset 3px 0 0 var(--st-build)}
.lbl.alarm{background:#fef2f2;border-color:#fca5a5}
.lbl.alarm b{color:#991b1b}
.lbl.calm b{color:var(--okt)}
.lbl.s1,.lbl.s2{box-shadow:inset 3px 0 0 var(--co)}
.lbl.s1 b,.lbl.s2 b{color:var(--cod)}
.hud{position:absolute;left:16px;top:16px;background:rgb(255 255 255 / .95);border:1px solid var(--hair8);border-radius:12px;padding:10px 14px;max-width:min(380px,calc(100% - 32px));box-shadow:0 2px 10px rgb(20 20 40 / .06)}
.hud.bl{top:auto;bottom:16px}
.hud b{display:block;font-size:14px;font-weight:650}
.hud span{display:block;font-size:12.5px;color:var(--i600);margin-top:2px;line-height:1.4}
svg .halo{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.capt{position:absolute;left:16px;bottom:16px;width:min(420px,calc(100% - 32px));background:rgb(255 255 255 / .96);border:1px solid var(--hair8);border-radius:14px;padding:8px 10px;box-shadow:0 2px 10px rgb(20 20 40 / .06);list-style:none;margin:0;display:flex;flex-direction:column;gap:2px}
.capt li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;padding:5px 4px;border-radius:9px;font-size:12.5px;color:var(--i600);line-height:1.35;transition:background .3s,color .3s}
.capt li i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--i200);color:var(--i600)}
.capt li.on{background:var(--i100);color:var(--i900);font-weight:600}
.capt li.on i{color:#fff;box-shadow:none;background:var(--cc)}
.capt li.past i{color:var(--cc);box-shadow:inset 0 0 0 1.5px var(--cc)}
.capt .cprog{grid-column:2;height:3px;border-radius:2px;background:var(--i150);overflow:hidden;margin-top:3px}
.capt .cprog b{display:block;height:100%;width:0}
.est{position:absolute;left:16px;top:16px;display:flex;gap:8px}
.est div{background:rgb(255 255 255 / .95);border:1px solid var(--hair8);border-radius:12px;padding:8px 12px}
.est dt{font-size:12px;color:var(--i600)}
.est dd{margin:2px 0 0;font-size:16px;font-weight:650;letter-spacing:-.01em;color:var(--i900)}
.est dd small{font-size:11px;font-weight:600;color:var(--warnt);background:var(--warnbg);border-radius:99px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:0}
.stops{position:absolute;left:16px;bottom:16px;display:flex;gap:2px;background:rgb(255 255 255 / .96);border:1px solid var(--hair8);border-radius:99px;padding:3px;box-shadow:0 4px 16px rgb(20 20 40 / .08)}
.stops button{height:32px;padding:0 15px;border-radius:99px;font-size:13px;font-weight:550;color:var(--i700);white-space:nowrap}
.stops button:hover{color:var(--i900);background:var(--i100)}
.stops button.on{background:var(--navy);color:#fff}
.corner{position:absolute;left:16px;top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.corner.br{left:auto;top:auto;right:16px;bottom:16px}
.ghostbtn{height:34px;padding:0 13px;border-radius:10px;background:rgb(255 255 255 / .96);border:1px solid var(--hair8);font-size:12.5px;font-weight:550;color:var(--i800);display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgb(20 20 40 / .06)}
.ghostbtn:hover{border-color:#9db4f5;color:var(--i900)}
.ghostbtn svg.ic{width:14px;height:14px}
.strip{position:absolute;left:16px;top:118px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.strip .sl{font-size:12px;color:var(--i600);background:rgb(255 255 255 / .94);padding:4px 9px;border-radius:99px;border:1px solid var(--hair8)}
.strip .w{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550;background:rgb(255 255 255 / .96);border:1px solid var(--hair8);padding:4px 10px 4px 6px;border-radius:99px;color:var(--i800)}
.strip .w i{background:#22252b;border-radius:2px;display:inline-block}
.strip .w.fin{border-color:#f3c48a;color:#8a3b0c}
canvas.sig{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}
.vact{display:flex;gap:8px;align-items:center;margin-top:8px}
.vact:empty{display:none}
.vpanel{background:#fff;border:1px solid var(--hair8);border-radius:18px;padding:16px 18px}
.vpanel+.vpanel{margin-top:14px}
.vpanel h3{margin:0 0 2px;font-size:14.5px;font-weight:650}
.vpanel .cs{font-size:12.5px;color:var(--i600);margin:0 0 10px;line-height:1.45}
.vpanel svg.v{width:100%;height:auto;display:block;font-family:var(--sans)}
.stage.flat2{height:auto;background:#fff;cursor:default}
.stage.white{background:#fff}
.ftwrap{position:relative;height:clamp(400px,calc(100dvh - 340px),560px);border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--hair8)}
.ftwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ftcap{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ftcap li{border:1px solid var(--hair8);border-radius:12px;padding:9px 11px 10px;background:#fff;font-size:12.5px;line-height:1.4;color:var(--i600);transition:background .3s,border-color .3s,color .3s;position:relative;overflow:hidden}
.ftcap li b{display:block;font-size:13px;color:var(--i800);font-weight:650;margin-bottom:2px}
.ftcap li.on{background:var(--cobg);border-color:#b9cbfb;color:var(--cod)}
.ftcap li.on b{color:var(--cod)}
.ftcap li i{position:absolute;left:0;bottom:0;height:3px;background:var(--co);width:0}
.ftbar{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:13px;color:var(--i700);flex-wrap:wrap}
.ftbar b{color:var(--i900)}
.ftbar .grow{flex:1}
.sigwrap{position:relative;height:clamp(460px,calc(100dvh - 300px),660px);border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--hair8)}
.sigwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--i900);color:#fff;font-size:12.5px;line-height:1.45;border-radius:10px;padding:8px 11px;max-width:300px;box-shadow:var(--sh-menu);opacity:0;transition:opacity .12s;z-index:4}
.tip b{display:block;font-size:13px}
.tip span{color:#cfd6ec}
.warnbox{margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.warnbox div{border:1px solid var(--hair8);border-radius:12px;padding:10px 12px;background:#fff;font-size:13px;line-height:1.5;color:var(--i700)}
.warnbox div b{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--i900);margin-bottom:2px}
.warnbox div b i{width:20px;height:20px;border-radius:50%;background:var(--i900);color:#fff;font-style:normal;font-size:11px;display:grid;place-items:center;flex:none}
.ptpick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ptpick button{height:32px;padding:0 10px;border-radius:9px;border:1px solid var(--hair8);background:#fff;font-size:12.5px;font-weight:550;color:var(--i800);display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.ptpick button:hover{border-color:#9db4f5}
.ptpick button.on{border-color:var(--co);background:var(--cobg);color:var(--cod)}
.ptpick button i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ptpick button.below i{background:var(--bad)}
.tally2{font-size:15px;color:var(--i800);margin:2px 0 10px;line-height:1.5}
.tally2 b{color:var(--i900)}
.tally2 .c{color:var(--okt);font-weight:650}.tally2 .m{color:var(--badt);font-weight:650}.tally2 .f{color:var(--fa);font-weight:650}
.misses{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.misses li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px;line-height:1.5;color:var(--i800);padding:8px 10px;border-radius:10px;background:#fdf5f4}
.misses li i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--bad);color:var(--badt);font-style:normal;font-size:11.5px;font-weight:700;display:grid;place-items:center;background:#fff}
.misses li.fa{background:#fbf6ea}
.misses li.fa i{box-shadow:inset 0 0 0 1.5px var(--fa);color:var(--fa)}
.why1{font-size:16px;line-height:1.5;color:var(--i800);margin:0 0 14px;max-width:80ch}
.why1 b{color:var(--i900)}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.cmp th{font-size:12px;font-weight:600;color:var(--i600);text-align:left;padding:0 12px 8px;vertical-align:bottom}
.cmp td{padding:12px;border-top:1px solid var(--hair4);vertical-align:middle}
.cmp tr.win td{background:var(--cobg)}
.cmp tr.win td:first-child{border-radius:12px 0 0 12px;box-shadow:inset 3px 0 0 var(--co)}
.cmp tr.win td:last-child{border-radius:0 12px 12px 0}
.cmp tr.win+tr td{border-top-color:transparent}
.cmp .nm b{display:block;font-size:13.5px;color:var(--i900)}
.cmp .nm span{font-size:12px;color:var(--i600)}
.cmp .verd{font-size:12.5px;font-weight:600;white-space:nowrap}
.cmp .verd.ok{color:var(--okt)}.cmp .verd.no{color:var(--badt)}.cmp .verd.big{color:var(--i600)}
.hb{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:10px;align-items:center}
.hb svg{width:100%;height:22px;display:block}
.hb span{white-space:nowrap;font-size:13px;font-weight:650;color:var(--i900);font-variant-numeric:tabular-nums;text-align:right}
.devnote{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.devnote div{border:1px solid var(--hair8);border-radius:12px;background:#fff;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--i700)}
.devnote div b{display:block;font-size:13px;color:var(--i900);margin-bottom:2px}
.lnk{font-size:12.5px;font-weight:600;color:var(--cot);padding:2px 0;text-decoration:underline;text-decoration-color:rgb(41 80 200 / .35);text-underline-offset:3px;white-space:nowrap}
.lnk:hover{text-decoration-color:var(--cot)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--i600);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.fname{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--okt);font-weight:550}
.fname svg.ic{width:14px;height:14px}

/* ---------- Settings ---------- */
.cfg{display:flex;flex:1;min-height:0}
.cfg-rail{width:220px;flex:none;border-right:1px solid var(--hair4);padding:20px 10px}
.cfg-rail h1{font-size:20px;font-weight:650;margin:0 10px 14px;letter-spacing:-.01em}
.cfg-rail button{width:100%;height:34px;border-radius:7px;padding:0 10px;text-align:left;font-size:12.5px;font-weight:550;color:var(--i600)}
.cfg-rail button:hover{background:rgb(19 26 51 / .035)}
.cfg-rail button.on{background:rgb(61 109 240 / .09);color:var(--i900)}
.cfg-main{flex:1;overflow:auto;padding:28px 36px 60px}
.cfg-main h2{font-size:20px;font-weight:650;margin:0 0 4px;letter-spacing:-.01em}
.cfg-main>p{color:var(--i550);margin:0 0 22px;font-size:13.5px}
.cfg-card{max-width:620px;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:4px 20px}
.crow{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--hair4)}
.crow:last-child{border-bottom:0}
.crow .cl{flex:1}
.crow .cl b{display:block;font-size:13.5px;font-weight:600}
.crow .cl span{display:block;font-size:12px;color:var(--i550);margin-top:2px;line-height:1.4}
select.sel{height:30px;border:1px solid var(--i200);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;color:var(--i900)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--i300);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .12s}
.sw[aria-checked=true]{background:var(--co)}
.sw[aria-checked=true]::after{transform:translateX(14px)}

#demo{background:#fff;border:1px solid var(--hair8);border-radius:99px;padding:3px 10px;box-shadow:0 2px 8px rgb(20 20 40 / .06);color:var(--i700);font-weight:550}
.row{height:auto;min-height:28px;padding:5px 10px;align-items:flex-start}
.row .g{margin-top:2px}
.row .t{white-space:normal;overflow:visible;line-height:1.35}
.rtitle{white-space:normal;overflow:visible;line-height:1.25;flex:0 1 340px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (max-width:1180px){.cols{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:1fr 1fr}.head{grid-template-columns:1fr}.warnbox{grid-template-columns:1fr 1fr}}
@media (max-width:1023px){.stack{grid-template-columns:1fr}.side-read{position:static;order:-1}.lv{grid-template-columns:repeat(2,minmax(0,1fr))}.ftcap{grid-template-columns:1fr 1fr}}
@media (max-width:767px){
  #mh{display:flex}
  #main{padding-top:48px}
  #sb{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .15s var(--ease);background:var(--glass-s);box-shadow:var(--sh-menu)}
  #sb.open{transform:none}
  #sb.open~#scrim{display:block}
  .topbar{padding:0 10px;gap:8px}
  .rtitle,.track,#live{display:none}
  .impbtn span{display:none}
  .play{flex:0 0 auto;margin-left:auto}
  .start{padding:14px 12px 64px}
  .band{padding:22px 20px 58px;border-radius:18px}
  .band h1{font-size:27px;margin-top:30px}
  .band p{font-size:14px}
  .start.asking .band{padding:14px 18px 46px}
  .start.asking .band h1{font-size:19px;margin-top:12px}
  .start .box{margin:-34px 8px 0}
  .effort{margin:16px 8px 0}
  .lv{gap:8px}
  .lv button{padding:10px 11px}
  .stack{margin:14px 8px 0}
  .blk{padding:16px 14px 14px}
  .blk h2{font-size:17px}
  .answers{grid-template-columns:1fr}
  .ans{min-height:0}
  .drow{grid-template-columns:1fr auto;gap:2px 10px}
  .drow .k{grid-column:1 / -1}
  .arow{grid-template-columns:1fr}
  .arow .ac{grid-column:1;grid-row:auto;margin-top:6px}
  .addasm{flex-wrap:wrap}
  .estb .seg{display:flex;flex-wrap:wrap;max-width:100%}
  .ov{padding:16px 12px 64px;gap:12px}
  .head{padding:16px 14px;gap:16px}
  .head h1{font-size:20px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0;padding-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--hair4)}
  .side{grid-template-columns:1fr}
  .wh{grid-template-columns:24px minmax(0,1fr) 14px}
  .wh time{display:none}
  .wb{padding-left:10px}
  .substeps{grid-template-columns:1fr 1fr}
  .deeper{grid-template-columns:1fr;padding-left:4px}
  .imp-list>li{grid-template-columns:1fr}
  .imp-list .ib{grid-column:1;grid-row:auto;margin-top:6px}
  .vis{padding:12px 12px 48px}
  .vtop{gap:10px}
  .stage{height:480px}
  .est{flex-wrap:wrap;right:16px}
  .est div{padding:5px 8px}.est dd{font-size:13px}.est dd small{display:none}
  .hud{left:10px;top:10px;padding:8px 10px}
  .stops{bottom:10px}.stops button{padding:0 10px;font-size:12px}
  .lbl{font-size:11px;padding:5px 7px}.lbl b{font-size:11.5px}.lbl span{font-size:10.5px}
  .warnbox,.devnote{grid-template-columns:1fr}
  .cfg{flex-direction:column}
  .cfg-rail{width:auto;border-right:0;border-bottom:1px solid var(--hair4);padding:14px 10px;display:flex;gap:4px;overflow:auto}
  .cfg-rail h1{display:none}
  .cfg-rail button{width:auto;white-space:nowrap}
  .cfg-main{padding:20px 16px 60px}
  .team{padding:8px 12px}
  .feed{padding:16px 12px 10px}
  .composer{padding:8px 12px 24px}
  #demo{bottom:4px}
}

    for (let i = 0; i < 3; i++) { const o = -s * .25 + i * s * .25; ctx.moveTo(x - s * .62, y + o); ctx.lineTo(x - s * .5, y + o); ctx.moveTo(x + s * .5, y + o); ctx.lineTo(x + s * .62, y + o); ctx.moveTo(x + o, y - s * .62); ctx.lineTo(x + o, y - s * .5); ctx.moveTo(x + o, y + s * .5); ctx.lineTo(x + o, y + s * .62); }
    ctx.stroke(); rr(x - s / 2, y - s / 2, s, s, 3, "#1d2235"); rr(x - s * .26, y - s * .26, s * .52, s * .52, 2, fill);
    if (ring) rr(x - s / 2 - 6, y - s / 2 - 6, s + 12, s + 12, 7, null, "#3d6df0", 2.2);
  };
  const COLS = 64, ROWS = 8, NSQ = COLS * ROWS;
  const plan = {};
  const roundPlan = k => {
    if (plan[k]) return plan[k];
    const R = rng(hashStr(r.id + "ft" + k)), sc = Array.from({ length: NSQ }, () => R()), order = sc.map((v, i) => i).sort((a, b) => sc[b] - sc[a]);
    const fin = order.slice(0, 12), res = result(r, k), passN = clamp(Math.round(12 * (res.pass / H) * .75), 3, 11);
    const passSet = new Set(fin.slice(0, passN)), bestIdx = fin[passN - 1];
    return (plan[k] = { sc, fin, keep: new Set(order.slice(0, Math.round(NSQ * .09))), passSet, passN, bestIdx, res });
  };
  const st = {
    scene: null, camera: null,
    update() {
      if (!W || !Hh) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, Hh);
      const t = elapsed(r), g = stageAt(r, t), narrow = W < 640, LW = narrow ? 104 : 200, x0 = LW + 16, x1 = W - 18;
      let k, u, live;
      if (g.r != null && ["propose", "tune", "compile", "verify"].includes(g.k) && !r.paused) { k = g.r; u = t - (20 + 48 * k); live = true; }
      else if (g.r != null) { k = g.r; u = t - (20 + 48 * k); live = false; } else { k = t < 20 ? 0 : r.rounds - 1; u = Math.min(48, mod(dclock() * 3, 54)); live = false; }
      const Pn = roundPlan(k), shelfY = 46, gap = (Hh - 30 - shelfY) / 5.2;
      const laneY = [Hh - 22 - gap * 1.1, Hh - 22 - gap * 2.3, Hh - 22 - gap * 3.25, Hh - 22 - gap * 4.2, shelfY + 12];
      const N = designs(r), per = Math.round(N / NSQ);
      const labels = [[`${nf(N)} designs`, `each square is ${per} designs`], ["Built as gates", "the best 12"], ["Match bit for bit", "circuit equals model"], [`Pass on unseen ${U.people}`, `checked on ${H}`], ["Best chip, each round", "smallest that passes"]];
      labels.forEach(([a, b2], i) => { const y = i === 0 ? laneY[0] : laneY[i]; text(a, 16, y - 8, { w: 650, s: narrow ? 11.5 : 12.5, c: "#131a33" }); text(b2, 16, y + 9, { s: narrow ? 10.5 : 11.5, c: "#4a5170" }); if (i) { ctx.strokeStyle = "#eceef4"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, y + (i === 4 ? 30 : 22)); ctx.lineTo(x1, y + (i === 4 ? 30 : 22)); ctx.stroke(); } });
      // the candidate grid
      const cols = narrow ? 32 : COLS, rows = NSQ / cols, gw = Math.min((x1 - x0) * .62, cols * 14), cs = gw / cols, gh = cs * rows, gx = x0, gy = laneY[0] - gh / 2;
      const fProp = clamp(u / 6, 0, 1), fTune = clamp((u - 6) / 22, 0, 1);
      for (let i = 0; i < NSQ; i++) {
        const c = i % cols, rw = Math.floor(i / cols), x = gx + c * cs, y = gy + rw * cs;
        if (c / cols > fProp) continue;
        const tuned = c / cols < fTune, isFin = Pn.fin.includes(i), gone = isFin && u >= 28;
        let col = "#c7d3f6";
        if (tuned) col = isFin ? "#2950c8" : Pn.keep.has(i) ? "#8fa8ee" : "#e6e9f0";
        if (gone) col = "#eef1fa";
        ctx.fillStyle = col; ctx.fillRect(x + .6, y + .6, cs - 1.6, cs - 1.6);
      }
      if (u >= 6 && u < 28) { const wx = gx + fTune * gw; ctx.fillStyle = "rgb(61 109 240 / .18)"; ctx.fillRect(wx - 6, gy - 4, 12, gh + 8); }
      const kept = u < 6 ? N : u < 28 ? Math.round(N - (N - 12) * fTune * .92) : 12;
      text(u < 6 ? "Proposing" : u < 28 ? `Fine-tuning: ${nf(kept)} still in` : "Fine-tuned; 12 kept", gx + gw + 14, laneY[0], { w: 600, s: 12.5, c: "#1f3fa6" });
      // the 12 finalists move up as they pass
      const slotX = j => x0 + (x1 - x0 - 150) * (j + .5) / 12, rnd = Pn.fin;
      const pBuild = ease(clamp((u - 28) / 8, 0, 1)), pBit = ease(clamp((u - 38) / 4, 0, 1)), pPass = ease(clamp((u - 43) / 3.5, 0, 1)), pBest = ease(clamp((u - 46.5) / 1.5, 0, 1));
      const s = narrow ? 14 : 20;
      if (u >= 28) rnd.forEach((idx, j) => {
        const c = idx % cols, rw = Math.floor(idx / cols), fx = gx + c * cs + cs / 2, fy = gy + rw * cs + cs / 2;
        let x = fx + (slotX(j) - fx) * pBuild, y = fy + (laneY[1] - fy) * pBuild;
        const pass = Pn.passSet.has(idx), best = idx === Pn.bestIdx;
        y += (laneY[2] - laneY[1]) * pBit;
        if (pass) y += (laneY[3] - laneY[2]) * pPass;
        if (live && best && pBest > 0) return;
        const fail = !pass && pPass > .5;
        chipIcon(x, y, s, fail ? "#9aa3bf" : "#3d6df0");
        if (pBit > .95 && u < 43.5) { ctx.fillStyle = "#12a26f"; ctx.beginPath(); ctx.arc(x + s * .62, y - s * .62, 5, 0, 7); ctx.fill(); }
        if (fail) { ctx.strokeStyle = "#b42318"; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(x + s * .45, y - s * .85); ctx.lineTo(x + s * .85, y - s * .45); ctx.moveTo(x + s * .85, y - s * .85); ctx.lineTo(x + s * .45, y - s * .45); ctx.stroke(); }
      });
      if (u >= 38) text(u < 43 ? "Checking bit for bit" : `${Pn.passN} of 12 pass`, x1 - 140, u < 43 ? laneY[2] : laneY[3], { w: 600, s: 12.5, c: u < 43 ? "#0f7a55" : "#1f3fa6" });
      if (u >= 38) text("12 of 12 match", x1 - 140, laneY[2] + (u < 43 ? 16 : 0), { s: 12, c: "#0f7a55" });
      // the shelf: each round's best chip; the overall best ringed, its label beneath it
      const shelf = [], R_ = r.rounds;
      for (let q = 0; q < R_; q++) { const done = live ? q < k || (q === k && pBest >= 1) : t >= 68 + 48 * q; if (done) shelf.push(q); }
      const sx = q => x0 + (x1 - x0) * (q + .5) / R_;
      for (let q = 0; q < R_; q++) { ctx.strokeStyle = "#e3e6ee"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.2; ctx.strokeRect(sx(q) - s / 2 - 6, laneY[4] - s / 2 - 6, s + 12, s + 12); ctx.setLineDash([]); }
      const bestQ = shelf.length ? shelf[shelf.length - 1] : -1;
      shelf.forEach(q => { const res = result(r, q); chipIcon(sx(q), laneY[4], s, q === bestQ ? "#3d6df0" : "#9aa3bf", q === bestQ); text(`Round ${q + 1}: ${nf(res.gates)} gates`, sx(q), laneY[4] + s / 2 + 16, { a: "center", s: narrow ? 10.5 : 12, w: q === bestQ ? 700 : 500, c: q === bestQ ? "#1f3fa6" : "#4a5170" }); });
      if (live && pBest > 0 && pBest < 1) { const idx = Pn.bestIdx, j = rnd.indexOf(idx), fx = slotX(j), fy = laneY[3]; chipIcon(fx + (sx(k) - fx) * pBest, fy + (laneY[4] - fy) * pBest, s, "#3d6df0"); }
      for (let q = 0; q < R_; q++) if (!shelf.includes(q) && !(live && q === k && pBest > 0)) text(`Round ${q + 1}`, sx(q), laneY[4] + s / 2 + 16, { a: "center", s: 12, c: "#8b92a8" });
      // the bar above and the captions below
      const bar = `<span><b>Round ${k + 1} of ${r.rounds}</b>${live ? ", live" : g.k === "done" ? ", replaying the last round" : t < 20 ? ", a preview: round 1 starts soon" : ", replaying"}</span><span class="grow"></span><span>${shelf.length ? `Best so far: <b>${nf(result(r, bestQ).gates)} gates</b>` : "No best chip yet"}</span>`;
      const fb = $("#ftbar"); if (fb && bar !== lastBar) { lastBar = bar; fb.innerHTML = bar; }
      const steps = [["Propose", `${nf(N)} designs, 6 model families`, 0, 6], ["Fine-tune all at once", `On ${MACH[r.mach].name}; most drop out`, 6, 28], ["Build the best 12", "Each model becomes a gate circuit", 28, 38], ["Check them", `Bit for bit, then on ${H} unseen ${U.people}`, 38, 48]];
      const cap = steps.map(([a, b2, s0, e0]) => { const on = u >= s0 && u < e0 || (u >= 48 && e0 === 48); return `<li class="${on ? "on" : ""}"><b>${a}</b>${b2}<i style="width:${(clamp((u - s0) / (e0 - s0), 0, 1) * 100).toFixed(0)}%"></i></li>`; }).join("");
      const fc = $("#ftcap"); if (fc && cap !== lastCap) { lastCap = cap; fc.innerHTML = cap; }
    },
    dispose() { ro.disconnect(); },
  };
  startLoop(host, st, null);
}
/* ================= Settings ================= */
function sel(name, opts, val) { return `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`; }
const CFG_TABS = [["line", "Clinical line"], ["chip", "Chip limits"], ["compute", "Machine"], ["scientists", "Scientists"], ["models", "Models"]];
function renderSettings(V) {
  const tab = CFG_TABS.find(t => t[0] === route.tab) ? route.tab : "line";
  const body = {
    line: ["Clinical line", "What a chip must reach before it counts. Applies to new runs.", [
      ["Events caught", "Share of seizures or oxygen drops each unseen person's chip must catch.", sel("line", [["85", "85%"], ["90", "90%"], ["95", "95%"]], defaults.line)],
      ["False alarms allowed", "Per day for brainwave devices, per hour for newborn devices.", sel("fa", [["1", "Fewer than 1"], ["2", "Fewer than 2"], ["4", "Fewer than 4"]], defaults.fa)]]],
    chip: ["Chip limits", "The box the scientists must design inside.", [
      ["Largest chip allowed", "Candidates above this are dropped before building.", sel("maxGates", [["1000", "1,000 gates"], ["5000", "5,000 gates"], ["20000", "20,000 gates"], ["0", "No limit"]], defaults.maxGates)],
      ["Bits per weight", "Fewer bits make smaller chips but can cost accuracy.", sel("bits", [["2", "2 bits"], ["4", "4 bits"], ["8", "8 bits"]], defaults.bits)]]],
    compute: ["Machine", "How many candidate models are fine-tuned at once.", [
      ["Default machine", "Used for new runs unless you pick another on the start page.", sel("mach", Object.entries(MACH).filter(([, m]) => !m.off).map(([k, m]) => [k, m.name]), defaults.mach)],
      ["Spend limit per run", "The run wraps up and reports when it reaches this.", sel("spendCap", [["10", "$10"], ["25", "$25"], ["100", "$100"]], defaults.spendCap)]]],
    scientists: ["Scientists", "The AI scientists that work on each run.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, s.role, `<button class="sw" role="switch" aria-checked="${defaults.scientists[k]}" data-sci="${k}" aria-label="${s.name}"></button>`])],
    models: ["Models", "Which model each scientist thinks with.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, k === "lead" || k === "check" ? "Needs careful reasoning." : "Runs often; a fast model is enough.", `<select class="sel" data-model="${k}" aria-label="${s.name} model">${["Large reasoning model", "Balanced model", "Fast model"].map(m => `<option ${defaults.models[k] === m ? "selected" : ""}>${m}</option>`).join("")}</select>`])],
  }[tab];
  V.innerHTML = `<div class="cfg"><nav class="cfg-rail"><h1>Settings</h1>${CFG_TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</nav>
    <div class="cfg-main"><h2>${body[0]}</h2><p>${body[1]}</p><div class="cfg-card">${body[2].map(([a, b, c]) => `<div class="crow"><div class="cl"><b>${a}</b><span>${b}</span></div>${c}</div>`).join("")}</div></div></div>`;
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/settings/" + b.dataset.t));
  V.onchange = e => { const s = e.target; if (s.name) { defaults[s.name] = s.value; toast("Saved. New runs will use this."); } if (s.dataset.model) { defaults.models[s.dataset.model] = s.value; toast("Saved. New runs will use this."); } };
  V.onclick = e => { const sw = e.target.closest("[data-sci]"); if (sw) { const k = sw.dataset.sci; if (k === "lead") { toast("The lead scientist is always on."); return; } defaults.scientists[k] = !defaults.scientists[k]; sw.setAttribute("aria-checked", defaults.scientists[k]); } };
}

/* ================= Render loop ================= */
function render() {
  closePop(); closeModal();
  const prev = route; route = parse();
  if (!(route.page === "run" && route.view === "visual" && prev.page === "run" && prev.view === "visual" && prev.id === route.id && prev.vis === route.vis)) stop3D();
  const V = $("#view"); V.onchange = null; V.onclick = null;
  if (route.page === "new") { curRun = null; renderStart(V); }
  else if (route.page === "settings") { curRun = null; renderSettings(V); }
  else renderRun(V);
  refreshSidebar();
}
let tickTitle = {};
function tick() {
  refreshSidebar();
  const r = curRun; if (!r || route.page !== "run") return;
  if (r.titleAt && now() >= r.titleAt && !tickTitle[r.id]) { tickTitle[r.id] = 1; renderTopbarOnly(); }
  updTopbar();
  if (route.view === "overview") updOverview(false);
  if (route.view === "chat") updChat(false);
  if (route.view !== "visual") updTile();
  if (route.view === "visual") updVisual();
}
render();
setInterval(() => { try { tick(); } catch (e) { console.error(e); } }, 500);
})();
