<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Chipwright run</title>
<style>
:root{
  --ink-50:#fafaf9;--ink-100:#f3f3f6;--ink-150:#e8e8ec;--ink-200:#d4d4dc;--ink-300:#b0b0be;--ink-350:#9a9aa8;--ink-400:#8a8a99;--ink-500:#6c6c85;--ink-600:#5a5a6a;--ink-700:#4a4a5a;--ink-800:#3a3a4a;--ink-900:#1a1a2e;
  --azure:#3b82f6;--azure-600:#2563eb;--azure-700:#1d4ed8;--sky:#eef6fc;--sky-2:#dbeafe;
  --teal-50:#f0f7f6;--teal-100:#d7ecea;--teal-600:#0d9488;--teal-900:#134e4a;
  --violet:#a78bfa;--violet-ink:#6d4fc4;--blue:#60a5fa;--blue-ink:#2563eb;--orange:#fb923c;--orange-ink:#c2560c;
  --moss:#5b8a5b;--ok:#10b981;--ok-50:#ecfdf5;--ok-700:#047857;--bad:#ef4444;--bad-50:#fef2f2;--bad-700:#b91c1c;--warn:#f59e0b;--warn-50:#fffbeb;--warn-700:#b45309;
  --sidebar:#f9f9f9;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro","Iowan Old Style","Charter","Palatino Linotype",Georgia,serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --sh-xs:0 1px 2px rgba(26,26,46,.05);
  --sh-sm:0 1px 3px rgba(26,26,46,.06),0 1px 2px rgba(26,26,46,.04);
  --sh-md:0 4px 14px rgba(26,26,46,.07),0 1px 3px rgba(26,26,46,.05);
  --sh-lg:0 12px 32px rgba(26,26,46,.12),0 2px 6px rgba(26,26,46,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--sans);color:var(--ink-900);background:#fff;-webkit-font-smoothing:antialiased;color-scheme:light}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-500)}
.serif{font-family:var(--serif)}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s12{width:12px;height:12px}svg.i.s14{width:14px;height:14px}svg.i.s16{width:16px;height:16px}svg.i.s18{width:18px;height:18px}

/* app shell */
#app{display:grid;grid-template-columns:212px minmax(0,1fr);height:100vh}
.side{border-right:1px solid var(--ink-150);background:var(--sidebar);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;height:48px;padding:0 14px;border-bottom:1px solid transparent}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--ink-900);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
.side-sec{padding:6px 8px}
.side-h{font-size:11.5px;color:var(--ink-400);padding:10px 8px 4px;font-weight:500}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:6px;font-size:12.5px;color:var(--ink-700);text-align:left;position:relative;min-height:30px}
.nav:hover{background:var(--ink-100)}
.nav[aria-current="true"]{background:#fff;color:var(--ink-900);box-shadow:var(--sh-xs),0 0 0 1px var(--ink-150);font-weight:500}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .badge{font-family:var(--mono);font-size:10px;color:var(--ink-400);font-variant-numeric:tabular-nums}
.nav .dot{width:6px;height:6px;border-radius:50%;background:var(--azure);flex:none}
.nav .spin{width:12px;height:12px;border:1.5px solid var(--sky-2);border-top-color:var(--azure);border-radius:50%;animation:spin 1s linear infinite;flex:none}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--ink-150);font-size:11.5px;color:var(--ink-500)}
.usage-bar{height:4px;border-radius:9px;background:var(--ink-150);margin-top:6px;overflow:hidden}
.usage-bar i{display:block;height:100%;background:var(--ink-700);border-radius:9px}
.main{min-width:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative}
.screen[hidden]{display:none!important}

/* start screen */
#start{flex:1;overflow:auto}
.start-wrap{max-width:820px;margin:0 auto;padding:64px 28px 60px}
.greet{font-family:var(--serif);font-size:38px;line-height:1.08;font-weight:500;letter-spacing:-.015em;margin:0 0 10px}
.greet-sub{color:var(--ink-500);font-size:14px;margin:0 0 26px;max-width:620px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.preset{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid var(--ink-150);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.preset:hover{border-color:var(--ink-200)}
.preset[aria-pressed="true"]{border-color:#9dc0fb;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.preset-ico{width:40px;height:40px;border-radius:8px;background:var(--ink-50);border:1px solid var(--ink-150);display:grid;place-items:center;flex:none}
.preset b{display:block;font-size:14px;font-weight:600}
.preset span{display:block;font-size:12.5px;color:var(--ink-500);line-height:1.45;margin-top:2px}
.composer{border:1px solid var(--ink-200);border-radius:16px;background:#fff;box-shadow:var(--sh-md);padding:14px 14px 10px}
.composer textarea{width:100%;border:0;outline:0;resize:none;font-size:14px;line-height:1.6;min-height:88px;background:transparent}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--ink-150);background:#fff;font-size:12px;color:var(--ink-700);white-space:nowrap}
.pill:hover{background:var(--ink-50);border-color:var(--ink-200)}
.pill .k{color:var(--ink-400)}
.pill b{font-weight:600;color:var(--ink-900)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid var(--ink-150);background:#fff;color:var(--ink-800);white-space:nowrap}
.btn:hover{background:var(--ink-50);border-color:var(--ink-200)}
.btn.primary{background:var(--ink-900);border-color:var(--ink-900);color:#fff}
.btn.primary:hover{background:#2a2a40}
.btn.blue{background:var(--azure-600);border-color:var(--azure-600);color:#fff}
.btn.blue:hover{background:var(--azure-700)}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--ink-100)}
.btn[disabled]{opacity:.45;cursor:default}
.start-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--ink-100)}
.start-row .sp{flex:1}
.launch{border:1px solid var(--ink-150);border-radius:16px;padding:22px 22px 18px;background:#fff;box-shadow:var(--sh-md)}
.launch h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 12px}
.launch li{list-style:none;display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-500);padding:4px 0}
.launch li.on{color:var(--ink-900)}
.launch li.done{color:var(--ink-700)}
.launch ul{margin:0;padding:0}
.sec-h{font-family:var(--serif);font-size:20px;font-weight:500;margin:44px 0 12px}
.list{border:1px solid var(--ink-150);border-radius:10px;overflow:hidden}
.list-row{display:grid;grid-template-columns:20px 1fr 120px 110px 90px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--ink-150);font-size:12.5px}
.list-row:first-child{border-top:0}
.list-row.head{background:var(--ink-50);color:var(--ink-500);font-size:11.5px;padding:7px 14px}

/* popover */
#pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--ink-150);border-radius:10px;box-shadow:var(--sh-lg);padding:6px;min-width:220px;max-width:380px}
#pop[hidden]{display:none}
.pop-h{font-size:11.5px;color:var(--ink-500);padding:6px 8px 4px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px;border-radius:6px}
.opt:hover{background:var(--ink-100)}
.opt[aria-checked="true"]{background:var(--sky)}
.opt b{font-size:12.5px;font-weight:600;display:block}
.opt span{font-size:11.5px;color:var(--ink-500);display:block}
.opt .price{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-600);white-space:nowrap}
.agent-cfg{display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;font-size:12px}
.sel{height:26px;border:1px solid var(--ink-150);border-radius:6px;background:#fff;font-size:11.5px;padding:0 4px}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px;font-size:12.5px}
.field input{width:84px;height:28px;border:1px solid var(--ink-150);border-radius:6px;padding:0 8px;font-family:var(--mono);font-size:12px;text-align:right}

/* run screen */
#run{display:flex;flex-direction:column;height:100%;min-height:0}
.topbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;border-bottom:1px solid var(--ink-150);flex:none;min-width:0}
.run-title{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;max-width:340px;padding:2px 4px;border-radius:4px;outline:0}
.run-title:hover{background:var(--ink-50)}
.run-title:focus{background:#fff;box-shadow:0 0 0 1px var(--ink-200)}
.seg{display:inline-flex;padding:2px;background:var(--ink-100);border-radius:8px;gap:2px;flex:none}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--ink-600);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink-900);box-shadow:var(--sh-xs);font-weight:500}
.tb-sp{flex:1;min-width:8px}
.simlabel{font-size:11px;color:var(--warn-700);background:var(--warn-50);border:1px solid #fde7b0;border-radius:999px;padding:2px 9px;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;background:var(--bad-50);color:var(--bad-700);font-size:11px;font-weight:600;letter-spacing:.04em;border:1px solid #fecaca;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:blink 1.4s ease-in-out infinite}
.live.dim{background:var(--ink-100);color:var(--ink-500);border-color:var(--ink-150)}
.live.dim i{background:var(--ink-300);animation:none}
.live.fin{background:var(--ok-50);color:var(--ok-700);border-color:#a7f3d0}
.live.fin i{background:var(--ok);animation:none}
.live.paused{background:var(--warn-50);color:var(--warn-700);border-color:#fde7b0}
.live.paused i{background:var(--warn);animation:none}
.iconbtn{width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;color:var(--ink-600);flex:none}
.iconbtn:hover{background:var(--ink-100);color:var(--ink-900)}
.speed{height:28px;border:1px solid var(--ink-150);border-radius:7px;background:#fff;font-size:11.5px;padding:0 6px;font-family:var(--mono)}

/* persistent strip */
.strip{display:flex;align-items:stretch;gap:12px;padding:8px 14px 8px 16px;border-bottom:1px solid var(--ink-150);background:var(--ink-50);flex:none;min-width:0}
.tracker{display:flex;align-items:stretch;gap:4px;flex:1;min-width:0}
.stg{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:4px 8px;border-radius:7px;text-align:left;border:1px solid transparent}
.stg:hover{background:#fff;border-color:var(--ink-150)}
.stg .nm{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-500);white-space:nowrap;overflow:hidden}
.stg .nm svg{flex:none}
.stg .bar{height:4px;border-radius:9px;background:var(--ink-150);overflow:hidden;position:relative}
.stg .bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--acc,var(--azure))}
.stg.run .nm{color:var(--ink-900);font-weight:600}
.stg.done .nm{color:var(--ink-700)}
.stg.run .bar i{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);background-size:60px 100%;background-repeat:no-repeat;animation:sweep 1.6s linear infinite;background-color:var(--acc)}
.loop{display:flex;gap:2px;flex:4;min-width:0;border:1px dashed #b8d0f7;border-radius:9px;padding:0 2px 0 0;position:relative;background:rgba(96,165,250,.05)}
.loop-tag{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 8px;font-size:11px;color:var(--blue-ink);border-right:1px dashed #b8d0f7;white-space:nowrap;line-height:1.2}
.loop-tag b{font-size:13px;font-family:var(--mono)}
.best-mini{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 8px;border-radius:9px;border:1px solid var(--ink-150);background:#fff;min-width:0;text-align:left;flex:none}
.best-mini:hover{border-color:var(--ink-200)}
.best-mini .gl{width:34px;height:26px;flex:none}
.best-mini .v{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.best-mini .s{font-size:11px;color:var(--ink-500);white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:6px;flex:none}
.scrub{height:5px;position:relative;cursor:pointer;flex:none;background:var(--ink-100);border-bottom:1px solid var(--ink-150);transition:height .12s}
.scrub:hover,.scrub.drag{height:9px}
.scrub .trk{display:none}
.scrub .live-edge{position:absolute;left:0;top:0;bottom:0;background:var(--ink-200)}
.scrub .pos{position:absolute;left:0;top:0;bottom:0;background:var(--azure)}
.scrub .knob{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;border:2px solid var(--azure);opacity:0;transition:opacity .15s}
.scrub:hover .knob,.scrub.drag .knob{opacity:1}
.scrub .tick{position:absolute;top:0;bottom:0;width:2px;background:#fff}

.viewport{flex:1;min-height:0;overflow:auto;position:relative}
.view{min-height:100%}
.pad{padding:20px 22px 28px}
.vh{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.vh h2{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.08;margin:0;letter-spacing:-.01em}
.vh p{margin:0;color:var(--ink-500);font-size:12.5px}
.panel{border:1px solid var(--ink-150);border-radius:10px;background:#fff;box-shadow:var(--sh-xs);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ink-150);font-size:12.5px;font-weight:600}
.panel-h .sub{font-weight:400;color:var(--ink-500);font-size:11.5px}
.panel-h .sp{flex:1}
.panel-b{padding:12px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--ink-500)}
.kv dd{margin:0;text-align:right;font-family:var(--mono);font-size:12px}
.chipbtn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--ink-150);font-size:11.5px;color:var(--ink-600);background:#fff;white-space:nowrap}
.chipbtn:hover{border-color:var(--ink-200);color:var(--ink-900)}
.chipbtn[aria-pressed="true"]{background:var(--ink-900);color:#fff;border-color:var(--ink-900)}
.tag{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:500;white-space:nowrap}
.tag.ok{background:var(--ok-50);color:var(--ok-700)}
.tag.bad{background:var(--bad-50);color:var(--bad-700)}
.tag.warn{background:var(--warn-50);color:var(--warn-700)}
.tag.blue{background:var(--sky);color:var(--azure-700)}
.tag.ink{background:var(--ink-100);color:var(--ink-600)}
.tag.teal{background:var(--teal-50);color:var(--teal-900)}
.link{color:var(--azure-600);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
canvas{display:block;width:100%}

/* conversation view */
.conv{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.stream-col{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.stream{flex:1;overflow:auto;padding:22px 26px 10px;scroll-behavior:auto}
.stream-in{max-width:780px;margin:0 auto}
.msg{display:grid;grid-template-columns:30px minmax(0,1fr);gap:11px;margin:0 0 14px}
.av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:14px;flex:none}
.who{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:2px}
.who b{font-weight:600}
.who .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink-400)}
.who .rl{font-size:11px;color:var(--ink-400)}
.txt{font-size:14px;line-height:1.62;color:var(--ink-800)}
.txt p{margin:0 0 6px}
.txt b{color:var(--ink-900);font-weight:600}
.caret{display:inline-block;width:6px;height:14px;background:var(--ink-400);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
.human{display:flex;justify-content:flex-end;margin:0 0 16px}
.bubble{max-width:78%;background:var(--teal-50);border:1px solid var(--teal-100);color:var(--teal-900);border-radius:14px 14px 4px 14px;padding:10px 14px;font-size:14px;line-height:1.55}
.bubble .bh{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--teal-600);margin-bottom:3px;font-weight:500}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 14px;font-size:12px;color:var(--ink-500)}
.divider .ln{flex:1;height:1px;background:var(--ink-150)}
.divider .lb{display:inline-flex;align-items:center;gap:7px;font-weight:500;color:var(--ink-700)}
.divider .sw{width:8px;height:8px;border-radius:3px}
.card{border:1px solid var(--ink-150);border-radius:10px;background:#fff;box-shadow:var(--sh-xs);margin-top:8px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ink-100);font-size:12.5px;font-weight:600}
.card-h .sp{flex:1}
.card-h .sub{font-weight:400;color:var(--ink-500);font-size:11.5px}
.card-b{padding:12px}
.card-f{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--ink-100);background:var(--ink-50);font-size:11.5px;color:var(--ink-500)}
.card-f .sp{flex:1}
.card.glow{animation:glow 1.6s ease-out 1}
.tool{border:1px solid var(--ink-150);border-radius:8px;margin-top:6px;background:var(--ink-50);overflow:hidden}
.tool-h{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;font-size:12px;color:var(--ink-700);text-align:left}
.tool-h .sp{flex:1}
.tool-h .st{font-family:var(--mono);font-size:10.5px;color:var(--ink-400)}
.tool-b{border-top:1px solid var(--ink-150);background:#fff;padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--ink-600);max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.tool-b .e{color:var(--bad-700);background:var(--bad-50);display:block;margin:0 -10px;padding:0 10px}
.tool-b .w{color:var(--warn-700);background:var(--warn-50);display:block;margin:0 -10px;padding:0 10px}
.tool-b .o{color:var(--ok-700)}
.tool-b .c{color:var(--ink-900)}
.mspin{width:12px;height:12px;border:1.5px solid var(--ink-200);border-top-color:var(--azure);border-radius:50%;animation:spin .9s linear infinite;flex:none}
.plan li{display:flex;gap:9px;align-items:flex-start;padding:4px 0;font-size:13px;color:var(--ink-500);list-style:none}
.plan li.done{color:var(--ink-700)}
.plan li.on{color:var(--ink-900);font-weight:500}
.plan li.rev{color:var(--teal-900)}
.plan ul{margin:0;padding:0}
.plan .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--ink-300);display:grid;place-items:center;flex:none;margin-top:2px}
.plan li.done .bx{background:var(--moss);border-color:var(--moss);color:#fff}
.plan li.on .bx{border-color:var(--azure)}
.plan li.on .bx::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--azure);animation:blink 1.4s infinite}
.fam{display:grid;grid-template-columns:170px 1fr 54px;gap:10px;align-items:center;font-size:12px;padding:3px 0}
.fam .b{height:8px;border-radius:9px;background:var(--ink-100);overflow:hidden}
.fam .b i{display:block;height:100%;background:var(--blue);border-radius:9px}
.fam .b i.off{background:var(--ink-300)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--ink-150);border-top:1px solid var(--ink-150)}
.stat{background:#fff;padding:8px 12px}
.stat .l{font-size:11px;color:var(--ink-500)}
.stat .v{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;color:var(--ink-500);font-weight:400}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.gate-actions{display:flex;gap:8px;align-items:center}
.composer-dock{border-top:1px solid var(--ink-150);padding:10px 26px 14px;background:#fff;flex:none}
.dock-in{max-width:780px;margin:0 auto}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sugg button{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--ink-150);color:var(--ink-600);background:#fff;white-space:nowrap}
.sugg button:hover{border-color:var(--teal-600);color:var(--teal-900);background:var(--teal-50)}
.cbox{border:1px solid var(--ink-200);border-radius:16px;padding:8px 8px 8px 14px;background:#fff;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:6px}
.cbox:focus-within{border-color:#9dc0fb;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.cbox textarea{border:0;outline:0;resize:none;min-height:24px;max-height:120px;font-size:14px;line-height:1.5;padding:4px 0;background:transparent}
.cbox-row{display:flex;align-items:center;gap:6px}
.cbox-row .sp{flex:1}
.hint{font-size:11px;color:var(--ink-400)}
.paused-note{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn-700);background:var(--warn-50);border-radius:999px;padding:2px 9px}
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--jb,130px);z-index:5;box-shadow:var(--sh-md)}
.summary{border-left:1px solid var(--ink-150);overflow:auto;background:#fff;padding:18px 18px 24px}
.sum-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-500);margin-bottom:8px}
.sum-h b{color:var(--ink-900);font-weight:600}
.big{font-family:var(--serif);font-size:32px;line-height:1.08;font-weight:500;letter-spacing:-.01em}
.big small{font-family:var(--sans);font-size:13px;color:var(--ink-500);font-weight:400;letter-spacing:0;margin-left:4px}
.meter{margin-top:10px}
.meter .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.meter .row span:last-child{font-family:var(--mono);font-size:11.5px}
.mtrack{position:relative;height:6px;border-radius:9px;background:var(--ink-100)}
.mtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--ink-800)}
.mtrack .line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--moss);border-radius:2px}
.sum-sec{border-top:1px solid var(--ink-150);margin-top:16px;padding-top:14px}
.sum-sec h4{font-size:12.5px;font-weight:600;margin:0 0 8px}
.now{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-800)}
.rrow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--ink-150)}
.rrow:last-child{border-bottom:0}
.rrow .rn{font-family:var(--mono);color:var(--ink-500);font-size:11px}
.rrow .g{font-family:var(--mono);font-weight:600}
.rrow .d{font-family:var(--mono);font-size:11px;color:var(--ok-700)}

/* design space */
.ds{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
.ds-bottom{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-500);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;border-radius:0;vertical-align:3px}
.tip{position:absolute;pointer-events:none;background:var(--ink-900);color:#fff;font-size:11.5px;padding:6px 9px;border-radius:7px;white-space:nowrap;z-index:9;box-shadow:var(--sh-md);font-family:var(--mono)}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-weight:500;color:var(--ink-500);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--ink-150);white-space:nowrap;background:var(--ink-50);position:sticky;top:0}
table.t td{padding:6px 8px;border-bottom:1px solid var(--ink-100);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--ink-50)}
table.t tr.sel td{background:var(--sky)}
table.t tr.best td{font-weight:600}

/* chip view */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.chip-svg{width:100%;height:auto;display:block}
.mix{display:flex;height:8px;border-radius:9px;overflow:hidden;margin:6px 0 4px}
.mix i{display:block;height:100%}
.delta-good{color:var(--ok-700)}.delta-bad{color:var(--bad-700)}

/* signal view */
.sig-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.pt-row{display:grid;grid-template-columns:44px 1fr 56px 1fr 56px;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--ink-100);cursor:pointer}
.pt-row:hover{background:var(--ink-50)}
.pt-row.sel{background:var(--sky)}
.pt-row .n{font-family:var(--mono);font-size:11.5px;text-align:right}
.hb{position:relative;height:7px;border-radius:9px;background:var(--ink-100)}
.hb i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--ink-700)}
.hb .ln{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--moss)}
.hb.fail i{background:var(--bad)}
.bigok{font-family:var(--serif);font-size:38px;line-height:1.08;font-weight:500}

/* agents view */
.ag{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:14px}
.agents{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.agent{border:1px solid var(--ink-150);border-radius:10px;background:#fff;display:flex;flex-direction:column;min-height:180px}
.agent-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--ink-100)}
.agent-h b{font-size:13px}
.agent-h .rl{font-size:11px;color:var(--ink-500)}
.agent-b{padding:10px 12px;font-size:12.5px;line-height:1.55;color:var(--ink-700);flex:1}
.agent-b .older{color:var(--ink-400);font-size:12px;margin-top:6px;border-top:1px dashed var(--ink-150);padding-top:6px}
.agents .agent:last-child:nth-child(odd){grid-column:1 / -1;min-height:150px}
.agent-f{display:flex;gap:8px;white-space:nowrap;overflow:hidden;padding:7px 12px;border-top:1px solid var(--ink-100);font-size:10.5px;color:var(--ink-500);font-family:var(--mono)}
.agent.active{border-color:#b8d0f7;box-shadow:0 0 0 3px rgba(59,130,246,.08)}
.log li{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--ink-100)}
.log ul{margin:0;padding:0}
.log .tm{font-family:var(--mono);font-size:10.5px;color:var(--ink-400);padding-top:2px}

/* cost view */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--ink-150);border:1px solid var(--ink-150);border-radius:10px;overflow:hidden;margin-bottom:14px}
.kpi{background:#fff;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--ink-500)}
.kpi .v{font-family:var(--serif);font-size:26px;line-height:1.1;margin-top:2px}
.kpi .s{font-size:11px;color:var(--ink-400);margin-top:2px}
.cost-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.hbar{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;font-size:12px;padding:4px 0}
.hbar .t{height:10px;border-radius:9px;background:var(--ink-100);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:9px}

/* report view */
.report{max-width:900px;margin:0 auto;padding:30px 28px 50px}
.report h1{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.08;margin:6px 0 8px;letter-spacing:-.01em}
.report h3{font-family:var(--serif);font-weight:500;font-size:20px;margin:30px 0 10px}
.report p{font-family:var(--serif);font-size:16px;line-height:1.75;color:var(--ink-800);margin:0 0 12px;max-width:70ch}
.report .lede{font-size:17px}
.ds-table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ink-150);border-radius:10px;overflow:hidden;gap:1px;background:var(--ink-150)}
.ds-table > div{background:#fff;padding:10px 14px}
.ds-table .l{font-size:11.5px;color:var(--ink-500)}
.ds-table .v{font-family:var(--mono);font-size:15px;font-weight:600}
.files{display:flex;flex-wrap:wrap;gap:8px}
.limits li{font-family:var(--serif);font-size:15px;line-height:1.7;color:var(--ink-800);margin-bottom:4px}
.draft{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--warn-700);background:var(--warn-50);border-radius:999px;padding:3px 10px}

#toasts{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#fff;border:1px solid var(--ink-150);box-shadow:var(--sh-lg);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;max-width:380px;animation:tin .25s ease-out}
.toast .x{color:var(--ink-400)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-500);font-size:13px;gap:8px;padding:40px 20px;min-height:180px}
.empty b{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--ink-800)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes sweep{0%{background-position:-60px 0}100%{background-position:calc(100% + 60px) 0}}
@keyframes glow{0%{box-shadow:0 0 0 3px rgba(59,130,246,.22)}100%{box-shadow:var(--sh-xs)}}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

@media (max-width:1240px){
  #app{grid-template-columns:58px minmax(0,1fr)}
  .side .lbl,.side .badge,.side-h,.brand-name,.side-foot .ft{display:none}
  .nav{justify-content:center;padding:8px}
  .brand{justify-content:center;padding:0}
  .side-foot{padding:8px 6px}
  .conv{grid-template-columns:minmax(0,1fr) 300px}
  .ag{grid-template-columns:240px minmax(0,1fr)}
  .ag > .ag-right{grid-column:1 / -1}
  .simlabel{font-size:10.5px}
}
@media (max-width:1100px){
  .ds{grid-template-columns:minmax(0,1fr)}
  .ds-bottom{grid-template-columns:minmax(0,1fr)}
  .stg .nm span{overflow:hidden;text-overflow:ellipsis}
  .best-mini .gl{display:none}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .seg .full{display:none}
}
@media (max-width:760px){
  html,body{height:auto}
  #app{display:block;height:auto}
  .side{position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--ink-150);overflow-x:auto;height:52px}
  .side-sec{display:flex;padding:0 4px;gap:2px}
  .side-h,.side-foot,.side .runs{display:none}
  .nav{width:auto;flex:none}
  .main{height:auto;overflow:visible}
  #run{height:auto}
  .topbar{flex-wrap:wrap;height:auto;padding:8px 12px;gap:8px}
  .run-title{max-width:100%;flex:1 1 100%}
  .strip{flex-wrap:wrap;padding:8px 12px}
  .tracker{flex:1 1 100%;flex-wrap:wrap}
  .stg{flex:1 1 30%}
  .loop{flex:1 1 100%}
  .viewport{overflow:visible}
  .conv,.ds,.ds-bottom,.cmp,.sig-grid,.ag,.agents,.cost-grid,.two,.presets{grid-template-columns:minmax(0,1fr)}
  .conv{height:auto}
  .stream{max-height:none;overflow:visible;padding:16px 12px}
  .summary{border-left:0;border-top:1px solid var(--ink-150)}
  .composer-dock{padding:10px 12px;position:sticky;bottom:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ds-table{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pad{padding:14px 12px}
  .start-wrap{padding:30px 16px}
  .greet{font-size:30px}
  .list-row{grid-template-columns:20px 1fr 80px}
  .list-row > :nth-child(4),.list-row > :nth-child(5){display:none}
  .fam{grid-template-columns:120px 1fr 44px}
  .bubble{max-width:92%}
  .jump,.composer-dock .sugg,.cbox .hint{display:none}
  [style*="grid-template-columns:200px"]{grid-template-columns:minmax(0,1fr)!important}
}
</style>
</head>
<body>

      <div class="viewport" id="viewport"></div>

</div>
<div id="pop" hidden></div>
<div id="toasts" aria-live="polite"></div>

function steerEffect(text){
  const s = text.toLowerCase();
  const m = s.match(/(\d+(?:\.\d+)?)\s*(?:points?|pts?|%)\s*(?:lower|less|of)/);
  const pts = m ? parseFloat(m[1]) : null;
  if(/fewer gates|smaller|less area|cheaper|fewer|shrink|reduce gates|gates/.test(s) && !/more gates/.test(s)){
    const sd = pts!=null ? -Math.min(pts,4)*0.85 : -0.9;
    const gm = pts!=null ? clamp(0.86 - pts*0.09, 0.55, 0.85) : 0.76;
    return {kind:'gates', gm, sd, dm:.95, pts};
  }
  if(/sensitiv|accura|miss|safer|catch|recall/.test(s)) return {kind:'acc', gm:1.22, sd:+1.0, dm:1.04};
  if(/path|latency|depth|shallow|faster|delay/.test(s)) return {kind:'depth', gm:1.06, sd:0, dm:.74};
  if(/specific|false alarm|alarm/.test(s)) return {kind:'spec', gm:1.08, sd:-.2, dm:1, spd:+.8};
  return {kind:'note', gm:1, sd:0, dm:1};
}
function targetFor(D, r, eff){
  const T = D.targets; let base;
  if(r <= T.length) base = Object.assign({}, T[r-1]);
  else { const L=T[T.length-1], k=r-T.length; base = {g:Math.round(L.g*Math.pow(.86,k)), s:L.s+.2*k, sp:L.sp+.1*k, d:Math.max(10,L.d-2*k)}; }
  base.g = Math.round(base.g*eff.gm); base.s += eff.sd; base.sp += (eff.spd||0); base.d = Math.max(9, Math.round(base.d*eff.dm));
  base.s = clamp(base.s, D.line.sens+.35, D.ref.sens-.6); base.sp = clamp(base.sp, D.line.spec+.3, D.ref.spec-.3);
  return base;
}
function genPatients(rng, D, s, sp){
  const n=D.patients, list=[];
  let rem=D.windows;
  for(let i=0;i<n;i++){
    const w = i===n-1 ? rem : Math.round(D.windows/n*(0.82+rng()*0.36));
    rem -= w; list.push({id:'P'+pad2(i+1), win:w});
  }
  const worstS = Math.floor(rng()*n); let worstP = (worstS+3+Math.floor(rng()*(n-4)))%n;
  for(let i=0;i<n;i++){
    const p=list[i];
    p.pos = D.key==='eeg' ? 18+Math.floor(rng()*40) : 70+Math.floor(rng()*120);
    let target = i===worstS ? s : Math.min(100, s + .6 + rng()*6.2);
    if(i===worstS){ // find a positive count that lands close to s
      let bestP=p.pos, bestE=9;
      for(let q=(D.key==='eeg'?24:60); q<=(D.key==='eeg'?72:200); q++){ const e=Math.abs(Math.round(s*q/100)/q*100 - s); if(e<bestE){bestE=e;bestP=q;} }
      p.pos=bestP;
    }
    p.det = Math.min(p.pos, Math.round(target*p.pos/100));
    if(i!==worstS && p.det/p.pos*100 < s+.3) p.det = Math.min(p.pos, p.det+1);
    p.neg = p.win - p.pos;
    let spT = i===worstP ? sp : Math.min(99.8, sp + .4 + rng()*3.2);
    p.fa = Math.round((1-spT/100)*p.neg);
    if(i!==worstP && (1-p.fa/p.neg)*100 < sp+.2) p.fa = Math.max(0,p.fa-1);
    p.sens = p.det/p.pos*100; p.spec = (1-p.fa/p.neg)*100;
  }
  const sens = Math.min(...list.map(p=>p.sens)), spec = Math.min(...list.map(p=>p.spec));
  return {list, sens, spec};
}
function layersFor(D, g, fam, rng){
  if(D.key==='eeg'){ const h1 = clamp(Math.round(Math.sqrt(g)/2.1), 8, 72), h2 = clamp(Math.round(h1/2.3), 4, 28); return [h1, h2, 1]; }
  const h1 = clamp(Math.round(Math.sqrt(g)/2.4), 6, 40), h2 = clamp(Math.round(h1/2), 4, 16); return [h1, h2, 8];
}
function genRound(D, cfg, r, b, N, T, applied){
  const rng = mulberry(hashStr(D.key+'|'+r+'|'+N+'|'+Math.round(T.g)));
  const pats = genPatients(mulberry(hashStr(D.key+'p'+r+'|'+Math.round(T.g))), D, T.s, T.sp);
  const g=new Float32Array(N), a=new Float32Array(N), sp=new Float32Array(N), tf=new Float32Array(N), fam=new Uint8Array(N), dep=new Uint8Array(N);
  const lo=Math.log(Math.max(D.xr[0]*1.05, T.g*.42)), hi=Math.log(Math.min(D.xr[1]*.97, T.g*7.5));
  const fw = D.famWeights[Math.min(r-1, D.famWeights.length-1)]; const fws = fw.reduce((x,y)=>x+y,0);
  const t0=b+3.3, t1=b+8.8;
  for(let i=0;i<N;i++){
    const lg = lo + Math.pow(rng(), .85)*(hi-lo); const gg=Math.exp(lg);
    const F = gg>=T.g ? T.s + 1.45*Math.log(gg/T.g) : T.s + 9*Math.log(gg/T.g);
    let aa = F - (Math.abs(gauss(rng))*1.6 + Math.pow(rng(),1.7)*20 + .25);
    if(gg < T.g && aa >= D.line.sens) aa = D.line.sens - .3 - rng()*3;
    aa = clamp(aa, D.yr[0]+.5, D.ref.sens-.25);
    g[i]=gg; a[i]=aa; sp[i]=clamp(T.sp - 1.2 + gauss(rng)*1.4 - (T.s-aa)*.12, 70, D.ref.spec-.2);
    let x=rng()*fws, f=0; while(f<fw.length-1 && x>fw[f]){ x-=fw[f]; f++; } fam[i]=f;
    tf[i]= t0 + Math.pow(rng(), 1.15)*(t1-t0);
    dep[i] = clamp(Math.round(T.d*Math.pow(gg/T.g,.22) + gauss(rng)*1.6), 6, 80);
  }
  const bi = Math.floor(rng()*N);
  g[bi]=T.g; a[bi]=pats.sens; sp[bi]=pats.spec; fam[bi]=D.bestFam[Math.min(r-1,D.bestFam.length-1)]; dep[bi]=T.d; tf[bi]=t0+(t1-t0)*(.55+rng()*.35);
  let rejIdx=-1;
  if(r===2){ rejIdx=(bi+977)%N; g[rejIdx]=Math.round(T.g*.91); a[rejIdx]=T.s+.2; sp[rejIdx]=D.line.spec-.8; fam[rejIdx]=fam[bi]; dep[rejIdx]=T.d+1; }
  // compiled set: smallest candidates meeting the line
  const meetIdx=[]; for(let i=0;i<N;i++) if(a[i]>=D.line.sens && g[i]<=D.budget*1.0) meetIdx.push(i);
  meetIdx.sort((x,y)=>g[x]-g[y]);
  const compiled = meetIdx.slice(0, Math.min(24, meetIdx.length));
  if(!compiled.includes(bi)) compiled.push(bi);
  if(rejIdx>=0 && !compiled.includes(rejIdx)) compiled.unshift(rejIdx);
  compiled.sort((x,y)=>g[x]-g[y]);
  for(const i of compiled){ if(i!==rejIdx && i!==bi) sp[i] = Math.max(sp[i], D.line.spec + .2 + rng()*1.8); }
  const tfs = Float32Array.from(tf).sort();
  const meetCount = meetIdx.length;
  const best = {r, i:bi, id:`R${r}-${String(bi).padStart(4,'0')}`, g:T.g, s:pats.sens, sp:pats.spec, d:T.d, fam:fam[bi], layers:layersFor(D,T.g,fam[bi]), patients:pats.list};
  return {D, r, b, N, g, a, sp, tf, tfs, fam, dep, best, bestIdx:bi, rejIdx, compiled, meetCount, applied,
    change:(applied.length? 'Following your note: '+applied.map(x=>'“'+x.text+'”').join(' and ')+'. ' : '') + (D.changes[r-1]||D.changes[D.changes.length-1]),
    t:{propose:b, train:b+3, compile:b+9, verify:b+12, chosen:b+15.4, summary:b+16.2, end:b+17}};
}
function candOf(R, i){
  const D=R.D;
  if(i===R.bestIdx) return Object.assign({}, R.best, {status:'chosen'});
  const ci = R.compiled.indexOf(i);
  let status = 'trained';
  if(ci>=0) status = i===R.rejIdx ? 'rejected' : (ci<6 ? 'verified' : 'compiled');
  const g = Math.round(R.g[i]);
  return {r:R.r, i, id:`R${R.r}-${String(i).padStart(4,'0')}`, g, s:R.a[i], sp:R.sp[i], d:R.dep[i], fam:R.fam[i], layers:layersFor(D,g,R.fam[i]), status};
}

function buildRun(dk, cfg, steers){
  const D = DEV[dk];
  const comp = COMPUTE.find(c=>c.k===cfg.compute);
  const N = comp.batch;
  const ev=[], stages=[], rounds=[];
  const add=(t,kind,o)=>{ ev.push(Object.assign({t,kind,id:ev.length}, o||{})); };
  const Dl = Object.assign({}, D, {line:{sens:cfg.sens??D.line.sens, spec:cfg.spec??D.line.spec}, budget:cfg.budget||D.budget});
  stages.push({key:'spec', name:'Spec', t0:0, t1:5, agent:'arch'});
  stages.push({key:'ref', name:'Reference', t0:5, t1:11, agent:'train'});
  add(0,'human',{text:S.prompt});
  add(.5,'text',{agent:'arch', html:`I read this as a ${Dl.decision} chip. Before proposing anything I'll pin down the inputs, the clinical line and the gate budget, then train a full-size reference model so we know how good a large model can get.`});
  add(1.6,'plan',{});
  add(3.0,'spec',{});
  add(5,'stage',{stage:'ref', label:'Reference model'});
  add(5.3,'text',{agent:'train', html:`Training a full-size ${Dl.ref.kind} on the training ${Dl.who}. It is too large for a chip, but it sets the ceiling the small designs are measured against.`});
  add(5.8,'tool',{agent:'train', title:'Train reference model', t1:9.6, lines:refLines(Dl)});
  add(10.2,'ref',{});
  let eff={gm:1,sd:0,dm:1,spd:0};
  const pend = steers.filter(s=>s.type==='redirect').map(s=>Object.assign({}, s, {used:false}));
  let nR = MODES[cfg.mode].rounds, b=11, prev=null;
  for(let r=1; r<=nR; r++){
    const applied=[];
    for(const s of pend){ if(!s.used && s.t <= b){ s.used=true; s.round=r; applied.push(s); const fx=steerEffect(s.text); eff={gm:eff.gm*fx.gm, sd:eff.sd+fx.sd, dm:eff.dm*fx.dm, spd:(eff.spd||0)+(fx.spd||0)}; } }
    let T = targetFor(Dl, r, eff);
    if(prev && eff.gm<=1 && T.g >= prev.g) T.g = Math.round(prev.g*.9);
    const R = genRound(Dl, cfg, r, b, N, T, applied);
    rounds.push(R);
    for(const k of ['propose','train','compile','verify']){
      const t0 = {propose:b, train:b+3, compile:b+9, verify:b+12}[k];
      stages.push({key:k, name:{propose:'Propose',train:'Train',compile:'Compile',verify:'Verify'}[k], t0, t1:t0+({propose:3,train:6,compile:3,verify:5}[k]), round:r, agent:{propose:'arch',train:'train',compile:'comp',verify:'ver'}[k]});
    }
    roundEvents(add, Dl, R, prev, N);
    prev = R.best;
    b += 17;
    if(r===nR && nR<6 && pend.some(s=>!s.used && s.t < b)) nR++;
  }
  const tR=b;
  stages.push({key:'report', name:'Report', t0:tR, t1:tR+9, agent:'rep'});
  const fin = rounds[rounds.length-1].best;
  add(tR,'stage',{stage:'report', label:'Sign-off and report'});
  add(tR+.3,'text',{agent:'rep', html:`All ${rounds.length} rounds are done. The chosen chip is <b>${fin.id}</b>: ${fmt(fin.g)} gates, worst-patient sensitivity ${pct(fin.s)}, specificity ${pct(fin.sp)}. It is waiting for your sign-off before I write the datasheet.`});
  add(tR+.8,'gate',{t1:tR+4});
  add(tR+4.3,'tool',{agent:'rep', title:'Write datasheet and limits', t1:tR+7.6, lines:reportLines(Dl, fin)});
  add(tR+8.2,'report',{});
  // human steering and side questions
  for(const s of steers){
    if(s.type==='ask'){ add(s.t,'ask',{text:s.text}); add(s.t+1.1,'answer',{agent:'arch', html:s.answer}); continue; }
    const p = pend.find(x=>x.sid===s.sid);
    add(s.t,'steer',{text:s.text, sid:s.sid});
    add(s.t+1.3,'reply',{agent:'arch', html:replyText(Dl, s, p, rounds), sid:s.sid, round:p&&p.round});
  }
  ev.sort((x,y)=>x.t-y.t || x.id-y.id);
  ev.forEach((e,i)=>e.n=i);
  return {D:Dl, dk, cfg, N, comp, ev, stages, rounds, tR, end:tR+9, steers};
}
function refLines(D){
  return [
    {f:0, c:`$ train reference --data train(${D.key==='eeg'?59:37} ${D.who}) --tune(${D.key==='eeg'?8:6})`},

function sendSteer(text, type){

  const t = S.liveT + 0.01;
  if(type==='ask'){ S.steers.push({sid:steerSeq++, type:'ask', t, text, answer:answerFor(text)}); }
  else S.steers.push({sid:steerSeq++, type:'redirect', t, text});

/* ---------- downloads ---------- */
function download(kind){
  const sn=snap(S.t), B=sn.best, D=S.run.D; if(!B) return;
  let name, body;
  if(kind==='v'){ name=`${B.id}.v`; const r=mulberry(hashStr(B.id)); const ops=['and','xor','or','not','and','xor']; const lines=[`// ${D.title}, ${B.id}. Demo data from a simulated run.`, `// ${fmt(B.g)} two-input gates, longest path ${B.d} levels, weights wired in.`, `module ${D.key==='eeg'?'seizure_flag':'brain_oxygen'} (input wire [${D.nInBits-1}:0] x, output wire ${D.key==='eeg'?'y':'[7:0] y'});`, `  wire [${B.g-1}:0] n;`];
    for(let i=0;i<B.g;i++){ const op=ops[Math.floor(r()*ops.length)]; const a = i<64 ? `x[${Math.floor(r()*D.nInBits)}]` : `n[${Math.floor(r()*i)}]`; const b = i<64 ? `x[${Math.floor(r()*D.nInBits)}]` : `n[${Math.floor(r()*i)}]`; lines.push(op==='not' ? `  not g${i} (n[${i}], ${a});` : `  ${op} g${i} (n[${i}], ${a}, ${b});`); }

}

/* --- chip --- */
function resolveRef(ref, sn){
  const run=S.run;
  if(ref==='best' || ref==null) return sn.best;
  if(ref==='prev') return sn.prevBest;
  if(typeof ref==='string' && ref.startsWith('R')){ const r=+ref.slice(1); const R=run.rounds[r-1]; return R && sn.t>=R.t.chosen ? R.best : null; }
  const R=run.rounds[ref.r-1]; if(!R || sn.t < R.t.train) return null; return candOf(R, ref.i);
}
function mountChip(vp){

  V.update=(sn,force)=>{
    const run=S.run; const key=(sn.best?sn.best.id:'-')+'|'+JSON.stringify(S.chipA)+'|'+JSON.stringify(S.chipB)+'|'+Math.floor(sn.t*2)+'|'+run.ev.length;

    renderPane($('#paneB'), B, 'B', sn, A);
  };
}

    <div class="panel"><div class="panel-h">${ic('activity','s14')}${D.key==='eeg'?'EEG':'Light readings'}, <span class="mono" id="sgPat"></span><span class="sub">${D.signal}</span><span class="sp"></span><div class="legend"><span><i style="background:#fb923c"></i>${D.key==='eeg'?'Seizure (clinician label)':'Low oxygen (reference)'}</span><span><i style="background:#1d4ed8"></i>Chip flag</span></div></div><div class="panel-b"><canvas id="sgC" style="height:${D.key==='eeg'?330:320}px"></canvas><div class="muted" style="font-size:11.5px;margin-top:6px" id="sgNote"></div></div></div>
    <div class="sig-grid">
      <div class="panel"><div class="panel-h">${ic('shield','s14')}Circuit against model, bit for bit<span class="sp"></span><span id="bitTag"></span></div><div class="panel-b" style="display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start"><div><div class="bigok num" id="bitN">0</div><div class="muted" style="font-size:12px" id="bitL"></div><div style="font-size:12px;margin-top:12px;line-height:1.55;color:var(--ink-600)" id="bitTxt"></div></div><canvas id="bitC" style="height:230px"></canvas></div></div>
      <div class="panel"><div class="panel-h">${ic('list','s14')}Per patient, unseen ${D.who}<span class="sp"></span><span class="sub">bars 80 to 100%, green tick is the line</span></div><div class="panel-b" id="ptT"></div></div>
    </div></div>`;
  V.update=(sn,force)=>{
    const run=S.run; const B=sn.best; const pIdx = S.patient!=null ? S.patient : (B ? B.patients.findIndex(p=>p.sens===Math.min(...B.patients.map(q=>q.sens))) : 2);
    $('#sgPat').textContent = (B? B.patients[pIdx].id : 'P'+pad2(pIdx+1)) + (S.patient==null && B ? ' (lowest sensitivity)' : '');
    drawSignal($('#sgC'), sn.t, {patient:pIdx, cand:B});
    $('#sgNote').textContent = B ? `Chip ${B.id}. The model row is the trained model's output on the same ${D.unit}; it matches the chip on every one.${D.key==='eeg'?' Each block is a 4-second step of the 8-second window.':''}` : 'No chip has passed verification yet, so only the label row is drawn.';
    const R = run.rounds.slice().reverse().find(R=>sn.t>=R.t.verify) || null;
    const key=(R?R.r:0)+'|'+Math.floor(sn.t*6)+'|'+pIdx+'|'+(B?B.id:'');
    if(!force && V.k===key) return; V.k=key;
    const n = drawBits($('#bitC'), sn.t, R);
    const fin = R && sn.t>=R.t.chosen;
    const mism = R && R.r===1 && !fin && n>D.windows*.2 && n<D.windows*.45;
    $('#bitN').innerHTML = R ? `${fmt(n)}<span style="font-size:16px;color:var(--ink-500)"> / ${fmt(D.windows)}</span>` : '0';
    $('#bitL').textContent = R ? `${D.unit} identical, ${R.best.id}` : 'Waiting for the first circuit';
    $('#bitTag').innerHTML = !R ? '<span class="tag ink">waiting</span>' : fin ? `<span class="tag ok">${ic('check','s12')}identical</span>` : mism ? '<span class="tag bad">8 differ, patching</span>' : '<span class="tag blue">checking</span>';
    $('#bitTxt').innerHTML = !R ? `The Verifier runs the compiled circuit on every ${D.unit.slice(0,-1)} from ${D.patients} unseen ${D.who} and compares each output bit with the trained model.` : R.r===1 ? 'Round 1 found 8 differing outputs from an adder overflow; the Compiler switched to saturating adders and the re-run matched everywhere.' : 'Every output bit matches the trained model, so the numbers on the right hold for the chip itself.';
    if(!B){ $('#ptT').innerHTML = `<div class="empty"><b>No results yet</b>Per-patient sensitivity and specificity appear after the first verified chip.</div>`; return; }
    const ws=Math.min(...B.patients.map(p=>p.sens)), wp=Math.min(...B.patients.map(p=>p.spec));
    $('#ptT').innerHTML = `<div class="pt-row" style="cursor:default;color:var(--ink-500);font-size:11px"><span>Patient</span><span>Sensitivity</span><span></span><span>Specificity</span><span></span></div>` + B.patients.map((p,k)=>`<div class="pt-row ${k===pIdx?'sel':''}" data-p="${k}" title="Show ${p.id} in the signal strip"><span class="mono">${p.id}</span><span class="hb ${p.sens<D.line.sens?'fail':''}"><i style="width:${clamp((p.sens-80)/20,0,1)*100}%;${p.sens===ws?'background:var(--orange)':''}"></i><span class="ln" style="left:${(D.line.sens-80)/20*100}%"></span></span><span class="n">${p.det}/${p.pos}</span><span class="hb"><i style="width:${clamp((p.spec-80)/20,0,1)*100}%;${p.spec===wp?'background:var(--orange)':''}"></i><span class="ln" style="left:${(D.line.spec-80)/20*100}%"></span></span><span class="n">${pct(p.spec)}</span></div>`).join('') + `<div class="muted" style="font-size:11.5px;margin-top:8px">Sensitivity shown as ${D.posWord} caught. Orange marks the lowest patient. ${fmt(B.patients.reduce((a,p)=>a+p.pos,0))} ${D.posWord} in ${fmt(D.windows)} ${D.unit}.</div>`;
    $$('#ptT [data-p]').forEach(r=>r.onclick=()=>{ S.patient=+r.dataset.p; tick(true); });
  };
}

/* --- agents --- */
function mountAgents(vp){
  vp.innerHTML = `<div class="view pad"><div class="vh"><h2>Agents</h2><p>Five single-purpose agents. Each one's live output, the plan they share, their decisions and your steering.</p></div>
    <div class="ag"><div class="panel plan"><div class="panel-h">${ic('list','s14')}Plan<span class="sp"></span><span class="sub" id="agPc"></span></div><div class="panel-b"><ul id="agPlan"></ul></div></div>
      <div class="agents" id="agList"></div>
      <div class="ag-right" style="display:flex;flex-direction:column;gap:14px"><div class="panel log"><div class="panel-h">${ic('history','s14')}Decision log</div><div class="panel-b" style="max-height:330px;overflow:auto"><ul id="agDec"></ul></div></div>
      <div class="panel log"><div class="panel-h">${ic('loop','s14')}Steering history</div><div class="panel-b"><ul id="agSteer"></ul><button class="btn sm" id="agRedir" style="margin-top:8px">${ic('msg','s12')}Redirect</button></div></div></div></div></div>`;
  $('#agRedir').onclick=e=>openRedirect(e.currentTarget);
  V.update=(sn,force)=>{
    const run=S.run, t=sn.t; const key=Math.floor(t*4)+'|'+run.ev.length+'|'+S.playing; if(!force && V.k===key) return; V.k=key;
    const it=planItems(t); $('#agPlan').innerHTML = it.map(p=>`<li class="${p.st}"><span class="bx">${p.st==='done'?ic('check','s12'):''}</span><span>${p.text}</span></li>`).join(''); $('#agPc').textContent=`${it.filter(x=>x.st==='done').length} of ${it.length}`;
    const evs = run.ev.filter(e=>e.t<=t);
    $('#agList').innerHTML = AGENTS.map(a=>{ const mine=evs.filter(e=>e.agent===a.k && (e.kind==='text'||e.kind==='reply'||e.kind==='answer')); const last=mine[mine.length-1], older=mine[mine.length-2];
      const active = sn.cur && sn.cur.agent===a.k && !sn.done; const tok = (sn.cost.byAgent[a.k]||0)/7.4*1e6; const cfgA = run.cfg.agents.find(x=>x.k===a.k)||a;
      let body = last ? stripTags(last.html) : 'Waiting for its first step.'; let caret=''; if(last && t-last.t<1.1 && S.playing){ body=body.slice(0, Math.floor(body.length*clamp((t-last.t)/1.1,0,1))); caret='<span class="caret"></span>'; }
      return `<div class="agent ${active?'active':''}"><div class="agent-h"><span class="av" style="background:${a.tint};color:${a.color}">${a.g}</span><div style="min-width:0"><b>${a.name}</b><div class="rl">${a.role}</div></div><span style="flex:1"></span>${active?(S.playing?'<span class="tag blue"><span class="mspin" style="width:9px;height:9px"></span>working</span>':'<span class="tag warn">paused</span>'):'<span class="tag ink">idle</span>'}</div>
        <div class="agent-b">${esc(body)}${caret}${older?`<div class="older"><span class="mono" style="font-size:10.5px">+${clock(older.t)}${older.r?', round '+older.r:''}</span> ${esc(stripTags(older.html).slice(0,150))}${stripTags(older.html).length>150?'…':''}</div>`:''}</div>
        <div class="agent-f"><span>${cfgA.model}</span><span>${cfgA.effort.toLowerCase()} effort</span><span style="flex:1"></span><span>${fmt(tok/1000)}k tokens</span></div></div>`; }).join('');
    const decs = evs.filter(e=>e.dec).slice().reverse();
    $('#agDec').innerHTML = decs.length ? decs.map(e=>`<li><span class="tm">+${clock(e.t)}</span><span>${esc(e.dec)} <span class="muted" style="font-size:11px">${AG[e.agent||'ver'].name}</span></span></li>`).join('') : '<li><span></span><span class="muted">Decisions appear as the agents make them.</span></li>';
    const st = evs.filter(e=>e.kind==='steer'||e.kind==='ask');
    $('#agSteer').innerHTML = st.length ? st.map(e=>{ const rep = run.ev.find(x=>x.kind==='reply'&&x.sid===e.sid); return `<li><span class="tm">+${clock(e.t)}</span><span><b style="font-weight:600;color:var(--teal-900)">${e.kind==='ask'?'Asked':'You'}:</b> ${esc(e.text)}${rep&&rep.t<=t?`<br><span class="muted" style="font-size:11.5px">${rep.round?`Applied from round ${rep.round}.`:'Noted, too late to change this run.'}</span>`:''}</span></li>`; }).join('') : '<li><span></span><span class="muted">No redirects yet. Pause the run and type an instruction; the Architect replies and re-plans the next round.</span></li>';
  };
}

/* --- cost and compute --- */
function mountCost(vp){
  vp.innerHTML = `<div class="view pad"><div class="vh"><h2>Cost and compute</h2><p>Money, GPU hours and candidates so far, against the run's $25.00 cap.</p></div>
    <div class="kpis" id="kp"></div>
    <div class="cost-grid"><div class="panel"><div class="panel-h">${ic('coins','s14')}Spend over the run<span class="sp"></span><div class="legend"><span><i style="background:#a78bfa88"></i>Agents (tokens)</span><span><i style="background:#3b82f688"></i>GPU</span><span><i style="background:#0e749088"></i>CPU</span></div></div><div class="panel-b"><canvas id="burn" style="height:330px"></canvas></div></div>
      <div class="panel"><div class="panel-h">${ic('bot','s14')}Agent tokens</div><div class="panel-b" id="byAgent"></div><div class="panel-h" style="border-top:1px solid var(--ink-150)">${ic('cpu','s14')}Compute for this run</div><div class="panel-b" id="compBox"></div></div></div>
    <div class="panel" style="margin-top:14px"><div class="panel-h">${ic('list','s14')}By stage</div><div id="byStage"></div></div></div>`;
  V.update=(sn,force)=>{
    const run=S.run, c=sn.cost; const key=Math.floor(sn.t*3)+'|'+run.ev.length; if(!force && V.k===key) return; V.k=key;
    const fin=costAt(run.end);
    $('#kp').innerHTML = [['Spent so far', money(c.total), `projected ${money(fin.total)} at finish`],['GPU hours', c.gpuH.toFixed(2), `${run.comp.name}, $${run.comp.price.toFixed(2)}/h`],['Agent tokens', fmt(c.tokens/1000)+'k', money(c.llm)+' of model calls'],['Candidates evaluated', fmt(sn.cands), `${fmt(run.N)} per batch`],['Per 1,000 candidates', sn.cands? money(c.total/sn.cands*1000):'none yet', 'all costs included']].map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v num">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('');
    drawBurn($('#burn'), sn.t);
    const maxA = Math.max(...AGENTS.map(a=>fin.byAgent[a.k]||0));
    $('#byAgent').innerHTML = AGENTS.map(a=>`<div class="hbar"><span>${a.name}</span><span class="t"><i style="width:${(c.byAgent[a.k]||0)/maxA*100}%;background:${a.color}"></i></span><span class="mono" style="text-align:right;font-size:11.5px">${fmt((c.byAgent[a.k]||0)/7.4*1000)}k</span></div>`).join('');
    $('#compBox').innerHTML = `<dl class="kv"><dt>Training batches</dt><dd>${run.comp.name}</dd><dt>Compile and checks</dt><dd>CPU Plus</dd><dt>Batch size</dt><dd>${fmt(run.N)} candidates</dd><dt>Mode</dt><dd>${run.cfg.mode}</dd><dt>Budget cap</dt><dd>$25.00, wrap up at cap</dd></dl>`;
    const order=['spec','ref','propose','train','compile','verify','report']; const names={spec:'Spec',ref:'Reference',propose:'Propose',train:'Train batch',compile:'Compile',verify:'Verify',report:'Report'};
    $('#byStage').innerHTML = `<table class="t"><thead><tr><th>Stage</th><th class="n">Time</th><th class="n">Agents</th><th class="n">GPU</th><th class="n">CPU</th><th class="n">Total</th><th style="width:30%">Share of spend</th></tr></thead><tbody>${order.map(k=>{ const b=c.byStage[k]||{llm:0,gpu:0,cpu:0,time:0}; const tot=b.llm+b.gpu+b.cpu; return `<tr><td>${names[k]}${['propose','train','compile','verify'].includes(k)?` <span class="muted" style="font-size:11px">${run.rounds.filter(R=>sn.t>=R.t.propose).length} rounds</span>`:''}</td><td class="n">${b.time?dur(b.time):'0 min'}</td><td class="n">${money(b.llm)}</td><td class="n">${money(b.gpu)}</td><td class="n">${money(b.cpu)}</td><td class="n"><b>${money(tot)}</b></td><td><span class="hb" style="display:block"><i style="width:${c.total?tot/c.total*100:0}%;background:var(--ink-700)"></i></span></td></tr>`; }).join('')}</tbody></table>`;
  };
}

/* --- report --- */
function mountReport(vp){
  vp.innerHTML = `<div class="view"><div class="report" id="rep"></div></div>`;
  V.update=(sn,force)=>{
    const run=S.run, D=run.D; const key=(sn.best?sn.best.id:'-')+'|'+sn.done+'|'+run.ev.length+'|'+Math.floor(sn.t); if(!force && V.k===key) return; V.k=key;
    const B=sn.best; const el=$('#rep');
    if(!B){ el.innerHTML = `<span class="draft">${ic('file','s12')}Draft</span><h1>${D.title}</h1><p class="lede">The datasheet writes itself as the run goes. It needs a verified chip first; round 1 checks its chip at +${clock(run.rounds[0].t.chosen)}.</p>${ledgerBlock()}`; return; }
    const pos=B.patients.reduce((a,p)=>a+p.pos,0), det=B.patients.reduce((a,p)=>a+p.det,0);
    el.innerHTML = `${sn.done?`<span class="tag ok">${ic('check','s12')}Final, signed off</span>`:`<span class="draft">${ic('file','s12')}Draft, based on the current best. It updates as rounds finish.</span>`}
      <h1>${D.title}, ${B.id}</h1>
      <p class="lede">A ${fmt(B.g)}-gate circuit that ${D.key==='eeg'?'raises a seizure flag from eight newborn EEG channels':'turns eight near-infrared light readings into a brain-oxygen value and a low-oxygen flag'}. On ${D.patients} ${D.who} it never saw, it caught ${det} of ${pos} ${D.posWord}, at least ${pct(B.s)} in every patient, and its output matched the trained model on all ${fmt(D.windows)} ${D.unit}.</p>
      <div class="ds-table"><div><div class="l">Gates</div><div class="v">${fmt(B.g)}</div></div><div><div class="l">Longest path</div><div class="v">${B.d} levels</div></div><div><div class="l">Estimated area</div><div class="v">${(B.g*9.6/1e6).toFixed(3)} mm²</div></div>
        <div><div class="l">Worst-patient sensitivity</div><div class="v">${pct(B.s)} <span class="muted" style="font-size:11px;font-weight:400">line ${D.line.sens}%</span></div></div><div><div class="l">Worst-patient specificity</div><div class="v">${pct(B.sp)} <span class="muted" style="font-size:11px;font-weight:400">line ${D.line.spec}%</span></div></div><div><div class="l">Circuit equals model</div><div class="v">${fmt(D.windows)} / ${fmt(D.windows)}</div></div></div>
      <h3>The circuit</h3><div class="panel" style="padding:10px">${chipSVG(B,{w:840,h:300})}</div>
      <p style="margin-top:10px;font-size:14px;color:var(--ink-600)">${D.families[B.fam]} with layers ${D.inputs.length} → ${B.layers.join(' → ')}. Inputs: ${D.inputBits}. Output: ${D.output}, ${D.outputDesc}. The orange trace is the longest path.</p>
      <h3>How the agents got here</h3>
      <table class="t"><thead><tr><th>Round</th><th>Chip</th><th class="n">Gates</th><th class="n">Change</th><th class="n">Worst sens.</th><th>What changed</th></tr></thead><tbody>${run.rounds.filter(R=>sn.t>=R.t.chosen).map((R,k,arr)=>`<tr><td>${R.r}</td><td class="mono">${R.best.id}</td><td class="n">${fmt(R.best.g)}</td><td class="n">${k?((R.best.g-arr[k-1].best.g)/arr[k-1].best.g*100).toFixed(0)+'%':''}</td><td class="n">${pct(R.best.s)}</td><td style="white-space:normal;font-size:12px;color:var(--ink-600)">${esc(R.change)}</td></tr>`).join('')}</tbody></table>
      <h3>Limits</h3><ul class="limits"><li>Tested on ${D.patients} unseen ${D.who} from one data source; other units, devices and ${D.key==='eeg'?'montages':'sensor placements'} are untested.</li><li>${D.key==='eeg'?'Assumes the fixed 8-channel montage above; a missing channel is not detected by the chip.':'Assumes the probe geometry above; a different source-detector spacing needs re-training.'}</li><li>The bit-for-bit check proves the chip equals the trained model, not that the model is right; accuracy rests on the clinician labels.</li><li>A design-stage result from a simulated demo run. It is not clinically validated and is not a medical device.</li></ul>
      <h3>Files</h3><div class="files"><button class="btn" data-dl="v">${ic('download','s14')}Circuit netlist, ${B.id}.v</button><button class="btn" data-dl="md">${ic('download','s14')}Datasheet</button><button class="btn" data-dl="csv">${ic('download','s14')}Verification log, CSV</button></div>
      ${ledgerBlock()}`;
    $$('[data-dl]',el).forEach(b=>b.onclick=()=>download(b.dataset.dl));
  };
}
function ledgerBlock(){ return `<h3>Gates per diagnosis, across devices</h3><div class="list">${ledgerRows(true)}</div>`; }

/* ---------- loop ---------- */
let lastFrame=performance.now(), lastDom=0;
function tick(force){
  if(S.screen!=='run' || !S.run) return;
  const sn=snap(S.t);
  updateChrome(sn);
  if(V.update) V.update(sn, force===true);
  if(sn.done!==tick.lastDone){ tick.lastDone=sn.done; renderSide(); }
  // sidebar badges
  $$('#side [data-badge]').forEach(b=>{ const k=b.dataset.badge; const v = k==='design'?fmt(sn.cands): k==='chip'?(sn.best?fmt(sn.best.g):''): k==='cost'?money(sn.cost.total): k==='signal'?(sn.best?'checked':''): k==='report'?(sn.done?'ready':'draft'):''; if(b.textContent!==v) b.textContent=v; });
}
let prevBestId=null;
function frame(now){
  const dt=Math.min(.1,(now-lastFrame)/1000); lastFrame=now;
  if(S.screen==='run' && S.run){
    const run=S.run;
    if(S.playing){
      const gateEv = run.ev.find(e=>e.kind==='gate');
      S.liveT = Math.min(run.end, S.liveT + dt*S.speed);
      if(S.gate.held && gateEv) S.liveT=Math.min(S.liveT, gateEv.t+.5);
      if(S.follow) S.t=S.liveT; else { S.t=Math.min(S.liveT, S.t+dt*S.speed); if(S.t>=S.liveT-1e-6) S.follow=true; }
      if(S.liveT>=run.end){ S.playing=false; }
    }
    if(now-lastDom>80){ lastDom=now; tick(false);
      const sn=snap(S.t); const bid=sn.best?sn.best.id:null; if(bid && bid!==prevBestId && S.follow && prevBestId!==null && S.view!=='conversation' && S.view!=='chip') toast(`New best: ${fmt(sn.best.g)} gates in round ${sn.best.r}.`, 'chip'); prevBestId=bid; }
  }
  requestAnimationFrame(frame);
}
/* scrubbing */
(function(){ const sc=$('#scrub'); let drag=false; const seek=e=>{ const r=sc.getBoundingClientRect(); const f=clamp((e.clientX-r.left)/r.width,0,1); const t=f*S.run.end; S.t=Math.min(t,S.liveT); S.follow = S.t>=S.liveT-.05; tick(true); };
  sc.addEventListener('pointerdown', e=>{ if(!S.run) return; drag=true; sc.classList.add('drag'); sc.setPointerCapture(e.pointerId); seek(e); });
  sc.addEventListener('pointermove', e=>{ if(drag) seek(e); }); sc.addEventListener('pointerup', ()=>{ drag=false; sc.classList.remove('drag'); }); })();

/* ---------- global events ---------- */
document.addEventListener('click', e=>{
  const v=e.target.closest('[data-view]'); if(v && v.closest('#side')){ setView(v.dataset.view); return; }
  const g=e.target.closest('[data-go]'); if(g){ if(g.dataset.go==='start') goStart(); else if(S.run){ S.screen='run'; $('#start').hidden=true; $('#run').hidden=false; renderChrome(); setView(S.view,true); } return; }
  const o=e.target.closest('[data-old]'); if(o){ toast(o.dataset.old==='x'?'That run was stopped before round 1; nothing to open in this demo.':'Earlier runs are not part of this demo. Replaying the current run instead.'); return; }
  const p=e.target.closest('[data-preset]'); if(p){ setDevice(p.dataset.preset); renderStart(); return; }
  const pp=e.target.closest('[data-pop]'); if(pp){ startPop(pp.dataset.pop, pp); return; }
  if(e.target.closest('#startBtn')){ launch(); return; }
});
window.addEventListener('resize', ()=>{ if(S.screen==='run'){ if(V.update) V.update(snap(S.t), true); if(S.view==='conversation'){ V.k=null; $$('#streamIn canvas').forEach(()=>{}); } } });

/* test hooks for the mock-up */
window.__cw = { seek(t){ S.liveT=Math.max(S.liveT,t); S.t=t; S.follow=true; tick(true); }, pause(){ setPlaying(false); }, play(){ setPlaying(true); }, get state(){ return S; } };

/* ---------- boot ---------- */
setDevice('eeg');
const h0 = location.hash.slice(1);
renderStart(); renderSide();
if(VIEWS.find(v=>v.k===h0)) startRun('eeg', h0);
requestAnimationFrame(frame);
})();
</script>
