<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI scientist</title>
<style>
:root{
  --wash:#f7f7f5;--card:#fff;--glass:rgb(255 255 253 / .8);--glass-s:rgb(255 255 253 / .97);
  --ink:#15192b;--ink2:#363b50;--ink3:#4f5569;--ph:#5a6075;
  --line:#d6d9e0;--line2:#e7e9ee;--fill:#f0f1f4;--fill2:#e4e6ec;
  --blue:#2563eb;--blue7:#1d4ed8;--bluebg:#e9effd;
  --ok:#0f8a5f;--okt:#065f46;--okbg:#e6f5ee;--okr:#9fd9bf;
  --bad:#dc2626;--badt:#991b1b;--badbg:#fdeeee;--badr:#f3c0c0;
  --pub:#0b6b63;--pubbg:#e1f2ef;--pubr:#9fd3c8;
  --own:#5b2bb5;--ownbg:#efe9fb;--ownr:#cbbbef;
  --asm:#8a4300;--asmbg:#fcefdb;--asmr:#eecb94;
  --run:#1d4ed8;--runbg:#e7edfc;--runr:#b6c8f5;
  --cand:#c2410c;
  --hair:rgb(0 0 0 / .07);--hair4:rgb(0 0 0 / .05);--hair8:rgb(0 0 0 / .09);
  --sh-menu:0 6px 24px rgb(16 20 40 / .12);--sh-hair:0 1px 3px rgb(0 0 0 / .05);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4","Source Serif Pro","New York",ui-serif,Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wash);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--hair);z-index:30;position:relative}
.sb-head{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--hair4);flex:none}
.logo{width:28px;height:28px;border-radius:8px;background:#15192b;display:grid;place-items:center;color:#fff;flex:none}
.logo svg.ic{width:16px;height:16px;stroke-width:2}
.wordmark{font-size:14px;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden}
.sq{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink3);flex:none}
.sq:hover{background:rgb(0 0 0 / .05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--ink2);font-size:12.5px;font-weight:500;text-align:left;white-space:nowrap}
.nav button svg.ic{width:18px;height:18px}
.nav button:hover{background:rgb(0 0 0 / .04)}
.nav button.on{background:var(--bluebg);color:var(--ink)}
.nav .count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--blue7);background:var(--bluebg);border-radius:99px;padding:1px 7px;font-style:normal}
.divider{height:1px;background:var(--hair4);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px;min-height:0}
.cap{font-size:11px;font-weight:600;color:var(--ink3);padding:10px 10px 6px}
.row{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer}
.row:hover{background:rgb(0 0 0 / .03)}
.row.on{background:var(--bluebg);color:var(--ink)}
.row .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--ink3);flex:none}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:0;box-shadow:0 0 0 2px var(--blue);border-radius:4px;padding:2px 4px;background:#fff}
.pending-bar{flex:1;height:8px;border-radius:4px;background:var(--fill2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.spin{animation:spin .9s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair4);padding:8px;flex:none}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0 / .04)}
.av{width:28px;height:28px;border-radius:50%;background:#3f4a6b;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--ink);line-height:1.2}
.acct .em{font-size:11px;color:var(--ink3)}
#sb.col{width:52px}
#sb.col .wordmark,#sb.col .logo,#sb.col .nav span,#sb.col .nav .count,#sb.col .runs,#sb.col .acct .who,#sb.col .divider{display:none}
#sb.col .sb-head{justify-content:center;padding:0}
#sb.col .nav button{justify-content:center;padding:0}
#sb.col .acct button{justify-content:center;padding:6px 0}
.runs-spacer{display:none}
#sb.col .runs-spacer{display:block;flex:1}
#mh{display:none;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:8px;padding:0 10px;background:var(--glass-s);border-bottom:1px solid var(--hair);z-index:25}
#scrim{display:none;position:fixed;inset:0;background:rgb(0 0 0 / .25);z-index:29}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
#demo{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--ink3);pointer-events:none;z-index:6;background:rgb(247 247 245 / .9);padding:2px 7px;border-radius:6px}

/* Start page */
.start{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 20px 64px}
.start-col{width:100%;max-width:672px}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:400;text-align:center;margin:0;letter-spacing:-.01em}
.sub{font-size:16px;color:var(--ink3);text-align:center;margin:12px 0 32px}
.box{background:var(--glass-s);border:1px solid var(--hair8);border-radius:24px;box-shadow:var(--sh-hair);padding:20px 20px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.5;min-height:21px;max-height:280px;padding:0;display:block}
.box textarea::placeholder{color:var(--ph);opacity:1}
.box textarea:focus-visible{outline:0}
.ctl{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:36px;flex-wrap:wrap}
@media(max-width:480px){.ctl:has(.cv-mic){gap:4px}.ctl:has(.cv-mic) .pill{padding:0 7px}}
.ctl .grow{flex:1}
.pill{height:26px;display:inline-flex;align-items:center;gap:5px;padding:0 10px;border-radius:99px;border:1px solid var(--hair8);background:#fff;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.pill:hover{background:var(--fill)}
.pill svg.ic{width:13px;height:13px}
.pill .chev{width:12px;height:12px;opacity:.7}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill2);color:#5a6075;flex:none;transition:all .12s}
.send.ready{background:#15192b;color:#fff;box-shadow:0 1px 4px rgb(0 0 0 / .2)}
.send svg.ic{width:18px;height:18px;stroke-width:2}
.files{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.file{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;background:var(--ownbg);color:var(--own);font-size:12px;font-weight:500}

/* Intake */
.intake{flex:1;overflow:auto;padding:40px 20px 72px}
.ik{max-width:680px;margin:0 auto}
.ik-top{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--hair8);border-radius:14px;background:#fff;margin-bottom:34px}
.ik-top .q{flex:1;font-size:13px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ik-top .meta{font-size:12px;color:var(--ink3);margin-top:3px}
.lnk{color:var(--blue7);font-size:12.5px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgb(29 78 216 / .35)}
.lnk:hover{text-decoration-color:currentColor}
.ik-step{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);margin-bottom:10px}
.ik-step .dots{display:flex;gap:5px}
.ik-step .dots i{width:22px;height:4px;border-radius:2px;background:var(--fill2)}
.ik-step .dots i.on{background:var(--ink)}
.ik h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.ik .lead{font-size:15px;line-height:1.55;color:var(--ink2);margin:0 0 24px;max-width:60ch}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:#fff;min-height:86px;transition:border-color .12s,box-shadow .12s}
.ans:hover{border-color:#9aa1b2;box-shadow:0 2px 10px rgb(16 20 40 / .07)}
.ans b{font-size:16px;font-weight:600}
.ans span{font-size:13px;color:var(--ink3);line-height:1.45}
.ans.primary{background:#15192b;border-color:#15192b;color:#fff}
.ans.primary span{color:#d5d8e2}
.searching{display:flex;flex-direction:column;gap:10px;padding:8px 0 4px}
.searching div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.searching .g{width:14px;height:14px;display:grid;place-items:center}
.found{border:1px solid var(--pubr);background:#fff;border-radius:16px;overflow:hidden;margin-bottom:16px}
.found .fh{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--pubbg);color:var(--pub);font-size:13px;font-weight:600}
.found.none{border-color:var(--asmr)}
.found.none .fh{background:var(--asmbg);color:var(--asm)}
.ds{padding:14px 18px;border-top:1px solid var(--line2)}
.ds:first-of-type{border-top:0}
.ds .dn{font-size:16px;font-weight:600}
.ds .dw{font-size:13px;color:var(--ink2);margin-top:2px}
.ds .facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.ds .facts span b{font-weight:600;color:var(--ink)}
.ds .why{margin-top:8px;font-size:13.5px;line-height:1.5;color:var(--ink)}
.rej{margin:6px 0 22px}
.rej summary{cursor:pointer;font-size:13px;color:var(--ink2);font-weight:500;padding:4px 0}
.rej ul{margin:6px 0 0;padding:0 0 0 18px;font-size:13px;line-height:1.6;color:var(--ink2)}
.asm-list{display:flex;flex-direction:column;border:1px solid var(--asmr);border-radius:16px;background:#fff;overflow:hidden;margin-bottom:18px}
.asm{display:grid;grid-template-columns:28px 1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line2);align-items:start}
.asm:first-child{border-top:0}
.asm .n{width:24px;height:24px;border-radius:7px;background:var(--asmbg);color:var(--asm);font-size:12px;font-weight:700;display:grid;place-items:center}
.asm .at{font-size:14px;font-weight:600;line-height:1.4}
.asm .aw{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:2px}
.asm .edit{grid-column:2 / 4;display:flex;gap:8px;margin-top:6px}
.asm .edit input{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;background:#fff}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;flex:none}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg button.on.yes{background:#0b6e4f;color:#fff}
.seg button.on.chg{background:var(--asm);color:#fff}
.ik-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--fill)}
.btn.dark{background:#15192b;border-color:#15192b;color:#fff}
.btn.dark:hover{background:#2a3046}
.btn.dark:disabled{background:#c9ccd5;border-color:#c9ccd5;color:#3d4255}
.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.blue{background:var(--blue7);border-color:var(--blue7);color:#fff}
.drop{border:1.5px dashed #9aa1b2;border-radius:16px;padding:26px;text-align:center;background:#fff;margin-bottom:16px}
.drop p{margin:6px 0 14px;font-size:13px;color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* Layer */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair8);border-radius:12px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{font-size:11px;font-weight:600;color:var(--ink3);padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:7px;font-size:12.5px;text-align:left;color:var(--ink)}
.opt:hover{background:var(--fill)}
.opt.sel{background:var(--bluebg)}
.opt:disabled{color:#6a6f80}
.opt:disabled:hover{background:none}
.opt .oh{font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.35}
.opt .ck{margin-left:auto;color:var(--blue7)}
.opt svg.ic{margin-top:1px;color:var(--ink3)}
.opt.danger{color:var(--badt)}.opt.danger svg.ic{color:var(--badt)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.field{display:flex;flex-direction:column;gap:4px;padding:6px 8px}
.field label{font-size:12px;font-weight:600;color:var(--ink)}
.field .fh{font-size:11.5px;color:var(--ink3);line-height:1.35}
select.sel{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;color:var(--ink)}
.link{color:var(--blue7);font-size:12px;font-weight:500;padding:6px 8px;text-align:left}
.modal-bg{position:fixed;inset:0;background:rgb(15 18 30 / .32);display:grid;place-items:start center;padding-top:12vh;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{width:min(540px,92vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgb(0 0 0 / .22);overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair)}
.modal .mh input{flex:1;border:0;outline:0;font-size:14px}
.modal .mb{padding:8px;max-height:50vh;overflow:auto}
.modal .mp{padding:20px 22px 8px;font-size:14px;line-height:1.55;color:var(--ink2)}
.modal .mp h3{margin:0 0 8px;font-size:18px;color:var(--ink)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#15192b;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:9px;box-shadow:var(--sh-menu);animation:popin .15s}

/* Run page */
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;background:rgb(255 255 255 / .8);border-bottom:1px solid var(--hair)}
.tabs{display:flex;gap:18px;height:100%;flex:none}
.tabs button{height:100%;font-size:12.5px;font-weight:500;color:var(--ink3);border-bottom:2px solid transparent;padding-top:2px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tabs button:hover:not(.on){color:var(--ink)}
.state{height:22px;display:inline-flex;align-items:center;padding:0 9px;border-radius:99px;font-size:12px;font-weight:500;flex:none}
.state.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px var(--okr)}
.state.paused{background:var(--fill);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.rtitle{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;flex:0 1 280px;color:var(--ink)}
.play{flex:1 1 auto;max-width:460px;display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto}
.pbtn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--ink2);flex:none}
.pbtn:hover{background:var(--fill)}
.pbtn svg.ic{width:14px;height:14px}
.clock{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--fill);color:var(--ink2);flex:none}
.clock.live{background:var(--badbg);color:var(--badt)}
.track{flex:1;height:4px;border-radius:2px;background:var(--fill2);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#ef4444}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#dc2626;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.end i{background:#4f5569}.track.end b{background:#363b50}
.livep{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:5px;background:var(--badbg);color:var(--badt);font-size:10px;font-weight:700;letter-spacing:.04em;flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
@keyframes blink{50%{opacity:.2}}
.srcbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--pubr);background:var(--pubbg);color:var(--pub);font-size:12.5px;font-weight:600;flex:none}
.srcbtn:hover{border-color:var(--pub)}
.body{flex:1;min-height:0;overflow:auto;position:relative}

/* Overview */
.ov{max-width:760px;margin:0 auto;padding:8vh 28px 80px}
.trust{font-family:var(--serif);font-size:27px;line-height:1.35;letter-spacing:-.005em;margin:0 0 22px;color:var(--ink)}
.ledger{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:var(--sh-hair)}
.lrow{width:100%;display:grid;grid-template-columns:4px 112px 1fr auto 16px;gap:0 14px;align-items:center;padding:15px 16px 15px 0;text-align:left;border-top:1px solid var(--line2)}
.lrow:first-child{border-top:0}
.lrow:hover{background:#fafbfc}
.lrow .mk{align-self:stretch;border-radius:0 3px 3px 0;margin:-15px 0}
.lrow .lk{font-size:13px;font-weight:600;color:var(--ink);padding-left:12px}
.lrow .lv{font-size:14px;line-height:1.45;color:var(--ink)}
.lrow .lv small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.lrow .ls{font-size:12px;font-weight:500;white-space:nowrap;padding:3px 9px;border-radius:99px}
.lrow .chev{color:var(--ink3)}
.ls.idle{background:var(--fill);color:var(--ink2)}
.ls.busy{background:var(--runbg);color:var(--run)}
.ls.okk{background:var(--okbg);color:var(--okt)}
.ls.asmk{background:var(--asmbg);color:var(--asm)}
.minibar{display:block;height:3px;border-radius:2px;background:var(--fill2);margin-top:6px;overflow:hidden;max-width:320px}
.minibar i{display:block;height:100%;background:var(--run);border-radius:2px}
.prog{margin-top:34px}
.nowline{font-size:14.5px;line-height:1.5;color:var(--ink);margin:0 0 10px;min-height:2.9em}
.nowline .then{color:var(--ink3)}
.prog-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.prog-top b{font-weight:600;color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue);transition:width .5s var(--ease)}
.bar.done i{background:var(--ok)}
.bar s{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#fff;z-index:1}
.steps{display:grid;margin-top:8px;font-size:11.5px;color:var(--ink3)}
.steps span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.steps span.past{color:var(--ink2)}
.steps span.cur{color:var(--blue7);font-weight:600}
.best{margin-top:30px;display:flex;align-items:baseline;gap:10px;font-size:15.5px;line-height:1.5;color:var(--ink);padding-top:22px;border-top:1px solid var(--line2)}
.best .dot{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}
.best .txt{flex:1}
.det{font-size:12.5px;color:var(--ink2);text-decoration:underline;text-decoration-color:#9aa1b2;text-underline-offset:3px;flex:none}
.det:hover{color:var(--ink)}
.details{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px;display:grid;grid-template-columns:1fr 1fr;column-gap:28px;animation:popin .15s}
.details div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.details div:nth-last-child(-n+2){border-bottom:0}
.details dt{color:var(--ink3)}
.details dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.cmp{display:flex;align-items:center;gap:22px;margin-top:16px;padding-left:19px}
.cmp-n{display:flex;flex-direction:column;flex:none;min-width:116px}
.cmp-n .n{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.cmp-n .u{font-size:12.5px;color:var(--ink2);margin-top:5px}
.cmp-r{flex:1;min-width:0}
.cmp-line{font-size:14px;color:var(--ink);margin-bottom:9px}
.cmp-line b{color:var(--okt);font-weight:700}
.cbar{display:grid;grid-template-columns:118px 1fr 70px;align-items:center;gap:10px;font-size:12px;margin-top:5px}
.cbar .cl{color:var(--ink2)}
.cbar .cv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.cbar .ct{height:10px;border-radius:3px;background:var(--fill);position:relative;overflow:hidden}
.cbar .ct i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;min-width:3px}
.cbar .ct i.ref{background:#8e95a6}
.cbar .ct i.me{background:var(--ok)}
.rounds{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px;animation:popin .15s}
.rounds .rh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:10px}
.rounds .rh span{font-weight:500;color:var(--ink2)}
.rrow{display:flex;align-items:flex-end;gap:8px}
.rstep{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.rstep .rb{width:100%;max-width:64px;height:46px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
.rstep .rb i{display:block;width:100%;background:#c3c8d3;border-radius:3px 3px 0 0;transition:height .5s var(--ease)}
.rstep .rl{font-size:11.5px;color:var(--ink3)}
.rstep .rv{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rstep.fin .rb i{background:var(--ok)}
.rstep.fin .rv{color:var(--okt);font-weight:700;font-size:15px}
.rstep.wait .rv{color:var(--ink3);font-weight:500;font-size:12.5px}
.rstep.wait .rb{border-bottom-style:dashed}
.rarr{color:var(--ink3);font-size:14px;padding-bottom:22px;flex:none}
.ctile{position:absolute;top:58px;right:18px;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:12px;background:rgb(255 255 255 / .92);border:1px solid var(--line);box-shadow:var(--sh-hair);text-align:left}
.ctile:hover{border-color:#8f96a8}
.ctile .ctx{display:flex;flex-direction:column;line-height:1.25}
.ctile .ck{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.ctile b{font-size:13px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.livedot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
svg.mchip{width:72px;height:44px;flex:none;overflow:visible}
svg.mchip path{stroke-width:2.2}
svg.mchip .fl{stroke-dasharray:4 8;animation:flow .9s linear infinite}
svg.mchip .d2{animation-delay:-.35s}svg.mchip .d3{animation-duration:.7s}svg.mchip .d4{animation-duration:.8s;stroke-width:1.3}
svg.mchip.on .die{animation:dieglow 1.4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes dieglow{50%{fill:#4a62b8}}
.cstat{max-width:740px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);min-height:18px;padding-left:4px}
.cstat .g{width:12px;height:12px;display:grid;place-items:center}
@media (max-width:1299px){.ctile{display:none}}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;border:1px solid transparent;vertical-align:1px;white-space:nowrap;cursor:pointer}
.tag:hover{border-color:currentColor}
.tag i{width:6px;height:6px;border-radius:2px;background:currentColor;opacity:.9}
.tag.pub{background:var(--pubbg);color:var(--pub)}
.tag.own{background:var(--ownbg);color:var(--own)}
.tag.asm{background:var(--asmbg);color:var(--asm)}
.tag.run{background:var(--runbg);color:var(--run)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* Chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;overflow:auto;padding:24px 20px 12px}
.feed-in{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;animation:popin .25s var(--ease)}
.msg .who{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:1px}

.msg .mn{font-size:12.5px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:baseline}

.msg .mt{font-size:14px;line-height:1.55;color:var(--ink);margin-top:2px}
.tool{margin-left:36px;border:1px solid var(--line);border-radius:10px;background:#fff;animation:popin .25s var(--ease);margin-top:-8px}
.tool>.th{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 10px;flex-wrap:wrap}
.tool>.th>button.tt{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);text-align:left;min-width:200px}
.tool>.th>button.tt svg.ic{width:13px;height:13px;color:var(--ink3)}
.tool>.th .chev{transition:transform .12s}
.tool.open>.th .chev{transform:rotate(90deg)}
.tool pre{margin:0;padding:8px 12px 10px;border-top:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;display:none}
.tool.open pre{display:block}
.you{align-self:flex-end;max-width:78%;background:#15192b;color:#fff;padding:9px 13px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.5;animation:popin .2s}
.typing{display:flex;gap:4px;padding:6px 0 0}
.typing i{width:6px;height:6px;border-radius:50%;background:#7a8094;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{flex:none;padding:8px 20px 28px}
.composer .box{max-width:740px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.composer textarea{flex:1;padding:8px 0}
.composer .box.off{background:var(--fill)}

/* Sources drawer */
#drawer{position:absolute;top:44px;right:0;bottom:0;width:440px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgb(16 20 40 / .1);z-index:20;display:flex;flex-direction:column;animation:slidein .18s var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 20px;border-bottom:1px solid var(--line2)}
.dr-h h3{margin:0;font-size:16px;flex:1}
.dr-b{flex:1;overflow:auto;padding:6px 20px 30px}
.dr-sec{padding-top:18px}
.dr-sec h4{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--ink)}
.dr-sec>p{margin:0 0 10px;font-size:12.5px;color:var(--ink3);line-height:1.45}
.src{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:box-shadow .3s,border-color .3s}
.src.hl{border-color:var(--ink);box-shadow:0 0 0 3px rgb(21 25 43 / .1)}
.src .s1{display:flex;align-items:flex-start;gap:8px}
.src .s1 b{flex:1;font-size:14px;line-height:1.35}
.src .s2{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.src dl{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;margin:8px 0 0;font-size:12.5px}
.src dt{color:var(--ink3)}
.src dd{margin:0;color:var(--ink)}
.src .use{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px}
.src a{color:var(--blue7);word-break:break-all}
.src .live{font-size:12px;font-weight:600;color:var(--run);margin-top:6px}

/* Visual */
.vis{max-width:1180px;margin:0 auto;padding:16px 24px 40px}
.picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picker button{height:30px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:500;color:var(--ink2);border:1px solid transparent;display:inline-flex;align-items:center;gap:4px}
.picker button:hover{background:var(--fill)}
.picker button.on{background:#15192b;color:#fff}
.picker .chev{width:12px;height:12px;opacity:.8}
.vh{display:flex;align-items:flex-end;gap:16px;margin:16px 0 12px}
.vh .vht{flex:1;min-width:0}
.vh h2{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.vh p{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.5;max-width:76ch}
.stage{position:relative;height:clamp(380px,calc(100dvh - 230px),640px);border-radius:18px;overflow:hidden;background:radial-gradient(120% 95% at 50% 15%,#fbfcfd 0%,#e6e9ef 50%,#cdd3dd 100%);border:1px solid var(--line);touch-action:none}
.stage canvas{display:block;width:100%!important;height:100%!important;outline:0}
.stage.grab{cursor:grab}.stage.grab:active{cursor:grabbing}
.ov3{position:absolute;inset:0;pointer-events:none}
.ov3 svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lab{position:absolute;pointer-events:none;font-size:12.5px;color:var(--ink);background:rgb(255 255 255 / .92);border:1px solid var(--line);border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px rgb(16 20 40 / .08);white-space:nowrap;transform:translate(-50%,-100%)}
.lab b{font-weight:700}
.lab small{display:block;font-size:11.5px;color:var(--ink3)}
.lab.pinl{transform:translate(0,-50%)}
.lab.dim{opacity:.0}
.card3{position:absolute;pointer-events:auto;width:238px;background:rgb(255 255 255 / .95);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgb(16 20 40 / .08);font-size:12.5px;line-height:1.45;color:var(--ink2)}
.card3 .ct{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.card3 .cw{font-weight:600;color:var(--ink);margin-top:4px}
.card3 svg.loc{width:38px;height:38px;flex:none}
.hud{position:absolute;pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hud .seg{background:rgb(255 255 255 / .9);box-shadow:0 1px 4px rgb(0 0 0 / .08)}
.hint{position:absolute;font-size:12px;color:var(--ink2);background:rgb(255 255 255 / .85);padding:3px 9px;border-radius:99px;pointer-events:none}
.est{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;pointer-events:auto}
.est>div{background:rgb(255 255 255 / .95);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:112px}
.est .k{font-size:11.5px;color:var(--ink3)}
.est .v{font-size:17px;font-weight:650;letter-spacing:-.01em;margin-top:1px;color:var(--ink)}
.est .e{font-size:10.5px;font-weight:600;color:var(--asm)}
.big{position:absolute;right:20px;top:16px;text-align:right;pointer-events:none}
.big .n{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.big .u{font-size:12.5px;color:var(--ink2)}
.qbtn{height:30px;padding:0 12px;border-radius:9px;background:rgb(255 255 255 / .94);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.qbtn:hover{border-color:#8f96a8}
.banner{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#15192b;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:99px;display:flex;gap:10px;align-items:center;pointer-events:auto;white-space:nowrap}
.banner button{color:#c9d7ff;text-decoration:underline;text-underline-offset:2px;font-size:12.5px}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.55}
.loading3{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px}
.vpanel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-height:300px}
.vpanel svg.v{width:100%;height:auto;display:block;font-family:var(--sans)}
.pts{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.pt{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;position:relative}
.pt .pn{font-size:12px;color:var(--ink3)}
.pt .pv{font-size:24px;font-weight:650;letter-spacing:-.02em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.pt .pm{height:4px;border-radius:2px;background:var(--fill2);position:relative}
.pt .pm i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pt .pm u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.pt .ps{font-size:12px;margin-top:8px;font-weight:500}
.pt.pass .ps{color:var(--okt)}.pt.pass .pm i{background:var(--ok)}
.pt.fail{background:var(--badbg);border-color:var(--badr)}.pt.fail .ps{color:var(--badt)}.pt.fail .pm i{background:var(--bad)}
.pt.worst{box-shadow:0 0 0 2px #b45309}
.pt .wtag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;color:var(--asm);background:var(--asmbg);border-radius:99px;padding:1px 7px}
.pt.wait{background:var(--wash);border-style:dashed}.pt.wait .pv{color:var(--ink3)}
.pnote{margin-top:12px;font-size:13px;color:var(--asm);background:var(--asmbg);border-radius:10px;padding:8px 12px}

/* Settings */
.cfg{display:flex;flex:1;min-height:0}
.cfg-rail{width:220px;flex:none;border-right:1px solid var(--hair);padding:20px 10px}
.cfg-rail h1{font-size:20px;font-weight:600;margin:0 10px 14px}
.cfg-rail button{width:100%;height:34px;border-radius:7px;padding:0 10px;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink2)}
.cfg-rail button:hover{background:rgb(0 0 0 / .04)}
.cfg-rail button.on{background:var(--bluebg);color:var(--ink)}
.cfg-main{flex:1;overflow:auto;padding:28px 36px 60px}
.cfg-main h2{font-size:20px;font-weight:600;margin:0 0 4px}
.cfg-main>p{color:var(--ink3);margin:0 0 22px;font-size:13.5px}
.cfg-card{max-width:620px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 20px}
.crow{display:flex;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:0}
.crow .cl{flex:1}
.crow .cl b{display:block;font-size:13.5px;font-weight:600}
.crow .cl span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.sw{width:34px;height:20px;border-radius:99px;background:#9aa1b2;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .12s}
.sw[aria-checked=true]{background:var(--blue7)}
.sw[aria-checked=true]::after{transform:translateX(14px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media (max-width:1279px){.rtitle{flex-basis:180px}.pts{grid-template-columns:repeat(5,1fr)}}
@media (max-width:1180px){.card3{width:196px!important;padding:10px 12px}.card3 .cbody{display:none}.card3 button{white-space:nowrap;font-size:12.5px}.est>div{min-width:96px}}
@media (max-width:767px){
  #mh{display:flex}
  #main{padding-top:48px}
  #sb{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .15s var(--ease);background:var(--glass-s);box-shadow:var(--sh-menu)}
  #sb.open{transform:none}
  #sb.open~#scrim{display:block}
  .topbar{padding:0 10px;gap:10px}
  .rtitle,.track,#live{display:none}
  .play{flex:0 0 auto;margin-left:auto}
  .srcbtn span{display:none}
  .ov{padding:28px 18px 60px}
  .trust{font-size:21px}
  .lrow{grid-template-columns:4px 1fr 16px;gap:4px 12px}
  .lrow .lk{grid-column:2;padding-left:0}
  .lrow .lv{grid-column:2}
  .lrow .ls{grid-column:2;justify-self:start}
  .lrow .chev{grid-column:3;grid-row:1 / 4}
  .lrow .mk{grid-row:1 / 4}
  .steps{font-size:10px}
  .details{grid-template-columns:1fr}
  .details div:nth-last-child(2){border-bottom:1px solid var(--line2)}
  .best{flex-wrap:wrap}
  .cmp{flex-direction:column;align-items:stretch;gap:12px;padding-left:0}
  .cbar{grid-template-columns:96px 1fr 60px}
  .vis{padding:12px 12px 48px}
  .stage{height:440px}
  .card3,.big{display:none}
  .est{left:10px;right:10px;bottom:10px}
  .est>div{flex:1;min-width:0;padding:6px 8px}
  .pts{grid-template-columns:repeat(2,1fr)}
  .greet{font-size:30px}
  .answers{grid-template-columns:1fr}
  .ik h2{font-size:24px}
  .asm{grid-template-columns:28px 1fr}
  .asm .seg{grid-column:2}
  .asm .edit{grid-column:2}
  #drawer{top:44px;width:100%}
  .cfg{flex-direction:column}
  .cfg-rail{width:auto;border-right:0;border-bottom:1px solid var(--hair);padding:14px 10px;display:flex;gap:4px;overflow:auto}
  .cfg-rail h1{display:none}
  .cfg-rail button{width:auto;white-space:nowrap}
  .cfg-main{padding:20px 16px 60px}
  #demo{bottom:4px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sb" aria-label="Sidebar"></aside>
  <div id="scrim"></div>
  <header id="mh"></header>
  <main id="main"><div id="view"></div><div id="demo">Simulated run, demo data</div></main>
</div>
<div id="layer"></div>
<script src="../voice.js" defer></script>
<script type="module">
"use strict";
/* ================= Product name: the one place it is set ================= */
const APP = { name: "Chipmonk" };
document.title = APP.name;

/* ================= Sources (only facts from the checked evidence notes) ================= */
const DATASETS = {
  chbmit: { short: "CHB-MIT", name: "CHB-MIT Scalp EEG", where: "PhysioNet", url: "https://physionet.org/content/chbmit/1.0.0/", host: "physionet.org",
    people: "22 subjects, 198 seizures", size: "42.6 GB", gb: 42.6, licence: "ODC-By 1.0", access: "Open, no account", detail: "Typically 23 channels at 256 Hz." },

/* ================= Intake: questions before the run ================= */

/* ================= Run page ================= */

let tileSig = "";

      <button class="opt" data-m="restart">${ic("restart")}Restart run</button>
      ${isDone(r) ? "" : `<button class="opt danger" data-m="stop">${ic("stop")}Stop run</button>`}`, { align: "end", width: 230, onMount: el => el.onclick = ev => {
    const m = ev.target.closest("[data-m]"); if (!m) return; closePop();

/* ---------- Sources drawer ---------- */
let drawerOn = false, drawerFocus = null, drawerHl = null, drawerSig = "";

const tagHTML = (r, keys) => keys.map(k => { const T = tagInfo(r, k); return `<button class="tag ${T.cls}" data-tag="${k}" title="Open this source"><i></i>${esc(T.label)}</button>`; }).join("");

      dets.forEach(([mm, x], i) => { const el = ov.querySelector(`[data-l=d${i}]`), on = usedIdx.includes(i), si = i === 0 ? 0 : i === 2 ? 1 : -1; el.innerHTML = si >= 0 && b ? `<b>Sensor ${si + 1}</b><small>${mm} mm, ${si ? "far" : "near"}</small>` : `<b>${mm} mm</b><small>${on ? "being read" : "not used"}</small>`; el.style.borderColor = on ? "#1d4ed8" : "#d6d9e0"; put(el, new THREE.Vector3(x, 0.3, D / 2 - 0.42), -6); });
      labY.forEach(([nm, yy], i) => put(ov.querySelector(`[data-y="${i}"]`), new THREE.Vector3(-3.35, yy, D / 2)));
    };
  }
}

/* ---------- Signal: a continuous monitor ---------- */
function mountSignal(vp, r) {
  vp.className = "stage"; vp.style.background = "#fff"; vp.innerHTML = `<canvas aria-label="Live signal" role="img"></canvas>`;
  const cv = vp.querySelector("canvas"), x = cv.getContext("2d");
  const st = { host: vp, three: false };
  let W = 0, Hh = 0, dpr = 1;
  st.resize = (w, h) => { dpr = Math.min(2, devicePixelRatio || 1); W = w; Hh = h; cv.width = w * dpr; cv.height = h * dpr; };
  const U = UC[r.uc];
  st.frame = (dt, T) => {
    if (!W) return;
    x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, Hh);
    const t = elapsed(r), b = bestAt(r, t), used = b ? b.used : 4;
    const L = 150, Rm = 24, plotW = W - L - Rm, span = r.uc === "eeg" ? 20 : 36, pxs = plotW / span;
    x.font = "600 12.5px Inter, -apple-system, sans-serif"; x.textBaseline = "middle";
    // time grid
    x.strokeStyle = "#eceef2"; x.lineWidth = 1;
    for (let s = Math.ceil(T - span); s <= T; s++) { const px = L + plotW - (T - s) * pxs; if (r.uc === "eeg" || s % 3 === 0) { x.beginPath(); x.moveTo(px, 20); x.lineTo(px, Hh - 70); x.stroke(); } }
    const seizAt = s => seizurePhase(r, s) > 0.5;
    // truth shading
    x.fillStyle = "#fdeeee";
    for (let px = 0; px < plotW; px += 2) { const s = T - span + px / pxs; if (seizAt(s)) x.fillRect(L + px, 20, 2, Hh - 90); }
    const rows = r.uc === "eeg" ? UC.eeg.pairs.map((p, i) => ({ name: p.join(" to "), on: i < used, tag: i < 2 ? "Sensor " + (i + 1) : (i < used ? "Pair " + (i + 1) : "not used"), seed: i })) :
      [{ name: "Near light", on: true, tag: "Sensor 1", seed: 0 }, { name: "Far light", on: true, tag: "Sensor 2", seed: 1 }, { name: "Brain oxygen", on: true, tag: "from both", seed: 2, ox: true }];
    const top = 30, bottom = Hh - 120, rh = (bottom - top) / rows.length;
    rows.forEach((row, i) => {
      const cy = top + rh * (i + 0.5);
      x.fillStyle = row.on ? "#15192b" : "#4f5569"; x.font = (row.on ? "600 " : "500 ") + "13px Inter, -apple-system, sans-serif"; x.textAlign = "right"; x.fillText(row.name, L - 14, cy - 8);
      x.font = "500 11.5px Inter, -apple-system, sans-serif"; x.fillStyle = row.on ? "#1d4ed8" : "#4f5569"; x.fillText(row.tag, L - 14, cy + 9);
      x.beginPath(); x.lineWidth = row.on ? 1.5 : 1; x.strokeStyle = row.on ? (r.uc === "eeg" ? "#1d4ed8" : row.ox ? "#5b2bb5" : "#0b6b63") : "#9aa1b2";
      const amp = rh * 0.32;
      if (row.ox) { const lo = 35, hi = 80, yv = v => cy + rh * 0.4 - (v - lo) / (hi - lo) * rh * 0.8; const al = alarmLine(r);
        x.save(); x.setLineDash([6, 5]); x.strokeStyle = "#b91c1c"; x.lineWidth = 1.3; x.beginPath(); x.moveTo(L, yv(al)); x.lineTo(L + plotW, yv(al)); x.stroke(); x.restore();
        x.fillStyle = "#991b1b"; x.textAlign = "left"; x.font = "600 11.5px Inter, -apple-system, sans-serif"; x.fillText(`Alarm line ${al}%`, L + 8, yv(al) - 10); x.textAlign = "right";
        x.beginPath(); x.strokeStyle = "#5b2bb5"; x.lineWidth = 1.8;
        for (let px = 0; px <= plotW; px += 2) { const s = T - span + px / pxs, ph = s % 36; const dip = ph > 12 && ph < 26 ? Math.sin((ph - 12) / 14 * Math.PI) * (al > 52 ? 26 : 30) : 0; const v = 68 + 3 * vnoise(s * 0.3, 9) + 1.2 * vnoise(s * 3, 4) - dip; px ? x.lineTo(L + px, yv(v)) : x.moveTo(L + px, yv(v)); }
        x.stroke(); return; }
      for (let px = 0; px <= plotW; px += 1) {
        const s = T - span + px / pxs, v = sigVal(r, s, row.seed);
        const yy = cy - v * amp; px ? x.lineTo(L + px, yy) : x.moveTo(L + px, yy);
      }
      x.stroke();
    });
    // reading head
    x.fillStyle = "#15192b"; x.fillRect(L + plotW - 1, 20, 2, Hh - 90);
    x.beginPath(); x.arc(L + plotW, 20, 4, 0, Math.PI * 2); x.fill();
    // doctor and chip rows
    const dy = Hh - 92, cy2 = Hh - 62, win = r.uc === "eeg" ? 2 : 6;
    x.textAlign = "right"; x.fillStyle = "#15192b"; x.font = "600 13px Inter, -apple-system, sans-serif"; x.fillText("Doctor's mark", L - 14, dy + 9); x.fillText("Chip", L - 14, cy2 + 9);
    x.fillStyle = "#f0f1f4"; x.fillRect(L, dy, plotW, 18); x.fillRect(L, cy2, plotW, 18);
    x.fillStyle = "#dc2626"; for (let px = 0; px < plotW; px += 2) { const s = T - span + px / pxs; if (seizAt(s)) x.fillRect(L + px, dy, 2, 18); }
    let hits = 0;
    if (b) { for (let w0 = Math.floor((T - span) / win) * win; w0 < T - win; w0 += win) { const mid = w0 + win / 2, truth = seizAt(mid), late = seizAt(mid - win) || !truth ? false : true; const fa = !truth && h1(Math.floor(w0) * 17 + 5) > 0.985; const say = (truth && !late) || fa; const px0 = L + plotW - (T - w0) * pxs; const pw = win * pxs - 2; if (px0 + pw < L) continue; const cx0 = Math.max(L, px0);
      if (say) { x.fillStyle = fa ? "#b45309" : "#1d4ed8"; x.fillRect(cx0, cy2, px0 + pw - cx0, 18); if (!fa) hits++; } else if (!truth) { x.fillStyle = "#d6dae2"; x.fillRect(cx0, cy2 + 6, px0 + pw - cx0, 6); } else if (truth) { x.strokeStyle = "#1d4ed8"; x.setLineDash([3, 2]); x.strokeRect(cx0 + 0.5, cy2 + 0.5, px0 + pw - cx0 - 1, 17); x.setLineDash([]); } } }
    else { x.fillStyle = "#4f5569"; x.textAlign = "left"; x.font = "500 12.5px Inter, -apple-system, sans-serif"; x.fillText("No chip yet. Its answers appear here after round 1.", L + 10, cy2 + 9); }
    // legend and time axis
    x.textAlign = "left"; x.font = "500 12px Inter, -apple-system, sans-serif"; const ly = Hh - 26; let lx = L;
    const key = (c, txt, outline) => { if (outline) { x.strokeStyle = c; x.setLineDash([3, 2]); x.strokeRect(lx + 0.5, ly - 5.5, 13, 11); x.setLineDash([]); } else { x.fillStyle = c; x.fillRect(lx, ly - 6, 14, 12); } x.fillStyle = "#363b50"; x.fillText(txt, lx + 20, ly); lx += x.measureText(txt).width + 44; };
    key("#dc2626", r.uc === "eeg" ? "Seizure, marked by a doctor" : "Drop, marked by a doctor"); key("#d6dae2", r.uc === "eeg" ? "Chip says no seizure" : "Chip says no alarm"); key("#1d4ed8", "Chip caught it"); key("#1d4ed8", "Missed window", true); key("#b45309", "False alarm");
    x.fillStyle = "#4f5569"; x.textAlign = "right"; x.fillText(r.uc === "eeg" ? "Reading now, 20 s shown" : "Reading now, sped up", W - Rm, ly);
  };
  stage = st; ro.disconnect(); ro.observe(vp); sizeStage(); startLoop();
}

/* ================= Settings ================= */
function sel(name, opts, val) { return `<select class="sel" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? "selected" : ""}>${l}</option>`).join("")}</select>`; }
const CFG_TABS = [["line", "Clinical line"], ["chip", "Chip limits"], ["compute", "Machine"], ["scientists", "Scientists"], ["models", "Models"]];
function renderSettings(V) {
  const tab = CFG_TABS.find(t => t[0] === route.tab) ? route.tab : "line";
  const body = {
    line: ["Clinical line", "What a chip must reach before it counts. Applies to new runs.", [
      ["Events caught", "Share of seizures or oxygen drops each held-out person's chip must catch.", sel("line", [["85", "85%"], ["90", "90%"], ["95", "95%"]], defaults.line)],
      ["False alarms allowed", "Per day for brainwave devices, per hour for newborn devices.", sel("fa", [["1", "Fewer than 1"], ["2", "Fewer than 2"], ["4", "Fewer than 4"]], defaults.fa)]]],
    chip: ["Chip limits", "The box the scientists must design inside.", [
      ["Largest chip allowed", "Candidates above this are dropped before building.", sel("maxGates", [["1000", "1,000 gates"], ["5000", "5,000 gates"], ["20000", "20,000 gates"], ["0", "No limit"]], defaults.maxGates)],
      ["Bits per weight", "Fewer bits make smaller chips but can cost accuracy.", sel("bits", [["2", "2 bits"], ["4", "4 bits"], ["8", "8 bits"]], defaults.bits)]]],
    compute: ["Machine", "How many candidate models are fine-tuned at once.", [
      ["Default machine", "Used for new runs unless you pick another on the start page.", sel("machine", Object.entries(MACHINES).filter(([, m]) => !m.off).map(([k, m]) => [k, m.label]), defaults.machine)],
      ["Spend limit per run", "The run wraps up and reports when it reaches this.", sel("spendCap", [["10", "$10"], ["25", "$25"], ["100", "$100"]], defaults.spendCap)]]],
    scientists: ["Scientists", "The AI scientists that work on each run.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, s.role, `<button class="sw" role="switch" aria-checked="${defaults.scientists[k]}" data-sci="${k}" aria-label="${s.name}"></button>`])],
    models: ["Models", "Which model each scientist thinks with.", Object.entries(SCIENTISTS).map(([k, s]) => [s.name, k === "lead" || k === "check" ? "Needs careful reasoning." : "Runs often; a fast model is enough.", `<select class="sel" data-model="${k}">${["Large reasoning model", "Balanced model", "Fast model"].map(m => `<option ${defaults.models[k] === m ? "selected" : ""}>${m}</option>`).join("")}</select>`])],
  }[tab];
  V.innerHTML = `<div class="cfg"><nav class="cfg-rail"><h1>Settings</h1>${CFG_TABS.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`).join("")}</nav>
    <div class="cfg-main"><h2>${body[0]}</h2><p>${body[1]}</p><div class="cfg-card">${body[2].map(([a, b, c]) => `<div class="crow"><div class="cl"><b>${a}</b><span>${b}</span></div>${c}</div>`).join("")}</div></div></div>`;
  V.querySelectorAll("[data-t]").forEach(b => b.onclick = () => go("#/settings/" + b.dataset.t));
  V.onchange = e => { const s = e.target; if (s.name) { defaults[s.name] = s.value; toast("Saved. New runs will use this."); } if (s.dataset.model) { defaults.models[s.dataset.model] = s.value; toast("Saved. New runs will use this."); } };
  V.onclick = e => { const sw = e.target.closest("[data-sci]"); if (sw) { const k = sw.dataset.sci; if (k === "lead") { toast("The lead scientist is always on."); return; } defaults.scientists[k] = !defaults.scientists[k]; sw.setAttribute("aria-checked", defaults.scientists[k]); } };
}

/* ================= Render loop ================= */
let lastRunId = null;
function render() {
  closePop(); closeModal();
  route = parse();
  const viewKey = route.page === "run" ? route.id + "/" + route.view : null;
  if (viewKey !== lastRunId) closeDrawerSrc();
  lastRunId = viewKey;
  const V = $("#view"); V.onchange = null; V.onclick = null; V.oninput = null;
  if (route.page === "new") { curRun = null; renderStart(V); }
  else if (route.page === "settings") { curRun = null; renderSettings(V); }
  else renderRun(V);
  refreshSidebar();
}
let titled = {};
function tick() {
  refreshSidebar();
  const r = curRun; if (!r || route.page !== "run") return;
  if (r.titleAt && now() >= r.titleAt && !titled[r.id]) { titled[r.id] = 1; renderTopbarOnly(); }
  updTopbar(); updTile();
  if (route.view === "overview") updOverview(false);
  if (route.view === "chat") updChat(false);
  if (route.view === "visual") updVisual(false);
  if (drawerOn) { const t = elapsed(r), sg = [0, 1].map(i => dsStatus(r, t, i).join()).join() + papersRead(r, t) + (t >= 12 && t < 20); if (sg !== drawerSig) { const sc = $(".dr-b"); const top = sc ? sc.scrollTop : 0; renderDrawer(); const sc2 = $(".dr-b"); if (sc2) sc2.scrollTop = top; } }
}
render();
setInterval(tick, 500);
</script>
