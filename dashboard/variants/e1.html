<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Scientist</title>
<style>
:root{
  --wash:#fafaf9; --card:#fff; --glass:rgb(255 253 250 / .7); --glass-strong:rgb(255 253 250 / .95);
  --i900:#1a1a2e; --i800:#3a3a4a; --i700:#4a4a5a; --i600:#5a5a6a; --i550:#666676; --i500:#6c6c85;
  --i400:#8a8a99; --i300:#b0b0be; --i200:#d4d4dc; --i150:#e8e8ec; --i100:#f3f3f6;
  --blue:#3b82f6; --blue6:#2563eb; --blue7:#1d4ed8;
  --violet:#a78bfa; --sky:#60a5fa; --orange:#fb923c;
  --ok:#10b981; --ok-t:#047857; --ok-bg:#ecfdf5; --ok-r:#a7f3d0;
  --bad:#ef4444; --bad-t:#b91c1c; --bad-bg:#fef2f2; --bad-r:#fecaca;
  --warn-t:#92400e; --warn-bg:#fffbeb; --warn-r:#fde68a;
  --teal:#0d9488; --indigo:#6366f1; --purple:#8b5cf6;
  --hair:rgb(0 0 0 / .06);
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --serif: "Source Serif 4", "Iowan Old Style", Palatino, Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sh-card:0 2px 8px rgb(0 0 0 / .08); --sh-menu:0 4px 20px rgb(0 0 0 / .1); --sh-hair:0 1px 3px rgb(0 0 0 / .04);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--i900);background:var(--wash);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s12{width:12px;height:12px} svg.i.s13{width:13px;height:13px} svg.i.s14{width:14px;height:14px} svg.i.s16{width:16px;height:16px}
.caps{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550)}

/* frame */
.app{display:flex;height:100vh;height:100dvh}
.sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(12px);border-right:1px solid rgb(0 0 0 / .04);transition:width .15s var(--ease);position:relative;z-index:20}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#page{flex:1;min-height:0;display:flex;flex-direction:column}
.mhead{display:none}

/* sidebar */
.sb-head{height:52px;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--hair);flex:none}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#818cf8,#a78bfa 55%,#f0abfc);display:grid;place-items:center;flex:none;color:#fff}
.logo svg{width:16px;height:16px;stroke:#fff}
.word{font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.sqbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550);transition:background .1s}
.sqbtn:hover{background:rgb(0 0 0 / .05)}
.sb-head .sqbtn{margin-left:auto}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px;flex:none}
.nav button{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--i500);text-align:left;transition:background .1s}
.nav button:hover{background:rgb(0 0 0 / .03)}
.nav button.on{background:rgb(37 99 235 / .06);color:var(--i900)}
.nav .count{margin-left:auto;font-size:10px;font-weight:600;color:var(--blue6);background:rgb(37 99 235 / .07);padding:1px 6px;border-radius:99px}
.sb-div{height:1px;background:var(--hair);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:8px 8px 12px}
.runs .cap{display:flex;align-items:center;padding:10px 10px 6px}
.runs .cap a{margin-left:auto;font-size:10px;color:var(--i550);cursor:pointer;text-decoration:none}
.runs .cap a:hover{color:var(--i900)}
.row{position:relative;display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);cursor:pointer;width:100%;text-align:left}
.row:hover{background:rgb(0 0 0 / .025)}
.row.on{background:rgb(37 99 235 / .06);color:var(--i900)}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .more{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550)}
.row:hover .more,.row .more.open{display:grid}
.row .more:hover{background:rgb(0 0 0 / .06)}
.row input{flex:1;min-width:0;font-size:12.5px;border:0;outline:2px solid var(--blue);border-radius:4px;padding:1px 4px;background:#fff}
.g{width:12px;height:12px;flex:none}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
.acct{border-top:1px solid var(--hair);padding:8px;flex:none}
.acct button{display:flex;align-items:center;gap:9px;width:100%;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0 / .03)}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--purple));color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:10px;color:var(--i550)}
.sb.col{width:52px}
.sb.col .word,.sb.col .nav span,.sb.col .count,.sb.col .runs,.sb.col .sb-div,.sb.col .acct .who,.sb.col .logo{display:none}
.sb.col .sb-head{padding:0 12px}
.sb.col .sb-head .sqbtn{margin:0}
.sb.col .nav button{padding:0 9px}

/* demo label */
.demo{position:fixed;right:12px;bottom:8px;font-size:10px;color:var(--i400);z-index:5;pointer-events:none}

/* start page */
.start{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 64px}
.start .col{width:100%;max-width:672px}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:400;text-align:center;margin:0;letter-spacing:-.01em}
.subt{font-size:16px;color:var(--i550);text-align:center;margin:12px 0 32px}
.box{background:var(--glass);border:1px solid var(--hair);border-radius:24px;box-shadow:0 1px 1px rgb(0 0 0 / .03);padding:20px 20px 12px;backdrop-filter:blur(8px)}
.box textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;font-size:14px;line-height:1.5;min-height:21px;max-height:280px;padding:0}
.box textarea::placeholder{color:var(--i500)}
.box .ctl{display:flex;align-items:center;gap:6px;margin-top:12px;min-height:36px;flex-wrap:wrap}
.plus{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--i550)}
.plus:hover{background:rgb(0 0 0 / .04)}
.pill{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:99px;border:1px solid rgb(0 0 0 / .08);background:#fff;font-size:11.5px;font-weight:500;color:var(--i800);white-space:nowrap}
.pill:hover{border-color:rgb(0 0 0 / .14)}
.pill .chev{opacity:.5}
.pill.static{cursor:default}
.send{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i300);transition:background .12s,box-shadow .12s;flex:none}
.send.ready{background:#fff;color:var(--i900);box-shadow:0 1px 4px rgb(0 0 0 / .16)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
.chip{height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:99px;border:1px solid rgb(0 0 0 / .08);background:#fff;font-size:12.5px;color:var(--i700)}
.chip:hover{border-color:rgb(0 0 0 / .16);color:var(--i900)}
.chip svg{color:var(--i550)}

/* popovers, menus, dialogs */
#layer{position:fixed;inset:0;pointer-events:none;z-index:100}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair);border-radius:10px;box-shadow:var(--sh-menu);padding:6px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .pcap{padding:6px 8px 4px}
.opt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;padding:7px 8px;border-radius:6px;font-size:12.5px;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.sel{background:rgb(37 99 235 / .1)}
.opt .h{display:block;font-size:11px;color:var(--i550);margin-top:1px}
.opt .ck{margin-left:auto;color:var(--blue6)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt.danger{color:var(--bad-t)}
.sep{height:1px;background:var(--hair);margin:4px 2px}
.seg{display:flex;background:var(--i100);border-radius:8px;padding:2px;gap:2px;margin:4px 4px 8px}
.seg button{flex:1;height:26px;border-radius:6px;font-size:11.5px;font-weight:500;color:var(--i600)}
.seg button.on{background:var(--blue6);color:#fff}
.scrim{position:fixed;inset:0;background:rgb(10 10 20 / .18);display:grid;place-items:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dlg{background:#fff;border-radius:12px;box-shadow:var(--sh-menu);width:min(400px,calc(100vw - 32px));padding:20px}
.dlg h3{margin:0 0 6px;font-size:16px}
.dlg p{margin:0 0 16px;font-size:13px;color:var(--i600);line-height:1.5}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px}
.btn{height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:500;border:1px solid rgb(0 0 0 / .1);background:#fff}
.btn:hover{background:var(--i100)}
.btn.pri{background:var(--i900);color:#fff;border-color:var(--i900)}
.btn.red{background:var(--bad-t);border-color:var(--bad-t);color:#fff}
.search{width:min(520px,calc(100vw - 32px));background:#fff;border-radius:12px;box-shadow:var(--sh-menu);overflow:hidden;align-self:start;margin-top:14vh}
.search input{width:100%;border:0;border-bottom:1px solid var(--hair);padding:14px 16px;outline:0;font-size:14px}
.search .list{padding:6px;max-height:340px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:8px;box-shadow:var(--sh-menu);animation:popin .15s}

/* run page */
.topbar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);background:rgb(255 255 255 / .6)}
.tabs{display:flex;height:100%;gap:2px;flex:none}
.tab{height:100%;padding:0 10px;font-size:11.5px;font-weight:500;color:var(--i550);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--i900)}
.tab.on{color:var(--blue6);font-weight:600;border-bottom-color:var(--blue6)}
.spill{height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:500;flex:none}
.spill.done{background:var(--ok-bg);color:var(--ok-t);box-shadow:inset 0 0 0 1px var(--ok-r)}
.spill.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:40px;max-width:260px;flex:0 1 auto}
.play{flex:1;min-width:120px;max-width:680px;display:flex;align-items:center;gap:8px}
.play .pp{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.play .pp:hover{background:rgb(0 0 0 / .05)}
.clock{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--i100);color:var(--i700);flex:none}
.clock.live{background:rgb(239 68 68 / .1);color:var(--bad-t)}
.track{flex:1;height:16px;position:relative;cursor:pointer;min-width:40px}
.track::before{content:"";position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--i150)}
.track .fill{position:absolute;left:0;top:6px;height:4px;border-radius:2px;background:#8b8cf6}
.track .th{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;background:#7c7cf0;margin-left:-5px;box-shadow:0 0 0 2px #fff}
.track.live .fill{background:#f87171}.track.live .th{background:var(--bad)}
.livep{height:18px;display:inline-flex;align-items:center;gap:5px;padding:0 7px;border-radius:99px;font-size:9px;font-weight:800;letter-spacing:.08em;background:rgb(239 68 68 / .1);color:var(--bad-t);flex:none}
.livep i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
.livep.off{background:var(--i100);color:var(--i550)} .livep.off i{background:var(--i400);animation:none}
@keyframes blink{50%{opacity:.2}}
.rc{display:flex;align-items:center;gap:4px;margin-left:auto;flex:none}
.rc .pill{height:24px}
.runbody{flex:1;min-height:0;display:flex}
.runmain{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow:auto}
.rail{width:36px;flex:none;border-left:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;background:rgb(255 255 255 / .4)}
.rail .sqbtn.on{background:rgb(37 99 235 / .08);color:var(--blue6)}
.drawer{width:300px;flex:none;border-left:1px solid var(--hair);background:#fff;display:flex;flex-direction:column;animation:slidein .15s var(--ease)}
@keyframes slidein{from{opacity:0;transform:translateX(8px)}}
.drawer .dh{height:44px;display:flex;align-items:center;padding:0 8px 0 14px;border-bottom:1px solid var(--hair);font-size:13px;font-weight:600}
.drawer .dh .sqbtn{margin-left:auto}
.drawer .db{padding:14px;overflow:auto;font-size:12.5px;color:var(--i700)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1px solid var(--hair);border-radius:10px;padding:10px}
.tile b{display:block;font-size:16px;color:var(--i900);margin-top:4px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair)}
.kv span:first-child{color:var(--i550)}
.file{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:6px}
.file:hover{background:var(--i100)}
.file span{flex:1;font-family:var(--mono);font-size:11.5px}

/* composer */
.comp-wrap{flex:none;padding:8px 16px 18px}
.comp{max-width:672px;margin:0 auto;padding:16px 16px 10px}
.comp .ctl{margin-top:8px}
.comp textarea:disabled{cursor:not-allowed}

/* overview */
.ov{max-width:900px;margin:0 auto;padding:14px 16px 8px}
.cards{display:grid;grid-template-columns:1fr 22px 1fr 22px 1fr;align-items:start}
.arrow{height:72px;display:grid;place-items:center;color:var(--i300)}
.mc{position:relative;overflow:hidden;background:#fff;border:1px solid var(--hair);border-radius:10px;box-shadow:0 1px 2px rgb(0 0 0 / .05);padding:14px 16px 10px}
.mc .hd{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mc .tl{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.mc .tl svg{width:18px;height:18px}
.mc .nm{font-size:14px;font-weight:700;line-height:1.25}
.mc .st{font-size:10px;font-weight:500;color:var(--i550);margin-top:1px}
.mc .ring{margin-left:auto;flex:none;width:44px;height:44px;position:relative}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--i700)}
.ring.spinning>svg{animation:ringspin 4s var(--ease) infinite}
@keyframes ringspin{to{transform:rotate(270deg)}}
.spark{height:24px;margin-bottom:10px;display:block;width:100%}
.bar{height:4px;border-radius:2px;background:var(--i100);overflow:hidden;margin-bottom:9px}
.bar i{display:block;height:100%;border-radius:2px;transition:width .5s linear}
.mc .ft{display:flex;font-size:11.5px;color:var(--i550)}
.mc .ft b{margin-left:auto;font-weight:600}
.mc.dim>*{opacity:.55}
.mc.run{animation:none}
.mc.run::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgb(255 255 255 / .7) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}
.mc.mini{padding:10px 12px 8px;cursor:pointer;text-align:left;width:100%;display:block}
.mc.mini .hd{margin-bottom:8px;gap:10px}
.mc.mini .tl{width:28px;height:28px;border-radius:8px}
.mc.mini .tl svg{width:15px;height:15px}
.mc.mini .ring{width:34px;height:34px}
.mc.mini .ring .pct{font-size:9px}
.mc.mini .bar{margin-bottom:6px}
.tree{margin:8px 0 0 14px;border-left:1px solid var(--i150);padding:2px 0 2px 0}
.tr{display:flex;align-items:center;gap:7px;padding:3px 8px 3px 0;font-size:12px;color:var(--i600);cursor:pointer;position:relative;border-radius:5px;width:100%;text-align:left}
.tr::before{content:"";width:10px;height:1px;background:var(--i150);flex:none}
.tr:hover{color:var(--i900);background:rgb(0 0 0 / .02)}
.tr.sub{padding-left:14px}
.tr.sub::before{width:8px}
.tr .d{width:7px;height:7px;border-radius:50%;background:var(--i200);flex:none}
.tr.now{color:var(--i900);font-weight:500}
.tr.now .d{background:var(--blue);box-shadow:0 0 0 3px rgb(59 130 246 / .18)}
.tr .chv{margin-left:auto;color:var(--i300)}
.tr.more{font-size:10px;color:var(--i400);cursor:default}
.tr.more:hover{background:none;color:var(--i400)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.panel{background:var(--glass);border:1px solid var(--hair);border-radius:12px;min-height:250px;display:flex;flex-direction:column;overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:8px;padding:12px 16px 10px}
.panel .ph .stepper{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:10px;color:var(--i550)}
.stepper button{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--i550)}
.stepper button:hover:not([disabled]){background:rgb(0 0 0 / .05)}
.stepper button[disabled]{opacity:.35;cursor:default}
.sumb{padding:0 16px 16px;font-size:12.5px;line-height:1.6;color:var(--i700)}
.sumb .verdict{font-size:13.5px;font-weight:600;color:var(--i900);line-height:1.45;margin:0 0 8px}
.sumb p{margin:0 0 8px}
.vk{display:inline-flex;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:6px;align-items:center;justify-content:center}
.vk.ok{background:var(--ok-bg);color:var(--ok-t)} .vk.no{background:var(--warn-bg);color:var(--warn-t)} .vk.wait{background:var(--i100);color:var(--i500)}
.acts{padding:0 8px 10px}
.ar{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px;color:var(--i700);cursor:pointer}
.ar:hover{background:rgb(0 0 0 / .025)}
.ar time{font-family:var(--mono);font-size:9px;color:var(--i400);flex:none;width:30px}
.ar .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar.open .msg{white-space:normal}
.ar.fresh{animation:glow 1.6s var(--ease)}
@keyframes glow{from{background:rgb(59 130 246 / .12)}}
.cat{min-width:64px;height:17px;padding:0 6px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.04em;display:inline-grid;place-items:center;flex:none;position:relative}
.cat.AGENT{background:#f5f3ff;color:#6d28d9}
.cat.TOOL{background:#eff6ff;color:var(--blue7)}
.cat.SEARCH{background:#f0fdfa;color:#0f766e}
.cat.USER{background:var(--i900);color:#fff}
.cat.RESULT{background:var(--ok-bg);color:var(--ok-t)}
.cat.SYSTEM{background:var(--i100);color:var(--i600)}

/* chat */
.chat{flex:1;min-height:0;display:flex}
.crail{width:264px;flex:none;border-right:1px solid var(--hair);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column}
.feed{max-width:760px;margin:0 auto;padding:14px 20px 12px}
.fr{display:flex;gap:10px;padding:7px 0;align-items:flex-start}
.fr .ft{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:1px solid var(--hair);background:#fff;color:var(--i550);position:relative}
.fr .ft svg{width:13px;height:13px}
.fr .fb{flex:1;min-width:0}
.fr .fc{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue6);margin:4px 0 2px}
.fr .fc.v{color:#7c3aed}.fr .fc.gr{color:var(--ok-t)}.fr .fc.t{color:#0f766e}
.fr .tx{font-size:13px;line-height:1.55;color:var(--i800)}
.fr.tool .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--i700);font-size:12.5px}
.fr.tool .head{display:flex;align-items:center;gap:6px;cursor:pointer;width:100%;text-align:left}
.fr.tool .head:hover .tx{color:var(--i900)}
.fr.tool .chv{color:var(--i400);transition:transform .15s;flex:none}
.fr.tool.open .chv{transform:rotate(90deg)}
.fr .det{display:none;margin-top:6px;background:var(--i100);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--i700);white-space:pre-wrap}
.fr.tool.open .det{display:block}
.fr .pend{position:absolute;inset:-3px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--blue);animation:spin 1s linear infinite}
.fr.user{justify-content:flex-end}
.bubble{max-width:75%;background:var(--teal);color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13px;line-height:1.5}
.stepdiv{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:10px;color:var(--i400);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stepdiv::after{content:"";flex:1;height:1px;background:var(--hair)}
.typing{display:inline-flex;gap:3px;padding:6px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--i300);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.flash{animation:glow 1.6s var(--ease)}

/* visual */
.vis{max-width:1080px;margin:0 auto;padding:16px 24px 24px}
.picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.picker button{height:28px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:500;color:var(--i600);border:1px solid transparent}
.picker button:hover{background:rgb(0 0 0 / .04)}
.picker button.on{background:#fff;border-color:rgb(0 0 0 / .1);color:var(--i900);box-shadow:var(--sh-hair)}
.vh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.vh h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.vh .uc{font-size:11.5px;color:var(--i550)}
.vs{margin:4px 0 14px;font-size:13px;color:var(--i550)}
.vcard{background:#fff;border:1px solid var(--hair);border-radius:12px;box-shadow:var(--sh-hair);padding:18px;position:relative}
.vcard svg.v{width:100%;height:auto;display:block}
.vfoot{margin-top:12px;font-size:12.5px;color:var(--i600)}
.pop-in{animation:popchip .7s var(--ease)}
@keyframes popchip{0%{opacity:.2;transform:scale(.985)}100%{opacity:1;transform:none}}
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.pt{border:1px solid var(--hair);border-radius:10px;padding:12px;background:#fff}
.pt .pn{font-size:11px;color:var(--i550);display:flex;align-items:center;gap:6px}
.pt .pv{font-size:22px;font-weight:600;margin-top:6px;letter-spacing:-.01em}
.pt .pm{font-size:11px;margin-top:2px}
.pt.ok .pm{color:var(--ok-t)} .pt.no .pm{color:var(--bad-t)}
.pt.worst{border-color:var(--i900);box-shadow:0 0 0 1px var(--i900)}
.pt.wait .pv{color:var(--i300)}
.est{font-size:9.5px;font-weight:600;color:var(--warn-t);background:var(--warn-bg);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.dv{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.stat{padding:12px 0;border-bottom:1px solid var(--hair)}
.stat:last-child{border-bottom:0}
.stat .sl{font-size:12px;color:var(--i550)}
.stat .sv{font-size:24px;font-weight:600;margin-top:2px}
.stat .sh{font-size:11.5px;color:var(--i500)}

/* configure / gallery */
.cfg{flex:1;min-height:0;display:flex}
.cfg .side{width:220px;flex:none;border-right:1px solid var(--hair);padding:18px 12px;overflow:auto}
.cfg .side .caps{padding:0 8px 6px;display:block}
.cfg .side button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:6px;font-size:12.5px;color:var(--i600);text-align:left}
.cfg .side button:hover{background:rgb(0 0 0 / .03)}
.cfg .side button.on{background:rgb(37 99 235 / .06);color:var(--i900);font-weight:500}
.cfg .pane{flex:1;overflow:auto;padding:32px 40px}
.cfg h1{font-size:26px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.cfg .lead{color:var(--i550);margin:0 0 24px;font-size:13px}
.field{max-width:520px;display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.field .fl{flex:1}
.field .fl b{display:block;font-size:13px;font-weight:500}
.field .fl span{font-size:11.5px;color:var(--i550)}
.field input[type=number],.field select{width:120px;height:32px;border:1px solid var(--i150);border-radius:8px;padding:0 8px;background:#fff;font-size:12.5px}
.sw{width:34px;height:20px;border-radius:99px;background:var(--i200);position:relative;flex:none;transition:background .12s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform .12s}
.sw.on{background:var(--blue6)}.sw.on::after{transform:translateX(14px)}
.gal{flex:1;overflow:auto;padding:32px 40px}
.gal h1{font-size:26px;font-weight:600;margin:0 0 20px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-width:900px}
.gcard{background:#fff;border:1px solid var(--hair);border-radius:10px;padding:14px;text-align:left;box-shadow:var(--sh-hair)}
.gcard:hover{box-shadow:var(--sh-card)}
.gcard b{display:block;font-size:13.5px;margin-bottom:4px}
.gcard span{font-size:12px;color:var(--i550)}

/* responsive */
@media (max-width:1279px){.rc .pill .lbl{display:none}}
@media (max-width:1100px){.crail{display:none}}
@media (max-width:1023px){
  .sb{width:52px}
  .sb .word,.sb .nav span,.sb .count,.sb .runs,.sb .sb-div,.sb .acct .who,.sb .logo{display:none}
  .sb .sb-head .sqbtn{margin:0}
  .sb .nav button{padding:0 9px}
  .sb.peek{position:absolute;left:0;top:0;bottom:0;width:252px;box-shadow:var(--sh-menu);background:var(--glass-strong)}
  .sb.peek .word,.sb.peek .nav span,.sb.peek .count,.sb.peek .acct .who,.sb.peek .logo{display:revert}
  .sb.peek .runs{display:block}.sb.peek .sb-div{display:block}
  .sb.peek .sb-head .sqbtn{margin-left:auto}
  .rtitle{max-width:160px}
}
@media (max-width:860px){
  .cards{grid-template-columns:1fr}
  .arrow{display:none}
  .cards .slot{margin-bottom:10px}
  .pair{grid-template-columns:1fr}
  .pts{grid-template-columns:repeat(3,1fr)}
  .dv{grid-template-columns:1fr}
}
@media (max-width:767px){
  .sb{display:none}
  .sb.drawer-open{display:flex;position:fixed;left:0;top:0;bottom:0;width:252px;box-shadow:var(--sh-menu);background:var(--glass-strong);z-index:60}
  .sb.drawer-open .word,.sb.drawer-open .nav span,.sb.drawer-open .count,.sb.drawer-open .acct .who,.sb.drawer-open .logo{display:revert}
  .sb.drawer-open .runs,.sb.drawer-open .sb-div{display:block}
  .sb.drawer-open .sb-head .sqbtn{margin-left:auto}
  .mhead{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;border-bottom:1px solid var(--hair);flex:none;background:var(--glass)}
  .mhead .demo-m{margin-left:auto;font-size:10px;color:var(--i400)}
  .demo{display:none}
  .topbar{gap:8px;padding:0 8px;overflow:hidden}
  .rtitle,.track,.rc .pill,.rail{display:none}
  .play{min-width:0;flex:1}
  .tab{padding:0 7px}
  .greet{font-size:30px}
  .rc .share{display:none}
  .ov{padding:12px}
  .tree{display:none}
  .vis{padding:14px}
  .pts{grid-template-columns:repeat(2,1fr)}
  .cfg .side{display:none}.cfg .pane,.gal{padding:20px}
  .drawer{position:fixed;right:0;top:0;bottom:0;z-index:50;box-shadow:var(--sh-menu)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb" aria-label="Sidebar"></aside>
  <div class="main">
    <header class="mhead" id="mhead"></header>
    <div id="page"></div>
  </div>
</div>
<div class="demo" id="demo"></div>
<div id="layer"></div>
<script>
(function(){
"use strict";

const PRODUCT = {name:"Chipmonk AI Scientist", short:"Chipmonk"};
const DEMO_LABEL = "Simulated run, demo data";

/* ---------- icons ---------- */
const P = {

  pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',

  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',

  sparkle:'<path d="M12 3l1.9 5.8L20 10.5l-6.1 1.7L12 18l-1.9-5.8L4 10.5l6.1-1.7z"/>',
  wave:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',

const ic = (n, c) => `<svg class="i ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const $ = (s, r) => (r||document).querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- domain ---------- */
const UC = {
  bw:{ name:'Brainwave sensing', icon:'wave', device:'EEG headband', aDevice:'an EEG headband', subj:'patient', subjs:'patients', Subj:'Patient',
       line:90, lineShort:'90% of seizures caught, per patient', ref:95.8, allCh:18, chWord:'channels', chOne:'channel',
       event:'seizure', events:'seizures', windowWord:'2-second windows', worstIdx:6,
       patch:{w:42,h:18,name:'headband sensor pod'}, basePower:0.9 },
  nb:{ name:'Newborn sensing', icon:'drop', device:'near-infrared cap', aDevice:'a near-infrared cap', subj:'newborn', subjs:'newborns', Subj:'Newborn',
       line:95, lineShort:'95% of oxygen drops caught, per newborn', ref:97.9, allCh:4, chWord:'light paths', chOne:'light path',
       event:'oxygen drop', events:'oxygen drops', windowWord:'10-second windows', worstIdx:3,
       patch:{w:30,h:20,name:'forehead sensor patch'}, basePower:2.4 }
};
const BASE = {
  bw:[{ch:4,g:18400,w:86.1},{ch:2,g:9800,w:89.4},{ch:2,g:6200,w:91.2},{ch:2,g:5300,w:90.6},{ch:2,g:4800,w:90.3}],
  nb:[{ch:3,g:12600,w:93.0},{ch:2,g:7100,w:95.6},{ch:2,g:5300,w:94.6},{ch:2,g:4700,w:95.2},{ch:2,g:4300,w:95.0}]
};
const PROPOSE = {
  bw:['proposing 24 chip designs that read 1 to 4 channels in 2-second windows.',
      'round 1 needed 4 channels. Trying 2 channels with longer 4-second windows, which held up best in the reference model.',
      'keeping 2 channels and shrinking the model; most of the gates sit in the first layer.',
      'trimming the windowing logic to save more gates.',
      'trying 6-bit weights in the last layer.'],
  nb:['proposing 24 chip designs that read 2 to 4 light paths in 10-second windows.',
      'the deep light paths carry most of the signal. Trying 2 paths with 30-second windows.',
      'keeping 2 light paths and using fewer bits per weight.',
      'trimming the trend filter to save more gates.',
      'trying 6-bit weights in the last layer.']
};

/* ---------- run timeline ---------- */
const STAGES = [
  {name:'Set Target', icon:'target', hue:'#a78bfa', tile:'#f5f3ff', grad:'linear-gradient(90deg,#c4b5fd,#a78bfa)'},
  {name:'Design Chip', icon:'cpu', hue:'#60a5fa', tile:'#eff6ff', grad:'linear-gradient(90deg,#93c5fd,#60a5fa)'},
  {name:'Report Chip', icon:'file', hue:'#fb923c', tile:'#fff7ed', grad:'linear-gradient(90deg,#fdba74,#fb923c)'}
];
const RP = [8,16,8,8], RNAMES = ['Propose','Fine-tune','Compile','Verify'];
function steps(run){
  if (run._st && run._stR === run.rounds) return run._st;
  const a = [{st:0,name:'Spec',s:0,e:10},{st:0,name:'Reference',s:10,e:26}];
  let s = 26;
  for (let r=0; r<run.rounds; r++) RNAMES.forEach((n,i) => { a.push({st:1,r,name:n,s,e:s+RP[i]}); s += RP[i]; });
  a.push({st:2,name:'Write report',s,e:s+12}); a.push({st:2,name:'Package chip',s:s+12,e:s+18});
  run._st = a; run._stR = run.rounds; return a;

const total = run => steps(run)[steps(run).length-1].e;
const roundStart = (run,r) => 26 + r*40;
function elapsed(run){
  const e = run.acc + (run.paused ? 0 : (Date.now() - run.resumeAt)/1000);
  return clamp(e, 0, total(run));
}
function viewT(run){ return run.viewT != null ? Math.min(run.viewT, elapsed(run)) : elapsed(run); }
function isDone(run){ return elapsed(run) >= total(run) - 1e-6; }
function stepAt(run,t){ const st = steps(run); for (const x of st) if (t < x.e) return x; return null; }
function stageSpan(run,i){ const st = steps(run).filter(x => x.st === i); return [st[0].s, st[st.length-1].e]; }

function roundResult(run, r){
  const b = BASE[run.uc][Math.min(r,4)];
  let g = b.g, w = b.w, ch = b.ch;
  for (const d of run.redirects) if (d.from != null && d.from <= r){ g *= d.eff.g; w += d.eff.w; ch = Math.max(1, ch + d.eff.ch); }
  g = Math.round(g/50)*50; w = Math.round(w*10)/10;
  const R = rng(run.seed*31 + r*7 + 3), u = UC[run.uc], pats = [];
  for (let i=0;i<12;i++){ const off = i === u.worstIdx ? 0 : 0.4 + R()*(98.8 - w); pats.push(Math.min(99.4,Math.round((w+off)*10)/10)); }
  const meets = pats.filter(v => v >= u.line).length;
  return {r, g, w, ch, pats, meets, n:12, all: meets === 12};
}
function verified(run,t){ let n=0; for (let r=0;r<run.rounds;r++) if (t >= roundStart(run,r)+40) n++; return n; }
function best(run,t){ const n = verified(run,t); return n ? roundResult(run, n-1) : null; }

function verdict(run, b){
  const u = UC[run.uc];
  if (!b) return {k:'wait', text:'No chip yet. The first one is checked after round 1.'};
  return {k: b.all ? 'ok' : 'no',
    text: `Best chip: ${fmt(b.g)} gates. Meets the clinical line on ${b.meets} of 12 unseen ${u.subjs}.`,
    short: `meets the clinical line on ${b.meets} of 12 unseen ${u.subjs}`};
}
function nowLine(run,t){
  if (run.paused && !isDone(run)) return 'Paused. Press play to continue.';
  const s = stepAt(run,t); if (!s) return 'Finished. The report and chip files are ready.';
  const R = s.r != null ? `Round ${s.r+1}: ` : '';
  return R + ({Spec:'reading the brief and the recordings.',Reference:'training a full-size reference model to set the ceiling.',
    Propose:'proposing 24 chip designs.','Fine-tune':'fine-tuning 3,072 small models at once.',
    Compile:'compiling the best 240 models into logic gates.',Verify:'checking each circuit bit for bit against its model.',
    'Write report':'writing the report.','Package chip':'packaging the chip files.'})[s.name].replace(/^./, c => R ? c : c.toUpperCase());
}

/* ---------- events (one list drives Activity and Chat) ---------- */
function events(run){
  const key = run.rounds + '|' + run.redirects.length + '|' + run.ver;
  if (run._ev && run._evK === key) return run._ev;
  const u = UC[run.uc], E = [];
  const add = (t,cat,text,o) => E.push(Object.assign({t,cat,text,id:E.length+'-'+Math.round(t*10)}, o||{}));
  const bw = run.uc === 'bw';
  add(1,'AGENT', bw ? `Reading your brief: ${u.aDevice} that flags seizures, worn for days at a time. A missed seizure counts as worse than a false alarm.`
                    : `Reading your brief: ${u.aDevice} that warns when a newborn's brain oxygen drops. A missed drop counts as worse than an extra alarm.`, {step:'Spec'});
  add(3,'TOOL','Read the brief and 2 example recordings',{step:'Spec',det:bw?'recording_a.edf  18 channels, 256 Hz, 41 min\nrecording_b.edf  18 channels, 256 Hz, 63 min':'cap_a.csv  4 light paths, 10 Hz, 52 min\ncap_b.csv  4 light paths, 10 Hz, 47 min'});
  add(6,'TOOL', bw ? 'Load dataset: 24 patients, 18 channels, 980 hours' : 'Load dataset: 24 newborns, 4 light paths, 310 hours', {step:'Spec',det:`Split by ${u.subj}: 12 for training, 12 held out.\nThe held-out ${u.subjs} are never seen until Verify.`});
  add(9,'AGENT', `Clinical line set: the chip must catch at least ${u.line}% of ${u.events} for every unseen ${u.subj}, not just on average.`, {step:'Spec'});
  add(11,'SEARCH', bw ? 'Search: published seizure detectors for wearable EEG' : 'Search: oxygen-drop alarms for neonatal near-infrared monitors', {step:'Reference',det:bw?'14 papers read. Most use 4 to 8 channels and 2 to 4-second windows.':'9 papers read. Most alarm when oxygen stays below 55% for over a minute.'});
  add(14,'TOOL', bw ? 'Train reference model (full size, all 18 channels)' : 'Train reference model (full size, all 4 light paths)', {step:'Reference',det:'Floating point, about 1.2 million weights.\nNot meant for a chip; it sets the ceiling.'});
  add(24,'AGENT', `Reference model catches ${u.ref}% of ${u.events} on the worst unseen ${u.subj}. That is the ceiling; every chip will be smaller.`, {step:'Reference'});
  for (let r=0; r<run.rounds; r++){
    const s0 = roundStart(run,r), res = roundResult(run,r), sr = {step:RNAMES[0], r};
    const red = run.redirects.filter(d => d.from === r);
    let p = `Round ${r+1}: ` + PROPOSE[run.uc][Math.min(r,4)];
    if (red.length) p += ' ' + red[red.length-1].eff.note;
    add(s0+1,'AGENT', p, sr);
    add(s0+9,'TOOL', 'Fine-tune 3,072 small models at once (24 designs, 128 settings each)', {step:'Fine-tune', r, det:`Batch on one GPU. Trained on 12 ${u.subjs}.\nScored by the worst ${u.subj}, not the average.`});
    add(s0+22,'AGENT', `Kept the best 240 models by worst-${u.subj} sensitivity.`, {step:'Fine-tune', r});
    add(s0+25,'TOOL', 'Compile 240 models into logic gates, weights wired in', {step:'Compile', r, det:`240 netlists written.\nSmallest: ${fmt(res.g*0.82)} gates. Largest: ${fmt(res.g*2.9)} gates.`});
    add(s0+31,'AGENT', `Smallest candidate that clears the line on the training ${u.subjs}: ${fmt(res.g)} gates, ${res.ch} ${res.ch===1?u.chOne:u.chWord}.`, {step:'Compile', r});
    add(s0+33,'TOOL', 'Check each circuit bit for bit against its model', {step:'Verify', r, det:'2.1 million windows replayed through circuit and model.\nMismatches: 0.'});
    const worstV = Math.min(...res.pats), wi = res.pats.indexOf(worstV);
    add(s0+39.5,'RESULT', `Round ${r+1} chip: ${fmt(res.g)} gates, ${res.ch} ${res.ch===1?u.chOne:u.chWord}. Meets the clinical line on ${res.meets} of 12 unseen ${u.subjs}.` +
      (res.all ? '' : ` ${u.Subj} ${wi+1} is at ${worstV}%.`), {step:'Verify', r});
  }
  for (const d of run.redirects){
    add(d.t,'USER', d.text, {user:true, step:d.step, r:d.r});
    add(d.t+2.5,'AGENT', d.reply, {step:d.step, r:d.r, reply:true});
  }
  const rs = 26 + run.rounds*40;
  add(rs+1,'AGENT','Writing the report: the chosen chip, how it does per patient, and what it means for the device.', {step:'Write report'});
  add(rs+9,'TOOL','Export netlist, test vectors and the patient table', {step:'Write report', det:'chip.v, test_vectors.bin, patients.csv'});
  const fin = roundResult(run, run.rounds-1);
  add(rs+17,'RESULT', `Done. Chosen chip: ${fmt(fin.g)} gates, ${fin.ch} ${fin.ch===1?u.chOne:u.chWord}, meets the clinical line on ${fin.meets} of 12 unseen ${u.subjs}.`, {step:'Package chip'});
  E.sort((a,b) => a.t - b.t);
  run._ev = E; run._evK = key; return E;
}

function summaryVersions(run,t){
  const u = UC[run.uc], v = [];
  if (t >= 10) v.push({verdict:null, p:`The scientists set the target: a chip for ${u.aDevice} that catches at least ${u.line}% of ${u.events} for every unseen ${u.subj}.`});
  if (t >= 26) v.push({verdict:null, p:`The full-size reference model reaches ${u.ref}% on the worst unseen ${u.subj} using all ${u.allCh} ${u.chWord}. That is the ceiling for any chip.`});
  for (let r=0; r<verified(run,t); r++){
    const b = roundResult(run,r);
    v.push({r, p: r === 0 ? `Round 1 found a working chip with ${b.ch} ${u.chWord}. Later rounds try to make it smaller without losing the worst ${u.subj}.`
      : `Round ${r+1} ${b.g < roundResult(run,r-1).g ? 'shrank' : 'changed'} the chip from ${fmt(roundResult(run,r-1).g)} to ${fmt(b.g)} gates.`});
  }
  if (isDone(run) && t >= total(run)) v.push({p:`The report is ready, with the netlist, the test vectors and a table of every unseen ${u.subj}.`});
  return v;
}

function parseHash(){

  if (h[0] === 'configure') return {page:'configure'};

}

/* ---------- layer: popovers, dialogs, toast ---------- */
const layer = $('#layer');
let popCleanup = null;
function closePop(){ layer.innerHTML = ''; if (popCleanup){ popCleanup(); popCleanup = null; } }
function openPop(anchor, html, opts){
  closePop(); opts = opts||{};
  const el = document.createElement('div'); el.className = 'pop'; el.innerHTML = html; if (opts.w) el.style.width = opts.w+'px';
  layer.appendChild(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = clamp(opts.alignRight ? r.right - w : r.left, 8, innerWidth - w - 8);
  let top = opts.up || (r.bottom + h + 8 > innerHeight) ? r.top - h - 6 : r.bottom + 6;
  el.style.left = left+'px'; el.style.top = Math.max(8, top)+'px';
  if (anchor.classList.contains('more')) { anchor.classList.add('open'); popCleanup = () => anchor.classList.remove('open'); }
  setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
  function outside(e){ if (!el.contains(e.target)){ document.removeEventListener('mousedown', outside, true); if (el.isConnected) closePop(); } }
  return el;
}
function dialog(title, body, acts){
  closePop();
  const sc = document.createElement('div'); sc.className = 'scrim';
  sc.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="acts"></div></div>`;
  const a = sc.querySelector('.acts');
  acts.forEach(x => { const b = document.createElement('button'); b.className = 'btn '+(x.cls||''); b.textContent = x.label; b.onclick = () => { closePop(); x.fn && x.fn(); }; a.appendChild(b); });
  sc.addEventListener('mousedown', e => { if (e.target === sc) closePop(); });
  layer.appendChild(sc); a.lastChild.focus();
}
let toastT;
function toast(msg){ document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className='toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }

function runMenu(anchor, run){

function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

function choose(anchor, cap, items, cur, fn, w){
  const el = openPop(anchor, `<div class="pcap caps">${cap}</div>` + items.map(x => `<button class="opt ${x.k===cur?'sel':''}" data-k="${x.k}" ${x.off?'disabled':''}>${ic(x.i,'s14')}<span>${x.n}<span class="h">${x.h}</span></span>${x.k===cur?`<span class="ck">${ic('check','s14')}</span>`:''}</button>`).join(''), {w:w||240});
  el.onclick = e => { const b = e.target.closest('[data-k]'); if (!b || b.disabled) return; closePop(); fn(b.dataset.k); };

function startRun(){
  const text = S.draft.trim(); if (!text) { $('#prompt').focus(); return; }
  const ex = EXAMPLES.find(x => x.text === text);
  let title = ex ? ex.label : text.replace(/\s+/g,' ').split(' ').slice(0,5).join(' ').replace(/[.,;:]$/,'');
  title = title.charAt(0).toUpperCase() + title.slice(1);
  const id = 'new-' + (++newCount);
  RUNS.unshift(mk({id, title, uc:S.uc, seed:57+newCount*13, acc:0, resumeAt:Date.now(), compute:S.compute, preset:S.preset}));
  S.draft = '';
  go(runPath(id));
}

/* ---------- run page ---------- */
let RV = {}; // per-render cache
function costAt(run,t){ let c = 0; for (const s of steps(run)){ const d = clamp(t - s.s, 0, s.e - s.s); c += d * [0.004,0.011,0.003][s.st]; } return c; }
function stageInfo(run,i,t){
  const [s,e] = stageSpan(run,i), u = UC[run.uc];
  const pct = clamp((t-s)/(e-s), 0, 1);
  let state = t >= e ? 'done' : t >= s ? (run.paused ? 'paused' : 'running') : 'pending';
  let word = {done:'Done', running:'Running', paused:'Paused', pending:'Pending'}[state];
  const dur = clamp(t - s, 0, e - s);
  let c = 0; for (const x of steps(run)) if (x.st === i) c += clamp(t - x.s, 0, x.e - x.s) * [0.004,0.011,0.003][i];
  return {pct, state, word, dur, cost:c};
}
const fmtDur = s => s < 60 ? Math.floor(s)+'s' : Math.floor(s/60)+'m '+String(Math.floor(s%60)).padStart(2,'0')+'s';
const clock = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function sparkPath(run,i,t,w,h){
  const [s,e] = stageSpan(run,i), R = rng(run.seed*5+i), n = 24, pts = [];
  for (let k=0;k<n;k++){ const tk = s + (e-s)*k/(n-1); const v = tk > t ? 0 : 0.35 + 0.45*Math.abs(Math.sin(k*0.7+i)) + R()*0.2; pts.push([k/(n-1)*w, h - 2 - v*(h-4)]); }
  let d = `M${pts[0][0]},${pts[0][1]}`; for (let k=1;k<n;k++){ const [x0,y0] = pts[k-1], [x1,y1] = pts[k]; const mx = (x0+x1)/2; d += ` C${mx},${y0} ${mx},${y1} ${x1},${y1}`; }
  return {line:d, area:d + ` L${w},${h} L0,${h} Z`};
}
function ringSvg(pct, color, done){
  const r = 18, c = 2*Math.PI*r;
  return `<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="#f0f0f3" stroke-width="3.5"/><circle class="arc" cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/></svg><span class="pct">${done ? `<svg class="i s14" viewBox="0 0 24 24" style="stroke:${color};stroke-width:2.4">${P.check}</svg>` : Math.round(pct*100)+'%'}</span>`;
}
function stageCard(run,i,t,mini){
  const g = STAGES[i], s = stageInfo(run,i,t), sp = sparkPath(run,i,t,240,24);
  const cls = ['mc', mini?'mini':'', s.state==='running'?'run':'', (s.state==='done'||s.state==='pending')?'dim':''].join(' ');
  const style = s.state==='running' ? `border-color:${g.hue}59;box-shadow:0 0 0 3px ${g.hue}14, 0 1px 2px rgb(0 0 0 / .05)` : '';
  return `<${mini?'button':'div'} class="${cls}" data-stage="${i}" style="${style}">
    <div class="hd"><div class="tl" style="background:${g.tile};color:${g.hue}">${ic(g.icon)}</div>
      <div><div class="nm">${g.name}</div><div class="st">${s.word}</div></div>
      <div class="ring ${s.state==='running'?'spinning':''}">${ringSvg(s.pct, g.hue, s.state==='done')}</div></div>
    ${mini ? '' : `<svg class="spark" viewBox="0 0 240 24" preserveAspectRatio="none"><path d="${sp.area}" fill="${g.hue}" opacity=".1"/><path d="${sp.line}" fill="none" stroke="${g.hue}" stroke-width="1.5"/></svg>`}
    <div class="bar"><i style="width:${s.pct*100}%;background:${g.grad}"></i></div>
    <div class="ft"><span>${s.state==='pending'?'0s':fmtDur(s.dur)}</span><b>$${s.cost.toFixed(2)}</b></div>
  </${mini?'button':'div'}>`;
}
function treeRows(run,i,t){
  const st = steps(run).filter(x => x.st === i), cur = stepAt(run,t), rows = [];
  const dot = x => t >= x.e ? `<svg class="g" viewBox="0 0 24 24" fill="none" stroke="${STAGES[i].hue}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>` : '<span class="d"></span>';
  if (i !== 1){
    st.forEach(x => rows.push(`<button class="tr ${cur===x?'now':''}" data-jump="${x.name}">${dot(x)}${x.name}</button>`));
  } else {
    const sDone = t >= stageSpan(run,1)[1];
    const curR = cur && cur.st === 1 ? cur.r : (sDone ? run.rounds-1 : 0);
    const first = Math.max(0, curR-1);
    if (first > 0) rows.push(`<div class="tr more">+${first} more</div>`);
    for (let r=first; r<=curR; r++){
      const rs = roundStart(run,r), rd = {s:rs, e:rs+40};
      rows.push(`<button class="tr ${r===curR&&cur&&cur.r===r?'now':''}" data-jump="r${r}">${dot(rd)}Round ${r+1}${ic('right','s12 chv')}</button>`);
      if (r === curR && !sDone) st.filter(x => x.r === r).forEach(x => rows.push(`<button class="tr sub ${cur===x?'now':''}" data-jump="${x.name}" data-r="${r}">${dot(x)}${x.name}</button>`));
    }
    if (curR < run.rounds-1) rows.push(`<div class="tr more">+${run.rounds-1-curR} more</div>`);
  }
  return `<div class="tree">${rows.join('')}</div>`;
}

function renderRun(){
  const run = byId(S.route.id); if (!run) return go('');
  RV = {run: run.id, view: S.route.view};
  $('#page').innerHTML = `<div class="topbar" id="topbar"></div><div class="runbody"><div class="runmain" id="runmain"></div><div id="drawerSlot" style="display:contents"></div>${S.route.view!=='visual'?`<div class="rail" id="rail"></div>`:''}</div>`;
  renderTopbar(true);
  if (S.route.view === 'overview') renderOverview(run);
  if (S.route.view === 'chat') renderChat(run);
  if (S.route.view === 'visual') renderVisual(run);
  renderRail(run);
}
function renderTopbar(full){
  const run = byId(S.route.id), tb = $('#topbar'); if (!run || !tb) return;
  const t = viewT(run), done = isDone(run), live = run.viewT == null && !done && !run.paused;
  if (full || RV.tbSig !== `${done}${run.paused}${run.viewT==null}${run.title}`){
    RV.tbSig = `${done}${run.paused}${run.viewT==null}${run.title}`;
    tb.innerHTML = `
      <nav class="tabs">${['overview','chat','visual'].map(v => `<button class="tab ${S.route.view===v?'on':''}" data-view="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</nav>
      ${done ? '<span class="spill done">Done</span>' : run.paused ? '<span class="spill paused">Paused</span>' : ''}
      <span class="rtitle" title="${esc(run.title)}">${esc(run.title)}</span>
      <div class="play">
        <button class="pp" id="pp" aria-label="${done?'Replay from start':run.paused?'Resume run':'Pause run'}">${ic(done||run.paused?'play':'pause','s14')}</button>
        <span class="clock" id="clk"></span>
        <div class="track" id="trk"><div class="fill"></div><div class="th"></div></div>
        ${done ? '' : `<button class="livep" id="livep"><i></i>LIVE</button>`}
      </div>
      <div class="rc">
        <span class="pill static" title="Machine">${ic('cpu','s13')}<span class="lbl">${run.compute}</span></span>
        <button class="sqbtn share" id="shareBtn" aria-label="Share">${ic('share','s16')}</button>
        <button class="sqbtn" id="runMore" aria-label="More">${ic('dots','s16')}</button>
      </div>`;
    tb.querySelectorAll('[data-view]').forEach(b => b.onclick = () => go(runPath(run.id, b.dataset.view, S.route.vis)));
    $('#pp').onclick = () => {
      if (isDone(run)){ run.viewT = 0; tick(); return; }
      if (run.paused){ run.paused = false; run.resumeAt = Date.now(); } else { run.acc = elapsed(run); run.paused = true; }
      renderTopbar(true); tick(true);
    };
    const lp = $('#livep'); if (lp) lp.onclick = () => { run.viewT = null; tick(true); };
    $('#trk').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); const f = clamp((e.clientX - r.left)/r.width, 0, 1); const tt = f*total(run); run.viewT = tt >= elapsed(run)-0.5 ? null : tt; tick(true); };
    $('#shareBtn').onclick = e => { const el = openPop(e.currentTarget, `<div class="pcap caps">Share</div><button class="opt" data-a="link">${ic('share','s14')}<span>Copy a view-only link<span class="h">Anyone with the link can watch this run.</span></span></button>`, {alignRight:true, w:260}); el.onclick = () => { closePop(); toast('Sharing is not part of this demo'); }; };
    $('#runMore').onclick = e => {
      const el = openPop(e.currentTarget, `${done ? `<div class="pcap caps">Outputs</div><button class="opt" data-a="o">${ic('file','s14')}Report (PDF)</button><button class="opt" data-a="o">${ic('cpu','s14')}Chip netlist</button><button class="opt" data-a="o">${ic('download','s14')}Test vectors</button><div class="sep"></div>` : ''}
        <button class="opt" data-a="restart">${ic('restart','s14')}<span>Restart demo run<span class="h">Plays this run again from the start.</span></span></button>`, {alignRight:true, w:230});
      el.onclick = ev => { const a = ev.target.closest('[data-a]'); if (!a) return; closePop();
        if (a.dataset.a === 'restart'){ Object.assign(run, {acc:0, resumeAt:Date.now(), paused:false, viewT:null, redirects:[], rounds:3, ver:run.ver+1}); S.open.clear(); renderRun(); renderSidebar(true); }
        else toast('Downloads are not part of this demo'); };
    };
  }
  const T = total(run), clk = $('#clk'), trk = $('#trk');
  clk.textContent = clock(t); clk.classList.toggle('live', live);
  trk.classList.toggle('live', run.viewT == null && !done);
  trk.querySelector('.fill').style.width = (t/T*100)+'%'; trk.querySelector('.th').style.left = (t/T*100)+'%';
  const lp = $('#livep'); if (lp) lp.classList.toggle('off', run.viewT != null || run.paused);
}

function composerHtml(run){
  const t = viewT(run), done = isDone(run), cur = stepAt(run, elapsed(run));
  const stepName = done ? 'Finished' : cur.r != null ? `Round ${cur.r+1}, ${cur.name}` : cur.name;
  return `<div class="comp-wrap"><div class="box comp">
    <textarea id="cmp" rows="1" placeholder="${done ? 'Run finished. Start a new run to try another direction.' : 'Message the scientists...'}" ${done?'disabled':''} aria-label="Message the scientists"></textarea>
    <div class="ctl"><span class="pill static" id="cmpStep" title="Where the run is now">${ic('clock','s13')}<span>${stepName}</span></span>
    <button class="send" id="cmpGo" aria-label="Send" ${done?'disabled':''}>${ic('up','s16')}</button></div></div></div>`;
}
function wireComposer(run){
  const ta = $('#cmp'), b = $('#cmpGo'); if (!ta) return;
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight)+'px'; };
  ta.oninput = () => { b.classList.toggle('ready', !!ta.value.trim()); grow(); };
  const send = () => { const v = ta.value.trim(); if (!v) return; ta.value = ''; b.classList.remove('ready'); grow(); redirect(run, v); };
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
  b.onclick = send;
}
function updateComposerStep(run){
  const el = $('#cmpStep span'); if (!el) return;
  const cur = stepAt(run, elapsed(run));
  el.textContent = isDone(run) ? 'Finished' : cur.r != null ? `Round ${cur.r+1}, ${cur.name}` : cur.name;
}

function redirect(run, text){
  const e = elapsed(run), cur = stepAt(run, e), u = UC[run.uc];
  if (run.viewT != null) run.viewT = null;
  const low = text.toLowerCase();
  let eff;
  if (/fewer gate|smaller|less gate|cheaper|tiny|shrink|lower power|less power/.test(low)) eff = {g:.72, w:-1.2, ch:0, note:'Following your note: aiming for about 30% fewer gates and accepting a little less sensitivity.', say:'aim for about 30% fewer gates and accept a little less sensitivity'};
  else if (/fewer channel|one channel|single|fewer light|fewer electrode|less channel/.test(low)) eff = {g:.82, w:-1.8, ch:-1, note:`Following your note: dropping to fewer ${u.chWord}.`, say:`drop one ${u.chOne} and see what the worst ${u.subj} loses`};
  else if (/sensitiv|accura|miss|safer|catch more|worst/.test(low)) eff = {g:1.3, w:1.6, ch:0, note:`Following your note: allowing more gates to lift the worst ${u.subj}.`, say:`allow about 30% more gates to lift the worst ${u.subj}`};
  else eff = {g:.95, w:0, ch:0, note:'Following your note in the designs.', say:'fold that into the designs'};
  const d = {t:e, text, eff, step: cur ? cur.name : 'Package chip', r: cur ? cur.r : undefined, from:null};
  if (!cur || cur.st === 2){
    d.reply = 'The design rounds are finished and the report is being written, so this run cannot change course now. Start a new run with this as the brief and it will be the target from round 1.';
  } else {
    let from = cur.st === 0 ? 0 : cur.r + 1;
    if (from >= run.rounds){ if (run.rounds < 5) run.rounds++; else from = null; }
    d.from = from;
    d.reply = from == null ? 'This is the last round allowed in this run, so I will note it in the report.'
      : `Understood. In round ${from+1} we will ${eff.say}. ${from >= 3 && run.rounds === from+1 ? `I added round ${from+1} for this, so the run takes about 40 seconds longer.` : 'The current round finishes as planned.'}`;
  }
  run.redirects.push(d); run._ev = null;
  if (S.route.view !== 'chat') go(runPath(run.id, 'chat')); else { renderChatFeed(run, true); tick(true); }
}

/* ----- overview ----- */
function renderOverview(run){
  $('#runmain').innerHTML = `<div class="scroll"><div class="ov">
    <div class="cards" id="cards"></div>
    <div class="pair">
      <section class="panel"><div class="ph"><span class="caps">Summary</span><div class="stepper" id="stp"></div></div><div class="sumb" id="sum"></div></section>
      <section class="panel"><div class="ph"><span class="caps">Activity</span><span id="actLive"></span></div><div class="acts" id="acts"></div></section>
    </div></div></div>${composerHtml(run)}`;
  wireComposer(run);
  $('#cards').onclick = e => { const j = e.target.closest('[data-jump]'); if (!j) return; S.chatJump = {name:j.dataset.jump, r:j.dataset.r}; go(runPath(run.id,'chat')); };
  $('#acts').onclick = e => { const a = e.target.closest('.ar'); if (a) a.classList.toggle('open'); };
  $('#stp').onclick = e => { const b = e.target.closest('button'); if (!b || b.disabled) return; const n = summaryVersions(run, viewT(run)).length; S.sumIdx = clamp((S.sumIdx==null?n-1:S.sumIdx) + (+b.dataset.d), 0, n-1); RV.sumSig = null; updateOverview(run); };
  S.sumIdx = null;
  updateOverview(run, true);
}
function updateOverview(run, force){
  const t = viewT(run), cur = stepAt(run,t);
  const cSig = [0,1,2].map(i => stageInfo(run,i,t).state).join() + (cur ? cur.name+cur.r : 'x') + run.rounds;
  if (force || cSig !== RV.cSig){
    RV.cSig = cSig;
    $('#cards').innerHTML = [0,1,2].map(i => `<div class="slot">${stageCard(run,i,t)}${treeRows(run,i,t)}</div>${i<2?`<div class="arrow">${ic('right','s16')}</div>`:''}`).join('');
  } else {
    document.querySelectorAll('#cards .mc').forEach((el,i) => {
      const s = stageInfo(run,i,t), r = 18, c = 2*Math.PI*r;
      el.querySelector('.arc').setAttribute('stroke-dashoffset', c*(1-s.pct));
      const p = el.querySelector('.pct'); if (s.state !== 'done') p.textContent = Math.round(s.pct*100)+'%';
      el.querySelector('.bar i').style.width = (s.pct*100)+'%';
      el.querySelector('.ft span').textContent = s.state==='pending'?'0s':fmtDur(s.dur);
      el.querySelector('.ft b').textContent = '$'+s.cost.toFixed(2);
      if (s.state === 'running'){ const sp = sparkPath(run,i,t,240,24), ps = el.querySelectorAll('.spark path'); ps[0].setAttribute('d', sp.area); ps[1].setAttribute('d', sp.line); }
    });
  }
  // summary
  const vs = summaryVersions(run,t), b = best(run,t), vd = verdict(run,b), idx = S.sumIdx==null ? vs.length-1 : Math.min(S.sumIdx, vs.length-1);
  const sSig = vs.length+'|'+idx+'|'+vd.text+'|'+nowLine(run,t);
  if (force || sSig !== RV.sumSig){
    RV.sumSig = sSig;
    $('#stp').innerHTML = vs.length ? `<button data-d="-1" ${idx<=0?'disabled':''} aria-label="Older summary">${ic('left','s12')}</button><span>${idx+1}/${vs.length}</span><button data-d="1" ${idx>=vs.length-1?'disabled':''} aria-label="Newer summary">${ic('right','s12')}</button>` : '';
    const mark = vd.k === 'ok' ? `<span class="vk ok">${ic('check','s12')}</span>` : vd.k === 'no' ? `<span class="vk no">${ic('alert','s12')}</span>` : `<span class="vk wait">${ic('clock','s12')}</span>`;
    $('#sum').innerHTML = `<p class="verdict">${mark}${vd.text}</p><p><b style="font-weight:600;color:var(--i800)">Now:</b> ${nowLine(run,t)}</p>${vs.length ? `<p>${vs[idx].p}</p>` : `<p style="color:var(--i500)">No summary yet. The first one is written when the target is set.</p>`}`;
  }
  // activity
  const ev = events(run).filter(e => e.t <= t), last = ev.slice(-8).reverse();
  const aSig = ev.length + '|' + run.ver;
  const live = run.viewT == null && !isDone(run) && !run.paused;
  $('#actLive').innerHTML = live ? '<span class="livep"><i></i>LIVE</span>' : '';
  if (force || aSig !== RV.aSig){
    const fresh = RV.aSig && !force;
    RV.aSig = aSig;
    $('#acts').innerHTML = last.length ? last.map((e,k) => `<div class="ar ${fresh&&k===0?'fresh':''}" title="${esc(e.text)}"><time>${clock(e.t)}</time><span class="cat ${e.cat}">${e.cat}</span><span class="msg">${esc(e.text)}</span></div>`).join('')
      : '<div class="ar"><span class="msg" style="color:var(--i500)">Starting the run...</span></div>';
  }
  updateComposerStep(run);
}

/* ----- chat ----- */
function renderChat(run){
  $('#runmain').innerHTML = `<div class="chat"><aside class="crail" id="crail"></aside><div class="cmain"><div class="scroll" id="feedScroll"><div class="feed" id="feed"></div></div>${composerHtml(run)}</div></div>`;
  wireComposer(run);
  $('#crail').onclick = e => {
    const j = e.target.closest('[data-jump]'); if (j){ jumpTo(run, j.dataset.jump, j.dataset.r); return; }
    const c = e.target.closest('[data-stage]'); if (c){ S.chatStage = +c.dataset.stage; RV.rSig = null; updateChat(run); }
  };
  $('#feed').onclick = e => { const h = e.target.closest('.head'); if (!h) return; const row = h.closest('.fr'); row.classList.toggle('open'); if (row.classList.contains('open')) S.open.add(row.dataset.id); else S.open.delete(row.dataset.id); };
  S.chatStage = null; RV.rSig = null;
  renderChatFeed(run, true);
  updateChat(run, true);
  if (S.chatJump){ const j = S.chatJump; S.chatJump = null; setTimeout(() => jumpTo(run, j.name, j.r), 30); }
  else { const sc = $('#feedScroll'); sc.scrollTop = sc.scrollHeight; }
}
function jumpTo(run, name, r){
  let sel;
  if (/^r\d+$/.test(name)) sel = `.stepdiv[data-r="${name.slice(1)}"]`;
  else sel = `.stepdiv[data-step="${name}"]` + (r != null && r !== '' && r !== undefined ? `[data-r="${r}"]` : '');
  const el = document.querySelector(sel);
  if (el){ el.scrollIntoView({block:'start', behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  else toast('That step has not started yet');
}
function feedRow(e, run, t){
  const u = UC[run.uc];
  if (e.user) return `<div class="fr user" data-id="${e.id}"><div class="bubble">${esc(e.text)}</div></div>`;
  const tool = e.cat === 'TOOL' || e.cat === 'SEARCH';
  const tile = {AGENT:['sparkle','#7c3aed'], RESULT:['check','#047857'], TOOL:['wrench','#2563eb'], SEARCH:['search','#0f766e']}[e.cat];
  const capCls = {AGENT:'v', RESULT:'gr', TOOL:'', SEARCH:'t'}[e.cat];
  const label = e.cat === 'AGENT' ? 'Scientist' : e.cat === 'RESULT' ? 'Result' : e.cat === 'SEARCH' ? 'Search' : 'Tool';
  const s = stepOfEvent(run, e), pending = tool && s && t < s.e && t >= e.t && !nextToolAfter(run, e, t);
  if (tool) return `<div class="fr tool ${S.open.has(e.id)?'open':''}" data-id="${e.id}"><div class="ft" style="color:${tile[1]}">${ic(tile[0])}${pending?'<span class="pend"></span>':''}</div><div class="fb"><div class="fc ${capCls}">${label}</div>
    <button class="head">${ic('right','s12 chv')}<span class="tx">${esc(e.text)}</span></button><div class="det">${esc(e.det||'')}</div></div></div>`;
  return `<div class="fr" data-id="${e.id}"><div class="ft" style="color:${tile[1]}">${ic(tile[0])}</div><div class="fb"><div class="fc ${capCls}">${label}</div><div class="tx">${esc(e.text)}</div></div></div>`;
}
function stepOfEvent(run,e){ return steps(run).find(s => s.name === e.step && (s.r === e.r || (s.r == null && e.r == null))); }
function nextToolAfter(run,e,t){ return events(run).some(x => x.t > e.t && x.t <= t && x.step === e.step && x.r === e.r && !x.user); }
function renderChatFeed(run, force){
  const t = viewT(run), ev = events(run).filter(e => e.t <= t);
  const pendingReply = run.redirects.some(d => d.t <= t && d.t + 2.5 > t);
  const sig = ev.length + '|' + pendingReply + '|' + run.ver + '|' + ev.filter(e => e.cat==='TOOL'||e.cat==='SEARCH').map(e => { const s = stepOfEvent(run,e); return s && t < s.e ? 1 : 0; }).join('');
  if (!force && sig === RV.fSig) return;
  const sc = $('#feedScroll'), atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 60;
  const prevCount = RV.fCount || 0;
  RV.fSig = sig; RV.fCount = ev.length;
  let html = '', lastKey = '';
  ev.forEach(e => {
    const key = (e.r != null ? 'r'+e.r : '') + e.step;
    if (key !== lastKey && !e.user && !e.reply){ lastKey = key; html += `<div class="stepdiv" data-step="${e.step}" ${e.r!=null?`data-r="${e.r}"`:''}>${e.r!=null?`Round ${e.r+1}, `:''}${e.step}</div>`; }
    html += feedRow(e, run, t);
  });
  if (pendingReply) html += `<div class="fr"><div class="ft" style="color:#7c3aed">${ic('sparkle')}</div><div class="fb"><div class="fc v">Scientist</div><span class="typing"><i></i><i></i><i></i></span></div></div>`;
