    const cx = 300, cy = 225, rx = 165, ry = 190, pos = n => [cx + Pp[n][0]*rx, cy + Pp[n][1]*ry];
    const used = ch ? NB_PAIRS.slice(0,ch) : [], all = NB_PAIRS;
    const body = `<div class="dv"><svg class="v" viewBox="0 0 600 440" role="img" aria-label="Newborn head seen from above with light sources and detectors">
      <ellipse cx="${cx}" cy="${cy+8}" rx="${rx}" ry="${ry}" fill="#fff" stroke="#d4d4dc" stroke-width="1.5"/>
      <path d="M${cx-14} ${cy-ry+12} Q${cx} ${cy-ry-14} ${cx+14} ${cy-ry+12}" fill="#fff" stroke="#d4d4dc" stroke-width="1.5"/>
      <text x="${cx}" y="${cy-ry-18}" font-size="10.5" text-anchor="middle" fill="#8a8a99">face</text>
      <rect x="${cx-rx*.86}" y="${cy-ry*.98}" width="${rx*1.72}" height="${ry*.6}" rx="40" fill="none" stroke="#b0b0be" stroke-dasharray="4 4"/>
      <text x="${cx}" y="${cy-ry*.98+ry*.6+16}" font-size="10.5" text-anchor="middle" fill="#8a8a99">sensor patch</text>
      ${all.map(([a,z]) => { const [x1,y1] = pos(a), [x2,y2] = pos(z), on = used.some(p => p[0]===a && p[1]===z); const mx = (x1+x2)/2 + (cx-(x1+x2)/2)*.25, my = (y1+y2)/2 + 34;
        return `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="${on?'#ef4444':'#e8e8ec'}" stroke-width="${on?7:4}" stroke-linecap="round" opacity="${on?.35:1}"/>`; }).join('')}
      ${Object.keys(Pp).map(n => { const [x,y] = pos(n), src = n[0]==='S', on = used.some(p => p.includes(n)); return src
        ? `<circle cx="${x}" cy="${y}" r="12" fill="${on?'#ef4444':'#f3f3f6'}" stroke="${on?'#b91c1c':'#d4d4dc'}"/><text x="${x}" y="${y+3.5}" font-size="9.5" text-anchor="middle" fill="${on?'#fff':'#8a8a99'}" font-weight="600">${n}</text>`
        : `<rect x="${x-11}" y="${y-11}" width="22" height="22" rx="4" fill="${on?'#1a1a2e':'#f3f3f6'}" stroke="${on?'#1a1a2e':'#d4d4dc'}"/><text x="${x}" y="${y+3.5}" font-size="9.5" text-anchor="middle" fill="${on?'#fff':'#8a8a99'}" font-weight="600">${n}</text>`; }).join('')}
      <g transform="translate(40,410)" font-size="11" fill="#666676"><circle cx="6" cy="-4" r="6" fill="#ef4444"/><text x="18" y="0">light source</text><rect x="110" y="-10" width="12" height="12" rx="2" fill="#1a1a2e"/><text x="128" y="0">detector</text></g>
    </svg>
    <div><div class="stat"><div class="sl">Light paths this chip reads</div><div class="sv">${ch ? `${ch} of 4` : 'Waiting'}</div><div class="sh">${ch ? used.map(p => p.join(' to ')).join(', ') : 'Round 1 has not finished its check.'}</div></div>
    <div class="stat"><div class="sl">Parts on the forehead</div><div class="sv">${ch ? new Set(used.flat()).size : '–'}</div><div class="sh">The longer paths reach deeper into the brain; the short ones mostly see skin.</div></div></div></div>`;
    return {title:'Sensors', sentence:"A newborn's head seen from above, with the light sources and detectors on the forehead; the paths this chip uses are lit.", body};
  },
  tradeoff(run,t,b,u){
    const X0 = 70, X1 = 960, Y0 = 30, Y1 = 330, gmin = 2000, gmax = 60000, ymin = 75, ymax = 100;
    const xs = g => X0 + Math.log(g/gmin)/Math.log(gmax/gmin)*(X1-X0), ys = v => Y1 - (clamp(v,ymin,ymax)-ymin)/(ymax-ymin)*(Y1-Y0);
    const counts = compiledCount(run,t), cur = stepAt(run,t);
    let dots = '', curR = cur && cur.st===1 && counts[cur.r] ? cur.r : -1;
    for (let r=0;r<run.rounds;r++){ const n = counts[r]; if (!n) continue; const res = roundResult(run,r), R = rng(run.seed*97+r);
      for (let k=0;k<n;k++){ const g = res.g * Math.exp(R()*1.9 - 0.15); const front = res.w + (u.ref - res.w) * (1 - Math.pow(res.g/g, .55)); const v = front - Math.pow(R(),1.6)*7 - (g < res.g ? (res.g-g)/res.g*12 : 0);
        dots += `<circle cx="${xs(g).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3.2" fill="${r===curR?'#3b82f6':'#b0b0be'}" opacity="${r===curR?.75:.5}"/>`; } }
    const total_ = counts.reduce((a,c) => a+c, 0);
    const body = `<svg class="v" viewBox="0 0 1000 380" role="img" aria-label="Sensitivity against chip size">
      ${[75,80,85,90,95,100].map(v => `<line x1="${X0}" x2="${X1}" y1="${ys(v)}" y2="${ys(v)}" stroke="#f3f3f6"/><text x="${X0-10}" y="${ys(v)+4}" font-size="10.5" text-anchor="end" fill="#8a8a99">${v}%</text>`).join('')}
      ${[2000,5000,10000,20000,50000].map(g => `<text x="${xs(g)}" y="${Y1+20}" font-size="10.5" text-anchor="middle" fill="#8a8a99">${fmt(g)}</text>`).join('')}
      <text x="${(X0+X1)/2}" y="${Y1+42}" font-size="11.5" text-anchor="middle" fill="#666676">Chip size, gates (smaller is better)</text>
      <text x="18" y="${(Y0+Y1)/2}" font-size="11.5" text-anchor="middle" fill="#666676" transform="rotate(-90 18 ${(Y0+Y1)/2})">Worst ${u.subj}, ${u.events} caught</text>
      <line x1="${X0}" x2="${X1}" y1="${ys(u.line)}" y2="${ys(u.line)}" stroke="#ef4444" stroke-dasharray="5 4"/>
      <text x="${X0+8}" y="${ys(u.line)-7}" font-size="11" fill="#b91c1c">clinical line, ${u.line}%</text>
      ${dots}
      ${b ? `<circle cx="${xs(b.g)}" cy="${ys(b.w)}" r="7" fill="#1a1a2e" stroke="#fff" stroke-width="2"/><circle cx="${xs(b.g)}" cy="${ys(b.w)}" r="12" fill="none" stroke="#1a1a2e" stroke-width="1.2"/>
        <text x="${xs(b.g)+16}" y="${ys(b.w)+22}" font-size="12" font-weight="600" fill="#1a1a2e">Current best, ${fmt(b.g)} gates</text>` : ''}
      ${total_ ? '' : `<text x="${(X0+X1)/2}" y="${(Y0+Y1)/2}" font-size="13" text-anchor="middle" fill="#8a8a99">Dots appear as round 1 compiles its candidates.</text>`}
    </svg>`;
    return {title:'Trade-off', sentence:`Each dot is one compiled candidate chip: how big it is against how well it does on the worst ${u.subj}.`, body,
      foot:`${fmt(total_)} candidates compiled so far${curR>=0?`; blue dots are from round ${curR+1}, still compiling`:''}. The ringed dot is the current best chip; dots above the red line meet it for the worst ${u.subj}.`};
  },
  patients(run,t,b,u){
    const tiles = [];
    for (let i=0;i<12;i++){
      if (!b){ tiles.push(`<div class="pt wait"><div class="pn">${u.Subj} ${i+1}</div><div class="pv">–</div><div class="pm" style="color:var(--i400)">not checked yet</div></div>`); continue; }
      const v = b.pats[i], ok = v >= u.line, worst = v === Math.min(...b.pats);
      tiles.push(`<div class="pt ${ok?'ok':'no'} ${worst?'worst':''}"><div class="pn">${u.Subj} ${i+1}${worst?'<span style="margin-left:auto;font-weight:600;color:var(--i900)">worst</span>':''}</div><div class="pv">${v.toFixed(1)}%</div><div class="pm">${ok?'meets the line':'below the line'}</div></div>`);
    }
    return {title:'Patients', sentence:`One tile per unseen ${u.subj}: the share of ${u.events} the chip caught. The worst ${u.subj} is what counts.`,
      body:`<div class="pts">${tiles.join('')}</div>`,
      foot: b ? `${b.meets} of 12 meet the clinical line of ${u.line}%. Worst: ${Math.min(...b.pats).toFixed(1)}%.` : 'Tiles fill in when round 1 has checked its first chip on the unseen ' + u.subjs + '.'};
  },
  device(run,t,b,u){
    const g = b ? b.g : null, area = g ? g*1.6e-5 + 0.02 : null, side = area ? Math.sqrt(area) : null, pw = g ? 0.005*g + 3 : null;
    const days = g ? 222 / (u.basePower + pw/1000) / 24 : null;
    const sc = 9, pw_ = u.patch.w*sc, ph_ = u.patch.h*sc, ox = 30, oy = 40, chipPx = side ? Math.max(1.5, side*sc) : 0, cxp = ox + pw_*0.55, cyp = oy + ph_*0.5;
    const mag = 20, mside = side ? side*sc*mag : 0;
    const body = `<div class="dv"><svg class="v" viewBox="0 0 560 ${oy+ph_+60+110}" role="img" aria-label="Chip drawn to scale on the sensor patch">
      <rect x="${ox}" y="${oy}" width="${pw_}" height="${ph_}" rx="${ph_*0.35}" fill="#f3f3f6" stroke="#d4d4dc" stroke-width="1.5"/>
      <text x="${ox}" y="${oy-14}" font-size="12" fill="#666676">${u.patch.name}, ${u.patch.w} by ${u.patch.h} mm</text>
      <rect x="${ox+20}" y="${oy+ph_-38}" width="60" height="22" rx="4" fill="#e8e8ec"/><text x="${ox+50}" y="${oy+ph_-23}" font-size="10" text-anchor="middle" fill="#8a8a99">battery</text>
      ${side ? `<rect x="${cxp-chipPx/2}" y="${cyp-chipPx/2}" width="${chipPx}" height="${chipPx}" fill="#1a1a2e"/>
        <circle cx="${cxp}" cy="${cyp}" r="9" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
        <line x1="${cxp+7}" y1="${cyp+7}" x2="${cxp+20}" y2="${oy+ph_+60}" stroke="#3b82f6" stroke-width="1"/>
        <rect x="${cxp+20}" y="${oy+ph_+60}" width="${mside}" height="${mside}" fill="#1a1a2e" rx="2"/>
        <text x="${cxp+20+mside+12}" y="${oy+ph_+60+16}" font-size="12" font-weight="600" fill="#1a1a2e">the chip, ${mag} times larger</text>
        <text x="${cxp+20+mside+12}" y="${oy+ph_+60+34}" font-size="11" fill="#666676">${side.toFixed(2)} by ${side.toFixed(2)} mm</text>`
      : `<text x="${ox+pw_/2}" y="${oy+ph_/2+4}" font-size="12" text-anchor="middle" fill="#8a8a99">chip appears after round 1</text>`}
      <line x1="${ox}" x2="${ox+10*sc}" y1="${oy+ph_+24}" y2="${oy+ph_+24}" stroke="#1a1a2e" stroke-width="1.5"/><text x="${ox+5*sc}" y="${oy+ph_+40}" font-size="10.5" text-anchor="middle" fill="#666676">10 mm</text>
    </svg>
    <div>
      <div class="stat"><div class="sl">Chip area<span class="est">estimate</span></div><div class="sv">${area ? area.toFixed(2)+' mm²' : '–'}</div><div class="sh">${g ? fmt(g)+' gates on a 28 nm process' : 'Waiting for round 1'}</div></div>
      <div class="stat"><div class="sl">Chip power<span class="est">estimate</span></div><div class="sv">${pw ? Math.round(pw)+' µW' : '–'}</div><div class="sh">Running all day, one prediction per window</div></div>
      <div class="stat"><div class="sl">Battery life, whole device<span class="est">estimate</span></div><div class="sv">${days ? days.toFixed(1)+' days' : '–'}</div><div class="sh">60 mAh cell; the sensors${run.uc==='nb'?' and their lights':' and radio'} use most of it</div></div>
    </div></div>`;
    return {title:'On the device', sentence:`The chip drawn to scale on the ${u.patch.name}, with what it costs in area, power and battery.`, body};
  }
};

/* ---------- configure, gallery ---------- */
const CFG = {
  'Clinical line':{lead:'What every chip must reach before it counts. Applies to new runs.', f:[
    ['Seizures caught, per patient','Brainwave sensing. The worst unseen patient must reach this.','num','90','%'],
    ['Oxygen drops caught, per newborn','Newborn sensing. The worst unseen newborn must reach this.','num','95','%'],
    ['False alarms allowed','Per patient, per day.','num','2',''],
    ['Patients held out','Never seen in training; used only to check chips.','num','12','']]},
  'Chip':{lead:'Limits on the chips the scientists may propose.', f:[
    ['Gate budget','The largest chip a round may return.','num','20000',''],
    ['Bits per weight','Fewer bits, fewer gates.','sel','8|6|4',''],
    ['Bit-for-bit check','Replay every window through circuit and model.','sw',true,'']]},
  'Steps':{lead:'How much work each run does.', f:[
    ['Rounds','Propose, fine-tune, compile and verify, repeated.','num','3',''],
    ['Designs per round','Each design is fine-tuned in many settings.','num','24',''],
    ['Models fine-tuned per design','','num','128',''],
    ['Review each round','A second scientist reviews the round before the next starts.','sw',true,'']]},
  'Agents':{lead:'Which agent and models do the thinking.', f:[
    ['Agent','','seg','Claude Agent|OpenHands|Free',''],
    ['Model for proposing designs','','sel','Claude Opus|Claude Sonnet',''],
    ['Model for the report','','sel','Claude Sonnet|Claude Haiku','']]},
  'Machine':{lead:'The smallest machine a run may use.', f:[
    ['Default machine','','sel','GPU Basic|CPU Basic|GPU Plus',''],
    ['Accept a smaller machine','Start sooner when the default is busy.','sw',false,'']]},
  'Budget':{lead:'When a run should wrap up.', f:[['Spend cap per run, in dollars','The run writes its report when it reaches this.','num','5','']]}
};
function renderConfigure(){
  const tab = CFG[S.cfgTab];
  const field = ([label,hint,type,val,unit]) => {
    let ctl = '';
    if (type === 'num') ctl = `<span style="display:flex;align-items:center;gap:6px"><input type="number" value="${val}" aria-label="${label}"><span style="width:14px;color:var(--i550)">${unit}</span></span>`;
    if (type === 'sel') ctl = `<select aria-label="${label}">${val.split('|').map(o => `<option>${o}</option>`).join('')}</select>`;
    if (type === 'sw') ctl = `<button class="sw ${val?'on':''}" aria-label="${label}" aria-pressed="${!!val}"></button>`;
    if (type === 'sel' || type === 'sw') ctl = `<span style="display:flex;align-items:center;gap:6px">${ctl}<span style="width:14px"></span></span>`;
    if (type === 'seg') ctl = `<div class="seg" style="margin:0;width:300px">${val.split('|').map(o => `<button class="${o===S.agent?'on':''}" data-agent="${o}">${o}</button>`).join('')}</div>`;
    return `<div class="field"><div class="fl"><b>${label}</b>${hint?`<span>${hint}</span>`:''}</div>${ctl}</div>`;
  };
  $('#page').innerHTML = `<div class="cfg"><aside class="side"><span class="caps">Mode</span>${PRESETS.map(p => `<button data-mode="${p.n}" class="${S.cfgMode===p.n?'on':''}">${ic(p.i,'s14')}${p.n}</button>`).join('')}
    <div class="sep" style="margin:12px 4px"></div>${Object.keys(CFG).map(k => `<button data-tab="${k}" class="${S.cfgTab===k?'on':''}">${k}</button>`).join('')}</aside>
    <div class="pane"><h1>${S.cfgTab}</h1><p class="lead">${tab.lead}</p>${tab.f.map(field).join('')}</div></div>`;
  $('#page').onclick = e => {
    const t = e.target.closest('[data-tab]'); if (t){ S.cfgTab = t.dataset.tab; renderConfigure(); return; }
    const m = e.target.closest('[data-mode]'); if (m){ S.cfgMode = m.dataset.mode; S.preset = m.dataset.mode; renderConfigure(); return; }
    const s = e.target.closest('.sw'); if (s){ s.classList.toggle('on'); s.setAttribute('aria-pressed', s.classList.contains('on')); return; }
    const a = e.target.closest('[data-agent]'); if (a){ S.agent = a.dataset.agent; renderConfigure(); }
  };
}
function renderGallery(){
  const fin = RUNS.filter(r => isDone(r));
  $('#page').innerHTML = `<div class="gal"><h1>Gallery</h1><div class="gcards">${fin.map(r => { const b = roundResult(r, r.rounds-1), u = UC[r.uc];
    return `<button class="gcard" data-id="${r.id}"><b>${esc(r.title)}</b><span>${u.name}. ${fmt(b.g)} gates, ${chLabel(u,b.ch)}, meets the clinical line on ${b.meets} of 12 unseen ${u.subjs}.</span></button>`; }).join('')}</div></div>`;
  $('#page').onclick = e => { const c = e.target.closest('[data-id]'); if (c) go(runPath(c.dataset.id)); };
}

/* ---------- routing and tick ---------- */
function route(){
  closePop();
  S.route = parseHash();
  $('#page').onclick = null;
  if (S.route.page === 'run') renderRun();
  else if (S.route.page === 'configure') renderConfigure();
  else if (S.route.page === 'gallery') renderGallery();
  else renderStart();
  renderSidebar(true);
  const run = S.route.page === 'run' ? byId(S.route.id) : null;
  document.title = run ? `${run.title} - ${PRODUCT.short}` : PRODUCT.name;
}
function tick(force){
  renderSidebar();
  if (S.route.page !== 'run') return;
  const run = byId(S.route.id); if (!run) return;
  renderTopbar(force === true);
  if (S.route.view === 'overview' && $('#cards')) updateOverview(run, force === true);
  if (S.route.view === 'chat' && $('#feed')) updateChat(run, force === true);
  if (S.route.view === 'visual' && $('#visBody')) updateVisual(run);
  renderDrawer(run);
}
window.addEventListener('hashchange', route);
setInterval(tick, 500);

$('#mhead').innerHTML = `<button class="sqbtn" id="hamb" aria-label="Open menu">${ic('menu','s16')}</button><div class="logo">${ic('cpu')}</div><div class="word">${esc(PRODUCT.short)}</div><span class="demo-m">${DEMO_LABEL}</span>`;
$('#hamb').onclick = () => $('#sb').classList.add('drawer-open');
$('#demo').textContent = DEMO_LABEL;
document.addEventListener('mousedown', e => { const sb = $('#sb'); if ((sb.classList.contains('drawer-open') || sb.classList.contains('peek')) && !sb.contains(e.target) && !e.target.closest('#hamb') && !e.target.closest('#layer')) closeMobile(); });
route();
})();
</script>
</body>
