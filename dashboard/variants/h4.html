<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='%233D6DF0' stroke-width='7' d='M53 12.5H23A10.5 10.5 0 0 0 12.5 23V41A10.5 10.5 0 0 0 23 51.5H53'/%3E%3Crect fill='%233D6DF0' x='26' y='25' width='14' height='14' rx='1.5'/%3E%3C/svg%3E">
<style>
:root{
  --page:#f5f6f8;--card:#fff;--glass:rgb(250 251 253/.8);--glass-s:rgb(252 252 254/.97);
  --i900:#141a2e;--i800:#262c40;--i700:#3a4052;--i600:#4a5062;--i550:#555b6d;--i500:#5c6276;--i300:#b2b6c2;--i200:#d5d8e0;--i150:#e7e9ee;--i100:#f1f2f6;
  --blue:#3d6df0;--blue6:#3d6df0;--blue7:#2b55d0;--teal:#2b55d0;
  --navy:#0e1530;--navy2:#16204a;
  --c-lead:#6b46c1;--c-lead-bg:#f3effc;--c-model:#2b55d0;--c-model-bg:#edf2fe;--c-chip:#a04812;--c-chip-bg:#fdf1e7;--c-test:#0f7a55;--c-test-bg:#e8f6ef;
  --caught:#0f7a55;--missed:#c2362b;--falsea:#b7791f;--falsea-t:#8a5a0c;
  --ok:#10b981;--okt:#047857;--okbg:#ecfdf5;--bad:#ef4444;--badt:#b91c1c;
  --amber:#b45309;--amberbg:#fffbeb;
  --hair:rgb(0 0 0/.07);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Charter","Georgia",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sh-menu:0 4px 20px rgb(0 0 0/.1);--sh-hair:0 1px 3px rgb(0 0 0/.04);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--i900);background:var(--page);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s12{width:12px;height:12px}svg.i.s13{width:13px;height:13px}svg.i.s14{width:14px;height:14px}svg.i.s16{width:16px;height:16px}svg.i.s20{width:20px;height:20px}

/* ---------- sidebar ---------- */
.sb{position:fixed;inset:0 auto 0 0;width:252px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid rgb(0 0 0/.05);display:flex;flex-direction:column;z-index:40;transition:width .15s var(--ease),box-shadow .15s var(--ease),transform .2s var(--ease)}
.sb-head{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--hair)}
.logo{width:28px;height:28px;flex:none;display:grid;place-items:center}
.logo svg{width:28px;height:28px;display:block}
.word{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;color:var(--i900)}
.tog{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550);flex:none}
.tog:hover{background:rgb(0 0 0/.05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--i600);text-decoration:none;white-space:nowrap}
.nav a:hover{background:rgb(0 0 0/.035)}
.nav a.on{background:rgb(59 130 246/.08);color:var(--i900)}
.count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--blue7);background:rgb(37 99 235/.08);border-radius:99px;padding:1px 7px}
.sb-div{height:1px;background:var(--hair);margin:2px 12px}
.runs{flex:1;overflow:auto;padding:6px 8px 10px}
.cap{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:11px;font-weight:600;color:var(--i550)}
.cap a{font-weight:500;text-decoration:none;color:var(--i550);cursor:pointer}
.cap a:hover{color:var(--i900)}
.rrow{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);text-decoration:none;white-space:nowrap}
.rrow:hover{background:rgb(0 0 0/.03)}
.rrow.on{background:rgb(59 130 246/.08);color:var(--i900)}
.rrow .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid rgb(59 130 246/.2);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g .ok{color:var(--okt)}
.acct{flex:none;border-top:1px solid var(--hair);padding:8px}
.acct button{display:flex;align-items:center;gap:9px;width:100%;padding:5px;border-radius:8px}
.acct button:hover{background:rgb(0 0 0/.03)}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:11px;color:var(--i550)}
body.col .sb{width:52px}
body.col .sb:hover{width:252px;box-shadow:var(--sh-menu)}
body.col .sb:not(:hover) .hc{display:none}
body.col .sb:not(:hover) .sb-head{justify-content:center;padding:0}
body.col .sb:not(:hover) .sb-head .logo{display:none}
body.col .sb:not(:hover) .tog{margin:0}
body.col .sb:not(:hover) .nav a{justify-content:center;padding:0}
body.col .sb:not(:hover) .runs{visibility:hidden}
body.col .sb:not(:hover) .acct button{justify-content:center}

/* ---------- main ---------- */
.main{position:fixed;top:0;right:0;bottom:0;left:252px;display:flex;flex-direction:column;transition:left .15s var(--ease)}
body.col .main{left:52px}
.mhead{display:none}
.demo{position:fixed;right:12px;bottom:10px;z-index:20;font-size:11px;font-weight:500;color:var(--i600);background:rgb(255 255 255/.92);padding:3px 9px;border-radius:99px;border:1px solid rgb(0 0 0/.08);pointer-events:none}

/* ---------- start ---------- */
.start{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:28px}
.scol{width:100%;max-width:820px;margin-top:-3vh}
.band{position:relative;border-radius:22px;background:radial-gradient(120% 140% at 78% 40%,#1d2c63 0%,var(--navy2) 38%,var(--navy) 78%);overflow:hidden;height:330px;color:#e6ebf7;box-shadow:0 24px 60px -30px rgb(14 21 48/.7)}
.band .g3{position:absolute;top:0;bottom:0;right:0;left:auto;width:56%}
.band .bt{position:absolute;left:36px;top:34px;right:46%;z-index:2;pointer-events:none}
.band .lock{height:34px;width:auto;display:block;margin-bottom:58px}
.greet{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.08;margin:0;letter-spacing:-.015em;color:#fff}
.subt{font-size:15px;color:#c9d2ea;margin:12px 0 0;line-height:1.5;max-width:330px}
.band .dief{display:none;position:absolute;right:22px;top:18px;font-size:11.5px;color:#aab6d6;z-index:2;pointer-events:none}
.band .fb3{color:#c9d2ea}
.scol .box{margin:-34px 22px 0;position:relative;z-index:3}
.stip{font-size:12.5px;color:var(--i600);text-align:center;margin:16px 0 0}
.box{background:var(--glass-s);border:1px solid rgb(0 0 0/.08);border-radius:24px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 28px -14px rgb(30 40 90/.16);padding:18px 20px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.55;min-height:24px;max-height:280px;color:var(--i900);padding:0;display:block}
.box textarea::placeholder{color:var(--i500)}
.crow{display:flex;align-items:center;gap:6px;margin-top:12px;min-height:36px}
.grow{flex:1}
.pill{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border-radius:99px;border:1px solid rgb(0 0 0/.1);background:#fff;font-size:11.5px;font-weight:500;color:var(--i800);white-space:nowrap}
.pill:hover{background:var(--i100)}
.pill .cv{opacity:.6}
.pill[aria-expanded=true]{border-color:rgb(37 99 235/.45)}
.send{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:#8b8b9a;flex:none;transition:all .12s}
.send.ready{background:#fff;color:var(--i900);box-shadow:0 1px 2px rgb(0 0 0/.08),0 3px 10px rgb(0 0 0/.1)}
.send svg{width:17px;height:17px;stroke-width:2.1}
.chipin{height:36px;padding:0 16px 0 14px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;background:var(--i150);color:var(--i600);font-size:13.5px;font-weight:600;flex:none;transition:background .12s}
.chipin.ready{background:var(--blue7);color:#fff}
.chipin.ready:hover{background:#2347b4}
.chipin svg{width:16px;height:16px}

/* ---------- intake ---------- */
.ik{flex:1;overflow:auto;display:flex;justify-content:center;padding:56px 24px 80px}
.ikc{width:100%;max-width:640px}
.ikp{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.ikback{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--i600);padding:5px 8px 5px 4px;border-radius:7px}
.ikback:hover{background:var(--i100)}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--i150)}
.dots i.on{background:var(--blue6)}
.ikprompt{font-size:13px;color:var(--i600);line-height:1.5;border-left:2px solid var(--i150);padding:2px 0 2px 12px;margin:0 0 26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ikq{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.2;letter-spacing:-.012em;margin:0 0 8px;text-wrap:balance}
.iks{font-size:14px;color:var(--i600);margin:0 0 24px;line-height:1.55}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.an{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:16px;border:1px solid rgb(0 0 0/.1);background:#fff;text-align:left;transition:border-color .12s,box-shadow .12s}
.an:hover{border-color:rgb(37 99 235/.5);box-shadow:0 4px 18px -8px rgb(37 99 235/.35)}
.an b{font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px}
.an span{font-size:13px;color:var(--i600);line-height:1.45}
.an .ai{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--i100);color:var(--i800)}
.an.pri{border-color:var(--blue6);box-shadow:0 0 0 1px var(--blue6) inset}
.ans.ans3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ans3 .an b{font-size:15px;align-items:flex-start}
.ans3 .an .ai{flex:none}
.dcard{border:1px solid rgb(0 0 0/.1);border-radius:16px;background:#fff;padding:18px 20px;margin-bottom:12px}
.dcard.best{border-color:#93c5fd;box-shadow:0 0 0 3px rgb(59 130 246/.09)}
.dtag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--blue7);background:#eff6ff;border-radius:99px;padding:2px 9px;margin-bottom:8px}
.dtag.no{color:#7c2d12;background:#fff7ed}
.dname{font-size:17px;font-weight:600;margin:0 0 3px}
.dfrom{font-size:12.5px;color:var(--i600);margin:0 0 12px}
.dfrom a{color:var(--blue7)}
.dkv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.dkv div{font-size:12px;color:var(--i600)}
.dkv b{display:block;font-size:13.5px;color:var(--i900);font-weight:600;margin-top:2px}
.dwhy{font-size:13px;color:var(--i700);line-height:1.5;margin:0}
.dmini{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--hair);font-size:13px;color:var(--i700);line-height:1.45}
.dmini b{color:var(--i900)}
.dmore summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--i700);padding:8px 0;list-style:none}
.dmore summary::-webkit-details-marker{display:none}
.acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{height:40px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.p{background:var(--i900);color:#fff}
.btn.p:hover{background:#2d2d48}
.btn.s{background:#fff;border:1px solid rgb(0 0 0/.12);color:var(--i800)}
.btn.s:hover{background:var(--i100)}
.btn[disabled]{opacity:.45;cursor:default}
.drop{border:1.5px dashed #a5b4cc;border-radius:16px;padding:26px;text-align:center;background:#fff;color:var(--i700);font-size:13.5px}
.drop b{display:block;font-size:15px;color:var(--i900);margin:8px 0 4px}
.files{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.file{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--hair);border-radius:11px;background:#fff;font-size:13px}
.file .sz{margin-left:auto;color:var(--i600);font-size:12px}
.asm{border:1px solid rgb(0 0 0/.1);border-radius:14px;background:#fff;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.asm .q{font-size:14.5px;font-weight:600;line-height:1.4}
.asm .w{font-size:12.5px;color:var(--i600);line-height:1.45;grid-column:1}
.asm .chg{grid-column:1/-1}
.asm input{width:100%;height:36px;border:1px solid #93c5fd;border-radius:9px;padding:0 10px;font-size:13.5px;outline:0;box-shadow:0 0 0 3px rgb(59 130 246/.12)}
.seg{display:inline-flex;border:1px solid rgb(0 0 0/.12);border-radius:9px;overflow:hidden;grid-row:1/span 2;grid-column:2;align-self:center}
.seg button{font-size:12.5px;font-weight:500;padding:7px 11px;color:var(--i700);white-space:nowrap}
.seg button+button{border-left:1px solid rgb(0 0 0/.12)}
.seg button.on{background:var(--i900);color:#fff}
.mine{font-size:11px;font-weight:600;color:#7c2d12;background:#fff7ed;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.warnl{font-size:12.5px;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:10px 12px;line-height:1.5;margin:0 0 16px}
/* intake step header: three named steps */
.ksteps{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;color:var(--i600)}
.ksteps span{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:99px}
.ksteps span i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;background:var(--i150);color:var(--i700)}
.ksteps span.on{color:var(--i900);font-weight:600;background:#fff;box-shadow:inset 0 0 0 1px var(--i150)}
.ksteps span.on i{background:var(--blue7);color:#fff}
.ksteps span.dn i{background:#dfe7fd;color:var(--blue7)}
.ksteps b{width:14px;height:1px;background:var(--i200)}
.ksteps em{font-style:normal}
.skipall{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--i600)}
.lnk{font-size:13px;font-weight:600;color:var(--blue7);padding:6px 2px;border-radius:6px}
.lnk:hover{text-decoration:underline}
.lnk.q{color:var(--i600);font-weight:500}
.qcard{background:#fff;border:1px solid rgb(0 0 0/.09);border-radius:18px;padding:22px 22px 18px;box-shadow:0 10px 30px -22px rgb(20 30 70/.35);animation:rise .3s var(--ease)}
.qn{font-size:12px;color:var(--i600);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.qn .bar{flex:1;height:3px;border-radius:2px;background:var(--i150);overflow:hidden;max-width:160px}
.qn .bar i{display:block;height:100%;background:var(--blue7)}
.qcard h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.qcard .qw{font-size:13px;color:var(--i600);margin:0 0 16px;line-height:1.5}
.achips{display:flex;flex-wrap:wrap;gap:8px}
.achip{height:34px;padding:0 14px;border-radius:99px;border:1px solid rgb(0 0 0/.13);background:#fff;font-size:13px;font-weight:500;color:var(--i800)}
.achip:hover{border-color:var(--blue7);color:var(--blue7)}
.achip.on{background:var(--blue7);border-color:var(--blue7);color:#fff}
.afree{display:flex;gap:8px;margin-top:12px;align-items:center}
.afree input{flex:1;min-width:0;height:38px;border:1px solid var(--i200);border-radius:10px;padding:0 12px;font-size:13.5px;outline:0;background:#fff}
.afree input:focus{border-color:var(--blue7);box-shadow:0 0 0 3px rgb(61 109 240/.14)}
.qacts{display:flex;align-items:center;gap:12px;margin-top:14px}
.qacts .grow{flex:1}
.qdone{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.qdone div{display:flex;gap:10px;font-size:12.5px;color:var(--i700);align-items:baseline}
.qdone div b{font-weight:600;color:var(--i900);min-width:0}
.qdone div span:first-child{flex:none;width:150px;color:var(--i600)}
/* search that looks like a search */
.slog{background:#fff;border:1px solid rgb(0 0 0/.09);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.slog .sh{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;margin-bottom:10px}
.slog .sh .spin{width:14px;height:14px}
.slog ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.slog li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;font-size:12.5px;color:var(--i700);line-height:1.45;animation:rise .25s var(--ease)}
.slog li .x{color:var(--missed);font-weight:700;text-align:center}
.slog li .k{color:var(--caught);text-align:center}
.slog li .d{color:var(--i600);text-align:center}
.slog li em{font-style:normal;color:var(--i600);font-variant-numeric:tabular-nums}
.slog li s{text-decoration:none;color:var(--i900);font-weight:600}
.arch{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.arch span{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--i100);color:var(--i700)}
.arch span.on{background:#dfe7fd;color:var(--blue7)}
.prep{font-size:12px;color:var(--i600);margin:10px 0 0}
/* attached file and what was read from it */
.edf{border:1px solid rgb(0 0 0/.09);border-radius:16px;background:#fff;padding:16px 18px;margin-top:12px}
.edf .eh{display:flex;align-items:center;gap:10px;font-size:13.5px}
.edf .eh b{font-weight:600}
.edf .eh .sz{margin-left:auto;color:var(--i600);font-size:12.5px}
.edf .rd{margin:12px 0 0;padding:10px 12px;border-radius:11px;background:#eef6f1;color:#0b5a3f;font-size:13px;line-height:1.5}
.edf .rd b{font-weight:600}
.edf .note2{font-size:12px;color:var(--i600);margin:8px 0 0;line-height:1.5}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chs button{height:28px;padding:0 10px;border-radius:8px;border:1px solid rgb(0 0 0/.12);background:#fff;font-size:12px;font-weight:500;color:var(--i700);font-variant-numeric:tabular-nums}
.chs button.on{background:#e3eafd;border-color:#9db4f6;color:#1f44b0;font-weight:600}
.chs button.dup{border-style:dashed}
.chgrp{font-size:12px;color:var(--i600);margin:12px 0 0}
.simhow{font-size:13px;color:var(--i700);line-height:1.55;background:#fff;border:1px solid rgb(0 0 0/.09);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.simhow b{color:var(--i900)}
.asm .q .mine{vertical-align:1px}
.addasm{display:flex;gap:8px;margin-top:4px}
.addasm input{flex:1;height:38px;border:1px dashed var(--i300);border-radius:10px;padding:0 12px;font-size:13.5px;outline:0;background:#fff}
.addasm input:focus{border-style:solid;border-color:var(--blue7)}

.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px 10px;align-items:center;font-size:12px;color:var(--i700)}
.bars i{display:block;height:8px;border-radius:4px;background:#c3c8d4;min-width:3px}
.bars i.me{background:var(--i900)}
.bars em{font-style:normal;font-variant-numeric:tabular-nums;text-align:right;color:var(--i800)}
.detb{display:inline-flex;align-items:center;gap:4px;margin:12px 0 0;font-size:12.5px;font-weight:600;color:var(--blue7);padding:3px 0}
.detb svg{transition:transform .15s}
.detb[aria-expanded=true] svg{transform:rotate(90deg)}
.rch{margin:10px 0 0;padding:12px 12px 8px;border:1px solid var(--hair);border-radius:12px;background:#fbfbfc}
.rch p{font-size:12.5px;color:var(--i700);margin:0 0 6px;line-height:1.45}
.rch svg{display:block;width:100%;height:auto}
.ctile{position:absolute;right:18px;top:14px;display:flex;align-items:center;gap:10px;padding:7px 13px 7px 9px;background:#fff;border:1px solid rgb(0 0 0/.08);border-radius:12px;text-decoration:none;color:inherit;box-shadow:var(--sh-hair);z-index:2}
.ctile:hover{background:var(--i100)}
.ctile .mchip{width:50px;height:37px;margin:0}
.ctile b{display:block;font-size:13px;font-weight:600}
.ctile .cs{display:block;font-size:11.5px;color:var(--i600)}
.chat{position:relative}
.cstat{max-width:672px;margin:0 auto 8px;font-size:12.5px;color:var(--i700);display:flex;align-items:center;gap:8px;padding:0 4px}
.cstat .spin{flex:none}
.spark{display:block;width:100%;height:30px;margin-top:6px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:100%}
.feed{flex:1;overflow:auto;min-height:0}
.fin{max-width:700px;margin:0 auto;padding:30px 24px 16px}
.msg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;margin:0 0 18px;animation:rise .35s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.mav{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.mav svg{width:14px;height:14px}
.who{font-size:12px;font-weight:600}
.when{font-size:11px;color:var(--i550);margin-left:8px;font-weight:400;font-variant-numeric:tabular-nums}
.stag{font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 7px;margin-left:8px}
.mt{font-size:13.5px;line-height:1.58;color:var(--i800);margin-top:2px}
.tool{margin:-8px 0 18px 36px;border:1px solid rgb(0 0 0/.08);border-radius:10px;background:#fff;animation:rise .35s var(--ease)}
.tool summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--i700);cursor:pointer;border-radius:10px}
.tool summary::-webkit-details-marker{display:none}
.tool summary:hover{background:var(--i100)}
.tool summary .cv{margin-left:auto;transition:transform .15s;color:var(--i550)}
.tool[open] summary .cv{transform:rotate(90deg)}
.tool .tsp{width:12px;height:12px;border-radius:50%;border:1.6px solid rgb(59 130 246/.2);border-top-color:var(--blue);animation:spin 1s linear infinite;flex:none}
.tool .tok{color:var(--okt)}
.tool .tk{font-size:11px;font-weight:600;color:#1e40af;background:#dbeafe;border-radius:99px;padding:1px 7px}
.tool .tk.pp{color:#5b21b6;background:#ede9fe}
.tool ul{margin:0;padding:4px 12px 10px 30px;font-size:12.5px;color:var(--i700);line-height:1.6}
.you{display:flex;justify-content:flex-end;margin:0 0 18px;animation:rise .3s var(--ease)}
.you p{margin:0;background:var(--teal);color:#fff;font-size:13.5px;line-height:1.5;padding:8px 13px;border-radius:16px 16px 4px 16px;max-width:75%}
.typing{display:flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--i300);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.comp{flex:none;padding:6px 24px 22px}
.comp .box{max-width:672px;margin:0 auto;padding:12px 12px 12px 18px;display:flex;align-items:flex-end;gap:10px}
.comp textarea{padding:8px 0}

/* ---------- visual ---------- */
.vis{max-width:1180px;margin:0 auto;padding:14px 28px 40px}
.picker{display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--hair);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.pk{text-decoration:none;font-size:13px;font-weight:500;color:var(--i600);padding:8px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pk:hover{color:var(--i900)}
.pk.on{color:var(--i900);font-weight:600;border-bottom-color:var(--i900)}
.vh{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vh>div{flex:1;min-width:260px}
.vh h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;letter-spacing:-.01em}
.vh .vs{font-size:13.5px;color:var(--i700);margin:5px 0 0;line-height:1.5;max-width:760px}
.stage{margin-top:14px;background:#fff;border:1px solid rgb(0 0 0/.07);border-radius:16px;box-shadow:var(--sh-hair);padding:14px 16px;position:relative}
.stage.s3{padding:0;overflow:hidden;height:max(440px,calc(100vh - 236px))}
.stage.light{background:radial-gradient(110% 90% at 45% 35%,#fdfdfd 0%,#eef0f3 55%,#e1e4e9 100%)}
.stage.dark{background:radial-gradient(120% 100% at 50% 30%,#1c2638 0%,#111827 55%,#0b1120 100%);border-color:#0b1120}
.stage svg.v{display:block;width:100%;height:auto;max-height:calc(100vh - 250px)}
.vf{font-size:12.5px;color:var(--i600);margin:10px 2px 0}
.qbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;border:1px solid rgb(0 0 0/.12);background:#fff;font-size:12.5px;font-weight:500;color:var(--i800);white-space:nowrap}
.qbtn:hover{background:var(--i100)}
.segc{position:absolute;left:16px;top:16px;display:inline-flex;background:rgb(255 255 255/.95);border:1px solid rgb(0 0 0/.1);border-radius:11px;padding:3px;box-shadow:0 6px 20px -12px rgb(20 30 60/.3)}
.segc button{font-size:12.5px;font-weight:500;color:var(--i700);padding:6px 12px;border-radius:8px;white-space:nowrap}
.segc button.on{background:var(--i900);color:#fff}
.est{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 32px)}
.est div{background:rgb(255 255 255/.95);border:1px solid rgb(0 0 0/.08);border-radius:12px;padding:8px 12px;min-width:120px}
.est b{display:block;font-family:var(--serif);font-weight:400;font-size:21px;color:var(--i900)}
.est span{display:block;font-size:11.5px;color:var(--i700)}
.est em{font-style:normal;font-size:10.5px;font-weight:600;color:#7c2d12;background:#fff7ed;border-radius:99px;padding:0 6px;margin-left:4px}
.cap3.r{left:auto;right:16px;top:16px;max-width:300px}
.ccard{position:absolute;width:236px;background:rgb(255 255 255/.97);border-radius:13px;padding:11px 13px;box-shadow:0 10px 30px -12px rgb(0 0 0/.55);color:var(--i900)}
.ccard .k{font-size:11.5px;font-weight:600;color:var(--blue7)}
.ccard .k.o{color:#92400e}.ccard .k.m{color:#5b21b6}
.ccard b{display:block;font-size:14px;margin-top:1px}
.ccard span{display:block;font-size:12px;color:var(--i700);line-height:1.45;margin-top:3px}
.ccard .big{font-family:var(--serif);font-size:24px;font-weight:400;margin-top:2px}
.ftb{position:absolute;right:16px;bottom:16px}
.ftb .qbtn{background:rgb(255 255 255/.96)}
.fun{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 14px;pointer-events:none}
.fun div{display:flex;flex-direction:column;align-items:center;padding:7px 12px;border-radius:11px;background:rgb(15 23 42/.72);border:1px solid rgb(148 163 184/.25);color:#cbd5e1;min-width:104px;transition:all .25s}
.fun div b{font-family:var(--serif);font-weight:400;font-size:22px;color:#f1f5f9;line-height:1.1}
.fun div span{font-size:11.5px;color:#cbd5e1}
.fun div.on{background:#f8fafc;border-color:#f8fafc;color:var(--i800);box-shadow:0 0 24px rgb(96 165 250/.45)}
.fun div.on b{color:var(--i900)}.fun div.on span{color:var(--i700)}
.fun .ar{align-self:center;color:#94a3b8;font-size:16px;background:none;border:0;min-width:0;padding:0}
.rrw{position:absolute;left:14px;bottom:14px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;max-width:calc(100% - 200px)}
.rrw div{background:rgb(15 23 42/.78);border:1px solid rgb(148 163 184/.25);border-radius:11px;padding:8px 11px;color:#e2e8f0;font-size:11.5px;display:flex;align-items:center;gap:9px}
.rrw div b{display:block;color:#f8fafc;font-size:13px;font-weight:600}
.rrw div i{display:block;background:linear-gradient(135deg,#334155,#0f172a);border:1.5px solid #e2e8f0;border-radius:2px;flex:none}
.rrw div.best{border-color:#fbbf24;box-shadow:0 0 0 1px #fbbf24}
.rpl{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;align-items:center}
.rpl .qbtn{background:#f8fafc;border-color:#f8fafc}
.rpl em{font-style:normal;font-size:12px;font-weight:600;color:#fde68a;background:rgb(15 23 42/.78);border-radius:99px;padding:4px 10px}
.sgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);height:100%}
.sgrid .sv{position:relative;min-height:0}
.sside{padding:22px 22px;border-left:1px solid var(--hair);background:rgb(255 255 255/.9);overflow:auto}
.sbig{font-family:var(--serif);font-size:40px;line-height:1;margin:0}
.ssub{font-size:13.5px;color:var(--i700);margin:6px 0 18px}
.sens{display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px;padding:14px 0;border-top:1px solid var(--hair)}
.sens .sd{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;grid-row:1/span 3}
.sens .k{font-size:11.5px;font-weight:600;color:var(--blue7)}
.sens b{font-size:14.5px}
.sens span{font-size:12.5px;color:var(--i700);line-height:1.5}
.lbl3{position:absolute;transform:translate(-50%,-130%);font-size:11.5px;font-weight:700;color:#fff;background:#1d4ed8;padding:2px 7px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgb(0 0 0/.2)}
.lbl3.o{background:#9a3412}.lbl3.d{background:#1a1a2e}
.sigc{display:block;width:100%;height:max(380px,calc(100vh - 300px))}
.ptiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pt{border:1px solid rgb(0 0 0/.08);border-radius:10px;padding:12px 12px 11px;background:#fff}
.pt .pn{font-size:12px;color:var(--i600)}
.pt .pv{font-family:var(--serif);font-size:25px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.pt .ps{font-size:12px;display:flex;align-items:center;gap:5px}
.pt .ps i{width:7px;height:7px;border-radius:50%}
.pt.ok .ps{color:var(--okt)}.pt.ok .ps i{background:var(--ok)}
.pt.no{background:#fffaf5;border-color:#fdba74}.pt.no .ps{color:#9a3412}.pt.no .ps i{background:#f97316}
.pt.worst{box-shadow:0 0 0 2px var(--i900)}
.pt .wl{font-size:11px;font-weight:600;color:var(--i900);margin-top:6px}

/* ---------- configure ---------- */
.cfg{max-width:860px;margin:0 auto;padding:44px 28px 60px}
.cfg h1{font-family:var(--serif);font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em}
.cfg .lead2{color:var(--i600);margin:8px 0 28px;font-size:14px}
.cgrid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:28px}
.ctabs{display:flex;flex-direction:column;gap:2px}
.ctab{padding:8px 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--i600);text-decoration:none}
.ctab:hover{background:rgb(0 0 0/.03)}
.ctab.on{background:rgb(59 130 246/.08);color:var(--i900)}
.cpanel{background:#fff;border:1px solid rgb(0 0 0/.07);border-radius:12px;padding:6px 18px}
.crow2{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--hair)}
.crow2:last-child{border:0}
.crow2 .l{flex:1;min-width:0}
.crow2 .l b{display:block;font-size:13.5px;font-weight:600}
.crow2 .l span{display:block;font-size:12.5px;color:var(--i600);margin-top:2px}
.crow2 select,.crow2 input[type=text]{height:30px;border:1px solid var(--i200);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px}
.sw{width:32px;height:18px;border-radius:99px;background:#a3a3b5;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.2);transition:left .15s}
.sw[aria-checked=true]{background:var(--blue6)}
.sw[aria-checked=true]::after{left:16px}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid #a3a3b5;flex:none;display:grid;place-items:center}
.radio.on{border-color:var(--blue6)}
.radio.on::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue6)}
.cnote{font-size:12.5px;color:var(--i600);margin:12px 2px 0}

/* ---------- responsive ---------- */
@media (max-width:1240px){.ctile{display:none}}
@media (max-width:1100px){.ttl{max-width:160px}.ovx,.ovg{grid-template-columns:minmax(0,1fr) 300px}.ptiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:900px){.tchip .lb{display:none}.sgrid{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.sside{border-left:0;border-top:1px solid var(--hair);max-height:42%}}
@media (max-width:767px){
  .sb{width:252px!important;transform:translateX(-100%);box-shadow:none}
  body.drawer .sb{transform:none;box-shadow:var(--sh-menu)}
  body.col .sb .hc{display:revert}
  .main,body.col .main{left:0;top:48px}
  .mhead{display:flex;position:fixed;top:0;left:0;right:0;height:48px;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--hair);background:var(--glass-s);z-index:30}
  .scrim{position:fixed;inset:0;z-index:35;background:rgb(20 20 40/.18)}
  .ttl,.tchip,.track{display:none}
  .pbar{flex:0 0 auto}
  .top{gap:10px;padding:0 8px 0 12px}
  .tabs{gap:14px}
  .ovx{display:block;height:auto}
  .hero{height:52vh;min-height:300px}
  .rail2{border-left:0;border-top:1px solid var(--hair);padding:20px 18px 70px}
  .cap3{left:12px;top:12px;right:12px;max-width:none;padding:9px 11px}
  .cap3>span{display:none}
  .inset{width:140px;height:118px;right:12px;bottom:12px}
  .inset .ic span,.inset .itop{display:none}
  .vline{font-size:25px}
  .vis{padding:10px 12px 50px}
  .stage.s3{height:62vh;min-height:360px}
  .ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stage.sc{overflow-x:auto}.stage.sc svg.v{min-width:640px;max-height:none}
  .cgrid{grid-template-columns:1fr;gap:14px}
  .ctabs{flex-direction:row;overflow-x:auto}
  .greet{font-size:30px}
  .crow{flex-wrap:wrap}
  .demo{bottom:auto;top:13px;right:12px;z-index:31}
  .comp{padding:6px 12px 16px}
  .ans,.ans.ans3{grid-template-columns:1fr}
  .dkv{grid-template-columns:1fr 1fr}
  .ikq{font-size:24px}
  .ik{padding:28px 16px 70px}
  .ccard{width:170px;padding:8px 10px}.ccard span{display:none}
  .fun div{min-width:0;padding:5px 8px}.fun div b{font-size:17px}.fun .ar{display:none}
  .rrw{display:none}
  .est div{min-width:0;padding:6px 9px}.est b{font-size:17px}
  .cap3.r{display:none}
  .segc button{padding:6px 9px}
  .start{padding:14px;align-items:flex-start}
  .band{height:390px;border-radius:18px}
  .band .g3{width:100%;top:215px;bottom:34px;opacity:.95}
  .band .bt{left:20px;top:20px;right:20px}
  .band .lock{height:28px;margin-bottom:20px}
  .band .dief{display:none}
  .scol .box{margin:-26px 8px 0}
  .ksteps span:not(.on) em{display:none}
  .ksteps em{font-style:normal}
  .qcard{padding:18px 16px 14px}
  .qcard h2{font-size:21px}
  .qdone div span:first-child{width:110px}
  .ovg{display:block;height:auto}
  .ovc{padding:14px 12px 30px}
  .ovhero{height:auto}
  .ovhero .g3{position:relative;inset:auto;height:250px}
  .ovhero .stat{bottom:auto;top:10px}
  .ovhero .ltile{margin:0 10px 10px}
  .ovhero .lcol,.ovhero .leads{display:none}
  .ltile{position:static;display:block;margin:10px 10px 0;width:auto;max-width:none;padding:8px 10px}
  .ltile .lh{display:none}
  .ov2{grid-template-columns:1fr}
  .verd .vline{font-size:22px}
  .lcol{width:150px;top:56px}
  .lcol .lb{font-size:11px;padding:4px 7px}
  .ftcap{width:auto;right:12px;left:12px;top:auto;bottom:12px;flex-direction:row;overflow:hidden}
  .ftcap div:not(.on){display:none}
  .impb .lb{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
/* =================== round 5, variant 4: why it works =================== */
:root{
  --k-people:#7e3fa8;--k-people-bg:#f5eefb;--k-rec:#2b55d0;--k-rec-bg:#edf2fe;--k-device:#0e7490;--k-device-bg:#e6f4f7;--k-bar:#b4235a;--k-bar-bg:#fcedf2;
  --amb:#f5b82e;--amb-ink:#3d2800;--amb-bg:#fff7e2;--amb-line:#f0cf7a;--amb-t:#7a4a00;
  --grn:#0f7a55;--grn-bg:#e7f5ee;--grn-line:#a9dcc4;
}
/* start: calm band, no chip picture; effort explained in place */
.scol{max-width:880px;margin-top:-2vh}
.band{height:232px;background:radial-gradient(90% 150% at 85% 10%,#24357a 0%,var(--navy2) 42%,var(--navy) 85%)}
.band::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 100% 100%,rgb(61 109 240/.22),transparent 70%);pointer-events:none}
.band .bt{right:36px;top:30px}
.band .lock{margin-bottom:34px}
.subt{max-width:520px}
.scol .box{margin:-30px 22px 0}
.effort{margin:18px 22px 0}
.effort .eh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 8px;font-size:13px;color:var(--i700)}
.effort .eh b{font-weight:600;color:var(--i900)}
.eopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.eo{display:flex;flex-direction:column;gap:3px;padding:11px 12px 10px;border-radius:12px;border:1px solid rgb(0 0 0/.1);background:#fff;text-align:left;transition:border-color .12s,box-shadow .12s}
.eo:hover{border-color:#9db4f6}
.eo.on{border-color:var(--blue7);box-shadow:0 0 0 1px var(--blue7) inset}
.eo b{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;color:var(--i900)}
.eo.on b{color:var(--blue7)}
.eo .er{font-size:12px;color:var(--i800);font-variant-numeric:tabular-nums}
.eo .ew{font-size:12px;color:var(--i600);line-height:1.4;min-height:34px}
.eo .et{font-size:12px;color:var(--i800);font-weight:600;margin-top:2px}
.est-tag{font-style:normal;font-size:10.5px;font-weight:600;color:var(--amb-t);background:var(--amb-bg);border-radius:99px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.demo-note{font-size:12px;color:var(--i600);margin:10px 2px 0}

/* intake */
.sigfig{margin:18px 0 0;padding:12px 14px 10px;border:1px solid rgb(0 0 0/.08);border-radius:14px;background:#fff;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center}
.sigfig svg{display:block;width:100%;height:auto}
.sigfig figcaption{font-size:12.5px;color:var(--i700);line-height:1.5}
.sigfig figcaption b{color:var(--i900);font-weight:600;display:block;margin-bottom:2px}
.sbar{height:4px;border-radius:2px;background:var(--i150);overflow:hidden;margin:2px 0 12px}
.sbar i{display:block;height:100%;width:0;background:var(--blue7);transition:width .5s var(--ease)}
.slog li{animation:none}

.achip.m .bx{width:15px;height:15px;border-radius:4px;border:1.5px solid #9aa1b2;display:grid;place-items:center;flex:none}

.agrp h3 span{font-weight:500;color:var(--i600)}
.k-people{--kc:var(--k-people);--kbg:var(--k-people-bg)}.k-rec{--kc:var(--k-rec);--kbg:var(--k-rec-bg)}.k-device{--kc:var(--k-device);--kbg:var(--k-device-bg)}.k-bar{--kc:var(--k-bar);--kbg:var(--k-bar-bg)}

.addasm{align-items:center;margin-top:10px}

.ready .rt b{display:block;font-size:15px;font-weight:650}

/* run top bar: improve is a notification */
.impb.hot{background:var(--amb);border-color:#e0a21a;color:var(--amb-ink)}

/* overview: why it works */
.ov5{display:grid;grid-template-columns:minmax(0,1fr) 336px;height:100%;min-height:0}

.nbi .nh b{font-size:15px;font-weight:650;color:var(--amb-ink)}
.nbi .nh span.s{font-size:13px;color:var(--amb-t);flex:1;min-width:220px}

.nbi .imp{border-bottom:1px solid rgb(122 74 0/.14);padding:12px 0}

.imp .iq{font-size:14px}
.ibtn{height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;border:1px solid rgb(0 0 0/.14);background:#fff;color:var(--i900)}

.imp .ir{font-size:12px;color:var(--i600)}
.rh{padding:2px 2px 0}
.rh .rk{font-size:13px;color:var(--i600);margin:0 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rh .rk .chiplink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--blue7);text-decoration:none;padding:2px 8px;border-radius:7px;background:#eef3fe}
.rh .rk .chiplink:hover{background:#e0e9fd}
.rh .rk .chiplink .mchip{width:30px;height:22px;margin:0}
.rh h1{font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.22;letter-spacing:-.012em;margin:0;color:var(--i900);max-width:860px;text-wrap:pretty}
.rh .how{font-family:var(--serif);font-size:19px;line-height:1.5;color:var(--i800);margin:10px 0 0;max-width:860px;text-wrap:pretty}
.rh .how b{font-family:var(--sans);font-size:16px;font-weight:650;color:var(--i900);font-variant-numeric:tabular-nums;white-space:nowrap}

.card5{background:#fff;border:1px solid rgb(0 0 0/.07);border-radius:16px;padding:16px 18px 14px;box-shadow:var(--sh-hair);position:relative}

/* the annotated moment */
.mcalls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 10px}
.mcall{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 10px;border-radius:11px;background:var(--i100);transition:background .35s,opacity .35s}

.mcall.c1{--cc:#c2362b;--cc2:#a52a20}.mcall.c2{--cc:#2b55d0;--cc2:#1f44b0}.mcall.c3{--cc:#5c6276;--cc2:#3a4052}
.mom.anim .mcall{opacity:.45}
.mom.anim .mcall.on{opacity:1;background:#fff;box-shadow:inset 0 0 0 1px rgb(0 0 0/.08)}
.mom svg{display:block;width:100%;height:auto;overflow:visible}

.mom.anim .mat{opacity:.12}
.mom.anim .mat.on{opacity:1}
.msum{font-size:13.5px;color:var(--i800);margin:8px 0 0;line-height:1.5}
.msum b{font-weight:650;color:#1f44b0}
.tip{position:fixed;z-index:95;pointer-events:none;background:var(--i900);color:#fff;font-size:12px;line-height:1.45;padding:7px 10px;border-radius:9px;max-width:280px;box-shadow:0 8px 24px -10px rgb(0 0 0/.5)}
.tip b{display:block;font-weight:650}
.tip span{color:#cfd5e3}
/* why this chip wins */
.wins{display:grid;grid-template-columns:minmax(170px,1.15fr) minmax(200px,1.6fr) minmax(84px,.6fr) minmax(120px,.9fr);border:1px solid rgb(0 0 0/.07);border-radius:12px;overflow:hidden}
.wins>div{padding:9px 12px;border-top:1px solid var(--hair);font-size:13px;color:var(--i800);display:flex;align-items:center;gap:8px;min-width:0}
.wins>.wh{border-top:0;background:var(--i100);font-size:12px;font-weight:600;color:var(--i700);padding:8px 12px}
.wins>.me{background:#f1f5fe}
.wins .nm{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--i900);min-width:0}
.wins .nm small{display:block;font-weight:500;color:var(--i600);font-size:12px}
.wins .vk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.wins .vk svg{width:12px;height:12px;stroke-width:3}
.wins .vk.y{background:var(--grn)}.wins .vk.n{background:var(--missed)}
.wins .barw{flex:1;position:relative;height:10px;border-radius:5px;background:var(--i150);min-width:60px}
.wins .barw i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#9aa3b5}
.wins .me .barw i{background:var(--blue7)}
.wins .barw u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--i900);text-decoration:none}
.wins .pc{font-variant-numeric:tabular-nums;font-weight:600;width:48px;text-align:right;flex:none}
.wins .pc.no{color:var(--missed)}
.wins .num{font-variant-numeric:tabular-nums}
.wins .num.no{color:var(--missed);font-weight:600}
.wins .sz b{font-weight:650;font-variant-numeric:tabular-nums}
.wins .sz span{color:var(--i600);font-size:12px}
.wwhy{font-size:14.5px;line-height:1.5;color:var(--i900);margin:0 0 12px;padding:10px 12px;border-radius:11px;background:#f1f5fe;border-left:3px solid var(--blue7)}
.wwhy b{font-weight:650}
/* what it rests on */
.trust .tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tcol h4{font-size:13px;font-weight:650;margin:0 0 8px;color:var(--i900);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcol h4 button{font-size:12px;font-weight:600;color:var(--blue7)}
.tcol h4 button:hover{text-decoration:underline}
.kl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.kl li{font-size:12.5px;color:var(--i800);line-height:1.4;padding-left:16px;position:relative}
.kl li::before{content:"";position:absolute;left:0;top:4px;width:9px;height:9px;border-radius:3px;background:var(--kc)}
.kl li em{font-style:normal;font-size:11px;font-weight:600;color:var(--kc);display:block}
.srcl{display:flex;flex-direction:column;gap:6px}
.srcr{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px;background:var(--grn-bg);border:1px solid var(--grn-line);font-size:12.5px;line-height:1.4;color:#0b4a34;text-decoration:none}
.srcr:hover{border-color:var(--grn)}
.srcr .ck{width:20px;height:20px;border-radius:50%;background:var(--grn);color:#fff;display:grid;place-items:center}
.srcr .ck svg{width:12px;height:12px;stroke-width:3}
.srcr b{font-weight:650;color:#06382a}
.srcr span{display:block;color:#0f5a40}
.srcr.btnlike{text-align:left;width:100%}
.gapn{padding:12px 13px;border-radius:12px;background:#f4f5f8;border:1px solid var(--i150);font-size:12.5px;color:var(--i800);line-height:1.5}
.gapn b{display:block;font-size:13px;font-weight:650;color:var(--i900);margin-bottom:3px}
.deeper{margin-top:10px;padding:12px 13px;border-radius:12px;background:#fff;border:1px solid #b9cbf8;font-size:12.5px;color:var(--i800);line-height:1.5}
.deeper b{display:block;font-size:13.5px;font-weight:650;color:var(--i900);margin-bottom:3px}
.deeper .btn{height:34px;margin-top:9px;font-size:13px}
/* round by round */
.rchart svg{display:block;width:100%;height:auto}
/* rail */
.rail5{border-left:1px solid var(--hair);overflow:auto;padding:20px 20px 60px;background:#fff}
.rail5 h2{font-size:15px;font-weight:650;margin:0}
.rail5 .rleft{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:9px 11px;border-radius:10px;background:var(--i100);font-size:12.5px;color:var(--i800)}
.rail5 .rleft b{font-weight:650}
.rail5 .tl2{margin-top:12px}
.rail5 .deeper{margin-top:16px}

/* chat, in the style the team liked best */
.feed{padding:24px 20px 12px}
.fin{max-width:740px;padding:6px 0 16px;display:flex;flex-direction:column;gap:14px}
.msg{margin:0;grid-template-columns:28px minmax(0,1fr)}
.mav{width:28px;height:28px}
.who{font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .when{margin-left:0}
.stag{margin-left:0}
.mt{font-size:14px;line-height:1.55;color:var(--i900)}
.msg.lm .mhd{display:inline-flex;align-items:center;gap:8px;border-radius:7px;padding:1px 6px 1px 0;cursor:pointer;flex-wrap:wrap}
.msg.lm .mhd:hover .nmx{text-decoration:underline}
.msg.lm .mhd .cv{transition:transform .15s;color:var(--c-lead)}
.msg.lm.open .mhd .cv{transform:rotate(90deg)}
.lact{display:none;margin:8px 0 0;padding:8px 12px 9px;border-radius:10px;background:var(--c-lead-bg);border:1px solid #ddd0f5}
.msg.lm.open .lact{display:block}
.lact p{margin:0 0 4px;font-size:12px;font-weight:600;color:var(--c-lead)}
.lact ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--i800)}
.tool{margin:-6px 0 0 38px;border-left:3px solid var(--tc,#c9cfdc)}
.you{margin:0}
.you p{background:#15192b}
.comp .box{max-width:740px}

/* visual */
.lcol .lb.std{background:rgb(255 255 255/.85);color:var(--i600)}
.vlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--i700);margin:10px 2px 0}
.vlegend span{display:inline-flex;align-items:center;gap:7px}
.vlegend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.ccard .k.ao{color:#0f7a55}
.miss{margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.miss div{display:grid;grid-template-columns:26px 120px minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px;color:var(--i800);padding:8px 10px;border-radius:10px;background:#fdf1f0;border:1px solid #f3c9c5}
.miss div i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--missed);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700}
.miss div b{font-weight:600;color:#8f241b;font-variant-numeric:tabular-nums}
.miss div.fa{background:#fdf6e9;border-color:#f0d9a8}
.miss div.fa i{background:var(--falsea);border-radius:5px;transform:rotate(45deg)}
.miss div.fa i span{transform:rotate(-45deg)}
.miss div.fa b{color:var(--falsea-t)}
.ptally{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin:2px 0 10px;font-size:14px;color:var(--i800)}
.ptally .big{font-family:var(--serif);font-size:30px;color:var(--i900);line-height:1}
.ptally b{font-weight:650}
.ptally .c{color:var(--caught)}.ptally .m{color:var(--missed)}.ptally .f{color:var(--falsea-t)}
.scale2 svg{display:block;width:100%;max-width:640px;height:auto}
.dlink{font-size:12.5px;font-weight:600;color:var(--blue7)}
@media (max-width:1240px){.trust .tgrid{grid-template-columns:1fr 1fr}.trust .tgrid .tcol:last-child{grid-column:1/-1}}
@media (max-width:1100px){.ov5{grid-template-columns:minmax(0,1fr) 290px}.eopts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.ov5{display:block;height:auto}.ov5c{padding:14px 14px 30px}.rail5{border-left:0;border-top:1px solid var(--hair)}.wins{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.wins>.wh{display:none}.wins>div{border-top:0}.wins>div.c0{grid-column:1/-1;border-top:1px solid var(--hair);padding-bottom:2px}}
@media (max-width:767px){
  .band{height:auto;min-height:210px}
  .band .bt{position:relative;left:auto;top:auto;right:auto;padding:22px 20px 46px}
  .band .lock{margin-bottom:22px}
  .effort{margin:16px 4px 0}
  .eopts{grid-template-columns:1fr 1fr}
  .eo .ew{min-height:0}
  .sigfig{grid-template-columns:1fr}
  .qdn{grid-template-columns:1fr auto}
  .qdn .ql{grid-column:1/-1}
  .asmhead{flex-direction:column;gap:6px}
  .arow2{grid-template-columns:1fr}
  .mcalls{grid-template-columns:1fr}
  .trust .tgrid{grid-template-columns:1fr}
  .rh h1{font-size:22px}
  .rh .how{font-size:16.5px}
  .nbi .imp .ib2{flex-wrap:wrap}
  .miss div{grid-template-columns:26px 1fr}
  .miss div span:last-child{grid-column:2}
  .vis .vh h2{font-size:21px}
}
.stat.alert i,.livep i{animation:none}

.nbi{padding:12px 14px}
.nbi.open{padding:14px 16px 6px}
.nbi .nh .nt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:220px}
.nbi .nh .nt span.s{min-width:0}
.nbi:not(.open) .nh .nt span.s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbi .nbt{background:var(--amb);color:var(--amb-ink);border:0;font-weight:650;padding:8px 14px;border-radius:9px;flex:none}
.nbi .nbt:hover{filter:brightness(.96)}
.nbi.open .nbt{background:transparent;border:1px solid var(--amb-line)}
.tcol h4{flex-direction:column;align-items:flex-start;gap:2px}
.stage .ccard,.stage .lcol,.stage .segc,.stage .est,.stage .stat{z-index:3}.stage svg.lead,.stage svg.leads{z-index:2}

.achip.m .bx svg{opacity:0}.achip.m.on .bx svg{opacity:1}
.arow2 .at .mine,.kl .mine{display:inline-block;width:auto;margin:0 0 0 8px;vertical-align:1px}
.mom svg text,svg.pt2 text{pointer-events:none}

<script type="module">
"use strict";
const APP = { name: "ChipIn" }; APP.short = APP.name;
/* the Open Package mark and lockups, inlined from logos/a (c2-mark, c2-lockup, c2-lockup-light); not redrawn */
const LOGO_C = '<path fill="none" stroke="#3D6DF0" stroke-width="7" d="M53 12.5H23A10.5 10.5 0 0 0 12.5 23V41A10.5 10.5 0 0 0 23 51.5H53"/><rect fill="#3D6DF0" x="26" y="25" width="14" height="14" rx="1.5"/>';
const LOGO_W = c => `<g transform="translate(72 10.33) scale(0.83)" fill="${c}"><path d="M28.77 14.85A15.5 15.5 0 1 0 28.77 37.15M38.12 8V44M38.12 30A9.5 9.5 0 0 1 57.12 30V44M68.12 18V44M79.12 18V58M100.12 31A10.5 10.5 0 1 0 79.12 31A10.5 10.5 0 1 0 100.12 31M116.12 8V44M108.62 10.5H123.62M108.62 41.5H123.62M132.12 44V18M132.12 30A9.5 9.5 0 0 1 151.12 30V44" fill="none" stroke="${c}" stroke-width="5"/><rect x="65.62" y="8" width="5" height="5"/></g>`;
const LOGO = {

  let g = `<line x1="${x0 - 14}" x2="${x1 + 14}" y1="${Y(90)}" y2="${Y(90)}" stroke="#0f7a55" stroke-dasharray="5 4"/>` + T(x1 + 22, Y(90) + 4, small ? "90%" : "the line, 90%", { fs: 11.5, c: "#0b5a3f", w: 600 });
  g += T(lab, (y0 + y1) / 2 - 2, small ? "Hardest" : "Hardest unseen", { fs: 12, a: "end", c: "#141a2e", w: 600 }) + T(lab, (y0 + y1) / 2 + 14, small ? "% caught" : `${u.who}, % caught`, { fs: 11.5, a: "end", c: "#4a5062" });
  g += T(lab, by - bh / 2 - 2, "Chip size", { fs: 12, a: "end", c: "#141a2e", w: 600 }) + T(lab, by - bh / 2 + 14, "in gates", { fs: 11.5, a: "end", c: "#4a5062" });
  g += `<line x1="${x0 - 14}" x2="${x1 + 14}" y1="${by}" y2="${by}" stroke="#d5d8e0"/>`;
  const pts = vs.map(v => [X(v.r), Y(v.worst)]);
  if (pts.length > 1) g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("")}" fill="none" stroke="#2b55d0" stroke-width="2"/>`;
  const bw = Math.min(46, (x1 - x0) / Math.max(R, 2) * 0.45);
  for (let r = 1; r <= R; r++) {
    const v = vs.find(x => x.r === r), x = X(r), best = st.best && st.best.r === r;
    if (v) {
      const h = Math.max(3, bh * v.gates / max), ok = v.worst >= 90;
      g += `<circle cx="${x}" cy="${Y(v.worst)}" r="${best ? 6 : 4.5}" fill="${ok ? "#2b55d0" : "#fff"}" stroke="#2b55d0" stroke-width="2"/>` + T(x, ok ? Y(v.worst) - 11 : Y(v.worst) + 20, v.worst.toFixed(1) + "%", { fs: 11.5, a: "middle", c: ok ? "#141a2e" : "#a52a20", w: 600, h: 1 });
      g += `<rect x="${(x - bw / 2).toFixed(1)}" y="${(by - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${best ? "#2b55d0" : "#b9c3d6"}"/>` + T(x, by - h - 6, fmt(v.gates), { fs: 11.5, a: "middle", c: best ? "#141a2e" : "#4a5062", w: best ? 700 : 500 });
    } else {
      const running = st.c && st.c.round === r;
      g += `<rect x="${(x - bw / 2).toFixed(1)}" y="${by - bh * 0.5}" width="${bw.toFixed(1)}" height="${bh * 0.5}" rx="3" fill="none" stroke="#a3a8b8" stroke-dasharray="3 3"/>` + T(x, by - bh * 0.5 - 6, running ? "running" : "to come", { fs: 11, a: "middle", c: "#4a5062" });
    }
    g += T(x, by + 18, `Round ${r}`, { fs: 11.5, a: "middle", c: best ? "#141a2e" : "#4a5062", w: best ? 600 : 400 });
  }
  const f = vs[0], b = st.best;
  const line = vs.length > 1 ? `From ${fmt(f.gates)} gates in round 1 to <b>${fmt(b.gates)}</b> in round ${b.r}, ${(f.gates / b.gates).toFixed(1)} times smaller, while the hardest ${u.who} went from ${f.worst.toFixed(1)}% to ${b.worst.toFixed(1)}%.` : `Round 1's best chip: <b>${fmt(f.gates)}</b> gates. Each later round tries to shrink it without dropping below the line.`;
  return `${head}<p class="sd">${line}</p><svg viewBox="0 0 ${W} 214" width="${W}" style="max-width:100%;height:auto;display:block" role="img" aria-label="Each round's best chip: hardest patient and size">${g}</svg>`;
}

/* what the result rests on: assumptions by kind, sources in green, the data gap, and going deeper */

  const d = run.data, u = UC[run.uc];

  return `<div class="gapn"><b>Checked on your own ${u.whoP}</b>${d.checkN} of your ${u.whoP} were held back and never used in fine-tuning; every number above is on them. More of your recordings would make the check stronger.</div>`;
}

/* the run's own work list, live */

    const state = stateOf(s), isCur = state === "cur";
    const row = `<li class="s-${state} k-${s.key}"><i class="nd"></i><span class="nm2">${NAME[s.key]}</span><span class="rt"${at(s)}>${state === "pend" ? "" : clock(s.start)}</span>${state === "done" ? `<span class="sub">${esc(doneText(st, s))}</span>` : isCur ? `<span class="sub" id="liveOut">${esc(liveText(st))}</span>` : ""}</li>`;
    if (s.key === "report") {

        const tag = run.notes.filter(n => n.round === r).map(n => `<span class="note">${n.type === "asm" ? "Re-run after your change" : "Your note: " + esc(noteLabel(n, u))}</span>`).join("");
        let extra = "";

        else if (rstate === "cur") extra = `<span class="sub" id="liveOut">${esc(liveText(st))}</span><div class="segs">${rs.map(x => { const p = x.end <= st.t ? 1 : x.start <= st.t ? (st.t - x.start) / (x.end - x.start) : 0; return `<span class="c-${x.key}${x === st.c ? " on" : ""}"><i><b style="width:${(p * 100).toFixed(1)}%"${x === st.c ? ' id="liveBar"' : ""}></b></i>${NAME[x.key]}</span>`; }).join("")}</div>${tag ? `<span class="sub">${tag}</span>` : ""}`;
        else if (tag) extra = `<span class="sub">${tag}</span>`;
        rows.push(`<li class="s-${rstate} k-round"><i class="nd"></i><span class="nm2">Round ${r}<span class="stg" aria-hidden="true">${["propose", "finetune", "compile", "verify"].map(k => `<i style="background:${STAGE_C[k]}"></i>`).join("")}</span></span><span class="rt"${at(first)}>${rstate === "done" ? fmt(res.gates) + " gates" : rstate === "cur" ? NAME[st.c.key] : ""}</span>${extra}</li>`);

}
function leftTxt(run, st) { return estTxt((1 - st.t / st.T) * estMins(run.preset, run.compute)); }
function rail5HTML(run, st) {

function goDeeper(run) {

/* ----- chat: the scientists at work; the lead scientist's activity unfolds on click ----- */
function evKey(e) { return e.id + (e.act ? "t" : "") + (e.actDone ? "d" : "") + (e.tool && e.done ? "d" : ""); }
function evHTML(ev) {
  if (ev.you) return `<div class="you" data-id="${ev.id}"><p>${esc(ev.you)}</p></div>`;
  if (ev.tool) { const R = ROLE[ev.who] || ROLE.model; return `<details class="tool" data-id="${ev.id}" style="--tc:${R.c}"><summary>${ev.done ? I("check", "s14 tok") : '<span class="tsp"></span>'}<span>${esc(ev.tool.t)}</span>${ev.tool.tag ? `<span class="tk${ev.tool.pp ? " pp" : ""}">${ev.tool.tag}</span>` : ""}${I("right", "s12 cv")}</summary><ul>${ev.tool.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>`; }
  const R = ROLE[ev.who];
  const tag = ev.stage ? `<span class="stag" style="color:${STAGE_C[ev.stage]};background:${STAGE_BG[ev.stage]}">${NAME[ev.stage]}${ev.round ? ", round " + ev.round : ""}</span>` : "";
  if (ev.who === "lead" && ev.act) return `<div class="msg lm" data-id="${ev.id}"><span class="mav" style="background:${R.bg};color:${R.c}">${I(R.i)}</span><div><button class="who mhd" aria-expanded="false" title="Show what the lead scientist is doing"><span class="nmx" style="color:${R.c}">${R.n}</span>${tag}<span class="when">${clock(ev.at)}</span>${I("right", "s12 cv")}</button><div class="mt">${esc(ev.text)}</div>
    <div class="lact"><p>${ev.actDone ? "What I did" : "What I am doing now"}: ${esc(ev.act.t)}</p><ul>${ev.act.l.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div></div>`;
  return `<div class="msg" data-id="${ev.id}"><span class="mav" style="background:${R.bg};color:${R.c}">${I(R.i)}</span><div><div class="who"><span style="color:${R.c}">${R.n}</span>${tag}<span class="when">${clock(ev.at)}</span></div><div class="mt">${esc(ev.text)}</div></div></div>`;
}
function renderChat(run, force) {
  const st = snap(run), evs = chatEvents(st);
  if (force) {
    const fin = st.done;
    $("#body").innerHTML = `<div class="chat"><a class="ctile" id="ctile" href="#/run/${run.id}/visual/chip" title="Open the chip"></a><div class="feed" id="feed"><div class="fin" id="fin"></div></div>
      <div class="comp"><div class="cstat" id="cstat"></div><div class="box"><textarea id="ctext" rows="1" data-voice data-voice-anchor="#csend" placeholder="${fin ? "This run has finished" : "Message the scientists"}" aria-label="Message the scientists"></textarea><button class="send" id="csend" aria-label="Send">${I("up")}</button></div></div></div>`;
    cur.rendered = new Map();

    evs.forEach(e => cur.rendered.set(e.id, evKey(e)));
    const feed = $("#feed"); feed.scrollTop = feed.scrollHeight;
    $("#fin").onclick = e => { const h = e.target.closest(".mhd"); if (h) { const m = h.closest(".msg"); m.classList.toggle("open"); h.setAttribute("aria-expanded", m.classList.contains("open")); } };
    const ta = $("#ctext"), sb = $("#csend");
    const sync = () => { sb.classList.toggle("ready", !!ta.value.trim()); ta.style.height = "auto"; ta.style.height = Math.min(200, ta.scrollHeight) + "px"; };
    ta.addEventListener("input", sync);
    const send = () => { const v = ta.value.trim(); if (!v) return; redirect(run, v); ta.value = ""; sync(); renderChat(run, false); const f = $("#feed"); f.scrollTop = f.scrollHeight; };
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

    const feed = $("#feed"), atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60, typ = $("#typing");

      if (old) { const wasOpen = old.open || old.classList.contains("open"); old.outerHTML = evHTML(e); const n = $(`[data-id="${e.id}"]`, feed); if (n.tagName === "DETAILS") n.open = wasOpen; else if (wasOpen) { n.classList.add("open"); n.querySelector(".mhd")?.setAttribute("aria-expanded", "true"); } n.style.animation = "none"; }
      else {
        const anchor = /^n\d+r$/.test(e.id) ? $(`[data-id="${e.id.slice(0, -1)}"]`, feed) : null;
        if (anchor) anchor.insertAdjacentHTML("afterend", evHTML(e)); else typ.insertAdjacentHTML("beforebegin", evHTML(e));

  rr.innerHTML = done.map(r => { const x = roundResult(run, r), sz = Math.round(10 + 22 * Math.sqrt(x.gates / 3920)); return `<div class="${S.best === x.gates ? "best" : ""}"><i style="width:${sz}px;height:${sz}px"></i><span><b>Round ${r}</b>${fmt(x.gates)} gates</span></div>`; }).join("");
  const per = run.cands / FT_N, tag = S.mode === "replay" ? `Replay, round ${S.r}` : S.mode === "loop" ? `Round ${S.r}, on a loop` : S.mode === "preview" ? `Preview of round ${S.r}` : `Live, round ${S.r}`;
  $("#rpl").innerHTML = `<em>${tag}${per > 1 ? `. Each tile is ${per} models` : ""}</em>${S.mode === "replay" ? '<button class="qbtn" data-live>Back to live</button>' : ""}`;
  const f = $("#vfoot"); if (f) f.textContent = S.mode === "replay" ? "Replaying every round from the start." : S.mode === "loop" ? "The run is not fine-tuning right now, so its latest round plays on a loop." : S.mode === "preview" ? "Round 1 has not started yet; this preview shows how it will run." : `${APP.name} is working on round ${S.r} now.`;
}
function openFineTune(run) {
  const u = UC[run.uc];
  openModal(`<h3>Fine-tune this chip on your own recordings</h3>
    <p>${APP.name} keeps this chip's design, re-fits its weights to your ${u.whoP}' recordings, then compiles and checks it again bit for bit. The chip stays the same size.</p>
    <button class="drop" id="ftpick" style="width:100%;margin:6px 0 12px">${I("clip", "s20")}<b>Choose recordings</b>with the ${u.events} marked</button>
    <div class="files" id="ftfiles"></div>
    <div class="acts" style="margin-top:14px"><button class="btn p" id="ftgo" disabled>Start fine-tuning</button><button class="btn s" data-close>Cancel</button></div>`, (e, bg) => {
    if (e.target.closest("#ftpick")) { $("#ftfiles", bg).innerHTML = `<div class="file">${I("file", "s16")}<span>my-unit-recordings.zip</span><span class="sz">1.2 GB</span></div>`; $("#ftgo", bg).disabled = false; }
    if (e.target.closest("#ftgo")) { closeModal(); toast("Fine-tuning on your data is not part of this demo"); }
  });
}

/* ---------- signal: the annotated moment, played through with a moving read head ---------- */
function startMoment(run) {
  const host = $("#vstage"); if (!host) return;
  const L2 = { raf: 0, t0: now(), paused: false }; sig2d = L2;
  const draw = () => {
    const st = snap(run), W = Math.max(340, host.clientWidth - 34);
    host.innerHTML = momentHTML(run, st, { W, anim: true });
    bindTips(host);
    L2.svg = host.querySelector("svg"); L2.mats = [...host.querySelectorAll(".mat")]; L2.calls = [...host.querySelectorAll(".mcall")];
    L2.veil = host.querySelector("#veil"); L2.phd = host.querySelector("#phd");
  };
  L2.redraw = draw; draw();
  const CYC = 16, SWEEP = 12;
  const frame = () => {
    L2.raf = requestAnimationFrame(frame);
    if (sig2d !== L2 || !host.isConnected) { cancelAnimationFrame(L2.raf); return; }
    if (L2.paused || !L2.svg) return;
    const svg = L2.svg, ph = ((now() - L2.t0) / 1000) % CYC, f = RM ? 1 : Math.min(1, ph / SWEEP);
    const x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, ta = +svg.dataset.ta, tb = +svg.dataset.tb, x = x0 + (x1 - x0) * f, tNow = ta + (tb - ta) * f;
    L2.veil.setAttribute("x", x.toFixed(1)); L2.veil.setAttribute("width", Math.max(0, x1 - x).toFixed(1));
    L2.phd.setAttribute("x1", x.toFixed(1)); L2.phd.setAttribute("x2", x.toFixed(1)); L2.phd.setAttribute("opacity", f < 1 ? 1 : 0);
    for (const el of L2.mats) el.classList.toggle("on", +el.dataset.at <= tNow + 1e-6);
    for (const el of L2.calls) el.classList.toggle("on", el.dataset.at !== "" && +el.dataset.at <= tNow + 1e-6);
  };
  L2.raf = requestAnimationFrame(frame);
}

function alarmLine(run) { const a = run.uc === "nb" ? run.data.asm.find(x => /alarm line at \d+%/i.test(x.v || x.q)) : null, m = a && (a.v || a.q).match(/alarm line at (\d+)%/i); return m ? +m[1] : 55; }
function usedList(st) { const n = st.best ? st.best.ch : st.u.total; return st.u.key === "brain" ? EEG_ORDER.slice(0, n) : st.u.key === "nb" ? NB_PATHS.slice(0, n) : Array.from({ length: n }, (_, i) => `Channel ${i + 1}`); }

/* ---------- 2D visuals ---------- */
const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 12.5}" fill="${o.c || "#3a4052"}" ${o.a ? `text-anchor="${o.a}"` : ""} ${o.w ? `font-weight="${o.w}"` : ""} ${o.f ? `font-family="${o.f}"` : ""}${o.h ? ' paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round"' : ""}>${s}</text>`;
const SERIF = "'Iowan Old Style','Source Serif 4',Georgia,serif";
function patientVals(run, res, N) {
  const R = rng(run.seed * 13 + res.r * 7), ord = [...Array(N).keys()];
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [ord[i], ord[j]] = [ord[j], ord[i]]; }
  const v = Array(N).fill(0), fails = N - res.meets;
  v[ord[0]] = res.worst;
  for (let k = 1; k < fails; k++) v[ord[k]] = Math.max(res.worst + 0.1, 89.9 - R() * (89.9 - res.worst));
  for (let k = Math.max(1, fails); k < N; k++) v[ord[k]] = Math.max(90.2, res.worst + 0.3) + R() * 6.5;
  return { v: v.map(x => Math.round(x * 10) / 10), worst: ord[0] };
}
// why a miss happened, in plain words; the same event always gets the same reason
const MISS_WHY = {
  brain: ["Started under chewing artefact, which the chip is taught to ignore.", "Began on the right side, far from the electrodes the chip reads.", "Low and slow at the start: flagged only after the 10-second limit, so it counts as missed."],
  nb: ["A fast drop: it crossed the line too quickly to warn a minute ahead.", "The patch lifted during handling, so the light signal was lost.", "Came during a nappy change, which the chip treats as handling."],
  gen: ["A short event, over before the chip's windows agreed.", "Hidden under movement noise.", "Started in a channel the chip does not read."]
};
const FA_WHY = {
  brain: ["Walking made a regular rhythm that looked like one.", "A loose electrode crackled in a steady pattern.", "Long chewing during a meal."],
  nb: ["A slow dip that recovered on its own.", "The patch shifted when the baby was turned.", "A short dip during a feed."],
  gen: ["Noise from a loose contact.", "Movement that looked like the event.", "A brief dropout in one channel."]
};
const hmTxt = s => `${Math.floor(s / 3600)} h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")} min`;
// one patient's whole recording: each event numbered, a tick if caught, a cross if missed; false alarms as diamonds
function timeline2SVG(run, st, P, W) {
  const u = st.u, x0 = 10, x1 = W - 10, X = t => x0 + (x1 - x0) * t / P.H, y0 = 50, h = 42;
  const R = rng(run.seed * 29 + 1);
  let env = "";
  for (let i = 0; i < 200; i++) { const t = (i + 0.5) / 200 * P.H, near = P.ev.some(e => t >= e.t - 200 && t <= e.t + e.len + 200), a = (0.25 + 0.35 * R()) * (near ? 1.9 : 1), x = X(t); env += `M${x.toFixed(1)} ${(y0 + h / 2 - a * 12).toFixed(1)}V${(y0 + h / 2 + a * 12).toFixed(1)}`; }
  let g = `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${h}" rx="6" fill="#f1f3f7"/><path d="${env}" stroke="#a9b0bf" stroke-width="1.6"/>`;
  P.ev.forEach((e, i) => {
    const xa = X(e.t), w = Math.max(4, X(e.t + e.len) - xa), cx = xa + w / 2;
    g += `<rect class="tev" data-t="${e.t}" x="${xa.toFixed(1)}" y="${y0}" width="${w.toFixed(1)}" height="${h}" fill="#c2362b" fill-opacity=".2" stroke="#c2362b" stroke-opacity=".5" data-tip="${esc(u.event.charAt(0).toUpperCase() + u.event.slice(1))} ${i + 1}, at ${hmTxt(e.t)}" data-sub="${P.scored ? (e.caught ? `Caught, ${e.delay} s ${run.uc === "nb" ? "before the alarm line" : "after it began"}.` : "Missed: " + e.why) : "Marked in the recording; scored once round 1 is checked."}"/>`;
    if (P.scored) {
      const c = e.caught ? "#0f7a55" : "#c2362b";
      g += `<g class="tev" data-t="${e.t}" style="pointer-events:none"><line x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="32" y2="${y0}" stroke="${c}" stroke-width="1.2"/><circle cx="${cx.toFixed(1)}" cy="22" r="10" fill="${c}"/>${e.caught ? `<path d="M${cx - 4.5} 22.2l3 3 6-6.2" stroke="#fff" stroke-width="2" fill="none"/>` : `<path d="M${cx - 3.8} 18.2l7.6 7.6M${cx + 3.8} 18.2l-7.6 7.6" stroke="#fff" stroke-width="2"/>`}</g>`;
    }
    g += T(cx, y0 + h + 15, String(i + 1), { fs: 11.5, a: "middle", c: P.scored && !e.caught ? "#a52a20" : "#3a4052", w: P.scored && !e.caught ? 700 : 500 });
  });
  P.fa.forEach((t, j) => { const x = X(t); g += `<g class="tev" data-t="${t}"><line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="32" y2="${y0 + h}" stroke="#b7791f" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M${x} 13l9 9-9 9-9-9z" fill="#b7791f" data-tip="False alarm ${j + 1}, at ${hmTxt(t)}" data-sub="${esc(FA_WHY[run.uc][j % 3])}"/></g>`; });
  const step = u.hours > 12 ? 4 : 2;
  for (let hh = 0; hh <= u.hours; hh += step) g += `<line x1="${X(hh * 3600)}" x2="${X(hh * 3600)}" y1="${y0 + h + 22}" y2="${y0 + h + 27}" stroke="#8a90a0"/>` + T(X(hh * 3600), y0 + h + 40, `${hh} h`, { fs: 11.5, a: hh === 0 ? "start" : hh === u.hours ? "end" : "middle", c: "#4a5062" });
  g += `<line id="tlhead" x1="${x0}" x2="${x0}" y1="6" y2="${y0 + h + 4}" stroke="#141a2e" stroke-width="1.6"/>`;
  return `<svg class="pt2" viewBox="0 0 ${W} ${y0 + h + 48}" data-h="${P.H}" data-x0="${x0}" data-x1="${x1}" role="img" aria-label="One unseen ${u.who}'s recording over ${u.hours} hours">${g}</svg>`;
}
// the Patients visual: one patient's whole recording with a moving read head, then every unseen patient as a tile
function startPatients(run) {
  const loopS = { raf: 0, t0: now() }; sig2d = loopS;
  drawPatients(run, snap(run));
  const frame = () => {
    loopS.raf = requestAnimationFrame(frame);
    if (sig2d !== loopS || !$("#pvis")) { cancelAnimationFrame(loopS.raf); return; }
    const svg = $("#pvis svg.pt2"), head = $("#tlhead"); if (!svg || !head) return;
    const x0 = +svg.dataset.x0, x1 = +svg.dataset.x1, f = RM ? 1 : ((now() - loopS.t0) / 1000 % 16) / 16, x = x0 + (x1 - x0) * f, H = +svg.dataset.h;
    head.setAttribute("x1", x.toFixed(1)); head.setAttribute("x2", x.toFixed(1));
    svg.querySelectorAll("g.tev").forEach(el => { el.style.opacity = +el.dataset.t / H <= f ? 1 : 0.2; });
    const c = $("#tlclock"); if (c) { const t2 = `${hmTxt(f * H)} into the recording`; if (c.textContent !== t2) c.textContent = t2; }
  };
  loopS.raf = requestAnimationFrame(frame);
}
function drawPatients(run, st) {
  const host = $("#pvis"); if (!host) return;
  const u = st.u, N = st.N, res = st.best;
  const vals = res ? patientVals(run, res, N) : null, sel = run.ui.pt != null && run.ui.pt < N ? run.ui.pt : vals ? vals.worst : 0;
  const P = patientEvents(run, res, sel), W = Math.max(600, Math.min(1120, (host.clientWidth || 1000) - 36));
  P.ev.forEach((e, i) => { e.why = MISS_WHY[run.uc][(i + run.seed) % 3]; }); P.fa = [...P.fa].sort((a, b) => a - b);
  const c = P.ev.filter(e => e.caught).length, m = P.ev.length - c;
  const ok = vals ? vals.v.filter(x => x >= 90).length : 0;
  const where = run.data.mode === "public" && run.data.check !== run.data.train ? ` in ${DS[run.data.check].n}` : run.data.mode === "sim" ? " in the simulated set" : "";
  const tally = P.scored ? `<div class="ptally"><span class="big">${c} caught, ${m} missed</span><span>of the <b>${P.ev.length} ${u.events}</b> this recording marks;</span><span class="f"><b>${P.fa.length}</b> false alarm${P.fa.length === 1 ? "" : "s"} in ${u.hours} hours</span></div>` : `<div class="ptally"><span class="big">${P.ev.length} ${u.events}</span><span>marked in this recording. Each is scored once round 1's chip is checked.</span></div>`;
  const misses = P.scored ? P.ev.map((e, i) => [e, i]).filter(([e]) => !e.caught).map(([e, i]) => `<div><i>${i + 1}</i><b>Missed at ${hmTxt(e.t)}</b><span>${esc(e.why)}</span></div>`).join("") + P.fa.map((t, j) => `<div class="fa"><i><span>!</span></i><b>False alarm at ${hmTxt(t)}</b><span>${esc(FA_WHY[run.uc][j % 3])}</span></div>`).join("") : "";
  host.innerHTML = `<section class="card5" style="margin-bottom:14px"><h3>${u.Who} ${sel + 1}${vals && sel === vals.worst ? `, the hardest of the ${N}` : ""}<span class="tg">Unseen ${u.who}</span><span id="tlclock" style="margin-left:auto;font-size:12px;font-weight:500;color:#4a5062"></span></h3>
      <p class="sd">${u.hours} hours of recording the chip never trained on. Each red band is ${/^[aeiou]/i.test(u.event) ? "an" : "a"} ${u.event} the recording marks, numbered in order. Above it, a green tick if the chip caught it, a red cross if it missed it. Amber diamonds are false alarms. Hover any mark for the detail.</p>
      ${tally}<div id="tlwrap">${timeline2SVG(run, st, P, W)}</div>
      ${misses ? `<div class="miss">${misses}</div>` : P.scored ? `<p class="sd" style="margin-top:10px">Every ${u.event} in this recording was caught.</p>` : ""}</section>
    ${vals ? `<div style="display:flex;align-items:baseline;gap:12px;margin:2px 2px 12px;flex-wrap:wrap"><span style="font-family:${SERIF};font-size:26px">${ok} of ${N}</span><span style="font-size:13.5px;color:#3a4052">unseen ${u.whoP} meet the clinical line (${u.lineShort.split(" on")[0]})${where}. Pick one to see their recording.</span></div>
    <div class="ptiles">${vals.v.map((x, i) => `<button class="pt ${x >= 90 ? "ok" : "no"}${i === vals.worst ? " worst" : ""}" data-pt="${i}" style="text-align:left${i === sel ? ";outline:2px solid #2b55d0;outline-offset:1px" : ""}"><div class="pn">${u.Who} ${i + 1}</div><div class="pv">${pct(x)}</div><div class="ps"><i></i>${x >= 90 ? "Meets the line" : "Below the line"}</div>${i === vals.worst ? `<div class="wl">Hardest ${u.who}</div>` : ""}</button>`).join("")}</div>` : ""}`;
  bindTips($("#tlwrap"));
  host.onclick = e => { const b = e.target.closest("[data-pt]"); if (b) { run.ui.pt = +b.dataset.pt; drawPatients(run, snap(run)); } };
}
// flat fallbacks when WebGL is missing
function visChipSVG(run, st) {
  const u = st.u, b = st.best;
  return `<svg class="v" viewBox="0 0 960 300" role="img" aria-label="Chip diagram">
    <rect x="30" y="40" width="220" height="80" rx="12" fill="#fff" stroke="#a3a3b5"/>${T(50, 72, u.s1.k + ": " + u.s1.n, { w: 600, c: "#141a2e" })}${T(50, 96, "feeds the chip")}
    <rect x="30" y="180" width="220" height="80" rx="12" fill="#fff" stroke="#a3a3b5"/>${T(50, 212, u.s2.k + ": " + u.s2.n, { w: 600, c: "#141a2e" })}${T(50, 236, "feeds the chip")}
    <rect x="370" y="60" width="220" height="180" rx="16" fill="#141a2e"/>${T(480, 140, "AI model", { a: "middle", c: "#fff", w: 600, fs: 15 })}${T(480, 166, b ? fmt(b.gates) + " gates" : "after round 1", { a: "middle", c: "#e2e8f0" })}
    <path d="M250 80 L370 120 M250 220 L370 180 M590 150 L700 150" stroke="#4a5062" stroke-width="1.6"/>
    <rect x="700" y="110" width="230" height="80" rx="12" fill="#fff" stroke="#a3a3b5"/>${T(720, 142, "Answer: " + u.pred[0], { w: 600, c: "#141a2e" })}</svg>`;
}
function visDeviceSVG(run, st) { const u = st.u; return `<svg class="v" viewBox="0 0 600 260" role="img" aria-label="Device"><circle cx="300" cy="130" r="90" fill="#eceef2" stroke="#a3a3b5"/>${u.key === "brain" ? `<ellipse cx="300" cy="110" rx="96" ry="18" fill="none" stroke="#243b4f" stroke-width="10"/><rect x="380" y="100" width="44" height="28" rx="6" fill="#fff" stroke="#3a4052"/>` : `<rect x="250" y="70" width="100" height="30" rx="14" fill="#e8eef6" stroke="#3a4052"/>`}${T(300, 250, u.device, { a: "middle", w: 600 })}</svg>`; }
function visSensorsSVG(run, st) { const used = usedList(st); return `<p style="font-size:14px">${used.length} of ${st.u.total} ${st.u.unit} read: ${esc(used.map(x => Array.isArray(x) ? x.join("-") : x).join(", "))}</p>`; }

/* ---------------- render + tick ---------------- */
function render() {
  route = parse();
  if (location.hash === "#/new" && route.page !== "new") { history.replaceState(null, "", "#/"); }
  document.title = APP.short + (route.page === "run" ? " · " + findRun(route.id).title : "");
  renderSidebar(true);
  if (route.page === "run") { renderRun(); return; }
  teardown();
  if (route.page === "configure") renderConfigure();
  else if (route.page === "new") renderIntake();
  else renderStart();
}
let tickErr = 0;
function tick() { try { tick0(); } catch (e) { if (!tickErr++) console.warn("tick", e); } }
function tick0() {
  for (const r of runs) if (r.playing && elapsed(r) >= total(r)) { r.base = total(r); r.playing = false; }
  renderSidebar(false);
  if (route.page !== "run") return;
  const run = findRun(route.id); if (!run || !$("#clk")) return;
  updTop(run, false);
  if (route.view === "chat" && $("#feed")) {
    const ta = $("#ctext");
    if (ta && snap(run).done && ta.placeholder !== "This run has finished") ta.placeholder = "This run has finished";
    renderChat(run, false);
  } else renderView(run, false);
}
function layout() { const w = innerWidth; document.body.classList.toggle("col", w < 1024 && w >= 768); }
let lastW = innerWidth;
window.addEventListener("resize", () => { if ((lastW >= 1024) !== (innerWidth >= 1024) || (lastW >= 768) !== (innerWidth >= 768)) { layout(); renderSidebar(true); } lastW = innerWidth; });
layout(); renderMobileHead(); render();
setInterval(tick, 250);
</script>
