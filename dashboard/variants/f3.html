<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI scientist</title>
<style>
:root{
  --wash:#f7f7f5;--card:#fff;--glass:rgb(255 253 250/.78);--glass-strong:rgb(255 253 250/.97);
  --i900:#16162a;--i800:#2f2f40;--i700:#3d3d4f;--i600:#47475a;--i550:#4f4f63;--i500:#55556a;--i400:#5f5f72;--i300:#a9a9b8;--i200:#d4d4dc;--i150:#e6e6eb;--i100:#f1f1f4;
  --blue:#3b82f6;--blue6:#2563eb;--blue7:#1d4ed8;--blue8:#1e40af;--violet:#6d28d9;--teal:#0f766e;
  --ok:#10b981;--ok-t:#047857;--ok-bg:#ecfdf5;--bad:#ef4444;--bad-t:#b91c1c;--bad-bg:#fef2f2;--amb-t:#92400e;--amb-bg:#fffbeb;
  --cand:#c2410c;
  --hair:rgb(0 0 0/.08);--hair2:rgb(0 0 0/.1);
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Source Serif 4","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--wash);color:var(--i900);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue6);outline-offset:2px}
a{color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.spin{width:12px;height:12px;border-radius:50%;border:1.6px solid rgb(37 99 235/.22);border-top-color:var(--blue6);animation:rot .9s linear infinite;flex:none;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ring{from{transform:scale(1);opacity:.75}to{transform:scale(2.1);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-28}}

#app{display:flex;height:100vh;height:100dvh}
/* ---------- sidebar ---------- */
#sb{width:252px;flex:none;display:flex;flex-direction:column;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid rgb(0 0 0/.06);transition:width .15s var(--ease);z-index:20;overflow:hidden}
.sb-head{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid rgb(0 0 0/.05)}
.logo{width:28px;height:28px;border-radius:7px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#60a5fa,#6366f1 60%,#8b5cf6);box-shadow:inset 0 0 0 1px rgb(255 255 255/.25)}
.logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8}
.word{font-weight:800;font-size:14px;letter-spacing:-.02em;white-space:nowrap}
.iconbtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550);flex:none;transition:background .1s}
.iconbtn:hover{background:rgb(0 0 0/.05)}
.sb-head .iconbtn{margin-left:auto}
.nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:none}
.nav a{height:36px;border-radius:7px;display:flex;align-items:center;gap:10px;padding:0 10px;color:var(--i550);font-size:12.5px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .1s}
.nav a svg{width:18px;height:18px}
.nav a:hover{background:rgb(0 0 0/.03)}
.nav a.on{background:rgb(37 99 235/.07);color:var(--i900)}
.cnt{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--blue7);background:rgb(37 99 235/.08);border-radius:99px;padding:1px 7px}
.sb-div{height:1px;background:rgb(0 0 0/.06);margin:0 12px;flex:none}
.runs{flex:1;overflow:auto;padding:10px 8px}
.cap{font-size:11px;font-weight:600;color:var(--i550);padding:4px 10px 6px;display:flex;align-items:center;white-space:nowrap}
.row{position:relative;height:28px;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--i700);text-decoration:none;white-space:nowrap;transition:background .1s}
.row:hover{background:rgb(0 0 0/.03)}
.row.on{background:rgb(37 99 235/.07);color:var(--i900)}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.row .g svg{width:12px;height:12px}
.row .more{position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:5px;display:none;place-items:center;color:var(--i550);background:var(--glass-strong)}
.row:hover .more,.row .more[aria-expanded=true]{display:grid}
.row .more:hover{background:var(--i100)}
.tbar{height:9px;border-radius:4px;background:var(--i150);flex:1;animation:pulse 1.2s infinite}
.row input{flex:1;min-width:0;border:0;border-radius:4px;padding:2px 4px;box-shadow:0 0 0 2px rgb(59 130 246/.5);font-size:12.5px;background:#fff}
.acct{flex:none;border-top:1px solid rgb(0 0 0/.06);padding:8px}
.acct button{width:100%;display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;text-align:left}
.acct button:hover{background:rgb(0 0 0/.03)}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
.av svg{width:15px;height:15px}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2;white-space:nowrap}
.acct .em{font-size:11px;color:var(--i550);white-space:nowrap}
body.col #sb{width:52px}
body.col #sb .word,body.col #sb .nav a span,body.col #sb .cnt,body.col #sb .runs,body.col #sb .acct .who,body.col #sb .sb-div{display:none}
body.col #sb .sb-head{padding:0 12px;justify-content:center}
body.col #sb .sb-head .logo{display:none}
body.col #sb .sb-head .iconbtn{margin:0}
body.col #sb .nav a{justify-content:center;padding:0}
body.col #sb .acct{margin-top:auto}
body.col #sb .acct button{justify-content:center}
#mhead{display:none}
#scrim{display:none}

/* ---------- main ---------- */
#main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.demo{position:fixed;right:12px;bottom:8px;font-size:11px;font-weight:500;color:var(--i600);background:rgb(255 255 255/.92);border:1px solid var(--hair);border-radius:99px;padding:2px 9px;pointer-events:none;z-index:5}

/* start page */
.start{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 64px}
.start-col{width:100%;max-width:672px}
.greet{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:500;text-align:center;margin:0;letter-spacing:-.01em}
.sub{text-align:center;color:var(--i550);font-size:16px;margin:12px 0 32px}
.box{background:var(--glass-strong);border:1px solid var(--hair);border-radius:24px;box-shadow:0 1px 3px rgb(0 0 0/.04);padding:20px 20px 12px;transition:box-shadow .12s}
.box:focus-within{box-shadow:0 2px 14px rgb(0 0 0/.08)}
.box textarea{display:block;width:100%;border:0;outline:none;resize:none;background:transparent;font-size:14px;line-height:1.5;min-height:24px;max-height:280px;padding:0}
.box textarea::placeholder{color:var(--i500)}
.box textarea:focus-visible{outline:none}
.ctl{display:flex;align-items:center;gap:6px;margin-top:12px;min-height:36px;flex-wrap:wrap}
@media(max-width:480px){.ctl:has(.cv-mic){gap:4px}.ctl:has(.cv-mic) .pill{padding:0 7px}}
.pill{height:26px;border-radius:99px;border:1px solid var(--hair2);background:#fff;display:inline-flex;align-items:center;gap:5px;padding:0 10px;font-size:12px;font-weight:500;color:var(--i800);white-space:nowrap;transition:background .1s}
.pill:hover{background:var(--i100)}
.pill svg{width:13px;height:13px}
.pill .chev{width:12px;height:12px;opacity:.7}
.pill.ic{width:26px;padding:0;justify-content:center}
.send{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--i150);color:var(--i400);transition:all .12s;flex:none}
.send.ready{background:var(--i900);color:#fff;box-shadow:0 1px 6px rgb(0 0 0/.16)}
.send svg{width:17px;height:17px}

/* intake */
.intake{flex:1;overflow:auto;padding:40px 24px 72px;display:flex;justify-content:center}
.ik{width:100%;max-width:680px}
.ik .me{margin:0 0 26px auto}
.ikstep{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--i550);margin-bottom:10px}
.ikdots{display:flex;gap:5px}
.ikdots i{width:22px;height:4px;border-radius:2px;background:var(--i150)}
.ikdots i.on{background:var(--blue7)}
.ikq{font-family:var(--serif);font-size:30px;line-height:1.18;font-weight:500;letter-spacing:-.01em;margin:0 0 8px}
.ikp{font-size:14.5px;color:var(--i700);margin:0 0 22px;max-width:600px;line-height:1.55}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:18px 18px;border-radius:16px;background:#fff;border:1px solid var(--hair2);box-shadow:0 1px 2px rgb(0 0 0/.04);transition:border-color .12s,box-shadow .12s}
.ans:hover{border-color:var(--blue6);box-shadow:0 2px 12px rgb(37 99 235/.12)}
.ans .ai{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--i100);color:var(--i800);flex:none}
.ans .ai svg{width:18px;height:18px}
.ans b{display:block;font-size:15px;font-weight:600;color:var(--i900)}
.ans span{display:block;font-size:13px;color:var(--i550);margin-top:3px;line-height:1.45}
.ans.primary .ai{background:var(--i900);color:#fff}
.ikback{margin-top:22px;font-size:13px;color:var(--i600);display:inline-flex;align-items:center;gap:6px;border-radius:6px}
.ikback:hover{color:var(--i900)}
.dcard{background:#fff;border:1px solid var(--hair2);border-radius:16px;padding:18px 20px;margin-bottom:12px}
.dcard.best{border-color:#93c5fd;box-shadow:0 0 0 3px rgb(59 130 246/.12)}
.dcard h4{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dcard .badge{font-size:11.5px;font-weight:600;color:var(--blue8);background:#eff6ff;border-radius:99px;padding:2px 8px}
.dcard .from{font-size:13px;color:var(--i600);margin:3px 0 10px}
.dcard .from a{color:var(--blue7)}
.facts{display:grid;grid-template-columns:repeat(4,auto);gap:4px 22px;font-size:12.5px;justify-content:start}
.facts span{color:var(--i550)}
.facts b{font-weight:600;color:var(--i900);display:block}
.why{font-size:13.5px;color:var(--i800);margin:12px 0 0;line-height:1.5}
.also{font-size:13px;color:var(--i700);margin:6px 0 18px;line-height:1.6}
.also b{color:var(--i900);font-weight:600}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{height:40px;border-radius:10px;padding:0 18px;font-size:14px;font-weight:600;background:#fff;border:1px solid var(--hair2);color:var(--i900);display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--i100)}
.btn.pri{background:var(--i900);color:#fff;border-color:var(--i900)}
.btn.pri:hover{background:#2c2c44}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.drop{border:1.5px dashed #a8b3c7;border-radius:16px;background:#fff;padding:30px 20px;text-align:center;color:var(--i700);font-size:14px}
.drop svg{width:26px;height:26px;color:var(--i600);margin-bottom:6px}
.file{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--hair2);font-size:13.5px}
.file small{color:var(--i550);font-size:12.5px;margin-left:auto}
.searching{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--i700);padding:18px 0}
.asm{background:#fff;border:1px solid var(--hair2);border-radius:16px;overflow:hidden}
.ar{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:14px 18px;border-bottom:1px solid var(--hair);align-items:start}
.ar:last-child{border-bottom:0}
.ar .ak{font-size:12px;color:var(--i550);font-weight:600}
.ar .av2{font-size:14.5px;font-weight:600;color:var(--i900);margin-top:1px}
.ar .aw{font-size:13px;color:var(--i600);margin-top:3px;line-height:1.45}
.ar input{grid-column:1/-1;height:36px;border:1px solid #93c5fd;border-radius:9px;padding:0 10px;font-size:14px;background:#f8fbff}
.ar .chg{font-size:11.5px;font-weight:600;color:var(--amb-t);background:var(--amb-bg);border-radius:99px;padding:1px 7px;margin-left:6px}
.seg{display:inline-flex;background:var(--i100);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--i700);white-space:nowrap}
.seg button.on{background:#fff;color:var(--i900);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.1)}
.seg.blue button.on{background:var(--blue7);color:#fff}
.note{font-size:12.5px;color:var(--i600);margin-top:12px;line-height:1.5}

/* topbar */
.top{height:40px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);background:rgb(255 255 255/.75)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tabs a{height:100%;display:flex;align-items:center;font-size:12px;font-weight:500;color:var(--i550);text-decoration:none;border-bottom:2px solid transparent;padding-top:2px}
.tabs a:hover{color:var(--i900)}
.tabs a.on{color:var(--blue7);font-weight:600;border-bottom-color:var(--blue7)}
.state{height:20px;border-radius:99px;padding:0 9px;font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;flex:none}
.state.done{background:var(--ok-bg);color:var(--ok-t);box-shadow:inset 0 0 0 1px #a7f3d0}
.state.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.rtitle{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px;max-width:300px;flex:0 1 auto}
.play{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;min-width:0}
.pp{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--i700);flex:none}
.pp:hover{background:rgb(0 0 0/.05)}
.pp svg{width:13px;height:13px;fill:currentColor;stroke:none}
.clock{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--i100);color:var(--i700);flex:none}
.clock.live{background:rgb(239 68 68/.08);color:var(--bad-t)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#fca5a5,#ef4444)}
.track b{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:#ef4444;transform:translate(-50%,-50%);box-shadow:0 0 0 2px #fff}
.track.rest i{background:linear-gradient(90deg,#a5b4fc,#6d5ce8)}
.track.rest b{background:#6d5ce8}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--bad-t);background:rgb(239 68 68/.1);border-radius:99px;padding:2px 8px;flex:none}
.live i{width:5px;height:5px;border-radius:50%;background:var(--bad);animation:blink 1.3s infinite}
.tright{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.mchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--i600);height:24px;padding:0 8px;border-radius:6px}
.mchip svg{width:14px;height:14px}

.body{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

/* overview: watch it think */
.ov{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:22px 28px 56px}
.sbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--i550);margin-bottom:4px}
.sbar .sx{padding:3px 9px;border-radius:99px;white-space:nowrap}
.sbar .sx.done{color:var(--i700)}
.sbar .sx.done:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue7);margin-right:6px;vertical-align:1px}
.sbar .sx.now{background:var(--i900);color:#fff;font-weight:600}
.sbar .loopb{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--i200);border-radius:99px;padding:2px 4px 2px 4px}
.sbar .rn{font-size:12px;color:var(--i700);padding:0 8px 0 4px;white-space:nowrap;font-weight:500}
.fwrap{position:relative;width:100%;max-width:1240px;height:clamp(280px,min(calc(100vh - 300px),31vw),540px);margin:8px 0 6px}
.fwrap canvas{display:block;width:100%;height:100%}
.replay{position:absolute;right:0;top:0;height:30px;border-radius:99px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--i800);background:#fff;border:1px solid var(--hair2);display:inline-flex;align-items:center;gap:6px}
.replay:hover{background:var(--i100)}
.replay svg{width:13px;height:13px}
.verdict{font-family:var(--serif);font-size:23px;line-height:1.35;color:var(--i900);max-width:820px;margin:4px 0 0;text-align:center;letter-spacing:-.005em}
.verdict .mk{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px;vertical-align:2px}
.mk.ok{background:var(--ok)}.mk.no{background:#f59e0b}
.nowline{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;color:var(--i700);max-width:820px;text-align:left}
.nowline .spin{width:13px;height:13px}
.nowline svg{width:15px;height:15px;color:var(--ok-t)}
.ovfoot{margin-top:16px;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.srcbtn{display:inline-flex;align-items:center;gap:8px;height:32px;border-radius:99px;padding:0 14px;background:#fff;border:1px solid var(--hair2);font-size:13px;color:var(--i800);max-width:100%}
.srcbtn:hover{border-color:#93c5fd;background:#f8fbff}
.srcbtn svg{width:15px;height:15px;color:var(--blue7)}
.srcbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{font-size:13px;color:var(--blue7);font-weight:500;border-radius:4px}
.link:hover{text-decoration:underline}

/* chat */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.feed{flex:1;overflow:auto;padding:24px 20px 8px}
.feedin{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.msg{display:flex;gap:10px;padding:8px 0}
.anim{animation:fadein .35s}
.msg .tile{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:#f5f3ff;color:var(--violet);margin-top:1px}
.msg .tile svg{width:13px;height:13px}
.msg .who{font-size:11.5px;font-weight:600;color:var(--violet);margin-bottom:2px}
.msg .txt{font-size:13.5px;line-height:1.55;color:var(--i800);max-width:640px}
.tool{margin-left:34px;border-radius:8px}
.tool>button{width:100%;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:12.5px;color:var(--i600);text-align:left}
.tool>button:hover{background:rgb(0 0 0/.03)}
.tool .tg{width:14px;height:14px;display:grid;place-items:center;flex:none}
.tool .tg svg{width:13px;height:13px;color:var(--i550)}
.tool .tk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;flex:none}
.tool .tk svg{width:13px;height:13px}
.tool .tk.data{background:#eff6ff;color:var(--blue7)}
.tool .tk.paper{background:#fdf4ff;color:#86198f}
.tool .chv{margin-left:auto;width:13px;height:13px;color:var(--i550);transition:transform .12s}
.tool.open .chv{transform:rotate(90deg)}
.tool pre{margin:2px 8px 8px 30px;padding:10px 12px;background:#fff;border:1px solid var(--hair);border-radius:8px;font:11.5px/1.6 var(--mono);color:var(--i700);white-space:pre-wrap}
.me{align-self:flex-end;max-width:520px;background:rgb(15 118 110/.08);color:#0b4a44;border:1px solid rgb(15 118 110/.2);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13.5px;margin:8px 0;width:fit-content}
.typing{font-size:12.5px;color:var(--i550);padding:6px 0 6px 34px;display:flex;gap:6px;align-items:center}
.typing i{width:4px;height:4px;border-radius:50%;background:var(--i400);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.cwrap{flex:none;padding:8px 20px 28px}
.cbox{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 20px}
.cbox textarea{flex:1;align-self:center}
.cbox .send{margin-left:0}
.cbox.off{opacity:.85}
.cstat{max-width:720px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--i600);padding:0 6px;min-height:18px}
.cstat:empty{display:none}
/* the small live chip in the corner of Overview and Chat */
.ctile{position:absolute;right:22px;top:52px;z-index:4;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px 0 6px;border-radius:12px;background:rgb(255 255 255/.94);border:1px solid var(--hair2);box-shadow:0 1px 4px rgb(0 0 0/.05);text-align:left}
.ctile:hover{border-color:#93c5fd;background:#f8fbff}
.ctile canvas{width:46px;height:30px;display:block}
.ctile .ct-t{display:flex;flex-direction:column;line-height:1.15}
.ctile .ct-t b{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--i900);font-variant-numeric:tabular-nums}
.ctile .ct-t span{font-size:11px;color:var(--i550);white-space:nowrap}
/* round-by-round gates in Details */
.gsteps{display:flex;align-items:flex-start;gap:2px;margin:2px 0 4px}
.gs{flex:1;min-width:0;display:flex;flex-direction:column}
.gs .gr{font-size:11.5px;color:var(--i550)}
.gs b{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--i700);font-variant-numeric:tabular-nums;line-height:1.25}
.gs .gm{font-size:11.5px}
.gs.fin b{color:var(--blue8);font-size:23px}
.gs.fin .gr{color:var(--blue8);font-weight:600}
.gs.wait b{color:var(--i500);font-size:15px;line-height:1.6}
.garr{color:var(--i400);margin-top:21px;flex:none;width:14px;height:14px}
.gnote{font-size:12.5px;color:var(--i700);margin:6px 0 0;line-height:1.5}

/* visual */
.vis{flex:1;overflow:auto;padding:16px 24px 44px}
.visin{max-width:1120px;margin:0 auto}
.picker{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.picker button{height:30px;border-radius:99px;padding:0 13px;font-size:13px;color:var(--i700);display:inline-flex;align-items:center;gap:4px}
.picker button:hover{background:rgb(0 0 0/.05)}
.picker button.on{background:var(--i900);color:#fff}
.picker button svg{width:12px;height:12px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:12px}
.vh{font-family:var(--serif);font-size:26px;font-weight:500;margin:0;letter-spacing:-.01em}
.vs{color:var(--i600);font-size:14px;margin:4px 0 0;max-width:720px}
.panel{background:#fff;border:1px solid var(--hair);border-radius:14px;box-shadow:0 1px 3px rgb(0 0 0/.04);padding:18px;position:relative}
.panel svg.fig{display:block;width:100%;height:auto}
.foot{font-size:13px;color:var(--i600);margin-top:12px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:8px;border-radius:2px;display:inline-block}
canvas.sig{display:block;width:100%;height:380px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pt{border:1px solid var(--hair2);border-radius:10px;padding:12px 14px;background:#fff}
.pt.worst{box-shadow:0 0 0 2px #fca5a5;border-color:transparent}
.pt.worst.okw{box-shadow:0 0 0 2px #fcd34d}
.pt .pn{font-size:12px;color:var(--i550);display:flex;justify-content:space-between}
.pt .pv{font-family:var(--serif);font-size:30px;line-height:1.15;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.pt .bar{height:4px;border-radius:2px;background:var(--i100);position:relative}
.pt .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pt .bar b{position:absolute;top:-3px;width:1.5px;height:10px;background:var(--i900)}
.pt .ps{font-size:12px;margin-top:7px}
.ps.ok{color:var(--ok-t)}.ps.no{color:var(--bad-t)}
.empty{padding:48px 20px;text-align:center;color:var(--i600);font-size:14px}
.rings circle.rg{transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
.lpath{animation:dash 1.2s linear infinite}

/* 3D stage */
.stage{position:relative;height:clamp(380px,calc(100vh - 250px),640px);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse 90% 80% at 50% 38%,#ffffff 0%,#eef1f5 55%,#dfe4eb 100%);border:1px solid var(--hair);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.stage.grab canvas.gl{cursor:grabbing}
.labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;transition:opacity .25s;will-change:transform}
.lab i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--i900);box-shadow:0 0 0 3px rgb(255 255 255/.9)}
.lab span{position:absolute;top:-17px;left:22px;white-space:nowrap;background:#fff;border:1px solid var(--hair2);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.35;color:var(--i800);box-shadow:0 2px 10px rgb(16 24 40/.08)}
.lab span b{display:block;font-size:13px;color:var(--i900);font-weight:600}
.lab span:before{content:"";position:absolute;right:100%;top:17px;width:17px;height:1.5px;background:var(--i900)}
.lab.l span{left:auto;right:22px}
.lab.l span:before{right:auto;left:100%}
.lab.up span{top:auto;bottom:16px;left:-16px}
.lab.up.l span{left:auto;right:-16px}
.lab.up span:before{display:none}
.lab.hot i{background:var(--bad);box-shadow:0 0 0 3px rgb(255 255 255/.9),0 0 0 7px rgb(239 68 68/.25)}
.lab.ft i{background:var(--blue7);box-shadow:0 0 0 3px rgb(255 255 255/.9),0 0 0 7px rgb(37 99 235/.25)}
.ov3{position:absolute;pointer-events:none}
.ov3>*{pointer-events:auto}
.ov3.tl{left:14px;top:14px}.ov3.tr{right:14px;top:14px}.ov3.bl{left:14px;bottom:14px}.ov3.br{right:14px;bottom:14px}.ov3.bc{left:50%;bottom:14px;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--i600);background:rgb(255 255 255/.85);border-radius:99px;padding:3px 10px}
.tbtn{height:32px;border-radius:99px;padding:0 14px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--hair2);color:var(--i900);display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 4px rgb(0 0 0/.06)}
.tbtn:hover{background:var(--i100)}
.tbtn svg{width:14px;height:14px}
.steps3{display:inline-flex;background:rgb(255 255 255/.92);border:1px solid var(--hair2);border-radius:99px;padding:3px;gap:2px;box-shadow:0 2px 10px rgb(0 0 0/.06)}
.steps3 button{height:30px;border-radius:99px;padding:0 14px;font-size:13px;color:var(--i700);white-space:nowrap}
.steps3 button.on{background:var(--i900);color:#fff;font-weight:600}
.ests{display:flex;gap:8px}
.est{background:rgb(255 255 255/.94);border:1px solid var(--hair2);border-radius:12px;padding:8px 12px;min-width:104px}
.est .l{font-size:11.5px;color:var(--i550)}
.est .v{font-family:var(--serif);font-size:21px;line-height:1.2;color:var(--i900)}
.est .e{font-size:11px;color:var(--i550)}
.pred{display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--hair2);border-radius:12px;padding:8px 14px;font-size:13.5px;color:var(--i800);box-shadow:0 2px 10px rgb(0 0 0/.06)}
.pred i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.pred.yes{border-color:#fca5a5;background:#fff5f5;color:var(--bad-t)}
.pred.yes i{background:var(--bad);animation:blink .6s infinite}
.fcount{display:flex;align-items:center;gap:6px;background:rgb(255 255 255/.94);border:1px solid var(--hair2);border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgb(0 0 0/.05)}
.fc{display:flex;flex-direction:column;align-items:flex-start;padding:2px 8px;border-radius:9px;transition:background .2s}
.fc b{font-family:var(--serif);font-size:24px;line-height:1.1;font-weight:500;color:var(--i700);font-variant-numeric:tabular-nums}
.fc span{font-size:11.5px;color:var(--i550);white-space:nowrap}
.fc.on{background:#eff6ff}
.fc.on b{color:var(--blue8)}
.fc.on span{color:var(--blue8)}
.fcount>svg{width:14px;height:14px;color:var(--i400)}
.hist{background:rgb(255 255 255/.94);border:1px solid var(--hair2);border-radius:14px;padding:10px 14px;min-width:200px;box-shadow:0 2px 10px rgb(0 0 0/.05)}
.hist .ht{font-size:12px;color:var(--i600);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
.hr{display:grid;grid-template-columns:54px 1fr 54px;gap:8px;align-items:center;font-size:12px;color:var(--i700);height:20px}
.hr i{height:6px;border-radius:3px;background:#c7d2fe;display:block}
.hr.cur i{background:var(--blue7)}
.hr b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;color:var(--i900)}
.gl-wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--i600);font-size:13.5px}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:var(--i700)}
.fallback canvas{width:100%;flex:1;min-height:0}

/* configure */
.cfg{flex:1;overflow:auto;padding:40px 24px}
.cfgin{max-width:820px;margin:0 auto;display:grid;grid-template-columns:180px 1fr;gap:32px;align-items:start}
.cfg h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:0 0 24px;grid-column:1/-1}
.subrail{display:flex;flex-direction:column;gap:2px}
.subrail .cap{padding-left:10px}
.subrail button{height:32px;border-radius:7px;text-align:left;padding:0 10px;font-size:12.5px;color:var(--i600)}
.subrail button:hover{background:rgb(0 0 0/.03)}
.subrail button.on{background:rgb(37 99 235/.07);color:var(--i900);font-weight:500}
.field{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--hair)}
.field:last-child{border-bottom:0}
.field .fl{font-size:13px;font-weight:500}
.field .fh{font-size:12px;color:var(--i550);margin-top:2px}
.field select,.field input{height:30px;border:1px solid var(--i200);border-radius:7px;background:#fff;padding:0 8px;font-size:12.5px;min-width:150px}
.sw{width:34px;height:20px;border-radius:99px;background:var(--blue6);position:relative;flex:none}
.sw:after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}

/* popovers, menus, drawers */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}
#layer>*{pointer-events:auto}
.pop{position:fixed;background:#fff;border:1px solid var(--hair2);border-radius:12px;box-shadow:0 4px 20px rgb(0 0 0/.1);padding:6px;min-width:176px;animation:fadein .12s}
.pop .cap{padding:6px 8px 4px}
.opt{width:100%;display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:7px;text-align:left;font-size:12.5px;color:var(--i800)}
.opt:hover{background:var(--i100)}
.opt.on{background:rgb(37 99 235/.08)}
.opt svg{width:15px;height:15px;margin-top:1px;color:var(--i550)}
.opt .oh{display:block;font-size:11.5px;color:var(--i550);margin-top:1px}
.opt .ck{margin-left:auto;color:var(--blue7)}
.sep{height:1px;background:var(--hair);margin:4px 6px}
.adv{width:300px;padding:14px}
.adv h4{margin:0 0 4px;font-size:13px}
.adv .field{padding:10px 0}
.adv .field select,.adv .field input{min-width:112px;height:28px}
.scrim{position:fixed;inset:0;background:rgb(22 22 42/.2);animation:fadein .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:#fff;border-left:1px solid var(--hair);box-shadow:-8px 0 30px rgb(0 0 0/.1);padding:22px 24px;overflow:auto;animation:slide .18s var(--ease)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 4px}
.drawer .dsub{color:var(--i600);font-size:13px;margin:0 0 14px}
.drawer .x{position:absolute;right:14px;top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.kv span:first-child{color:var(--i550)}
.kv span:last-child{text-align:right;font-weight:500}
.dh{font-size:13.5px;font-weight:600;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.dh svg{width:15px;height:15px;color:var(--i600)}
.rr{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12.5px;align-items:center}
.rr .g2{font-variant-numeric:tabular-nums;font-weight:500}
.srcd{border:1px solid var(--hair2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.srcd h5{margin:0;font-size:14px;font-weight:600}
.srcd .o{font-size:12.5px;color:var(--i600);margin:2px 0 8px}
.srcd .o a{color:var(--blue7)}
.srcd .kv{padding:6px 0;font-size:12.5px}
.srcd .kv:last-child{border-bottom:0}
.use{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.use span{font-size:12px;font-weight:500;border-radius:99px;padding:2px 9px}
.use .tr{background:#eff6ff;color:var(--blue8)}
.use .ho{background:#f0fdf4;color:#166534}
.pap{padding:10px 0;border-bottom:1px solid var(--hair)}
.pap:last-child{border-bottom:0}
.pap b{font-size:13px;font-weight:600;display:block}
.pap .ps2{font-size:12px;color:var(--i600)}
.pap .ps2 a{color:var(--blue7)}
.pap p{margin:3px 0 0;font-size:12.5px;color:var(--i800)}
.asl{margin:0;padding:0;list-style:none}
.asl li{font-size:12.5px;color:var(--i800);padding:6px 0;border-bottom:1px solid var(--hair)}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(540px,92vw);background:#fff;border-radius:16px;box-shadow:0 12px 48px rgb(0 0 0/.2);overflow:hidden;animation:fadein .15s}
.modal input{width:100%;border:0;border-bottom:1px solid var(--hair);padding:16px 18px;font-size:15px;outline:none}
.modal .list{max-height:320px;overflow:auto;padding:6px}
.modal .pad{padding:22px 24px}
.modal h3{margin:0 0 10px;font-family:var(--serif);font-weight:500;font-size:24px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;animation:fadein .15s;z-index:60}

/* responsive */
@media (max-width:1279px){.mchip span{display:none}.rtitle{max-width:200px}.play{min-width:190px}}
@media (max-width:1199px){.ctile .ct-t span{display:none}}
@media (max-width:1023px){.rtitle{max-width:150px}.facts{grid-template-columns:repeat(2,auto)}}
@media (max-width:767px){
  #app{flex-direction:column}
  #sb{position:fixed;left:0;top:0;bottom:0;width:252px!important;transform:translateX(-102%);transition:transform .18s var(--ease);background:var(--glass-strong)}
  body.drawer-open #sb{transform:none;box-shadow:4px 0 30px rgb(0 0 0/.12)}
  body.col #sb .word,body.col #sb .nav a span,body.col #sb .cnt,body.col #sb .runs,body.col #sb .acct .who,body.col #sb .sb-div,body.col #sb .sb-head .logo{display:revert}
  body.col #sb .runs{display:block}
  body.col #sb .nav a{justify-content:flex-start;padding:0 10px}
  body.drawer-open #scrim{display:block;position:fixed;inset:0;z-index:15;background:rgb(22 22 42/.2)}
  #mhead{display:flex;height:48px;flex:none;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--hair);background:var(--glass-strong)}
  .top{gap:10px;padding:0 10px}
  .rtitle,.track,.tright .mchip{display:none}
  .play{flex:1;justify-content:flex-end;min-width:0}
  .greet{font-size:32px}
  .ov{padding:16px 14px 56px}
  .sbar{font-size:11.5px;gap:3px}
  .sbar .sx{padding:2px 6px}
  .fwrap{height:300px}
  .verdict{font-size:19px}
  .answers{grid-template-columns:1fr}
  .ikq{font-size:25px}
  .intake{padding:24px 16px 60px}
  .facts{grid-template-columns:repeat(2,auto)}
  .cfgin{grid-template-columns:1fr}
  .demo{bottom:6px;right:8px}
  .vis{padding:12px 12px 40px}
  .stage{height:440px}
  .ests{flex-wrap:nowrap;gap:6px}.ov3.bl:has(.ests){right:12px;bottom:60px}.est .e{display:none}.est .v{font-size:16px}
  .est{min-width:0;flex:1;padding:6px 9px}
  .fcount{padding:4px 6px;gap:2px}
  .fc{padding:2px 4px}
  .fc b{font-size:17px}
  .hist{display:none}
  .lab span{font-size:11.5px;padding:4px 8px}
  .feed{padding:16px 14px 8px}
  .ctile{right:10px;top:48px;padding:0 6px}.ctile .ct-t{display:none}
  .cwrap{padding:6px 12px 22px}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="sb" aria-label="Sidebar"></aside>
  <div id="scrim"></div>
  <header id="mhead"></header>
  <main id="main"></main>
</div>
<div class="demo">Simulated run, demo data</div>
<div id="layer"></div>
<script src="../voice.js" defer></script>
<script type="module">
'use strict';
/* The product name lives here and only here. */
const PRODUCT = { short: 'Chipmonk', full: 'Chipmonk AI Scientist' };
document.title = PRODUCT.full;

/* ---------------- icons ---------------- */
const P = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  ccheck:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  more:'<circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  play:'<path d="M7 4.5v15l12.5-7.5z"/>',
  chev:'<path d="m6 9 6 6 6-6"/>',
  chevr:'<path d="m9 6 6 6-6 6"/>',
  back:'<path d="m15 6-6 6 6 6"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  cpu:'<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  gpu:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="9" cy="12" r="3"/><path d="M15 10h4M15 14h4"/>',
  wave:'<path d="M2 12h3.5l2.5-6 4 12 3-9 2 3h5"/>',
  drop:'<path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',

  } else {

  add(T_SPEC + 3.6, 'Trainer', eeg
    ? `Training a full-size reference model on every channel in 4-second windows from the ${u.train} training patients. Six patients stay unseen; we only look at them when checking a chip.`

  R.forEach((rd, i) => {
    const s = roundStart(rd.r), prev = R[i - 1];
    let txt = rd.r === 1
      ? `Round 1: proposing ${c} small designs that should fit on a chip. Most listen to ${chanWords(u, rd.chans, run)}${eeg ? ' in 2-second windows' : ''}.`
      : `Round ${rd.r}: the last chip held up on ${prev.chans} ${eeg ? 'channels' : 'light paths'}, so this batch of ${c} leans on ${chanWords(u, rd.chans, run)}.`;
    if (rd.applied.length) txt += ` Following your note, ${rd.applied.map(noteWords).join('; ')}.`;
    add(s + 0.4, 'Designer', txt);
    add(s + 1, null, null, `Propose ${c} chip designs`, `${eeg ? 'Channels' : 'Light paths'}: ${rd.chans}\nWindow: ${eeg ? '2 s' : '30 s'}\nSizes: ${fmt(rd.gates * 0.3)} to ${fmt(rd.gates * 8)} gates\nClinical line: ${rd.line}%`, 6.5);
    add(s + 8.3, 'Trainer', `Fine-tuning all ${c} at once from the reference model, on the same ${u.train} training ${u.who}${d.kind === 'public' ? ' from ' + DATASETS[d.id].name : ''}.`);

    add(s + 24.4, 'Designer', `Compiled the 12 strongest into logic gates, with their weights wired in. The smallest one that still holds up is ${fmt(rd.gates)} gates.`);
    add(s + 25, null, null, 'Compile the top 12 into logic gates', `Smallest that holds up: ${fmt(rd.gates)} gates\nNext: ${fmt(rd.gates * 1.12)} gates\nLargest: ${fmt(rd.gates * 3.4)} gates`, 4.5);
    add(s + 30.4, null, null, 'Check the circuit against its model, bit for bit', `${eeg ? '1.2 million' : '410,000'} windows compared\nMismatches: 0`, 5.5);
    const miss = rd.meet < u.N;
    add(s + 36.2, 'Verifier', `The ${fmt(rd.gates)}-gate circuit matches its model bit for bit. On the ${u.N} unseen ${u.who} it meets the clinical line for ${rd.meet} of ${u.N}` +
      (miss ? `; ${u.one} ${rd.worstIdx + 1} is at ${rd.worst}%, under the ${rd.line}% line.` : `; the worst is ${u.one} ${rd.worstIdx + 1} at ${rd.worst}%.`) +
      (i ? ` That's the new best, down from ${fmt(prev.gates)}.` : ''));

  const fin = R[ROUNDS - 1];
  add(roundEnd(ROUNDS) + 0.5, null, null, 'Write the report', 'Sections: the chip, how it was found,\nper-patient results, power estimate,\ndata and papers used', 10);
  add(TOTAL - 0.2, 'Lead scientist', `Done. The final chip is ${fmt(fin.gates)} gates on ${chanWords(u, fin.chans, run)}. It meets the clinical line on ${fin.meet} of ${u.N} unseen ${u.who}; the worst is ${fin.worst}%. The report and the gate-level design are ready.`);
  for (const x of run.redirects) {
    ev.push({ t: x.t, me: true, text: x.text, key: 'me' + x.at });
    ev.push({ t: x.t + 0.001, who: 'Lead scientist', text: x.reply, reply: x, key: 'rp' + x.at });
  }

}
function replyFor(run, kind, t) {

    c.fillStyle = '#47475a'; c.font = font(small ? 11.5 : 13.5, 500); c.fillText(small ? `gates, round ${shown.r}` : `gates, round ${shown.r} chip`, Math.min(xch, W - (small ? 44 : 70)), ny + (small ? 16 : 22));

    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${rd === fin ? '#1d4ed8' : '#c7d2fe'}"/><text x="${x + bw / 2}" y="${H - 3}" text-anchor="middle" font-size="11.5" fill="${rd === fin ? '#1e40af' : '#4f4f63'}" font-weight="${rd === fin ? 700 : 400}">R${rd.r}</text>`;

    if (!RM) for (let j = 0; j < 2; j++) { const f = (t * .9 + j * .5 + ch * .13) % 1, a = .5 + .5 * sigAmp(run, ch, t - f); c.fillStyle = `rgba(${col},${a})`; c.beginPath(); c.arc(1 + f * (x - s / 2 - 2), yy, 1.9, 0, Math.PI * 2); c.fill(); }
  });
  c.strokeStyle = `rgba(${out},.5)`; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x + s / 2 + 1, y); c.lineTo(W - 1, y); c.stroke();
  if (!RM) { const f = (t * 1.2) % 1; c.fillStyle = `rgba(${out},${1 - f * .6})`; c.beginPath(); c.arc(x + s / 2 + 2 + f * (W - x - s / 2 - 3), y, 2, 0, Math.PI * 2); c.fill(); }
  chip2D(c, x, y, s, {});
  // die lit by the current
  const d = s * .5, a = .35 + .5 * liveAct(run);
  c.fillStyle = `rgba(${yes ? out : '147,197,253'},${a})`; c.fillRect(x - d / 2, y - d / 2, d, d);
  if (!RM) { const f = (t * .9) % 1; c.fillStyle = 'rgba(255,255,255,.85)'; c.fillRect(x - d / 2 + f * (d - 1.5), y - d / 2, 1.5, d); }
}
(function loop() {
  if (S.route.page === 'run' && S.route.view !== 'visual') drawTile();
  if (S.route.page === 'run') {
    if (S.route.view === 'overview') drawFunnel($('#fun'), byId(S.route.id));
    else if (S.route.view === 'visual') { if (S.route.vis === 'signal') drawSignal(); frame3D(); }
  }
  requestAnimationFrame(loop);
})();

S.route = parse();
if (!location.hash) history.replaceState(null, '', '#/');
render();
</script>
