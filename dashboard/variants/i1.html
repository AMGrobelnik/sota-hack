<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChipIn</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='none' stroke='%233D6DF0' stroke-width='7' d='M53 12.5H23A10.5 10.5 0 0 0 12.5 23V41A10.5 10.5 0 0 0 23 51.5H53'/%3E%3Crect fill='%233D6DF0' x='26' y='25' width='14' height='14' rx='1.5'/%3E%3C/svg%3E">
<style>
/* ===== tokens (the look of the round-5 pages, kept) ===== */
:root{
  --page:#f5f6f8;--card:#fff;--glass:rgb(250 251 253/.8);--glass-s:rgb(252 252 254/.97);
  --i900:#141a2e;--i800:#262c40;--i700:#3a4052;--i600:#4a5062;--i550:#555b6d;--i500:#5c6276;--i300:#b2b6c2;--i200:#d5d8e0;--i150:#e7e9ee;--i100:#f1f2f6;
  --blue:#3d6df0;--blue6:#3d6df0;--blue7:#2b55d0;
  --navy:#0e1530;--navy2:#16204a;
  --c-lead:#6b46c1;--c-model:#2b55d0;--c-chip:#a04812;--c-test:#0f7a55;
  --caught:#0f7a55;--missed:#c2362b;--falsea:#b7791f;--falsea-t:#8a5a0c;
  --ok:#10b981;--okt:#047857;--okbg:#ecfdf5;--badt:#b91c1c;--badbg:#fdf0ee;
  --amb:#b45309;--amb-bg:#fff8eb;
  --hair:rgb(0 0 0/.07);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Charter","Georgia",serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sh-menu:0 4px 20px rgb(0 0 0/.1);--sh-hair:0 1px 3px rgb(0 0 0/.04);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--i900);background:var(--page);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s12{width:12px;height:12px}svg.i.s13{width:13px;height:13px}svg.i.s14{width:14px;height:14px}svg.i.s16{width:16px;height:16px}svg.i.s20{width:20px;height:20px}

/* ===== measured, estimated, simulated: one convention everywhere ===== */
.est{font-style:italic;text-decoration:underline dotted rgb(20 26 46/.5);text-underline-offset:3px;cursor:help}
.mk{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;border-radius:99px;padding:1px 7px;white-space:nowrap;vertical-align:1px;font-style:normal;letter-spacing:0}
.mk.sim{color:#7c3a06;background:#fff3e0}
.mk.mea{color:#0b5a3f;background:#e6f5ed}
.mk.no{color:var(--i600);background:var(--i100)}
.pf{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;border-radius:99px;padding:1px 8px;white-space:nowrap}
.pf.ok{color:#0b5a3f;background:#e6f5ed}.pf.no{color:#9f2a20;background:var(--badbg)}.pf.na{color:var(--i600);background:var(--i100)}

/* ===== sidebar ===== */
.sb{position:fixed;inset:0 auto 0 0;width:252px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid rgb(0 0 0/.05);display:flex;flex-direction:column;z-index:40;transition:width .15s var(--ease),box-shadow .15s var(--ease),transform .2s var(--ease)}
.sb-head{height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--hair)}
.logo{width:28px;height:28px;flex:none;display:grid;place-items:center}
.logo svg{width:28px;height:28px;display:block}
.word{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;color:var(--i900)}
.tog{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550);flex:none}
.tog:hover{background:rgb(0 0 0/.05)}
.nav{padding:8px;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--i600);text-decoration:none;white-space:nowrap}
.nav a:hover{background:rgb(0 0 0/.035)}
.nav a.on{background:rgb(59 130 246/.08);color:var(--i900)}
.count{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--blue7);background:rgb(37 99 235/.08);border-radius:99px;padding:1px 7px}
.sb-div{height:1px;background:var(--hair);margin:2px 12px}
.runs{flex:1;overflow:auto;padding:6px 8px 10px}
.cap{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-size:11px;font-weight:600;color:var(--i550)}
.cap a{font-weight:500;text-decoration:none;color:var(--i550);cursor:pointer}
.rrow{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--i700);text-decoration:none;white-space:nowrap}
.rrow:hover{background:rgb(0 0 0/.03)}
.rrow.on{background:rgb(59 130 246/.08);color:var(--i900)}
.rrow .t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.g{width:12px;height:12px;flex:none;display:grid;place-items:center}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid rgb(59 130 246/.2);border-top-color:var(--blue);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g .ok{color:var(--okt)}
.acct{flex:none;border-top:1px solid var(--hair);padding:8px}
.acct button{display:flex;align-items:center;gap:9px;width:100%;padding:5px;border-radius:8px}
.acct button:hover{background:rgb(0 0 0/.03)}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center}
.acct .nm{font-size:12.5px;font-weight:500;color:var(--i800);line-height:1.2}
.acct .em{font-size:11px;color:var(--i550)}
body.col .sb{width:52px}
body.col .sb:hover{width:252px;box-shadow:var(--sh-menu)}
body.col .sb:not(:hover) .hc{display:none}
body.col .sb:not(:hover) .sb-head{justify-content:center;padding:0}
body.col .sb:not(:hover) .sb-head .logo{display:none}
body.col .sb:not(:hover) .tog{margin:0}
body.col .sb:not(:hover) .nav a{justify-content:center;padding:0}
body.col .sb:not(:hover) .runs{visibility:hidden}
body.col .sb:not(:hover) .acct button{justify-content:center}

/* ===== main ===== */
.main{position:fixed;top:0;right:0;bottom:0;left:252px;display:flex;flex-direction:column;transition:left .15s var(--ease)}
body.col .main{left:52px}
.mhead{display:none}
.demo{position:fixed;right:12px;bottom:10px;z-index:20;font-size:11px;font-weight:500;color:var(--i600);background:rgb(255 255 255/.92);padding:3px 9px;border-radius:99px;border:1px solid rgb(0 0 0/.08);pointer-events:none}
.demo.mea{color:#0b5a3f;border-color:#bfe3cf}
.demo:empty{display:none}
.body{flex:1;overflow:auto;position:relative;min-height:0}

/* ===== start ===== */
.start{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:28px}
.scol{width:100%;max-width:780px;margin-top:-3vh}
.band{position:relative;border-radius:22px;background:radial-gradient(90% 140% at 85% 0%,#22336f 0%,var(--navy2) 45%,var(--navy) 85%);overflow:hidden;height:232px;color:#e6ebf7;box-shadow:0 24px 60px -30px rgb(14 21 48/.7)}
.band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgb(255 255 255/.045) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.045) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(70% 90% at 82% 30%,#000,transparent 75%);mask-image:radial-gradient(70% 90% at 82% 30%,#000,transparent 75%)}
.band .bt{position:absolute;left:36px;top:32px;right:36px;z-index:2}
.band .lock{height:32px;width:auto;display:block;margin-bottom:30px}
.greet{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.08;margin:0;letter-spacing:-.015em;color:#fff}
.subt{font-size:15px;color:#c9d2ea;margin:12px 0 0;line-height:1.5;max-width:540px}
.scol .box{margin:-34px 22px 0;position:relative;z-index:3}
.box{background:var(--glass-s);border:1px solid rgb(0 0 0/.08);border-radius:24px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 28px -14px rgb(30 40 90/.16);padding:18px 20px 12px}
.box textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font-size:14px;line-height:1.55;min-height:24px;max-height:280px;color:var(--i900);padding:0;display:block}
.box textarea::placeholder{color:var(--i500)}
.crow{display:flex;align-items:center;gap:6px;margin-top:12px;min-height:36px}
.grow{flex:1}
.chipin{height:36px;padding:0 16px 0 14px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;background:var(--i150);color:var(--i600);font-size:13.5px;font-weight:600;flex:none;transition:background .12s}
.chipin.ready{background:var(--blue7);color:#fff}
.chipin.ready:hover{background:#2347b4}
.chipin svg{width:16px;height:16px}
.exs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:16px 24px 0;font-size:12.5px;color:var(--i600)}
.exs button{font-size:12.5px;color:var(--i700);padding:4px 10px;border-radius:99px;border:1px solid transparent}
.exs button:hover{border-color:rgb(0 0 0/.1);background:#fff;color:var(--i900)}

/* ===== composer pills and their popovers (the AI Inventor pattern, rebuilt here) ===== */
.cpill{height:24px;display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:99px;border:1px solid rgb(0 0 0/.08);background:#fff;font-size:12px;line-height:1;font-weight:500;color:var(--i700);white-space:nowrap;min-width:0;transition:border-color .12s}
.cpill:hover{border-color:rgb(0 0 0/.25)}
.cpill .pv{color:var(--i900);overflow:hidden;text-overflow:ellipsis}
.cpill .mark{color:var(--blue7);display:inline-flex}
.cpill .cv{opacity:.5}
.cpill[aria-expanded=true]{border-color:rgb(0 0 0/.25)}
.cpills{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.pop{position:fixed;z-index:80;background:#fff;border:1px solid rgb(0 0 0/.08);border-radius:12px;box-shadow:var(--sh-menu);padding:4px;min-width:176px;animation:popin .12s var(--ease)}
@keyframes popin{from{opacity:0;transform:translateY(3px)}}
.pop .ph{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--i550);padding:4px 8px 6px}
.prow{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--i700);text-align:left}
.prow:hover{background:rgb(0 0 0/.04)}
.prow.on{background:rgb(96 165 250/.1);color:#2563eb;font-weight:600}
.prow .rn{flex:1;min-width:0}
.prow .rs{font-size:10px;color:var(--i550);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.prow.on .rs{color:#4f7fe6}
.prow .ck{display:inline-flex;color:#2563eb}
.seg2{display:flex;border-radius:6px;background:rgb(0 0 0/.04);padding:2px}
.seg2 button{flex:auto;border-radius:8px;padding:4px 8px;font-size:12px;font-weight:500;color:var(--i550);text-align:center;transition:all .12s}
.seg2 button:hover{color:var(--i700)}
.seg2 button.on{background:#2563eb;color:#fff;box-shadow:0 1px 2px rgb(0 0 0/.12)}
.mrow{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--i900);text-align:left}
.mrow:hover{background:rgb(0 0 0/.04)}
.mrow.on{background:rgb(96 165 250/.1);color:#2563eb}
.mrow .mn{flex:1;min-width:0}
.mrow .mid{display:block;font-family:var(--mono);font-size:10px;color:var(--i550);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msrch{width:100%;border:1px solid rgb(0 0 0/.06);background:rgb(0 0 0/.03);border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;outline:0;margin-bottom:4px}
.msrch:focus{box-shadow:0 0 0 2px #3b82f6}
.pi{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 8px;border-radius:7px;font-size:12.5px;color:var(--i800)}
.pi:hover{background:var(--i100)}
.pi .h{display:block;font-size:11.5px;color:var(--i550);margin-top:1px}
.psep{height:1px;background:var(--hair);margin:5px 4px}

/* ===== modal, toast, drawer ===== */
.mbg{position:fixed;inset:0;background:rgb(20 20 40/.22);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgb(0 0 0/.18);width:min(460px,100%);max-height:86vh;overflow:auto;padding:20px}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{font-size:13px;color:var(--i700);line-height:1.55}
.modal .mx{float:right;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--i550)}
.modal .mx:hover{background:var(--i100)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:13px}
.kv span:first-child{color:var(--i600);flex:none}
.kv span:last-child{text-align:right}
.kv:last-child{border:0}
.srch{width:100%;height:38px;border:1px solid var(--i150);border-radius:9px;padding:0 12px;margin:10px 0 8px;outline:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--i900);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:9px;z-index:99;animation:fade .15s}
.dscrim{position:fixed;inset:0;background:rgb(20 20 40/.16);z-index:70;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:71;box-shadow:-12px 0 40px rgb(0 0 0/.12);display:flex;flex-direction:column;animation:slin .2s var(--ease)}
@keyframes slin{from{transform:translateX(24px);opacity:0}}
.dh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--hair)}
.dh h3{margin:0;font-size:15.5px}
.dh button{margin-left:auto;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--i600)}
.dh button:hover{background:var(--i100)}
.db{flex:1;overflow:auto;padding:6px 18px 30px}
.srcp h4{font-size:12.5px;font-weight:600;color:var(--i600);margin:20px 0 8px}
.src{padding:12px 0;border-bottom:1px solid var(--hair)}
.src:last-child{border:0}
.src .sn{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.src .sw2{font-size:12.5px;color:var(--i600);margin-top:3px}
.src .sw2 a{color:var(--blue7)}
.src .sk{font-size:12.5px;color:var(--i700);margin-top:6px;line-height:1.5}
.src ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--i700);line-height:1.55}
.srcp>.sk{font-size:13px;color:var(--i700);line-height:1.55;margin:0}
.credit{font-size:12px;color:var(--i600);line-height:1.5;margin:18px 0 0}

/* ===== spec screen ===== */
.spec{flex:1;overflow:auto;display:flex;justify-content:center;padding:40px 24px 80px}
.specc{width:100%;max-width:720px}
.spec h1{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.2;letter-spacing:-.012em;margin:0 0 6px}
.spec .lead{font-size:13.5px;color:var(--i600);margin:0 0 18px;line-height:1.5}
.spec .box{padding:14px 18px 12px}
.ssec{margin-top:26px}
.ssec>h2{font-size:13px;font-weight:650;margin:0 0 10px;color:var(--i900);display:flex;align-items:baseline;gap:10px}
.ssec>h2 span{font-weight:500;color:var(--i600);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;align-items:center}
.fgrid label{font-size:12.5px;color:var(--i600)}
.fin2{height:36px;width:100%;border:1px solid var(--i200);border-radius:10px;padding:0 12px;font-size:13.5px;outline:0;background:#fff}
.fin2:focus{border-color:var(--blue7);box-shadow:0 0 0 3px rgb(61 109 240/.14)}
.fin2.empty{border-style:dashed;border-color:#c9a26a;background:#fffdf8}
.fin2::placeholder{color:#9a7a4e}
select.fin2{padding:0 8px}
.fw{display:flex;align-items:center;gap:4px;min-width:0}.fw>.fin2{flex:1;min-width:0}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) 96px 92px 54px auto auto;gap:6px;align-items:center;margin-bottom:6px}
.trow .u{font-size:12.5px;color:var(--i600)}
.trow .prim{font-size:12px;color:var(--i600);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:0 4px}
.trow .prim input{accent-color:var(--blue7);margin:0}
.xbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--i550)}
.xbtn:hover{background:var(--i100);color:var(--i900)}
.addt{font-size:12.5px;font-weight:600;color:var(--blue7);padding:6px 2px}
.dq{display:flex;gap:8px;flex-wrap:wrap}
.dq button{height:34px;padding:0 14px;border-radius:99px;border:1px solid rgb(0 0 0/.13);background:#fff;font-size:13px;font-weight:500;color:var(--i800)}
.dq button.on{background:var(--blue7);border-color:var(--blue7);color:#fff}
.dqn{font-size:12.5px;color:var(--i600);margin:8px 0 0;line-height:1.5}
.casen{font-size:12.5px;color:var(--i700);background:#f2f6ff;border:1px solid #d6e1fb;border-radius:11px;padding:9px 12px;margin:22px 0 0;line-height:1.5}
.casen b{font-weight:650}
.sacts{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{height:40px;padding:0 18px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.p{background:var(--blue7);color:#fff}
.btn.p:hover{background:#2347b4}
.btn.s{background:#fff;border:1px solid rgb(0 0 0/.12);color:var(--i800)}
.btn.s:hover{background:var(--i100)}
.btn[disabled]{opacity:.45;cursor:default}
.files{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--hair);border-radius:10px;background:#fff;font-size:12.5px}
.file .sz{margin-left:auto;color:var(--i600)}

/* ===== run top bar ===== */
.top{height:42px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px;border-bottom:1px solid var(--hair);background:rgb(255 255 255/.8)}
.tabs{display:flex;gap:16px;height:100%;flex:none}
.tab{font-size:12px;font-weight:500;color:var(--i600);height:100%;display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap}
.tab:hover{color:var(--i900)}
.tab.on{color:var(--blue7);font-weight:600;border-bottom-color:var(--blue6)}
.spill{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap;flex:none}
.spill.done{background:var(--okbg);color:var(--okt);box-shadow:inset 0 0 0 1px #a7f3d0}
.spill.paused{background:var(--i100);color:var(--i600);box-shadow:inset 0 0 0 1px var(--i150)}
.pbar{flex:1;max-width:460px;min-width:150px;display:flex;align-items:center;gap:9px}
.pbtn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--i700);flex:none}
.pbtn:hover{background:var(--i100)}
.pbtn svg{width:13px;height:13px;fill:currentColor;stroke:none}
.clk{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;background:var(--i100);color:var(--i700);flex:none;font-variant-numeric:tabular-nums}
.clk.live{background:rgb(239 68 68/.09);color:var(--badt)}
.track{flex:1;height:4px;border-radius:2px;background:var(--i150);position:relative;min-width:40px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#818cf8,#6366f1)}

/* ---------------- 3. SIMULATION MODEL ----------------
   Plain words (the same text is in the Sources drawer, simModelText):
   For each round, a few hundred designs are drawn. Each gets a channel budget, a gate count spread
   evenly on a log scale over the case's range (later rounds also try more designs near where the
   earlier ones crossed the bar), and an efficiency between 0 and 1 (how well the design uses its gates;
   later rounds and bigger presets do better on average). Its chance of catching an event rises with
   gates along a saturating curve whose ceiling depends on the channel budget:
     p = s0 + (ceiling[budget] - s0) * (1 - exp(-(gates * k / g0[budget]) ^ 1.3)) - 0.16 * (1 - efficiency)
   Each of the 12 unseen patients has a fixed difficulty. For every patient, each event is drawn caught or
   missed with probability p minus that difficulty; false alarms are drawn as a count over the patient's
   hours from a rate that falls with gates and channels; graded hours agree with the experts on a similar
   curve. Every summary on the page (worst patient, pooled, counts, pass or fail, the chosen chip, the
   funnel) is computed from these per-patient tallies, so the page always agrees with itself. */

  return Object.assign({}, SIM_DEFAULT, { curve });

    hours: Math.round(hours * (0.85 + 0.3 * R())), graded: grading ? 2 + Math.floor(R() * 5) : 0, negs: screening ? 40 : 0, faMul: 0.7 + 0.5 * R()

    for (let j = 0; j < pr.per; j++) {

        per_patient: pp, verified: { vectors: 100000, mismatches: 0, level: "bit-exact against its model" }, power_uw_est: null,

  const burst = (t % 10) > 7, b = burst ? Math.min(1, ((t % 10) - 7) * 2) * Math.min(1, (10 - (t % 10)) * 3) : 0;

let popEl = null;

  if (popEl && popEl._anchor === anchor) { closePop(); return null; }

function renderSignal(run, force) {
  const v = viewAt(run), d = selDesign(run, v), c = caseOf(run), tr = sigTraces(run, d);
  const sig = (d ? d.channels : 0) + "";
  if (!force && sig === cur.sig) return; cur.sig = sig;
  if (sig2d) { cancelAnimationFrame(sig2d.raf); sig2d = null; }
  const what = run.case === "incubator" ? ["Breathing on the radar and the warm-cool rhythm at the nostrils on the thermal camera; the heart rate comes from the radar.", "Breathing that stops, then a falling heart rate.", "An apnoea or bradycardia alarm, shown here by the shaded band."]
    : run.case === "af" ? ["One ECG lead from the patch.", "Beats that come at irregular intervals with no P wave before them.", "A recording is flagged as AF when that pattern holds."]
    : run.case === "neonatal-eeg" ? [`${d ? budgetLabel(run, d.channels) : "EEG channels"} from the scalp.`, "Rhythmic, growing spikes that are not there in the background.", "A seizure alarm, shown here by the shaded band."]
    : ["The signals named in your brief.", "The event named in your brief.", "An alarm, shown by the shaded band."];
  $("#body").innerHTML = `<div class="vis">${tabHead(run, "What the chip watches", "")}
    <div class="stage"><div class="sgl"><div class="cvw"><canvas class="sigc" id="sigc" role="img" aria-label="Illustration of the ${esc(c.who === "recording" ? "ECG" : "sensor")} signals with an event every 16 seconds"></canvas></div>
      <div class="sexp"><h3>${esc(run.case === "custom" ? (run.detect || "Your event") : CASES[run.case].detect)}</h3><ol>
        <li><i>1</i><span><b>What the sensors see</b>${what[0]}</span></li><li class="w"><i>2</i><span><b>What the chip looks for</b>${what[1]}</span></li><li class="e"><i>3</i><span><b>What it does</b>${what[2]}</span></li></ol>
        <p class="sn2">An illustration drawn from a simple formula, not a recording and not this design's output. The figures for this design are on the Overview.</p></div></div></div></div>`;
  const cv = $("#sigc"), g = cv.getContext("2d"), span = 8, t0 = performance.now() / 1000;
  const draw = () => {
    if (!cv.isConnected) return;
    const W = cv.clientWidth, H = cv.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const t = RM ? 11 : performance.now() / 1000 - t0 + 4, n = tr.length, lh = (H - 30) / n;
    // the shaded event band, where it is on screen
    for (let k = Math.floor((t - span) / 16) - 1; k <= Math.floor(t / 16) + 1; k++) {
      const a = k * 16 + 8, b = k * 16 + 13.5, xa = (a - (t - span)) / span * W, xb = (b - (t - span)) / span * W;
      if (xb < 0 || xa > W) continue;
      g.fillStyle = "rgb(194 54 43 / .07)"; g.fillRect(Math.max(0, xa), 0, Math.min(W, xb) - Math.max(0, xa), H - 22);
      const al = xa + 1.6 / span * W; if (al > 0 && al < W) { g.strokeStyle = "#c2362b"; g.lineWidth = 1.5; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(al, 0); g.lineTo(al, H - 22); g.stroke(); g.setLineDash([]); g.fillStyle = "#9f2a20"; g.font = "600 12px Inter, system-ui, sans-serif"; g.textAlign = "left"; g.fillText("Chip alarm", al + 5, H - 28); }
    }
    tr.forEach((s, j) => {
      const mid = 18 + lh * j + lh / 2, amp = lh * 0.32;
      g.fillStyle = "#262c40"; g.font = "600 12px Inter, system-ui, sans-serif"; g.textAlign = "left"; g.fillText(s.n, 4, 18 + lh * j + 12);
      g.strokeStyle = "#1d4ed8"; g.lineWidth = 1.4; g.beginPath();
      const N = Math.max(200, Math.floor(W * 1.5));
      for (let q = 0; q <= N; q++) { const x = q / N * W, y = clamp(mid - sigVal(s.f, s.i || 0, t - span + span * q / N) * amp, 18 + lh * j + 16, 18 + lh * (j + 1)); q ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    });
    g.fillStyle = "#4a5062"; g.font = "500 11.5px Inter, system-ui, sans-serif"; g.textAlign = "right"; g.fillText("last 8 seconds, simulated illustration", W - 4, H - 6);
    if (!RM && sig2d) sig2d.raf = requestAnimationFrame(draw);
  };
  sig2d = { raf: 0 }; draw();
}

// CHIP: the selected design on a board, in 3D (three.js loads only here)
function renderChipTab(run, force) {
  const v = viewAt(run), d = selDesign(run, v), c = caseOf(run);
  if (!force) { if (E.view && d && E.view.st.gates !== d.gates) { E.view.update(d); const k = $("#chipK"); if (k) k.innerHTML = chipCard(run, v, d); } return; }
  $("#body").innerHTML = `<div class="vis">${tabHead(run, d ? `Design ${esc(d.id)}: ${fmt(d.gates)} gates` : "The chip", d ? `${esc(budgetLabel(run, d.channels))}, logic depth ${d.depth}. Drag to turn it.` : "The chip appears once the first designs are checked.")}
    <div class="stage s3"><div class="g3" id="g3"></div><div class="ccard cmodel" id="chipK" style="left:14px;top:14px">${chipCard(run, v, d)}</div></div>
    <p class="vf">A drawing: the die's pattern grows with the gate count, but the layout is illustrative, not a place-and-route result. ${run.case === "af" ? "" : "Power figures are not estimated in this version."}</p></div>`;
  mount3D($("#g3"), "chip-" + (c.kind3d || "electrode"), L => buildChip(L, c.kind3d || "electrode"), view => view.update(d), () => `<svg class="v" viewBox="0 0 200 120"><rect x="60" y="20" width="80" height="80" rx="6" fill="#1a2338"/><text x="100" y="64" fill="#fff" font-size="12" text-anchor="middle">${d ? fmt(d.gates) + " gates" : ""}</text></svg>`);
}
function chipCard(run, v, d) {
  if (!d) return `<div class="k">No design yet</div>`;
  const isCh = v.ev.chosen && v.ev.chosen.id === d.id;
  return `<div class="k">${isCh ? "The chosen chip" : run.case === "af" ? "The measured circuit" : "Selected design"}</div><div class="big">${fmt(d.gates)} gates</div><span>Logic depth ${d.depth}. ${d.verified ? `${fmt(d.verified.vectors)} ${run.case === "af" ? "test windows" : "test vectors"}, ${d.verified.mismatches} mismatches against its model.` : ""}</span>`;
}

// CHAT: the run's steps as the demo plays them, and notes the user adds
function chatEvents(run) {
  const v = viewAt(run), c = caseOf(run), pr = preset(run.preset), ev = [], tl = v.tl;
  const tg = run.targets.length ? andList(run.targets.map(t => `${MET[t.metric].name.toLowerCase()} ${fmtTarget(t)}`)) : "no targets yet";
  if (run.source === "measured") {
    ev.push({ t: 0, k: "spec", txt: `This is the measured AF feasibility run on ${DS.cinc17.name}: ${fmt(5788)} recordings split by recording, ${fmt(800)} held out for testing, ${fmt(96)} of them with AF.` });
    ev.push({ t: 0, k: "check", txt: `One circuit was compiled: ${fmt(AF_DESIGN.gates)} gates, longest path ${AF_DESIGN.depth} cells. It matched its own model on ${fmt(3880)} of ${fmt(3880)} test windows, with 0 mismatches.` });
    ev.push({ t: 0, k: "report", txt: `Against your targets (${tg}): sensitivity ${fmtVal("sensitivity", AF_DESIGN.metrics.sensitivity_pooled)} and specificity ${fmtVal("specificity", AF_DESIGN.metrics.specificity)} per recording. The full-precision model reached ${fmtVal("sensitivity", AF_BASE.sensitivity_pooled)} and ${fmtVal("specificity", AF_BASE.specificity)}, so the shortfall is a model gap, not a hardware gap.` });
    ev.push({ t: 0, k: "report", txt: `Search speed, measured: about ${fmt(AF_SPEED.batched)} candidates a minute in batches of ${AF_SPEED.k}, against about ${AF_SPEED.single} one at a time.` });
  } else {
    ev.push({ t: 0, k: "spec", txt: `Brief read. Device: ${run.device || "not given"}. Signal: ${run.signal || "not given"}. Detects: ${run.detect || "not given"}. Targets: ${tg}.` });
    for (const ro of tl.rounds) {
      const info = v.D.rounds[ro.r - 1];
      ev.push({ t: ro.start, k: "propose", txt: `Round ${ro.r} of ${pr.rounds}: ${fmt(pr.cands)} designs proposed${ro.r > 1 ? ", more of them near the sizes where the last round crossed your bar" : ""}.` });
      ev.push({ t: ro.train, k: "train", txt: `Round ${ro.r}: ${fmt(info.trained)} designs trained together; ${fmt(info.passed)} passed validation. The best ${pr.per} are compiled to gates and checked on unseen ${c.whoP}.` });
      const upto = v.all.filter(d => d.round <= ro.r), e2 = evaluate(run, upto);
      ev.push({ t: ro.end, k: "check", txt: `Round ${ro.r} checked. ${fmt(e2.pass.size)} of ${fmt(upto.length)} designs so far clear every target. ${e2.chosen ? `Smallest so far: ${fmt(e2.chosen.gates)} gates, ${budgetLabel(run, e2.chosen.channels).toLowerCase()}.` : "None clears every target yet."}` });
    }
    const fe = evaluate(run, v.all);
    ev.push({ t: v.T, k: "report", txt: fe.chosen ? `Done. The smallest design that clears every target is ${fe.chosen.id}: ${fmt(fe.chosen.gates)} gates, ${budgetLabel(run, fe.chosen.channels).toLowerCase()}. The chart shows what each smaller design gives up.` : "Done. No design in this family clears your bar on this data; the nearest designs are ringed on the chart." });
  }
  for (const n of run.notes || []) { ev.push({ t: n.t, k: "you", txt: n.text }); ev.push({ t: n.t + 0.001, k: "reply", txt: "Noted with the run. In this simulated demo a note does not change the designs, and no model was called." }); }
  return ev.filter(e => e.t <= v.t + 1e-6 || run.source === "measured").sort((a, b) => a.t - b.t);
}
const CHAT_K = { spec: ["file", "#2b55d0"], propose: ["bulb", "#6b46c1"], train: ["flask", "#a04812"], check: ["chip", "#0f7a55"], report: ["check", "#141a2e"], reply: ["check", "#4a5062"] };
function renderChat(run, force) {
  const evs = chatEvents(run), sig = evs.length + "";
  if (!force && sig === cur.sig) return;
  const first = force || !$("#feed"); cur.sig = sig;
  const html = evs.map(e => e.k === "you" ? `<div class="you"><p>${esc(e.txt)}</p></div>` : `<div class="msg" style="--rc:${CHAT_K[e.k][1]}"><span class="mav" style="background:${CHAT_K[e.k][1]}1a;color:${CHAT_K[e.k][1]}">${I(CHAT_K[e.k][0])}</span><div><div class="who">${APP.name}<span class="when">${run.source === "measured" ? "measured run" : clock(e.t)}</span></div><div class="mt">${esc(e.txt)}</div></div></div>`).join("");
  if (first) {
    $("#body").innerHTML = `<div class="chat"><div class="feed" id="feed"><div class="fin"><p class="cnote2">${isSim(run) ? `This simulated run narrates its own steps. No model was called; ${esc(agentLabel(run.agent))} is the label the run started with.` : "The measured run's results, as recorded."}</p><div id="msgs">${html}</div></div></div>
      <div class="comp"><div class="box"><textarea id="note" rows="1" aria-label="Add a note to this run" placeholder="Add a note to this run" data-voice></textarea><button class="send" id="sendN" aria-label="Add note">${I("up")}</button></div></div></div>`;
    const ta = $("#note"), sb = $("#sendN");
    ta.addEventListener("input", () => sb.classList.toggle("ready", !!ta.value.trim()));
    const send = () => { const t = ta.value.trim(); if (!t) return; (run.notes = run.notes || []).push({ t: run.source === "measured" ? 0 : viewAt(run).t, text: t }); ta.value = ""; sb.classList.remove("ready"); saveRuns(); renderChat(run, false); };
    sb.onclick = send; ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  } else $("#msgs").innerHTML = html;
  const f = $("#feed"); f.scrollTop = f.scrollHeight;
}

// SOURCES: datasets, split, how the numbers are made, and the marks used for numbers
function simModelText() {
  return `<p class="sk">Each round draws a few hundred designs. Each gets a channel budget, a gate count spread evenly on a log scale (later rounds also try more designs near where earlier ones crossed the bar) and an efficiency between 0 and 1. Its chance of catching an event rises with gates along a saturating curve whose ceiling depends on the channel budget, less a penalty for low efficiency. Each of 12 unseen ${"patients"} has a fixed difficulty; every event is drawn caught or missed, and false alarms are drawn as a count over each one's hours. Every figure on the page (worst patient, pooled, pass or fail, the chosen chip, the funnel) is computed from those per-patient tallies. The draws come from the run's seed, so the same run always shows the same designs.</p>`;
}
function sourcesHTML(run) {
  const c = caseOf(run), file = run.case === "neonatal-eeg" && MEASURED.eeg;
  const dsl = file && Array.isArray(file.datasets) ? file.datasets : (run.case === "custom" ? [] : CASES[run.case].datasets.map(k => DS[k]));
  const dsH = dsl.length ? dsl.map(x => `<div class="src"><div class="sn">${esc(x.name)}<span class="mk no">${esc(x.licence || "")}</span></div><div class="sw2">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url.replace(/^https:\/\//, ""))}</a>` : ""}${x.subjects ? ` · ${esc(x.subjects)}` : ""}</div><p class="sk">${esc(x.credit || "")}</p></div>`).join("") : `<p class="sk">No dataset: this run is simulated from the fields of your brief.</p>`;
  const how = run.source === "measured" ? `<p class="sk">Measured. One circuit was compiled from a model trained on the training recordings and run on the ${fmt(800)} held-out test recordings. The full-precision model's figures are shown as a reference line, not as a chip. Funnel counts were not recorded in this run, so none are shown.</p>`
    : file ? `<p class="sk">Measured on open data, from the results file for this case. ${esc(file.notes || "")}</p>` : simModelText();
  return `<div class="srcp"><h4>Data</h4>${dsH}<h4>Split</h4><p class="sk">${esc(file && file.split ? file.split : run.case === "custom" ? "Split by patient: 12 simulated patients are held out; no design trains on them." : CASES[run.case].split)}</p>
    <h4>How these numbers are made</h4>${how}
    <h4>How numbers are marked</h4><ul><li>Measured values are plain text.</li><li>${estSpan("Estimates", "An example of the estimate style")} are italic with a dotted underline; hover one to see its assumption.</li><li>Simulated runs carry the badge “Simulated run, demo data” and a small <span class="mk sim">simulated</span> mark on the chart and tiles.</li></ul>
    <p class="credit">Built at the SoTA Scientific Parallelism Hackathon, London, November 2026. Supported by Callosum, Inherent Labs, ARIA and Fractile.</p></div>`;
}
function openSources(run) {
  closeDrawer(); closePop();
  const s = document.createElement("div"); s.className = "dscrim"; s.onclick = closeDrawer; document.body.appendChild(s);
  const d = document.createElement("aside"); d.className = "drawer"; d.setAttribute("role", "dialog"); d.setAttribute("aria-label", "Where this comes from");
  d.innerHTML = `<div class="dh"><h3>Where this comes from</h3><button aria-label="Close">${I("x", "s16")}</button></div><div class="db">${sourcesHTML(run)}</div>`;
  d.querySelector(".dh button").onclick = closeDrawer;
  document.body.appendChild(d); drawerEl = d; d.querySelector(".dh button").focus();
}
function renderSourcesTab(run, force) {
  if (!force) return;
  $("#body").innerHTML = `<div class="vis srcpage">${tabHead(run, "Where this comes from", "")}${sourcesHTML(run)}</div>`;
}

/* ---------------- 11. CONFIGURE ---------------- */
const CFG_STORE = "chipin-i1-cfg";
function saveCfg() { try { sessionStorage.setItem(CFG_STORE, JSON.stringify(cfg)); } catch (e) { /* storage may be off */ } }
function renderConfigure() {
  setBadge(null);
  $("#main").innerHTML = `<div class="body"><div class="cfg"><h1>Configure</h1><p class="lead2">Defaults for new runs. Runs already started keep their own settings.</p>
    <div class="cpanel">
      <div class="crow2"><div class="l"><b>Preset</b><span>How many rounds and designs a new run tries</span></div>${presetPillHTML(cfg.preset)}</div>
      <div class="crow2"><div class="l"><b>Agent</b><span>The backend and model a new run is labelled with</span></div>${agentPillHTML(cfg.agent)}</div>
      <div class="crow2"><div class="l"><b>Judge on the worst ${"patient"}</b><span>Off: judge on all unseen patients pooled</span></div><button class="sw" role="switch" id="swJ" aria-checked="${cfg.judge === "worst"}" aria-label="Judge on the worst patient"></button></div>
      <div class="crow2"><div class="l"><b>Largest chip to try</b><span>The gate count new runs search up to</span></div><select id="gb" aria-label="Largest chip to try">${[4000, 8000, 12000].map(n => `<option value="${n}"${cfg.gateBudget === n ? " selected" : ""}>${fmt(n)} gates</option>`).join("")}</select></div>
    </div></div></div>`;
  $("#pPre").onclick = e => presetPopover(e.currentTarget, cfg.preset, v => { cfg.preset = v; saveCfg(); renderConfigure(); });
  $("#pAg").onclick = e => agentPopover(e.currentTarget, cfg.agent, v => { cfg.agent = ensureModel(v); saveCfg(); renderConfigure(); });
  $("#swJ").onclick = () => { cfg.judge = cfg.judge === "worst" ? "pooled" : "worst"; saveCfg(); renderConfigure(); };
  $("#gb").onchange = e => { cfg.gateBudget = +e.target.value; saveCfg(); };
}

/* ---------------- 11. ROUTING, RENDER LOOP, START-UP ---------------- */
let runs = [];
let route = { page: "start" };
const findRun = id => runs.find(r => r.id === id);
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!h.length) return { page: "start" };
  if (h[0] === "new") return SPEC ? { page: "new" } : { page: "start" };
  if (h[0] === "configure") return { page: "configure" };
  if (h[0] === "run" && findRun(h[1])) {
    let v = h[2] === "visual" ? h[3] : h[2];
    if (!VIEWS.some(([k]) => k === v)) v = "overview";
    return { page: "run", id: h[1], view: v };
  }
  return { page: "start" };
}
function go(h) { if (location.hash === h) render(); else location.hash = h; }
function render() {
  closePop(); closeModal(); closeDrawer();
  route = parseRoute();
  document.body.classList.remove("drawer"); $(".scrim")?.remove();
  renderSidebar(true);
  if (route.page !== "run") { teardown(); cur = { id: null, view: null, sig: "" }; }
  if (route.page === "start") { setBadge(null); renderStart(); }
  else if (route.page === "new") { setBadge(null); renderSpec(); }
  else if (route.page === "configure") renderConfigure();
  else renderRun();
}
function tick() {
  renderSidebar();
  if (route.page !== "run") return;
  const run = findRun(route.id); if (!run || !$("#body")) return;
  updTop(run);
  if (route.view === "overview") updOverview(run);
  else renderView(run, false);
}
addEventListener("hashchange", render);
addEventListener("resize", () => { if (route.page === "run" && route.view === "overview") { cur.chartSig = ""; const r = findRun(route.id); if (r) drawChart(r, viewAt(r)); } closePop(); });

// the three demo runs, then any runs and edits from this tab's session
const CANNED = [
  { id: "incubator-watch", case: "incubator", preset: "Pro", finished: true, canned: true },
  { id: "neonatal-eeg", case: "neonatal-eeg", preset: "Pro", finished: true, canned: true },
  { id: "af-patch", case: "af", finished: true, canned: true }
];
function initRuns() {
  try { const c = JSON.parse(sessionStorage.getItem(CFG_STORE) || "null"); if (c) { Object.assign(cfg, c); ensureModel(cfg.agent); } } catch (e) { /* defaults */ }
  const saved = loadRuns() || [];
  const keep = saved.filter(o => o && o.id && (o.case === "custom" || CASES[o.case])).map(o => { if (o.agent) ensureModel(o.agent); const r = makeRun({ ...o, ui: { sel: o.sel || null } }); delete r.sel; return r; });
  for (const c of CANNED) if (!keep.some(r => r.id === c.id)) keep.push(makeRun(c));
  // demo runs stay at the bottom of Recents in their fixed order; the user's runs are above them
  runs = [...keep.filter(r => !r.canned), ...CANNED.map(c => keep.find(r => r.id === c.id))];
}
// an optional measured results file for the neonatal EEG case; missing today, which is fine
function loadMeasured() {
  fetch("../data/neonatal-eeg.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => {
    if (!j || !Array.isArray(j.designs) || !j.designs.length) return;
    j.designs.forEach(d => { d.source = "measured"; });
    MEASURED.eeg = j;
    for (const r of runs) if (r.case === "neonatal-eeg") { delete r._d; delete r._tl; if (j.primary && MET[j.primary]) r.primary = j.primary; }
    viewCache = new WeakMap(); render();
  }).catch(() => { /* no file: the simulated cloud stays, marked simulated */ });
}
initRuns();
renderMobileHead();
render();
loadMeasured();
setInterval(tick, 250);
</script>
