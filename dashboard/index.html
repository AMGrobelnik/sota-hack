<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChipIn dashboard, round 5</title>
<style>
  :root { color-scheme: dark; --bar: 44px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed; font: 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #14171c; border-bottom: 1px solid #262b33; z-index: 2; }
  #bar button { width: 32px; height: 28px; border: 1px solid #333a45; border-radius: 6px; background: #1c2027; color: inherit; font-size: 16px; cursor: pointer; }
  #bar button:hover { background: #262b33; }
  #bar button:focus-visible, #bar a:focus-visible { outline: 2px solid #6aa9ff; outline-offset: 2px; }
  #label { min-width: 0; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #label b { font-weight: 600; margin-right: 8px; color: #9aa4b2; }
  #dots { display: flex; gap: 4px; }
  #dots button { width: 24px !important; font-size: 12px !important; }
  #dots button.on { border-color: #6aa9ff; color: #8ab4ff; }
  #dots button:disabled { opacity: .35; cursor: default; }
  #tag { color: #9aa4b2; white-space: nowrap; }
  .rl { color: #6b7686; font-size: 12px; text-decoration: none; white-space: nowrap; }
  .rl:hover { text-decoration: underline; }
  #alone, #back, #card a { color: #8ab4ff; text-decoration: none; white-space: nowrap; }
  #alone:hover, #back:hover, #card a:hover { text-decoration: underline; }
  #stage { position: fixed; inset: var(--bar) 0 0 0; }
  #card { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  #card[hidden] { display: none; }
  #card > div { border: 1px solid #333a45; border-radius: 12px; padding: 32px 48px; background: #14171c; }
  #card h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
  #card p { margin: 0; color: #9aa4b2; line-height: 1.5; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="bar">
  <button id="prev" aria-label="Previous variant" aria-keyshortcuts="ArrowLeft">&#8592;</button>
  <div id="dots" role="group" aria-label="Variants"></div>
  <div id="label" aria-live="polite"></div>
  <button id="next" aria-label="Next variant" aria-keyshortcuts="ArrowRight">&#8594;</button>
  <span id="tag">ChipIn</span>
  <a id="alone" target="_blank" rel="noopener" hidden>open alone</a>
  <a class="rl" href="round4/">round 4</a>
  <a class="rl" href="round3/">round 3</a>
  <a class="rl" href="round2/">round 2</a>
  <a class="rl" href="round1/">round 1</a>
  <a id="back" href="../">landing pages</a>
</div>
<div id="stage"><iframe id="frame" title="Variant" hidden></iframe><div id="card"><div><h1>Checking which variants are ready</h1><p>One moment.</p></div></div></div>
<script>
(function () {
  var VARIANTS = [
    { key: "h1", name: "What it does for a patient" },
    { key: "h2", name: "Work in the middle" },
    { key: "h3", name: "One clear screen" },
    { key: "h4", name: "Why it works" },
    { key: "h5", name: "Show your working" }
  ];
  var frame = document.getElementById("frame");
  var label = document.getElementById("label");
  var alone = document.getElementById("alone");
  var dots = document.getElementById("dots");
  var card = document.getElementById("card");
  var idx = -1, checked = false;

  function fromHash() {
    var n = parseInt(location.hash.replace("#", ""), 10);
    return n >= 1 && n <= VARIANTS.length && VARIANTS[n - 1].ok ? n - 1 : -1;
  }
  function firstReady() { for (var i = 0; i < VARIANTS.length; i++) if (VARIANTS[i].ok) return i; return -1; }
  function step(from, d) {
    var n = VARIANTS.length;
    for (var k = 1; k <= n; k++) { var j = ((from + d * k) % n + n) % n; if (VARIANTS[j].ok) return j; }
    return -1;
  }
  function buildDots() {
    dots.innerHTML = "";
    VARIANTS.forEach(function (v, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = String(i + 1);
      b.disabled = !v.ok;
      b.title = v.ok ? v.name : v.name + " (being built)";
      b.setAttribute("aria-label", b.title);
      b.addEventListener("click", function () { go(i); });
      v.btn = b; dots.appendChild(b);
    });
  }
  function render() {
    VARIANTS.forEach(function (v, i) { if (v.btn) v.btn.classList.toggle("on", i === idx); });
    label.innerHTML = "";
    if (!checked) return;
    if (idx < 0) {
      label.appendChild(document.createTextNode("No round 5 pages yet"));
      card.hidden = false; frame.hidden = true; alone.hidden = true;
      card.querySelector("h1").textContent = "Round 5 is being built";
      var p = card.querySelector("p");
      p.textContent = "None of the five pages is ready yet. ";
      var a = document.createElement("a"); a.href = "round4/"; a.textContent = "See round 4"; p.appendChild(a);
      document.title = "ChipIn dashboard, round 5";
      return;
    }
    var v = VARIANTS[idx], url = "variants/" + v.key + ".html";
    var b = document.createElement("b");
    b.textContent = (idx + 1) + " / " + VARIANTS.length;
    label.appendChild(b);
    label.appendChild(document.createTextNode(v.name));
    card.hidden = true; frame.hidden = false;
    alone.href = url; alone.hidden = false;
    document.title = (idx + 1) + " " + v.name + " - ChipIn dashboard, round 5";
    if (frame.getAttribute("src") !== url) frame.src = url;
  }
  function go(n) {
    if (n < 0 || n >= VARIANTS.length || !VARIANTS[n].ok) return;
    idx = n;
    var h = "#" + (idx + 1);
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
    render();
  }
  function move(d) { if (idx < 0) return; var j = step(idx, d); if (j >= 0) go(j); }
  function typing(el) {
    return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  }
  function onKey(e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || typing(e.target)) return;
    if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowLeft") move(-1);
    else return;
    e.preventDefault();
  }
  function hookFrame() {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      doc.addEventListener("keydown", onKey);
      var links = doc.querySelectorAll("a[href]");
      for (var i = 0; i < links.length; i++) {
        var h = links[i].getAttribute("href");
        if (h && h.indexOf("../") === 0) links[i].target = "_top";
      }
    } catch (err) { /* cross-origin: leave the variant alone */ }
  }
  function probe(v) {
    return fetch("variants/" + v.key + ".html", { cache: "no-store" })
      .then(function (r) { v.ok = r.ok; }, function () { v.ok = false; });
  }
  document.getElementById("prev").addEventListener("click", function () { move(-1); });
  document.getElementById("next").addEventListener("click", function () { move(1); });
  document.addEventListener("keydown", onKey);
  frame.addEventListener("load", hookFrame);
  window.addEventListener("hashchange", function () { var n = fromHash(); if (n >= 0) go(n); });
  buildDots();
  Promise.all(VARIANTS.map(probe)).then(function () {
    checked = true; buildDots();
    var n = fromHash(); if (n < 0) n = firstReady();
    if (n >= 0) go(n); else render();
  });
})();
</script>
</body>
</html>
