<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C3D2F2">
<meta name="color-scheme" content="light">
<title>Join the waitlist</title>
<meta name="description" content="Join the waitlist. Describe a medical sensing device; AI scientists design the chip at its core.">
<style>
/* The join page. The landing variants' tokens: navy and coral on the lavender-to-peach sky,
   Futura headings, Avenir text. One column, one form, one moment: the chip lights up when you join. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; color-scheme: light; background: var(--paper); }
[hidden] { display: none !important; }
:root {
  --ink: #13214B;
  --ink-2: #45507A;
  --coral: #FF5E57;
  --coral-deep: #C2332F;
  --coral-tint: #FFE6E1;
  --paper: #F4F5FB;
  --line: rgba(19, 33, 75, .16);
  --bar: 64px;
  --display: Futura, "Futura PT", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
  --text: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  --shadow: 0 1px 2px rgba(19, 33, 75, .08), 0 22px 44px -22px rgba(19, 33, 75, .45);
  --gutter: clamp(20px, 5vw, 72px);
  --r-lg: 22px; --r-sm: 12px;
}
body {
  margin: 0; min-height: 100vh; min-height: 100svh; color: var(--ink); font: 400 16px/1.5 var(--text);
  background: linear-gradient(180deg, #A9BEEB 0%, #C3D2F2 22%, #E2DFF3 48%, #FFE3D6 72%, #F7ECEA 88%, var(--paper) 100%);
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; z-index: -1; right: 6%; top: 62%; width: clamp(420px, 40vw, 900px); aspect-ratio: 1; transform: translate(50%, -50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(255, 204, 182, .9), rgba(255, 214, 196, .5) 45%, rgba(255, 226, 214, 0)); }
a { color: var(--ink); }
:focus-visible { outline: 3px solid var(--coral-deep); outline-offset: 3px; }
a:focus-visible { border-radius: 4px; }

.bar { height: var(--bar); padding: 0 var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink); text-decoration: none; font: 700 20px/1 var(--display); letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 15px; text-decoration: underline; text-decoration-color: rgba(19, 33, 75, .3); text-underline-offset: 4px; }
@media (hover: hover) and (pointer: fine) { .back:hover { text-decoration-color: currentColor; } }

main { padding: clamp(24px, 6vh, 72px) var(--gutter) 72px; display: flex; justify-content: center; }
.col { width: 100%; max-width: 560px; }
h1 { margin: 0; font: 700 clamp(40px, 5.4vw, 72px)/1.02 var(--display); letter-spacing: -.022em; text-wrap: balance; }
.lede { margin: 18px 0 0; max-width: 34ch; font-size: clamp(17px, .4vw + 15px, 21px); line-height: 1.4; font-weight: 500; text-wrap: balance; }

/* the count: only ever a real number from the store */
.count { display: inline-flex; align-items: center; gap: 10px; margin: 18px 0 0; padding: 7px 14px 7px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, .62); box-shadow: 0 0 0 1px rgba(19, 33, 75, .08); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.count::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 4px rgba(255, 94, 87, .2); }

.card { margin-top: clamp(28px, 5vh, 44px); padding: clamp(22px, 4vw, 36px); border-radius: var(--r-lg);
  background: rgba(255, 255, 255, .84); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); box-shadow: var(--shadow); }
.field + .field { margin-top: 20px; }
label { display: block; font-weight: 600; font-size: 15px; }
label .opt { font-weight: 400; color: var(--ink-2); }
input { display: block; width: 100%; margin-top: 8px; min-height: 52px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: var(--r-sm);
  background: #fff; color: var(--ink); font: 400 17px/1.2 var(--text); transition: border-color .15s ease, box-shadow .15s ease; }
input::placeholder { color: #7D84A3; }
input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px rgba(19, 33, 75, .14); }
input[aria-invalid="true"] { border-color: var(--coral-deep); }
input[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px rgba(194, 51, 47, .18); }
.err { margin: 6px 0 0; color: var(--coral-deep); font-size: 14px; font-weight: 600; }

.go { margin-top: 28px; }
.btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: 0 28px; border: 0; border-radius: var(--r-sm);
  background: var(--ink); color: #fff; font: 600 17px/1 var(--text); letter-spacing: .005em; cursor: pointer; text-decoration: none;
  box-shadow: 0 14px 30px -14px rgba(19, 33, 75, .7); transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease; }
@media (hover: hover) and (pointer: fine) { .btn:not(:disabled):hover { background: #22336A; transform: translateY(-1px); } }
.btn:not(:disabled):active { transform: translateY(1px); }
.btn:disabled { background: #8E95B1; box-shadow: none; cursor: not-allowed; }
.btn[aria-busy="true"] { cursor: progress; }
.state { margin: 14px 0 0; font-weight: 600; font-size: 15px; }
.state.closed { color: var(--ink); }
.state.closed::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: var(--coral); vertical-align: 1px; }
.state.fail { color: var(--coral-deep); }
.fine { margin: 14px 0 0; color: var(--ink-2); font-size: 14px; }

/* the thank-you state: the chip's core lights */
.done { text-align: center; }
.done:focus { outline: none; }
.done .chip { width: 96px; height: 96px; margin: 4px auto 0; display: block; }
.done .core { fill: var(--ink); transition: fill .6s ease .15s; }
.done.lit .core { fill: var(--coral); }
.done .glow { opacity: 0; transform-origin: 48px 48px; transform: scale(.6); transition: opacity .6s ease .15s, transform .8s cubic-bezier(.2, .8, .2, 1) .15s; }
.done.lit .glow { opacity: 1; transform: scale(1); }
.done h2 { margin: 18px 0 0; font: 700 clamp(30px, 3.6vw, 44px)/1.08 var(--display); letter-spacing: -.02em; }
.done p { margin: 12px auto 0; max-width: 36ch; }
.done .count { margin-top: 20px; }
.done .back { margin-top: 20px; }

@media (max-width: 520px) {
  .bar { padding: 0 20px; }
  .brand { font-size: 18px; }
  main { padding: 20px 20px 56px; }
  .card { margin-left: -4px; margin-right: -4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<script>
  /* the working name, as in the landing variants */
  window.SITE_NAME = 'Chipmonk';
  document.title = 'Join the waitlist: ' + window.SITE_NAME;
</script>
<header class="bar">
  <a class="brand" href="./" data-back>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <g stroke="#13214B" stroke-width="2" stroke-linecap="round"><path d="M11 3v4M16 3v4M21 3v4M11 25v4M16 25v4M21 25v4M3 11h4M3 16h4M3 21h4M25 11h4M25 16h4M25 21h4"/></g>
      <rect x="7" y="7" width="18" height="18" rx="4" fill="#13214B"/>
      <rect x="11.5" y="11.5" width="9" height="9" rx="2" fill="#FF5E57"/>
      <circle cx="10.2" cy="10.2" r="1.1" fill="#fff"/>
    </svg>
    <span data-name></span>
  </a>
  <a class="back" href="./" data-back>Back to the page</a>
</header>

<main>
  <div class="col">
    <section id="join" aria-labelledby="join-h">
      <h1 id="join-h">Join the waitlist</h1>
      <p class="lede">Describe a medical sensing device. AI scientists design the chip at its core.</p>
      <p class="count" data-waitlist-wrap hidden><span data-waitlist-count></span></p>

      <form class="card" id="form" novalidate>
        <div class="field">
          <label for="f-name">Name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required maxlength="120" aria-describedby="e-name">
          <p class="err" id="e-name" hidden></p>
        </div>
        <div class="field">
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="200" aria-describedby="e-email">
          <p class="err" id="e-email" hidden></p>
        </div>
        <div class="field">
          <label for="f-org">Organisation <span class="opt">(optional)</span></label>
          <input id="f-org" name="organisation" type="text" autocomplete="organization" maxlength="160">
        </div>
        <div class="field">
          <label for="f-build">What would you design? <span class="opt">(optional)</span></label>
          <input id="f-build" name="build" type="text" maxlength="240" placeholder="A patch that reads heart rhythm">
        </div>
        <div class="go">
          <button class="btn" id="submit" type="submit">Join waitlist</button>
          <p class="state" id="state" role="status" aria-live="polite" hidden></p>
          <p class="fine">We use these details only to contact you about the project.</p>
        </div>
      </form>
    </section>

    <section class="card done" id="done" aria-labelledby="done-h" tabindex="-1" hidden>
      <svg class="chip" viewBox="0 0 96 96" aria-hidden="true">
        <circle class="glow" cx="48" cy="48" r="46" fill="rgba(255, 94, 87, .16)"/>
        <g stroke="#13214B" stroke-width="4" stroke-linecap="round"><path d="M36 14v10M48 14v10M60 14v10M36 72v10M48 72v10M60 72v10M14 36h10M14 48h10M14 60h10M72 36h10M72 48h10M72 60h10"/></g>
        <rect x="24" y="24" width="48" height="48" rx="10" fill="#13214B"/>
        <rect class="core" x="36" y="36" width="24" height="24" rx="5"/>
        <circle cx="31" cy="31" r="2.6" fill="#fff"/>
      </svg>
      <h2 id="done-h">You are on the waitlist</h2>
      <p>We will write to <strong id="done-email"></strong> when <span data-name></span> opens.</p>
      <p class="count" data-waitlist-wrap hidden><span data-waitlist-count></span></p>
      <div><a class="back" href="./" data-back>Back to the page</a></div>
    </section>
  </div>
</main>

<script src="../assets/waitlist-config.js"></script>
<script src="../assets/waitlist.js"></script>
<script>
(function () {
  "use strict";
  document.querySelectorAll("[data-name]").forEach(function (el) { el.textContent = window.SITE_NAME; });

  var params = new URLSearchParams(location.search);
  var vParam = params.get("v") || "";
  var vNum = parseInt(vParam, 10);
  var variant = /^(w([1-9]|10)|y[1-5]|z3)$/.test(vParam) ? vParam : vNum >= 1 && vNum <= 5 ? "v" + vNum : "";
  var MAIN = "z3";
  if (variant) document.querySelectorAll("[data-back]").forEach(function (a) { a.href = variant === MAIN ? "./" : variant + ".html"; });

  var form = document.getElementById("form");
  var submit = document.getElementById("submit");
  var state = document.getElementById("state");
  var done = document.getElementById("done");
  var join = document.getElementById("join");
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var endpoint = window.Waitlist.endpoint();

  function say(text, kind) {
    state.textContent = text;
    state.className = "state " + kind;
    state.hidden = !text;
  }
  if (!endpoint) {
    submit.disabled = true;
    say("The waitlist opens shortly.", "closed");
  }

  function check(input, errId, message) {
    var err = document.getElementById(errId);
    err.textContent = message;
    err.hidden = !message;
    input.setAttribute("aria-invalid", message ? "true" : "false");
    return !message;
  }
  function validate() {
    var name = form.elements.name, email = form.elements.email;
    var okName = check(name, "e-name", name.value.trim() ? "" : "Enter your name.");
    var v = email.value.trim();
    var okEmail = check(email, "e-email", !v ? "Enter your email address." : EMAIL.test(v) ? "" : "Enter an email address like name@example.com.");
    if (!okName) name.focus(); else if (!okEmail) email.focus();
    return okName && okEmail;
  }
  ["name", "email"].forEach(function (k) {
    form.elements[k].addEventListener("input", function () {
      if (this.getAttribute("aria-invalid") === "true") check(this, "e-" + k, "");
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!endpoint || submit.disabled) return;
    if (!validate()) return;
    var body = {
      name: form.elements.name.value.trim(),
      email: form.elements.email.value.trim(),
      organisation: form.elements.organisation.value.trim(),
      build: form.elements.build.value.trim(),
      variant: variant
    };
    submit.disabled = true;
    submit.setAttribute("aria-busy", "true");
    submit.textContent = "Joining";
    say("", "");
    fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("status " + r.status)); })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error("not ok");
        document.getElementById("done-email").textContent = body.email;
        join.hidden = true;
        done.hidden = false;
        window.Waitlist.show(data.count);
        done.focus({ preventScroll: true });
        window.scrollTo(0, 0);
        requestAnimationFrame(function () { requestAnimationFrame(function () { done.classList.add("lit"); }); });
      })
      .catch(function () {
        say("Your details were not sent. Check your connection and press Join waitlist again.", "fail");
      })
      .then(function () {
        submit.disabled = false;
        submit.removeAttribute("aria-busy");
        submit.textContent = "Join waitlist";
      });
  });
})();
</script>
</body>
</html>
