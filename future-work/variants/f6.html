    el('p', 'fine', v, c.source);

        g.stroke();
        if (showLab) {
          g.font = '600 ' + (phone ? 11.5 : 12.5) + 'px ' + F; g.textAlign = 'left'; g.textBaseline = labAbove ? 'alphabetic' : 'middle'; g.fillStyle = flash > 0.3 ? '#dfffee' : '#8fa2b8';
          g.fillText(c.types[type], pad, labAbove ? ly - amp - 7 : ly);
        }
        // the lane into the chip
        var mx = lerp(lx1, cx, 0.5);
        g.strokeStyle = flash > 0 ? 'rgba(91,228,155,' + (0.3 + 0.6 * flash) + ')' : 'rgba(214,228,242,' + (many ? 0.2 : 0.32) + ')'; g.lineWidth = many ? 0.8 : 1.2;
        g.beginPath(); g.moveTo(lx1, ly); g.bezierCurveTo(mx, ly, mx, py, cx - 7, py); g.stroke();
        // data travelling in parallel on every lane
        if (!REDUCED) {
          var u = frac(now * 0.32 + frac(Math.sin(k * 12.9898 + 1.3) * 43758.5453)), bx = Math.pow(1 - u, 3) * lx1 + 3 * Math.pow(1 - u, 2) * u * mx + 3 * (1 - u) * u * u * mx + u * u * u * (cx - 7);
          var by = Math.pow(1 - u, 3) * ly + 3 * Math.pow(1 - u, 2) * u * ly + 3 * (1 - u) * u * u * py + u * u * u * py;

      }
      // the one chip
      g.strokeStyle = STROKE; g.lineWidth = 1.2; g.fillStyle = '#0f1f33'; rrect(g, cx, cy, cs, cs, 10); g.fill(); g.stroke();
      g.strokeStyle = 'rgba(214,228,242,.2)'; pins(g, cx, cy, cs, cs, Math.max(12, cs / 12));
      var frac2 = Math.pow(clamp(shown / MAXN, 0, 1), 0.6), litN = frac2 * glit.length, ip = 12, gc = (cs - ip * 2) / GN, gsz = gc * 0.7;
      var band = REDUCED ? -9 : frac(now / 4.5) * 1.6 - 0.3;
      for (var m = 0; m < glit.length; m++) {
        var tgt = clamp(litN - grank[m], 0, 1);
        glit[m] = REDUCED ? tgt : lerp(glit[m], tgt, 0.15);
        var col = m % GN, row = Math.floor(m / GN), dxb = col / GN - band, sweep = Math.exp(-dxb * dxb * 40) * glit[m];
        g.globalAlpha = 0.5 + 0.5 * glit[m];
        g.fillStyle = glit[m] < 0.02 ? IDLE : mix([46, 64, 92], sweep > 0.5 ? [158, 245, 197] : hash(m) % 7 === 0 ? [63, 191, 127] : [91, 228, 155], Math.max(glit[m], sweep));
        g.fillRect(cx + ip + col * gc + (gc - gsz) / 2, cy + ip + row * gc + (gc - gsz) / 2, gsz, gsz);
      }
      g.globalAlpha = 1;
      // one output: the model's decisions
      var oy = cy + cs / 2, ox1 = Math.min(W - 6, cx + cs + (phone ? 26 : 44));
      g.strokeStyle = GREEN; g.lineWidth = 2; g.beginPath(); g.moveTo(cx + cs + 7, oy); g.lineTo(ox1, oy); g.stroke();
      g.fillStyle = GREEN; g.beginPath(); g.moveTo(ox1, oy); g.lineTo(ox1 - 7, oy - 5); g.lineTo(ox1 - 7, oy + 5); g.closePath(); g.fill();
      g.font = '600 ' + (phone ? 12 : 13.5) + 'px ' + F; g.fillStyle = '#c4d1df'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
      var lx = clamp(cx + cs / 2, 0, W);
      var words = c.chip, tw = g.measureText(words).width;
      if (tw > cs + 50) {
        var cut = words.indexOf(', '), l1 = words.slice(0, cut + 1), l2 = words.slice(cut + 2), w2 = Math.max(g.measureText(l1).width, g.measureText(l2).width);
        var lx2 = Math.min(lx, W - w2 / 2 - 4);
        g.fillText(l1, lx2, cy + cs + 28); g.fillText(l2, lx2, cy + cs + 45);
      } else g.fillText(words, Math.min(lx, W - tw / 2 - 4), cy + cs + 30);
    });
    if (REDUCED) { N = target = shown = STEPN[2]; }
    update();
  }

  /* title and footer */
  var tt = document.getElementById('ttl');
  el('h1', '', tt, C.title.h1); el('p', 'lede', tt, C.title.lede); el('span', 'meas', tt, C.title.pill);
  document.getElementById('foot').textContent = C.footer;
  drawFab(document.getElementById('fab'), C.fab);
  drawRecordings(document.getElementById('recordings'), C.recordings);
  drawSensors(document.getElementById('sensors'), C.sensors);
})();
