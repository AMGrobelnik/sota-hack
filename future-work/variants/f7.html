      // lanes and travelling dots: recordings up into the model while tuning, model down into the chip when done
      [0.25, 0.5, 0.75].forEach(function (f, i) {
        var a = iso(W * (f - 0.5), W * 0.5 - 2), ln = G.lanes[i];
        var x = cx + a[0];
        ln.setAttribute('x1', r1(x)); ln.setAttribute('x2', r1(x));
        ln.setAttribute('y1', r1(cy - 2 * G.gap + a[1] + bobM)); ln.setAttribute('y2', r1(cy + a[1]));
        ln.style.opacity = p > 0.97 ? 1 : 0;
        var d = G.dots[i];
        if (RM || p < 0.97) { d.style.opacity = 0; return; }
        var ph = fr(t / 1.6 + i / 3), y;
        if (!done) y = cy - G.gap + a[1] - ph * G.gap; else y = cy - 2 * G.gap + a[1] + ph * 2 * G.gap;
        d.setAttribute('cx', r1(x)); d.setAttribute('cy', r1(y)); d.style.opacity = r1(Math.sin(ph * Math.PI) * 100) / 100;
      });
    }

    var E = engine(root, S.svg, build, step);
  }

  /* ======================= 3. every sensor, one chip: layers of sensors, one lane each ======================= */
  function drawSensors(root, copy) {
    var S = scaffold(root, copy);
    var MAX = copy.steps[copy.steps.length - 1].n;
    var n = copy.steps[1].n, plates = [], G = null, newest = -1, newAt = -9;

    h('span', 'cl', S.ct, copy.spectrumLabel);
    var spec = h('div', 'spec', S.ct); spec.setAttribute('role', 'group'); spec.setAttribute('aria-label', copy.spectrumLabel);
    var fill = h('span', 'fill', spec);
    var sBtns = copy.steps.map(function (s) {
      var b = h('button', null, spec, s.name); b.type = 'button';
      b.addEventListener('click', function () { setN(s.n); });
      return b;
    });
    var act = h('div', 'act', S.ct);
    var add = h('button', 'btn btn-s', act, '+ ' + copy.add); add.type = 'button';
    add.addEventListener('click', function () { if (n < MAX) setN(n + 1); });
    var far = h('div', 'far', S.ct); far.setAttribute('aria-hidden', 'true');
    h('span', 'meas', far, copy.farPill); h('p', null, far, copy.farNote);

    function stepIndex() { var k = 0; copy.steps.forEach(function (s, i) { if (n >= s.n) k = i; }); return k; }
    function paint() {
      var k = stepIndex();
      sBtns.forEach(function (b, i) { b.classList.toggle('on', i <= k); b.setAttribute('aria-pressed', i === k && copy.steps[i].n === n); });
      fill.style.width = (75 * k / (copy.steps.length - 1)) + '%';
      add.disabled = n >= MAX; add.textContent = n >= MAX ? copy.full : '+ ' + copy.add;
      var isFar = n >= MAX; far.classList.toggle('show', isFar); far.setAttribute('aria-hidden', !isFar);
    }

    function zFor(i, count) {
      if (count === 1) return G.z0 + G.span * 0.42;
      var gap = Math.min(G.W * 0.55, G.span / (count - 1));
      return G.z0 + i * gap;
    }
    function makePlate(i) {
      var P = plate(G.layer, G.W, G.W, { t: n > 10 ? 2 : 3 });
      var o = { P: P, i: i, z: zFor(i, n) + G.span * 0.5, zt: zFor(i, n), op: 0, opt: 1, dying: false, type: i % WAVES.length };
      o.path = el('path', { 'class': 'ln' }, P.art);
      o.lane = el('line', { 'class': 'lane' }, G.lanes);
      o.dot = el('circle', { 'class': 'dot', r: 2.6 }, G.lanes);
      o.lead = el('line', { 'class': 'lead', x1: r1(P.L[0] - 4), y1: r1(P.L[1]), x2: r1(P.L[0] - 14), y2: r1(P.L[1]) }, P.g);
      o.lab = el('text', { 'class': 'lb', x: r1(P.L[0] - 20), y: r1(P.L[1] + 4.5), 'text-anchor': 'end' }, P.g);
      o.lab.textContent = copy.sensors[o.type];
      return o;
    }
    function setN(v) {
      var old = n; n = clamp(v, 1, MAX); paint();
      if (!G) return;
      if (n > old) { for (var i = old; i < n; i++) plates.push(makePlate(i)); newest = n - 1; newAt = performance.now() / 1000; }
      plates.forEach(function (o) { if (o.i >= n) { o.dying = true; o.opt = 0; o.zt = zFor(o.i, Math.max(n, 1)) + G.span * 0.3; } });
      plates.forEach(function (o) { if (!o.dying) o.zt = zFor(o.i, n); });
      if (RM) { plates = plates.filter(function (o) { if (o.dying) { G.layer.removeChild(o.P.g); G.lanes.removeChild(o.lane); G.lanes.removeChild(o.dot); return false; } return true; }); plates.forEach(function (o) { o.z = o.zt; o.op = 1; }); }
      E.kick();
    }

    function build(w, hh) {
      var phone = w < 560;
      var lw = phone ? 104 : 170;
      var W = Math.min((w - lw - 40) / (2 * K), hh * 0.36);
      var cx = lw + 10 + (w - lw - 10) / 2, cy = hh - 22 - W / 2;
      G = { W: W, cx: cx, cy: cy, lw: lw, z0: W * 0.36 + 10, span: hh - W - 30 - (W * 0.36 + 10) - 24 };
      var id = 'sg' + (++uid);
      var defs = el('defs', null, S.svg);
      var pat = el('pattern', { id: id, width: 7, height: 7, patternUnits: 'userSpaceOnUse' }, defs);
      el('rect', { x: 1, y: 1, width: 5, height: 5, rx: 1, fill: '#5be49b' }, pat);
      var chip = plate(S.svg, W, W, { cls: 'chip', t: 10 });
      G.dieR = el('rect', { x: r1(-W * 0.32), y: r1(-W * 0.32), width: r1(W * 0.64), height: r1(W * 0.64), fill: 'url(#' + id + ')', stroke: '#5be49b', 'stroke-width': 1.2, 'vector-effect': 'non-scaling-stroke', rx: 2 }, chip.art);
      G.pins = el('g', null, chip.art);
      G.chip = chip;
      el('line', { 'class': 'lead', x1: r1(chip.L[0] - 4), y1: r1(chip.L[1]), x2: r1(chip.L[0] - 14), y2: r1(chip.L[1]) }, chip.g);
      label(el('g', null, chip.g), chip.L[0] - 20, chip.L[1] + 2, [{ text: copy.chip, cls: 'lb' }, { text: copy.chipSub, cls: 'lb s' }], 'end', lw);
      G.layer = el('g', null, S.svg);
      G.lanes = el('g', null, S.svg);
      G.brk = el('path', { 'class': 'lead', fill: 'none' }, S.svg);
      G.brkT = el('g', null, S.svg);
      G.brkKey = '';
      var keep = n; plates = [];
      for (var i = 0; i < keep; i++) { var o = makePlate(i); o.z = o.zt; o.op = 1; plates.push(o); }
    }

    function step(dt, t) {
      if (!G) return;
      var W = G.W, cx = G.cx, cy = G.cy;
      G.chip.at(cx, cy, 1);
      var many = n > copy.steps[2].n;
      var fresh = RM ? (newest >= 0 ? 1 : 0) : clamp(1 - (performance.now() / 1000 - newAt) / 1.8, 0, 1);
      var tt = RM ? 0.3 : t;
      var alive = plates.filter(function (o) { return !o.dying; });
      G.gapNow = alive.length > 1 ? alive[1].z - alive[0].z : W;
      G.dieR.setAttribute('opacity', r1((0.35 + 0.55 * Math.min(1, alive.length / MAX * 1.6)) * 100) / 100);
      plates.forEach(function (o) {
        o.z = ease(o.z, o.zt, dt, 6); o.op = ease(o.op, o.opt, dt, 7);
        var y = cy - o.z;
        o.P.at(cx, y, o.op);
        // each trace runs along the plate's front-left edge, in the strip the plate above leaves visible
        var band = n === 1 ? W * 0.9 : Math.min(W * 0.6, Math.max(6, G.gapNow - 2));
        var A = band * 0.36, v0 = W / 2 - band / 2;
        o.path.setAttribute('d', pathOf(WAVES[o.type], W, v0, A, tt + o.i * 0.37, n > 10 ? 36 : 60));
        var isNew = o.i === newest && fresh > 0;
        o.path.setAttribute('class', isNew ? 'ln g' : 'ln');
        o.P.g.classList.toggle('hot', isNew);
        o.lab.style.display = many ? 'none' : '';
        o.lead.style.display = many ? 'none' : '';
        // its own lane: from the plate's front-right edge straight down to the chip's pin below
        var count = Math.max(n, 1), f = (o.i + 0.5) / Math.max(count, o.i + 1);
        var a = iso(W / 2, -W / 2 + W * f);
        var x = cx + a[0];
        o.lane.setAttribute('x1', r1(x)); o.lane.setAttribute('x2', r1(x));
        o.lane.setAttribute('y1', r1(y + a[1])); o.lane.setAttribute('y2', r1(cy + a[1]));
        o.lane.setAttribute('class', isNew ? 'lane new' : 'lane');
        o.lane.style.opacity = r1(o.op * 100) / 100;
        if (RM) { o.dot.style.opacity = 0; }
        else {
          var ph = fr(t / 1.9 + o.i * 0.13);
          o.dot.setAttribute('cx', r1(x)); o.dot.setAttribute('cy', r1(y + a[1] + (cy - y) * ph));
          o.dot.style.opacity = r1(Math.sin(ph * Math.PI) * o.op * 100) / 100;
        }
      });
      // drop plates that have faded out
      plates = plates.filter(function (o) {
        if (o.dying && o.op < 0.03) { G.layer.removeChild(o.P.g); G.lanes.removeChild(o.lane); G.lanes.removeChild(o.dot); return false; }
        return true;
      });
      // the bracket names the group once the stack is too dense for one label per sensor
      var key = many ? (n >= MAX ? 'h' : 'w') : '';
      if (key !== G.brkKey) {
        G.brkKey = key;
        while (G.brkT.firstChild) G.brkT.removeChild(G.brkT.firstChild);
      }
      if (many && alive.length) {
        var L = G.chip.L, bx = cx + L[0] - 12;
        var yb = cy - alive[0].z + L[1], yt = cy - alive[alive.length - 1].z + L[1];
        G.brk.setAttribute('d', 'M' + r1(bx + 6) + ' ' + r1(yb) + 'H' + r1(bx) + 'V' + r1(yt) + 'H' + r1(bx + 6));
        G.brk.style.display = '';
        if (!G.brkT.firstChild) label(G.brkT, 0, 0, [{ text: key === 'h' ? copy.groupHospital : copy.groupWard, cls: 'lb' }], 'end', G.lw - 18);
        G.brkT.setAttribute('transform', 'translate(' + r1(bx - 8) + ' ' + r1((yb + yt) / 2) + ')');
      } else { G.brk.style.display = 'none'; }
    }

    paint();
    var E = engine(root, S.svg, build, step);
  }

  /* ---------- page ---------- */
  var intro = document.querySelector('#intro .wrap');
  h('h1', null, intro, C.title.h1);
  h('p', 'lede', intro, C.title.lede);
  h('span', 'meas', intro, C.title.pill);
  drawFab(document.getElementById('fab'), C.fab);
  drawRecordings(document.getElementById('recordings'), C.recordings);
  drawSensors(document.getElementById('sensors'), C.sensors);
  document.getElementById('foot').textContent = C.footer;
})();
</script>
<script src="../variant-nav.js"></script>
</body>
