      var b = R.traceBox, d = '', n = 36;
      for (var i = 0; i <= n; i++) {
        var u = i / n, ph = (t * 1.1 - u * 1.6), q = ph - Math.floor(ph);
        var v = -Math.exp(-Math.pow((q - 0.3) / 0.025, 2)) + 0.2 * Math.exp(-Math.pow((q - 0.55) / 0.06, 2));
        d += (i ? ' L' : 'M') + f1(b[0] + u * b[2]) + ' ' + f1(b[1] + 14 + v * 12);
      }
      R.trace.setAttribute('d', d);
    }

    onResize(P.stage, render);
    render();
    loopWhileVisible(root, function (t) {
      R.flow.style.strokeDashoffset = f1(-((t * 70) % R.L));
      drawTrace(t);
      if (!st.user) {
        if (st.lastAuto == null) st.lastAuto = t;
        if (t - st.lastAuto > 5 && st.n < 6) { st.lastAuto = t; addRec(); }
      }
      var from = R.lens.rec, to = R.L + R.lens.chip;
      R.tokens = R.tokens.filter(function (k) {
        if (k.t0 == null) k.t0 = t;
        var u = from + (t - k.t0) * 130;
        if (u >= to) {
          k.el.remove();
          st.fitN = Math.min(st.n, (st.fitN || 0) + 1);
          if (st.fitN >= st.n) st.fitN = null;
          mi.style.setProperty('--v', fitOf(st.fitN == null ? st.n : st.fitN).toFixed(3));
          R.st.chip.classList.remove('on');
          R.st.chip.getBoundingClientRect();
          R.st.chip.classList.add('on');
          return false;
        }
        var p = R.loop.getPointAtLength(u % R.L);
        k.el.setAttribute('cx', f1(p.x));
        k.el.setAttribute('cy', f1(p.y));
        k.el.setAttribute('opacity', 1);
        return true;
      });
    });
  }

  /* ---------- 03 every sensor, one chip: lines converge in parallel into one station ---------- */
  function drawSensors(root, c) {
    var N = c.lanes.length;
    var st = { on: [], step: 0, user: false, lastAuto: null };
    for (var i = 0; i < N; i++) st.on.push(i < 1);
    if (RM) { for (var j = 0; j < N; j++) st.on[j] = true; }
    var P = panel(root, c);
    var spec = h('div', 'spec', P.ctl);
    spec.setAttribute('role', 'group');
    spec.setAttribute('aria-label', c.specLabel);
    var track = h('div', 'track', spec);
    var fill = h('div', 'fill', track);
    var stepBtns = c.steps.map(function (sp, i) {
      var b = h('button', null, spec, sp.name);
      b.type = 'button';
      b.addEventListener('click', function () { st.user = true; setCount(sp.n); });
      b.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        var k = Math.max(0, Math.min(c.steps.length - 1, i + d));
        stepBtns[k].focus();
        st.user = true;
        setCount(c.steps[k].n);
      });
      return b;
    });
    var cap = h('span', 'cap', P.foot);
    h('span', 'meas', P.foot, c.illus);
    h('span', 'note', P.foot, c.hint);
    var R = {};

    function count() { return st.on.filter(Boolean).length; }
    function stepOf(n) { var k = 0; c.steps.forEach(function (sp, i) { if (n >= sp.n) k = i; }); return k; }
    function setCount(n) {
      var fresh = [];
      for (var i = 0; i < N; i++) { var was = st.on[i]; st.on[i] = i < n; if (st.on[i] && !was) fresh.push(i); }
      update(fresh);
    }
    function toggle(i) {
      st.user = true;
      if (st.on[i] && count() > 1) { st.on[i] = false; update([]); }
      else if (!st.on[i]) { st.on[i] = true; update([i]); }
    }

    function sig(type, u, t) {
      var ph, q;
      switch (type) {
        case 'ecg': ph = t * 1.1 - u * 1.4; q = ph - Math.floor(ph); return -Math.exp(-Math.pow((q - 0.3) / 0.025, 2)) + 0.25 * Math.exp(-Math.pow((q - 0.58) / 0.06, 2)) + 0.1 * Math.exp(-Math.pow((q - 0.15) / 0.04, 2));
        case 'pleth': ph = (t * 1.1 - u * 1.4) * Math.PI * 2; return -0.7 * Math.sin(ph) - 0.25 * Math.sin(2 * ph);
        case 'breath': return -0.8 * Math.sin((t * 0.3 - u * 0.6) * Math.PI * 2);
        case 'temp': return 0.15 * Math.sin((t * 0.15 - u * 0.4) * Math.PI * 2);
        case 'eeg': ph = t * 2 - u * 3; return 0.35 * Math.sin(ph * 7.1) + 0.3 * Math.sin(ph * 11.3 + 1) + 0.25 * Math.sin(ph * 17.9 + 2);
        case 'radar': ph = t * 1.5 - u * 2; return 0.8 * Math.sin(ph * 25) * Math.pow(Math.sin(ph * 2), 2);
        case 'bp': ph = t * 1.1 - u * 1.4; q = ph - Math.floor(ph); return -0.9 * Math.exp(-Math.pow((q - 0.25) / 0.08, 2)) - 0.35 * Math.exp(-Math.pow((q - 0.5) / 0.06, 2)) + 0.3;
        case 'move': ph = t * 0.8 - u * 1.2; return 0.5 * Math.sign(Math.sin(ph * 4)) * 0.8 + 0.15 * Math.sin(ph * 20);
        case 'pcg': ph = t * 1.1 - u * 1.4; q = ph - Math.floor(ph); return (Math.exp(-Math.pow((q - 0.2) / 0.03, 2)) + 0.7 * Math.exp(-Math.pow((q - 0.45) / 0.03, 2))) * Math.sin(q * 160);
        case 'gluc': return 0.5 * Math.sin((t * 0.08 - u * 0.5) * Math.PI * 2);
        case 'emg': ph = t * 2 - u * 2.5; return (0.3 + 0.7 * Math.pow(Math.sin(ph * 1.5), 4)) * (0.5 * Math.sin(ph * 41) + 0.4 * Math.sin(ph * 67 + 1));
        case 'us': ph = t * 1.4 - u * 2; q = ph - Math.floor(ph); return Math.sin(q * 90) * Math.exp(-Math.pow((q - 0.5) / 0.12, 2));
      }
      return 0;
    }

    function render() {
      var o = newSvg(P.stage, c.aria), svg = o.svg, w = o.w, H = o.h;
      var narrow = w < 600, pad = 22;
      var labW = narrow ? 98 : 128, trW = narrow ? 40 : 78;
      var chipW = narrow ? 92 : 150, bg = narrow ? 17 : 11;
      var top = narrow ? 30 : 34, gap = (H - top - 26) / (N - 1);
      var x0 = pad + labW, xs = x0 + trW;
      var chipX = w - pad - chipW - (narrow ? 0 : 20);
      var cy = H * 0.52;
      var chipH = (N - 1) * bg + 44, chipY = cy - chipH / 2;
      R = { svg: svg, lanes: [], labs: [], traces: [], pulses: [], x0: x0, xs: xs, narrow: narrow };

      // the far-end frame (only at the hospital end)
      R.far = s('g', { opacity: 0 }, svg);
      if (!RM) R.far.style.transition = 'opacity .5s';
      s('rect', { class: 'far', x: chipX - 12, y: chipY - 12, width: chipW + 24, height: chipH + 24, rx: 20 }, R.far);
      var fx = chipX + chipW / 2;
      s('text', { class: 'lb am', x: fx, y: chipY - 76, 'text-anchor': 'middle', style: narrow ? 'font-size:12.5px' : '' }, R.far, narrow ? 'Far end' : c.farEnd[0]);
      s('text', { class: 'lb s', x: fx, y: chipY - 59, 'text-anchor': 'middle' }, R.far, narrow ? 'far-fetched' : c.farEnd[1]);

      var avail = chipX - 18 - xs;
      for (var i = 0; i < N; i++) {
        var y = top + i * gap, yb = cy + (i - (N - 1) / 2) * bg;
        var dy = Math.abs(y - yb), dx = Math.min(dy, avail * 0.8);
        var x1 = xs + (avail - dx) * 0.35;
        var pts = [[xs, y], [x1, y], [x1 + dx, yb], [chipX, yb]];
        var lane = s('path', { class: 'lane off', d: roundPoly(pts, 12) }, svg);
        var tr = s('path', { class: 'trace' }, svg);
        var lg = s('g', { class: 'lanelab' }, svg);
        s('rect', { class: 'hit', x: 4, y: y - gap / 2 + 1, width: xs - 4, height: Math.max(gap - 2, 30), rx: 8 }, lg);
        s('text', { x: pad, y: y + 5, style: narrow ? 'font-size:13px' : '' }, lg, c.lanes[i].name);
        (function (k) { asButton(lg, c.lanes[k].name, function () { toggle(k); }); })(i);
        R.lanes.push(lane); R.traces.push(tr); R.labs.push(lg);
        R.pulses.push([s('circle', { class: 'pulse', r: 3.2, opacity: 0 }, svg), s('circle', { class: 'pulse', r: 3.2, opacity: 0 }, svg)]);
        R.lanes[i].yb = yb;
        R.lanes[i].y = y;
      }

      // the chip: one station, one local model
      var cg = s('g', {}, svg);
      for (var p = 0; p < 6; p++) {
        var px = chipX + 16 + p * (chipW - 32) / 5;
        s('line', { class: 'pin', x1: px, y1: chipY, x2: px, y2: chipY - 7 }, cg);
        s('line', { class: 'pin', x1: px, y1: chipY + chipH, x2: px, y2: chipY + chipH + 7 }, cg);
      }
      R.chipRect = s('rect', { class: 'chipbody', x: chipX, y: chipY, width: chipW, height: chipH, rx: 14 }, cg);
      var nx = chipX + chipW * (narrow ? 0.6 : 0.66);
      R.glowMax = chipW * 0.42;
      R.wires = [];
      for (var q = 0; q < N; q++) {
        R.wires.push(s('line', { class: 'wire', x1: chipX, y1: R.lanes[q].yb, x2: nx, y2: cy, opacity: 0 }, cg));
      }
      R.nodeGlow = s('circle', { class: 'nodeglow', cx: nx, cy: cy, r: 24 }, cg);
      R.node = s('circle', { class: 'node', cx: nx, cy: cy, r: 12 }, cg);
      R.nodeAt = [nx, cy];
      s('text', { class: 'lb hi', x: chipX + chipW / 2, y: chipY - 22, 'text-anchor': 'middle' }, svg, c.chip);
      s('text', { class: 'lb s', x: chipX + chipW / 2, y: chipY + chipH + 30, 'text-anchor': 'middle' }, svg, c.chipSub[0]);
      s('text', { class: 'lb s', x: chipX + chipW / 2, y: chipY + chipH + 47, 'text-anchor': 'middle' }, svg, c.chipSub[1]);
      R.lens = R.lanes.map(function (l) { return l.getTotalLength(); });
      update([], true);
      drawTraces(RM ? 0.37 : (R.lastT || 0));
    }

    function update(fresh, silent) {
      var n = count(), k = stepOf(n);
      st.step = k;
      stepBtns.forEach(function (b, i) {
        b.setAttribute('aria-pressed', i === k ? 'true' : 'false');
        b.classList.toggle('past', i < k);
      });
      fill.style.width = (k / (c.steps.length - 1) * 100) + '%';
      cap.textContent = c.stepCap[k];
      R.far.setAttribute('opacity', k === c.steps.length - 1 ? 1 : 0);
      for (var i = 0; i < N; i++) {
        var on = st.on[i];
        R.lanes[i].setAttribute('class', 'lane ' + (on ? 'live' : 'off'));
        R.labs[i].classList.toggle('live', on);
        R.labs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
        R.wires[i].setAttribute('opacity', on ? 1 : 0);
        R.traces[i].setAttribute('opacity', on ? 1 : 0.18);
      }
      R.node.setAttribute('r', (10 + n * 0.9).toFixed(1));
      if (!silent && !RM) {
        fresh.forEach(function (i) {
          var l = R.lanes[i];
          l.setAttribute('class', 'lane flash');
          setTimeout(function () { if (st.on[i]) l.setAttribute('class', 'lane live'); }, 450);
        });
      }
      if (RM) drawTraces(0.37);
    }

    function drawTraces(t) {
      R.lastT = t;
      for (var i = 0; i < N; i++) {
        var y = R.lanes[i].y, d = '', n = R.narrow ? 22 : 34, on = st.on[i];
        for (var k = 0; k <= n; k++) {
          var u = k / n, v = on ? sig(c.lanes[i].sig, u, t) : 0;
          d += (k ? ' L' : 'M') + f1(R.x0 + 4 + u * (R.xs - R.x0 - 8)) + ' ' + f1(y + v * 9);
        }
        R.traces[i].setAttribute('d', d);
      }
    }

    onResize(P.stage, render);
    render();
    loopWhileVisible(root, function (t) {
      drawTraces(t);
      if (!st.user) {
        if (st.lastAuto == null) st.lastAuto = t;
        var n = count();
        if (t - st.lastAuto > 1.4 && n < 6) { st.lastAuto = t; st.on[n] = true; update([n]); }
      }
      var lit = 0;
      for (var i = 0; i < N; i++) {
        var on = st.on[i], L = R.lens[i];
        for (var j = 0; j < 2; j++) {
          var dot = R.pulses[i][j];
          if (!on) { dot.setAttribute('opacity', 0); continue; }
          var u = ((t * 85 + j * L / 2 + i * 37) % L);
          var p = R.lanes[i].getPointAtLength(u);
          dot.setAttribute('cx', f1(p.x));
          dot.setAttribute('cy', f1(p.y));
          dot.setAttribute('opacity', Math.min(1, u / 30, (L - u) / 30).toFixed(2));
          if (L - u < 40) lit++;
        }
      }
      var g = Math.min(R.glowMax, 22 + count() * 1.4 + Math.sin(t * 2.2) * 3 + lit * 1.5);
      R.nodeGlow.setAttribute('r', f1(g));
    });
  }

  // page text
  document.getElementById('t-h1').textContent = C.title.h1;
  document.getElementById('t-lede').textContent = C.title.lede;
  document.getElementById('t-pill').textContent = C.title.pill;
  document.getElementById('foot').textContent = C.footer;
  [['fab', drawFab], ['recordings', drawRecordings], ['sensors', drawSensors]].forEach(function (x) {
    var sec = document.getElementById(x[0]);
    textBlock(sec, C[x[0]]);
    x[1](sec, C[x[0]]);
  });
})();
</script>
<script src="../variant-nav.js"></script>
</body>
