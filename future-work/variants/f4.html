<style>

  --dusk: #c9a3c4;

}
* { box-sizing: border-box; }

body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }

.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 34px); pointer-events: none; transition: background .3s, color .3s; }

.top.solid { background: rgba(13, 23, 38, .82); backdrop-filter: blur(10px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }

.nav .lnk:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }

.wrap { max-width: 1180px; margin: 0 auto; }

.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

.fab .side { display: flex; flex-direction: column; gap: 22px; padding-right: 6px; }
.wafer-disc { fill: #101e33; stroke: rgba(214, 228, 242, .35); stroke-width: 1.4; }
.wafer-edge { fill: none; stroke: rgba(255, 184, 107, .45); stroke-width: 1.2; stroke-dasharray: 5 6; }
.die { fill: #13233a; stroke: rgba(214, 228, 242, .3); stroke-width: 1; transition: fill .6s, stroke .6s; transform-box: fill-box; transform-origin: center; }

@keyframes pop { from { opacity: 0; transform: scale(.4); } }
.die.hot { fill: #1b4a36; stroke: rgba(91, 228, 155, .8); transition: fill .08s, stroke .08s; }
.die.hov { fill: #24704f; stroke: var(--signal); stroke-width: 2; transition: none; }
.preset-name { fill: #fff; font: 650 30px var(--f); letter-spacing: -.03em; }
.facts { display: flex; flex-direction: column; gap: 8px; }
.fact { font-size: 14px; line-height: 1.35; color: #e8eef5; padding: 8px 11px; border-radius: 10px; border: 1px solid rgba(214, 228, 242, .2); background: #0f1d31; transition: border-color .4s, background .4s; }
.fact.flash { border-color: var(--signal); background: #143826; }
.note { font-size: 12.5px; color: #8fa2b8; margin: 2px 0 0; line-height: 1.35; }
.meter { display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: 10px; font-size: 13.5px; color: #c4d1df; margin-bottom: 8px; }
.meter i { position: relative; display: block; height: 8px; border-radius: 999px; background: rgba(214, 228, 242, .1); overflow: hidden; }
.meter i::after { content: ""; position: absolute; inset: 0; width: 100%; transform-origin: 0 50%; transform: scaleX(var(--v, .5)); border-radius: inherit; background: var(--mute); transition: transform .5s cubic-bezier(.3, .8, .3, 1), background .5s; }
.meter.best i::after { background: var(--signal); }

/* 2: recordings */
.rec { display: flex; flex-direction: column; height: 100%; min-height: inherit; padding: 18px; gap: 14px; }
.rsv { position: relative; flex: 1; min-height: 300px; }
.rsv svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rec .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.rec .fitw { flex: 1; min-width: 200px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; font-size: 13.5px; color: #c4d1df; }
.rec .fitw i { position: relative; display: block; height: 8px; border-radius: 999px; background: rgba(214, 228, 242, .1); overflow: hidden; }
.rec .fitw i::after { content: ""; position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--v, 0)); background: var(--signal); border-radius: inherit; transition: transform .6s; }
.rdie { fill: #13233a; stroke: rgba(214, 228, 242, .28); stroke-width: 1; transition: fill .5s, stroke .5s; }
.rdie.lit { fill: #1b4a36; stroke: rgba(91, 228, 155, .85); }
.rdie.hov { stroke: #fff; stroke-width: 2; }
.imprint { fill: none; stroke: var(--signal); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .5s; pointer-events: none; }
.imprint.lit { opacity: 1; }
.card rect { fill: #13233a; stroke: rgba(214, 228, 242, .32); stroke-width: 1.2; }
.card path { fill: none; stroke: #dbe5ef; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.card text { fill: #c4d1df; font: 600 12.5px var(--f); }
.card.fly rect { stroke: var(--signal); }
.card.fly path { stroke: var(--signal); }

.sen { display: flex; flex-direction: column; height: 100%; min-height: inherit; padding: 18px; gap: 14px; }
.sen .cv { position: relative; flex: 1; min-height: 300px; }
.sen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sen .ctl { display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: end; }

      var wx0 = above ? 2 : labW + 6, xm = wx0 + (chipX - wx0) * .5;
      // count the lanes in view (fading ones included)
      var vis = 0; lanes.forEach(function (l, i) { if (l.a > .01 || i < n) vis = i + 1; });
      var span = (bot - top) / Math.max(1, MOTION ? vs : n);
      var amp = Math.min(above ? 16 : 22, span * (above ? .26 : .36));
      var grouped = n > 8;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      // chip body
      var r = 14;
      ctx.fillStyle = '#101e33'; ctx.strokeStyle = n ? 'rgba(91,228,155,.85)' : 'rgba(214,228,242,.3)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(chipX, chipY, cs, cs, r); ctx.fill(); ctx.stroke();
      // pins along the chip's left edge
      for (var i = 0; i < vis; i++) {
        var l = lanes[i]; if (l.a < .01) continue;
        var y = top + (i + .5) * span;
        var py = chipY + cs * .1 + cs * .8 * Math.min(1, (i + .5) / Math.max(1, MOTION ? vs : n));
        // waveform lane
        ctx.globalAlpha = l.a;
        ctx.strokeStyle = l.flash > 0 ? 'rgba(91,228,155,' + (.45 + .55 * l.flash) + ')' : 'rgba(219,229,239,.72)';
        ctx.lineWidth = grouped ? 1 : 1.4;
        ctx.beginPath();
        for (var x = wx0; x <= xm; x += (l.type === 0 ? 1.25 : 2.5)) {
          var fade = Math.min(1, (x - wx0) / 18, (xm - x) / 24);
          var v = sig(l.type, (x - wx0) / (l.type === 3 ? 60 : l.type === 4 ? 40 : 70) - T * .0009 * (l.type === 3 ? .5 : 1) + l.ph);
          var yy = y + v * amp * Math.max(0, fade);
          if (x === wx0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
        // converging wire
        var c1 = xm + (chipX - xm) * .5;
        ctx.strokeStyle = l.flash > 0 ? 'rgba(91,228,155,' + (.3 + .7 * l.flash) + ')' : 'rgba(214,228,242,.26)';
        ctx.lineWidth = grouped ? .9 : 1.3;
        ctx.beginPath(); ctx.moveTo(xm, y); ctx.bezierCurveTo(c1, y, c1, py, chipX, py); ctx.stroke();
        // a lit pulse travels in along the wire
        if (MOTION) {
          var t = ((T * .00035 + i * .137) % 1);
          var px = bez(xm, c1, c1, chipX, t), pyy = bez(y, y, py, py, t);
          ctx.fillStyle = '#5be49b';
          ctx.beginPath(); ctx.arc(px, pyy, grouped ? 1.8 : 2.6, 0, 7); ctx.fill();
        }
        // label
        ctx.globalAlpha = l.a * (l.flash > 0 ? 1 : .95);
        if (!grouped) {
          ctx.fillStyle = l.flash > 0 ? '#e9fff2' : '#c4d1df';
          ctx.font = '600 ' + (phone ? 11.5 : (span < 30 ? 12 : 13.5)) + 'px ' + getComputedStyle(document.body).fontFamily;
          ctx.textBaseline = 'middle';
          ctx.fillText(copy.types[l.type], above ? wx0 : 0, above ? y - amp - 10 : y);
        }
        ctx.globalAlpha = 1;
      }
      // grouped labels: one bracket per ward of eight sensors
      if (grouped) {
        ctx.font = '600 ' + (phone ? 11.5 : 13) + 'px ' + getComputedStyle(document.body).fontFamily;
        ctx.textBaseline = 'middle';
        for (var gI = 0; gI * 8 < n; gI++) {
          var a0 = top + gI * 8 * span + 2, a1 = top + Math.min(n, gI * 8 + 8) * span - 2;
          ctx.strokeStyle = 'rgba(214,228,242,.4)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(labW - 4, a0); ctx.lineTo(labW, a0); ctx.lineTo(labW, a1); ctx.lineTo(labW - 4, a1); ctx.stroke();
          ctx.fillStyle = '#c4d1df';
          ctx.fillText(n <= 24 ? copy.bed + " " + (gI + 1) : copy.group + " " + String.fromCharCode(65 + gI), 0, (a0 + a1) / 2);
        }
      }
      // core grid: one lit core per stream
      var cols = 8, rows = 6, pad = cs * .12, cg = Math.max(2, cs * .022);
      var cwid = (cs - 2 * pad - (cols - 1) * cg) / cols, chgt = (cs * (phone ? 1 : .78) - 2 * pad - (rows - 1) * cg) / rows;
      for (var k = 0; k < cols * rows; k++) {
        var cxk = chipX + pad + (k % cols) * (cwid + cg), cyk = chipY + pad + Math.floor(k / cols) * (chgt + cg);
        var on = k < n;
        var sh = on && MOTION ? .75 + .25 * Math.sin(T * .003 + k * .9) : 1;
        ctx.fillStyle = on ? 'rgba(27,74,54,' + sh + ')' : 'rgba(214,228,242,.06)';
        ctx.strokeStyle = on ? 'rgba(91,228,155,' + (.55 * sh) + ')' : 'rgba(214,228,242,.12)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(cxk, cyk, cwid, chgt, 2); ctx.fill(); ctx.stroke();
      }
      // chip caption inside, under the cores
      ctx.fillStyle = '#e9fff2'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '650 ' + Math.max(11, Math.min(15, cs * .068)) + 'px ' + getComputedStyle(document.body).fontFamily;
      if (phone) wrapText(copy.chip, chipX + cs / 2, chipY + cs + 24, cs + 16, 15);
      else wrapText(copy.chip, chipX + cs / 2, chipY + cs * .86, cs - 20, Math.max(13, cs * .08));
      ctx.textAlign = 'left';
      // the one output
      var oy = chipY + cs / 2;
      ctx.strokeStyle = '#5be49b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(chipX + cs, oy); ctx.lineTo(W - 2, oy); ctx.stroke();
      if (MOTION) {
        var ot = (T * .0006) % 1;
        ctx.fillStyle = '#e9fff2'; ctx.beginPath(); ctx.arc(chipX + cs + (W - 2 - chipX - cs) * ot, oy, 3, 0, 7); ctx.fill();
      }
      if (!phone) {
        ctx.fillStyle = '#c4d1df'; ctx.font = '600 12.5px ' + getComputedStyle(document.body).fontFamily; ctx.textBaseline = 'bottom';
        wrapText(copy.out, chipX + cs + 10, oy - 24, outW - 12, 16, 'left');
      }
    }
    function wrapText(s, x, y, maxW, lh, align) {
      var words = s.split(' '), lines = [], cur = '';
      words.forEach(function (w) { var t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
      lines.push(cur);
      var y0 = y - (lines.length - 1) * lh / 2;
      lines.forEach(function (ln, i) { ctx.fillText(ln, x, y0 + i * lh); });
    }

    size();
    if (MOTION) {
      setN(4);
      loop(root, function (t, dt) {
        T += dt;
        vs += (n - vs) * Math.min(1, dt / 220);
        lanes.forEach(function (l, i) {
          var want = i < n ? 1 : 0; l.a += (want - l.a) * Math.min(1, dt / 160);
          if (l.flash > 0) l.flash = Math.max(0, l.flash - dt / 1400);
        });
        // calm idle: a new sensor every few seconds, up to a ward, then back to a few
        if (auto) {
          autoT += dt;
          if (autoT > 2600) { autoT = 0; if (n >= 12) setN(4); else setN(n + 1); }
        }
        draw();
      });
    } else { setN(24); }
  }

  drawFab(document.getElementById('v-fab'), C.fab);
  drawRecordings(document.getElementById('v-recordings'), C.recordings);
  drawSensors(document.getElementById('v-sensors'), C.sensors);
})();
</script>
<script src="../variant-nav.js"></script>
