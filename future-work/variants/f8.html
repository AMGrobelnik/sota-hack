<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --pad: clamp(20px, 5.4vw, 84px);
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar (as the landing page) */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 34px); pointer-events: none; transition: background .3s, color .3s; }
.top > * { pointer-events: auto; }
.top.solid { background: rgba(13, 23, 38, .82); backdrop-filter: blur(10px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.nav { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.nav .lnk { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.nav .lnk:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.nav .lnk[aria-current=page] { color: #fff; text-decoration: underline; text-decoration-color: #5be49b; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--signal); color: #062418; font-weight: 650; border-radius: 10px; padding: 12px 22px; text-decoration: none; letter-spacing: -.005em; transition: background .15s, transform .15s; white-space: nowrap; }
.btn:hover { background: #86f2b9; }
.btn:active { transform: translateY(1px); }
.btn-s { padding: 9px 16px; font-size: 15px; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
.brand .lk-l { display: none; }

/* title block */
.intro { padding: clamp(120px, 18vh, 168px) var(--pad) 0; }
.wrap { max-width: 1180px; margin: 0 auto; }
.intro h1 { font-size: clamp(48px, 6.6vw, 100px); line-height: .95; letter-spacing: -.04em; font-weight: 650; margin: 0 0 22px; color: #fff; text-wrap: balance; text-shadow: 0 2px 40px rgba(8, 12, 30, .45); }
.intro .lede { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 34ch; margin: 0 0 16px; }
.meas { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 650; color: var(--amber); border: 1px solid rgba(255, 184, 107, .5); border-radius: 999px; padding: 2px 9px; line-height: 1.5; white-space: nowrap; }

/* the three sections */
.sec { min-height: 100svh; display: flex; align-items: center; padding: clamp(72px, 11vh, 120px) var(--pad) clamp(40px, 6vh, 72px); }
.sec > .wrap { width: 100%; display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.66fr); gap: clamp(28px, 4vw, 64px); align-items: center; }
.txt { min-width: 0; }
.st-n { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font-size: clamp(15px, 1.2vw, 17px); font-weight: 650; letter-spacing: -.01em; color: #c4d1df; }
.st-n b { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--signal); color: var(--signal); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.txt h2 { font-size: clamp(36px, 4.2vw, 62px); font-weight: 650; letter-spacing: -.035em; line-height: 1.02; margin: 0; color: #fff; text-wrap: balance; max-width: 15ch; }
.say { font-size: clamp(17px, 1.35vw, 19.5px); line-height: 1.42; color: #c4d1df; margin: 20px 0 18px; max-width: 32ch; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.cap { font-size: 12.5px; font-weight: 600; color: #8fa2b8; letter-spacing: .01em; }

.panel { position: relative; min-width: 0; border-radius: 20px; background: #0b1626; border: 1px solid var(--rule); padding: clamp(16px, 1.8vw, 24px); display: flex; flex-direction: column; gap: 16px; height: clamp(520px, 74vh, 660px); }

/* faders, shared by the desk */
.fd { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; min-height: 0; }
.fd-tr { position: relative; touch-action: none; cursor: grab; flex: none; }
.fd-tr.drag { cursor: grabbing; }
.fd-gr, .fd-fill { position: absolute; border-radius: 2px; pointer-events: none; }
.fd-gr { background: #1d2e45; }
.fd-fill { background: var(--signal); box-shadow: 0 0 10px rgba(91, 228, 155, .35); }
.fd-cap { position: absolute; border-radius: 6px; background: linear-gradient(180deg, #33465f, #1a2a40); border: 1px solid rgba(214, 228, 242, .38); box-shadow: 0 8px 16px -8px rgba(0, 0, 0, .9); pointer-events: none; transition: border-color .15s; }
.fd-cap::after { content: ""; position: absolute; background: var(--signal); border-radius: 1px; }
.fd-tr:hover .fd-cap, .fd-tr.drag .fd-cap { border-color: var(--signal); }
.fd-v { flex: 1; }
.fd-v .fd-tr { width: 48px; flex: 1; min-height: 120px; }
.fd-v .fd-tr::before { content: ""; position: absolute; left: 7px; right: 7px; top: 12px; bottom: 12px; background: repeating-linear-gradient(180deg, rgba(214, 228, 242, .16) 0 1px, transparent 1px 14px); pointer-events: none; }
.fd-v .fd-gr { left: 22px; width: 4px; top: 12px; bottom: 12px; }
.fd-v .fd-fill { left: 22px; width: 4px; bottom: 12px; height: calc(var(--v) * (100% - 24px)); }
.fd-v .fd-cap { left: 4px; width: 40px; height: 24px; bottom: calc(var(--v) * (100% - 24px)); }
.fd-v .fd-cap::after { left: 9px; right: 9px; top: 10px; height: 2px; }
.fd-h .fd-tr { height: 44px; width: 100%; }
.fd-h .fd-tr::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 12px; right: 12px; background: repeating-linear-gradient(90deg, rgba(214, 228, 242, .16) 0 1px, transparent 1px 16px); pointer-events: none; }
.fd-h .fd-gr { top: 20px; height: 4px; left: 12px; right: 12px; }
.fd-h .fd-fill { top: 20px; height: 4px; left: 12px; width: calc(var(--v) * (100% - 24px)); }
.fd-h .fd-cap { top: 4px; width: 24px; height: 36px; left: calc(var(--v) * (100% - 24px)); }
.fd-h .fd-cap::after { top: 9px; bottom: 9px; left: 11px; width: 2px; }
.fd-lab { font-size: 13.5px; font-weight: 600; color: #c4d1df; white-space: nowrap; }

.segs { display: grid; grid-template-columns: repeat(var(--n, 14), minmax(0, 1fr)); gap: 3px; }
.segs i { height: 10px; border-radius: 2px; background: #1a2a40; transition: background .25s; }
.segs i.on { background: var(--signal); }
.segs i.on.hi { background: var(--amber); }

/* 01 fab presets */
.fab-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.scenes { display: flex; gap: 8px; flex-wrap: wrap; }
.scene { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(214, 228, 242, .28); background: #13233a; font: 600 15px/1.1 var(--f); color: #dbe5ef; transition: border-color .2s, background .2s, color .2s; }
.scene .led { width: 8px; height: 8px; border-radius: 50%; background: #3a4b62; transition: background .2s, box-shadow .2s; flex: none; }
.scene:hover { border-color: rgba(91, 228, 155, .6); color: #fff; }
.scene[aria-checked=true] { border-color: var(--signal); background: #1b4a36; color: #fff; }
.scene[aria-checked=true] .led { background: var(--signal); box-shadow: 0 0 0 4px rgba(91, 228, 155, .18); }
.scene:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.fab-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "bank stage" "bank meters"; gap: 16px 20px; }
.bank { grid-area: bank; display: flex; flex-direction: column; gap: 10px; min-height: 0; border-right: 1px solid var(--rule); padding-right: 16px; }
.faders { flex: 1; min-height: 0; display: flex; gap: 12px; position: relative; padding-left: 26px; }
.faders .scale { position: absolute; left: 0; top: 0; bottom: 30px; display: flex; flex-direction: column; justify-content: space-between; font-size: 12px; color: #8fa2b8; padding: 6px 0; }
.stage { grid-area: stage; position: relative; min-height: 0; border-radius: 14px; background: #0d1a2c; border: 1px solid var(--rule); overflow: hidden; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage .grid line { stroke: rgba(214, 228, 242, .2); stroke-width: 1; stroke-dasharray: 3 4; }
.stage .cov rect { fill: #1b4a36; opacity: .55; }
.stage .chip { fill: #10243a; stroke: var(--signal); stroke-width: 1.5; }
.stage .pins { stroke: rgba(214, 228, 242, .45); stroke-width: 1.2; fill: none; }
.stage .gates rect { fill: var(--signal); }
.stage .chiplit { fill: none; stroke: #e9fff2; stroke-width: 2.4; stroke-linecap: round; }
.stage .tname { fill: #8fa2b8; font: 600 12.5px var(--f); }
.meters { grid-area: meters; display: grid; gap: 8px; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mhead .meas { margin: 0; }
.mt { display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; color: #c4d1df; }
.rules { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 14px; font-size: 13.5px; color: #dbe5ef; }
.rules .clk { width: 110px; height: 24px; flex: none; }
.rules .clk path { fill: none; stroke: var(--signal); stroke-width: 1.5; }
.rtext { display: flex; gap: 6px 18px; flex-wrap: wrap; font-weight: 600; }
.rtext span + span::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #607086; margin: 0 14px 2px 0; vertical-align: middle; }
.rtag { margin-left: auto; font-size: 12.5px; color: #8fa2b8; }

/* 02 your own recordings */
.rec { border: 1.5px dashed rgba(255, 184, 107, .55); background: #0b1626; }
.rec-tag { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: var(--amber); }
.rec-tag svg { width: 14px; height: 16px; flex: none; }
.rec-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 172px 138px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 0; row-gap: 10px; }
.rec-grid > .cap { grid-row: 1; }
.strips { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
.strip { all: unset; box-sizing: border-box; position: relative; cursor: pointer; display: flex; align-items: center; gap: 9px; height: 46px; width: calc(100% - 22px); padding: 0 10px; border-radius: 10px; border: 1px solid rgba(214, 228, 242, .22); background: #13233a; font: 600 14px/1.1 var(--f); color: #8fa2b8; transition: border-color .2s, color .2s, background .2s; }
.strip::after { content: ""; position: absolute; left: 100%; top: 50%; width: 23px; height: 1.5px; background: rgba(214, 228, 242, .2); transition: background .3s; }
.strip .led { width: 8px; height: 8px; border-radius: 50%; background: #3a4b62; flex: none; transition: background .2s, box-shadow .2s; }
.strip .nm { flex: 1; white-space: nowrap; }
.strip .bars { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.strip .bars i { width: 3px; height: 15%; border-radius: 1px; background: #2a3c55; }
.strip:hover { border-color: rgba(91, 228, 155, .6); color: #fff; }
.strip[aria-pressed=true] { color: #fff; border-color: rgba(91, 228, 155, .55); background: #15302a; }
.strip[aria-pressed=true]::after { background: var(--signal); }
.strip[aria-pressed=true] .led { background: var(--signal); box-shadow: 0 0 0 4px rgba(91, 228, 155, .18); }
.strip[aria-pressed=true] .bars i { background: var(--signal); }
.strip:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.model { grid-column: 2; grid-row: 2; display: flex; position: relative; padding-right: 22px; }
.model::after { content: ""; position: absolute; right: 0; top: 50%; width: 22px; height: 1.5px; background: var(--signal); }
.mblock { flex: 1; border-radius: 14px; border: 1.5px solid var(--signal); background: #10243a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px 10px; }
.mblock .cap { color: #dfffee; }
.msq { display: grid; grid-template-columns: repeat(6, 11px); gap: 4px; }
.msq i { width: 11px; height: 11px; border-radius: 2px; background: #22344c; transition: background .5s, opacity .5s; }
.msq i.on { background: var(--signal); }
.scope { grid-column: 3; grid-row: 2; position: relative; min-width: 0; border-radius: 14px; background: #0d1a2c; border: 1px solid var(--rule); overflow: hidden; display: flex; flex-direction: column; }
.scope .svgw { position: relative; flex: 1; min-height: 0; }
.scope svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scope .mid { stroke: rgba(214, 228, 242, .1); stroke-width: 1; }
.scope .trace { fill: none; stroke: #e8eef5; stroke-width: 1.6; stroke-linejoin: round; }
.scope .ghost { fill: none; stroke: rgba(255, 184, 107, .85); stroke-width: 1.4; stroke-dasharray: 5 4; stroke-linejoin: round; }
.scope .guide { stroke: rgba(214, 228, 242, .16); stroke-width: 1; stroke-dasharray: 2 3; }
.scope .lane { stroke: rgba(214, 228, 242, .14); stroke-width: 1; }
.legend { flex: none; display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 14px; border-top: 1px solid var(--rule); font-size: 12.5px; color: #8fa2b8; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 18px; flex: none; }
.legend .s1 { border-top: 1.6px solid #e8eef5; }
.legend .s2 { border-top: 1.6px dashed var(--amber); }
.legend .s3 { width: 10px; height: 9px; background: var(--signal); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.rec-bottom { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px 28px; align-items: end; border-top: 1px solid var(--rule); padding-top: 14px; }
.tune .ends { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: #c4d1df; margin-bottom: 2px; }
.tune .ends span:last-child { color: #dfffee; }
.fit { display: grid; gap: 8px; padding-bottom: 12px; }
.fit .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 600; color: #c4d1df; }
.fit .segs i { height: 12px; }

/* 03 every sensor, one chip */
.sens-head { display: flex; justify-content: space-between; gap: 12px; }
.sens-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; }
.sens-list { display: flex; flex-direction: column; }
.sn { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 9px; height: var(--row, 48px); padding: 0 10px; border-radius: 8px; font: 600 14px/1.1 var(--f); color: #8fa2b8; cursor: pointer; transition: color .2s, background .2s; }
.sn .led { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #4a5d77; flex: none; transition: background .2s, border-color .2s, box-shadow .2s; }
.sn:hover { background: rgba(214, 228, 242, .05); color: #fff; }
.sn[aria-pressed=true] { color: #fff; }
.sn[aria-pressed=true] .led { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 0 4px rgba(91, 228, 155, .18); }
.sn:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
.sens-svg { position: relative; height: calc(var(--row, 48px) * 8); min-width: 0; }
.sens-svg svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.sens-svg .base { fill: none; stroke: rgba(214, 228, 242, .16); stroke-width: 1.2; }
.sens-svg .wv { fill: none; stroke: var(--signal); stroke-linejoin: round; }
.sens-svg .cv { fill: none; stroke: var(--signal); }
.sens-svg .dot { fill: #e9fff2; }
.sens-svg .chipb { fill: #10243a; stroke: var(--signal); stroke-width: 1.5; }
.sens-svg .halo { fill: none; stroke: var(--amber); stroke-width: 1.4; stroke-dasharray: 6 5; }
.sens-svg .cpins { stroke: rgba(214, 228, 242, .45); stroke-width: 1.2; }
.sens-svg .csq { fill: var(--signal); }
.sens-svg .ctext { fill: #dfffee; font: 650 12.5px var(--f); text-anchor: middle; }
.spec { position: relative; padding: 30px 14px 0; border-top: 1px solid var(--rule); }
.spec-tr { position: relative; height: 44px; touch-action: none; cursor: pointer; }
.spec-line, .spec-fill, .spec-far { position: absolute; top: 21px; height: 2px; pointer-events: none; }
.spec-line { left: 0; right: 0; background: rgba(214, 228, 242, .2); }

<div class="foot"><footer id="foot"></footer></div>

<script>
(function () {

    }

    tr.addEventListener('pointermove', function (e) { if (drag) set(at(e)); });
    function end() { drag = false; tr.classList.remove('drag'); }
    tr.addEventListener('pointerup', end);
    tr.addEventListener('pointercancel', end);
    tr.addEventListener('keydown', function (e) {
      var step = { ArrowUp: .05, ArrowRight: .05, ArrowDown: -.05, ArrowLeft: -.05, PageUp: .2, PageDown: -.2 }[e.key];
      if (step !== undefined) { e.preventDefault(); if (o.onTouch) o.onTouch(); set(v + step); }
      else if (e.key === 'Home') { e.preventDefault(); if (o.onTouch) o.onTouch(); set(0); }
      else if (e.key === 'End') { e.preventDefault(); if (o.onTouch) o.onTouch(); set(1); }
    });

  }

  function segs(n, parent) {
    var box = el('div', 'segs'); box.style.setProperty('--n', n);
    var arr = [];
    for (var i = 0; i < n; i++) { var s = el('i'); box.append(s); arr.push(s); }
    if (parent) parent.append(box);
    return { el: box, set: function (val, hiFrom) {

    } };
  }

  /* the text column every section shares */
  function textBlock(c) {
    var t = el('div', 'txt');
    t.append(el('p', 'st-n', null, [el('b', null, { text: c.step }), el('span', null, { text: c.kicker })]));
    t.append(el('h2', null, { text: c.h2 }));
    t.append(el('p', 'say', { text: c.say }));
    var p = el('div', 'pills');
    c.pills.forEach(function (x) { p.append(el('span', 'meas', { text: x })); });
    t.append(p);
    return t;
  }

  function watchSize(node, cb) {
    if ('ResizeObserver' in window) new ResizeObserver(cb).observe(node);
    else window.addEventListener('resize', cb);
  }

  /* =================================================================================================
     01 FAB PRESETS: preset buttons and three faders; the chip outline morphs on the fab's tile grid
     ================================================================================================= */
  function drawFab(root, c) {
    var wrap = el('div', 'wrap'); root.append(wrap);
    wrap.append(textBlock(c));
    var vis = el('div', 'panel fab'); wrap.append(vis);

    var head = el('div', 'fab-head'); vis.append(head);
    head.append(el('span', 'cap', { text: c.presetLabel }));
    var scenes = el('div', 'scenes', { role: 'radiogroup', 'aria-label': c.presetLabel }); head.append(scenes);
    var fab = 0;
    var sbtn = c.presets.map(function (p, i) {
      var b = el('button', 'scene', { type: 'button', role: 'radio', 'aria-checked': 'false', tabindex: '-1' }, [el('i', 'led'), el('span', null, { text: p.name })]);
      b.addEventListener('click', function () { pick(i); });
      b.addEventListener('keydown', function (e) {
        var d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
        if (d) { e.preventDefault(); var j = mod(i + d, c.presets.length); pick(j); sbtn[j].focus(); }
      });
      scenes.append(b);
      return b;
    });

    var body = el('div', 'fab-body'); vis.append(body);
    var bank = el('div', 'bank'); body.append(bank);
    bank.append(el('span', 'cap', { text: c.mattersLabel }));
    var fw = el('div', 'faders'); bank.append(fw);
    fw.append(el('div', 'scale', null, [el('span', null, { text: c.more }), el('span', null, { text: c.less })]));
    var w = {};
    c.faders.forEach(function (f) {
      w[f.key] = f.value;
      var fd = fader({ label: f.label, aria: f.label, value: f.value, vertical: true, onChange: function (v) { w[f.key] = v; redraw(); } });
      fw.append(fd.el);
    });

    var stage = el('div', 'stage'); body.append(stage);
    var svg = sv('svg', { role: 'img', 'aria-label': c.aria });
    stage.append(svg);
    var gGrid = sv('g', { class: 'grid' }, svg), gCov = sv('g', { class: 'cov' }, svg);
    var chip = sv('rect', { class: 'chip', rx: 6 }, svg);
    var pins = sv('path', { class: 'pins' }, svg);
    var gGates = sv('g', { class: 'gates' }, svg);
    var lit = sv('rect', { class: 'chiplit', rx: 6, pathLength: 100, 'stroke-dasharray': '7 93' }, svg);
    var tname = sv('text', { class: 'tname', x: 14, y: 24 }, svg);
    var N = 96, gates = [];
    for (var i = 0; i < N; i++) gates.push(sv('rect', { rx: 1 }, gGates));
    var gl = [], cl = [];
    function pool(arr, n, parent, tag) { while (arr.length < n) arr.push(sv(tag, {}, parent)); arr.forEach(function (x, k) { x.style.display = k < n ? '' : 'none'; }); }

    var meters = el('div', 'meters'); body.append(meters);
    meters.append(el('div', 'mhead', null, [el('span', 'cap', { text: c.meterLabel }), el('span', 'meas', { text: c.meterPill })]));
    var mset = {};
    c.meters.forEach(function (m) { var row = el('div', 'mt', null, [el('span', null, { text: m.label })]); mset[m.key] = segs(16, row); meters.append(row); });

    var rules = el('div', 'rules'); vis.append(rules);
    var clk = sv('svg', { class: 'clk', 'aria-hidden': 'true', viewBox: '0 0 110 24' }); var clkPath = sv('path', {}, clk);
    rules.append(clk);
    var rtext = el('div', 'rtext'); rules.append(rtext);
    rules.append(el('span', 'rtag', { text: c.rulesTag }));

    /* illustrative geometry: everything scales with unit; returns the chip's target outline and tile size */
    function target(p, wt, unit) {
      var d = clamp(.42 + .5 * wt.size - .16 * wt.speed + .05 * wt.cost, .32, .95);
      var pitch = unit * p.cell / Math.sqrt(d);
      var area = N * pitch * pitch, ar = 1.3;
      var fwid = Math.sqrt(area * ar), fht = area / fwid;
      var TA = unit * unit * N / 3.1, TW = Math.sqrt(TA * p.tileAspect), TH = TA / TW;
      var k = Math.max(1, Math.ceil(area / (TA * .9))), best = null;
      for (var cols = 1; cols <= k; cols++) {
        var rows = Math.ceil(k / cols);
        var sc = Math.abs(Math.log((cols * TW) / (rows * TH) / ar)) + (cols * rows - k) * .5;
        if (!best || sc < best.sc) best = { sc: sc, cols: cols, rows: rows };
      }
      var cw = Math.pow(wt.cost, .8);
      var tw = lerp(fwid, best.cols * TW - unit * .5, cw), th = lerp(fht, best.rows * TH - unit * .5, cw);
      var cov = Math.ceil(tw / TW - .08) * Math.ceil(th / TH - .08);
      var wait = p.waitF * (1 - .5 * wt.speed) + .3 * wt.size * (1 - .4 * wt.speed) + .03 * cov;
      return { w: tw, h: th, TW: TW, TH: TH, d: d, cell: p.cell, cost: cov * TA * p.costF, area: tw * th, wait: wait };
    }
    var bounds = null;
    function computeBounds() {
      var b = { w: 0, h: 0, cost: [1e9, 0], area: [1e9, 0], wait: [1e9, 0] };
      c.presets.forEach(function (p) {
        for (var m = 0; m < 27; m++) {
          var wt = { cost: (m % 3) / 2, size: (Math.floor(m / 3) % 3) / 2, speed: Math.floor(m / 9) / 2 };
          var t = target(p, wt, 1);
          b.w = Math.max(b.w, t.w); b.h = Math.max(b.h, t.h);
          ['cost', 'area', 'wait'].forEach(function (k) { b[k][0] = Math.min(b[k][0], t[k]); b[k][1] = Math.max(b[k][1], t[k]); });
        }
      });
      bounds = b;
    }
    computeBounds();

    var W = 0, H = 0, unit = 1, cur = null;
    function measure() {
      W = stage.clientWidth; H = stage.clientHeight;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      unit = Math.min((W - 48) / bounds.w, (H - 64) / bounds.h);
    }

    var redraw = animate(vis, function (t, dt) {
      if (!W) measure();
      if (W < 20 || H < 20) return;
      var p = c.presets[fab], tg = target(p, w, unit);
      var gx0 = W / 2, gy0 = H / 2 + 8;
      var tx = gx0 + Math.round((W / 2 - tg.w / 2 - gx0) / tg.TW) * tg.TW + unit * .25;
      var ty = gy0 + Math.round((gy0 - tg.h / 2 - gy0) / tg.TH) * tg.TH + unit * .25;
      tx = clamp(tx, 10, W - tg.w - 10); ty = clamp(ty, 34, H - tg.h - 10);
      var k = 1 - Math.exp(-dt / 150);
      if (!cur) cur = { x: tx, y: ty, w: tg.w, h: tg.h, TW: tg.TW, TH: tg.TH, cell: tg.cell };
      cur.x = lerp(cur.x, tx, k); cur.y = lerp(cur.y, ty, k); cur.w = lerp(cur.w, tg.w, k); cur.h = lerp(cur.h, tg.h, k);
      cur.TW = lerp(cur.TW, tg.TW, k); cur.TH = lerp(cur.TH, tg.TH, k); cur.cell = lerp(cur.cell, tg.cell, k);

      /* the fab's tile grid, anchored to the stage centre */
      var vx = [], hy = [], x0 = gx0 - Math.ceil(gx0 / cur.TW) * cur.TW, y0 = gy0 - Math.ceil(gy0 / cur.TH) * cur.TH;
      for (var x = x0; x <= W; x += cur.TW) if (x > 0) vx.push(x);
      for (var y = y0; y <= H; y += cur.TH) if (y > 0) hy.push(y);
      pool(gl, vx.length + hy.length, gGrid, 'line');
      vx.forEach(function (x, i) { var l = gl[i]; l.setAttribute('x1', f1(x)); l.setAttribute('x2', f1(x)); l.setAttribute('y1', 0); l.setAttribute('y2', H); });
      hy.forEach(function (y, i) { var l = gl[vx.length + i]; l.setAttribute('y1', f1(y)); l.setAttribute('y2', f1(y)); l.setAttribute('x1', 0); l.setAttribute('x2', W); });

      /* tiles the chip lands on */
      var cx0 = gx0 + Math.floor((cur.x - gx0) / cur.TW + .02) * cur.TW, cy0 = gy0 + Math.floor((cur.y - gy0) / cur.TH + .02) * cur.TH;
      var ccols = Math.ceil((cur.x + cur.w - cx0) / cur.TW - .08), crows = Math.ceil((cur.y + cur.h - cy0) / cur.TH - .08);
      pool(cl, ccols * crows, gCov, 'rect');
      for (var r = 0; r < crows; r++) for (var q = 0; q < ccols; q++) {
        var rc = cl[r * ccols + q];
        rc.setAttribute('x', f1(cx0 + q * cur.TW + 1)); rc.setAttribute('y', f1(cy0 + r * cur.TH + 1));
        rc.setAttribute('width', f1(cur.TW - 2)); rc.setAttribute('height', f1(cur.TH - 2));
      }

      /* the chip, its pins and its gates */
      [chip, lit].forEach(function (e) { e.setAttribute('x', f1(cur.x)); e.setAttribute('y', f1(cur.y)); e.setAttribute('width', f1(cur.w)); e.setAttribute('height', f1(cur.h)); });
      lit.setAttribute('stroke-dashoffset', RM ? 0 : f1(-(t / 90) % 100));
      var pd = '', ps = Math.max(9, unit * 1.6);
      for (var px = cur.x + ps / 2; px < cur.x + cur.w - 3; px += ps) pd += 'M' + f1(px) + ' ' + f1(cur.y) + 'v-5M' + f1(px) + ' ' + f1(cur.y + cur.h) + 'v5';
      for (var py = cur.y + ps / 2; py < cur.y + cur.h - 3; py += ps) pd += 'M' + f1(cur.x) + ' ' + f1(py) + 'h-5M' + f1(cur.x + cur.w) + ' ' + f1(py) + 'h5';
      pins.setAttribute('d', pd);
      var pad = Math.max(5, unit * .6), iw = cur.w - 2 * pad, ih = cur.h - 2 * pad;
      var cols = Math.max(1, Math.round(Math.sqrt(N * iw / ih))), rows = Math.ceil(N / cols);
      var cwid = iw / cols, chgt = ih / rows, sq = Math.min(unit * cur.cell * .78, Math.min(cwid, chgt) * .86);
      gates.forEach(function (g, i) {
        var gx = cur.x + pad + (i % cols) * cwid + (cwid - sq) / 2, gy = cur.y + pad + Math.floor(i / cols) * chgt + (chgt - sq) / 2;
        g.setAttribute('x', f1(gx)); g.setAttribute('y', f1(gy)); g.setAttribute('width', f1(sq)); g.setAttribute('height', f1(sq));
        g.setAttribute('opacity', RM ? .8 : (.55 + .4 * (.5 + .5 * Math.sin(t / 1100 + i * 1.7))).toFixed(2));
      });
      tname.textContent = p.name;

      /* meters from the target at unit 1, scaled into the sampled range */
      var t1 = target(p, w, 1);
      ['cost', 'area', 'wait'].forEach(function (key) {
        var b = bounds[key], v = (t1[key] - b[0]) / (b[1] - b[0] || 1);
        mset[key].set(.08 + .92 * v, 12);
      });

      /* the fab's default clock, drawn as a pulse train */
      var per = p.clockNs * .44, off = RM ? 0 : (t * .012) % per, dd = '';
      for (var cx = -per - off; cx < 110; cx += per) dd += 'M' + f1(cx) + ' 19H' + f1(cx + per / 2) + 'V5H' + f1(cx + per) + 'V19';
      clkPath.setAttribute('d', dd);
    });

    function pick(i) {
      fab = i;
      sbtn.forEach(function (b, j) { b.setAttribute('aria-checked', j === i ? 'true' : 'false'); b.tabIndex = j === i ? 0 : -1; });
      rtext.textContent = '';
      c.presets[i].rules.forEach(function (r) { rtext.append(el('span', null, { text: r })); });
      redraw();
    }
    watchSize(stage, function () { measure(); redraw(); });
    pick(0);
  }

  /* =================================================================================================
     02 YOUR OWN RECORDINGS: input strips feed the chip model inside a dashed "your machine" boundary
     ================================================================================================= */
  function drawRecordings(root, c) {
    var wrap = el('div', 'wrap'); root.append(wrap);
    wrap.append(textBlock(c));
    var vis = el('div', 'panel rec'); wrap.append(vis);

    var tag = el('div', 'rec-tag');
    var lock = sv('svg', { viewBox: '0 0 14 16', 'aria-hidden': 'true' });
    sv('rect', { x: 1.5, y: 7, width: 11, height: 8, rx: 2, fill: 'none', stroke: '#ffb86b', 'stroke-width': 1.4 }, lock);
    sv('path', { d: 'M4 7V5a3 3 0 0 1 6 0v2', fill: 'none', stroke: '#ffb86b', 'stroke-width': 1.4 }, lock);
    tag.append(lock, el('span', null, { text: c.machine }));
    vis.append(tag);

    var grid = el('div', 'rec-grid'); vis.append(grid);
    grid.append(el('span', 'cap', { text: c.stripsLabel }), el('span', 'cap c2', { text: '' }), el('span', 'cap c3', { text: c.scopeLabel }));
    var strips = el('div', 'strips'); grid.append(strips);
    var on = c.strips.map(function (_, i) { return c.stripsOn.indexOf(i) >= 0; });
    var bars = [];
    var sb = c.strips.map(function (name, i) {
      var b = el('button', 'strip', { type: 'button', 'aria-pressed': on[i] ? 'true' : 'false', 'aria-label': c.stripAria + ' ' + name });
      var bs = el('span', 'bars'), arr = [];
      for (var k = 0; k < 5; k++) { var bi = el('i'); bs.append(bi); arr.push(bi); }
      bars.push(arr);
      b.append(el('i', 'led'), el('span', 'nm', { text: name }), bs);
      b.addEventListener('click', function () { on[i] = !on[i]; b.setAttribute('aria-pressed', on[i] ? 'true' : 'false'); redraw(); });
      strips.append(b);
      return b;
    });

    var model = el('div', 'model'); grid.append(model);
    var mb = el('div', 'mblock'); model.append(mb);
    mb.append(el('span', 'cap', { text: c.modelLabel }));
    var msq = el('div', 'msq'); mb.append(msq);
    var sqs = [];
    for (var q = 0; q < 48; q++) { var s = el('i'); s.style.opacity = (.55 + .45 * hash(q * 3.3)).toFixed(2); msq.append(s); sqs.push({ e: s, th: .04 + .9 * hash(q * 1.9), lit: false }); }

    var scope = el('div', 'scope'); grid.append(scope);
    var sw = el('div', 'svgw'); scope.append(sw);
    var svg = sv('svg', { role: 'img', 'aria-label': c.aria }); sw.append(svg);
    var mid = sv('line', { class: 'mid' }, svg), lane = sv('line', { class: 'lane' }, svg);
    var gGuide = sv('g', {}, svg);
    var ghost = sv('path', { class: 'ghost' }, svg), trace = sv('path', { class: 'trace' }, svg);
    var gCalls = sv('g', {}, svg);
    var legend = el('div', 'legend'); scope.append(legend);
    ['s1', 's2', 's3'].forEach(function (k, i) { legend.append(el('span', null, null, [el('i', k), document.createTextNode(c.legend[i])])); });

    var bottom = el('div', 'rec-bottom'); vis.append(bottom);
    var tune = el('div', 'tune'); bottom.append(tune);
    tune.append(el('div', 'ends', null, [el('span', null, { text: c.from }), el('span', null, { text: c.to })]));
    var touched = false, fv = RM ? .9 : 0, autoAt = 0;
    var fd = fader({ aria: c.faderAria, value: fv, vertical: false, onTouch: function () { touched = true; }, onChange: function (v) { fv = v; redraw(); } });
    tune.append(fd.el);
    var fit = el('div', 'fit'); bottom.append(fit);
    fit.append(el('div', 'hd', null, [el('span', null, { text: c.fitLabel }), el('span', 'meas', { text: c.fitPill })]));
    var fitSegs = segs(20, fit);

    var W = 0, H = 0, ct = 0, guides = [], calls = [];
    function measure() { W = sw.clientWidth; H = sw.clientHeight; svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); }
    function pool(arr, n, parent, tag, cls) { while (arr.length < n) arr.push(sv(tag, { class: cls || '' }, parent)); arr.forEach(function (x, k) { x.style.display = k < n ? '' : 'none'; }); }

    function actual(u, P) {
      var n = Math.floor(u / P), ph = mod(u, P) / P, a = .9 + .12 * Math.sin(n * 1.7);
      return a * (gs(ph, .43, .03) - .2 * gs(ph, .395, .014) - .34 * gs(ph, .47, .02)) + .1 * gs(ph, .24, .04) + .3 * gs(ph, .71, .07) + .16 * Math.sin(u / (P * 1.9));
    }
    function generic(u, P) {
      var ph = mod(u, P) / P;
      return 1.18 * gs(ph, .41, .016) - .12 * gs(ph, .385, .01) - .22 * gs(ph, .44, .012) + .08 * gs(ph, .22, .03) + .2 * gs(ph, .64, .05);
    }
    function mixColor(e) { return 'rgb(' + Math.round(lerp(91, 255, e)) + ',' + Math.round(lerp(228, 184, e)) + ',' + Math.round(lerp(155, 107, e)) + ')'; }

    var redraw = animate(vis, function (t, dt, live) {
      if (!W) measure();
      if (W < 20 || H < 20) return;
      if (live && !touched && !RM) {
        if (!autoAt) autoAt = t + 700;
        var a = clamp((t - autoAt) / 2600, 0, 1);
        if (a > 0 && a <= 1 && fv < .9) fd.set(.9 * (a < .5 ? 2 * a * a : 1 - Math.pow(-2 * a + 2, 2) / 2));
      }
      var count = on.filter(Boolean).length, reach = .3 + .7 * count / on.length;
      var tt = fv * reach;
      ct = lerp(ct, tt, 1 - Math.exp(-dt / 160));

      bars.forEach(function (arr, i) {
        arr.forEach(function (b, k) { b.style.height = on[i] ? Math.round(25 + 70 * (.5 + .5 * Math.sin(t / (140 + k * 37) + i * 2.1 + k))) + '%' : '15%'; });
      });
      sqs.forEach(function (s) { var l = ct > s.th; if (l !== s.lit) { s.lit = l; s.e.classList.toggle('on', l); } });
      fitSegs.set(.08 + .92 * ct);

      var P = clamp(W / 5, 84, 132), scroll = RM ? P * 1.3 : t * .055;
      var my = H * .42, amp = H * .25, ly = H - 22;
      mid.setAttribute('x1', 0); mid.setAttribute('x2', W); mid.setAttribute('y1', f1(my)); mid.setAttribute('y2', f1(my));
      lane.setAttribute('x1', 0); lane.setAttribute('x2', W); lane.setAttribute('y1', f1(ly + 7)); lane.setAttribute('y2', f1(ly + 7));
      var dt1 = '', dg = '';
      for (var x = 0; x <= W + 2; x += 2.5) {
        var u = x + scroll, av = actual(u, P), gv = generic(u, P);
        dt1 += (x ? 'L' : 'M') + f1(x) + ' ' + f1(my - av * amp);
        dg += (x ? 'L' : 'M') + f1(x) + ' ' + f1(my - lerp(gv, av, ct) * amp);
      }
      trace.setAttribute('d', dt1); ghost.setAttribute('d', dg);

      var n0 = Math.floor(scroll / P) - 1, n1 = Math.floor((scroll + W) / P) + 1, gi = 0, ci = 0, list = [];
      for (var n = n0; n <= n1; n++) {
        var xt = n * P + .43 * P - scroll;
        list.push({ g: xt });
        var off = (-.03 + (hash(n * 5.1) - .5) * .32) * P * (1 - ct);
        var miss = hash(n * 3.1) < .24, fa = hash(n * 7.3) < .3;
        list.push({ c: xt + off, o: miss ? ct : 1, e: clamp(Math.abs(off) / 10, 0, 1) });
        if (fa) list.push({ c: n * P + .84 * P - scroll, o: 1 - ct, e: 1 });
      }
      var gs1 = list.filter(function (o) { return o.g !== undefined; }), cs = list.filter(function (o) { return o.c !== undefined; });
      pool(guides, gs1.length, gGuide, 'line', 'guide');
      gs1.forEach(function (o, i) { var l = guides[i]; l.setAttribute('x1', f1(o.g)); l.setAttribute('x2', f1(o.g)); l.setAttribute('y1', f1(my - amp * 1.05)); l.setAttribute('y2', f1(ly + 7)); });
      pool(calls, cs.length, gCalls, 'path');
      cs.forEach(function (o, i) {
        var pth = calls[i];
        pth.setAttribute('d', 'M' + f1(o.c) + ' ' + f1(ly - 7) + 'l6 12h-12z');
        pth.setAttribute('fill', mixColor(o.e));
        pth.setAttribute('opacity', o.o.toFixed(2));
      });
    });

    watchSize(sw, function () { measure(); redraw(); });
    redraw();
  }

  /* =================================================================================================
     03 EVERY SENSOR, ONE CHIP: parallel sensor lanes converge into one chip; a spectrum from one
     sensor to a whole hospital
     ================================================================================================= */
  var WAVES = {
    heart: function (u) { var ph = mod(u, 90); return gs(ph, 40, 2.4) - .25 * gs(ph, 36, 2) - .35 * gs(ph, 44, 2.2) + .25 * gs(ph, 62, 8) + .1 * gs(ph, 22, 5) - .1; },
    brain: function (u) { return .32 * Math.sin(u * .21) + .25 * Math.sin(u * .47 + 1) + .2 * Math.sin(u * .83 + 2) + .14 * Math.sin(u * 1.31); },
    oxygen: function (u) { var ph = mod(u, 80) / 80; return .9 * Math.pow(Math.sin(Math.PI * Math.min(1, ph * 1.6)), 2) * (ph < .625 ? 1 : 0) + .18 * gs(ph, .7, .05) - .4; },
    breath: function (u) { return .7 * Math.sin(u * .035); },
    temp: function (u) { return .18 * Math.sin(u * .012) + .04 * Math.sin(u * .2); },
    radar: function (u) { return .75 * Math.sin(u * .34) * Math.sin(u * .027); },
    pressure: function (u) { var ph = mod(u, 85); return .85 * gs(ph, 22, 4.5) + .45 * gs(ph, 34, 7) + .2 * gs(ph, 46, 5) - .45; },
    motion: function (u) { return .7 * Math.sin(u * .5) * Math.pow(Math.max(0, Math.sin(u * .028)), 6) + .05 * Math.sin(u * 1.7); }
  };

  function drawSensors(root, c) {
    var wrap = el('div', 'wrap'); root.append(wrap);
    wrap.append(textBlock(c));
    var vis = el('div', 'panel sens'); wrap.append(vis);
    vis.append(el('div', 'sens-head', null, [el('span', 'cap', { text: c.streamsLabel }), el('span', 'cap', { text: c.chipLabel })]));
    var body = el('div', 'sens-body'); vis.append(body);
    var list = el('div', 'sens-list'); body.append(list);
    var box = el('div', 'sens-svg'); body.append(box);
    var svg = sv('svg', { role: 'img', 'aria-label': c.aria }); box.append(svg);
    var MAXB = 10;
    var S = c.sensors.map(function (sn, i) {
      var b = el('button', 'sn', { type: 'button', 'aria-pressed': 'false' }, [el('i', 'led'), el('span', null, { text: sn.name })]);
      var o = { kind: sn.kind, on: false, light: 0, hover: false, btn: b, base: null, wv: [], cv: [], dots: [] };
      b.addEventListener('click', function () { o.on = !o.on; b.setAttribute('aria-pressed', o.on ? 'true' : 'false'); redraw(); });
      b.addEventListener('pointerenter', function () { o.hover = true; redraw(); });
      b.addEventListener('pointerleave', function () { o.hover = false; redraw(); });
      list.append(b);
      return o;
    });
    var gBase = sv('g', {}, svg), gCv = sv('g', {}, svg), gWv = sv('g', {}, svg), gDots = sv('g', {}, svg);
    var halo = sv('rect', { class: 'halo', rx: 14 }, svg);
    var chipB = sv('rect', { class: 'chipb', rx: 10 }, svg);
    var cpins = sv('path', { class: 'cpins' }, svg);
    var gSq = sv('g', {}, svg), csq = [];
    for (var q = 0; q < 35; q++) csq.push(sv('rect', { class: 'csq', rx: 1 }, gSq));
    var ct1 = sv('text', { class: 'ctext' }, svg), ct2 = sv('text', { class: 'ctext' }, svg);
    ct1.textContent = c.chipText[0]; ct2.textContent = c.chipText[1];
    S.forEach(function (o) {
      o.base = sv('path', { class: 'base' }, gBase);
      for (var k = 0; k < MAXB; k++) { o.wv.push(sv('path', { class: 'wv' }, gWv)); o.cv.push(sv('path', { class: 'cv' }, gCv)); o.dots.push(sv('circle', { class: 'dot', r: 2.2 }, gDots)); }
    });

    /* the spectrum: one sensor to a whole hospital */
    var spec = el('div', 'spec'); vis.append(spec);
    spec.append(el('div', 'spec-far-lab', { text: c.farLabel }));
    var tr = el('div', 'spec-tr', { role: 'slider', tabindex: '0', 'aria-label': c.specAria, 'aria-valuemin': '0', 'aria-valuemax': String(c.stops.length - 1) });
    tr.append(el('i', 'spec-line'), el('i', 'spec-fill'), el('i', 'spec-far'));
    var nst = c.stops.length;
    var dots = c.stops.map(function (_, i) { var d = el('i', 'spec-stop' + (i === nst - 1 ? ' far' : '')); d.style.left = (i / (nst - 1) * 100) + '%'; tr.append(d); return d; });
    tr.append(el('i', 'spec-thumb'));
    spec.append(tr);
    var labs = el('div', 'spec-labs'); spec.append(labs);
    var lb = c.stops.map(function (st, i) {
      var b = el('button', i === nst - 1 ? 'far' : '', { type: 'button', text: st.label });
      b.style.left = (i / (nst - 1) * 100) + '%';
      b.addEventListener('click', function () { setStop(i); });
      labs.append(b);
      return b;
    });
    var stop = 0, beds = 1, drag = false;
    function setStop(i, keepThumb) {
      stop = i;
      var st = c.stops[i];
      S.forEach(function (o, k) { o.on = st.on === 'all' || st.on.indexOf(k) >= 0; o.btn.setAttribute('aria-pressed', o.on ? 'true' : 'false'); });
      if (!keepThumb) tr.style.setProperty('--p', i / (nst - 1));
      tr.setAttribute('aria-valuenow', String(i)); tr.setAttribute('aria-valuetext', st.label);
      tr.classList.toggle('far', i === nst - 1);
      dots.forEach(function (d, k) { d.classList.toggle('on', k <= i); });
      lb.forEach(function (b, k) { b.classList.toggle('on', k === i); });
      redraw();
    }
    function at(e) { var r = tr.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width, 0, 1); }
    tr.addEventListener('pointerdown', function (e) { drag = true; tr.classList.add('drag'); tr.setPointerCapture(e.pointerId); move(e); e.preventDefault(); });
    function move(e) { var p = at(e); tr.style.setProperty('--p', p); var i = Math.round(p * (nst - 1)); if (i !== stop) setStop(i, true); }
    tr.addEventListener('pointermove', function (e) { if (drag) move(e); });
    function end() { if (!drag) return; drag = false; tr.classList.remove('drag'); setStop(stop); }
    tr.addEventListener('pointerup', end); tr.addEventListener('pointercancel', end);
    tr.addEventListener('keydown', function (e) {
      var d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      if (d) { e.preventDefault(); setStop(clamp(stop + d, 0, nst - 1)); }
      else if (e.key === 'Home') { e.preventDefault(); setStop(0); }
      else if (e.key === 'End') { e.preventDefault(); setStop(nst - 1); }
    });

    var W = 0, H = 0;
    function measure() { W = box.clientWidth; H = box.clientHeight; svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); }
    function bez(p0, p1, p2, p3, t) { var m = 1 - t; return m * m * m * p0 + 3 * m * m * t * p1 + 3 * m * t * t * p2 + t * t * t * p3; }

    var redraw = animate(vis, function (t, dt) {
      if (!W) measure();
      if (W < 20 || H < 20) return;
      var k = 1 - Math.exp(-dt / 260);
      beds = lerp(beds, c.stops[stop].beds, 1 - Math.exp(-dt / 320));
      var narrow = W < 300;
      var chipW = narrow ? 70 : 118, conv = narrow ? 34 : 84;
      var chipH = Math.min(H * .66, 236), chipX = W - chipW - 6, chipY = (H - chipH) / 2;
      var laneX1 = chipX - conv, laneW = laneX1 - 4, row = H / S.length;
      var nb = Math.ceil(beds - .01), speed = RM ? 0 : t * .05;
      var total = 0;
      function bedOp(bi) { return bi === 0 ? 1 : clamp(beds - bi, 0, 1); }
      S.forEach(function (o) {
        o.light = RM ? (o.on ? 1 : 0) : lerp(o.light, o.on ? 1 : 0, k);
        if (o.light > .02) for (var bi = 0; bi < Math.max(1, nb); bi++) total += o.light * bedOp(bi);
      });
      var entry = 0;
      S.forEach(function (o, i) {
        var yc = row * (i + .5), b = Math.max(1, nb);
        var sp = Math.min(4.2, row * .72 / b), ampB = row * .3 / (1 + (beds - 1) * .6);
        var fn = WAVES[o.kind], db = '';
        for (var x = 0; x <= laneW; x += 4) db += (x ? 'L' : 'M') + f1(4 + x) + ' ' + f1(yc - fn(x + speed) * row * .3);
        o.base.setAttribute('d', db);
        o.base.style.opacity = (1 - o.light * .85).toFixed(2);
        for (var bi = 0; bi < MAXB; bi++) {
          var wv = o.wv[bi], cv = o.cv[bi], dot = o.dots[bi];
          var bo = bedOp(bi);
          if (bi >= b || o.light < .02 || bo <= 0) { wv.style.display = 'none'; cv.style.display = 'none'; dot.style.display = 'none'; continue; }
          var y = yc + (bi - (b - 1) / 2) * sp, reveal = clamp(o.light * 1.15, 0, 1) * laneW, dw = '';
          for (var x2 = 0; x2 <= reveal; x2 += 4) dw += (x2 ? 'L' : 'M') + f1(4 + x2) + ' ' + f1(y - fn(x2 + speed + bi * 37) * ampB);
          wv.style.display = dw ? '' : 'none';
          wv.setAttribute('d', dw || 'M0 0');
          var sw = (o.hover ? 2.2 : 1.5) / (1 + (b - 1) * .14);
          wv.setAttribute('stroke-width', f1(sw * 10) / 10);
          wv.style.opacity = (bo * (b > 1 ? .55 + .45 / b : .95)).toFixed(2);
          var cvOp = clamp((o.light - .75) / .25, 0, 1) * bo;
          var wgt = o.light * bo;
          var ey = chipY + 14 + (total > 0 ? (entry + wgt / 2) / total : .5) * (chipH - 28);
          entry += wgt;
          var mx = laneX1 + conv * .55;
          cv.style.display = cvOp > .01 ? '' : 'none';
          cv.setAttribute('d', 'M' + f1(laneX1) + ' ' + f1(y) + 'C' + f1(mx) + ' ' + f1(y) + ' ' + f1(mx) + ' ' + f1(ey) + ' ' + f1(chipX) + ' ' + f1(ey));
          cv.setAttribute('stroke-width', f1(sw * 10) / 10);
          cv.style.opacity = (cvOp * (b > 1 ? .5 : .85)).toFixed(2);
          var showDot = !RM && cvOp > .5 && (bi % 3 === 0);
          dot.style.display = showDot ? '' : 'none';
          if (showDot) {
            var tau = mod(t / 1500 + i * .137 + bi * .071, 1);
            dot.setAttribute('cx', f1(bez(laneX1, mx, mx, chipX, tau)));
            dot.setAttribute('cy', f1(bez(y, y, ey, ey, tau)));
          }
        }
      });

      /* the one chip */
      chipB.setAttribute('x', f1(chipX)); chipB.setAttribute('y', f1(chipY)); chipB.setAttribute('width', chipW); chipB.setAttribute('height', f1(chipH));
      var far = stop === nst - 1;
      halo.style.display = far ? '' : 'none';
      halo.setAttribute('x', f1(chipX - 8)); halo.setAttribute('y', f1(chipY - 8)); halo.setAttribute('width', chipW + 16); halo.setAttribute('height', f1(chipH + 16));
      halo.setAttribute('stroke-dashoffset', RM ? 0 : f1(-(t / 60) % 22));
      var pd = '';
      for (var py = chipY + 12; py < chipY + chipH - 8; py += 10) pd += 'M' + f1(chipX + chipW) + ' ' + f1(py) + 'h5';
      for (var px = chipX + 10; px < chipX + chipW - 6; px += 10) pd += 'M' + f1(px) + ' ' + f1(chipY) + 'v-5M' + f1(px) + ' ' + f1(chipY + chipH) + 'v5';
      cpins.setAttribute('d', pd);
      var cols = narrow ? 4 : 5, rowsq = 7, pitch = narrow ? 11 : 15, sq = narrow ? 7 : 10;
      var gx = chipX + (chipW - cols * pitch) / 2 + (pitch - sq) / 2, gy = chipY + 16;
      var load = clamp(total / 30, 0, 1), litN = Math.round((.12 + .88 * Math.sqrt(load)) * cols * rowsq);
      csq.forEach(function (r, i) {
        if (i >= cols * rowsq) { r.style.display = 'none'; return; }
        r.style.display = '';
        r.setAttribute('x', f1(gx + (i % cols) * pitch)); r.setAttribute('y', f1(gy + Math.floor(i / cols) * pitch));
        r.setAttribute('width', sq); r.setAttribute('height', sq);
        var on = hash(i * 2.7) * cols * rowsq < litN;
        r.setAttribute('opacity', on ? (RM ? .85 : (.55 + .4 * (.5 + .5 * Math.sin(t / 700 + i * 1.3)))).toFixed(2) : .12);
      });
      var ty = gy + rowsq * pitch + 18;
      ct1.setAttribute('x', f1(chipX + chipW / 2)); ct1.setAttribute('y', f1(ty));
      ct2.setAttribute('x', f1(chipX + chipW / 2)); ct2.setAttribute('y', f1(ty + 16));
    });

    watchSize(box, function () { measure(); redraw(); });
    setStop(RM ? 2 : 1);
  }

  /* ---------- page ---------- */
  document.title = C.docTitle;
  var iw = document.getElementById('intro-wrap');
  iw.append(el('h1', null, { text: C.title.h1 }), el('p', 'lede', { text: C.title.lede }), el('span', 'meas', { text: C.title.pill }));
  drawFab(document.getElementById('fab'), C.fab);
  drawRecordings(document.getElementById('recordings'), C.recordings);
  drawSensors(document.getElementById('sensors'), C.sensors);
  document.getElementById('foot').textContent = C.footer;
})();
