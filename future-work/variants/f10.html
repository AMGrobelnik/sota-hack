      var dt = st.last ? Math.min(64, t - st.last) : 16; st.last = t;
      if (st.auto && t - st.t0 > 3800) { st.t0 = t; st.target = (Math.round(st.target) + 1) % 4; }
      if (Math.abs(st.target - st.v) > 0.001) { st.v += (st.target - st.v) * Math.min(1, dt * 0.0035); if (Math.abs(st.target - st.v) < 0.002) st.v = st.target; ui(); }
      render(t);
    });
  }

  drawFab(document.getElementById('viz-fab'), C.fab);
  drawRecordings(document.getElementById('viz-rec'), C.recordings);
  drawSensors(document.getElementById('viz-sen'), C.sensors);
})();
</script>
