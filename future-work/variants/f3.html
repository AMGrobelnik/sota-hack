<style>
:root {

/* top bar (as the landing page) */

/* 1: fab presets, flip cards */
.fabv { display: flex; flex-direction: column; gap: 14px; }

.fhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

      s('path', { d: pins, class: 'pin' }, gChip);
      s('rect', { x: xc - r, y: yc - r, width: cs, height: cs, rx: Math.max(8, cs * 0.1), class: 'chipo' }, gChip);
      core = s('rect', { x: xc - r * 0.72, y: yc - r * 0.72, width: r * 1.44, height: r * 1.44, rx: Math.max(6, cs * 0.07), class: 'core' }, gChip);
      if (!L.P) {
        s('text', { x: xc, y: yc - 2, class: 'chT' }, gChip, c.chip);
        s('text', { x: xc, y: yc + 17, class: 'chS' }, gChip, c.chipSub);
        var ox = xc + r + 6, ex = L.W - 6;
        s('line', { x1: ox, y1: yc, x2: ex, y2: yc, class: 'out' }, gChip);
        s('path', { d: 'M' + (ex - 7) + ' ' + (yc - 5) + 'L' + ex + ' ' + yc + 'L' + (ex - 7) + ' ' + (yc + 5), fill: 'none', class: 'out' }, gChip);
        s('text', { x: ox + 8, y: yc - 12, class: 'cap' }, gChip, c.out.join(' '));
        L.out = [ox, yc, ex, yc];
      } else {
        var t = s('text', { x: xc, y: yc + 4, class: 'chT' }, gChip, c.chip);
        t.style.fontSize = '12px';
        var oy = yc + r + 10, ey = oy + 30;
        s('line', { x1: xc, y1: oy, x2: xc, y2: ey, class: 'out' }, gChip);
        s('text', { x: xc, y: ey + 18, class: 'chS' }, gChip, c.chipSub);
        s('text', { x: xc, y: ey + 36, class: 'cap', 'text-anchor': 'middle' }, gChip, c.out[0]);
        s('text', { x: xc, y: ey + 52, class: 'cap', 'text-anchor': 'middle' }, gChip, c.out[1]);
        L.out = [xc, oy, xc, ey];
      }
      outDot = RM ? null : s('circle', { r: 3.2, class: 'sdot', opacity: 0 }, gChip);
    }

    function bz(a, b, cc, d, t) { var u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * cc + t * t * t * d; }
    function buildLanes(fresh) {
      clear(gLanes); clear(gDots);
      lanes = []; dots = [];
      var cs = L.cs, x1 = L.x0 + L.cw, x2 = L.xc - cs / 2 - 2, band = cs * 0.84 / NS_;
      cards.forEach(function (o) {
        var yi = cardY(o.i) + L.chH / 2, m = o.on ? mult : 1;
        for (var j = 0; j < m; j++) {
          var sp = Math.min(4.5, L.chH * 0.7 / Math.max(1, m - 1 || 1));
          var ya = yi + (m > 1 ? (j - (m - 1) / 2) * sp : 0);
          var yb = L.yc - cs * 0.42 + (o.i + (j + 0.5) / m) * band;
          var dx = (x2 - x1) * 0.5;
          var pts = [x1, ya, x1 + dx, ya, x2 - dx, yb, x2, yb];
          var d = 'M' + f1(x1) + ' ' + f1(ya) + 'C' + f1(pts[2]) + ' ' + f1(pts[3]) + ' ' + f1(pts[4]) + ' ' + f1(pts[5]) + ' ' + f1(x2) + ' ' + f1(yb);
          var p = s('path', { d: d, class: 'ln' + (o.on ? '' : ' off') }, gLanes);
          if (o.on) {
            p.setAttribute('pathLength', 1);
            if (fresh && !RM && (!prevLit[o.k] || j >= (prevLit[o.k] || 0))) { p.classList.add('new'); p.style.animationDelay = (j * 0.06) + 's'; }
            if (m > 2) p.style.strokeWidth = '1';
            var dt = RM ? null : s('circle', { r: m > 2 ? 2 : 2.6, class: 'sdot' }, gDots);
            lanes.push({ pts: pts, dot: dt, off: (o.i * 0.137 + j * 0.31) % 1, sp: 0.00024 + ((o.i + j) % 3) * 0.00003 });
          }
        }
      });
      var nl = lanes.length;
      core.style.fillOpacity = (0.35 + 0.65 * Math.min(1, nl / 24)).toFixed(2);
    }
    function flip(o, on, animate) {
      o.on = on;
      o.g.setAttribute('aria-pressed', on ? 'true' : 'false');
      var show = function () { o.front.style.display = on ? '' : 'none'; o.back.style.display = on ? 'none' : ''; };
      if (animate && !RM && o.fl.animate) {
        o.fl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: 170, easing: 'ease-in', delay: o.i * 40 }).onfinish = function () {
          show();
          o.fl.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 190, easing: 'ease-out' });
        };
      } else show();
      var depth = on ? (mult >= 6 ? 2 : mult >= 3 ? 1 : 0) : 0;
      clear(o.stk);
      for (var dd = depth; dd >= 1; dd--) s('rect', { x: dd * 4, y: -dd * 3, width: L.cw, height: L.chH, rx: 9, class: 'stk' }, o.stk);
    }
    function apply(animate) {
      if (!L) return;
      prevLit = {};
      cards.forEach(function (o) { if (o.on) prevLit[o.k] = o.lastM || 1; });
      cards.forEach(function (o) {
        var want = !!lit[o.k];
        if (want !== o.on || !animate) flip(o, want, animate && want !== o.on);
        else flip(o, want, false);
      });
      buildLanes(animate);
      cards.forEach(function (o) { o.lastM = o.on ? mult : 0; });
      colh.textContent = c.colHead[stop];
      stopB.forEach(function (b, i) { b.setAttribute('aria-checked', i === stop ? 'true' : 'false'); b.classList.toggle('past', i < stop); b.tabIndex = i === stop ? 0 : -1; });
      var pc = (stop / (c.stops.length - 1)) * 100;
      fill.style.width = Math.min(pc, 66.667) + '%';
      thumb.style.left = pc + '%';
      note.textContent = c.notes[stop];
      note.classList.toggle('far', stop === c.stops.length - 1);
    }
    function setStop(i) {
      stop = clamp(i, 0, c.stops.length - 1);
      lit = {};
      STOPS[stop].lit.forEach(function (k) { lit[k] = true; });
      mult = STOPS[stop].m;
      apply(true);
    }
    function toggle(i) {
      var k = LIST[i].k, count = Object.keys(lit).filter(function (x) { return lit[x]; }).length;
      if (lit[k] && count <= 1) return;
      lit[k] = !lit[k];
      apply(true);
    }
    function more() {
      for (var i = 0; i < NS_; i++) if (!lit[LIST[i].k]) { lit[LIST[i].k] = true; apply(true); return; }
      if (stop < c.stops.length - 1) setStop(Math.max(stop + 1, 2));
    }
    function user() { auto = false; clearInterval(timer); timer = 0; }
    stopsEl.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
      if (!d) return;
      e.preventDefault(); user();
      setStop(stop + d);
      stopB[stop].focus();
    });
    var dragging = false;
    function nearest(e) { var r = stopsEl.getBoundingClientRect(); return clamp(Math.floor((e.clientX - r.left) / (r.width / c.stops.length)), 0, c.stops.length - 1); }
    spec.addEventListener('pointerdown', function (e) { dragging = true; user(); var n = nearest(e); if (n !== stop) setStop(n); });
    spec.addEventListener('pointermove', function (e) { if (!dragging) return; var n = nearest(e); if (n !== stop) setStop(n); });
    window.addEventListener('pointerup', function () { dragging = false; });

    var lp = loop(function (t) {
      lanes.forEach(function (ln) {
        if (!ln.dot) return;
        var u = (t * ln.sp + ln.off) % 1, p = ln.pts;
        ln.dot.setAttribute('cx', f1(bz(p[0], p[2], p[4], p[6], u)));
        ln.dot.setAttribute('cy', f1(bz(p[1], p[3], p[5], p[7], u)));
        ln.dot.setAttribute('opacity', Math.min(1, Math.sin(u * Math.PI) * 1.6).toFixed(2));
      });
      if (outDot && L.out) {
        var u = (t * 0.0005) % 1, o = L.out;
        outDot.setAttribute('cx', f1(lerp(o[0], o[2], u)));
        outDot.setAttribute('cy', f1(lerp(o[1], o[3], u)));
        outDot.setAttribute('opacity', Math.sin(u * Math.PI).toFixed(2));
      }
      if (core) core.style.strokeOpacity = (0.6 + 0.4 * Math.sin(t * 0.002)).toFixed(2);
    });
    setStop(stop);
    sized(box, layout);
    watch(root, function () {
      lp.start();
      if (auto && !timer) timer = setInterval(function () { setStop((stop + 1) % c.stops.length); }, 3800);
    }, function () { lp.stop(); clearInterval(timer); timer = 0; });
  }

  /* ---------- wire the page ---------- */
  document.querySelectorAll('[data-c]').forEach(function (e) { e.textContent = get(e.getAttribute('data-c')); });
  document.querySelectorAll('[data-aria]').forEach(function (e) { e.setAttribute('aria-label', get(e.getAttribute('data-aria'))); });
  var SECTIONS = { fab: drawFab, recordings: drawRecordings, sensors: drawSensors };
  document.querySelectorAll('.sec[data-key]').forEach(function (sec) {
    var key = sec.getAttribute('data-key'), copy = C[key];
    sec.setAttribute('aria-label', copy.k);
    renderText(sec.querySelector('.txt'), copy);
    SECTIONS[key](sec.querySelector('.vis'), copy);
  });
})();
</script>
<script src="../variant-nav.js"></script>
