<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar (as z3) */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 34px); pointer-events: none; transition: background .3s, color .3s; }
.top > * { pointer-events: auto; }
.top.solid { background: rgba(13, 23, 38, .82); backdrop-filter: blur(10px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.nav { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.nav .lnk { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.nav .lnk:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.nav .lnk[aria-current=page] { color: #fff; text-decoration: underline; text-decoration-color: #5be49b; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--signal); color: #062418; font-weight: 650; border-radius: 10px; padding: 12px 22px; text-decoration: none; letter-spacing: -.005em; transition: background .15s, transform .15s; white-space: nowrap; }
.btn:hover { background: #86f2b9; }
.btn:active { transform: translateY(1px); }
.btn-s { padding: 9px 16px; font-size: 15px; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
.brand .lk-l { display: none; }

/* title block */
.wrap { max-width: 1180px; margin: 0 auto; }
.intro { padding: clamp(118px, 17vh, 168px) clamp(20px, 5.4vw, 84px) clamp(8px, 2vh, 20px); background: linear-gradient(180deg, #0d1726 0%, var(--night) 100%); }
.intro h1 { font-size: clamp(48px, 6.6vw, 100px); line-height: .95; letter-spacing: -.04em; font-weight: 650; margin: 0 0 22px; color: #fff; text-wrap: balance; text-shadow: 0 2px 40px rgba(8, 12, 30, .45); }
.intro .lede { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 36ch; margin: 0 0 16px; }
.meas { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 650; color: var(--amber); border: 1px solid rgba(255, 184, 107, .5); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

/* the three sections */
.fw { position: relative; min-height: 100svh; display: flex; align-items: center; padding: clamp(80px, 10vh, 112px) clamp(20px, 5.4vw, 84px) clamp(32px, 5vh, 56px); }
.fw > .wrap { width: 100%; display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: clamp(28px, 4vw, 60px); align-items: center; }
.fw + .fw > .wrap { border-top: 1px solid var(--rule); padding-top: clamp(28px, 5vh, 48px); }
.st-n { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font-size: clamp(17px, 1.4vw, 20px); font-weight: 650; letter-spacing: -.015em; line-height: 1.15; color: #fff; }
.st-n b { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--signal); color: var(--signal); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.st-n::after { content: ""; flex: 1; min-width: 24px; height: 1px; margin-left: 6px; background: linear-gradient(90deg, rgba(91, 228, 155, .55), rgba(214, 228, 242, 0)); }
.fw h2 { font-size: clamp(36px, 4.2vw, 62px); font-weight: 650; letter-spacing: -.035em; line-height: 1.02; margin: 0; color: #fff; max-width: 15ch; text-wrap: balance; }
.fw .say { font-size: clamp(17px, 1.3vw, 19px); line-height: 1.42; color: #c4d1df; margin: 20px 0 0; max-width: 32ch; }

/* framed visual panel */
.viz { position: relative; display: flex; flex-direction: column; min-width: 0; border: 1px solid rgba(214, 228, 242, .2); border-radius: 20px; background: #0b1626; overflow: hidden; }
.viz .stage { position: relative; height: clamp(380px, 54svh, 500px); touch-action: pan-y; }
#fab .viz svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }
#fab .viz svg text { font-family: var(--f); }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 16px 18px 4px; }
.seg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.seg-l { font-size: 12.5px; font-weight: 650; color: #8fa2b8; margin-right: 4px; }
.pill { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(214, 228, 242, .28); font: 600 14px/1.1 var(--f); color: #dbe5ef; cursor: pointer; transition: background .2s, border-color .2s, color .2s; white-space: nowrap; }
.pill:hover { border-color: rgba(214, 228, 242, .6); color: #fff; }
.pill[aria-pressed=true] { background: #1b4a36; border-color: var(--signal); color: #fff; }
.pill:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.vfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 4px 18px 16px; font-size: 12.5px; color: #8fa2b8; min-height: 44px; }
.vfoot .note { color: #90a2b7; }
.m { display: inline-flex; align-items: center; gap: 8px; color: #c4d1df; font-weight: 600; }
.m i { position: relative; display: block; width: 84px; height: 6px; border-radius: 3px; background: rgba(214, 228, 242, .12); overflow: hidden; }
.m i::after { content: ""; position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--v, .5)); background: #9aabc0; border-radius: 3px; transition: transform .5s ease; }
.m.best i::after { background: var(--signal); }

/* svg pieces */
#fab .mesh { fill: none; stroke: rgba(214, 228, 242, .1); stroke-width: 4; stroke-linecap: round; }
#fab .feed { fill: none; stroke: rgba(214, 228, 242, .2); stroke-width: 5; stroke-linecap: round; }
#fab .lit { fill: none; stroke: var(--signal); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
#fab .glow { fill: none; stroke: rgba(91, 228, 155, .16); stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
#fab .stn { cursor: pointer; outline: none; }
#fab .stn .ring { fill: #0f1a2a; stroke: #c4d1df; stroke-width: 3; transition: fill .3s, stroke .3s; }
#fab .stn .halo { fill: rgba(91, 228, 155, .18); opacity: 0; transition: opacity .3s; }
#fab .stn .hit { fill: transparent; }
#fab .stn:hover .ring { stroke: #fff; }
#fab .stn.on .ring { stroke: var(--signal); fill: #e9fff2; }
#fab .stn.on .halo { opacity: 1; }
#fab .stn:focus-visible .ring { stroke: var(--signal); stroke-width: 4; }
#fab .stn:focus-visible .halo { opacity: 1; }
#fab .lb { fill: #dbe5ef; font-size: 15px; font-weight: 650; letter-spacing: -.01em; paint-order: stroke; stroke: #0b1626; stroke-width: 6px; stroke-linejoin: round; }
#fab .lb.s { font-size: 12.5px; font-weight: 600; fill: #8fa2b8; }
#fab .lb.am { fill: var(--amber); font-size: 13.5px; }
#fab .on .lb, #fab .lb.hi { fill: #fff; }
#fab .chipbody { fill: #13233a; stroke: var(--signal); stroke-width: 1.5; }
#fab .chipgrid { stroke: rgba(91, 228, 155, .28); stroke-width: 1; }
#fab .pin { stroke: rgba(214, 228, 242, .5); stroke-width: 1.5; }
#fab .train { fill: #e9fff2; stroke: var(--signal); stroke-width: 2.5; }
#fab .wall { fill: none; stroke: rgba(214, 228, 242, .42); stroke-width: 1.5; }
#fab .wall2 { fill: none; stroke: rgba(214, 228, 242, .16); stroke-width: 1.2; }
#fab .inb { fill: none; stroke: rgba(214, 228, 242, .32); stroke-width: 5; stroke-linecap: round; }
#fab .chev { fill: none; stroke: #dbe5ef; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#fab .stub { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 6 5; }
#fab .buffer { stroke: var(--amber); stroke-width: 3; stroke-linecap: round; }
#fab .flow { fill: none; stroke: #e9fff2; stroke-width: 3; stroke-linecap: round; opacity: .8; }
#fab .card { fill: #13233a; stroke: rgba(214, 228, 242, .28); stroke-width: 1.2; }
#fab .card.new { stroke: var(--signal); }
#fab .trace { fill: none; stroke: var(--signal); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
#fab .lane { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke .4s, opacity .4s; }
#fab .lane.off { stroke: rgba(214, 228, 242, .14); stroke-dasharray: 2 7; }
#fab .lane.live { stroke: var(--signal); opacity: .75; }
#fab .lane.flash { stroke: #e9fff2; opacity: 1; }
#fab .lanelab { cursor: pointer; outline: none; }
#fab .lanelab .hit { fill: transparent; }
#fab .lanelab text { font-size: 14px; font-weight: 600; fill: #6f839b; transition: fill .3s; }
#fab .lanelab.live text { fill: #e8eef5; }
#fab .lanelab:hover text, #fab .lanelab:focus-visible text { fill: #fff; }
#fab .lanelab:focus-visible .hit { stroke: var(--signal); stroke-width: 2; rx: 8px; }
#fab .pulse { fill: #e9fff2; }
#fab .wire { stroke: rgba(91, 228, 155, .35); stroke-width: 1.2; }
#fab .node { fill: #1b4a36; stroke: var(--signal); stroke-width: 2; }
#fab .nodeglow { fill: rgba(91, 228, 155, .16); }
#fab .far { fill: none; stroke: rgba(255, 184, 107, .7); stroke-width: 1.5; stroke-dasharray: 6 5; }


footer.pf { padding: 0 clamp(20px, 5.4vw, 84px) 40px; }
footer.pf .wrap { border-top: 1px solid var(--rule); padding-top: 22px; font-size: 13px; color: #607086; margin-top: 24px; }

@media (max-width: 980px) {
  .fw > .wrap { grid-template-columns: 1fr; }
  .fw h2 { max-width: 18ch; }
  .viz .stage { height: 470px; }
}
@media (max-width: 700px) {
  .top { padding: 12px 14px; }
  .nav { gap: 12px; }
  .nav .lnk { font-size: 14px; }
}
@media (max-width: 600px) {
  .nav .lnk.ab { display: none; }
  .nav .btn-s { padding: 8px 12px; font-size: 14px; }
  .fw { align-items: flex-start; }
  .ctl { padding: 14px 14px 2px; gap: 10px; }
  .seg { gap: 6px; }
  .seg-l { flex-basis: 100%; }
  .pill { padding: 8px 11px; font-size: 13.5px; }
  .vfoot { padding: 4px 14px 14px; gap: 8px 16px; }
  .m i { width: 56px; }
  #fab .stage { height: 470px; }
}
@media (max-width: 520px) { .brand .lk { height: 24px; } }
@media (prefers-reduced-motion: reduce) {
  .top, .btn, .pill, .m i::after, .spec .fill, .spec button::before, .stn .ring, .stn .halo, .lane, .lanelab text { transition: none; }
}
.fw-next { display: flex; justify-content: center; padding: clamp(32px, 6vh, 64px) 20px; scroll-snap-align: end; }

/* 02 your own recordings (as f1) */
#recordings .panel { position: relative; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 20px; background: #0b1626; overflow: hidden; box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .8); }
#recordings .stage { position: relative; flex: 1; min-height: 0; }
#recordings .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; touch-action: pan-y; }
#recordings .stage svg text { font-family: var(--f); }
#recordings .p-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 18px 6px; }
