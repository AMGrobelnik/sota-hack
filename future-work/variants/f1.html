<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --side: clamp(20px, 5.4vw, 84px);
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; scroll-snap-type: y proximity; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar (as the landing page) */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 34px); pointer-events: none; transition: background .3s, color .3s; }
.top > * { pointer-events: auto; }
.top.solid { background: rgba(13, 23, 38, .82); backdrop-filter: blur(10px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.nav { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.nav .lnk { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.nav .lnk:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.nav .lnk[aria-current=page] { color: #fff; text-decoration: underline; text-decoration-color: #5be49b; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--signal); color: #062418; font-weight: 650; border-radius: 10px; padding: 12px 22px; text-decoration: none; letter-spacing: -.005em; transition: background .15s, transform .15s; border: 0; font-family: var(--f); cursor: pointer; white-space: nowrap; }
.btn:hover { background: #86f2b9; }
.btn:active { transform: translateY(1px); }
.btn-s { padding: 9px 16px; font-size: 15px; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
.brand .lk-l { display: none; }

/* title block */
.wrap { max-width: 1180px; margin: 0 auto; }
.head { padding: calc(64px + clamp(40px, 9vh, 96px)) var(--side) clamp(8px, 2vh, 24px); background: linear-gradient(180deg, #0d1726 0%, var(--night) 100%); }
.head h1 { font-size: clamp(48px, 6.6vw, 100px); line-height: .95; letter-spacing: -.04em; font-weight: 650; margin: 0 0 22px; color: #fff; text-wrap: balance; }
.lede { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 36ch; margin: 0 0 16px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.meas { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 650; color: var(--amber); border: 1px solid rgba(255, 184, 107, .5); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }

/* the three sections */
.sec { min-height: 100svh; display: flex; align-items: center; padding: 84px var(--side) 36px; scroll-snap-align: start; }
.sec .wrap { width: 100%; display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.5fr); gap: clamp(28px, 4vw, 64px); align-items: center; }
.st-n { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font-size: clamp(17px, 1.4vw, 20px); font-weight: 650; letter-spacing: -.015em; line-height: 1.15; color: #fff; }
.st-n b { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--signal); color: var(--signal); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.st-n span { white-space: nowrap; color: #c4d1df; }
.sec h2 { font-size: clamp(36px, 4.2vw, 62px); font-weight: 650; letter-spacing: -.035em; line-height: 1.02; margin: 0 0 20px; color: #fff; max-width: 15ch; text-wrap: balance; }
.say { font-size: clamp(17px, 1.3vw, 19px); line-height: 1.45; color: #c4d1df; max-width: 32ch; margin: 0 0 18px; }
.vis { height: min(calc(100svh - 130px), 720px); min-height: 500px; }

/* the shared panel */
.panel { position: relative; height: 100%; display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 20px; background: #0b1626; overflow: hidden; box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .8); }
.stage { position: relative; flex: 1; min-height: 0; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; touch-action: pan-y; }
.stage svg text { font-family: var(--f); }
.p-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 18px 6px; }
.p-leg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 6px 18px 10px; font-size: 12.5px; color: #8fa2b8; }
.p-leg i { display: inline-block; width: 16px; height: 10px; margin-right: 7px; vertical-align: -1px; border-radius: 2px; }
.p-leg .lg-t { border: 1px dashed rgba(255, 184, 107, .6); }
.p-leg .lg-c { border: 1.5px solid var(--signal); background: #13233a; }
.p-leg .note { margin-left: auto; color: #90a2b7; }
.p-ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; padding: 14px 18px 16px; border-top: 1px solid var(--rule); background: #0d1a2c; }
.cap { font-size: 12.5px; font-weight: 600; color: #8fa2b8; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
.cap .meas { font-size: 11px; padding: 0 7px; }

/* fab presets */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: 600 14.5px var(--f); color: #dbe5ef; background: #13233a; border: 1px solid rgba(214, 228, 242, .28); border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer; transition: background .2s, border-color .2s, color .2s; }
.seg button:hover { border-color: rgba(91, 228, 155, .6); color: #fff; }
.seg button[aria-checked=true] { background: #1b4a36; border-color: var(--signal); color: #fff; }
.facts { display: flex; gap: 6px; flex-wrap: wrap; }
.fact { font-size: 12.5px; font-weight: 600; color: #c4d1df; padding: 4px 9px; border-radius: 7px; background: #13233a; border: 1px solid rgba(214, 228, 242, .16); white-space: nowrap; }
.fab-svg .tile { fill: rgba(19, 35, 58, .3); stroke: rgba(255, 184, 107, .42); stroke-width: 1; stroke-dasharray: 4 4; transition: fill .45s, stroke .45s; }
.fab-svg .tile.used { fill: #13233a; stroke: rgba(214, 228, 242, .22); stroke-dasharray: none; }
.die { fill: none; stroke: var(--signal); stroke-width: 1.5; }
.blk .b { fill: #16263c; stroke: rgba(214, 228, 242, .28); stroke-width: 1.2; transition: stroke .3s, fill .3s; }
.blk.on .b { stroke: var(--signal); fill: #1b4a36; }
.blk text { fill: #dbe5ef; font-size: 12.5px; font-weight: 600; pointer-events: none; }
.blk .gates { fill: url(#fw-gates); opacity: .9; pointer-events: none; }
.unit { fill: rgba(91, 228, 155, .22); stroke: var(--signal); stroke-width: 1.2; }
.wire { fill: none; stroke: rgba(214, 228, 242, .34); stroke-width: 1.5; }
.dot { fill: #e9fff2; }
.dials { display: flex; gap: 10px; }
.dial { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 96px; padding: 4px 2px; border-radius: 12px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.dial:active { cursor: grabbing; }
.dial:hover .knob { stroke: rgba(91, 228, 155, .7); }
.dial svg { width: 60px; height: 60px; display: block; overflow: visible; }
.dial .trk { fill: none; stroke: rgba(214, 228, 242, .16); stroke-width: 4; stroke-linecap: round; }
.dial .val { fill: none; stroke: var(--signal); stroke-width: 4; stroke-linecap: round; }
.dial .knob { fill: #13233a; stroke: rgba(214, 228, 242, .28); stroke-width: 1.2; transition: stroke .2s; }
.dial .ptr { stroke: #fff; stroke-width: 2; stroke-linecap: round; }
.dial .dl { font-size: 13px; font-weight: 650; color: #fff; text-align: center; line-height: 1.2; }
.dial .dv { font-size: 12px; color: #8fa2b8; }
.bars { flex: 1; min-width: 220px; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.bars .cap { grid-column: 1 / -1; margin: 0; }
.bars span { font-size: 12.5px; color: #c4d1df; }
.bar { height: 7px; border-radius: 999px; background: #13233a; overflow: hidden; border: 1px solid rgba(214, 228, 242, .12); }
.bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, rgba(91, 228, 155, .45), var(--signal)); border-radius: 999px; transition: width .5s; }
.ends { grid-column: 2; display: flex; justify-content: space-between; font-size: 11.5px; color: #8fa2b8; margin-top: -4px; }

/* your own recordings */
.rec-svg .bound { fill: rgba(19, 35, 58, .25); stroke: rgba(255, 184, 107, .6); stroke-width: 1.4; stroke-dasharray: 7 6; }
.amb { fill: var(--amber); font-size: 13px; font-weight: 650; }
.amb.s { font-size: 12.5px; font-weight: 600; }
.lane .wv { fill: none; stroke: #9fb4c9; stroke-width: 1.5; stroke-linejoin: round; transition: stroke .3s; }
.lane .lb { fill: #8fa2b8; font-size: 12.5px; font-weight: 600; transition: fill .3s; }
.lane .hit { fill: transparent; cursor: default; }
.lane.hot .wv, .lane.new .wv { stroke: var(--signal); }
.lane.hot .lb, .lane.new .lb { fill: #dfffee; }
.feed { fill: none; stroke: rgba(214, 228, 242, .3); stroke-width: 1.4; transition: stroke .3s; }
.feed.hot { stroke: var(--signal); }
.hub circle { fill: #13233a; stroke: rgba(255, 184, 107, .7); stroke-width: 1.4; transition: stroke .3s, fill .3s; }
.hub path { fill: none; stroke: var(--amber); stroke-width: 1.8; stroke-linecap: round; transition: stroke .3s; }
.hub .ah { fill: var(--amber); stroke: none; transition: fill .3s; }
.hub.go circle { stroke: var(--signal); fill: #1b4a36; }
.hub.go path { stroke: var(--signal); }
.hub.go .ah { fill: var(--signal); }
.lbl-bg { fill: #0b1626; }
.tune-cap { font-size: 13.5px; font-weight: 650; fill: #c4d1df; transition: fill .4s; }
.tune-cap.ok { fill: var(--signal); }
.btn-g { font: 600 14.5px var(--f); color: #dbe5ef; background: transparent; border: 1px solid rgba(214, 228, 242, .28); border-radius: 10px; padding: 9px 14px; min-height: 40px; cursor: pointer; }
.btn-g:hover { border-color: rgba(91, 228, 155, .6); color: #fff; }
.btn:disabled { background: #2b4a3c; color: #9cc9b2; cursor: default; transform: none; }
.fit { flex: 1; min-width: 200px; }
.fit .bar { height: 9px; }
.fit .ends { margin-top: 5px; }
.acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* every sensor, one chip */
.sen-svg .lane .wv { stroke: rgba(196, 209, 223, .8); }
.sen-svg .lane.new .wv { stroke: var(--signal); stroke-width: 2; }
.port { fill: #13233a; stroke: rgba(214, 228, 242, .4); stroke-width: 1; }
.port.on { fill: rgba(91, 228, 155, .55); stroke: var(--signal); }
.cell { fill: var(--signal); }
.far { fill: none; stroke: rgba(255, 184, 107, .75); stroke-width: 1.4; stroke-dasharray: 6 5; }
.chiplab { fill: #fff; font-size: 13.5px; font-weight: 650; }
.spec { flex: 1 1 340px; min-width: 260px; }
.track { position: relative; height: 40px; cursor: pointer; touch-action: none; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 19px; height: 3px; border-radius: 3px; background: rgba(214, 228, 242, .18); }
.track .fill { position: absolute; left: 0; top: 19px; height: 3px; border-radius: 3px; background: var(--signal); width: 0; }
.track .thumb { position: absolute; top: 10px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px rgba(91, 228, 155, .18); left: 0; }
.track .tick { position: absolute; top: 15px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #0d1a2c; border: 1.5px solid rgba(214, 228, 242, .5); }
.track .tick.past { border-color: var(--signal); background: #1b4a36; }
.track .tick.end { border-color: var(--amber); border-style: dashed; }
.stops { position: relative; height: 40px; margin: 0 0 0; }
.stops button { position: absolute; top: 0; transform: translateX(-50%); font: 600 13px var(--f); color: #8fa2b8; background: none; border: 0; padding: 0 4px; min-height: 40px; min-width: 40px; cursor: pointer; white-space: nowrap; border-radius: 8px; }
.stops button:first-child { transform: none; left: 0 !important; padding-left: 0; text-align: left; }
.stops button:last-child { transform: translateX(-100%); text-align: right; padding-right: 0; }
.stops button.on { color: #fff; }
.stops button:hover { color: #fff; }
@media (max-width: 560px) { .stops { height: 46px; } .stops button { white-space: normal; width: 25%; text-align: center; font-size: 12.5px; line-height: 1.15; padding-top: 4px; } }
.sen-row { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; width: 100%; }
.sen-cap { margin: 0; font-size: 15px; font-weight: 600; color: #e8eef5; flex: 1 1 260px; min-height: 22px; }
.sen-cap .meas { display: table; margin: 6px 0 0; }

footer.foot { max-width: 1180px; margin: 0 auto; padding: 22px 0 40px; border-top: 1px solid var(--rule); font-size: 13px; color: #607086; }
.foot-wrap { padding: 24px var(--side) 0; }

@media (max-width: 1100px) {
  .sec .wrap { grid-template-columns: minmax(0, .8fr) minmax(0, 1.6fr); }
}
@media (max-width: 900px) {
  html { scroll-snap-type: none; }
  .sec { padding-top: 72px; padding-bottom: 28px; }
  .sec .wrap { grid-template-columns: 1fr; gap: 22px; }
  .vis { height: auto; min-height: 0; }
  .panel { height: auto; }
  .stage { flex: none; height: 330px; }
  #v-rec .stage { height: 470px; }
  #v-sen .stage { height: 360px; }
  .p-leg .note { margin-left: 0; }
  .sec h2 { margin-bottom: 14px; }
}
@media (max-width: 700px) {
  .top { padding: 12px 14px; }
  .nav { gap: 12px; }
  .nav .lnk { font-size: 14px; }
  .p-top, .p-leg, .p-ctrl { padding-left: 14px; padding-right: 14px; }
  .dials { width: 100%; justify-content: space-between; }

}
@media (max-width: 560px) { .nav .lnk-about { display: none; } }
@media (max-width: 520px) { .brand .lk { height: 24px; } }
@media (max-width: 400px) { .nav { gap: 10px; } .nav .lnk { font-size: 13.5px; } .btn-s { padding: 9px 12px; font-size: 14px; } }
@media (prefers-reduced-motion: reduce) {
  .top, .btn, .seg button, .fab-svg .tile, .blk .b, .bar i, .lane .wv, .lane .lb, .feed, .hub circle, .tune-cap { transition: none; }
}
.fw-next { display: flex; justify-content: center; padding: clamp(32px, 6vh, 64px) 20px; scroll-snap-align: end; }
</style>

  onResize(stage, () => { build(); api.kick(); });
  build();
  sync();
}

drawFab(document.getElementById('v-fab'), C.fab);
drawRecordings(document.getElementById('v-rec'), C.recordings);
drawSensors(document.getElementById('v-sen'), C.sensors);
})();
