<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChipIn</title>
<meta name="theme-color" content="#0f1a2a">
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --side: clamp(20px, 5.4vw, 84px);
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar (as on the landing page) */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 34px); pointer-events: none; transition: background .3s, color .3s; }
.top > * { pointer-events: auto; }
.top.solid { background: rgba(13, 23, 38, .82); backdrop-filter: blur(10px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.nav { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.nav .lnk { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.nav .lnk:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.nav .lnk[aria-current=page] { color: #fff; text-decoration: underline; text-decoration-color: #5be49b; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--signal); color: #062418; font-weight: 650; border-radius: 10px; padding: 12px 22px; text-decoration: none; letter-spacing: -.005em; transition: background .15s, transform .15s; white-space: nowrap; }
.btn:hover { background: #86f2b9; }
.btn:active { transform: translateY(1px); }
.btn-s { padding: 9px 16px; font-size: 15px; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
.brand .lk-l { display: none; }

/* title block */
.wrap { max-width: 1180px; margin: 0 auto; }
.intro { padding: calc(clamp(72px, 11vh, 120px) + 36px) var(--side) 0; }
.intro h1 { font-size: clamp(48px, 6.6vw, 100px); line-height: .95; letter-spacing: -.04em; font-weight: 650; margin: 0 0 20px; color: #fff; text-wrap: balance; max-width: 12ch; }
.intro .lede { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 34ch; margin: 0 0 16px; }
.meas { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 650; color: var(--amber); border: 1px solid rgba(255, 184, 107, .5); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }

/* the three sections */
.fw { min-height: 100svh; display: flex; align-items: center; padding: clamp(72px, 11vh, 120px) var(--side) clamp(36px, 6vh, 64px); }
.fw .wrap { width: 100%; display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.3fr); gap: clamp(28px, 4.4vw, 72px); align-items: center; }
.fw + .fw .wrap { border-top: 1px solid var(--rule); padding-top: clamp(28px, 4vh, 44px); }
.st-n { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; font-size: clamp(16px, 1.3vw, 19px); font-weight: 650; letter-spacing: -.015em; line-height: 1.15; color: #c4d1df; }
.st-n b { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--signal); color: var(--signal); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.fw h2 { font-size: clamp(36px, 4.2vw, 62px); font-weight: 650; letter-spacing: -.035em; line-height: 1.02; margin: 0 0 20px; color: #fff; max-width: 15ch; text-wrap: balance; }
.say { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 30ch; margin: 0 0 18px; text-wrap: pretty; }

/* the framed visual */
.vis { position: relative; display: flex; flex-direction: column; height: min(78svh, 700px); min-height: 540px; border: 1px solid var(--rule); border-radius: 20px; background: #0b1626; overflow: hidden; }
.vhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 0; min-height: 58px; }
.ro { font-size: 14px; color: #c4d1df; line-height: 1.4; min-width: 0; }
.ro b { color: #fff; font-weight: 650; font-size: 15.5px; margin-right: 8px; }
.ro .meas { margin-left: 6px; vertical-align: 1px; }
.vhead > .meas { flex: none; }
.stage { position: relative; flex: 1; min-height: 0; }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 4px 18px 12px; }
.glabel { font-size: 13px; color: #8fa2b8; font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--rule); border-radius: 12px; background: #0f1d31; }
.seg button { all: unset; box-sizing: border-box; cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 9px; font: 600 14.5px/40px var(--f); color: #c4d1df; transition: background .15s, color .15s; white-space: nowrap; }
.seg button[aria-pressed=true] { background: var(--signal); color: #062418; }
.seg button:hover:not([aria-pressed=true]) { color: #fff; background: rgba(214, 228, 242, .08); }
.seg button:focus-visible, .add:focus-visible, .stop:focus-visible, .spec:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.add { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(91, 228, 155, .6); background: rgba(14, 54, 38, .6); color: #dfffee; font: 650 14.5px/1 var(--f); transition: background .15s; white-space: nowrap; }
.add:hover { background: rgba(14, 54, 38, .95); }
.add[aria-disabled=true] { opacity: .45; cursor: default; }
.meters { display: flex; gap: 18px; padding: 0 18px 10px; }
.m { flex: 1; min-width: 0; font-size: 12.5px; color: #8fa2b8; font-weight: 600; }
.m i { display: block; height: 6px; border-radius: 999px; background: rgba(214, 228, 242, .12); margin-top: 6px; overflow: hidden; }
.m i b { display: block; height: 100%; width: 0; border-radius: 999px; background: #4b6482; transition: width .5s, background .3s; }
.m.on { color: #e9fff2; }
.m.on i b { background: var(--signal); }
.cap { font-size: 12.5px; color: #8fa2b8; padding: 0 18px 14px; margin: 0; }

/* spectrum slider (section 3) */
.spec { position: relative; margin: 4px 18px 4px; padding: 14px 0 0; touch-action: none; cursor: pointer; border-radius: 8px; }
.spec .track { position: relative; height: 4px; margin: 0 10px; border-radius: 999px; background: rgba(214, 228, 242, .14); }
.spec .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--signal); }
.spec .thumb { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 5px rgba(91, 228, 155, .18); }
.spec .tick { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #0b1626; border: 1.5px solid rgba(214, 228, 242, .45); }
.spec .tick.on { border-color: var(--signal); background: #1b4a36; }
.stops { position: relative; height: 46px; margin: 4px 28px 0; }
.stop { all: unset; box-sizing: border-box; position: absolute; top: 0; min-height: 40px; padding: 6px 4px; max-width: 120px; font: 600 13px/1.2 var(--f); color: #8fa2b8; cursor: pointer; transform: translateX(-50%); text-align: center; border-radius: 6px; white-space: nowrap; }
.stop:first-child { transform: none; text-align: left; padding-left: 0; }
.stop:last-child { transform: translateX(-100%); text-align: right; padding-right: 0; }
.stop.on { color: #fff; }
.stop.far { color: #ffd2a1; }
.stop .sh { display: none; }

/* svg pieces */
.orb { fill: none; stroke: rgba(214, 228, 242, .16); stroke-width: 1.2; transition: stroke .4s; }
.orb.on { stroke: rgba(91, 228, 155, .5); }
.pl { cursor: pointer; outline: none; }
.pl .body { fill: #13233a; stroke: rgba(214, 228, 242, .32); stroke-width: 1.3; transition: fill .3s, stroke .3s; }
.pl .glow { fill: none; stroke: rgba(91, 228, 155, .2); stroke-width: 8; opacity: 0; transition: opacity .3s; }
.pl.on .body { fill: #1b4a36; stroke: var(--signal); }
.pl.on .glow, .pl:focus-visible .glow { opacity: 1; }
.pl:hover .body { stroke: #dfffee; }
.pl .tile { fill: none; stroke: #9fb3c8; stroke-width: 1.3; }
.pl.on .tile { stroke: #dfffee; }
.pl text { fill: #dbe5ef; font: 650 15px var(--f); }
.pl.on text { fill: #fff; }
.chipbody { fill: #101f33; stroke: var(--signal); stroke-width: 1.5; }
.pads { fill: none; stroke: rgba(214, 228, 242, .42); stroke-width: 5; stroke-dasharray: 2.5 7; }
.tether { stroke: var(--signal); stroke-width: 1.5; stroke-linecap: round; }
.ghost { fill: none; stroke: rgba(223, 255, 238, .7); stroke-width: 1.3; stroke-dasharray: 5 5; }
.bound { fill: #0e1c2f; stroke: rgba(214, 228, 242, .3); stroke-width: 1.5; transition: stroke .3s; }
.bound.hit { stroke: var(--amber); }
.btag rect { fill: #0b1626; stroke: rgba(214, 228, 242, .3); stroke-width: 1.2; transition: stroke .3s; }
.btag text { fill: #dbe5ef; font: 650 13px var(--f); transition: fill .3s; }
.btag.hit rect { stroke: var(--amber); }
.btag.hit text { fill: var(--amber); }
.sat { cursor: grab; outline: none; touch-action: none; }
.sat:active { cursor: grabbing; }
.sat rect { fill: #13233a; stroke: rgba(214, 228, 242, .32); stroke-width: 1.2; transition: stroke .2s; }
.sat path { fill: none; stroke: var(--signal); stroke-width: 1.5; stroke-linejoin: round; }
.sat text { fill: #dbe5ef; font: 600 12px var(--f); opacity: 0; transition: opacity .2s; }
.sat.on rect, .sat:focus-visible rect { stroke: var(--signal); }
.sat.on text, .sat:focus-visible text { opacity: 1; }
.link { stroke: rgba(214, 228, 242, .14); stroke-width: 1; stroke-dasharray: 2 5; }
.fitbg { fill: none; stroke: rgba(214, 228, 242, .12); stroke-width: 6; }
.fit { fill: none; stroke: var(--signal); stroke-width: 6; stroke-linecap: round; }
.slab { fill: #c4d1df; font: 600 12.5px var(--f); }
.mlab { fill: #fff; font: 650 12.5px var(--f); }
.mlab2 { fill: #c4d1df; font: 500 11.5px var(--f); }
.lane { fill: none; stroke: var(--signal); stroke-linejoin: round; stroke-linecap: round; }
.node { fill: #13233a; stroke: var(--signal); stroke-width: 1.5; }
.nlab { fill: #c4d1df; font: 600 13px var(--f); }
.farring { fill: none; stroke: rgba(255, 184, 107, .65); stroke-width: 1.5; stroke-dasharray: 6 5; }

footer { max-width: 1180px; margin: 24px auto 0; padding: 22px 0 40px; border-top: 1px solid var(--rule); font-size: 13px; color: #607086; }
.foot { padding: 0 var(--side); }

@media (max-width: 900px) {
  .fw { align-items: flex-start; }
  .fw .wrap { grid-template-columns: 1fr; gap: 26px; }
  .vis { height: auto; min-height: 0; }
  .stage { flex: none; height: clamp(330px, 92vw, 520px); }
  .say { max-width: 36ch; }
}
@media (max-width: 700px) {
  .top { padding: 12px 14px; }
  .nav { gap: 12px; }
  .nav .lnk { font-size: 14px; }
  .meters { gap: 12px; }
  .seg button { padding: 0 11px; font-size: 14px; }
  .stop { font-size: 12px; }
  .stop .lg { display: none; }
  .stop .sh { display: inline; }
  .stop:last-child { white-space: normal; width: 64px; }
  .nlab { font-size: 11.5px; }
}
@media (max-width: 520px) {
  .brand .lk { height: 24px; }
  .nav .lnk-about { display: none; }
  .btn-s { padding: 9px 13px; font-size: 14px; }
  .vhead { padding: 14px 14px 0; }
  .ctrl, .meters, .cap { padding-left: 14px; padding-right: 14px; }
  .spec { margin-left: 14px; margin-right: 14px; }
  .stops { margin-left: 24px; margin-right: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .top, .btn, .orb, .pl .body, .pl .glow, .m i b, .seg button, .bound, .btag rect, .btag text, .sat rect, .sat text { transition: none; }
}
.fw-next { display: flex; justify-content: center; padding: clamp(32px, 6vh, 64px) 20px; scroll-snap-align: end; }
</style>

        if (on) {
          var tw = 0;
          try { tw = btText.getComputedTextLength(); } catch (e) { tw = 140; }
          var bw = tw + 40;
          set(btRect, { x: cx - bw / 2, width: bw }); set(btText, { x: cx - bw / 2 + 29 });
          var ix = cx - bw / 2 + 12, iy = cy - RB - 6;
          btIcon.setAttribute('d', 'M' + ix + ' ' + (iy + 6) + 'l6 -5l6 5v7h-12z');
        } else if (btText.dataset.w !== 'm') {
          var tw2 = 0;
          try { tw2 = btText.getComputedTextLength(); } catch (e) { tw2 = 96; }
          var bw2 = tw2 + 40;
          set(btRect, { x: cx - bw2 / 2, width: bw2 }); set(btText, { x: cx - bw2 / 2 + 29 });
          var ix2 = cx - bw2 / 2 + 12, iy2 = cy - RB - 6;
          btIcon.setAttribute('d', 'M' + ix2 + ' ' + (iy2 + 6) + 'l6 -5l6 5v7h-12z');
        }
        btText.dataset.w = on ? 's' : 'm';
        var h0 = hitA - 0.32, h1 = hitA + 0.32;
        hitArc.setAttribute('d', 'M' + f1(cx + RB * Math.cos(h0)) + ' ' + f1(cy + RB * Math.sin(h0)) + 'A' + f1(RB) + ' ' + f1(RB) + ' 0 0 1 ' + f1(cx + RB * Math.cos(h1)) + ' ' + f1(cy + RB * Math.sin(h1)));
        hitArc.setAttribute('opacity', hitT.toFixed(2));
        if (RM && hitT > 0) kick();
      }
    });
    for (var i = 0; i < (RM ? 5 : 3); i++) addSat();
    sats.forEach(function (s) { s.a = s.ta; });
    if (RM) { fitV = target(); fitShown = fitV; }
  }

  /* ---------------------------------------------------------------------------------------------
     03 Every sensor, one chip: sensor streams converge in parallel into one chip; a slider walks the
     spectrum from one sensor to a whole hospital; adding a sensor lights a new lane.
     --------------------------------------------------------------------------------------------- */
  function drawSensors(root, c) {
    var P = frameParts(root, c);
    var svg = P.svg;
    var roName = H('b', null, P.ro), roCap = H('span', null, P.ro), roFar = pill(P.ro, c.far);
    var gLanes = S('g', {}, svg);
    var far = S('circle', { class: 'farring', opacity: 0 }, svg);
    var gNodes = S('g', {}, svg);
    var halo = S('circle', { fill: 'none', stroke: '#5be49b', 'stroke-width': 1.5 }, svg);
    var gChip = S('g', {}, svg);
    var lanes = [];
    var MAX = c.stops[c.stops.length - 1].n;
    var n = RM ? c.stops[2].n : 1, touched = false, autoT = 0;
    var W = 0, Hh = 0, cx = 0, cy = 0, RN = 0, hc = 0, small = false;

    // slider along the spectrum
    var spec = H('div', 'spec', root);
    set(spec, { role: 'slider', tabindex: 0, 'aria-label': c.slider, 'aria-valuemin': 1, 'aria-valuemax': MAX });
    var track = H('div', 'track', spec), fillEl = H('i', 'fill', track);
    var ticks = c.stops.map(function (s, i) { var tk = H('span', 'tick', track); tk.style.left = (i / (c.stops.length - 1) * 100) + '%'; return tk; });
    var thumb = H('b', 'thumb', track);
    var stopsEl = H('div', 'stops', root);
    var stopBtns = c.stops.map(function (s, i) {
      var b = H('button', 'stop' + (i === c.stops.length - 1 ? ' far' : ''), stopsEl);
      H('span', 'lg', b, s.label);
      H('span', 'sh', b, s.short);
      b.type = 'button';
      b.style.left = (i / (c.stops.length - 1) * 100) + '%';
      b.addEventListener('click', function () { touched = true; setN(s.n); });
      return b;
    });
    var ctrl = H('div', 'ctrl', root);
    var add = H('button', 'add', ctrl, '+ ' + c.add);
    add.type = 'button';
    add.addEventListener('click', function () { touched = true; setN(n + 1); });

    function pOf(v) {
      var st = c.stops;
      for (var i = 0; i < st.length - 1; i++) if (v <= st[i + 1].n) return i + (v - st[i].n) / (st[i + 1].n - st[i].n);
      return st.length - 1;
    }
    function nOf(p) {
      var st = c.stops, i = clamp(Math.floor(p), 0, st.length - 2);
      return Math.round(lerp(st[i].n, st[i + 1].n, clamp(p - i, 0, 1)));
    }
    function stopIdx() { var j = 0; c.stops.forEach(function (s, i) { if (n >= s.n) j = i; }); return j; }
    function setN(v) {
      v = clamp(Math.round(v), 1, MAX);
      if (v > n) for (var i = n; i < v; i++) lane(i).flash = 1;
      n = v;
      var p = pOf(n) / (c.stops.length - 1) * 100, j = stopIdx(), last = j === c.stops.length - 1;
      fillEl.style.width = p + '%';
      thumb.style.left = p + '%';
      ticks.forEach(function (tk, i) { tk.classList.toggle('on', n >= c.stops[i].n); });
      stopBtns.forEach(function (b, i) { b.classList.toggle('on', i === j); b.setAttribute('aria-pressed', String(i === j)); });
      roName.textContent = c.stops[j].label;
      roCap.textContent = c.stops[j].cap;
      roFar.style.display = last ? '' : 'none';
      set(spec, { 'aria-valuenow': n, 'aria-valuetext': c.stops[j].label + ', ' + n });
      add.setAttribute('aria-disabled', String(n >= MAX));
      kick();
    }
    function fromX(clientX) {
      var r = track.getBoundingClientRect();
      var p = clamp((clientX - r.left) / r.width, 0, 1) * (c.stops.length - 1);
      touched = true;
      setN(nOf(p));
    }
    var dragging = false;
    spec.addEventListener('pointerdown', function (e) { dragging = true; spec.setPointerCapture(e.pointerId); fromX(e.clientX); });
    spec.addEventListener('pointermove', function (e) { if (dragging) fromX(e.clientX); });
    spec.addEventListener('pointerup', function () { dragging = false; });
    spec.addEventListener('pointercancel', function () { dragging = false; });
    spec.addEventListener('keydown', function (e) {
      var j = stopIdx(), st = c.stops;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); touched = true; setN(n < st[j].n ? st[j].n : st[Math.min(j + 1, st.length - 1)].n); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); touched = true; setN(n > st[j].n ? st[j].n : st[Math.max(j - 1, 0)].n); }
      else if (e.key === 'Home') { e.preventDefault(); touched = true; setN(1); }
      else if (e.key === 'End') { e.preventDefault(); touched = true; setN(MAX); }
    });

    function lane(i) {
      while (lanes.length <= i) {
        var j = lanes.length, ty = c.types[j % c.types.length];
        var L = {
          type: ty, a: Math.PI + j * TAU / Math.max(n, j + 1), alpha: 0, flash: 0, w: 0,
          path: S('path', { class: 'lane', opacity: 0 }, gLanes),
          node: S('circle', { class: 'node', opacity: 0 }, gNodes),
          lab: S('text', { class: 'nlab', opacity: 0 }, gNodes)
        };
        L.lab.textContent = ty.name;
        lanes.push(L);
      }
      return lanes[i];
    }
    function buildChip() {
      while (gChip.firstChild) gChip.removeChild(gChip.firstChild);
      S('rect', { class: 'pads', x: cx - hc - 6, y: cy - hc - 6, width: 2 * hc + 12, height: 2 * hc + 12, rx: 10 }, gChip);
      S('rect', { class: 'chipbody', x: cx - hc, y: cy - hc, width: 2 * hc, height: 2 * hc, rx: 8, style: 'fill:#16352b' }, gChip);
      var t1 = S('text', { class: 'mlab', x: cx, y: cy - 2, 'text-anchor': 'middle' }, gChip);
      t1.textContent = c.chip;
      var t2 = S('text', { class: 'mlab2', x: cx, y: cy + 14, 'text-anchor': 'middle' }, gChip);
      t2.textContent = c.chipSub;
    }
    sized(P.stage, function (w, h) {
      W = w; Hh = h; small = w < 520;
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      cx = w / 2; cy = h / 2;
      RN = Math.max(60, Math.min(w / 2 - (small ? 50 : 96), h / 2 - 34));
      hc = clamp(RN * 0.24, 36, 50);
      set(far, { cx: cx, cy: cy, r: RN + 16 });
      lanes.forEach(function (L) { L.lw = 0; L.lab.textContent = small ? L.type.short : L.type.name; });
      buildChip();
    });
    for (var i = 0; i < MAX; i++) lane(i);
    lanes.forEach(function (L) { L.lab.textContent = L.type.name; });

    register(root, {
      enter: function () { if (!touched) autoT = 0; },
      tick: function (t, dt) {
        if (!W) return;
        // first view: sensors join one by one up to a few
        if (!touched && !RM && n < c.stops[1].n) { autoT += dt; if (autoT > 1.1) { autoT = 0; setN(n + 1); } }
        var k = ease(dt, 4), showLabels = n <= c.types.length;
        var lw = n > 20 ? 1 : n > 9 ? 1.25 : 1.6;
        var re = hc * 1.3;
        for (var i = 0; i < lanes.length; i++) {
          var L = lanes[i], act = i < n;
          L.alpha = lerp(L.alpha, act ? 1 : 0, k);
          if (!act && L.alpha < 0.01) {
            if (L.vis) { L.path.setAttribute('opacity', 0); L.node.setAttribute('opacity', 0); L.lab.setAttribute('opacity', 0); L.vis = false; }
            continue;
          }
          L.vis = true;
          var ta = Math.PI + i * TAU / n, da = ((ta - L.a + Math.PI * 3) % TAU) - Math.PI;
          L.a += da * k;
          L.flash *= 1 - ease(dt, 1.4);
          var ca = Math.cos(L.a), sa = Math.sin(L.a);
          var spacing = RN * TAU / Math.max(n, 2);
          var amp = clamp(spacing * 0.26, 2.2, small ? 9 : 13);
          var wv = L.type.wave, rt = RATE[wv], d = '', m = n <= 12 ? 90 : 40;
          for (var s = 0; s <= m; s++) {
            var u = s / m, r = lerp(RN - 9, re, u);
            var off = amp * WAVES[wv](t * rt[0] + (1 - u) * rt[1] * 1.4) * Math.min(1, (1 - u) * 2.4) * (r / RN);
            var x = cx + r * ca - sa * off, y = cy + r * sa + ca * off;
            d += (s ? 'L' : 'M') + f1(x) + ' ' + f1(y);
          }
          set(L.path, { d: d, opacity: (L.alpha * (n > 20 ? 0.75 : 0.95)).toFixed(2), 'stroke-width': (lw + L.flash * 2).toFixed(2) });
          var nr = n > 9 ? 3.6 : small ? 5.5 : 7;
          set(L.node, { cx: f1(cx + RN * ca), cy: f1(cy + RN * sa), r: (nr + L.flash * 4).toFixed(2), opacity: L.alpha.toFixed(2) });
          // labels sit outside the ring and are kept inside the frame
          var la = L.alpha * (showLabels ? 1 : 0), lx = cx + (RN + 14) * ca, ly = cy + (RN + 14) * sa + 4.5;
          if (la > 0.01) {
            if (!L.lw) { try { L.lw = L.lab.getComputedTextLength(); } catch (e) { L.lw = 80; } }
            var left = ca > 0.35 ? lx : ca < -0.35 ? lx - L.lw : lx - L.lw / 2;
            if (sa < -0.8) ly -= 6; else if (sa > 0.8) ly += 8;
            left = clamp(left, 4, W - 4 - L.lw);
            set(L.lab, { x: f1(left), y: f1(ly), opacity: la.toFixed(2) });
          } else L.lab.setAttribute('opacity', 0);
        }
        // one inference over every stream at once: the halo pulses
        var ph = RM ? 0.35 : (t / 1.4) % 1;
        set(halo, { cx: cx, cy: cy, r: f1(hc * 1.45 + ph * 18), opacity: (0.7 * (1 - ph)).toFixed(2) });
        var farOn = n > c.stops[2].n ? clamp((n - c.stops[2].n) / 8, 0, 1) : 0;
        far.setAttribute('opacity', farOn.toFixed(2));
      }
    });
    setN(n);
  }

  /* page assembly: text column from COPY, then each section's visual */
  function get(path) { return path.split('.').reduce(function (o, k) { return o && o[k]; }, C); }
  document.title = C.doc;
  Array.prototype.forEach.call(document.querySelectorAll('[data-c]'), function (e) { e.textContent = get(e.getAttribute('data-c')); });
  var draw = { fab: drawFab, recordings: drawRecordings, sensors: drawSensors };
  Array.prototype.forEach.call(document.querySelectorAll('.fw'), function (sec) {
    var key = sec.getAttribute('data-key'), c = C[key];
    var wrap = H('div', 'wrap', sec);
    var txt = H('div', 'txt', wrap);
    var st = H('p', 'st-n', txt);
    H('b', null, st, c.step);
    H('span', null, st, c.name);
    var h2 = H('h2', null, txt, c.h2);
    h2.id = key + '-h';
    sec.setAttribute('aria-labelledby', h2.id);
    H('p', 'say', txt, c.say);
    pill(txt, c.planned);
    var vis = H('div', 'vis', wrap);
    draw[key](vis, c);
  });
})();
</script>
<script src="../variant-nav.js"></script>
</body>
