<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="../../assets/brand/favicon.svg">
<title>ChipIn</title>
<style>
:root {
  --night: #0f1a2a;
  --deep: #16263c;
  --paper: #eef1f2;
  --ink: #132033;
  --signal: #5be49b;
  --amber: #ffb86b;
  --dusk: #c9a3c4;
  --mute: #9aabc0;
  --rule: rgba(214, 228, 242, .15);
  --f: "Avenir Next", "Avenir", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--night); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: #e8eef5; font: 400 17px/1.5 var(--f); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

/* top bar (as the landing page) */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px clamp(16px, 3vw, 34px); pointer-events: none; transition: background .3s, color .3s; }
.top > * { pointer-events: auto; }
.top.solid { background: rgba(13, 23, 38, .82); backdrop-filter: blur(10px); }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 650; font-size: 18px; letter-spacing: -.01em; text-decoration: none; color: #fff; }
.nav { display: flex; align-items: center; gap: clamp(14px, 2vw, 26px); }
.nav .lnk { font-size: 15px; font-weight: 600; text-decoration: none; color: #dbe5ef; white-space: nowrap; }
.nav .lnk:hover { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
.nav .lnk[aria-current=page] { color: #fff; text-decoration: underline; text-decoration-color: #5be49b; text-underline-offset: 6px; text-decoration-thickness: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; background: var(--signal); color: #062418; font-weight: 650; border-radius: 10px; padding: 12px 22px; text-decoration: none; letter-spacing: -.005em; transition: background .15s, transform .15s; border: 0; font-family: var(--f); cursor: pointer; white-space: nowrap; }
.btn:hover { background: #86f2b9; }
.btn:active { transform: translateY(1px); }
.btn-s { padding: 9px 16px; font-size: 15px; }
.brand .lk { height: 28px; width: auto; display: block; flex: none; }
.brand .lk-l { display: none; }

/* title block */
.wrap { max-width: 1180px; margin: 0 auto; }
.intro { padding: clamp(118px, 17vh, 170px) clamp(20px, 5.4vw, 84px) clamp(12px, 3vh, 32px); background: linear-gradient(180deg, #0d1726 0%, var(--night) 70%); }
.intro h1 { font-size: clamp(48px, 6.6vw, 100px); line-height: .95; letter-spacing: -.04em; font-weight: 650; margin: 0 0 20px; color: #fff; text-wrap: balance; text-shadow: 0 2px 40px rgba(8, 12, 30, .45); }
.intro .lede { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 34ch; margin: 0 0 18px; }
.meas { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 650; color: var(--amber); border: 1px solid rgba(255, 184, 107, .5); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }

/* the three sections */
.fw { position: relative; min-height: 100svh; display: flex; align-items: center; padding: 84px clamp(20px, 5.4vw, 84px) 36px; }
.fw .grid { width: 100%; display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.4fr); gap: clamp(28px, 4vw, 64px); align-items: center; }
.fw + .fw::before { content: ""; position: absolute; top: 0; left: clamp(20px, 5.4vw, 84px); right: clamp(20px, 5.4vw, 84px); max-width: 1180px; margin: 0 auto; height: 1px; background: var(--rule); }
.st-n { display: flex; align-items: center; gap: 12px; margin: 0; font-size: clamp(16px, 1.3vw, 18px); font-weight: 650; letter-spacing: -.01em; color: #c4d1df; }
.st-n b { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--signal); color: var(--signal); font-size: 13px; font-weight: 700; letter-spacing: 0; }
.txt h2 { font-size: clamp(36px, 4.2vw, 62px); font-weight: 650; letter-spacing: -.035em; line-height: 1.02; color: #fff; max-width: 15ch; margin: 20px 0 18px; text-wrap: balance; }
.txt .sent { font-size: clamp(18px, 1.45vw, 21px); line-height: 1.4; color: #d6deea; max-width: 30ch; margin: 0 0 22px; }
.txt .hint { display: flex; align-items: center; gap: 9px; margin: 22px 0 0; font-size: 14px; font-weight: 600; color: #8fa2b8; }
.txt .hint::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 4px rgba(91, 228, 155, .18); }

/* visual frames */
.vz { position: relative; height: min(76svh, 660px); min-height: 470px; border: 1px solid var(--rule); border-radius: 20px; background: #0b1626; overflow: hidden; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
.vz svg { display: block; width: 100%; height: 100%; overflow: visible; }
.vz text { font-family: var(--f); }
.vz-stage { position: relative; flex: 1; min-height: 0; }
.vz-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 16px 18px 6px; }
.vz-foot { padding: 6px 18px 16px; }
.vz-note { margin: 10px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: #8fa2b8; line-height: 1.35; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: #13233a; border: 1px solid rgba(214, 228, 242, .16); }
.seg button { all: unset; box-sizing: border-box; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 9px; font: 650 14.5px/1 var(--f); color: #c4d1df; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s; }
.seg button:hover { color: #fff; }
.seg button[aria-pressed=true] { background: var(--signal); color: #062418; }
.seg button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.fact { margin: 0; font-size: 13px; color: #8fa2b8; }
.fact b { color: #e8eef5; font-weight: 650; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 4px 18px 0; font-size: 12.5px; color: #c4d1df; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; flex: none; }
.lg-ring { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
.lg-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 0 3px rgba(91, 228, 155, .2); }
.lg-reg { width: 16px; height: 11px; border-radius: 5px; background: rgba(27, 74, 54, .9); border: 1.2px solid var(--signal); }
.lg-gap { width: 16px; border-top: 1.6px dashed var(--amber); }
.fab-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 220px; }
.fab-body .vz-stage { min-height: 0; }
.fab-body .vz-foot { display: flex; flex-direction: column; justify-content: center; padding: 10px 20px 18px 4px; }
.fab-body .bars { grid-template-columns: 1fr; gap: 26px; }
.fab-body .bar { grid-template-columns: 1fr; gap: 7px; }
.bars { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 22px; align-items: center; }
.bar-rows { display: grid; gap: 9px; }
.bar { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; color: #c4d1df; }
.bar .tr { height: 8px; border-radius: 999px; background: #13233a; overflow: hidden; }
.bar .fl { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, rgba(91, 228, 155, .45), var(--signal)); transform-origin: 0 50%; }
.vz svg.die { width: 186px; height: 119px; justify-self: center; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 18px; padding: 8px 18px 16px; }
.ctl .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.ghost { all: unset; box-sizing: border-box; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 10px; border: 1px solid rgba(214, 228, 242, .28); font: 650 14.5px/1 var(--f); color: #dbe5ef; cursor: pointer; white-space: nowrap; }
.ghost:hover { border-color: var(--signal); color: #fff; }
.ghost:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.ctl .btn[disabled] { opacity: .45; cursor: default; background: var(--signal); }
.ctl .btn { min-height: 40px; }
.meter { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 600; color: #c4d1df; }
.meter .tr { width: clamp(90px, 12vw, 150px); height: 8px; border-radius: 999px; background: #13233a; overflow: hidden; }
.meter .fl { height: 100%; width: 100%; background: linear-gradient(90deg, rgba(91, 228, 155, .45), var(--signal)); transform-origin: 0 50%; transform: scaleX(0); }
.card { cursor: grab; outline: none; }
.card.used { cursor: default; }
.card:focus-visible .cbox { stroke: var(--signal); stroke-width: 2; }
.card.drag { cursor: grabbing; }
.lane-hit { cursor: pointer; outline: none; }
.lane-hit:focus-visible .lane-bg { stroke: var(--signal); stroke-width: 1.5; }
.fade { transition: opacity .45s ease; }

/* spectrum control */
.spec { position: relative; padding: 4px 18px 16px; touch-action: pan-y; }
.spec ol { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.spec .trk, .spec .far, .spec .lit { position: absolute; top: 20px; height: 0; }
.spec .trk { left: 12.5%; width: 50%; border-top: 1.5px solid rgba(214, 228, 242, .3); }
.spec .far { left: 62.5%; width: 25%; border-top: 1.5px dashed rgba(255, 184, 107, .75); }
.spec ol.at-far .far { border-top: 2.4px dashed var(--amber); margin-top: -.5px; }
.spec .lit { left: 12.5%; border-top: 2.4px solid var(--signal); margin-top: -.5px; transition: width .4s ease; }
.spec button { all: unset; box-sizing: border-box; width: 100%; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 4px; cursor: pointer; font: 600 13.5px/1.2 var(--f); color: #8fa2b8; text-align: center; border-radius: 10px; }
.spec button::before { content: ""; position: relative; z-index: 1; width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid rgba(214, 228, 242, .55); background: #0b1626; transition: background .3s, border-color .3s, box-shadow .3s; }
.spec button:hover { color: #fff; }
.spec button.done::before { background: #1b4a36; border-color: var(--signal); }
.spec button[aria-pressed=true] { color: #fff; }
.spec button[aria-pressed=true]::before { background: var(--signal); border-color: var(--signal); box-shadow: 0 0 0 5px rgba(91, 228, 155, .2); }
.spec li:last-child button::before { border-style: dashed; border-color: rgba(255, 184, 107, .8); }
.spec li:last-child button[aria-pressed=true]::before { background: var(--amber); border-color: var(--amber); border-style: solid; box-shadow: 0 0 0 5px rgba(255, 184, 107, .2); }
.spec button:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }
.spec .cap { margin: 8px 0 0; min-height: 2.7em; font-size: 14px; line-height: 1.35; color: #c4d1df; text-align: center; }
.spec .cap.far-c { color: var(--amber); }

footer { max-width: 1180px; margin: 0 auto; padding: 22px 0 36px; border-top: 1px solid var(--rule); font-size: 13px; color: #607086; }
.foot-wrap { padding: 0 clamp(20px, 5.4vw, 84px); }

@media (max-width: 900px) {
  .fw { min-height: 0; padding-top: 72px; padding-bottom: 48px; }
  .fw .grid { grid-template-columns: 1fr; gap: 26px; }
  .txt h2 { margin-top: 16px; }
  .vz { height: 560px; min-height: 0; }
  .vz.vz-sen { height: 540px; }
}
@media (max-width: 700px) {
  .top { padding: 12px 14px; }
  .nav { gap: 12px; }
  .nav .lnk { font-size: 14px; }
  .nav .lnk-about { display: none; }
  .vz.vz-fab { height: 640px; }
  .fab-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .fab-body .vz-foot { padding: 4px 12px 12px; }
  .fab-body .bars { grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; }
  .fab-body .bar, .bar { grid-template-columns: 78px minmax(0, 1fr); gap: 10px; font-size: 12.5px; }
  .vz svg.die { width: 104px; height: 70px; }
  .vz-head { padding: 12px 12px 4px; }
  .legend { padding: 4px 12px 0; gap: 4px 12px; font-size: 12px; }
  .vz-foot { padding: 6px 12px 12px; }
  .seg button { padding: 0 11px; font-size: 13.5px; }
  .ctl { padding: 6px 12px 12px; }
  .spec { padding: 2px 6px 12px; }
  .spec button { font-size: 12.5px; }
  .spec .cap { font-size: 13px; padding: 0 8px; }
}
@media (max-width: 400px) {
  .nav { gap: 10px; }
  .nav .lnk { font-size: 13.5px; }
  .btn-s { padding: 8px 12px; font-size: 14px; }
}
@media (max-width: 520px) { .brand .lk { height: 24px; } }
@media (prefers-reduced-motion: reduce) {
  .top, .btn, .seg button, .spec button::before, .spec .lit, .fade, .card { transition: none !important; }
}
.fw-next { display: flex; justify-content: center; padding: clamp(32px, 6vh, 64px) 20px; scroll-snap-align: end; }
</style>

      s('text', { x: a[0], y: a[1] - 13, 'text-anchor': 'middle', fill: '#fff', 'font-size': 14.5, 'font-weight': 650 }, tg, c.corners[0]);
      s('text', { x: b[0] - 2, y: b[1] + 22, 'text-anchor': 'start', fill: '#fff', 'font-size': 14, 'font-weight': 650 }, tg, c.corners[1]);
      s('text', { x: cc[0] + 2, y: cc[1] + 22, 'text-anchor': 'end', fill: '#fff', 'font-size': 14, 'font-weight': 650 }, tg, c.corners[2]);
      // the path the recordings will pull the model along
      var pts = []; for (var u = 0; u <= 40; u++) pts.push(px(at(u / 40)));
      s('path', { d: pathOf(pts), fill: 'none', stroke: 'rgba(214,228,242,.28)', 'stroke-width': 1.4, 'stroke-dasharray': '4 5' }, tg);
      G.trackPts = pts;
      G.litPath = s('path', { fill: 'none', stroke: '#5be49b', 'stroke-width': 2.4, 'stroke-linecap': 'round' }, tg);
      var cp = px(CEN), sr = Math.max(16, S * 0.075);
      G.sweet = s('circle', { cx: cp[0], cy: cp[1], r: sr, fill: 'none', stroke: '#5be49b', 'stroke-width': 1.4, 'stroke-dasharray': '3 4', opacity: 0.8 }, tg);
      G.sweetFill = s('circle', { cx: cp[0], cy: cp[1], r: sr, fill: 'rgba(27,74,54,.6)', opacity: 0 }, tg);
      s('text', { x: cp[0], y: cp[1] - sr - 10, 'text-anchor': 'middle', fill: '#9ff0c4', 'font-size': 12.5, 'font-weight': 650 }, tg, c.sweet);
      G.trail = s('g', {}, tg);
      G.glow = s('circle', { r: 14, fill: 'rgba(91,228,155,.2)' }, tg);
      G.pt = s('circle', { r: 8, fill: '#5be49b', stroke: '#e9fff2', 'stroke-width': 1.5 }, tg);
      G.ptTag = s('g', {}, tg);
      G.ptTagBg = s('rect', { height: 22, rx: 7, fill: 'rgba(13,23,38,.92)', stroke: 'rgba(255,255,255,.16)' }, G.ptTag);
      G.ptTagTx = s('text', { fill: '#f2f6fa', 'font-size': 12.5, 'font-weight': 650 }, G.ptTag, c.model);
      G.packets = s('g', {}, g);

      // the recording cards
      G.cards = s('g', {}, g);
      cards.forEach(function (cd, i) {
        var cg = s('g', { class: 'card', tabindex: 0, role: 'button', 'aria-label': c.card + ' ' + (i + 1) }, G.cards);
        cd.g = cg;
        s('rect', { class: 'cbox', x: cd.x, y: cd.y, width: cd.w, height: cd.h, rx: 10, fill: '#13233a', stroke: 'rgba(214,228,242,.28)', 'stroke-width': 1.2 }, cg);
        s('text', { x: cd.x + 10, y: cd.y + 16, fill: '#c4d1df', 'font-size': 11.5, 'font-weight': 600 }, cg, c.card + ' ' + (i + 1));
        cd.check = s('path', { d: 'M' + (cd.x + cd.w - 20) + ' ' + (cd.y + 11) + 'l3.5 3.5 6-7', fill: 'none', stroke: '#5be49b', 'stroke-width': 1.8, 'stroke-linecap': 'round', opacity: 0 }, cg);
        var clip = s('clipPath', { id: 'rc' + i }, cg);
        s('rect', { x: cd.x + 8, y: cd.y + 20, width: cd.w - 16, height: cd.h - 24 }, clip);
        cd.wave = s('path', { fill: 'none', stroke: '#e9fff2', 'stroke-width': 1.3, 'stroke-linejoin': 'round', 'clip-path': 'url(#rc' + i + ')' }, cg);

      });
      syncCards();
    }
    function syncCards() {
      cards.forEach(function (cd, i) {
        if (!cd.g) return;

      });
      bDrop.disabled = used.every(Boolean);
    }
    function drop(i, from) {

      used[i] = true; syncCards();
      var cd = cards[i];
      if (RM) { k++; anim.draw(); return; }
      packets.push({ from: from || [cd.x + cd.w / 2, cd.y + cd.h / 2], t0: performance.now() / 1000, el: null });
      anim.draw();
    }
    function onCardDown(e, i) {
      if (used[i]) return;
      e.preventDefault();
      var cd = cards[i], g = cd.g, r = svg.getBoundingClientRect(), sc = W / r.width;

      g.setPointerCapture(e.pointerId);
      g.classList.add('drag'); g.style.transition = 'none';

      }
      function up() {
        g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
        g.classList.remove('drag');

        var over = cxp > triBox.x0 && cxp < triBox.x1 && cyp > triBox.y0 && cyp < triBox.y1;

    }
    bDrop.addEventListener('click', function () { drop(used.indexOf(false), null); });
    bReset.addEventListener('click', function () {
      for (var i = 0; i < NC; i++) used[i] = false;
      k = 0; packets.forEach(function (p) { if (p.el) p.el.remove(); }); packets = [];
      syncCards(); anim.draw();
    });

    var anim = animate(root, function (t, dt) {
      if (!S) return;
      prog = approach(prog, tgtProg(), dt, 3);
      var p = px(at(prog));
      set(G.pt, { cx: f1(p[0]), cy: f1(p[1]) });
      set(G.glow, { cx: f1(p[0]), cy: f1(p[1]), r: f1(RM ? 14 : 14 + 3 * Math.sin(t * 2)) });

      var tw = c.model.length * 7 + 18;
      var tx = flip ? p[0] - 16 - tw : p[0] + 16;

      var done = k >= NC && prog > 0.97;

      G.sweet.setAttribute('stroke-dasharray', done ? 'none' : '3 4');

        var j = G.trail.childNodes.length, tp = px(at(1 - Math.pow(1 - j / NC, 1.5)));
        s('circle', { cx: f1(tp[0]), cy: f1(tp[1]), r: 3.5, fill: '#5be49b', opacity: 0.45 }, G.trail);
      }
      while (G.trail.childNodes.length > k) G.trail.removeChild(G.trail.lastChild);
      // packets flying from a card into the model

        var pk = packets[i], u = (t - pk.t0) / 0.85;
        if (!pk.el) {
          pk.el = s('g', {}, G.packets);
          s('circle', { r: 10, fill: 'rgba(91,228,155,.2)' }, pk.el);
          s('circle', { r: 5, fill: '#5be49b' }, pk.el);
        }
        if (u >= 1) { pk.el.remove(); packets.splice(i, 1); k = Math.min(NC, k + 1); continue; }
        var e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
        var mid = [(pk.from[0] + p[0]) / 2, Math.min(pk.from[1], p[1]) - 60];
        var pp = quad(pk.from, mid, p, e);
        pk.el.setAttribute('transform', 'translate(' + f1(pp[0]) + ',' + f1(pp[1]) + ') scale(' + f1(1 - 0.4 * e) + ')');
      }

        if (!cd.wave) return;
        var ph = RM ? ci * 0.37 : t * (0.5 + ci * 0.04) + ci * 0.37;

        var box = cd.g.firstChild;
        box.setAttribute('stroke', ci === next ? (RM ? 'rgba(91,228,155,.7)' : 'rgba(91,228,155,' + (0.45 + 0.35 * Math.sin(t * 3)).toFixed(2) + ')') : (used[ci] ? 'rgba(91,228,155,.5)' : 'rgba(214,228,242,.28)'));
      });
      mfl.style.transform = 'scaleX(' + (0.06 + 0.94 * prog).toFixed(3) + ')';
    });
    new ResizeObserver(function () { layout(); anim.draw(); }).observe(stage);
    layout();
    anim.draw();
  }

  /* ---------- 3. Every sensor, one chip: lanes into one chip ---------- */
  function drawSensors(root, c) {
    root.classList.add('vz-sen');
    var NS8 = c.sensors.length;
    var active = []; for (var q = 0; q < NS8; q++) active.push(q === 0);
    var stop = 0, cells = [], G = {}, W = 0, Hh = 0, lanes = [], chip = null;

    var stage = h('div', { class: 'vz-stage' }, root);
    var svg = s('svg', { role: 'img', 'aria-label': c.aria }, stage);
    var spec = h('div', { class: 'spec' }, root);
    var ol = h('ol', {}, spec);
    h('div', { class: 'trk' }, ol); h('div', { class: 'far' }, ol);
    var lit = h('div', { class: 'lit' }, ol);
    var sb = c.stops.map(function (name, i) {
      var li = h('li', {}, ol);
      var b = h('button', { type: 'button', 'aria-pressed': 'false' }, li, name);
      b.addEventListener('click', function () { setStop(i, true); });
      b.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault(); var n = clamp(stop + d, 0, 3); setStop(n, true); sb[n].focus();
      });
      return b;
    });
    var cap = h('p', { class: 'cap', 'aria-live': 'polite' }, spec);
    var note = h('p', { class: 'vz-note', style: 'justify-content:center;margin-top:4px' }, spec);
    h('span', { class: 'meas' }, note, c.pills[1]);
    note.appendChild(document.createTextNode(c.note));
    // drag along the spectrum
    ol.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse') return;
      function pick(ev) {
        var r = ol.getBoundingClientRect();
        setStop(clamp(Math.floor((ev.clientX - r.left) / r.width * 4), 0, 3), false);
      }
      function up() { ol.removeEventListener('pointermove', pick); ol.removeEventListener('pointerup', up); ol.removeEventListener('pointercancel', up); }
      ol.addEventListener('pointermove', pick); ol.addEventListener('pointerup', up); ol.addEventListener('pointercancel', up);
    });

    function count() { return active.filter(Boolean).length; }
    function setStop(i, fromStops) {
      stop = i;
      if (fromStops && i === 0) active = active.map(function (_, j) { return j === 0; });
      if (fromStops && i === 1) active = active.map(function (_, j) { return j < 4; });
      sb.forEach(function (b, j) { b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); b.classList.toggle('done', j < i); });
      lit.style.width = (Math.min(i, 2) * 25) + '%'; ol.classList.toggle('at-far', i === 3);
      cap.textContent = c.captions[i];
      cap.classList.toggle('far-c', i === 3);
      build();
    }
    function toggle(i) {
      if (stop > 1) return;
      if (active[i] && count() === 1) return;
      active[i] = !active[i];
      var n = count();
      var ns = n > 1 ? 1 : 0;
      if (ns !== stop) setStop(ns, false); else build();
    }

    function build() {
      W = stage.clientWidth; Hh = stage.clientHeight;
      if (!W || !Hh) return;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      var narrow = W < 520;
      var cs = Math.min(Hh * 0.5, W * (narrow ? 0.26 : 0.28), 230);
      chip = { x: W - cs - (narrow ? 26 : 34), y: (Hh - cs) / 2 - 6, s: cs };
      var g = s('g', { class: 'fade', opacity: RM ? 1 : 0 }, svg);
      var labW = narrow ? 124 : 128, top = 18, availH = Hh - 36;
      var xw0 = labW + 14, ww = Math.max(40, Math.min(170, (chip.x - xw0) * 0.42)), xw1 = xw0 + ww;
      lanes = [];
      var gl = s('g', {}, g);
      if (stop <= 1) {
        var rh = availH / NS8;
        for (var i = 0; i < NS8; i++) {
          var y = top + (i + 0.5) * rh, on = active[i];
          var py = chip.y + cs * (0.12 + 0.76 * (i + 0.5) / NS8);
          var a = [xw1 + 4, y], b = [xw1 + (chip.x - xw1) * 0.55, y], cc = [xw1 + (chip.x - xw1) * 0.45, py], d = [chip.x, py];
          var hit = s('g', { class: 'lane-hit', tabindex: 0, role: 'button', 'aria-pressed': on ? 'true' : 'false', 'aria-label': c.sensors[i] }, gl);
          s('rect', { class: 'lane-bg', x: 6, y: f1(y - rh / 2 + 2), width: f1(xw1 - 2), height: f1(rh - 4), rx: 8, fill: on ? 'rgba(27,74,54,.35)' : 'rgba(19,35,58,.0)', stroke: on ? 'rgba(91,228,155,.25)' : 'rgba(214,228,242,.0)' }, hit);
          if (!on) s('path', { d: 'M' + (16) + ' ' + f1(y) + 'h8M' + 20 + ' ' + f1(y - 4) + 'v8', stroke: '#8fa2b8', 'stroke-width': 1.5 }, hit);
          s('text', { x: on ? 16 : 30, y: f1(y + 4.5), fill: on ? '#fff' : '#7f93ab', 'font-size': narrow ? 12 : 13.5, 'font-weight': on ? 650 : 600 }, hit, c.sensors[i]);
          var wv = s('path', { fill: 'none', stroke: on ? '#e9fff2' : 'rgba(143,162,184,.35)', 'stroke-width': on ? 1.4 : 1, 'stroke-linejoin': 'round' }, hit);
          s('path', { d: 'M' + a.map(f1).join(' ') + 'C' + b.map(f1).join(' ') + ' ' + cc.map(f1).join(' ') + ' ' + d.map(f1).join(' '), fill: 'none', stroke: on ? '#5be49b' : 'rgba(214,228,242,.13)', 'stroke-width': on ? 1.6 : 1.1, 'stroke-dasharray': on ? 'none' : '3 5' }, gl);
          lanes.push({ on: on, pts: [a, b, cc, d], wave: wv, i: i, x0: xw0, x1: xw1, y: y, amp: Math.min(rh * 0.32, 13) });
          (function (idx) {
            hit.addEventListener('click', function () { toggle(idx); });
            hit.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(idx); var el = svg.querySelectorAll('.lane-hit')[idx]; if (el) el.focus(); } });
          })(i);
        }
      } else {
        var groups = stop === 2 ? 6 : 8, per = stop === 2 ? 6 : 10;
        var gh = availH / groups, L = groups * per;
        for (var gi = 0; gi < groups; gi++) {
          var yy = top + (gi + 0.5) * gh;
          s('text', { x: 16, y: f1(yy + 4.5), fill: '#fff', 'font-size': narrow ? 12 : 13.5, 'font-weight': 650 }, gl, (stop === 2 ? c.bed : c.ward) + ' ' + (gi + 1));
          // a mini cluster of sensor glyphs per bed or ward
          for (var m = 0; m < Math.min(per, 6); m++) {
            s('rect', { x: f1(labW - 50 + m * 7), y: f1(yy - 3), width: 5, height: 6, rx: 1, fill: '#5be49b', opacity: stop === 2 ? 0.8 : 0.55 }, gl);
          }
          for (var li = 0; li < per; li++) {
            var j = gi * per + li;
            var sy = yy + (li - (per - 1) / 2) * Math.min(stop === 2 ? 3.4 : 2.6, gh * 0.6 / per);
            var py2 = chip.y + cs * (0.08 + 0.84 * (j + 0.5) / L);
            var a2 = [labW - 4, sy], b2 = [lerp(labW, chip.x, 0.5), sy], c2 = [lerp(labW, chip.x, 0.5), py2], d2p = [chip.x, py2];
            s('path', { d: 'M' + a2.map(f1).join(' ') + 'C' + b2.map(f1).join(' ') + ' ' + c2.map(f1).join(' ') + ' ' + d2p.map(f1).join(' '), fill: 'none', stroke: '#5be49b', 'stroke-width': stop === 2 ? 1 : 0.8, opacity: stop === 2 ? 0.6 : 0.5 }, gl);

          }
        }

      // the chip
      var cg = s('g', {}, g);
      if (stop === 3) s('rect', { x: chip.x - 12, y: chip.y - 12, width: cs + 24, height: cs + 24, rx: 18, fill: 'none', stroke: 'rgba(255,184,107,.75)', 'stroke-width': 1.4, 'stroke-dasharray': '6 5' }, cg);
      var pins = 7;
      for (var pi = 0; pi < pins; pi++) {
        var pp = chip.y + cs * (pi + 0.5) / pins;
        s('line', { x1: chip.x + cs, y1: f1(pp), x2: chip.x + cs + 8, y2: f1(pp), stroke: 'rgba(214,228,242,.4)', 'stroke-width': 1.4 }, cg);
        var qx = chip.x + cs * (pi + 0.5) / pins;
        s('line', { x1: f1(qx), y1: chip.y, x2: f1(qx), y2: chip.y - 7, stroke: 'rgba(214,228,242,.4)', 'stroke-width': 1.4 }, cg);
        s('line', { x1: f1(qx), y1: chip.y + cs, x2: f1(qx), y2: chip.y + cs + 7, stroke: 'rgba(214,228,242,.4)', 'stroke-width': 1.4 }, cg);
      }
      s('rect', { x: chip.x, y: chip.y, width: cs, height: cs, rx: 12, fill: '#13233a', stroke: '#5be49b', 'stroke-width': 1.5 }, cg);
      var gn = narrow ? 6 : 8, pad = cs * 0.12, cell = (cs - 2 * pad) / gn;
      var n = count();
      var frac0 = stop === 0 ? 0.14 : stop === 1 ? 0.12 + 0.08 * n : stop === 2 ? 0.8 : 1;
      cells = [];
      for (var r = 0; r < gn; r++) for (var cc2 = 0; cc2 < gn; cc2++) {
        var idx = r * gn + cc2, onc = ((idx * 37) % (gn * gn)) / (gn * gn) < frac0;
        var el = s('rect', { x: f1(chip.x + pad + cc2 * cell + 1.5), y: f1(chip.y + pad + r * cell + 1.5), width: f1(cell - 3), height: f1(cell - 3), rx: 2, fill: onc ? '#1b4a36' : '#0e1b2e', stroke: onc ? 'rgba(91,228,155,.55)' : 'rgba(214,228,242,.08)', 'stroke-width': 1 }, cg);
        cells.push({ el: el, on: onc, glow: 0 });
      }
      var tx = chip.x + cs / 2, ty = chip.y + cs + 30;
      var tt = s('text', { x: tx, y: ty, 'text-anchor': 'middle', fill: '#fff', 'font-size': 13, 'font-weight': 650 }, cg);
      s('tspan', { x: tx, dy: 0 }, tt, c.chip[0]);
      s('tspan', { x: tx, dy: 16, fill: '#c4d1df', 'font-weight': 600 }, tt, c.chip[1]);
      G.dots = s('g', {}, g);
      G.dotEls = lanes.filter(function (l) { return l.on; }).map(function () { return s('circle', { r: stop > 1 ? 1.8 : 2.8, fill: '#e9fff2' }, G.dots); });
      if (RM) G.dots.setAttribute('opacity', 0);
      requestAnimationFrame(function () { g.setAttribute('opacity', 1); });
      anim.draw();
    }

    var lastArr = [];
    var anim = animate(root, function (t, dt) {
      if (!chip) return;
      var onL = lanes.filter(function (l) { return l.on; });
      lanes.forEach(function (l) {
        if (!l.wave) return;
        var ph = RM ? l.i * 0.5 : t * 0.9 + l.i * 0.5;
        l.wave.setAttribute('d', wavePath(WAVES[l.i], l.x0, l.x1, l.y, l.amp, ph, 3, 64));
      });
      if (!RM) {
        onL.forEach(function (l, i) {
          var sp = stop > 1 ? 0.42 : 0.5;
          var u = frac(t * sp + i * 0.137);
          var p = cubic(l.pts[0], l.pts[1], l.pts[2], l.pts[3], u);
          var el = G.dotEls[i];
          if (el) set(el, { cx: f1(p[0]), cy: f1(p[1]), opacity: u < 0.05 ? u * 20 : 1 });
          if (lastArr[i] != null && u < lastArr[i] && cells.length) {
            var cl = cells[(i * 7 + Math.floor(t * 13)) % cells.length]; cl.glow = 1;
          }
          lastArr[i] = u;
        });
        cells.forEach(function (cl) {
          if (cl.glow > 0.01) {
            cl.glow = Math.max(0, cl.glow - dt * 1.6);
            cl.el.setAttribute('fill', 'rgba(91,228,155,' + (0.25 + 0.6 * cl.glow).toFixed(2) + ')');
          } else if (cl.glow !== 0) {
            cl.glow = 0; cl.el.setAttribute('fill', cl.on ? '#1b4a36' : '#0e1b2e');
          }
        });
      }
    });
    new ResizeObserver(function () { build(); }).observe(stage);
    setStop(RM ? 1 : 0, true);
  }

  // fill the fixed words, then the three sections
  document.title = COPY.doc;
  document.querySelectorAll('[data-c]').forEach(function (e) {
    var v = get(e.getAttribute('data-c'));
    if (typeof v === 'string' && !e.querySelector('img')) e.textContent = v;
  });
  var fns = { fab: drawFab, recordings: drawRecordings, sensors: drawSensors };
  ['fab', 'recordings', 'sensors'].forEach(function (key, i) {
    var sec = document.querySelector('[data-k=' + key + ']');
    var vz = textCol(sec, key, '0' + (i + 1));
    fns[key](vz, COPY[key]);
  });
})();
</script>
