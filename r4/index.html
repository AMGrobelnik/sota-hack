<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
<title>ChipIn landing pages, round 4</title>
<style>
  :root { color-scheme: dark; --bar: 44px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed; font: 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #14171c; border-bottom: 1px solid #262b33; z-index: 2; }
  #bar button { width: 32px; height: 28px; border: 1px solid #333a45; border-radius: 6px; background: #1c2027; color: inherit; font-size: 16px; cursor: pointer; }
  #bar button:hover { background: #262b33; }
  #bar button:focus-visible, #bar a:focus-visible { outline: 2px solid #6aa9ff; outline-offset: 2px; }
  #label { min-width: 0; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #label b { font-weight: 600; margin-right: 8px; color: #9aa4b2; }
  #bar a { color: #8ab4ff; text-decoration: none; white-space: nowrap; }
  #bar a:hover { text-decoration: underline; }
  #stage { position: fixed; inset: var(--bar) 0 0 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #bar .logo { display: flex; align-items: center; }
  #bar .logo img { height: 22px; width: auto; display: block; }
  #bar .logo:hover { text-decoration: none; }
  #chips { display: flex; gap: 4px; }
  #chips button { width: auto; min-width: 28px; padding: 0 8px; font-size: 13px; }
  #chips button[aria-current="true"] { background: #2d4a7a; border-color: #6aa9ff; }
  #chips button:disabled { opacity: .4; cursor: not-allowed; }
  #chips button:disabled:hover { background: #1c2027; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #9aa4b2; }
</style>
</head>
<body>
<div id="bar">
  <a class="logo" href="./" aria-label="ChipIn"><img src="../assets/brand/chipin-lockup-light.svg" alt="ChipIn" height="22"></a>
  <button id="prev" aria-label="Previous variant" aria-keyshortcuts="ArrowLeft">&#8592;</button>
  <div id="chips"></div>
  <div id="label" aria-live="polite"></div>
  <button id="next" aria-label="Next variant" aria-keyshortcuts="ArrowRight">&#8594;</button>
  <a id="alone" target="_blank" rel="noopener">open alone</a>
  <a href="../">round 3</a>
  <a href="../dashboard/">dashboards</a>
</div>
<div id="stage"><iframe id="frame" title="Variant"></iframe><div id="empty">Nothing published yet: the round 4 pages are being built.</div></div>
<script>
(function () {
  var VARIANTS = [
    { key: "y1", name: "The full descent" },
    { key: "y2", name: "One room done right" },
    { key: "y3", name: "Queen Square" },
    { key: "y4", name: "Floor plan" },
    { key: "y5", name: "Four windows" }
  ];
  var TOP_LINKS = /^(\.\.\/dashboard\/|(\.\.\/waitlist\/)?join\.html)/;
  var frame = document.getElementById("frame");
  var label = document.getElementById("label");
  var alone = document.getElementById("alone");
  var chips = document.getElementById("chips");
  var idx = -1;
  var chipEls = [];

  function url(v) { return "../variants/" + v.key + ".html"; }
  function avail(i) { return VARIANTS[i].ok === true; }
  function nextAvail(from, step) {
    for (var k = 1; k <= VARIANTS.length; k++) {
      var i = ((from + step * k) % VARIANTS.length + VARIANTS.length) % VARIANTS.length;
      if (avail(i)) return i;
    }
    return -1;
  }
  function buildChips() {
    chips.innerHTML = "";
    chipEls = VARIANTS.map(function (v, i) {
      var c = document.createElement("button");
      c.type = "button";
      c.textContent = String(i + 1);
      c.title = v.ok === true ? v.name : v.name + " (being built)";
      c.disabled = v.ok !== true;
      c.addEventListener("click", function () { go(i); });
      chips.appendChild(c);
      return c;
    });
  }
  function render() {
    label.innerHTML = "";
    chipEls.forEach(function (c, i) { c.setAttribute("aria-current", i === idx ? "true" : "false"); });
    if (idx < 0) return;
    var v = VARIANTS[idx];
    var b = document.createElement("b");
    b.textContent = (idx + 1) + " / " + VARIANTS.length;
    label.appendChild(b);
    label.appendChild(document.createTextNode(v.name));
    var skipped = VARIANTS.filter(function (x) { return x.ok !== true; }).map(function (x) { return x.name; });
    if (skipped.length) {
      var s = document.createElement("span");
      s.style.cssText = "margin-left:12px;color:#6b7280";
      s.textContent = skipped.length + " being built";
      label.appendChild(s);
    }
    alone.href = url(v);
    document.title = (idx + 1) + " " + v.name + " - ChipIn round 4";
    if (frame.getAttribute("src") !== url(v)) frame.src = url(v);
  }
  function go(i) {
    if (i < 0 || i >= VARIANTS.length || !avail(i)) return;
    idx = i;
    var h = "#" + (idx + 1);
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
    render();
  }
  function step(d) {
    var i = nextAvail(idx < 0 ? (d > 0 ? -1 : 0) : idx, d);
    if (i >= 0) go(i);
  }
  function typing(el) {
    return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
  }
  function onKey(e) {
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey || typing(e.target)) return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (/^[1-9]$/.test(e.key) && +e.key <= VARIANTS.length && avail(+e.key - 1)) go(+e.key - 1);
    else return;
    e.preventDefault();
  }
  function hookFrame() {
    try {
      var doc = frame.contentDocument;
      if (!doc) return;
      doc.addEventListener("keydown", onKey);
      var links = doc.querySelectorAll("a[href]");
      for (var i = 0; i < links.length; i++) {
        if (TOP_LINKS.test(links[i].getAttribute("href") || "")) links[i].target = "_top";
      }
    } catch (err) { /* cross-origin: leave the variant alone */ }
  }
  function probe(v) {
    return fetch(url(v), { method: "HEAD", cache: "no-store" })
      .then(function (r) { v.ok = r.status === 200; })
      .catch(function () { v.ok = false; });
  }
  document.getElementById("prev").addEventListener("click", function () { step(-1); });
  document.getElementById("next").addEventListener("click", function () { step(1); });
  document.addEventListener("keydown", onKey);
  frame.addEventListener("load", hookFrame);
  window.addEventListener("hashchange", function () {
    var n = parseInt(location.hash.replace("#", ""), 10);
    if (n >= 1) go(n - 1);
  });
  buildChips();
  Promise.all(VARIANTS.map(probe)).then(function () {
    buildChips();
    var n = parseInt(location.hash.replace("#", ""), 10);
    var first = n >= 1 && avail(n - 1) ? n - 1 : nextAvail(-1, 1);
    if (first < 0) { document.getElementById("empty").style.display = "flex"; return; }
    go(first);
  });
})();
</script>
</body>
</html>
