# Published hardware baselines for tiny medical classifiers.
#
# A comparison only counts as a "beat" when task, dataset, protocol AND unit match (see comparable_if).
# Every number below was read from the primary source on 2026-11-21 (paper PDF table/text, the authors' own
# abstract page, or the journal's indexed abstract); `where` says where. Metric conventions:
#   accuracy-type metrics are fractions (0.949 = 94.9 %); gate_equivalents = NAND2-equivalent count;
#   luts_xc7 = AMD 7-series 6-input LUTs (Spartan-7, Artix-7, Zynq-7000 PL); luts_ice40 = iCE40 4-input LUTs.
# kind: measured_asic | post_layout_asic | synthesis_asic | fpga_measured | fpga_synthesis | simulated | mcu_measured
# Fields compare_hw_baseline reads: id, ref, task, dataset (string), protocol (string), metrics, units.

# ---------------------------------------------------------------- ECG: atrial fibrillation
- id: andersson2015
  ref: "Andersson, Chon, Sörnmo, Rodrigues. A 290 mV Sub-VT ASIC for Real-Time Atrial Fibrillation Detection. IEEE TBioCAS 9(3):377-386, 2015"
  source: "https://doi.org/10.1109/TBCAS.2014.2354054"
  task: af_vs_normal
  input: rr_intervals
  dataset: "MIT-BIH AF database (AFDB), all 25 records; also MIT-BIH Arrhythmia 100- and 200-series for specificity"
  protocol: "segment-level, segments of N=128 RR intervals; detector thresholds grid-searched on the same databases (no held-out split); Se/Sp per AF episode/segment as defined in the paper"
  metrics: {gate_equivalents: 24038, area_um2: 50000, power_nw: 333.9, power_nw_at_0v3: 8.1, sensitivity: 0.949, specificity: 0.958, clock_hz: 1000}
  units:
    gate_equivalents: "NAND2-eq after synthesis (gate mapping), core with shared multiplier, PrecSeg variant"
    area_um2: "um2 after synthesis, 65 nm low-leakage high-threshold CMOS"
    power_nw: "nW measured, core + memory, at 1.2 V nominal, 1 kHz clock"
    power_nw_at_0v3: "nW measured, core + memory, at 0.3 V, 1 kHz"
    sensitivity: fraction
    specificity: fraction
    clock_hz: Hz
  where: "Table III (Se/Sp, MIT-BIH AF, PrecSeg); Table IV (area, NAND2 eq.); Table V (measured power); Table II (N=128)"
  kind: measured_asic
  comparable_if:
    - "AF vs non-AF from RR intervals on AFDB"
    - "segment of ~128 RR intervals"
    - "gate count in NAND2-equivalents of the classifier core (theirs includes preprocessing and RAM-based storage)"
    - "accuracy reported as Se/Sp on the same records (theirs has no held-out split)"
  caveats:
    - "334 nW is at 1.2 V nominal; 8.1 nW at 0.3 V. Quote the supply with the number."
    - "Fabricated die area is 0.1 mm2 excluding pads (Fig. 9); 50,000 um2 is the synthesised core."
  verified: {by: web, date: "2026-11-21", note: "tables read from the paper PDF hosted by the UConn biosignal lab (author copy)"}

- id: einhaus2026_small
