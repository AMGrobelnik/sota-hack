  input: raw_ecg_125hz
  dataset: "MIT-BIH AF database, 16 of 25 records, channel 1, subsampled to 125 Hz, ~13,800 windows of ~42 s"
  protocol: "window-level; train/test split not stated (patient-wise not stated)"
  metrics: {luts_xc7: 536, dsp: 0, ff: 785, accuracy: 0.884, f1: 0.874, latency_us: 51}
  units: {luts_xc7: "AMD Spartan-7 S15 6-input LUTs, Vivado 2023.1", dsp: "DSP slices", ff: flip-flops, accuracy: fraction, f1: fraction, latency_us: us}
  where: "Table IV, row SMALL (ours); Section IV dataset description"
  kind: fpga_synthesis
