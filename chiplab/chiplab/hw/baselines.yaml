# Published hardware baselines. A comparison only counts as a "beat" when task, dataset, protocol AND unit match.
# Every entry: what was measured, on what, how, in which unit. Checked 21 Nov 2026 (see SPEC.md section 6).
- id: andersson2015
  ref: "Andersson et al., IEEE TBioCAS 2015 (AF detection ASIC from beat intervals)"
  task: af_vs_normal
  input: rr_intervals
  dataset: MIT-BIH AF database (AFDB)
  protocol: record-level, per paper
  metrics: {gate_equivalents: 24038, power_nw: 334, sensitivity: 0.949, specificity: 0.958}
  units: {gate_equivalents: "NAND2-eq (core)", power_nw: nW}
  kind: measured_asic
- id: einhaus2026_small
  ref: "Einhaus et al., arXiv 2605.29994 (FPGA AF detector, SMALL)"
  task: af_vs_normal
  input: raw_ecg_125hz
  dataset: MIT-BIH AF database, 16 of 25 records, channel 1
  protocol: split not stated
  metrics: {luts_xc7: 536, accuracy: 0.884}
  units: {luts_xc7: "AMD 6-input LUTs (Spartan-7)"}
  kind: fpga_synthesis
- id: einhaus2026_big
  ref: "Einhaus et al., arXiv 2605.29994 (FPGA AF detector, BIG)"
  task: af_vs_normal
  input: raw_ecg_125hz
  dataset: MIT-BIH AF database, 16 of 25 records, channel 1
  protocol: split not stated
  metrics: {luts_xc7: 2844, f1: 0.956, accuracy: 0.958, latency_us: 51}
  units: {luts_xc7: "AMD 6-input LUTs (Spartan-7)"}
  kind: fpga_synthesis
- id: loroch2025
  ref: "Loroch et al., arXiv 2508.13181 (wearable AF patch, iCE40UP5K)"
  task: af_vs_normal
  input: raw_ecg_120s
  dataset: own (30 probands), private
  protocol: 70/15/15, proband split not stated
  metrics: {power_mw_system: 3.81, sensitivity: 0.938, specificity: 0.981}
  units: {power_mw_system: "mW, whole platform measured"}
  kind: measured_system
- id: sparrowsnn_v2
  ref: "SparrowSNN v2 (arXiv 2406.06543)"
  task: ecg_heartbeat_classes
  input: raw_ecg
  dataset: MIT-BIH arrhythmia
  protocol: per paper
  metrics: {accuracy: 0.9861, energy_nj: 11.76}
  units: {energy_nj: "nJ per inference, 22 nm simulation"}
  kind: simulated_asic
- id: ekgnet
  ref: "EKGNet (fully analog)"
  task: ecg_heartbeat_classes
  input: raw_ecg
  dataset: MIT-BIH arrhythmia
  protocol: per paper
  metrics: {power_uw: 10.96, balanced_accuracy: 0.95}
  units: {power_uw: uW}
  kind: simulated_analog
- id: akbari2025_m4
  ref: "Akbari 2025, Cortex-M4 microcontroller model"
  task: af_vs_normal
  input: raw_ecg
  dataset: per paper
  protocol: per paper
  metrics: {energy_uj: 3532, latency_ms: 143}
  units: {energy_uj: "uJ per decision", latency_ms: ms}
  kind: measured_mcu
