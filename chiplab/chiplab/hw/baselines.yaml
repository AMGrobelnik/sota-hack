# ---------------------------------------------------------------- ECG: heartbeat classes
- id: mommen2026_lutn_classifier
  ref: "Mommen, Keuninckx, Patil, Detterer, Colpaert, Wambacq. Logic Gate Networks and Lookup Table Networks as Lightweight Hardware Classifiers for Inter-patient ECG Arrhythmia Classification. arXiv 2609.32854, 2026"
  source: "https://arxiv.org/abs/2609.32854"
  task: ecg_aami_4class
  input: beat_features_138bit
  dataset: "MIT-BIH Arrhythmia, paced records 102/104/107/217 removed, class Q ignored; R peaks from annotations"
  protocol: "inter-patient (de Chazal DS1 train / DS2 test, 22 records each); beat-level"
  metrics: {luts_xc7: 3223, ff: 267, dsp: 0, latency_cycles: 5, power_mw_dynamic: 0.092, energy_nj: 0.46, accuracy: 0.9404, jk: 0.651}
  units: {luts_xc7: "Zynq-7000 (xc7z020) 6-LUTs, LUTN classifier IP only (2000 6-LUTs + readout)", ff: flip-flops, dsp: "DSP slices", latency_cycles: "clock cycles", power_mw_dynamic: "mW, Vivado estimate (vectorless, 1 MHz)", energy_nj: "nJ per inference, classifier IP only (estimate)", accuracy: fraction, jk: "j-kappa index"}
  where: "abstract (0.46 nJ, 8.25 uJ system); Table of IP utilisation (LUTN Classifier IP 3223 LUTs, 267 FF, 5 cycles, 0.092 mW); 1-layer 6-LUTN hardware model accuracy"
  kind: fpga_synthesis
  comparable_if:
    - "4-class AAMI (N, S, V, F) on MIT-BIH with the de Chazal inter-patient split"
    - "classifier only, on precomputed 138-bit beat features (no peak detector)"
    - "LUTs in AMD 7-series 6-LUTs"
  caveats:
    - "0.46 nJ is the classifier part only; the whole ECG system uses 8.25 uJ per inference (preprocessing 17,064 LUTs, 2,811 FF, 53 DSP)."
    - "Depth and temperature appear to be chosen on the test set DS2 (no validation set mentioned)."
    - "Power numbers are Vivado vectorless estimates, not measurements."
  verified: {by: web, date: "2026-11-21", note: "abstract, utilisation table and Sections 3-5 read from the arXiv PDF; accuracy 94.04 / jk 0.651 per the team's checked notes"}

