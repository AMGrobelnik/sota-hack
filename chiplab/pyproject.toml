[project]
name = "chiplab"
version = "0.1.0"
description = "chipin.space chip lab: the toolbox an AI scientist calls to design, train, compile, verify, measure and package tiny chips for medical sensing devices"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.5",
    "wfdb>=4.1",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
sim = ["cocotb>=1.9"]

[project.scripts]
chiplab = "chiplab.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chiplab*"]

[tool.setuptools.package-data]
chiplab = ["referee/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs downloaded datasets", "slow: long-running", "docker: needs the LibreLane image"]
