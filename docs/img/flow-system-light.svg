<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1412" width="1760" height="1412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img"><title>How a ChipIn run flows</title><polyline points="905.0,164 905.0,214" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="905.0,228 898.0,212 912.0,212" fill="#59636e"/><polyline points="905.0,368 905.0,418" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="905.0,432 898.0,416 912.0,416" fill="#59636e"/><polyline points="905.0,572 905.0,622" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="905.0,636 898.0,620 912.0,620" fill="#59636e"/><polyline points="905.0,776 905.0,826" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="905.0,840 898.0,824 912.0,824" fill="#59636e"/><polyline points="1495.0,980 1495.0,1030" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="1495.0,1044 1488.0,1028 1502.0,1028" fill="#59636e"/><polyline points="1495.0,1184 1495.0,1234" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="1495.0,1248 1488.0,1232 1502.0,1232" fill="#59636e"/><polyline points="315.0,980 315.0,1030" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="315.0,1044 308.0,1028 322.0,1028" fill="#59636e"/><polyline points="1154,910.0 1246,910.0" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="1260,910.0 1244,917.0 1244,903.0" fill="#59636e"/><polygon points="1140,910.0 1156,903.0 1156,917.0" fill="#59636e"/><polyline points="670,910.0 564,910.0" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="550,910.0 566,903.0 566,917.0" fill="#59636e"/><polyline points="315.0,1198 315.0,1234" fill="none" stroke="#59636e" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="315.0,1248 308.0,1232 322.0,1232" fill="#59636e"/><polygon points="315.0,1184 322.0,1200 308.0,1200" fill="#59636e"/><polyline points="80,1114.0 30,1114.0 30,706.0 656,706.0" fill="none" stroke="#0969da" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="670,706.0 654,713.0 654,699.0" fill="#0969da"/><text x="610.0" y="886.0" font-size="26" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-label="1">events</text><text x="54" y="680.0" font-size="26" font-weight="400" fill="#0969da" text-anchor="start" dominant-baseline="central" data-label="1">your messages steer the run</text><rect x="670" y="24" width="470" height="140" rx="10" fill="#eef5ff" stroke="#0969da" stroke-width="2.5"/><text x="905.0" y="77.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="brief">Brief</text><text x="905.0" y="111.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="brief">typed or spoken</text><rect x="670" y="228" width="470" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="905.0" y="264.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="intake">Guided questions</text><text x="905.0" y="298.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="intake">5 fixed steps, then up to 3</text><text x="905.0" y="332.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="intake">follow-ups from a small model</text><rect x="670" y="432" width="470" height="140" rx="10" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/><text x="905.0" y="485.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="spec">Spec card</text><text x="905.0" y="519.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="spec">targets, sensors, data</text><rect x="670" y="636" width="470" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="905.0" y="672.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="orch">Orchestrator agent</text><text x="905.0" y="706.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="orch">on the model picked</text><text x="905.0" y="740.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="orch">for the run</text><rect x="670" y="840" width="470" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="905.0" y="893.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="stages">Seven stages</text><text x="905.0" y="927.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="stages">subagent batches on five</text><rect x="1260" y="840" width="470" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="1495.0" y="893.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="lab">Chip lab</text><text x="1495.0" y="927.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="lab">command-line tools</text><rect x="1260" y="1044" width="470" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="1495.0" y="1097.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="verify">Verification</text><text x="1495.0" y="1131.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="verify">simulation and proof</text><rect x="1260" y="1248" width="470" height="140" rx="10" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/><text x="1495.0" y="1318.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="report">Report and chosen chip</text><rect x="80" y="840" width="470" height="140" rx="10" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/><text x="315.0" y="893.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="backend">Backend</text><text x="315.0" y="927.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="backend">run folder and event log</text><rect x="80" y="1044" width="470" height="140" rx="10" fill="#eef5ff" stroke="#0969da" stroke-width="2.5"/><text x="315.0" y="1080.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="dash">Dashboard</text><text x="315.0" y="1114.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="dash">live view, playback,</text><text x="315.0" y="1148.0" font-size="26" fill="#59636e" text-anchor="middle" dominant-baseline="central" data-box="dash">summaries</text><rect x="80" y="1248" width="470" height="140" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="315.0" y="1318.0" font-size="28" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central" data-box="helper">Chippy, the helper</text><rect x="1300" y="34" width="44" height="30" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/><text x="1360" y="49" font-size="26" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central" data-label="1">agent or tool step</text><rect x="1300" y="80" width="44" height="30" rx="6" fill="#f2f4f7" stroke="#8c959f" stroke-width="2"/><text x="1360" y="95" font-size="26" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central" data-label="1">artefact or record</text><rect x="1300" y="126" width="44" height="30" rx="6" fill="#eef5ff" stroke="#0969da" stroke-width="2"/><text x="1360" y="141" font-size="26" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central" data-label="1">where you take part</text></svg>
