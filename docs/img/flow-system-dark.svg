<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1412" width="1760" height="1412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img"><title>How a ChipIn run flows</title><polyline points="885.0,164 885.0,214" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="885.0,228 878.0,212 892.0,212" fill="#9198a1"/><polyline points="885.0,368 885.0,418" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="885.0,432 878.0,416 892.0,416" fill="#9198a1"/><polyline points="885.0,572 885.0,622" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="885.0,636 878.0,620 892.0,620" fill="#9198a1"/><polyline points="885.0,776 885.0,826" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="885.0,840 878.0,824 892.0,824" fill="#9198a1"/><polyline points="1475.0,980 1475.0,1030" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="1475.0,1044 1468.0,1028 1482.0,1028" fill="#9198a1"/><polyline points="1475.0,1184 1475.0,1234" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="1475.0,1248 1468.0,1232 1482.0,1232" fill="#9198a1"/><polyline points="295.0,980 295.0,1030" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="295.0,1044 288.0,1028 302.0,1028" fill="#9198a1"/><polyline points="1134,910.0 1226,910.0" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="1240,910.0 1224,917.0 1224,903.0" fill="#9198a1"/><polygon points="1120,910.0 1136,903.0 1136,917.0" fill="#9198a1"/><polyline points="650,910.0 544,910.0" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="530,910.0 546,903.0 546,917.0" fill="#9198a1"/><polyline points="295.0,1198 295.0,1234" fill="none" stroke="#9198a1" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="295.0,1248 288.0,1232 302.0,1232" fill="#9198a1"/><polygon points="295.0,1184 302.0,1200 288.0,1200" fill="#9198a1"/><polyline points="60,1114.0 24,1114.0 24,706.0 636,706.0" fill="none" stroke="#4493f8" stroke-width="2.5" stroke-linejoin="miter"/><polygon points="650,706.0 634,713.0 634,699.0" fill="#4493f8"/><text x="590.0" y="886.0" font-size="26" font-weight="400" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-label="1">events</text><text x="44" y="808.0" font-size="26" font-weight="400" fill="#4493f8" text-anchor="start" dominant-baseline="central" data-label="1">your messages steer the run</text><rect x="650" y="24" width="470" height="140" rx="10" fill="#0f1d33" stroke="#4493f8" stroke-width="2.5"/><text x="885.0" y="77.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="brief">Brief</text><text x="885.0" y="111.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="brief">typed or spoken</text><rect x="650" y="228" width="470" height="140" rx="10" fill="#0d1117" stroke="#656c76" stroke-width="2"/><text x="885.0" y="264.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="intake">Guided questions</text><text x="885.0" y="298.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="intake">5 fixed steps, then up to 3</text><text x="885.0" y="332.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="intake">follow-ups from a small model</text><rect x="650" y="432" width="470" height="140" rx="10" fill="#1b212a" stroke="#656c76" stroke-width="2"/><text x="885.0" y="485.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="spec">Spec card</text><text x="885.0" y="519.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="spec">targets, sensors, data</text><rect x="650" y="636" width="470" height="140" rx="10" fill="#0d1117" stroke="#656c76" stroke-width="2"/><text x="885.0" y="672.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="orch">Orchestrator agent</text><text x="885.0" y="706.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="orch">on the model picked</text><text x="885.0" y="740.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="orch">for the run</text><rect x="650" y="840" width="470" height="140" rx="10" fill="#0d1117" stroke="#656c76" stroke-width="2"/><text x="885.0" y="893.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="stages">Seven stages</text><text x="885.0" y="927.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="stages">subagent batches on five</text><rect x="1240" y="840" width="470" height="140" rx="10" fill="#0d1117" stroke="#656c76" stroke-width="2"/><text x="1475.0" y="893.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="lab">Chip lab</text><text x="1475.0" y="927.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="lab">command-line tools</text><rect x="1240" y="1044" width="470" height="140" rx="10" fill="#0d1117" stroke="#656c76" stroke-width="2"/><text x="1475.0" y="1097.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="verify">Verification</text><text x="1475.0" y="1131.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="verify">simulation and proof</text><rect x="1240" y="1248" width="470" height="140" rx="10" fill="#1b212a" stroke="#656c76" stroke-width="2"/><text x="1475.0" y="1318.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="report">Report and chosen chip</text><rect x="60" y="840" width="470" height="140" rx="10" fill="#1b212a" stroke="#656c76" stroke-width="2"/><text x="295.0" y="893.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="backend">Backend</text><text x="295.0" y="927.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="backend">run folder and event log</text><rect x="60" y="1044" width="470" height="140" rx="10" fill="#0f1d33" stroke="#4493f8" stroke-width="2.5"/><text x="295.0" y="1080.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="dash">Dashboard</text><text x="295.0" y="1114.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="dash">live view, playback,</text><text x="295.0" y="1148.0" font-size="26" fill="#9198a1" text-anchor="middle" dominant-baseline="central" data-box="dash">summaries</text><rect x="60" y="1248" width="470" height="140" rx="10" fill="#0d1117" stroke="#656c76" stroke-width="2"/><text x="295.0" y="1318.0" font-size="28" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central" data-box="helper">Chippy, the helper</text></svg>
